name: security

on:
  push:
    branches: [main]
    paths: &paths
      - "apps/casa/**"
      - "platform/casa/**"
      - "clusters/casa/argocd/**"
      - "infra/casa/terraform/**"
      - ".forgejo/workflows/020-trivy.yml"
  pull_request:
    paths: *paths
  workflow_dispatch:

jobs:
  trivy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      # Бинарь берём с зеркала RustFS, как остальные гейты: setup-trivy клонирует
      # исходник с github.com, а прямой curl к релизу висел тут до таймаута джобы.
      # sha256 читаем из artifacts.tsv; --max-time не даёт зависнуть.
      - name: Cache trivy
        id: cache
        uses: actions/cache@v6
        with:
          path: ~/.local/trivy
          key: trivy-0.75.0-mirror-${{ runner.os }}
      - name: Install trivy
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          ver="0.75.0"
          file="trivy_${ver}_Linux-64bit.tar.gz"
          asset="trivy/${ver}/${file}"
          url="http://rustfs.rustfs.svc.cluster.local/mirror/$asset"
          expected="$(awk -v p="$asset" '$1==p{print $2}' apps/casa/rustfs/manifests/artifacts.tsv)"
          mkdir -p "$HOME/.local/trivy" /tmp/trivy
          curl -fsSL --max-time 60 --retry 5 --retry-delay 5 -o "/tmp/trivy/$file" "$url"
          echo "$expected  /tmp/trivy/$file" | sha256sum -c -
          tar -xzf "/tmp/trivy/$file" -C /tmp/trivy trivy
          install -m 0755 "/tmp/trivy/trivy" "$HOME/.local/trivy/trivy"
      # Report-only: exit-code 0, job на находках не падает — сначала смотрим
      # набор, гейт включается отдельным PR (issue #1072).
      # TRIVY_SKIP_CHECK_UPDATE берёт встроенный набор политик, без похода за
      # бандлом проверок в ghcr.io.
      - name: Report Terraform
        env:
          TRIVY_SKIP_CHECK_UPDATE: "true"
        run: |
          set -euo pipefail
          trivy="$HOME/.local/trivy/trivy"
          "$trivy" --version
          "$trivy" config \
            --cache-dir "${{ github.workspace }}/.cache/trivy" \
            --severity HIGH,CRITICAL \
            --exit-code 0 \
            --quiet \
            infra/casa/terraform
      # `trivy config` принимает один DIR, поэтому каталоги перебираются
      # циклом: лишний позиционный аргумент молча игнорируется, и часть дерева
      # выпала бы из скана, оставшись зелёной.
      - name: Report manifests
        env:
          TRIVY_SKIP_CHECK_UPDATE: "true"
        run: |
          set -euo pipefail
          for dir in apps/casa platform/casa clusters/casa/argocd; do
            "$HOME/.local/trivy/trivy" config \
              --cache-dir "${{ github.workspace }}/.cache/trivy" \
              --severity HIGH,CRITICAL \
              --exit-code 0 \
              --quiet \
              "$dir"
          done

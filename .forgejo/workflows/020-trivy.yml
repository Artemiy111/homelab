name: security

on:
  push:
    branches: [main]
    paths: &paths
      - "clusters/casa/**"
      - "infra/terraform/**"
      - ".forgejo/workflows/020-trivy.yml"
  pull_request:
    paths: *paths
  workflow_dispatch:

jobs:
  trivy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      # Бинарь ставим сами и зовём напрямую: setup-trivy клонирует исходник
      # aquasecurity/trivy, а git-клон с раннера с github.com упирается в SSL
      # timeout. Кэш держит бинарь между прогонами, sha256 сверяем.
      - name: Cache trivy
        id: cache
        uses: actions/cache@v6
        with:
          path: ~/.local/trivy
          key: trivy-0.75.0-${{ runner.os }}
      - name: Install trivy
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          ver="0.75.0"
          asset="trivy_${ver}_Linux-64bit.tar.gz"
          expected="c6e65abddb348e25f10549df887045629cf28cc72453cd1c63acb717316b3f3f"
          url="https://github.com/aquasecurity/trivy/releases/download/v${ver}/${asset}"
          mkdir -p "$HOME/.local/trivy" /tmp/trivy
          curl -fsSL --retry 5 --retry-delay 5 -o "/tmp/trivy/${asset}" "$url"
          echo "$expected  /tmp/trivy/${asset}" | sha256sum -c -
          tar -xzf "/tmp/trivy/${asset}" -C /tmp/trivy trivy
          install -m 0755 "/tmp/trivy/trivy" "$HOME/.local/trivy/trivy"
      # Report-only: exit-code 0, job на находках не падает — сначала смотрим
      # набор, гейт включается отдельным PR (issue #1072).
      # TRIVY_SKIP_CHECK_UPDATE берёт встроенный набор политик, без похода за
      # бандлом проверок в ghcr.io.
      - name: Report Terraform
        env:
          TRIVY_SKIP_CHECK_UPDATE: "true"
        run: |
          set -euo pipefail
          trivy="$HOME/.local/trivy/trivy"
          "$trivy" --version
          "$trivy" config \
            --cache-dir "${{ github.workspace }}/.cache/trivy" \
            --severity HIGH,CRITICAL \
            --exit-code 0 \
            --quiet \
            infra/terraform
      - name: Report manifests
        env:
          TRIVY_SKIP_CHECK_UPDATE: "true"
        run: |
          set -euo pipefail
          "$HOME/.local/trivy/trivy" config \
            --cache-dir "${{ github.workspace }}/.cache/trivy" \
            --severity HIGH,CRITICAL \
            --exit-code 0 \
            --quiet \
            clusters/casa

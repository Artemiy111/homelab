name: manifests

on:
  push:
    branches: [main]
    paths: &paths
      - "apps/casa/**"
      - "platform/casa/**"
      - "clusters/casa/argocd/**"
      - "scripts/kubeconform.sh"
      - ".forgejo/workflows/030-kubeconform.yml"
  pull_request:
    paths: *paths

# Скрипт проверки лежит среди путей: правка набора путей или схем без запуска
# гейта оставила бы main с непроверенными манифестами ровно настолько же,
# насколько сейчас непроверенным был фикс lute (#788, #789).

jobs:
  kubeconform:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      # Ревизия datreeio/CRDs-catalog. Объявлена на уровне job, а не в шаге
      # Validate manifests: значение нужно и ключу кэша, и команде.
      CRD_SCHEMAS_REV: fd90051867733c60d32d16450556e9cd18459aef
    steps:
      - uses: actions/checkout@v7
      - name: Cache kubeconform
        id: kubeconform
        uses: actions/cache@v6
        with:
          path: ~/.local/bin
          key: kubeconform-0.8.0-mirror-${{ runner.os }}
      - name: Cache schemas
        id: schemas
        uses: actions/cache@v6
        with:
          path: ~/.cache/kubeconform-schemas
          key: kubeconform-schemas-1.36.3-mirror-${{ runner.os }}
      - name: Cache kubeconform HTTP responses
        uses: actions/cache@v6
        with:
          path: ~/.cache/kubeconform-http
          key: kubeconform-cr-schemas-${{ env.CRD_SCHEMAS_REV }}-${{ runner.os }}
      # Набор CR лежит в зеркале целиком (#910): раньше он тянулся с GitHub по
      # HTTPS, а раннер туда не ходит, и гейт падал на каждом холодном кэше.
      #
      # Проверка ниже ищет любой файл через find -quit, а не глобом в test -f:
      # каталог каталога CRD-схем разворачивается в 4056 файлов, и
      # `test -f dir/*/*.json` передаёт их все аргументами — test принимает
      # не больше трёх и падает с «too many arguments». Шаг не под кэшем и
      # выполняется на каждом прогоне, так что ошибка была не про холодный кэш,
      # а про проверку: джоба падала до шага валидации.
      - name: Install CR schemas
        run: |
          set -euo pipefail
          # Шаг необязательный. Зеркало наполняет CronJob раз в сутки, поэтому
          # смена CRD_SCHEMAS_REV опережает его на сутки: падать здесь нельзя,
          # иначе красное означало бы «подожди», а не «сломано». Пока объекта
          # нет, scripts/kubeconform.sh берёт схемы по HTTP-фолбэку.
          url="http://rustfs.rustfs.svc.cluster.local/mirror/kubeconform-cr-schemas/${CRD_SCHEMAS_REV}/crds-catalog_${CRD_SCHEMAS_REV}.tar.gz"
          if ! curl -fsSL --max-time 60 -o /tmp/crds.tar.gz "$url"; then
            echo "схемы CR в зеркале ещё нет, используется HTTP-фолбэк"
            exit 0
          fi
          mkdir -p "$HOME/.cache/kubeconform-schemas/crds"
          tar -xzf /tmp/crds.tar.gz -C "$HOME/.cache/kubeconform-schemas/crds"
          find "$HOME/.cache/kubeconform-schemas/crds" -name '*.json' -print -quit \
            | grep -q .
          echo "схемы CR взяты из зеркала"
      # Бинарь и набор схем Kubernetes берём из зеркала RustFS (issue #149).
      # У скачанного бинаря сверяем sha256 с apps/casa/rustfs/manifests/artifacts.tsv; схемы
      # собираются в зеркало воспроизводимо, поэтому хэш в манифесте не пинится.
      # Зеркало наполняет CronJob mirror-sync (apps/casa/rustfs).
      #
      # Схемы Kubernetes нужны локальными ради привязки к версии: kubeconform
      # подставляет {{.NormalizedKubernetesVersion}} из -kubernetes-version, то
      # есть проверяет манифесты по API 1.36.3, а не по master. Ставятся оба
      # набора, standalone и standalone-strict: скрипт зовёт kubeconform со
      # -strict, и имя каталога схемы меняется на standalone-strict, поэтому
      # одного нестрогого набора недостаточно — при отсутствии строгого
      # kubeconform не откатывается на нестрогий, а падает с «could not find
      # schema». Схемы CR выведены из CRD конкретной версии оператора (#791).
      - name: Install kubeconform
        if: steps.kubeconform.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          asset="kubeconform/0.8.0/kubeconform_0.8.0_linux_amd64.tar.gz"
          url="http://rustfs.rustfs.svc.cluster.local/mirror/$asset"
          expected="$(awk -v p="$asset" '$1==p{print $2}' apps/casa/rustfs/manifests/artifacts.tsv)"
          mkdir -p "$HOME/.local/bin" /tmp/kubeconform
          curl -fsSL -o /tmp/kubeconform/kubeconform.tar.gz "$url"
          echo "$expected  /tmp/kubeconform/kubeconform.tar.gz" | sha256sum -c -
          tar -xzf /tmp/kubeconform/kubeconform.tar.gz -C /tmp/kubeconform kubeconform
          install -m 0755 /tmp/kubeconform/kubeconform "$HOME/.local/bin/kubeconform"
      - name: Install schemas
        if: steps.schemas.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          base="http://rustfs.rustfs.svc.cluster.local/mirror/kubeconform-schemas/1.36.3"
          mkdir -p "$HOME/.cache/kubeconform-schemas"
          for set in standalone standalone-strict; do
            curl -fsSL -o "/tmp/schemas-$set.tar.gz" \
              "$base/kubernetes-json-schema_1.36.3_$set.tar.gz"
            tar -xzf "/tmp/schemas-$set.tar.gz" -C "$HOME/.cache/kubeconform-schemas"
          done
          test -f "$HOME/.cache/kubeconform-schemas/v1.36.3-standalone-strict/configmap.json"
      - name: Add kubeconform to PATH
        run: echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      # Второй -schema-location — схемы CR из datreeio/CRDs-catalog: они не в
      #ходят в набор схем Kubernetes, а без них 40% ресурсов (все CR операторов)
      #не проверялись бы. Ревизия каталога зафиксирована коммитом и передаётся
      # скрипту через CRD_SCHEMAS_REV — она же ключ кэша выше.
      #
      # Набор путей, схем, фильтров и -strict живёт в scripts/kubeconform.sh:
      # тот же скрипт вызывают .githooks/pre-commit и scripts/check.sh, и
      # расхождение трёх прогонов хуже, чем отсутствие проверки. Здесь только
      # ставим бинарь и раскладываем схемы Kubernetes из зеркала.
      - name: Validate manifests
        run: |
          set -euo pipefail
          kubeconform -v
          ./scripts/kubeconform.sh

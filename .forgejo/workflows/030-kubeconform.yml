name: manifests

on:
  push:
    branches: [main]
    paths: &paths
      - "apps/casa/**"
      - "platform/casa/**"
      - "clusters/casa/argocd/**"
      - "scripts/kubeconform.sh"
      - ".forgejo/workflows/030-kubeconform.yml"
  pull_request:
    paths: *paths

# Скрипт проверки лежит среди путей: правка набора путей или схем без запуска
# гейта оставила бы main с непроверенными манифестами.

jobs:
  kubeconform:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      # Ревизия datreeio/CRDs-catalog. Объявлена на уровне job, а не в шаге
      # Validate manifests: значение нужно и пути объекта в зеркале тоже.
      CRD_SCHEMAS_REV: fd90051867733c60d32d16450556e9cd18459aef
      # Схемы берутся только из локальных наборов. Внешний DNS ноды
      # периодически отвечает отказом (docs/incidents/0011), поэтому гейт не
      # должен зависеть от raw.githubusercontent.com (#1185).
      KUBECONFORM_OFFLINE: "1"
    steps:
      - uses: actions/checkout@v7
      - name: Cache kubeconform
        id: kubeconform
        uses: actions/cache@v6
        with:
          path: ~/.local/bin
          key: kubeconform-0.8.0-mirror-${{ runner.os }}
      - name: Cache schemas
        id: schemas
        uses: actions/cache@v6
        with:
          path: ~/.cache/kubeconform-schemas
          key: kubeconform-schemas-1.36.3-mirror-${{ runner.os }}
      # Набор CR — весь каталог одной ревизии, объект в зеркале RustFS. Файлы
      # считаются по списку архива до распаковки: проверка «есть хотя бы один
      # json» пропускает обрезанный архив, а неполный набор даёт красный гейт,
      # причину которого видно только по именам отсутствующих схем.
      #
      # Объект обязан существовать: ревизию публикует зеркало, и порядок
      # «сначала опубликовать, потом пинить» описан в apps/casa/rustfs/RUNBOOK.md.
      - name: Install CR schemas
        run: |
          set -euo pipefail
          url="http://rustfs.rustfs.svc.cluster.local/mirror/kubeconform-cr-schemas/${CRD_SCHEMAS_REV}/crds-catalog_${CRD_SCHEMAS_REV}.tar.gz"
          curl -fsSL --max-time 60 -o /tmp/crds.tar.gz "$url"
          count="$(tar -tzf /tmp/crds.tar.gz | grep -c '\.json$' || true)"
          if [ "$count" -lt 4000 ]; then
            echo "в архиве CR-схем $count json, ожидалось не меньше 4000" >&2
            exit 1
          fi
          mkdir -p "$HOME/.cache/kubeconform-schemas/crds"
          tar -xzf /tmp/crds.tar.gz -C "$HOME/.cache/kubeconform-schemas/crds"
          echo "схемы CR из зеркала: $count json"
      # Бинарь и наборы схем Kubernetes берём из зеркала RustFS (issue #149).
      # У скачанного бинаря сверяем sha256 с apps/casa/rustfs/manifests/artifacts.tsv;
      # схемы собираются в зеркало воспроизводимо, поэтому хэш не пинится.
      #
      # Схемы Kubernetes нужны локальными ради привязки к версии: kubeconform
      # подставляет {{.NormalizedKubernetesVersion}} из -kubernetes-version, то
      # есть проверяет манифесты по API 1.36.3, а не по master. Ставятся оба
      # набора, standalone и standalone-strict: скрипт зовёт kubeconform со
      # -strict, и в пути схемы появляется суффикс -standalone-strict, поэтому
      # одного нестрогого набора недостаточно — на строгий kubeconform не
      # откатывается и падает с «could not find schema».
      - name: Install kubeconform
        if: steps.kubeconform.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          asset="kubeconform/0.8.0/kubeconform_0.8.0_linux_amd64.tar.gz"
          url="http://rustfs.rustfs.svc.cluster.local/mirror/$asset"
          expected="$(awk -v p="$asset" '$1==p{print $2}' apps/casa/rustfs/manifests/artifacts.tsv)"
          mkdir -p "$HOME/.local/bin" /tmp/kubeconform
          curl -fsSL -o /tmp/kubeconform/kubeconform.tar.gz "$url"
          echo "$expected  /tmp/kubeconform/kubeconform.tar.gz" | sha256sum -c -
          tar -xzf /tmp/kubeconform/kubeconform.tar.gz -C /tmp/kubeconform kubeconform
          install -m 0755 /tmp/kubeconform/kubeconform "$HOME/.local/bin/kubeconform"
      - name: Install schemas
        if: steps.schemas.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          base="http://rustfs.rustfs.svc.cluster.local/mirror/kubeconform-schemas/1.36.3"
          mkdir -p "$HOME/.cache/kubeconform-schemas"
          for set in standalone standalone-strict; do
            archive="/tmp/schemas-$set.tar.gz"
            curl -fsSL -o "$archive" "$base/kubernetes-json-schema_1.36.3_$set.tar.gz"
            count="$(tar -tzf "$archive" | grep -c '\.json$' || true)"
            if [ "$count" -lt 1300 ]; then
              echo "в наборе $set $count json, ожидалось не меньше 1300" >&2
              exit 1
            fi
            tar -xzf "$archive" -C "$HOME/.cache/kubeconform-schemas"
          done
      - name: Add kubeconform to PATH
        run: echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      # Набор путей, схем, фильтров и -strict живёт в scripts/kubeconform.sh:
      # тот же скрипт вызывают .githooks/pre-commit и scripts/check.sh, и
      # расхождение трёх прогонов хуже, чем отсутствие проверки. Здесь только
      # ставим бинарь и раскладываем схемы из зеркала.
      - name: Validate manifests
        run: |
          set -euo pipefail
          kubeconform -v
          ./scripts/kubeconform.sh

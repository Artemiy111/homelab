name: meta

on:
  push:
    branches: [main]
  pull_request:

# Как и в 080-secrets.yml: Forgejo по умолчанию отменяет предыдущий прогон того же
# workflow на push и pull_request (synchronize) — «any other invocations of the
# same workflow will be canceled automatically»
# (forgejo.org/docs/latest/user/actions/reference/#concurrency). На push в main
# проверка должна отрабатывать всегда, а не отменяться следующим пушем: без
# `group` значение `cancel-in-progress: false` снимает управление
# конкурентностью (там же, #concurrencycancel-in-progress).
concurrency:
  cancel-in-progress: false

jobs:
  commitlint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      # Порядок важен: кэш проверяется первым, потому что от его результата
      # зависят два следующих шага. При попадании в кэш bun не скачивается и не
      # запускается вовсе: commitlint — обычный node-скрипт, а node в job-образе
      # есть (24.19 против требуемых >=22.12). Bun остаётся установщиком и нужен
      # только на холодном пути.
      - name: Cache dependencies
        id: dependencies
        uses: actions/cache@v6
        with:
          path: node_modules
          key: node-modules-${{ runner.os }}-${{ hashFiles('bun.lock') }}
      # setup-bun берётся из зеркала RustFS, как и бинарники остальных гейтов
      # (issue #149): внешние репозитории бывают недоступны, а ATS в кластере
      # не развёрнут, и job падал на загрузке bun до установки чего-либо.
      # Bинарь качаем через кэш ATS (apps/casa/ats): GitHub отдаёт release-ассет 302
      # на подписанный CDN-URL, а HTTP-клиент внутри setup-bun по нему не идёт и
      # уходит в таймаут. ATS же разворачивает редирект сам и кэширует файл.
      # registries пишет bunfig.toml, поэтому `bun install` идёт через локальный
      # кэш Verdaccio (apps/casa/verdaccio).
      - name: Setup bun
        if: steps.dependencies.outputs.cache-hit != 'true'
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0
          bun-download-url: http://rustfs.rustfs.svc.cluster.local/mirror/bun/1.4.0/bun-linux-x64.zip
          registries: http://verdaccio.verdaccio.svc.cluster.local/
      - name: Install dependencies
        if: steps.dependencies.outputs.cache-hit != 'true'
        run: bun install --frozen-lockfile
      - name: Print versions
        run: |
          git --version
          node --version
          ./node_modules/.bin/commitlint --version
      - name: Validate last commit
        if: github.event_name == 'push'
        run: ./node_modules/.bin/commitlint --last --verbose
      - name: Validate pull request commits
        if: github.event_name == 'pull_request'
        run: ./node_modules/.bin/commitlint --from ${{ github.event.pull_request.base.sha }} --to ${{ github.event.pull_request.head.sha }} --verbose
      # Заголовок PR не проверяется диапазоном коммитов, но при squash-merge именно
      # он (плюс дописываемый Forgejo ` (#<n>)`) становится сообщением коммита в
      # main. Линтим ровно эту строку, чтобы падение было до merge.
      - name: Validate pull request title
        if: github.event_name == 'pull_request'
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: printf '%s' "$PR_TITLE (#$PR_NUMBER)" | ./node_modules/.bin/commitlint --verbose

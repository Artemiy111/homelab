name: alerts

on:
  push:
    branches: [main]
    paths: &paths
      - "clusters/casa/apps/grafana/**"
      - "clusters/casa/**/RUNBOOK.md"
      - "scripts/**"
      - ".forgejo/workflows/090-alerts.yml"
  pull_request:
    paths: *paths

jobs:
  docs:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - name: Check alert rules registry
        run: ./scripts/alert-rules-docs.sh --check

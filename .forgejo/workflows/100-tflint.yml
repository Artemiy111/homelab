name: lint

on:
  push:
    branches: [main]
    paths: &paths
      - "infra/casa/terraform/**"
      - "infra/global/terraform/**"
      - "infra/yc/terraform/**"
      - ".tflint.hcl"
      - "scripts/terraform-validate.sh"
      - ".forgejo/workflows/100-tflint.yml"
  pull_request:
    paths: *paths
  workflow_dispatch:

jobs:
  tflint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: Cache tflint
        id: cache
        uses: actions/cache@v6
        with:
          path: ~/.local/bin
          key: tflint-0.64.0-mirror-${{ runner.os }}
      - name: Install tflint
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          asset="tflint/0.64.0/tflint_linux_amd64.zip"
          url="http://rustfs.rustfs.svc.cluster.local/mirror/$asset"
          expected="$(awk -v p="$asset" '$1==p{print $2}' apps/casa/rustfs/manifests/artifacts.tsv)"
          mkdir -p "$HOME/.local/bin"
          curl -fsSL -o /tmp/tflint.zip "$url"
          echo "$expected  /tmp/tflint.zip" | sha256sum -c -
          unzip -oq /tmp/tflint.zip -d /tmp
          install -m 0755 /tmp/tflint "$HOME/.local/bin/tflint"
      - name: Add tflint to PATH
        run: echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Lint Terraform
        run: |
          set -euo pipefail
          tflint --version
          for dir in infra/casa/terraform infra/global/terraform infra/yc/terraform; do
            tflint --recursive --no-color \
              --chdir="$dir" \
              --config="$(pwd)/.tflint.hcl"
          done
  terraform-fmt:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: Cache terraform
        id: cache
        uses: actions/cache@v6
        with:
          path: ~/.local/bin
          key: terraform-1.16.4-mirror-${{ runner.os }}
      - name: Install terraform
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          asset="terraform/1.16.4/terraform_1.16.4_linux_amd64.zip"
          url="http://rustfs.rustfs.svc.cluster.local/mirror/$asset"
          expected="$(awk -v p="$asset" '$1==p{print $2}' apps/casa/rustfs/manifests/artifacts.tsv)"
          mkdir -p "$HOME/.local/bin"
          curl -fsSL -o /tmp/terraform.zip "$url"
          echo "$expected  /tmp/terraform.zip" | sha256sum -c -
          unzip -oq /tmp/terraform.zip -d /tmp
          install -m 0755 /tmp/terraform "$HOME/.local/bin/terraform"
      - name: Add terraform to PATH
        run: echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Check Terraform formatting
        run: |
          set -euo pipefail
          terraform version
          terraform fmt -check -diff -no-color -recursive infra/casa/terraform infra/global/terraform infra/yc/terraform
  terraform-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - name: Cache terraform
        id: cache
        uses: actions/cache@v6
        with:
          path: ~/.local/bin
          key: terraform-1.16.4-mirror-${{ runner.os }}
      - name: Install terraform
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          asset="terraform/1.16.4/terraform_1.16.4_linux_amd64.zip"
          url="http://rustfs.rustfs.svc.cluster.local/mirror/$asset"
          expected="$(awk -v p="$asset" '$1==p{print $2}' apps/casa/rustfs/manifests/artifacts.tsv)"
          mkdir -p "$HOME/.local/bin"
          curl -fsSL -o /tmp/terraform.zip "$url"
          echo "$expected  /tmp/terraform.zip" | sha256sum -c -
          unzip -oq /tmp/terraform.zip -d /tmp
          install -m 0755 /tmp/terraform "$HOME/.local/bin/terraform"
      - name: Add terraform to PATH
        run: echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      # Провайдеры берутся из зеркала, а не из реестра: с раннера нет выхода в
      # интернет, и реестр Terraform к тому же режет запросы по геолокации.
      - name: Validate Terraform
        env:
          PROVIDER_MIRROR_URL: http://rustfs.rustfs.svc.cluster.local/mirror
        run: ./scripts/terraform-validate.sh

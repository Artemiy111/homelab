name: actionlint

on:
  push:
    branches: [main]
    paths: &paths
      - ".forgejo/workflows/**"
      - ".forgejo/actionlint.yaml"
  pull_request:
    paths: *paths

jobs:
  actionlint:
    name: actionlint
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - name: Cache actionlint
        id: cache
        uses: actions/cache@v4
        with:
          path: ~/.local/bin
          key: actionlint-1.7.12-mirror-${{ runner.os }}
      # Бинарь берём из зеркала RustFS (issue #149): внешние репозитории бывают
      # недоступны, а после скачивания сверяем sha256 с apps/rustfs/artifacts.tsv.
      # Скачивается один раз, дальше — из кэша выше. Зеркало наполняет CronJob
      # mirror-sync (apps/rustfs).
      - name: Install actionlint
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          asset="actionlint/1.7.12/actionlint_1.7.12_linux_amd64.tar.gz"
          url="http://rustfs.rustfs.svc.cluster.local:9000/mirror/$asset"
          expected="$(awk -v p="$asset" '$1==p{print $2}' apps/rustfs/artifacts.tsv)"
          mkdir -p "$HOME/.local/bin"
          curl -fsSL -o /tmp/actionlint.tar.gz "$url"
          echo "$expected  /tmp/actionlint.tar.gz" | sha256sum -c -
          tar -xzf /tmp/actionlint.tar.gz -C /tmp actionlint
          install -m 0755 /tmp/actionlint "$HOME/.local/bin/actionlint"
      - name: Add actionlint to PATH
        run: echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      # shellcheck нужен actionlint'у для проверки inline `run:` (SC-правила).
      # Берём тот же закэшированный бинарь, что и workflow shellcheck.yml (общий
      # ключ кэша — качается один раз на оба workflow). Доставка через ATS, см.
      # комментарий в shellcheck.yml.
      - name: Cache shellcheck
        id: shellcheck
        uses: actions/cache@v4
        with:
          path: ~/.local/shellcheck
          key: shellcheck-0.11.0-${{ runner.os }}
      - name: Install shellcheck
        if: steps.shellcheck.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          ver="0.11.0"
          asset="shellcheck-v${ver}.linux.x86_64.tar.gz"
          expected="b7af85e41cc99489dcc21d66c6d5f3685138f06d34651e6d34b42ec6d54fe6f6"
          url="http://ats.ats.svc.cluster.local/github/koalaman/shellcheck/releases/download/v${ver}/${asset}"
          mkdir -p "$HOME/.local/shellcheck" /tmp/shellcheck
          curl -fsSL -o "/tmp/shellcheck/${asset}" "$url"
          echo "$expected  /tmp/shellcheck/${asset}" | sha256sum -c -
          tar -xzf "/tmp/shellcheck/${asset}" -C /tmp/shellcheck "shellcheck-v${ver}/shellcheck"
          install -m 0755 "/tmp/shellcheck/shellcheck-v${ver}/shellcheck" "$HOME/.local/shellcheck/shellcheck"
      - name: Add shellcheck to PATH
        run: echo "$HOME/.local/shellcheck" >> "$GITHUB_PATH"
      # pyflakes по-прежнему отключён явно: на раннере его нет, а shell-скрипты
      # в run: — не Python. shellcheck actionlint находит в PATH и гоняет его по
      # inline shell сам.
      - name: Lint workflows
        run: |
          set -euo pipefail
          actionlint -version
          shellcheck --version
          actionlint -pyflakes= -config-file .forgejo/actionlint.yaml .forgejo/workflows/*.yml

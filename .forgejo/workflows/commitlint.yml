name: commitlint

on:
  push:
    branches: [main]
  pull_request:

# Как и в secrets.yml: Forgejo по умолчанию отменяет предыдущий прогон того же
# workflow на push и pull_request (synchronize). На push в main проверка должна
# отрабатывать всегда, а не отменяться следующим пушем.
concurrency:
  cancel-in-progress: false

jobs:
  commitlint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Cache bun
        id: bun
        uses: actions/cache@v4
        with:
          path: ~/.bun
          key: bun-${{ runner.os }}-1.4.0
      - name: Install bun
        if: steps.bun.outputs.cache-hit != 'true'
        run: |
          npm install -g bun@1.4.0
          mkdir -p "$HOME/.bun/bin"
          cp "$(command -v bun)" "$HOME/.bun/bin/bun"
      - name: Add bun to PATH
        run: echo "$HOME/.bun/bin" >> "$GITHUB_PATH"
      - name: Cache dependencies
        uses: actions/cache@v4
        with:
          path: node_modules
          key: node-modules-${{ runner.os }}-${{ hashFiles('bun.lock') }}
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Print versions
        run: |
          git --version
          bun --version
          bun x commitlint --version
      - name: Validate last commit
        if: github.event_name == 'push'
        run: bun x commitlint --last --verbose
      - name: Validate pull request commits
        if: github.event_name == 'pull_request'
        run: bun x commitlint --from ${{ github.event.pull_request.base.sha }} --to ${{ github.event.pull_request.head.sha }} --verbose
      # Заголовок PR не проверяется диапазоном коммитов, но при squash-merge именно
      # он (плюс дописываемый Forgejo ` (#<n>)`) становится сообщением коммита в
      # main. Линтим ровно эту строку, чтобы падение было до merge.
      - name: Validate pull request title
        if: github.event_name == 'pull_request'
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: printf '%s' "$PR_TITLE (#$PR_NUMBER)" | bun x commitlint --verbose

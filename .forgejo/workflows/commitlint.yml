name: commitlint

on:
  push:
    branches: [main]
  pull_request:

# Как и в secrets.yml: Forgejo по умолчанию отменяет предыдущий прогон того же
# workflow на push и pull_request (synchronize). На push в main проверка должна
# отрабатывать всегда, а не отменяться следующим пушем.
concurrency:
  cancel-in-progress: false

jobs:
  commitlint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      # setup-bun берётся из зеркала на локальном инстансе (org `oven-sh`) —
      # как и остальные `uses:` при DEFAULT_ACTIONS_URL=http://forgejo-http:3000.
      # Bинарь качаем через кэш ATS (apps/ats): GitHub отдаёт release-ассет 302
      # на подписанный CDN-URL, а HTTP-клиент внутри setup-bun по нему не идёт и
      # уходит в таймаут. ATS же разворачивает редирект сам и кэширует файл.
      # registries пишет bunfig.toml, поэтому `bun install` идёт через локальный
      # кэш Verdaccio (apps/verdaccio).
      - name: Setup bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0
          bun-download-url: http://ats.ats.svc.cluster.local:8080/github/oven-sh/bun/releases/download/bun-v1.4.0/bun-linux-x64.zip
          registries: http://verdaccio.verdaccio.svc.cluster.local:4873/
      - name: Cache dependencies
        uses: actions/cache@v4
        with:
          path: node_modules
          key: node-modules-${{ runner.os }}-${{ hashFiles('bun.lock') }}
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Print versions
        run: |
          git --version
          bun --version
          bun x commitlint --version
      - name: Validate last commit
        if: github.event_name == 'push'
        run: bun x commitlint --last --verbose
      - name: Validate pull request commits
        if: github.event_name == 'pull_request'
        run: bun x commitlint --from ${{ github.event.pull_request.base.sha }} --to ${{ github.event.pull_request.head.sha }} --verbose
      # Заголовок PR не проверяется диапазоном коммитов, но при squash-merge именно
      # он (плюс дописываемый Forgejo ` (#<n>)`) становится сообщением коммита в
      # main. Линтим ровно эту строку, чтобы падение было до merge.
      - name: Validate pull request title
        if: github.event_name == 'pull_request'
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: printf '%s' "$PR_TITLE (#$PR_NUMBER)" | bun x commitlint --verbose

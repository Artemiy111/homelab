name: commitlint

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  commitlint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Install bun
        run: npm install -g bun@1.4.0
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Print versions
        run: |
          git --version
          bun --version
          bunx commitlint --version
      - name: Validate last commit
        if: github.event_name == 'push'
        run: bunx commitlint --last --verbose
      - name: Validate pull request commits
        if: github.event_name == 'pull_request'
        run: bunx commitlint --from ${{ github.event.pull_request.base.sha }} --to ${{ github.event.pull_request.head.sha }} --verbose

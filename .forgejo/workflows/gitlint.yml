name: meta

on:
  push:
    branches: [main]
  pull_request:

# Как и в secrets.yml: Forgejo по умолчанию отменяет предыдущий прогон того же
# workflow на push и pull_request (synchronize). На push в main проверка должна
# отрабатывать всегда, а не отменяться следующим пушем.
concurrency:
  cancel-in-progress: false

jobs:
  gitlint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      # gitlint и его зависимости берутся из зеркала RustFS (issue #149): в PyPI
      # из job'а ходить не нужно, а версии и хэши лежат в манифесте зеркала, как
      # у остальных гейтов. Набор колёс — не «runtime фиксированного образа»:
      # sh ставится из sdist, поэтому setuptools кладётся в venv первым (в venv
      # на python 3.12 его больше нет), а число скачанных файлов сверяется с
      # ожидаемым, иначе пустой набор прошёл бы молча.
      - name: Install gitlint
        run: |
          set -euo pipefail
          prefix="gitlint/0.19.1/"
          wheels=/tmp/gitlint-wheels
          mkdir -p "$wheels"
          awk -v p="$prefix" '!/^#/ && index($1, p) == 1 { print $1, $2 }' \
            clusters/casa/apps/rustfs/manifests/artifacts.tsv |
            while read -r path digest; do
              file="$wheels/$(basename "$path")"
              curl -fsSL -o "$file" "http://rustfs.rustfs.svc.cluster.local/mirror/$path"
              echo "$digest  $file" | sha256sum -c -
            done
          test "$(find "$wheels" -type f | wc -l)" -eq 8
          python3 -m venv /tmp/gitlint
          /tmp/gitlint/bin/pip install --no-index --find-links "$wheels" setuptools
          /tmp/gitlint/bin/pip install --no-index --find-links "$wheels" gitlint==0.19.1
          echo /tmp/gitlint/bin >> "$GITHUB_PATH"
      - name: Print versions
        run: |
          git --version
          python3 --version
          gitlint --version
      # Правила проверок — часть гейта: сломанное правило либо пропускает мусор в
      # историю, либо блокирует корректный коммит. Самотест гоняет таблицу
      # ожидаемых вердиктов тем же бинарём, что и проверки ниже.
      - name: Self-test rules
        run: ./scripts/gitlint-selftest.sh
      - name: Validate last commit
        if: github.event_name == 'push'
        run: gitlint --commit HEAD
      - name: Validate pull request commits
        if: github.event_name == 'pull_request'
        run: gitlint --commits "${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}"
      # Заголовок PR не проверяется диапазоном коммитов, но при squash-merge именно
      # он (плюс дописываемый Forgejo ` (#<n>)`) становится сообщением коммита в
      # main. Линтим ровно эту строку, чтобы падение было до merge.
      - name: Validate pull request title
        if: github.event_name == 'pull_request'
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: printf '%s' "$PR_TITLE (#$PR_NUMBER)" | gitlint

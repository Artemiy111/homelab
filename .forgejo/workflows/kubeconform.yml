name: kubeconform

on:
  push:
    branches: [main]
    paths: &paths
      - "apps/**"
      - "platform/**"
      - "argocd/**"
      - ".forgejo/workflows/kubeconform.yml"
  pull_request:
    paths: *paths

jobs:
  kubeconform:
    name: kubeconform
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - name: Cache kubeconform
        id: kubeconform
        uses: actions/cache@v4
        with:
          path: ~/.local/bin
          key: kubeconform-0.8.0-mirror-${{ runner.os }}
      - name: Cache schemas
        id: schemas
        uses: actions/cache@v4
        with:
          path: ~/.cache/kubeconform-schemas
          key: kubeconform-schemas-1.36.3-mirror-${{ runner.os }}
      # Бинарь и набор схем берём из зеркала RustFS (issue #149): раннеру не
      # нужен интернет. У скачанного бинаря сверяем sha256 с
      # apps/rustfs/artifacts.tsv; схемы собираются в зеркало воспроизводимо, поэтому
      # хэш в манифесте не пинится. Скачивается один раз, дальше — из кэша выше.
      # Зеркало наполняет CronJob mirror-sync (apps/rustfs).
      - name: Install kubeconform
        if: steps.kubeconform.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          asset="kubeconform/0.8.0/kubeconform_0.8.0_linux_amd64.tar.gz"
          url="http://rustfs.rustfs.svc.cluster.local:9000/mirror/$asset"
          expected="$(awk -v p="$asset" '$1==p{print $2}' apps/rustfs/artifacts.tsv)"
          mkdir -p "$HOME/.local/bin" /tmp/kubeconform
          curl -fsSL -o /tmp/kubeconform/kubeconform.tar.gz "$url"
          echo "$expected  /tmp/kubeconform/kubeconform.tar.gz" | sha256sum -c -
          tar -xzf /tmp/kubeconform/kubeconform.tar.gz -C /tmp/kubeconform kubeconform
          install -m 0755 /tmp/kubeconform/kubeconform "$HOME/.local/bin/kubeconform"
      - name: Install schemas
        if: steps.schemas.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          url="http://rustfs.rustfs.svc.cluster.local:9000/mirror/kubeconform-schemas/1.36.3/kubernetes-json-schema_1.36.3_standalone.tar.gz"
          mkdir -p "$HOME/.cache/kubeconform-schemas"
          curl -fsSL -o /tmp/schemas.tar.gz "$url"
          tar -xzf /tmp/schemas.tar.gz -C "$HOME/.cache/kubeconform-schemas"
      - name: Add kubeconform to PATH
        run: echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      # Схемы берём локальные (offline): дефолтный источник kubeconform —
      # raw.githubusercontent.com, недоступный из job'ов. Версия схем совпадает
      # с версией кластера k0s (platform/k0s/README.md).
      #
      # Сканируются только каталоги с манифестами: apps/<сервис>/k8s/. Файлы
      # values/Chart (Helm) и templates чарта homelab — не готовые манифесты, их
      # исключаем; рендер чарта — отдельная задача.
      #
      # -skip — явный реестр CR, для которых нет схем в наборе Kubernetes. Новый
      # CR в сканируемых путях уронит job, и его надо осознанно добавить сюда
      # (или завести схемы) — вместо тихого пропуска через -ignore-missing-schemas.
      - name: Validate manifests
        run: |
          set -euo pipefail
          kubeconform -v
          kubeconform \
            -kubernetes-version 1.36.3 \
            -schema-location "$HOME/.cache/kubeconform-schemas/{{.NormalizedKubernetesVersion}}-standalone{{.StrictSuffix}}/{{.ResourceKind}}{{.KindSuffix}}.json" \
            -ignore-filename-pattern 'values\.yaml$' \
            -ignore-filename-pattern 'Chart\.yaml$' \
            -ignore-filename-pattern 'platform/homelab/templates' \
            -skip "Application,Beat,Certificate,Cluster,ClusterConfig,ClusterIssuer,Database,Elasticsearch,Grant,Kibana,MariaDB,Middleware,SealedSecret,TLSStore,User,VolumeSnapshotClass" \
            -summary \
            apps/*/k8s platform argocd

name: manifests

on:
  push:
    branches: [main]
    paths: &paths
      - "apps/**"
      - "platform/**"
      - "argocd/**"
      - ".forgejo/workflows/kubeconform.yml"
  pull_request:
    paths: *paths

jobs:
  kubeconform:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      # Ревизия datreeio/CRDs-catalog. Объявлена на уровне job, а не в шаге
      # Validate manifests: значение нужно и ключу кэша, и команде.
      CRD_SCHEMAS_REV: fd90051867733c60d32d16450556e9cd18459aef
    steps:
      - uses: actions/checkout@v6
      - name: Cache kubeconform
        id: kubeconform
        uses: actions/cache@v4
        with:
          path: ~/.local/bin
          key: kubeconform-0.8.0-mirror-${{ runner.os }}
      - name: Cache schemas
        id: schemas
        uses: actions/cache@v4
        with:
          path: ~/.cache/kubeconform-schemas
          key: kubeconform-schemas-1.36.3-mirror-${{ runner.os }}
      - name: Cache downloaded CR schemas
        uses: actions/cache@v4
        with:
          path: ~/.cache/kubeconform-http
          key: kubeconform-cr-schemas-${{ env.CRD_SCHEMAS_REV }}-${{ runner.os }}
      # Бинарь и набор схем Kubernetes берём из зеркала RustFS (issue #149).
      # У скачанного бинаря сверяем sha256 с apps/rustfs/artifacts.tsv; схемы
      # собираются в зеркало воспроизводимо, поэтому хэш в манифесте не пинится.
      # Зеркало наполняет CronJob mirror-sync (apps/rustfs).
      #
      # Схемы Kubernetes нужны локальными ради привязки к версии: kubeconform
      # подставляет {{.NormalizedKubernetesVersion}} из -kubernetes-version, то
      # есть проверяет манифесты по API 1.36.3, а не по master. Схемы CR такой
      # привязки не имеют: они выведены из CRD конкретной версии оператора, и
      # тянутся по HTTPS (issue #791).
      - name: Install kubeconform
        if: steps.kubeconform.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          asset="kubeconform/0.8.0/kubeconform_0.8.0_linux_amd64.tar.gz"
          url="http://rustfs.rustfs.svc.cluster.local/mirror/$asset"
          expected="$(awk -v p="$asset" '$1==p{print $2}' apps/rustfs/artifacts.tsv)"
          mkdir -p "$HOME/.local/bin" /tmp/kubeconform
          curl -fsSL -o /tmp/kubeconform/kubeconform.tar.gz "$url"
          echo "$expected  /tmp/kubeconform/kubeconform.tar.gz" | sha256sum -c -
          tar -xzf /tmp/kubeconform/kubeconform.tar.gz -C /tmp/kubeconform kubeconform
          install -m 0755 /tmp/kubeconform/kubeconform "$HOME/.local/bin/kubeconform"
      - name: Install schemas
        if: steps.schemas.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          url="http://rustfs.rustfs.svc.cluster.local/mirror/kubeconform-schemas/1.36.3/kubernetes-json-schema_1.36.3_standalone.tar.gz"
          mkdir -p "$HOME/.cache/kubeconform-schemas"
          curl -fsSL -o /tmp/schemas.tar.gz "$url"
          tar -xzf /tmp/schemas.tar.gz -C "$HOME/.cache/kubeconform-schemas"
      - name: Add kubeconform to PATH
        run: echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      # Второй -schema-location — схемы CR из datreeio/CRDs-catalog: они не в
      #ходят в набор схем Kubernetes, а без них 40% ресурсов (все CR операторов)
      #не проверялись бы. Схемы каталога выведены из CRD и лежат по путям
      # <group>/<kind>_<version>.json — шаблон ниже это разворачивает.
      #
      # Ревизия зафиксирована коммитом, а не веткой main: у каталога нет
      # пригодных тегов (последний v0.0.12 вышел в 2023, ветка main движется
      # каждый день). Без пина красный job нельзя отличить от «схему обновили
      # полчаса назад». Обновление — руками, как у бинаря kubeconform.
      #
      # -cache складывает скачанные схемы на диск: без него каждый прогон тянет
      # несколько сотен файлов (~5 MiB) заново. Каталог кэша переиспользуется
      # через actions/cache, поэтому набор попадает в CI один раз на прогон.
      #
      # Сканируются только каталоги с манифестами: apps/<сервис>/k8s/. Файлы
      # values/Chart (Helm) и templates чарта homelab — не готовые манифесты, их
      # исключаем; рендер чарта — отдельная задача. kustomization.yaml — тоже не
      # объект API, а вход для kustomize: до argocd/kustomization.yaml он просто
      # не попадал в сканируемые пути, потому что лежал в apps/<сервис>/, а не в
      # apps/<сервис>/k8s/. Теперь появился в argocd/, поэтому исключение нужно
      # явно.
      #
      # -skip не нужен: набор CR покрывает все kind'ы в сканируемых путях.
      # Реестр остаётся осознанным выбором на будущее — если появится CR, для
      # которого схемы нет, job упадёт, и это лучше тихого пропуска через
      # -ignore-missing-schemas. Схема может отставать от CRD оператора: тогда
      # добавляем сюда конкретный kind и фиксируем причину.
      - name: Validate manifests
        run: |
          set -euo pipefail
          kubeconform -v
          mkdir -p "$HOME/.cache/kubeconform-http"
          kubeconform \
            -kubernetes-version 1.36.3 \
            -cache "$HOME/.cache/kubeconform-http" \
            -schema-location "$HOME/.cache/kubeconform-schemas/{{.NormalizedKubernetesVersion}}-standalone{{.StrictSuffix}}/{{.ResourceKind}}{{.KindSuffix}}.json" \
            -schema-location "https://raw.githubusercontent.com/datreeio/CRDs-catalog/$CRD_SCHEMAS_REV/{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json" \
            -ignore-filename-pattern 'values\.yaml$' \
            -ignore-filename-pattern 'Chart\.yaml$' \
            -ignore-filename-pattern 'platform/homelab/templates' \
            -ignore-filename-pattern 'kustomization\.yaml$' \
            -summary \
            apps/*/k8s platform argocd

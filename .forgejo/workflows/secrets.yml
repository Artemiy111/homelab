name: secrets

on:
  push:
    branches: [main]
  pull_request:

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Cache gitleaks
        id: cache
        uses: actions/cache@v4
        with:
          path: ~/.local/bin
          key: gitleaks-8.30.1-generic-${{ runner.os }}
      # Бинарь лежит в Forgejo generic package (у раннера нет доступа к github.com,
      # а до Forgejo — есть). Пакет публичный, скачивание анонимное, поэтому
      # PAT/секрет не нужен. Скачивается один раз, дальше берётся из кэша выше.
      #
      # Опубликовать/обновить пакет (нужен PAT со scope write:package):
      #   curl -X PUT --upload-file gitleaks_<ver>_linux_x64.tar.gz \
      #     -H "Authorization: token <PAT>" \
      #     "$FORGEJO/api/packages/<owner>/generic/gitleaks/<ver>/gitleaks_<ver>_linux_x64.tar.gz"
      - name: Install gitleaks
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          URL="${{ github.server_url }}/api/packages/${{ github.repository_owner }}/generic/gitleaks/8.30.1/gitleaks_8.30.1_linux_x64.tar.gz"
          echo "package_url=$URL"
          mkdir -p "$HOME/.local/bin"
          curl -fsSL -o /tmp/gitleaks.tar.gz "$URL"
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks
          install -m 0755 /tmp/gitleaks "$HOME/.local/bin/gitleaks"
      - name: Add gitleaks to PATH
        run: echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Scan last commit
        if: github.event_name == 'push'
        run: gitleaks git --config .gitleaks.toml --log-opts="-1" --no-banner --redact
      - name: Scan pull request commits
        if: github.event_name == 'pull_request'
        run: gitleaks git --config .gitleaks.toml --log-opts="${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}" --no-banner --redact

name: secrets

on:
  push:
  pull_request:

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Cache gitleaks
        id: cache
        uses: actions/cache@v4
        with:
          path: ~/.local/bin
          key: gitleaks-8.30.1-${{ runner.os }}
      # Бинарь лежит в релизе этого репозитория: у раннера нет доступа к github.com,
      # а до Forgejo — есть. Скачивается один раз, дальше попадает в кэш выше.
      #
      # Автоматический токен workflow (github.token / secrets.GITHUB_TOKEN) не
      # подходит: он аутентифицирует запрос как служебного пользователя Forgejo
      # Actions, у которого нет прав на приватный репозиторий, и на release-ассет
      # приходит 404. В секрете GITLEAKS_DOWNLOAD_TOKEN лежит read:repository PAT.
      - name: Install gitleaks
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          URL="${{ github.server_url }}/${{ github.repository }}/releases/download/maint-tools/gitleaks_8.30.1_linux_x64.tar.gz"
          TOKEN="${{ secrets.GITLEAKS_DOWNLOAD_TOKEN }}"
          echo "asset_url=$URL"
          if [ -n "$TOKEN" ]; then echo "token: present"; else echo "token: empty"; fi
          mkdir -p "$HOME/.local/bin"
          curl -fsSL -H "Authorization: token $TOKEN" -o /tmp/gitleaks.tar.gz "$URL"
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks
          install -m 0755 /tmp/gitleaks "$HOME/.local/bin/gitleaks"
      - name: Add gitleaks to PATH
        run: echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Scan last commit
        if: github.event_name == 'push'
        run: gitleaks git --config .gitleaks.toml --log-opts="-1" --no-banner --redact
      - name: Scan pull request commits
        if: github.event_name == 'pull_request'
        run: gitleaks git --config .gitleaks.toml --log-opts="${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}" --no-banner --redact

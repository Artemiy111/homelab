name: secrets

on:
  push:
    branches: [main]
  pull_request:

# Forgejo по умолчанию отменяет предыдущий прогон того же workflow на push и
# pull_request (synchronize). Для сканирования секретов это нежелательно: прогон
# промежуточного коммита — тоже результат. Без group конкурентностью Forgejo не
# управляет вовсе, поэтому запуски не отменяют друг друга и идут параллельно.
concurrency:
  cancel-in-progress: false

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Cache gitleaks
        id: cache
        uses: actions/cache@v4
        with:
          path: ~/.local/bin
          key: gitleaks-8.30.1-mirror-${{ runner.os }}
      # Бинарь берём из зеркала RustFS (issue #149): раннеру не нужен интернет,
      # а после скачивания сверяем sha256 с apps/rustfs/artifacts.tsv.
      # Скачивается один раз, дальше берётся из кэша выше. Зеркало наполняет
      # CronJob mirror-sync (apps/rustfs).
      - name: Install gitleaks
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          asset="gitleaks/8.30.1/gitleaks_8.30.1_linux_x64.tar.gz"
          url="http://rustfs.rustfs.svc.cluster.local/mirror/$asset"
          expected="$(awk -v p="$asset" '$1==p{print $2}' apps/rustfs/artifacts.tsv)"
          mkdir -p "$HOME/.local/bin"
          curl -fsSL -o /tmp/gitleaks.tar.gz "$url"
          echo "$expected  /tmp/gitleaks.tar.gz" | sha256sum -c -
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks
          install -m 0755 /tmp/gitleaks "$HOME/.local/bin/gitleaks"
      - name: Add gitleaks to PATH
        run: echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Scan last commit
        if: github.event_name == 'push'
        run: gitleaks git --config .gitleaks.toml --log-opts="-1" --no-banner --redact
      - name: Scan pull request commits
        if: github.event_name == 'pull_request'
        run: gitleaks git --config .gitleaks.toml --log-opts="${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}" --no-banner --redact

name: meta

on:
  push:
    branches: [main]
    paths: &paths
      - "clusters/casa/apps/**"
      - "clusters/casa/platform/**"
      - "bootstrap/**"
      - "docs/**"
      - "scripts/**"
      - ".forgejo/workflows/status.yml"
  pull_request:
    paths: *paths

# Гейт на то, что числа в README соответствуют репозиторию. Бейджи лежат в
# коммите, поэтому без проверки они тихо расходятся с кодом: добавил сервис —
# badge «services» остался прежним, и README врёт.
#
# Тулчейн не расширяется: генератор на git, grep, awk и coreutils, поэтому
# ничего не качаем из зеркала RustFS (clusters/casa/apps/rustfs) и не добавляем в
# clusters/casa/apps/rustfs/artifacts.tsv.
jobs:
  status:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # Шагу merge ниже нужна git-identity: сам merge-коммит не создаётся
    # (--no-commit), но служебные операции git внутри (например, autostash при
    # грязном дереве) создают commit-объекты и без неё падают с «Committer
    # identity unknown». В контейнере джоба глобального user.name/user.email
    # нет, поэтому задаём её явно.
    env:
      GIT_AUTHOR_NAME: forgejo-actions[bot]
      GIT_AUTHOR_EMAIL: forgejo-actions[bot]@homelab.invalid
      GIT_COMMITTER_NAME: forgejo-actions[bot]
      GIT_COMMITTER_EMAIL: forgejo-actions[bot]@homelab.invalid
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      # Числа в бейджах зависят от всего дерева, а не от файла, который менял
      # автор. Пока ветка ждала review, main успевал уехать вперёд, и к моменту
      # merge артефакты уже расходились с merge-результатом: гейт на push в main
      # падал post factum, то есть чинить приходилось отдельным PR. Поэтому на
      # PR считаем по merge-результату — расхождение видно автору до merge.
      # Конфликт при слиянии здесь не ложное срабатывание: он означает, что
      # артефакты и правка автора претендуют на одно и то же место.
      #
      # --no-ff --no-commit: коммит не создаётся, merge-коммит в одноразовом
      # дереве раннера сохранять некуда.
      - name: Merge main into branch tree
        if: github.event_name == 'pull_request'
        run: git merge --no-ff --no-commit "origin/${{ github.event.pull_request.base.ref }}"
      - name: Check status artifacts
        run: ./scripts/status-badges.sh --check

version: 2

updates:
  - package-ecosystem: bun
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 20
    commit-message:
      prefix: chore
      include: scope

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 20
    commit-message:
      prefix: chore
      include: scope

  - package-ecosystem: terraform
    directories:
      - "/infra/casa/terraform/*"
    schedule:
      interval: weekly
    open-pull-requests-limit: 20
    commit-message:
      prefix: chore
      include: scope

  - package-ecosystem: docker
    directories:
      - "/.devcontainer"
      - "/apps/casa/*"
    schedule:
      interval: weekly
    open-pull-requests-limit: 20
    commit-message:
      prefix: chore
      include: scope

  - package-ecosystem: docker-compose
    directories:
      - "/apps/casa/*"
    schedule:
      interval: weekly
    open-pull-requests-limit: 20
    commit-message:
      prefix: chore
      include: scope

  - package-ecosystem: devcontainers
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 20
    commit-message:
      prefix: chore
      include: scope

  - package-ecosystem: helm
    directories:
      - "/apps/casa/*/chart"
    schedule:
      interval: weekly
    open-pull-requests-limit: 20
    commit-message:
      prefix: chore
      include: scope

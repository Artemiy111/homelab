# Гейт публичного зеркала на GitHub, парный к .forgejo/workflows/020-trivy.yml:
# состав проверки и версия trivy те же, sha256 бинаря тот же. URL — апстрим-релиз
# GitHub вместо зеркала RustFS, потому что с GitHub-раннера адреса
# *.svc.cluster.local не резолвятся.
name: security

on:
  push:
    branches: [main]
    paths:
      - "apps/casa/**"
      - "platform/casa/**"
      - "clusters/casa/argocd/**"
      - "infra/casa/terraform/**"
      - ".github/workflows/020-trivy.yml"
  workflow_dispatch:

jobs:
  trivy:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - name: Cache trivy
        id: cache
        uses: actions/cache@v6
        with:
          path: ~/.local/trivy
          key: trivy-0.75.0-upstream-${{ runner.os }}
      - name: Install trivy
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          ver="0.75.0"
          asset="trivy_${ver}_Linux-64bit.tar.gz"
          expected="c6e65abddb348e25f10549df887045629cf28cc72453cd1c63acb717316b3f3f"
          url="https://github.com/aquasecurity/trivy/releases/download/v${ver}/${asset}"
          mkdir -p "$HOME/.local/trivy" /tmp/trivy
          curl -fsSL --retry 5 --retry-delay 5 -o "/tmp/trivy/${asset}" "$url"
          echo "$expected  /tmp/trivy/${asset}" | sha256sum -c -
          tar -xzf "/tmp/trivy/${asset}" -C /tmp/trivy trivy
          install -m 0755 "/tmp/trivy/trivy" "$HOME/.local/trivy/trivy"
      # Report-only: exit-code 0, job на находках не падает — сначала смотрим
      # набор, гейт включается отдельным PR (issue #1072).
      # TRIVY_SKIP_CHECK_UPDATE берёт встроенный набор политик, без похода за
      # бандлом проверок в ghcr.io.
      - name: Report Terraform
        env:
          TRIVY_SKIP_CHECK_UPDATE: "true"
        run: |
          set -euo pipefail
          trivy="$HOME/.local/trivy/trivy"
          "$trivy" --version
          "$trivy" config \
            --cache-dir "${{ github.workspace }}/.cache/trivy" \
            --severity HIGH,CRITICAL \
            --exit-code 0 \
            --quiet \
            infra/casa/terraform
      # `trivy config` принимает один DIR, поэтому каталоги перебираются
      # циклом: лишний позиционный аргумент молча игнорируется, и часть дерева
      # выпала бы из скана, оставшись зелёной.
      - name: Report manifests
        env:
          TRIVY_SKIP_CHECK_UPDATE: "true"
        run: |
          set -euo pipefail
          for dir in apps/casa platform/casa clusters/casa/argocd; do
            "$HOME/.local/trivy/trivy" config \
              --cache-dir "${{ github.workspace }}/.cache/trivy" \
              --severity HIGH,CRITICAL \
              --exit-code 0 \
              --quiet \
              "$dir"
          done

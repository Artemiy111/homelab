# Гейт публичного зеркала на GitHub, парный к .forgejo/workflows/080-secrets.yml:
# версия gitleaks, конфиг и правило сканирования те же. Бинарь тот же, что
# публикует зеркало RustFS: URL — апстрим-релиз GitHub, sha256 — из
# artifacts.tsv.
#
# Шага с диффом PR здесь нет: на зеркале триггер только push в main, PR туда не
# приходят — сканируется последний коммит, то есть ровно то, что попало в main.
#
# Блока concurrency нет намеренно: GitHub отменяет предыдущий прогон только при
# явно заданном concurrency, а в кластерном двойнике отмена отключена
# (`cancel-in-progress: false`) — поведение совпадает без настройки.
name: security

on:
  push:
    branches: [main]

jobs:
  gitleaks:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Cache gitleaks
        id: cache
        uses: actions/cache@v6
        with:
          path: ~/.local/bin
          key: gitleaks-8.30.1-upstream-${{ runner.os }}
      - name: Install gitleaks
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          asset="gitleaks/8.30.1/gitleaks_8.30.1_linux_x64.tar.gz"
          read -r expected url <<<"$(awk -v p="$asset" '$1==p{print $2, $3}' clusters/casa/apps/rustfs/manifests/artifacts.tsv)"
          mkdir -p "$HOME/.local/bin"
          curl -fsSL -o /tmp/gitleaks.tar.gz "$url"
          echo "$expected  /tmp/gitleaks.tar.gz" | sha256sum -c -
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks
          install -m 0755 /tmp/gitleaks "$HOME/.local/bin/gitleaks"
      - name: Add gitleaks to PATH
        run: echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Scan last commit
        run: gitleaks git --config .gitleaks.toml --log-opts="-1" --no-banner --redact

# Гейт публичного зеркала на GitHub, парный к .forgejo/workflows/110-actionlint.yml:
# версии actionlint и shellcheck те же, sha256 те же. Бинарь actionlint берётся из
# апстрим-релиза по пину из artifacts.tsv, shellcheck — по пину из кластерного
# workflow (в artifacts.tsv его нет: в кластере он приходит через кэш ATS).
#
# Линтуются оба набора: .forgejo/workflows/*.yml — то, что исполняет раннер в
# кластере, .github/workflows/*.yml — гейты публичного зеркала. Игноры в
# .forgejo/actionlint.yaml привязаны к путям .forgejo/workflows/**/*.yml, поэтому
# на .github-файлы они не распространяются: расхождений движков там нет, и
# ослаблять проверку нечем.
name: meta

on:
  push:
    branches: [main]
    paths:
      - ".forgejo/workflows/**"
      - ".forgejo/actionlint.yaml"
      - ".github/workflows/**"

jobs:
  actionlint:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - name: Cache actionlint
        id: cache
        uses: actions/cache@v6
        with:
          path: ~/.local/bin
          key: actionlint-1.7.12-upstream-${{ runner.os }}
      - name: Install actionlint
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          asset="actionlint/1.7.12/actionlint_1.7.12_linux_amd64.tar.gz"
          read -r expected url <<<"$(awk -v p="$asset" '$1==p{print $2, $3}' apps/casa/rustfs/manifests/artifacts.tsv)"
          mkdir -p "$HOME/.local/bin"
          curl -fsSL -o /tmp/actionlint.tar.gz "$url"
          echo "$expected  /tmp/actionlint.tar.gz" | sha256sum -c -
          tar -xzf /tmp/actionlint.tar.gz -C /tmp actionlint
          install -m 0755 /tmp/actionlint "$HOME/.local/bin/actionlint"
      - name: Add actionlint to PATH
        run: echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      # shellcheck нужен actionlint'у для проверки inline `run:` (SC-правила).
      # Ключ кэша тот же, что у 070-shellcheck.yml: бинарь общий на оба workflow.
      - name: Cache shellcheck
        id: shellcheck
        uses: actions/cache@v6
        with:
          path: ~/.local/shellcheck
          key: shellcheck-0.11.0-upstream-${{ runner.os }}
      - name: Install shellcheck
        if: steps.shellcheck.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          ver="0.11.0"
          asset="shellcheck-v${ver}.linux.x86_64.tar.gz"
          expected="b7af85e41cc99489dcc21d66c6d5f3685138f06d34651e6d34b42ec6d54fe6f6"
          url="https://github.com/koalaman/shellcheck/releases/download/v${ver}/${asset}"
          mkdir -p "$HOME/.local/shellcheck" /tmp/shellcheck
          curl -fsSL -o "/tmp/shellcheck/${asset}" "$url"
          echo "$expected  /tmp/shellcheck/${asset}" | sha256sum -c -
          tar -xzf "/tmp/shellcheck/${asset}" -C /tmp/shellcheck "shellcheck-v${ver}/shellcheck"
          install -m 0755 "/tmp/shellcheck/shellcheck-v${ver}/shellcheck" "$HOME/.local/shellcheck/shellcheck"
      - name: Add shellcheck to PATH
        run: echo "$HOME/.local/shellcheck" >> "$GITHUB_PATH"
      # pyflakes отключён явно: shell-скрипты в run: — не Python, а shellcheck
      # actionlint находит в PATH и гоняет его по inline shell сам.
      - name: Lint workflows
        run: |
          set -euo pipefail
          actionlint -version
          shellcheck --version
          actionlint -pyflakes= -config-file .forgejo/actionlint.yaml .forgejo/workflows/*.yml .github/workflows/*.yml

title = "homelab gitleaks config"

[extend]
useDefault = true

[[allowlists]]
description = "Плейсхолдеры в примерах и документации"
regexTarget = "match"
regexes = [
  '''replace-with[-a-z]*''',
  '''placeholder''',
]

[[allowlists]]
description = "Имя RFC2136-ключа (идентификатор, не секрет)"
regexTarget = "match"
regexes = [
  '''tsig-[0-9]+\.<dns-provider>\.com''',
]

[[allowlists]]
description = "Длительности Go в login policy Zitadel: это AsDuration(), а не пароль"
paths = ['''^infra/casa/terraform/zitadel/policies\.tf$''']
regexTarget = "match"
regexes = [
  '''^\d+h0m0s$''',
]

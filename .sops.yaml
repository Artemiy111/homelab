# Правила шифрования SOPS для secrets.env сервисов.
#
# Шифруются только значения секретных полей: encrypted_regex матчит имена
# ключей (password/secret/token/hash/users и т.п.). Публичная конфигурация
# (домены, имена хостов, алгоритмы, email) остаётся в открытом виде, поэтому
# diff в Git читаем. При появлении новых чувствительных ключей с другими
# именами расширьте регулярное выражение или добавьте отдельное правило.
#
# Публичный age-ключ хранить в Git безопасно; приватный существует только на
# сервере: ~artlab/.config/sops/age/keys.txt (права 0600). Потеря приватного
# ключа = невосстановимая потеря зашифрованных значений secrets.env.
creation_rules:
  # Правило покрывает как миграционный вход (<сервис>/.env), так и
  # закоммиченный результат <сервис>/secrets.env.
  - path_regex: '\.env$'
    encrypted_regex: '(?i)(password|passwd|secret|token|credential|auth|users|private[_-]?key)'
    age: >-
      age1anr07xknmnlyp3hxnm0nts4v2fuz22z6xh52tx0cv2ahxs607aeqvzpxkz

# Правила шифрования SOPS для secrets.enc.env сервисов.
#
# Граница «секрет/не секрет» — файловая, а не по регулярке имён ключей:
# <сервис>/secrets.enc.env содержит только секреты и шифруется целиком;
# публичная конфигурация живёт в <сервис>/config.env (plaintext, tracked).
# Список секретных ключей каждого сервиса фиксируется явно при миграции
# (scripts/sops-migrate-service.sh), см. diff соответствующего коммита.
#
# Публичный age-ключ хранить в Git безопасно; приватный существует только на
# сервере: ~artlab/.config/sops/age/keys.txt (права 0600). Потеря приватного
# ключа = невосстановимая потеря зашифрованных значений secrets.enc.env.
creation_rules:
  # Правило покрывает закоммиченные <сервис>/secrets.enc.env и временный
  # файл миграционного входа (scripts/sops-migrate-service.sh).
  - path_regex: 'secrets\.enc\.env$'
    age: >-
      age1anr07xknmnlyp3hxnm0nts4v2fuz22z6xh52tx0cv2ahxs607aeqvzpxkz

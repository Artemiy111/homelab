name: 3x-ui

services:
  initialize:
    image: ghcr.io/mhsanaei/3x-ui:v3.6.0
    container_name: 3x-ui-initialize

    volumes:
      - ${APPS_STORAGE_PATH:-/storage/apps}/3x-ui/db:/etc/x-ui:Z

    environment:
      XUI_ADMIN_USERNAME: ${XUI_ADMIN_USERNAME:?set in 3x-ui/.env}
      XUI_ADMIN_PASSWORD: ${XUI_ADMIN_PASSWORD:?set in 3x-ui/.env}
      XUI_WEB_BASE_PATH: ${XUI_WEB_BASE_PATH:?set in 3x-ui/.env}

    command:
      - |
        if [ ! -f /etc/x-ui/x-ui.db ]; then
          /app/x-ui setting \
            -username "$${XUI_ADMIN_USERNAME}" \
            -password "$${XUI_ADMIN_PASSWORD}" \
            -webBasePath "$${XUI_WEB_BASE_PATH}"
        fi
    entrypoint:
      - /bin/sh
      - -ec
    restart: "no"

  3x-ui:
    image: ghcr.io/mhsanaei/3x-ui:v3.6.0
    container_name: 3x-ui

    depends_on:
      initialize:
        condition: service_completed_successfully

    volumes:
      - ${APPS_STORAGE_PATH:-/storage/apps}/3x-ui/db:/etc/x-ui:Z
      - ${APPS_STORAGE_PATH:-/storage/apps}/3x-ui/log:/var/log/x-ui:Z

    environment:
      TZ: ${TZ:?set in 3x-ui/.env}
      XRAY_VMESS_AEAD_FORCED: "false"
      XUI_ENABLE_FAIL2BAN: "true"
      XUI_INIT_WEB_BASE_PATH: ${XUI_WEB_BASE_PATH:?set in 3x-ui/.env}
      XUI_SKIP_HSTS: "true"

    ports:
      - "${SERVER_IP:?set in 3x-ui/.env}:${XUI_INBOUND_PORT:?set in 3x-ui/.env}:${XUI_INBOUND_PORT}/tcp"
      - "${SERVER_IP:?set in 3x-ui/.env}:${XUI_INBOUND_PORT:?set in 3x-ui/.env}:${XUI_INBOUND_PORT}/udp"
      - "${SERVER_IP:?set in 3x-ui/.env}:${XUI_EGRESS_PORT:?set in 3x-ui/.env}:${XUI_EGRESS_PORT}/tcp"
    networks:
      - default
      - traefiknet
    restart: unless-stopped

    healthcheck:
      test:
        - CMD-SHELL
        - curl -fsS "http://127.0.0.1:2053$${XUI_INIT_WEB_BASE_PATH}" >/dev/null
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

    labels:
      - traefik.enable=true
      - traefik.http.routers.3x-ui.rule=Host(`xui.${DOMAIN}`)
      - traefik.http.routers.3x-ui.entrypoints=websecure
      - traefik.http.services.3x-ui.loadbalancer.server.port=2053
      - traefik.docker.network=traefiknet

    cap_add:
      - NET_ADMIN
      - NET_RAW
    security_opt:
      - no-new-privileges:true

networks:
  traefiknet:
    external: true

---
host_packages:
  # --- Шелл и CLI ---
  - zsh
  - git
  - tmux
  - fzf
  - fd-find          # бинарник fdfind (команда fd)
  - bat
  - lsd
  - neovim           # бинарник nvim
  - lazygit          # из COPR dejan/lazygit
  - tldr
  - htop
  - btop
  - fastfetch
  - ncdu
  - glances
  - lshw
  - mkpasswd
  - sshpass
  - pv

  # --- Docker и k8s ---
  - docker-ce
  - docker-ce-cli
  - containerd.io
  - docker-buildx-plugin
  - docker-compose-plugin
  - podman-compose
  - helm
  - k9s
  - ansible

  # --- Виртуализация ---
  - virt-manager
  - virt-install
  - virt-top

  # --- Сеть и VPN ---
  - tailscale
  - wireguard-tools
  - fail2ban
  - iftop
  - nethogs
  - bmon
  - ngrep
  - wireshark-cli

  # --- Шифрование секретов ---
  - age              # age + age-keygen, официальные репозитории Fedora

  # --- Хранение ---
  - samba
  - samba-client

  # --- Автообновления ---
  - dnf-automatic    # автоматические обновления безопасности

  # --- Прочее ---
  - sysstat          # утилита mpstat
  - fontconfig

# Группы пакетов (ставим отдельной задачей, префикс @ обязателен).
host_groups:
  - "@virtualization"

# --- Шифрование секретов (SOPS) ---

# Официального репозитория sops в Fedora нет — RPM из релиза GitHub.
sops_version: "3.13.3"
sops_rpm_url: "https://github.com/getsops/sops/releases/download/v{{ sops_version }}/sops-{{ sops_version }}-1.x86_64.rpm"

# --- vals: рендер шаблонов конфигов с подстановкой секретов ---

# Ставим из исходного кода, пин по тегу релиза (нужны golang и git).
vals_version: "v0.46.0"
vals_repo: "https://github.com/helmfile/vals.git"

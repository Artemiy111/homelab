---
host_packages:
  # --- Шелл и CLI ---
  - zsh
  - git
  - tmux
  - fzf
  - fd-find          # бинарник fdfind (команда fd)
  - bat
  - lsd
  - neovim           # бинарник nvim
  - lazygit          # из COPR dejan/lazygit
  - tldr
  - htop
  - btop
  - fastfetch
  - ncdu
  - glances
  - lshw
  - mkpasswd
  - sshpass
  - pv

  # --- Docker и k8s ---
  - docker-ce
  - docker-ce-cli
  - containerd.io
  - docker-buildx-plugin
  - docker-compose-plugin
  - podman-compose
  - helm
  - k9s
  - ansible

  # --- Виртуализация ---
  - virt-manager
  - virt-install
  - virt-top

  # --- Сеть и VPN ---
  - tailscale
  - wireguard-tools
  - fail2ban
  - iftop
  - nethogs
  - bmon
  - ngrep
  - wireshark-cli

  # --- Шифрование секретов ---
  - age              # age + age-keygen, официальные репозитории Fedora

  # --- Хранение ---
  - samba
  - samba-client

  # --- Longhorn (CSI-хранилище в k0s) ---
  - iscsi-initiator-utils   # iscsid: iSCSI-тома Longhorn (V1 data engine)
  - nfs-utils               # NFSv4-клиент: RWX-тома и s3/nfs backup target

  # --- Автообновления ---
  - dnf-automatic    # автоматические обновления безопасности

  # --- Прочее ---
  - sysstat          # утилита mpstat
  - fontconfig

# Группы пакетов (ставим отдельной задачей, префикс @ обязателен).
host_groups:
  - "@virtualization"

# --- Шифрование секретов (SOPS) ---

# Официального репозитория sops в Fedora нет — RPM из релиза GitHub.
sops_version: "3.13.3"
sops_rpm_url: "https://github.com/getsops/sops/releases/download/v{{ sops_version }}/sops-{{ sops_version }}-1.x86_64.rpm"

# --- vals: рендер шаблонов конфигов с подстановкой секретов ---

# Ставим из исходного кода, пин по тегу релиза (нужны golang и git).
vals_version: "v0.46.0"
vals_repo: "https://github.com/helmfile/vals.git"

# --- kubeseal: клиент sealed-secrets (шифрование секретов для Kubernetes) ---
# Версия обязана совпадать с версией контроллера (чарт sealed-secrets).
kubeseal_version: "0.40.0"
kubeseal_url: "https://github.com/bitnami/sealed-secrets/releases/download/v{{ kubeseal_version }}/kubeseal-{{ kubeseal_version }}-linux-amd64.tar.gz"
# SHA256 из sealed-secrets_0.40.0_checksums.txt (целостность при скачивании).
kubeseal_checksum: "sha256:9314c35916646e9d59c8f06b1314574b4e79c4d76f079433607ed7b697bb5eb7"

# --- argocd: CLI для пробного стенда (argocd) ---
# Версия обязана совпадать с версией сервера Argo CD. Сейчас это appVersion
# чарта argo/argo-cd 10.9.1 → v3.5.3; при апгрейде чарта поднимать и пин.
argocd_version: "3.5.3"
argocd_cli_url: "https://github.com/argoproj/argo-cd/releases/download/v{{ argocd_version }}/argocd-linux-amd64"
# SHA256 из cli_checksums.txt того же релиза (целостность при скачивании).
argocd_cli_checksum: "sha256:b860f73f57cbddd993cd446f5236d797c1b1ac8554857b2683d2669f17e765b4"

# --- kubectl-cnpg: плагин оператора CloudNativePG (platform/cnpg) ---
# Версию держать не ниже версии оператора в кластере (сейчас 1.30.0 —
# appVersion чарта cloudnative-pg 0.29.0): старый плагин не знает новых полей CR.
kubectl_cnpg_version: "1.30.0"
kubectl_cnpg_rpm_url: "https://github.com/cloudnative-pg/cloudnative-pg/releases/download/v{{ kubectl_cnpg_version }}/kubectl-cnpg_{{ kubectl_cnpg_version }}_linux_x86_64.rpm"
# SHA256 из cnpg-{{ kubectl_cnpg_version }}-checksums.txt того же релиза.
kubectl_cnpg_rpm_checksum: "sha256:80879096796b25f850c06942c0a59b5d89655d9d9afbaf89e2460c9faa51d519"

# --- Longhorn (CSI-хранилище, ставится через Argo: argocd/applications/longhorn.yaml) ---

# Каталог данных на узле (Longhorn node disk). Отдельного диска на сервере нет,
# а корень — XFS, который нельзя ужать, поэтому выделенный LV пока невозможен:
# данные живут на корневой ФС. При появлении диска путь менять на его точку
# монтирования и переносить диск в UI Longhorn.
longhorn_data_path: /storage/apps/k8s/longhorn

# Fedora-сборка iscsi-initiator-utils создаёт каталоги в /var/lib/iscsi без
# execute-бита, а обновлённый container-selinux не даёт iscsid_t capability
# dac_override — тома Longhorn застревают в attach/detach loop
# (https://longhorn.io/kb/troubleshooting-volume-attachment-fails-due-to-selinux-denials/).
longhorn_selinux_cil: local_longhorn.cil

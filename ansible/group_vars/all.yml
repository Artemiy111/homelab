---
host_packages:
  # --- Шелл и CLI ---
  - zsh
  - git
  - tmux
  - fzf
  - fd-find          # бинарник fdfind (команда fd)
  - bat
  - lsd
  - neovim           # бинарник nvim
  - lazygit          # из COPR dejan/lazygit
  - tldr
  - htop
  - btop
  - fastfetch
  - ncdu
  - glances
  - lshw
  - mkpasswd
  - sshpass
  - pv

  # --- Docker и k8s ---
  - docker-ce
  - docker-ce-cli
  - containerd.io
  - docker-buildx-plugin
  - docker-compose-plugin
  - podman-compose
  - helm
  - k9s
  - kubernetes1.34-client   # предоставляет kubectl; обновлять при смене версии в Fedora
  - ansible

  # --- Виртуализация ---
  - virt-manager
  - virt-install
  - virt-top

  # --- Сеть и VPN ---
  - tailscale
  - wireguard-tools
  - fail2ban
  - iftop
  - nethogs
  - bmon
  - ngrep
  - wireshark-cli

  # --- Хранение ---
  - samba
  - samba-client

  # --- Прочее ---
  - sysstat          # утилита mpstat
  - fontconfig

# Группы пакетов (ставим отдельной задачей, префикс @ обязателен).
host_groups:
  - "@virtualization"

# Пакеты, которых на хосте быть не должно (были удалены вручную ранее).
# Явное объявление фиксирует намерение и не даёт им вернуться.
host_packages_absent:
  - fish
  - baobab
  - nginx
  - jenkins
  - caddy

# --- Шифрование секретов (SOPS + age) ---

# sops: официального RPM в Fedora нет, ставим статический бинарник из релиза.
sops_version: "3.13.3"
sops_url: "https://github.com/getsops/sops/releases/download/v{{ sops_version }}/sops-v{{ sops_version }}.linux.amd64"
sops_checksum: "sha256:e5bec3346a873ae91d871550f3e698c1aad962aff462a080e40f25fde17fef6b"

# age: ставим из официального архива релиза (age + age-keygen).
age_version: "1.3.1"
age_url: "https://github.com/FiloSottile/age/releases/download/v{{ age_version }}/age-v{{ age_version }}-linux-amd64.tar.gz"
age_tarball_checksum: "sha256:bdc69c09cbdd6cf8b1f333d372a1f58247b3a33146406333e30c0f26e8f51377"

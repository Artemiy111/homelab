---
# Плейбук: репозитории → пакеты → группы → чистка.
# Запуск на сервере homelab:
#   cd /home/artlab/projects/homelab/ansible && ansible-playbook host.yml
# Dry-run (ничего не меняет):
#   ansible-playbook host.yml --check --diff

- name: Пакеты и репозитории хоста homelab
  hosts: homelab
  become: true
  gather_facts: true

  vars_files:
    - group_vars/all.yml

  tasks:
    # Плагины dnf нужны для управления репозиториями (dnf copr).
    - name: Установить плагины dnf для управления репозиториями
      ansible.builtin.dnf5:
        name:
          - dnf-plugins-core
          - dnf5-plugins
        state: present

    # --- Сторонние репозитории ---

    - name: Подключить репозиторий Docker CE Stable
      ansible.builtin.yum_repository:
        name: docker-ce-stable
        description: Docker CE Stable - $basearch
        baseurl: https://download.docker.com/linux/fedora/$releasever/$basearch/stable
        gpgcheck: true
        gpgkey: https://download.docker.com/linux/fedora/gpg
        enabled: true
        file: docker-ce

    - name: Подключить репозиторий Tailscale
      ansible.builtin.yum_repository:
        name: tailscale-stable
        description: Tailscale stable
        baseurl: https://pkgs.tailscale.com/stable/fedora/$basearch
        gpgcheck: true
        gpgkey: https://pkgs.tailscale.com/stable/fedora/repo.gpg
        repo_gpgcheck: true
        enabled: true
        file: tailscale

    - name: Подключить COPR-репозиторий lazygit
      community.general.copr:
        name: dejan/lazygit
        state: enabled
        host: copr.fedorainfracloud.org

    - name: Подключить COPR-репозиторий forgejo-cli
      community.general.copr:
        name: lihaohong/forgejo-cli
        state: enabled
        host: copr.fedorainfracloud.org

    # Для sops официального репозитория нет — берём RPM из релиза GitHub.
    # RPM подписан cosign, а не GPG, поэтому проверка подписи отключена;
    # целостность фиксируется checksum URL-версии (см. group_vars/all.yml).
    - name: Установить sops из релиза GitHub
      ansible.builtin.dnf5:
        name: "{{ sops_rpm_url }}"
        state: present
        disable_gpg_check: true

    # Остаток прежней установки сырым бинарником (перекрывал RPM в PATH).
    - name: Удалить старый бинарник sops из /usr/local/bin
      ansible.builtin.file:
        path: /usr/local/bin/sops
        state: absent

    # --- vals: сборка из исходного кода ---

    - name: Установить toolchain для сборки vals
      ansible.builtin.dnf5:
        name:
          - git
          - golang
        state: present

    - name: Определить версию установленного vals
      ansible.builtin.command:
        cmd: /usr/local/bin/vals version
      register: vals_installed
      failed_when: false
      changed_when: false

    - name: Клонировать vals ({{ vals_version }})
      ansible.builtin.git:
        repo: "{{ vals_repo }}"
        dest: /usr/local/src/vals
        version: "{{ vals_version }}"
        depth: 1
      register: vals_repo_state

    # Пересобираем при смене пина или если бинарник отсутствует/битый/
    # другой версии. Main-пакет vals — ./cmd/vals (корень репозитория —
    # библиотека). Версию в бинарник надо класть через -ldflags (как в
    # Makefile проекта), иначе `vals version` показывает `dev` и задача
    # не становится идемпотентной. go build учитывает umask, поэтому права
    # фиксируем ниже.
    - name: Собрать vals из исходного кода
      ansible.builtin.command:
        cmd: >-
          go build -trimpath
          -ldflags "-X main.version={{ vals_version }} -X main.commit={{ vals_repo_state.after }}"
          -o /usr/local/bin/vals ./cmd/vals
        chdir: /usr/local/src/vals
      when: >-
        vals_repo_state.changed
        or vals_installed.rc != 0
        or vals_version not in vals_installed.stdout
      environment:
        GOPATH: /root/go

    - name: Выставить права бинарнику vals
      ansible.builtin.file:
        path: /usr/local/bin/vals
        mode: "0755"

    # --- kubeseal: клиент sealed-secrets ---
    - name: Скачать kubeseal {{ kubeseal_version }}
      ansible.builtin.get_url:
        url: "{{ kubeseal_url }}"
        dest: "/tmp/kubeseal-{{ kubeseal_version }}.tar.gz"
        mode: "0644"
        checksum: "{{ kubeseal_checksum }}"

    - name: Создать каталог для распаковки kubeseal
      ansible.builtin.file:
        path: "/tmp/kubeseal-{{ kubeseal_version }}"
        state: directory
        mode: "0755"

    - name: Распаковать kubeseal {{ kubeseal_version }}
      ansible.builtin.unarchive:
        src: "/tmp/kubeseal-{{ kubeseal_version }}.tar.gz"
        dest: "/tmp/kubeseal-{{ kubeseal_version }}"
        remote_src: true
        creates: "/tmp/kubeseal-{{ kubeseal_version }}/kubeseal"

    - name: Установить kubeseal в /usr/local/bin
      ansible.builtin.copy:
        src: "/tmp/kubeseal-{{ kubeseal_version }}/kubeseal"
        dest: /usr/local/bin/kubeseal
        mode: "0755"
        remote_src: true

    # --- argocd: CLI пробного стенда ---
    # Отдельная секция, а не host_packages: в репозиториях Fedora пакета нет,
    # а в релизе GitHub лежит сырой бинарник без архива. get_url с checksum
    # идемпотентен — повторный прогон ничего не делает, пока файл совпадает.
    # Если стенд снимается (argocd/README.md), убрать и эту секцию.
    - name: Установить argocd CLI {{ argocd_version }} в /usr/local/bin
      ansible.builtin.get_url:
        url: "{{ argocd_cli_url }}"
        dest: /usr/local/bin/argocd
        checksum: "{{ argocd_cli_checksum }}"
        mode: "0755"

    # --- kubectl-cnpg: плагин оператора CloudNativePG ---
    # В релизах CNPG есть RPM, но подписан он cosign, а не GPG, поэтому dnf
    # подпись всё равно не проверит. Скачиваем RPM с sha256 из checksums.txt
    # релиза и ставим локальным файлом — так целостность проверяется.
    - name: Скачать RPM kubectl-cnpg {{ kubectl_cnpg_version }}
      ansible.builtin.get_url:
        url: "{{ kubectl_cnpg_rpm_url }}"
        dest: "/tmp/kubectl-cnpg-{{ kubectl_cnpg_version }}.rpm"
        mode: "0644"
        checksum: "{{ kubectl_cnpg_rpm_checksum }}"

    - name: Установить kubectl-cnpg
      ansible.builtin.dnf5:
        name: "/tmp/kubectl-cnpg-{{ kubectl_cnpg_version }}.rpm"
        state: present
        disable_gpg_check: true

    # --- Пакеты и группы ---

    - name: Установить пакеты хоста
      ansible.builtin.dnf5:
        name: "{{ host_packages }}"
        state: present

    - name: Установить группы пакетов
      ansible.builtin.dnf5:
        name: "{{ host_groups }}"
        state: present

    - name: Убрать осиротевшие зависимости
      ansible.builtin.dnf5:
        autoremove: true

    # --- Docker daemon.json ---

    - name: Скопировать /etc/docker/daemon.json из репозитория
      ansible.builtin.copy:
        src: "{{ playbook_dir }}/../etc/docker/daemon.json"
        dest: /etc/docker/daemon.json
        mode: "0644"
      notify: restart docker

    # --- Автообновления безопасности ---

    - name: Скопировать конфигурацию dnf-automatic
      ansible.builtin.copy:
        src: "{{ playbook_dir }}/../etc/dnf/automatic.conf"
        dest: /etc/dnf/automatic.conf
        mode: "0644"
      notify: restart dnf-automatic

    - name: Включить и запустить таймер dnf-automatic
      ansible.builtin.systemd:
        name: dnf-automatic.timer
        enabled: true
        state: started

    # --- Fail2ban ---

    - name: Скопировать конфигурацию fail2ban
      ansible.builtin.copy:
        src: "{{ playbook_dir }}/../etc/fail2ban/jail.local"
        dest: /etc/fail2ban/jail.local
        mode: "0644"
      notify: restart fail2ban

    - name: Включить и запустить fail2ban
      ansible.builtin.systemd:
        name: fail2ban
        enabled: true
        state: started

    # --- Inotify: бюджет файловых наблюдателей для контейнеров ---

    - name: Скопировать sysctl-настройку inotify
      ansible.builtin.copy:
        src: "{{ playbook_dir }}/../etc/sysctl.d/99-inotify.conf"
        dest: /etc/sysctl.d/99-inotify.conf
        mode: "0644"
      notify: reload sysctl

    # --- Tailscale + kube-proxy: policy routing ---
    # Без этого правила ответы сервисов кластера (externalIPs/NodePort) к
    # tailnet-клиентам уходят в LAN (enp2s0) вместо tailscale0. Разбор:
    # docs/troubleshot/tailscale-k8s-ingress-access.md, юнит —
    # etc/systemd/tailscale-policy-route.service.
    - name: Скопировать systemd-юнит с policy routing для Tailscale
      ansible.builtin.copy:
        src: "{{ playbook_dir }}/../etc/systemd/tailscale-policy-route.service"
        dest: /etc/systemd/system/tailscale-policy-route.service
        mode: "0644"
      notify: restart tailscale-policy-route

    - name: Включить и запустить tailscale-policy-route
      ansible.builtin.systemd:
        name: tailscale-policy-route.service
        enabled: true
        state: started
        daemon_reload: true

    # --- Longhorn: подготовка узла ---
    # Longhorn (argocd/applications/longhorn.yaml) требует на каждом узле: iscsid для
    # iSCSI-томов V1 data engine, NFSv4-клиент для RWX и backup target, и
    # SELinux-модуль ниже. Повторять для каждой новой ноды.
    - name: Включить и запустить iscsid
      ansible.builtin.systemd:
        name: iscsid
        enabled: true
        state: started

    - name: Создать каталог данных Longhorn
      ansible.builtin.file:
        path: "{{ longhorn_data_path }}"
        state: directory
        mode: "0755"

    - name: Разложить SELinux-модуль для Longhorn во временный каталог
      ansible.builtin.copy:
        src: "{{ playbook_dir }}/../etc/selinux/{{ longhorn_selinux_cil }}"
        dest: "/tmp/{{ longhorn_selinux_cil }}"
        mode: "0644"
      when: ansible_facts.selinux.status | default('') == 'enabled'

    # Список модулей — единственный способ узнать, установлен ли модуль:
    # semodule -vi идемпотентности не даёт и всегда рапортует changed.
    - name: Прочитать список SELinux-модулей
      ansible.builtin.command:
        cmd: semodule -l
      register: selinux_modules
      changed_when: false
      when: ansible_facts.selinux.status | default('') == 'enabled'

    - name: Установить SELinux-модуль, разрешающий iscsid_t dac_override
      ansible.builtin.command:
        cmd: "semodule -vi /tmp/{{ longhorn_selinux_cil }}"
      when:
        - ansible_facts.selinux.status | default('') == 'enabled'
        - "'local_longhorn' not in (selinux_modules.stdout | default(''))"

  handlers:
    - name: reload sysctl
      # Быстрое применение sysctl без ребута; выполняется только при изменении файла.
      ansible.builtin.command:
        cmd: sysctl --system
      changed_when: true

    - name: restart docker
      ansible.builtin.systemd:
        name: docker
        state: restarted

    - name: restart dnf-automatic
      ansible.builtin.systemd:
        name: dnf-automatic
        state: restarted

    - name: restart fail2ban
      ansible.builtin.systemd:
        name: fail2ban
        state: restarted

    - name: restart tailscale-policy-route
      ansible.builtin.systemd:
        name: tailscale-policy-route.service
        daemon_reload: true
        state: restarted

---
# Плейбук: репозитории → пакеты → группы → чистка.
# Запуск на сервере homelab:
#   cd /home/artlab/projects/homelab/ansible && ansible-playbook host.yml
# Dry-run (ничего не меняет):
#   ansible-playbook host.yml --check --diff

- name: Пакеты и репозитории хоста homelab
  hosts: homelab
  become: true
  gather_facts: true

  vars_files:
    - group_vars/all.yml

  tasks:
    # Плагины dnf нужны для управления репозиториями (dnf copr).
    - name: Установить плагины dnf для управления репозиториями
      ansible.builtin.dnf5:
        name:
          - dnf-plugins-core
          - dnf5-plugins
        state: present

    # --- Сторонние репозитории ---

    - name: Подключить репозиторий Docker CE Stable
      ansible.builtin.yum_repository:
        name: docker-ce-stable
        description: Docker CE Stable - $basearch
        baseurl: https://download.docker.com/linux/fedora/$releasever/$basearch/stable
        gpgcheck: true
        gpgkey: https://download.docker.com/linux/fedora/gpg
        enabled: true
        file: docker-ce

    - name: Подключить репозиторий Tailscale
      ansible.builtin.yum_repository:
        name: tailscale-stable
        description: Tailscale stable
        baseurl: https://pkgs.tailscale.com/stable/fedora/$basearch
        gpgcheck: true
        gpgkey: https://pkgs.tailscale.com/stable/fedora/repo.gpg
        repo_gpgcheck: true
        enabled: true
        file: tailscale

    - name: Подключить COPR-репозиторий lazygit
      community.general.copr:
        name: dejan/lazygit
        state: enabled
        host: copr.fedorainfracloud.org

    # --- Шифрование секретов (SOPS + age) ---

    # Официального пакета sops в Fedora нет — ставим статический бинарник
    # из релиза GitHub. Checksum фиксирует версию (см. group_vars/all.yml).
    - name: Установить бинарник sops
      ansible.builtin.get_url:
        url: "{{ sops_url }}"
        dest: /usr/local/bin/sops
        mode: "0755"
        checksum: "{{ sops_checksum }}"

    # age ставим из архива релиза: сначала скачиваем и распаковываем во
    # временный каталог, затем копируем бинарники в /usr/local/bin.
    - name: Скачать архив age
      ansible.builtin.get_url:
        url: "{{ age_url }}"
        dest: "/tmp/age-v{{ age_version }}-linux-amd64.tar.gz"
        mode: "0644"
        checksum: "{{ age_tarball_checksum }}"

    - name: Распаковать архив age во временный каталог
      ansible.builtin.unarchive:
        src: "/tmp/age-v{{ age_version }}-linux-amd64.tar.gz"
        dest: "/tmp/age-v{{ age_version }}"
        remote_src: true
        creates: "/tmp/age-v{{ age_version }}/age/age"

    - name: Установить бинарники age и age-keygen
      ansible.builtin.copy:
        src: "/tmp/age-v{{ age_version }}/age/{{ item }}"
        dest: "/usr/local/bin/{{ item }}"
        mode: "0755"
        remote_src: true
      loop:
        - age
        - age-keygen

    - name: Удалить временные файлы установки age
      ansible.builtin.file:
        path: "{{ item }}"
        state: absent
      loop:
        - "/tmp/age-v{{ age_version }}-linux-amd64.tar.gz"
        - "/tmp/age-v{{ age_version }}"

    # --- Чистка устаревших репозиториев ---

    - name: Удалить устаревший репозиторий Jenkins (пакет давно удалён)
      ansible.builtin.file:
        path: /etc/yum.repos.d/jenkins.repo
        state: absent

    # --- Пакеты и группы ---

    - name: Установить пакеты хоста
      ansible.builtin.dnf5:
        name: "{{ host_packages }}"
        state: present

    - name: Установить группы пакетов
      ansible.builtin.dnf5:
        name: "{{ host_groups }}"
        state: present

    - name: Убедиться, что запрещённые пакеты отсутствуют
      ansible.builtin.dnf5:
        name: "{{ host_packages_absent }}"
        state: absent
        autoremove: false

    # Убирает «осиротевшие» пакеты, оставшиеся как зависимости.
    # Безопасно (не трогает пакеты из списка), но можно закомментировать.
    - name: Убрать осиротевшие зависимости
      ansible.builtin.dnf5:
        autoremove: true

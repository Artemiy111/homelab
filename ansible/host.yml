---
# Плейбук: подготовка хоста homelab. Тонкая оболочка — вся логика в ролях
# (ansible/roles/), по роли на зону ответственности.
# Запуск на сервере homelab:
#   cd /home/artlab/projects/homelab/ansible && ansible-playbook host.yml
# Dry-run (ничего не меняет):
#   ansible-playbook host.yml --check --diff --ask-become-pass

- name: Подготовка хоста homelab
  hosts: homelab
  become: true
  # Факты нужны роли longhorn_prereqs (ansible_facts.selinux).
  gather_facts: true
  roles:
    - base
    - cli_tools
    - docker
    - autoupdates
    - fail2ban
    - sysctl
    - tailscale_policy_route
    - longhorn_prereqs

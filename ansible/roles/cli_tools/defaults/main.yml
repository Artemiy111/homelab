---
# --- Шифрование секретов (SOPS) ---

# Официального репозитория sops в Fedora нет — RPM из релиза GitHub.
cli_tools_sops_version: "3.13.3"
cli_tools_sops_url_base: "https://github.com/getsops/sops/releases/download/v"
cli_tools_sops_rpm: "sops-{{ cli_tools_sops_version }}-1.x86_64.rpm"
cli_tools_sops_rpm_url: "{{ cli_tools_sops_url_base }}{{ cli_tools_sops_version }}/{{ cli_tools_sops_rpm }}"

# --- vals: рендер шаблонов конфигов с подстановкой секретов ---

# Ставим из исходного кода, пин по тегу релиза (нужны golang и git).
cli_tools_vals_version: "v0.46.0"
cli_tools_vals_repo: "https://github.com/helmfile/vals.git"

# --- kubeseal: клиент sealed-secrets (шифрование секретов для Kubernetes) ---
# Версия обязана совпадать с версией контроллера (чарт sealed-secrets).
cli_tools_kubeseal_version: "0.40.0"
cli_tools_kubeseal_url_base: "https://github.com/bitnami/sealed-secrets/releases/download/v"
cli_tools_kubeseal_tarball: "kubeseal-{{ cli_tools_kubeseal_version }}-linux-amd64.tar.gz"
cli_tools_kubeseal_url: "{{ cli_tools_kubeseal_url_base }}{{ cli_tools_kubeseal_version }}/{{ cli_tools_kubeseal_tarball }}"
# SHA256 из sealed-secrets_0.40.0_checksums.txt (целостность при скачивании).
cli_tools_kubeseal_checksum: "sha256:9314c35916646e9d59c8f06b1314574b4e79c4d76f079433607ed7b697bb5eb7"

# --- argocd: CLI для пробного стенда (argocd) ---
# Версия обязана совпадать с версией сервера Argo CD. Сейчас это appVersion
# чарта argo/argo-cd 10.9.1 → v3.5.3; при апгрейде чарта поднимать и пин.
cli_tools_argocd_version: "3.5.3"
cli_tools_argocd_cli_url: "https://github.com/argoproj/argo-cd/releases/download/v{{ cli_tools_argocd_version }}/argocd-linux-amd64"
# SHA256 из cli_checksums.txt того же релиза (целостность при скачивании).
cli_tools_argocd_cli_checksum: "sha256:b860f73f57cbddd993cd446f5236d797c1b1ac8554857b2683d2669f17e765b4"

# --- kubectl-cnpg: плагин оператора CloudNativePG (platform/cnpg) ---
# Версию держать не ниже версии оператора в кластере (сейчас 1.30.0 —
# appVersion чарта cloudnative-pg 0.29.0): старый плагин не знает новых полей CR.
cli_tools_kubectl_cnpg_version: "1.30.0"
cli_tools_kubectl_cnpg_url_base: "https://github.com/cloudnative-pg/cloudnative-pg/releases/download/v"
cli_tools_kubectl_cnpg_rpm: "kubectl-cnpg_{{ cli_tools_kubectl_cnpg_version }}_linux_x86_64.rpm"
cli_tools_kubectl_cnpg_rpm_url: "{{ cli_tools_kubectl_cnpg_url_base }}{{ cli_tools_kubectl_cnpg_version }}/{{ cli_tools_kubectl_cnpg_rpm }}"
# SHA256 из cnpg-{{ cli_tools_kubectl_cnpg_version }}-checksums.txt того же релиза.
cli_tools_kubectl_cnpg_rpm_checksum: "sha256:80879096796b25f850c06942c0a59b5d89655d9d9afbaf89e2460c9faa51d519"

---
# Fail2ban: защита SSH.

- name: Скопировать конфигурацию fail2ban
  ansible.builtin.copy:
    src: "{{ repo_root }}/etc/fail2ban/jail.local"
    dest: /etc/fail2ban/jail.local
    mode: "0644"
  notify: Restart fail2ban

- name: Включить и запустить fail2ban
  ansible.builtin.systemd:
    name: fail2ban
    enabled: true
    state: started

---
# Путь к kubeconfig и пользователь, которому он принадлежит.
#
# От root kubectl на узле не работает: у k0s-worker нет админского kubeconfig,
# kubelet.conf не даёт прав читать Secret. Конфиг принадлежит artlab с правами
# 0600, поэтому kubectl запускается от него, а файлы в /etc/pki — от root.
internal_ca_kubeconfig: /home/artlab/.kube/config
internal_ca_kube_user: artlab
internal_ca_secret: homelab-internal-ca
internal_ca_namespace: cert-manager
internal_ca_anchor: /etc/pki/ca-trust/source/anchors/homelab-internal-ca.crt

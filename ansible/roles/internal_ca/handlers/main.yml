---
# Пересборка каталогов доверия идёт хендлером, а не обычной задачей: она нужна
# только после изменения якоря. ansible-lint требует именно такого оформления, и
# по смыслу оно верное — пересборка без изменения входа делала бы работу впустую.
#
# Имя хендлера обязано совпадать с notify в tasks: потерять совпадение легко, и
# тогда роль отработает с changed, ничего не пересобрав, и тихо.
- name: Пересобрать каталоги доверия
  ansible.builtin.command:
    cmd: update-ca-trust extract
  changed_when: true

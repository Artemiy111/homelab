---
# Пересборка bundle идёт хендлером, а не обычной задачей: она нужна только
# после изменения якоря. ansible-lint требует именно такого оформления, и по
# смыслу оно верное — пересборка без изменения входа делала бы работу впустую.
- name: Пересобрать bundle доверенных сертификатов
  ansible.builtin.command:
    cmd: update-ca-trust extract
  changed_when: true

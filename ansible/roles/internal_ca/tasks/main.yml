---
# Внутренний CA homelab в системное хранилище доверенных сертификатов.
#
# Зачем: containerd на узле тянет образы по HTTPS и проверяет цепочку. Для
# внутреннего имени реестра сертификат выпущен нашим CA, а не Let's Encrypt,
# поэтому без этого якоря доверия pull падает с
# `x509: certificate signed by unknown authority`.
#
# Почему CA берётся из Secret кластера, а не из файла репозитория: так ключ CA
# вообще не покидает кластер, а в репозитории лежит только публичная часть.
# Публичная копия тоже есть (platform/homelab/files/internal-ca.crt) — из неё
# Argo получает доверенный корень в argocd-tls-certs-cm.
#
# Если CA когда-нибудь перегенерируют, нужно обновить обе копии: файл в
# репозитории и Secret в кластере. Синхронизации нет намеренно — CA живёт 10 лет,
# а листья обновляются сами.

# argv, а не cmd: модуль command режет строку cmd через shlex.split, а в shlex
# обратный слэш — экранирующий символ. `jsonpath={.data.ca\.crt}` после shlex
# становится `jsonpath={.data.ca.crt}`, и kubectl на такой строке не падает:
# код выхода 0 и пустой stdout. Молчаливая пустота выглядит как «сертификата
# нет», хотя он есть. argv передаётся как есть, без shlex.
- name: Прочитать публичный сертификат CA из Secret кластера
  ansible.builtin.command:
    argv:
      - kubectl
      - -n
      - "{{ internal_ca_namespace }}"
      - get
      - secret
      - "{{ internal_ca_secret }}"
      - -o
      # Одинарные кавычки: в YAML двойные кавычки считают `\.` невалидным
      # escape, а одинарные не экранируют ничего, кроме `''`.
      - 'jsonpath={.data.ca\.crt}'
  environment:
    KUBECONFIG: "{{ internal_ca_kubeconfig }}"
  become: true
  become_user: "{{ internal_ca_kube_user }}"
  register: internal_ca_b64
  changed_when: false

- name: Декодировать сертификат CA
  ansible.builtin.set_fact:
    internal_ca_pem: "{{ internal_ca_b64.stdout | b64decode }}"

- name: Убедиться, что получен сертификат, а не ключ
  ansible.builtin.assert:
    that:
      - "'BEGIN CERTIFICATE' in internal_ca_pem"
      - "'PRIVATE KEY' not in internal_ca_pem"
    fail_msg: >-
      Secret {{ internal_ca_namespace }}/{{ internal_ca_secret }} не отдал
      сертификат CA. Проверь, что Certificate homelab-internal-ca в состоянии
      Ready, иначе node trust будет поставлен битым.

# Fedora кладёт корни в /etc/pki/ca-trust/source/anchors, а update-ca-trust
# пересобирает из них каталоги доверия. Кладём якорь, а не правим вывод
# вручную: он перезаписывается при обновлении пакета ca-certificates.
- name: Установить якорь доверия к внутреннему CA
  ansible.builtin.copy:
    content: "{{ internal_ca_pem }}"
    dest: "{{ internal_ca_anchor }}"
    owner: root
    group: root
    mode: "0644"
  register: internal_ca_anchor_result
  notify: Пересобрать каталоги доверия

# Пересборка — в handlers/main.yml: срабатывает только при изменении якоря.
# Ansible выполняет хендлеры в конце плейбука, а проверка ниже должна видеть уже
# пересобранное хранилище. Без flush она сравнивала бы старую копию и ругалась
# бы впустую.
- name: Применить пересборку до проверки
  ansible.builtin.meta: flush_handlers

# Проверяем каталог доверия, а не bundle-файл: на Fedora update-ca-trust
# раздаёт корни как /etc/pki/tls/certs/<hash>.0 — симлинками в
# /etc/pki/ca-trust/extracted/pem/directory-hash/. Файла
# /etc/pki/tls/certs/ca-bundle.crt в этой системе нет, и опора на него давала
# ложный вывод при полностью рабочем доверии.
- name: Проверить, что CA доступен системному поиску доверия
  ansible.builtin.command:
    argv:
      - openssl
      - verify
      - -CApath
      - /etc/pki/tls/certs
      - "{{ internal_ca_anchor }}"
  changed_when: false
  register: internal_ca_trust_check
  failed_when: false

- name: Сообщить, если CA недоступен системному поиску доверия
  ansible.builtin.debug:
    msg: >-
      Системный каталог доверия не подтвердил наш CA:
      {{ internal_ca_trust_check.stderr | default(internal_ca_trust_check.stdout) }}
      Ни curl, ни containerd не будут доверять реестру по внутреннему имени.
  when: internal_ca_trust_check.rc != 0

# Второй, более коварный случай: каталог доверия уже содержит CA, поэтому
# проверка выше проходит, а containerd всё равно его не видит. Он читает
# системный пул один раз при старте и держит в памяти, поэтому процесс,
# запущенный до записи якоря, не подхватит его никогда.
#
# Сравниваем не время старта containerd, а время старта узла: systemd на этой
# версии не отдаёт ActiveEnterTimestampUSec в микросекундах, а uptime из
# /proc/uptime есть всегда и не зависит от версии systemd. Если узел работает
# дольше, чем существует якорь, значит якорь записан при работающем узле, и
# containerd в лучшем случае подхватил его, а в худшем — нет.
- name: Узнать, сколько секунд работает узел
  ansible.builtin.command:
    argv:
      - awk
      - '{print $1}'
      - /proc/uptime
  changed_when: false
  register: internal_ca_uptime

- name: Запомнить время записи якоря
  ansible.builtin.stat:
    path: "{{ internal_ca_anchor }}"
  register: internal_ca_anchor_stat

- name: Сообщить, что containerd может не доверять CA до перезагрузки
  ansible.builtin.debug:
    msg: >-
      Узел работает {{ internal_ca_uptime.stdout | int }} с, а якорь CA записан
      {{ (internal_ca_anchor_stat.stat.mtime | int) - (ansible_date_time.epoch | int) | abs }} с назад.
      containerd кэширует пул доверия на старте, поэтому образы по внутреннему
      имени не поедут, пока узел не перезагрузить. После ребута повторите
      ansible-playbook host.yml --tags internal_ca, чтобы пересобрать якорь и
      убрать это предупреждение.
  when: >-
    internal_ca_uptime.stdout | int >
    ((internal_ca_anchor_stat.stat.mtime | int) - (ansible_date_time.epoch | int)) | abs

---
# Плейбук: деплой контроллера sealed-secrets в kube-system через Helm.
# kubeseal-клиент ставится отдельно в host.yml.
#
# Запуск на сервере homelab (Ansible крутится локально):
#   cd /home/artlab/projects/homelab/ansible && ansible-playbook sealed-secrets.yml
#
# Плейбук идемпотентен: helm upgrade --install не ломает уже задеплоенное.
- name: Контроллер sealed-secrets
  hosts: homelab
  become: false
  gather_facts: false

  vars:
    sealed_secrets_namespace: kube-system
    sealed_secrets_release: sealed-secrets
    sealed_secrets_chart_repo: "https://bitnami-labs.github.io/sealed-secrets-charts"
    sealed_secrets_chart: "sealed-secrets/sealed-secrets"
    sealed_secrets_values: "{{ playbook_dir }}/../k8s/sealed-secrets/values.yaml"

  tasks:
    - name: Добавить Helm-репозиторий sealed-secrets
      ansible.builtin.command:
        cmd: "helm repo add sealed-secrets {{ sealed_secrets_chart_repo }}"
      register: helm_repo
      failed_when: helm_repo.rc != 0 and 'already exists' not in helm_repo.stderr
      changed_when: helm_repo.rc == 0

    - name: Обновить Helm-репозиторий sealed-secrets
      # Только нужный репозиторий: голый `helm repo update` обновляет все
      # и падает, если какой-то чужой репозиторий (напр. kubernetes-dashboard) битый.
      ansible.builtin.command: helm repo update sealed-secrets
      changed_when: false

    - name: Установить / обновить контроллер sealed-secrets
      ansible.builtin.command:
        cmd: >-
          helm upgrade --install {{ sealed_secrets_release }}
          -n {{ sealed_secrets_namespace }} --create-namespace
          -f {{ sealed_secrets_values }}
          {{ sealed_secrets_chart }}
      changed_when: false

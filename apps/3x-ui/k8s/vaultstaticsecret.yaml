apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultStaticSecret
metadata:
  name: 3x-ui-admin
  namespace: 3x-ui
spec:
  vaultAuthRef: vso-3x-ui
  mount: kv
  type: kv-v2
  path: 3x-ui/admin
  refreshAfter: 1h
  destination:
    name: 3x-ui-admin
    create: true
    overwrite: true
    transformation:
      excludeRaw: true

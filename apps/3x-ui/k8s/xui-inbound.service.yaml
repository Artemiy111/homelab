apiVersion: v1
kind: Service
metadata:
  name: xui-inbound
  namespace: 3x-ui
spec:
  # Inbound Xray публикуется на IP узла (.254): так же, как раньше через Docker,
  # и чтобы работал NAT на роутере → 192.0.2.10:8443. kube-proxy делает DNAT,
  # поэтому firewalld INPUT не мешает.
  type: ClusterIP
  externalIPs:
    - 192.0.2.10
  selector:
    app: 3x-ui
  ports:
    - name: inbound-tcp
      port: 8443
      targetPort: inbound-tcp
      protocol: TCP
    - name: inbound-udp
      port: 8443
      targetPort: inbound-udp
      protocol: UDP

apiVersion: v1
kind: Service
metadata:
  # Имя латиницей: DNS-метка Service не может начинаться с цифры, поэтому
  # в кластере 3x-ui доступен как xui (Gatus: tcp://xui:2053).
  name: xui
  namespace: 3x-ui
spec:
  type: ClusterIP
  selector:
    app: 3x-ui
  ports:
    - name: panel
      port: 2053
      targetPort: panel
      protocol: TCP

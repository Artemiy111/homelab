apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: alloy-profiler
  namespace: monitoring
  annotations:
    # hostPID обязателен: без него Alloy не видит процессы соседних
    # контейнеров на узле. Привилегированный контейнер не используется —
    # хватает перечисленных capabilities.
    ignore-check.kube-linter.io/host-pid: "eBPF-профилирование требует видимости процессов узла (#559)"
    ignore-check.kube-linter.io/privilege-escalation-container: "CAP_SYS_ADMIN обязателен для eBPF uprobe/perf_event (#559)"
spec:
  revisionHistoryLimit: 2
  selector:
    matchLabels:
      app: alloy-profiler
  updateStrategy:
    type: RollingUpdate
  template:
    metadata:
      labels:
        app: alloy-profiler
    spec:
      serviceAccountName: alloy-profiler
      hostPID: true
      enableServiceLinks: false
      containers:
        - name: alloy-profiler
          image: "grafana/alloy:v1.20.0@sha256:f111cce835516c5f99166342be7038496b52ced16667be5a11e19258a3e4cd30"
          args:
            - run
            - --server.http.listen-addr=0.0.0.0:12345
            - --storage.path=/var/lib/alloy/data
            - /etc/alloy/config.alloy
          env:
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  # Имя НОДЫ, а не пода: по нему фильтруется выборка
                  # discovery.kubernetes (spec.nodeName).
                  fieldPath: spec.nodeName
            - name: TZ
              valueFrom:
                configMapKeyRef:
                  name: homelab-config
                  key: TZ
          ports:
            - name: http
              containerPort: 12345
          securityContext:
            # eBPF-сэмплирование стеков требует root: perf_event_open,
            # чтение /proc/<pid>/stack и maps чужих процессов.
            runAsUser: 0
            allowPrivilegeEscalation: false
            capabilities:
              # Тот же набор, что у Beyla (#542): PERFMON — perf_event_open
              # и загрузка BPF-программ, SYS_ADMIN — uprobe'ы и стек,
              # NET_RAW — сокет-фильтры, DAC_READ_SEARCH и CHECKPOINT_RESTORE —
              # чтение ELF, SYS_PTRACE — доступ к /proc и namespace'ам.
              add:
                - BPF
                - SYS_ADMIN
                - SYS_PTRACE
                - NET_RAW
                - DAC_READ_SEARCH
                - PERFMON
                - CHECKPOINT_RESTORE
                # Чтение адресов в /proc/kallsyms. Без него eBPF-трассировщик
                # не стартует: "failed to read kernel symbols: unable to read
                # kallsyms addresses - check capabilities". Ядро скрывает адреса
                # (kptr_restrict) и открывает их только этой capability.
                - SYSLOG
                # Подъём memlock rlimit. Без неё не грузятся eBPF-карты:
                # "failed to adjust rlimit: operation not permitted".
                - SYS_RESOURCE
              drop:
                - ALL
          volumeMounts:
            - name: config
              mountPath: /etc/alloy
              readOnly: true
            - name: data
              mountPath: /var/lib/alloy/data
            - name: bpffs
              mountPath: /sys/fs/bpf
              mountPropagation: HostToContainer
            - name: tracefs
              mountPath: /sys/kernel/tracing
              readOnly: true
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
      tolerations:
        - effect: NoSchedule
          operator: Exists
        - effect: NoExecute
          operator: Exists
      volumes:
        - name: config
          configMap:
            name: alloy-profiler-config
        - name: data
          emptyDir: {}
        # bpffs нужен, чтобы pinned BPF-карты были видны и Beyla, и
        # профайлеру: без них не работает связка trace→profile.
        - name: bpffs
          hostPath:
            path: /sys/fs/bpf
            type: Directory
        - name: tracefs
          hostPath:
            path: /sys/kernel/tracing
            type: Directory

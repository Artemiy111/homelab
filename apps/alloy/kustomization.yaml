apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: monitoring
resources:
  - k8s/alloy-rbac.yaml
  - k8s/alloy.daemonset.yaml
  - k8s/alloy.service.yaml
configMapGenerator:
  # config.alloy собирается в ConfigMap `alloy-config`; kustomize добавляет хэш
  # содержимого к имени и переписывает ссылку в DaemonSet, поэтому правка
  # конфига сама запускает rollout.
  - name: alloy-config
    files:
      - config/config.alloy

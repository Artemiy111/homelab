apiVersion: apps/v1
kind: Deployment
metadata:
  name: athens
  namespace: athens
spec:
  replicas: 1
  selector:
    matchLabels:
      app: athens
  template:
    metadata:
      labels:
        app: athens
    spec:
      # Kubernetes иначе инжектит в под env сервиса, в т. ч.
      # ATHENS_PORT=tcp://<ClusterIP>:80, а Athens читает ATHENS_PORT как свой
      # порт и падает на "too many colons in address".
      enableServiceLinks: false
      containers:
        - name: athens
          image: "gomods/athens:v0.18.1@sha256:cbf1a5e4649a06b6d0089088aa47880af7908f908716f679aa9ac842dfe60b85"
          args:
            - athens-proxy
            - -config_file=/config/config.toml
          ports:
            - name: http
              containerPort: 3000
          env:
            # Образ создаёт пользователя athens (uid 1000), но HOME в pod не
            # проставляется; без него `go` внутри Athens не находит кэш-каталог.
            - name: HOME
              value: /home/athens
          resources:
            limits:
              cpu: "1"
              memory: 1Gi
            requests:
              cpu: 50m
              memory: 128Mi
          volumeMounts:
            - name: config
              readOnly: true
              mountPath: /config/config.toml
              subPath: config.toml
            - name: data
              mountPath: /var/lib/athens
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 30
          startupProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 5
            failureThreshold: 30
          securityContext:
            capabilities:
              drop: ["ALL"]
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            seccompProfile:
              type: RuntimeDefault
      volumes:
        - name: config
          configMap:
            name: athens
        - name: data
          persistentVolumeClaim:
            claimName: athens-data
      securityContext:
        # fsGroup даёт групповую запись в том Longhorn под uid/gid 1000.
        fsGroup: 1000
  # RWO-том: два пода одновременно его не смонтируют.
  strategy:
    type: Recreate
  revisionHistoryLimit: 2

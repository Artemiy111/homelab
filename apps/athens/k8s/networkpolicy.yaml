# Базовый NetworkPolicy: default-deny ingress + явные разрешения.
# Athens наружу (через Traefik) не публикуется — это внутренний кэш для CI,
# поэтому единственный внешний потребитель — раннер с его DinD в namespace
# forgejo. Egress не ограничивается: Athens ходит в upstream (proxy.golang.org,
# sum.golang.org).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-ingress
  namespace: athens
spec:
  podSelector: {}
  policyTypes:
    - Ingress
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-ingress
  namespace: athens
spec:
  podSelector: {}
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector: {}
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: forgejo
      ports:
        - port: 3000
          protocol: TCP

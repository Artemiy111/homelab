# Базовый NetworkPolicy: default-deny ingress + явные разрешения.
# Потребители Athens: раннер с DinD (namespace forgejo) и Traefik (маршрут
# goproxy.<домен> для браузера и сборок с хоста). Egress не ограничивается:
# Athens ходит в upstream (proxy.golang.org, sum.golang.org).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-ingress
  namespace: athens
spec:
  podSelector: {}
  policyTypes:
    - Ingress
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-ingress
  namespace: athens
spec:
  podSelector: {}
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector: {}
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: forgejo
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: traefik
      ports:
        - port: 3000
          protocol: TCP

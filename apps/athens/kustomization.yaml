apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: athens
resources:
  - k8s/data.pvc.yaml
  - k8s/deployment.yaml
  - k8s/namespace.yaml
  - k8s/networkpolicy.yaml
  - k8s/service.yaml
configMapGenerator:
  # config.toml собирается в ConfigMap `athens`; kustomize добавляет хэш
  # содержимого к имени и переписывает ссылку в Deployment, поэтому правка
  # конфига сама запускает rollout.
  - name: athens
    files:
      - config/config.toml

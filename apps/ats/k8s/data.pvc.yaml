# Дисковый кэш ATS (cache.db фиксированного размера). Потеря тома означает лишь
# повторную загрузку из upstream, поэтому longhorn без Retain. RWO-том на одной
# ноде требует strategy.type: Recreate у Deployment.
# Размер кэша в storage.config (4G) задаётся меньше объёма тома: Longhorn отдаёт
# ФС чуть меньше заявленного, файл кэша впритык не создастся.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: ats-cache
  namespace: ats
spec:
  storageClassName: longhorn
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 5Gi

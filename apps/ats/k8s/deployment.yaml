apiVersion: apps/v1
kind: Deployment
metadata:
  name: ats
  namespace: ats
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ats
  # RWO-том: два пода одновременно его не смонтируют.
  strategy:
    type: Recreate
  revisionHistoryLimit: 2
  template:
    metadata:
      labels:
        app: ats
    spec:
      enableServiceLinks: false
      containers:
        - name: ats
          image: "trafficserver/trafficserver:10.2.0@sha256:8b6d118cfbe220f7e034bd0431c1bfd9325b275f456ecc3ba95f9b46a552ced3"
          # Секрет PURGE подставляется в remap.config на старте (см. run.sh).
          # Шелл нужен для подстановки; exec внутри run.sh сохраняет PID 1.
          command: ["/bin/sh", "/run/ats-src/run.sh"]
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: ATS_PURGE_TOKEN
              valueFrom:
                secretKeyRef:
                  name: ats
                  key: ATS_PURGE_TOKEN
          resources:
            limits:
              cpu: "2"
              memory: 1Gi
            requests:
              cpu: 100m
              memory: 256Mi
          volumeMounts:
            # ConfigMap со всеми конфигами монтируется в staging-каталог, а
            # run.sh копирует их в /opt/etc/trafficserver (там их читает ATS) и
            # подставляет секрет PURGE. Монтировать файлы напрямую в
            # /opt/etc/trafficserver нельзя: они стали бы read-only и
            # подстановка секрета не применилась бы.
            - name: config
              readOnly: true
              mountPath: /run/ats-src
            - name: cache
              mountPath: /var/cache/trafficserver
          livenessProbe:
            tcpSocket:
              port: http
            periodSeconds: 30
          readinessProbe:
            tcpSocket:
              port: http
            periodSeconds: 30
          # Порт занят всё время работы процесса; traffic_server сам ловит
          # конфигурационные ошибки на старте и не открывает сокет, поэтому
          # TCP-проб достаточно.
          startupProbe:
            tcpSocket:
              port: http
            periodSeconds: 5
            failureThreshold: 30
      volumes:
        - name: config
          configMap:
            name: ats
        - name: cache
          persistentVolumeClaim:
            claimName: ats-cache
      # traffic_server всегда сбрасывает привилегии на proxy.config.admin.user_id
      # (в образе это `nobody`, uid/gid 65534, запись read-only) и уже от него
      # пишет cache.db. PVC Longhorn принадлежит root, поэтому даём тому
      # групповую запись для gid nobody через fsGroup.
      securityContext:
        fsGroup: 65534

apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: ats
resources:
  - k8s/namespace.yaml
  - k8s/service.yaml
  - k8s/deployment.yaml
  - k8s/data.pvc.yaml
  - k8s/networkpolicy.yaml
  - k8s/vaultauth.yaml
  - k8s/vaultstaticsecret.yaml
configMapGenerator:
  - name: ats
    files:
      - config/records.yaml
      - config/remap.config
      - config/cache.config
      - config/storage.config
      - config/plugin.config
      - config/ip_allow.yaml
      - config/run.sh

apiVersion: v1
kind: Service
metadata:
  name: authentik
  namespace: default
spec:
  type: ClusterIP
  selector:
    app: authentik
  ports:
    - name: http
      port: 9000
      targetPort: http
      protocol: TCP
    # Prometheus-метрики (скрейпит netdata в кластере).
    - name: metrics
      port: 9300
      targetPort: 9300
      protocol: TCP

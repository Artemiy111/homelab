apiVersion: v1
kind: ServiceAccount
metadata:
  name: vso-authentik
  namespace: authentik
---
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultAuth
metadata:
  name: vso-authentik
  namespace: authentik
spec:
  vaultAuthGlobalRef:
    name: vso-global
    namespace: vault-secrets-operator
  kubernetes:
    role: authentik
    serviceAccount: vso-authentik

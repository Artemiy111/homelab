apiVersion: apps/v1
kind: Deployment
metadata:
  name: beszel-agent
  namespace: beszel
spec:
  strategy:
    type: Recreate
  revisionHistoryLimit: 2
  replicas: 1
  selector:
    matchLabels:
      app: beszel-agent
  template:
    metadata:
      labels:
        app: beszel-agent
    spec:
      # Агент собирает метрики хоста и Docker-контейнеров и слушает unix-сокет,
      # общий с hub: hostNetwork + /var/run/docker.sock.
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      enableServiceLinks: false
      containers:
        - name: beszel-agent
          image: "henrygd/beszel-agent:0.18.7@sha256:8874e2c53f9de5e063a6a80d6b617e20fa593ac5dc4eb4c6ce1f912f510f38f8"
          env:
            - name: DOMAIN
              valueFrom:
                configMapKeyRef:
                  name: homelab-config
                  key: DOMAIN
            - name: TZ
              valueFrom:
                configMapKeyRef:
                  name: homelab-config
                  key: TZ
            - name: BESZEL_AGENT_KEY
              valueFrom:
                secretKeyRef:
                  name: beszel
                  key: BESZEL_AGENT_KEY
            - name: BESZEL_AGENT_TOKEN
              valueFrom:
                secretKeyRef:
                  name: beszel
                  key: BESZEL_AGENT_TOKEN
            - name: LISTEN
              value: /beszel_socket/beszel.sock
            - name: HUB_URL
              value: "https://beszel.$(DOMAIN)"
            - name: KEY
              value: "$(BESZEL_AGENT_KEY)"
            - name: TOKEN
              value: "$(BESZEL_AGENT_TOKEN)"
          startupProbe:
            exec:
              command: ["/agent", "health"]
            initialDelaySeconds: 10
            periodSeconds: 5
            failureThreshold: 30
          livenessProbe:
            exec:
              command: ["/agent", "health"]
            periodSeconds: 120
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            exec:
              command: ["/agent", "health"]
            periodSeconds: 120
            timeoutSeconds: 5
            failureThreshold: 3
          securityContext:
            runAsUser: 0
            runAsGroup: 0
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            seccompProfile:
              type: RuntimeDefault
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: "1"
              memory: 512Mi
          volumeMounts:
            - name: agent
              mountPath: /var/lib/beszel-agent
            - name: socket
              mountPath: /beszel_socket
            - name: docker-sock
              mountPath: /var/run/docker.sock
              readOnly: true
      volumes:
        - name: agent
          persistentVolumeClaim:
            claimName: beszel-agent
        - name: socket
          hostPath:
            path: /storage/apps/beszel/socket
            type: Directory
        - name: docker-sock
          hostPath:
            path: /var/run/docker.sock
            type: Socket

# Grafana Beyla — eBPF-автоинструментация.
# Трейсы и RED-метрики сервисов перечисленных ниже namespace'ов без изменений
# в приложениях. Список намеренноallowlist, а не «всё кроме»: новое
# приложение не начнёт отдавать телеметрию молча.
log_level: INFO
log_format: json

# Декорирование k8s-метаданными: k8s.namespace.name, k8s.deployment.name,
# k8s.pod.name и т.д. Требует ServiceAccount с list/watch (k8s/rbac.yaml).
attributes:
  kubernetes:
    enable: true

otel_metrics_export:
  endpoint: http://otel-collector.monitoring.svc.cluster.local:4317
  protocol: grpc
  interval: 30s
  features:
    - application
    - application_span_otel
    - application_service_graph
    - application_runtime

otel_traces_export:
  endpoint: http://otel-collector.monitoring.svc.cluster.local:4317
  protocol: grpc
  # parentbased_traceidratio уважает решение родительского span: трейсы,
  # инициированные Traefik (sampleRate 1.0), сохраняются полностью, а
  # запросы без пропагированного контекста сэмплируются на 10%.
  sampler:
    name: parentbased_traceidratio
    arg: "0.1"

discovery:
  # Allowlist namespace'ов с приложениями. Явный список, а не «всё кроме»:
  # так новое приложение не начнёт профилироваться молча, а инфраструктура
  # (мониторинг, control plane, СУБД-службы) не попадёт в выборку.
  #
  # Инфраструктурные namespace'ы, сознательно не включённые: argocd, ats,
  # cert-manager, cnpg-system, default, elastic-system, k0s-autopilot,
  # kube-node-lease, kube-public, kube-system, local-path-storage, logging,
  # longhorn-system, mariadb-system, monitoring, traefik, vault,
  # vault-secrets-operator.
  #
  # Сервисы, которые уже сами шлют OTel (open-webui, zitadel), Beyla
  # пропускает сам за счёт exclude_otel_instrumented_services — дубли трейсов
  # не появятся.
  instrument:
    - k8s_namespace: element
    - k8s_namespace: forgejo
    - k8s_namespace: gitlab
    - k8s_namespace: gitea
    - k8s_namespace: authentik
    - k8s_namespace: nextcloud
    - k8s_namespace: seafile
    - k8s_namespace: immich
    - k8s_namespace: paperless
    - k8s_namespace: dawarich
    - k8s_namespace: navidrome
    - k8s_namespace: jellyfin
    - k8s_namespace: jitsi
    - k8s_namespace: local-ai
    - k8s_namespace: open-webui
    - k8s_namespace: infisical
    - k8s_namespace: glitchtip
    - k8s_namespace: athens
    - k8s_namespace: zot
    - k8s_namespace: rustfs
    - k8s_namespace: sure
    - k8s_namespace: technitium
    - k8s_namespace: mailserver
    - k8s_namespace: uptime-kuma
    - k8s_namespace: verdaccio
    - k8s_namespace: code-server
    - k8s_namespace: home-assistant
    - k8s_namespace: beszel
    - k8s_namespace: radar
    - k8s_namespace: talk-hpb
    - k8s_namespace: lute
    - k8s_namespace: pdf
    - k8s_namespace: mermaid-live-editor
    - k8s_namespace: structurizr
    - k8s_namespace: headlamp
    - k8s_namespace: homepage
    - k8s_namespace: oauth2-proxy
    - k8s_namespace: 3x-ui
    - k8s_namespace: zitadel
    # PostgreSQL: полезно видеть, кто ест CPU на стороне БД.
    - k8s_namespace: databases
    - k8s_namespace: postgres


apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: monitoring
resources:
  - k8s/rbac.yaml
  - k8s/daemonset.yaml
configMapGenerator:
  # Конфиг собирается в ConfigMap `beyla-config`; kustomize добавляет хэш
  # содержимого к имени и переписывает ссылку в DaemonSet, поэтому правка
  # конфига сама запускает rollout.
  - name: beyla-config
    files:
      - config/beyla.yml

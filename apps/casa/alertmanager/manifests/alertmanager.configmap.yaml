apiVersion: v1
kind: ConfigMap
metadata:
  name: alertmanager-config
  namespace: monitoring
data:
  alertmanager.yml: |
    global:
      resolve_timeout: 5m
    route:
      receiver: ntfy
      group_by: ['alertname', 'namespace']
      group_wait: 30s
      group_interval: 5m
      repeat_interval: 12h
      routes:
        - receiver: am-inbox
          matchers:
            - source="grafana"
        - receiver: am-inbox
          matchers:
            - __grafana_receiver__!=""
        - receiver: ntfy
          matchers:
            - source="vmalert"
          routes:
            - receiver: ntfy-critical
              matchers:
                - severity="critical"
              group_wait: 10s
              repeat_interval: 1h
    receivers:
      - name: ntfy
        webhook_configs:
          - url: 'https://ntfy.sh/__NTFY_TOPIC__?template=alertmanager'
            send_resolved: true
      - name: ntfy-critical
        webhook_configs:
          - url: 'https://ntfy.sh/__NTFY_TOPIC__?template=alertmanager'
            send_resolved: true
      - name: am-inbox
    inhibit_rules:
      - source_matchers:
          - source="grafana"
        target_matchers:
          - source="vmalert"
        equal: ['alertname']

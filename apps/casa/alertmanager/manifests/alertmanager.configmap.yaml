apiVersion: v1
kind: ConfigMap
metadata:
  name: alertmanager-config
  namespace: monitoring
data:
  alertmanager.yml: |
    global:
      resolve_timeout: 5m
    route:
      receiver: ntfy
      group_by: ['alertname', 'namespace']
      group_wait: 30s
      group_interval: 5m
      repeat_interval: 12h
      routes:
        - receiver: ntfy-critical
          matchers:
            - severity="critical"
          group_wait: 10s
          repeat_interval: 1h
    receivers:
      - name: ntfy
        webhook_configs:
          - url: 'https://ntfy.sh/__NTFY_TOPIC__?template=alertmanager'
            send_resolved: true
      - name: ntfy-critical
        webhook_configs:
          - url: 'https://ntfy.sh/__NTFY_TOPIC__?template=alertmanager'
            send_resolved: true
    inhibit_rules:
      - source_matchers:
          - severity="critical"
        target_matchers:
          - severity="warning"
        equal: ['alertname', 'namespace']

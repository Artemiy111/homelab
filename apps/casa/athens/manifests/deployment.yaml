apiVersion: apps/v1
kind: Deployment
metadata:
  name: athens
  namespace: athens
spec:
  # RWO-том
  strategy:
    type: Recreate
  revisionHistoryLimit: 1
  replicas: 1
  selector:
    matchLabels:
      app: athens
  template:
    metadata:
      labels:
        app: athens
    spec:
      # Kubernetes иначе инжектит в под env сервиса, в т. ч.
      # ATHENS_PORT=tcp://<ClusterIP>:80, а Athens читает ATHENS_PORT как свой
      # порт и падает на "too many colons in address".
      enableServiceLinks: false
      securityContext:
        # fsGroup даёт групповую запись в том Longhorn под uid/gid 1000.
        fsGroup: 1000
      containers:
        - name: athens
          image: "gomods/athens:v0.19.2@sha256:8da1d1d4c58b0ed3ea65e8b0bee201970f463acce8cb25b7c7921c3bd044b0f0"
          args:
            - athens-proxy
            - -config_file=/config/config.toml
          env:
            # Образ создаёт пользователя athens (uid 1000), но HOME в pod не
            # проставляется; без него `go` внутри Athens не находит кэш-каталог.
            - name: HOME
              value: /home/athens
          ports:
            - name: http
              containerPort: 3000
          startupProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 5
            timeoutSeconds: 10
            failureThreshold: 18
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          securityContext:
            runAsUser: 1000
            runAsGroup: 1000
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            seccompProfile:
              type: RuntimeDefault
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: "1"
              memory: 1Gi
          volumeMounts:
            - name: config
              mountPath: /config/config.toml
              subPath: config.toml
              readOnly: true
            - name: data
              mountPath: /var/lib/athens
      volumes:
        - name: config
          configMap:
            name: athens
        - name: data
          persistentVolumeClaim:
            claimName: athens-data

apiVersion: apps/v1
kind: Deployment
metadata:
  name: beszel-agent
  namespace: beszel
  annotations:
    ignore-check.kube-linter.io/host-network: "агент слушает unix-сокет, общий с hub, и собирает метрики хоста — нужен hostNetwork (#161)"
    ignore-check.kube-linter.io/docker-sock: "агент читает docker.sock read-only для метрик контейнеров (#161)"
spec:
  strategy:
    type: Recreate
  revisionHistoryLimit: 1
  replicas: 0
  selector:
    matchLabels:
      app: beszel-agent
  template:
    metadata:
      labels:
        app: beszel-agent
    spec:
      # Агент собирает метрики хоста и Docker-контейнеров и слушает unix-сокет,
      # общий с hub: hostNetwork + /var/run/docker.sock.
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      enableServiceLinks: false
      containers:
        - name: beszel-agent
          image: "henrygd/beszel-agent:0.21.0@sha256:f27b1aa2c68404bc5b9e1a2ab36653bd9b4ee14f6299862f09cd5051a4134767"
          env:
            - name: DOMAIN
              valueFrom:
                configMapKeyRef:
                  name: homelab-config
                  key: DOMAIN
            - name: TZ
              valueFrom:
                configMapKeyRef:
                  name: homelab-config
                  key: TZ
            - name: BESZEL_AGENT_KEY
              valueFrom:
                secretKeyRef:
                  name: beszel-agent
                  key: BESZEL_AGENT_KEY
            - name: BESZEL_AGENT_TOKEN
              valueFrom:
                secretKeyRef:
                  name: beszel-agent
                  key: BESZEL_AGENT_TOKEN
            - name: LISTEN
              value: /beszel_socket/beszel.sock
            - name: HUB_URL
              value: "https://beszel.$(DOMAIN)"
            - name: KEY
              value: "$(BESZEL_AGENT_KEY)"
            - name: TOKEN
              value: "$(BESZEL_AGENT_TOKEN)"
          startupProbe:
            exec:
              command: ["/agent", "health"]
            periodSeconds: 5
            timeoutSeconds: 10
            failureThreshold: 18
          livenessProbe:
            exec:
              command: ["/agent", "health"]
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            exec:
              command: ["/agent", "health"]
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          securityContext:
            runAsUser: 0
            runAsGroup: 0
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            seccompProfile:
              type: RuntimeDefault
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: "1"
              memory: 512Mi
          volumeMounts:
            - name: agent
              mountPath: /var/lib/beszel-agent
            - name: socket
              mountPath: /beszel_socket
            - name: docker-sock
              mountPath: /var/run/docker.sock
              readOnly: true
      volumes:
        - name: agent
          persistentVolumeClaim:
            claimName: beszel-agent
        - name: socket
          persistentVolumeClaim:
            claimName: beszel-socket
        - name: docker-sock
          hostPath:
            path: /var/run/docker.sock
            type: Socket

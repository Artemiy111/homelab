apiVersion: v1
kind: Service
metadata:
  name: beyla
  namespace: monitoring
  labels:
    app: beyla
spec:
  type: ClusterIP
  # Без selector у Service выбирается один pod пода; DaemonSet на single-node
  # даёт один инстанс, но на multi-node это была бы случайная выборка.
  selector:
    app: beyla
  ports:
    - name: metrics
      port: 8999
      targetPort: metrics
      protocol: TCP

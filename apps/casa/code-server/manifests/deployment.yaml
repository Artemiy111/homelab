apiVersion: apps/v1
kind: Deployment
metadata:
  name: code-server
  namespace: code-server
spec:
  strategy:
    type: Recreate
  revisionHistoryLimit: 1
  replicas: 1
  selector:
    matchLabels:
      app: code-server
  template:
    metadata:
      labels:
        app: code-server
    spec:
      containers:
        - name: code-server
          image: "codercom/code-server:4.144.0@sha256:b9e8056bb74bd0c4f90284c7559eddeccd38400cfedc28e64c9d3ca50fef1f83"
          ports:
            - name: http
              containerPort: 8080
          workingDir: /home/coder/project
          # Штатный entrypoint образа делает fixuid/sudo/usermod, что
          # несовместимо с runAsNonRoot и no-new-privileges в k8s. Запускаем
          # code-server напрямую: конфиг и расширения берутся из каталога /home/coder.
          command:
            - /usr/bin/dumb-init
            - --
            - /usr/bin/code-server
            - --bind-addr
            - 0.0.0.0:8080
            - .
          env:
            - name: HOME
              value: /home/coder
          startupProbe:
            failureThreshold: 18
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 5
            timeoutSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          securityContext:
            runAsUser: 1000
            runAsGroup: 1000
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            seccompProfile:
              type: RuntimeDefault
          resources:
            requests:
              cpu: 10m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          volumeMounts:
            - name: home
              mountPath: /home/coder
            - name: workspace
              mountPath: /home/coder/project
      volumes:
        - name: home
          persistentVolumeClaim:
            claimName: code-server-home
        - name: workspace
          persistentVolumeClaim:
            claimName: code-server-workspace

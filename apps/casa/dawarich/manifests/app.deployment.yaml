apiVersion: apps/v1
kind: Deployment
metadata:
  annotations:
    argocd.argoproj.io/sync-wave: "2"
  name: dawarich
  namespace: dawarich
spec:
  # RWO-тома
  strategy:
    type: Recreate
  revisionHistoryLimit: 1
  replicas: 1
  selector:
    matchLabels:
      app: dawarich
  template:
    metadata:
      labels:
        app: dawarich
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      terminationGracePeriodSeconds: 60
      # uid 1000 — владелец томов storage/watched. Своего пользователя в образе
      # нет, поэтому HOME задан явно: без записи в /etc/passwd Dir.home падает.
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        # /tmp и /var/app/tmp — emptyDir с правами 0777 без sticky-бита: Ruby
        # (Dir.tmpdir) такие каталоги отвергает. Готовим каталог 0700 и
        # направляем туда TMPDIR.
        - name: prepare-tmp
          image: "freikin/dawarich:1.20.0@sha256:3b8cf159d21ced0b051b980c96e79ace956a5d47386adf61cd1ae86dd737068f"
          command: ["/bin/sh", "-c", "mkdir -p /var/app/tmp/tmpdir && chmod 700 /var/app/tmp/tmpdir"]
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 128Mi
          volumeMounts:
            - name: tmp
              mountPath: /var/app/tmp
      containers:
        - name: dawarich
          image: "freikin/dawarich:1.20.0@sha256:3b8cf159d21ced0b051b980c96e79ace956a5d47386adf61cd1ae86dd737068f"
          command: ["web-entrypoint.sh"]
          args: ["bin/rails", "server", "-p", "3000", "-b", "::"]
          ports:
            - name: http
              containerPort: 3000
          envFrom:
            - configMapRef:
                name: homelab-config
          env:
            - name: DOMAIN
              valueFrom:
                configMapKeyRef:
                  name: homelab-config
                  key: DOMAIN
            - name: TZ
              valueFrom:
                configMapKeyRef:
                  name: homelab-config
                  key: TZ
            - name: HOME
              value: /tmp
            - name: TMPDIR
              value: /var/app/tmp/tmpdir
            # pid-файл Puma уводим из /var/app/tmp: каталог смонтирован пустым
            # emptyDir, а Puma не создаёт для pidfile родительский каталог.
            - name: PIDFILE
              value: /tmp/server.pid
            - name: RAILS_ENV
              value: production
            - name: REDIS_URL
              value: "redis://dawarich-redis.dawarich.svc.cluster.local:6379"
            - name: DATABASE_HOST
              value: dawarich-db-rw.dawarich.svc.cluster.local
            - name: DATABASE_PORT
              value: "5432"
            - name: DATABASE_USERNAME
              value: dawarich
            - name: DATABASE_NAME
              value: dawarich
            - name: DATABASE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: dawarich-db
                  key: password
            - name: SECRET_KEY_BASE
              valueFrom:
                secretKeyRef:
                  name: dawarich-secrets
                  key: SECRET_KEY_BASE
            - name: METRICS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: dawarich-metrics
                  key: DAWARICH_METRICS_PASSWORD
            - name: METRICS_USERNAME
              value: netdata
            - name: APPLICATION_HOSTS
              value: "dawarich.$(DOMAIN)"
            - name: APPLICATION_PROTOCOL
              value: https
            - name: RAILS_LOG_TO_STDOUT
              value: "true"
            - name: SELF_HOSTED
              value: "true"
            - name: STORE_GEODATA
              value: "true"
            - name: STORAGE_BACKEND
              value: local
            - name: PROMETHEUS_EXPORTER_ENABLED
              value: "true"
            - name: WEB_CONCURRENCY
              value: "0"
            - name: SIDEKIQ_EMBEDDED
              value: "true"
            - name: BACKGROUND_PROCESSING_CONCURRENCY
              value: "2"
            - name: YABEDA_SIDEKIQ_COLLECT_CLUSTER_METRICS
              value: "true"
          startupProbe:
            httpGet:
              path: /api/v1/health
              port: http
              httpHeaders:
                - name: X-Forwarded-Proto
                  value: https
            periodSeconds: 5
            timeoutSeconds: 10
            failureThreshold: 30
          livenessProbe:
            httpGet:
              path: /api/v1/health
              port: http
              httpHeaders:
                - name: X-Forwarded-Proto
                  value: https
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /api/v1/health
              port: http
              httpHeaders:
                - name: X-Forwarded-Proto
                  value: https
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 3
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 200m
              memory: 768Mi
            limits:
              cpu: "1"
              memory: 4Gi
          volumeMounts:
            - name: tmp
              mountPath: /var/app/tmp
            - name: imports
              mountPath: /var/app/tmp/imports
            - name: watched
              mountPath: /var/app/tmp/imports/watched
            - name: public
              mountPath: /var/app/public
            - name: storage
              mountPath: /var/app/storage
            - name: system-tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 1Gi
        - name: imports
          emptyDir:
            sizeLimit: 512Mi
        - name: watched
          persistentVolumeClaim:
            claimName: dawarich-watched
        - name: public
          emptyDir:
            sizeLimit: 256Mi
        - name: storage
          persistentVolumeClaim:
            claimName: dawarich-storage
        - name: system-tmp
          emptyDir:
            sizeLimit: 256Mi

# Конфиг общего окружения стенда. Копия лежит в каждом namespace, который его
# читает: ConfigMap виден только внутри своего namespace.
apiVersion: v1
kind: ConfigMap
metadata:
  annotations:
    argocd.argoproj.io/sync-wave: "0"
  name: homelab-config
  namespace: dawarich
data:
  DOMAIN: biplane.casa
  TZ: Asia/Yekaterinburg
  DEFAULT_LOCALE: ru

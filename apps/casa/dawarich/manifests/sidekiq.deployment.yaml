apiVersion: apps/v1
kind: Deployment
metadata:
  annotations:
    argocd.argoproj.io/sync-wave: "3"
  name: dawarich-sidekiq
  namespace: dawarich
spec:
  # RWO-тома
  strategy:
    type: Recreate
  revisionHistoryLimit: 1
  replicas: 1
  selector:
    matchLabels:
      app: dawarich-sidekiq
  template:
    metadata:
      labels:
        app: dawarich-sidekiq
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        # /tmp и /var/app/tmp — emptyDir с правами 0777 без sticky-бита: Ruby
        # (Dir.tmpdir) такие каталоги отвергает. Готовим каталог 0700 и
        # направляем туда TMPDIR.
        - name: prepare-tmp
          image: "freikin/dawarich:1.16.0@sha256:3cfab81737267d486757db638fe614610df454d161a389c34eb59944ac32ee58"
          command: ["/bin/sh", "-c", "mkdir -p /var/app/tmp/tmpdir && chmod 700 /var/app/tmp/tmpdir"]
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 128Mi
          volumeMounts:
            - name: tmp
              mountPath: /var/app/tmp
      containers:
        - name: sidekiq
          image: "freikin/dawarich:1.16.0@sha256:3cfab81737267d486757db638fe614610df454d161a389c34eb59944ac32ee58"
          command: ["sidekiq-entrypoint.sh"]
          args: ["sidekiq"]
          ports:
            - name: metrics
              containerPort: 9394
          envFrom:
            - configMapRef:
                name: homelab-config
          env:
            - name: DOMAIN
              valueFrom:
                configMapKeyRef:
                  name: homelab-config
                  key: DOMAIN
            - name: TZ
              valueFrom:
                configMapKeyRef:
                  name: homelab-config
                  key: TZ
            - name: HOME
              value: /tmp
            - name: TMPDIR
              value: /var/app/tmp/tmpdir
            - name: RAILS_ENV
              value: production
            - name: REDIS_URL
              value: "redis://dawarich-redis.dawarich.svc.cluster.local:6379"
            - name: DATABASE_HOST
              value: dawarich-db-rw.dawarich.svc.cluster.local
            - name: DATABASE_PORT
              value: "5432"
            - name: DATABASE_USERNAME
              value: dawarich
            - name: DATABASE_NAME
              value: dawarich
            - name: DATABASE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: dawarich-db
                  key: password
            - name: SECRET_KEY_BASE
              valueFrom:
                secretKeyRef:
                  name: dawarich-secrets
                  key: SECRET_KEY_BASE
            - name: METRICS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: dawarich-metrics
                  key: DAWARICH_METRICS_PASSWORD
            - name: METRICS_USERNAME
              value: netdata
            - name: APPLICATION_HOSTS
              value: "dawarich.$(DOMAIN)"
            - name: APPLICATION_PROTOCOL
              value: https
            - name: RAILS_LOG_TO_STDOUT
              value: "true"
            - name: SELF_HOSTED
              value: "true"
            - name: STORE_GEODATA
              value: "true"
            - name: STORAGE_BACKEND
              value: local
            - name: PROMETHEUS_EXPORTER_ENABLED
              value: "true"
            - name: BACKGROUND_PROCESSING_CONCURRENCY
              value: "3"
          livenessProbe:
            exec:
              command: ["/bin/sh", "-c", "pgrep -f sidekiq"]
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 3
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 100m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 2Gi
          volumeMounts:
            - name: tmp
              mountPath: /var/app/tmp
            - name: imports
              mountPath: /var/app/tmp/imports
            - name: watched
              mountPath: /var/app/tmp/imports/watched
            - name: storage
              mountPath: /var/app/storage
            - name: system-tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 1Gi
        - name: imports
          emptyDir:
            sizeLimit: 512Mi
        - name: watched
          persistentVolumeClaim:
            claimName: dawarich-watched
        - name: storage
          persistentVolumeClaim:
            claimName: dawarich-storage
        - name: system-tmp
          emptyDir:
            sizeLimit: 256Mi

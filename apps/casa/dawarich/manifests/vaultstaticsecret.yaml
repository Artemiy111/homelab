apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultStaticSecret
metadata:
  name: dawarich-db
  namespace: dawarich
spec:
  vaultAuthRef: vso-dawarich
  mount: kv
  type: kv-v2
  path: dawarich/db
  refreshAfter: 1h
  destination:
    name: dawarich-db
    create: true
    overwrite: true
    transformation:
      excludeRaw: true
---
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultStaticSecret
metadata:
  name: dawarich-secrets
  namespace: dawarich
spec:
  vaultAuthRef: vso-dawarich
  mount: kv
  type: kv-v2
  path: dawarich/secrets
  refreshAfter: 1h
  destination:
    name: dawarich-secrets
    create: true
    overwrite: true
    transformation:
      excludeRaw: true
---
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultStaticSecret
metadata:
  name: dawarich-metrics
  namespace: dawarich
spec:
  vaultAuthRef: vso-dawarich
  mount: kv
  type: kv-v2
  path: dawarich/@monitoring/dawarich-metrics-password
  refreshAfter: 1h
  destination:
    name: dawarich-metrics
    create: true
    overwrite: true
    transformation:
      excludeRaw: true

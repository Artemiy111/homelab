apiVersion: v1
kind: ConfigMap
metadata:
  name: element-synapse-log
  namespace: element
data:
  log.config: |-
    version: 1
    disable_existing_loggers: false
    formatters:
        json:
            class: synapse.logging.TerseJsonFormatter
    handlers:
        console:
            class: logging.StreamHandler
            formatter: json
            stream: ext://sys.stdout
    loggers:
        synapse.storage.SQL:
            level: WARNING
    root:
        level: INFO
        handlers: [console]

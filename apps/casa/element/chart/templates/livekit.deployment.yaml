apiVersion: apps/v1
kind: Deployment
metadata:
  name: element-livekit
  namespace: element
  annotations:
    argocd.argoproj.io/sync-wave: "2"
    ignore-check.kube-linter.io/host-network: "UDP-медиадиапазон 50000-50499 публикуется напрямую на узле (#161)"
spec:
  strategy:
    type: Recreate
  revisionHistoryLimit: 1
  replicas: 1
  selector:
    matchLabels:
      app: element-livekit
  template:
    metadata:
      labels:
        app: element-livekit
    spec:
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      automountServiceAccountToken: false
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: livekit
          image: "livekit/livekit-server:v1.13.7@sha256:6fd3b7088874c4d119160dd688798dfec852bc014786d392caad15f6f63912a3"
          command:
            - /livekit-server
            - --config
            - /etc/livekit/config.yaml
            - --node-ip
            - $(HOST_IP)
          ports:
            - name: http
              containerPort: 7880
            - name: rtc-tcp
              containerPort: 7881
            - name: metrics
              containerPort: 6789
          env:
            - name: HOST_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.hostIP
            - name: TZ
              valueFrom:
                configMapKeyRef:
                  name: homelab-config
                  key: TZ
          startupProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 5
            timeoutSeconds: 10
            failureThreshold: 30
          livenessProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 3
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 500m
              memory: 256Mi
            limits:
              cpu: "2"
              memory: 1Gi
          volumeMounts:
            - name: config
              mountPath: /etc/livekit/config.yaml
              subPath: config.yaml
              readOnly: true
            - name: keys
              mountPath: /etc/livekit-keys
              readOnly: true
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: config
          configMap:
            name: element-livekit-config
        - name: keys
          secret:
            secretName: element-livekit-keys
            defaultMode: 0440
            items:
              - key: keys.yaml
                path: keys.yaml
        - name: tmp
          emptyDir: {}

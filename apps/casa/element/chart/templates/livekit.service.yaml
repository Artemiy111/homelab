apiVersion: v1
kind: Service
metadata:
  name: livekit
  namespace: element
  annotations:
    argocd.argoproj.io/sync-wave: "2"
    traefik.io/service.nativelb: "true"
spec:
  type: ClusterIP
  selector:
    app: element-livekit
  ports:
    - name: http
      port: 80
      targetPort: http
      protocol: TCP
    - name: metrics
      port: 6789
      targetPort: metrics
      protocol: TCP

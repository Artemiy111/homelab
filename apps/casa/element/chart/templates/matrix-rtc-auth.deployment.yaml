apiVersion: apps/v1
kind: Deployment
metadata:
  name: matrix-rtc-auth
  namespace: element
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  revisionHistoryLimit: 1
  replicas: 1
  selector:
    matchLabels:
      app: matrix-rtc-auth
  template:
    metadata:
      labels:
        app: matrix-rtc-auth
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: matrix-rtc-auth
          image: "ghcr.io/element-hq/lk-jwt-service:0.7.0@sha256:e0c7cecfa74e2342a3e79d47e1d4ab4bd228fe05b1a4dc4ba7f807686b0c214b"
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: DOMAIN
              valueFrom:
                configMapKeyRef:
                  name: homelab-config
                  key: DOMAIN
            - name: TZ
              valueFrom:
                configMapKeyRef:
                  name: homelab-config
                  key: TZ
            - name: LIVEKIT_JWT_BIND
              value: ":8080"
            - name: LIVEKIT_LOG_LEVEL
              value: "warn"
            - name: LIVEKIT_URL
              value: "wss://element.$(DOMAIN)/livekit/sfu"
            - name: LIVEKIT_KEY_FROM_FILE
              value: /run/secrets/livekit/api_key
            - name: LIVEKIT_SECRET_FROM_FILE
              value: /run/secrets/livekit/api_secret
            - name: LIVEKIT_FULL_ACCESS_HOMESERVERS
              value: "$(DOMAIN)"
            - name: LIVEKIT_REDIS_URL
              value: "redis://element-valkey.element.svc.cluster.local:6379/1"
          startupProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 5
            timeoutSeconds: 10
            failureThreshold: 24
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 3
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: "1"
              memory: 256Mi
          volumeMounts:
            - name: livekit-key
              mountPath: /run/secrets/livekit
              readOnly: true
      volumes:
        - name: livekit-key
          secret:
            secretName: element-secrets
            defaultMode: 0440
            items:
              - key: LIVEKIT_API_KEY
                path: api_key
              - key: LIVEKIT_API_SECRET
                path: api_secret

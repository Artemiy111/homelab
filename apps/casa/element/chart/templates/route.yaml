apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: element
  namespace: element
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  parentRefs:
    - name: homelab
      namespace: traefik
  hostnames:
    - element.biplane.casa
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /livekit/sfu
      filters:
        - type: URLRewrite
          urlRewrite:
            path:
              type: ReplacePrefixMatch
              replacePrefixMatch: /
      backendRefs:
        - name: livekit
          port: 80
    - matches:
        - path:
            type: PathPrefix
            value: /livekit/jwt
      filters:
        - type: URLRewrite
          urlRewrite:
            path:
              type: ReplacePrefixMatch
              replacePrefixMatch: /
      backendRefs:
        - name: matrix-rtc-auth
          port: 80
    - matches:
        - path:
            type: PathPrefix
            value: /_matrix
      backendRefs:
        - name: synapse
          port: 80
    - matches:
        - path:
            type: PathPrefix
            value: /_synapse
      backendRefs:
        - name: synapse
          port: 80
    - matches:
        - path:
            type: Exact
            value: /.well-known/matrix/client
      backendRefs:
        - name: synapse
          port: 80
    - backendRefs:
        - name: element-web
          port: 80
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: element-well-known
  namespace: element
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  parentRefs:
    - name: homelab
      namespace: traefik
  hostnames:
    - biplane.casa
  rules:
    - matches:
        - path:
            type: Exact
            value: /.well-known/matrix/client
      backendRefs:
        - name: synapse
          port: 80
    - matches:
        - path:
            type: Exact
            value: /.well-known/matrix/server
      backendRefs:
        - name: synapse
          port: 80
    - matches:
        - path:
            type: PathPrefix
            value: /_matrix
      backendRefs:
        - name: synapse
          port: 80

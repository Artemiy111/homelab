apiVersion: apps/v1
kind: Deployment
metadata:
  name: element-synapse
  namespace: element
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  strategy:
    type: Recreate
  revisionHistoryLimit: 1
  replicas: 1
  selector:
    matchLabels:
      app: element-synapse
  template:
    metadata:
      labels:
        app: element-synapse
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 991
        runAsGroup: 991
        fsGroup: 991
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: synapse
          image: "matrixdotorg/synapse:v1.161.0@sha256:6b95dd129e35e97e8032cb759e5db4a516a5f7ef6c98d34d716fea1ae239b62a"
          ports:
            - name: http
              containerPort: 8080
            - name: metrics
              containerPort: 9009
          env:
            - name: TZ
              valueFrom:
                configMapKeyRef:
                  name: homelab-config
                  key: TZ
            - name: SYNAPSE_CONFIG_PATH
              value: /etc/synapse/homeserver.yaml
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: element-db-auth
                  key: password
          startupProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 5
            timeoutSeconds: 10
            failureThreshold: 12
          livenessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 3
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 200m
              memory: 256Mi
            limits:
              cpu: "2"
              memory: 2Gi
          volumeMounts:
            - name: data
              mountPath: /data
            - name: config
              mountPath: /etc/synapse
              readOnly: true
            - name: element-secrets
              mountPath: /run/secrets/element
              readOnly: true
            - name: oidc
              mountPath: /run/secrets/oidc
              readOnly: true
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: element-synapse
        - name: config
          configMap:
            name: element-synapse-config
        - name: element-secrets
          secret:
            secretName: element-secrets
            defaultMode: 0440
            items:
              - key: REGISTRATION_SHARED_SECRET
                path: registration_shared_secret
              - key: TURN_SHARED_SECRET
                path: turn_shared_secret
        - name: oidc
          secret:
            secretName: element-oidc
            defaultMode: 0440
            items:
              - key: OIDC_CLIENT_SECRET
                path: client_secret
        - name: tmp
          emptyDir: {}

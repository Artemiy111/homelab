apiVersion: v1
kind: Service
metadata:
  name: synapse
  namespace: element
spec:
  type: ClusterIP
  selector:
    app: element-synapse
  ports:
    - name: http
      port: 80
      targetPort: http
      protocol: TCP
    # Prometheus-метрики (скрейпит vmagent).
    - name: metrics
      port: 9009
      targetPort: metrics
      protocol: TCP

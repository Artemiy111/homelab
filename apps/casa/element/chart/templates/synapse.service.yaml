apiVersion: v1
kind: Service
metadata:
  name: synapse
  namespace: element
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  type: ClusterIP
  selector:
    app: element-synapse
  ports:
    - name: http
      port: 80
      targetPort: http
      protocol: TCP
    - name: metrics
      port: 9009
      targetPort: metrics
      protocol: TCP

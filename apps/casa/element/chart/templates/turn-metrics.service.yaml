apiVersion: v1
kind: Service
metadata:
  name: element-turn-metrics
  namespace: element
  annotations:
    argocd.argoproj.io/sync-wave: "2"
  labels:
    app: element-turn
spec:
  type: ClusterIP
  selector:
    app: element-turn
  ports:
    - name: metrics
      port: 9641
      targetPort: metrics
      protocol: TCP

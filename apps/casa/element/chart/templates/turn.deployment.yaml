apiVersion: apps/v1
kind: Deployment
metadata:
  name: element-turn
  namespace: element
  annotations:
    argocd.argoproj.io/sync-wave: "2"
    ignore-check.kube-linter.io/host-network: "TURN публикует relay 21000-21499 на LAN-адресе узла; без hostNetwork недоступно (#161)"
spec:
  strategy:
    type: Recreate
  revisionHistoryLimit: 1
  replicas: 1
  selector:
    matchLabels:
      app: element-turn
  template:
    metadata:
      labels:
        app: element-turn
    spec:
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      automountServiceAccountToken: false
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 65534
        fsGroup: 65534
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: turn
          image: "coturn/coturn:4.18.0@sha256:bbefd3e1fdfdc0d58770fe01b581fd8b00d9f3a5580d00acb77cf719a6bc78e3"
          command:
            - turnserver
          args:
            - -c
            - /etc/turn/turnserver.conf
            - --relay-ip=$(HOST_IP)
            - --external-ip=$(HOST_IP)
          ports:
            - name: metrics
              containerPort: 9641
          env:
            - name: TZ
              valueFrom:
                configMapKeyRef:
                  name: homelab-config
                  key: TZ
            - name: HOST_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.hostIP
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
              add: ["NET_BIND_SERVICE"]
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: "1"
              memory: 256Mi
          volumeMounts:
            - name: config
              mountPath: /etc/turn
              readOnly: true
            - name: data
              mountPath: /var/lib/coturn
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: config
          secret:
            secretName: element-turn-config
            defaultMode: 0440
            items:
              - key: turnserver.conf
                path: turnserver.conf
        - name: data
          emptyDir: {}
        - name: tmp
          emptyDir: {}

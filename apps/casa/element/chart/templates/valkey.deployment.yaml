apiVersion: apps/v1
kind: Deployment
metadata:
  name: element-valkey
  namespace: element
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  strategy:
    type: Recreate
  revisionHistoryLimit: 1
  replicas: 1
  selector:
    matchLabels:
      app: element-valkey
  template:
    metadata:
      labels:
        app: element-valkey
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        runAsGroup: 999
        fsGroup: 999
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: valkey
          image: "valkey/valkey:9.1.2@sha256:418652cfb58ef879d4978c33553735d7147016032d5aefaa14c828e611eb9dfd"
          ports:
            - name: valkey
              containerPort: 6379
          command: ["valkey-server", "--save", "60", "1", "--loglevel", "warning"]
          env:
            - name: TZ
              valueFrom:
                configMapKeyRef:
                  name: homelab-config
                  key: TZ
          startupProbe:
            exec:
              command: ["valkey-cli", "ping"]
            periodSeconds: 5
            timeoutSeconds: 10
            failureThreshold: 12
          livenessProbe:
            exec:
              command: ["valkey-cli", "ping"]
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            exec:
              command: ["valkey-cli", "ping"]
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: "1"
              memory: 512Mi
          volumeMounts:
            - name: data
              mountPath: /data
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: data
          emptyDir: {}
        - name: tmp
          emptyDir: {}

apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultStaticSecret
metadata:
  name: element-db-auth
  namespace: element
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  vaultAuthRef: vso-element
  mount: kv
  type: kv-v2
  path: element/db
  refreshAfter: 1h
  rolloutRestartTargets:
    - kind: Deployment
      name: element-synapse
  destination:
    name: element-db-auth
    create: true
    overwrite: true
    type: kubernetes.io/basic-auth
    transformation:
      excludeRaw: true
---
apiVersion: secrets.hashicorp.com/v1beta1

---
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultStaticSecret
metadata:
  name: element-livekit-keys
  namespace: element
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  vaultAuthRef: vso-element
  mount: kv
  type: kv-v2
  path: element/secrets
  refreshAfter: 1h
  rolloutRestartTargets:
    - kind: Deployment
      name: element-livekit
  destination:
    name: element-livekit-keys
    create: true
    overwrite: true
    transformation:
      excludeRaw: true
      excludes:
        - ".*"
      templates:
        keys.yaml:
          text: '{{ "{{ get .Secrets \"LIVEKIT_API_KEY\" }}: {{ get .Secrets \"LIVEKIT_API_SECRET\" }}" }}'
---
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultStaticSecret
metadata:
  name: element-turn-config
  namespace: element
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  vaultAuthRef: vso-element
  mount: kv
  type: kv-v2
  path: element/secrets
  refreshAfter: 1h
  rolloutRestartTargets:
    - kind: Deployment
      name: element-turn
  destination:
    name: element-turn-config
    create: true
    overwrite: true
    transformation:
      excludeRaw: true
      excludes:
        - ".*"
      templates:
        turnserver.conf:
          text: |
            listening-port=3479
            tls-listening-port=5349
            cert=/etc/turn/tls/tls.crt
            pkey=/etc/turn/tls/tls.key
            listening-ip=0.0.0.0
            realm=biplane.casa
            use-auth-secret
            static-auth-secret={{ "{{ get .Secrets \"TURN_SHARED_SECRET\" }}" }}
            log-file=stdout
            no-multicast-peers
            no-cli
            no-tlsv1
            no-tlsv1_1
            proc-quota=20
            total-quota=100
            stale-nonce=600
            max-bps=0
            min-port=21000
            max-port=21499
            prometheus
            prometheus-port=9641
---

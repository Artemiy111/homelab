apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
generatorOptions:
  disableNameSuffixHash: true
configMapGenerator:
  - name: element-web-config
    namespace: element
    files:
      - config/config.json
resources:
  - homelab-config.yaml
  - element-web.vpa.yaml
  - element-synapse.vpa.yaml
  - element-livekit.vpa.yaml
  - matrix-rtc-auth.vpa.yaml
  - element-turn.vpa.yaml

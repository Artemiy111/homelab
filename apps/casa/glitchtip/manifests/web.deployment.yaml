apiVersion: apps/v1
kind: Deployment
metadata:
  name: glitchtip
  namespace: glitchtip
spec:
  revisionHistoryLimit: 1
  replicas: 1
  selector:
    matchLabels:
      app: glitchtip
  template:
    metadata:
      labels:
        app: glitchtip
    spec:
      initContainers:
        - name: migrate
          image: "glitchtip/glitchtip:6@sha256:a3d8eb1b36c1e1603d55ab32711ea3dd8115874742a781a57391a62a16e0dff6"
          env:
            - name: DOMAIN
              valueFrom:
                configMapKeyRef:
                  name: homelab-config
                  key: DOMAIN
            - name: POSTGRES_USER
              value: glitchtip
            - name: POSTGRES_DB
              value: glitchtip
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: glitchtip-db
                  key: password
            - name: SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: glitchtip-secrets
                  key: SECRET_KEY
            - name: DATABASE_URL
              value: "postgresql://$(POSTGRES_USER):$(POSTGRES_PASSWORD)@shared-rw.databases.svc.cluster.local:5432/$(POSTGRES_DB)"
            - name: GLITCHTIP_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: glitchtip-secrets
                  key: GLITCHTIP_CLIENT_ID
            - name: GLITCHTIP_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: glitchtip-secrets
                  key: GLITCHTIP_CLIENT_SECRET
          command: ["/bin/sh", "-c"]
          args:
            - ./bin/run-migrate.sh && ./manage.py shell < /opt/bootstrap/oidc.py
          volumeMounts:
            - name: bootstrap
              mountPath: /opt/bootstrap
              readOnly: true
          securityContext:
            runAsUser: 5000
            runAsGroup: 5000
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            seccompProfile:
              type: RuntimeDefault
          resources:
            requests:
              cpu: 10m
              memory: 128Mi
            limits:
              cpu: 250m
              memory: 512Mi
      containers:
        - name: glitchtip
          image: "glitchtip/glitchtip:6@sha256:a3d8eb1b36c1e1603d55ab32711ea3dd8115874742a781a57391a62a16e0dff6"
          ports:
            - containerPort: 8000
              name: http
          envFrom:
            - configMapRef:
                name: homelab-config
          env:
            - name: DOMAIN
              valueFrom:
                configMapKeyRef:
                  name: homelab-config
                  key: DOMAIN
            - name: POD_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
            - name: ALLOWED_HOSTS
              value: "glitchtip.$(DOMAIN),glitchtip.glitchtip.svc.cluster.local"
            - name: POSTGRES_USER
              value: glitchtip
            - name: POSTGRES_DB
              value: glitchtip
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: glitchtip-db
                  key: password
            - name: SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: glitchtip-secrets
                  key: SECRET_KEY
            - name: DATABASE_URL
              value: "postgresql://$(POSTGRES_USER):$(POSTGRES_PASSWORD)@shared-rw.databases.svc.cluster.local:5432/$(POSTGRES_DB)"
            - name: VALKEY_URL
              value: "redis://glitchtip-valkey.glitchtip.svc.cluster.local:6379/0"
            - name: GLITCHTIP_DOMAIN
              value: "https://glitchtip.$(DOMAIN)"
            - name: GLITCHTIP_INSTANCE_NAME
              value: "Homelab"
            - name: ENABLE_USER_REGISTRATION
              value: "false"
            - name: ENABLE_ORGANIZATION_CREATION
              value: "true"
            - name: ENABLE_SOCIAL_APPS_USER_REGISTRATION
              value: "true"
            - name: ENABLE_OBSERVABILITY_API
              value: "true"
            - name: SOCIAL_AUTH_BLOCK_PRIVATE_IPS
              value: "false"
          startupProbe:
            httpGet:
              path: /_health/
              port: http
            periodSeconds: 5
            timeoutSeconds: 10
            failureThreshold: 18
          livenessProbe:
            httpGet:
              path: /_health/
              port: http
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /_health/
              port: http
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 3
          securityContext:
            runAsUser: 5000
            runAsGroup: 5000
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            seccompProfile:
              type: RuntimeDefault
          resources:
            requests:
              cpu: 10m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 768Mi
      volumes:
        - name: bootstrap
          configMap:
            name: glitchtip-bootstrap

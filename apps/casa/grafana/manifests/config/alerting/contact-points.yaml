apiVersion: 1

# Ntfy — единственный канал метрических алертов. Встроенной интеграции ntfy в
# Grafana нет, поэтому канал сделан через webhook.
# `?template=alertmanager` заставляет ntfy отформатировать тело: без него
# уведомление приходит JSON-конвертом целиком. Шаблон `alertmanager` рассчитан
# ровно на тот payload, который шлёт Unified Alerting (receiver/status/alerts[]).
# Внимание: `?template=grafana` — не то же самое, он ждёт плоский legacy-формат
# `{status, title, message}` и на нашем payload падает с 400.
#
# Если переменная NTFY_TOPIC не подставилась, URL станет `https://ntfy.sh/`
# и публикация вернёт ошибку — канал деградирует заметно, а не молча.
#
# Тема ntfy приходит из Secret'а `grafana-ntfy` (см.
# manifests/vaultstaticsecret.yaml, путь kv/ntfy/topic); она же используется
# Gatus, поэтому уведомления о проверках и о метриках приходят в один канал.
# На публичном ntfy.sh тема и есть пароль (access control там не включён),
# поэтому в URL она лежит открыто — см. README, раздел «Канал доставки».
contactPoints:
  - orgId: 1
    name: ntfy
    receivers:
      - uid: ntfy-homelab
        type: webhook
        disableResolveMessage: false
        settings:
          url: https://ntfy.sh/$NTFY_TOPIC?template=alertmanager
          httpMethod: POST
      - uid: grafana-to-alertmanager
        type: prometheus-alertmanager
        settings:
          url: http://alertmanager.monitoring.svc.cluster.local:9093

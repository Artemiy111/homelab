apiVersion: apps/v1
kind: Deployment
metadata:
  name: home-assistant
  namespace: home-assistant
  annotations:
    ignore-check.kube-linter.io/host-network: "mDNS/SSDP/DHCP discovery устройств требует hostNetwork (#161)"
spec:
  # RWO-том конфига: два пода при rolling update пишут в один каталог.
  strategy:
    type: Recreate
  revisionHistoryLimit: 1
  replicas: 1
  selector:
    matchLabels:
      app: home-assistant
  template:
    metadata:
      labels:
        app: home-assistant
    spec:
      # hostNetwork нужен для локального обнаружения устройств (mDNS, SSDP, DHCP).
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      enableServiceLinks: false
      containers:
        - name: home-assistant
          image: "ghcr.io/home-assistant/home-assistant:2026.10.3@sha256:407b89cd11a8cb67d388d21739a226c74acbbebe1ac59e3b83b11b43ce76b98f"
          ports:
            - name: http
              containerPort: 8123
          env:
            - name: TZ
              valueFrom:
                configMapKeyRef:
                  name: homelab-config
                  key: TZ
            - name: OIDC_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: home-assistant-oidc
                  key: OIDC_CLIENT_ID
            - name: OIDC_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: home-assistant-oidc
                  key: OIDC_CLIENT_SECRET
          startupProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 5
            timeoutSeconds: 10
            failureThreshold: 24
          livenessProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 3
          securityContext:
            runAsUser: 0
            runAsGroup: 0
            # no-new-privileges из compose = allowPrivilegeEscalation: false.
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
              # NET_RAW — пассивный DHCP discovery/ICMP; DAC_OVERRIDE — запись
              # в ops-owned маунты /config без подгона владельцев под root.
              add: ["NET_RAW", "DAC_OVERRIDE"]
            seccompProfile:
              type: RuntimeDefault
          resources:
            requests:
              cpu: 10m
              memory: 512Mi
            limits:
              cpu: 100m
              memory: 750Mi
          volumeMounts:
            - name: config
              mountPath: /config
            - name: configuration
              mountPath: /config/configuration.yaml
              subPath: configuration.yaml
              readOnly: true
            - name: localtime
              mountPath: /etc/localtime
              readOnly: true
      volumes:
        - name: config
          persistentVolumeClaim:
            claimName: home-assistant-config
        - name: configuration
          configMap:
            name: home-assistant-configuration
        - name: localtime
          hostPath:
            path: /etc/localtime
            type: File

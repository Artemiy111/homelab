apiVersion: v1
kind: Service
metadata:
  name: immich
  namespace: immich
spec:
  type: ClusterIP
  selector:
    app: immich-server
  ports:
    - name: http
      port: 80
      targetPort: http
      protocol: TCP
    # Prometheus-метрики (скрейпит vmagent).
    - name: metrics
      port: 8081
      targetPort: 8081
      protocol: TCP

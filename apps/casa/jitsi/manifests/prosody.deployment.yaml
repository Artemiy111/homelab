apiVersion: apps/v1
kind: Deployment
metadata:
  name: jitsi-prosody
  namespace: jitsi
spec:
  # MUC-состояние живёт в памяти пода: второй экземпляр на время rolling update его не увидит.
  strategy:
    type: Recreate
  revisionHistoryLimit: 1
  replicas: 1
  selector:
    matchLabels:
      app: jitsi-prosody
  template:
    metadata:
      labels:
        app: jitsi-prosody
    spec:
      enableServiceLinks: false
      # fsGroup даёт групповую запись в emptyDir пользователю 1000.
      securityContext:
        fsGroup: 1000
      # s6-overlay требует, чтобы /run принадлежал пользователю контейнера, а
      # prosodyctl отказывается генерировать сертификаты в каталог данных,
      # который ему не принадлежит. Пустой emptyDir создаётся root-овым.
      initContainers:
        - name: fix-perms
          image: "redis:8.10-alpine@sha256:0bf6577d7774e592b29d093e3ac9390eb91e13d72c21e506afce736de5e0eeb0"
          command: ["sh", "-c", "chown 1000:1000 /run /var/lib/prosody && chmod 0750 /run /var/lib/prosody"]
          securityContext:
            runAsUser: 0
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
              add: ["CHOWN", "FOWNER"]
            seccompProfile:
              type: RuntimeDefault
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 100m
              memory: 32Mi
          volumeMounts:
            - name: run
              mountPath: /run
            - name: storage
              mountPath: /var/lib/prosody
      containers:
        - name: prosody
          image: "ghcr.io/jitsi/prosody:stable-11146-1@sha256:0e3d9ada40c03e6eef151348e0872dce7b4b1c16c173ff4a67afeae60aba2404"
          ports:
            - name: xmpp-client
              containerPort: 5222
            - name: xmpp-federation
              containerPort: 5269
            - name: xmpp-component
              containerPort: 5347
            - name: http
              containerPort: 5280
          env:
            - name: TZ
              valueFrom:
                configMapKeyRef:
                  name: homelab-config
                  key: TZ
            - name: JICOFO_AUTH_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: jitsi-auth
                  key: JICOFO_AUTH_PASSWORD
            - name: JICOFO_COMPONENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: jitsi-auth
                  key: JICOFO_COMPONENT_SECRET
            - name: JVB_AUTH_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: jitsi-auth
                  key: JVB_AUTH_PASSWORD
            - name: JITSI_MODERATOR_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: jitsi-auth
                  key: JITSI_MODERATOR_PASSWORD
            - name: AUTH_TYPE
              value: internal
            - name: ENABLE_AUTH
              value: "1"
            - name: ENABLE_GUESTS
              value: "1"
            - name: ENABLE_LOBBY
              value: "1"
            - name: ENABLE_XMPP_WEBSOCKET
              value: "1"
            - name: JICOFO_AUTH_USER
              value: focus
            - name: JVB_AUTH_USER
              value: jvb
            - name: XMPP_AUTH_DOMAIN
              value: auth.meet.jitsi
            - name: XMPP_DOMAIN
              value: meet.jitsi
            - name: XMPP_GUEST_DOMAIN
              value: guest.meet.jitsi
            - name: XMPP_INTERNAL_MUC_DOMAIN
              value: internal-muc.meet.jitsi
            - name: XMPP_INTERNAL_MUC_MODULES
              value: ping
            - name: XMPP_MUC_DOMAIN
              value: muc.meet.jitsi
            - name: XMPP_RECORDER_DOMAIN
              value: recorder.meet.jitsi
            - name: PROSODY_ENABLE_METRICS
              value: "true"
            # openmetrics_allow_cidr сверяется с адресом отправителя, но трафик
            # pod→ClusterIP приходит SNAT'нутым с адресом узла, который в
            # pod-сети не лежит. Доступ к метрикам ограничивает NetworkPolicy
            # (только vmagent), поэтому allowlist здесь открыт.
            - name: PROSODY_METRICS_ALLOWED_CIDR
              value: "0.0.0.0/0"
          startupProbe:
            exec:
              command: ["/bin/sh", "-c", "prosodyctl --config /run/prosody/config/prosody.cfg.lua status"]
            periodSeconds: 5
            timeoutSeconds: 10
            failureThreshold: 18
          livenessProbe:
            exec:
              command: ["/bin/sh", "-c", "prosodyctl --config /run/prosody/config/prosody.cfg.lua status"]
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 3
          readinessProbe:
            exec:
              command: ["/bin/sh", "-c", "prosodyctl --config /run/prosody/config/prosody.cfg.lua status"]
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 3
          securityContext:
            runAsUser: 1000
            runAsGroup: 1000
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
            seccompProfile:
              type: RuntimeDefault
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: "1"
              memory: 512Mi
          volumeMounts:
            - name: config
              mountPath: /config
            - name: plugins
              mountPath: /prosody-plugins-custom
            - name: storage
              mountPath: /var/lib/prosody
            - name: run
              mountPath: /run
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: config
          emptyDir:
            sizeLimit: 16Mi
        - name: plugins
          emptyDir:
            sizeLimit: 16Mi
        - name: storage
          persistentVolumeClaim:
            claimName: jitsi-prosody-storage
        - name: run
          emptyDir:
            sizeLimit: 16Mi
        - name: tmp
          emptyDir:
            sizeLimit: 16Mi

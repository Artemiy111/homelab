# Базовый NetworkPolicy: default-deny ingress плюс явные разрешения.
# traefik — веб; поды namespace'а ходят друг к другу (linkwarden → meilisearch).
# Egress не ограничивается: архиватору нужен интернет, а политика разграничивает
# cross-namespace доступ на стороне получателя.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-ingress
  namespace: linkwarden
spec:
  podSelector: {}
  policyTypes:
    - Ingress
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-ingress
  namespace: linkwarden
spec:
  podSelector: {}
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector: {}
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: traefik

apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultStaticSecret
metadata:
  name: linkwarden-db-auth
  namespace: linkwarden
spec:
  vaultAuthRef: vso-linkwarden
  mount: kv
  type: kv-v2
  path: linkwarden/db
  refreshAfter: 1h
  destination:
    name: linkwarden-db-auth
    create: true
    overwrite: true
    type: kubernetes.io/basic-auth
    transformation:
      excludeRaw: true
---
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultStaticSecret
metadata:
  name: linkwarden-secrets
  namespace: linkwarden
spec:
  vaultAuthRef: vso-linkwarden
  mount: kv
  type: kv-v2
  path: linkwarden/secrets
  refreshAfter: 1h
  destination:
    name: linkwarden-secrets
    create: true
    overwrite: true
    transformation:
      excludeRaw: true

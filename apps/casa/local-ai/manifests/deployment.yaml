apiVersion: apps/v1
kind: Deployment
metadata:
  name: local-ai
  namespace: local-ai
spec:
  # RWO-тома: два пода при rolling update пишут в одни каталоги.
  strategy:
    type: Recreate
  revisionHistoryLimit: 1
  replicas: 1
  selector:
    matchLabels:
      app: local-ai
  template:
    metadata:
      labels:
        app: local-ai
    spec:
      terminationGracePeriodSeconds: 120
      # fsGroup даёт групповую запись в тома Longhorn для пользователя 1000.
      securityContext:
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
      containers:
        - name: local-ai
          image: "localai/localai:v4.12.1@sha256:c8556c4f7b6dd9b76e915d515ab5cfe5a765d8ea8fd3f0cf563f9c690b48a7f4"
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - configMapRef:
                name: homelab-config
          env:
            - name: LOCALAI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: local-ai-api-key
                  key: LOCALAI_API_KEY
            - name: HOME
              value: /tmp/localai
            - name: LOCALAI_ADDRESS
              value: 0.0.0.0:8080
            - name: LOCALAI_LOG_LEVEL
              value: info
            - name: LOCALAI_SUBTLE_KEY_COMPARISON
              value: "true"
            - name: LOCALAI_DISABLE_USAGE_STATS
              value: "true"
          startupProbe:
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 5
            timeoutSeconds: 10
            failureThreshold: 30
          livenessProbe:
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 3
          securityContext:
            runAsUser: 1000
            runAsGroup: 1000
            runAsNonRoot: true
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            seccompProfile:
              type: RuntimeDefault
          resources:
            requests:
              cpu: 100m
              # Суточный пик 243 МиБ по cAdvisor в VM: движок всё же запускался.
              # Пятиминутный сэмпл это пропустил.
              memory: 256Mi
            limits:
              cpu: "4"
              memory: 20Gi
          volumeMounts:
            - name: models
              mountPath: /models
            - name: backends
              mountPath: /backends
            - name: configuration
              mountPath: /configuration
            - name: data
              mountPath: /data
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: models
          persistentVolumeClaim:
            claimName: local-ai-models
        - name: backends
          persistentVolumeClaim:
            claimName: local-ai-backends
        - name: configuration
          persistentVolumeClaim:
            claimName: local-ai-configuration
        - name: data
          persistentVolumeClaim:
            claimName: local-ai-data
        - name: tmp
          emptyDir:
            sizeLimit: 4Gi

apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: mas
  namespace: mas
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  parentRefs:
    - name: homelab
      namespace: traefik
  hostnames:
    - mas.biplane.casa
  rules:
    - backendRefs:
        - name: mas
          port: 80

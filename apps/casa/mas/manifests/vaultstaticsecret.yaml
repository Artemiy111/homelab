apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultStaticSecret
metadata:
  name: mas-db
  namespace: mas
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  vaultAuthRef: vso-mas
  mount: kv
  type: kv-v2
  path: mas/db
  refreshAfter: 1h
  destination:
    name: mas-db
    create: true
    overwrite: true
    type: kubernetes.io/basic-auth
    transformation:
      excludeRaw: true
---
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultStaticSecret
metadata:
  name: mas-oidc
  namespace: mas
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  vaultAuthRef: vso-mas
  mount: kv
  type: kv-v2
  path: mas/oidc
  refreshAfter: 1h
  rolloutRestartTargets:
    - kind: Deployment
      name: mas
  destination:
    name: mas-oidc
    create: true
    overwrite: true
    transformation:
      excludeRaw: true
---
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultStaticSecret
metadata:
  name: mas-secrets
  namespace: mas
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  vaultAuthRef: vso-mas
  mount: kv
  type: kv-v2
  path: mas/secrets
  refreshAfter: 1h
  rolloutRestartTargets:
    - kind: Deployment
      name: mas
  destination:
    name: mas-secrets
    create: true
    overwrite: true
    transformation:
      excludeRaw: true

apiVersion: apps/v1
kind: Deployment
metadata:
  name: mihomo-bridge
  namespace: mihomo
spec:
  replicas: 1
  revisionHistoryLimit: 1
  selector:
    matchLabels:
      app: mihomo-bridge
  template:
    metadata:
      labels:
        app: mihomo-bridge
    spec:
      containers:
        - name: bridge
          image: "python:3.13-alpine@sha256:9ef1a599f863231c3d91e941389bfdc4a2d6070557243d54df1a4e57015b960e"
          imagePullPolicy: IfNotPresent
          command: ["python", "/opt/bridge/bridge.py"]
          env:
            - name: SSL_CERT_DIR
              value: "/etc/ssl/certs:/usr/local/share/geny"
          ports:
            - containerPort: 8081
              name: bridge
          readinessProbe:
            httpGet:
              path: /healthz
              port: bridge
            timeoutSeconds: 3
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /healthz
              port: bridge
            timeoutSeconds: 3
            periodSeconds: 30
            failureThreshold: 3
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            seccompProfile:
              type: RuntimeDefault
          resources:
            requests:
              cpu: 5m
              memory: 32Mi
            limits:
              cpu: 200m
              memory: 128Mi
          volumeMounts:
            - name: script
              mountPath: /opt/bridge
              readOnly: true
            - name: subscription
              mountPath: /var/run/secrets/mihomo
              readOnly: true
            - name: geny
              mountPath: /usr/local/share/geny
              readOnly: true
      volumes:
        - name: script
          configMap:
            name: mihomo-bridge
            defaultMode: 0444
        - name: subscription
          secret:
            secretName: mihomo-subscription
            items:
              - key: SUBSCRIPTION_URL
                path: SUBSCRIPTION_URL
        - name: geny
          configMap:
            name: mihomo-bridge-geny
            defaultMode: 0444

apiVersion: v1
kind: ConfigMap
metadata:
  name: mihomo-bridge
  namespace: mihomo
data:
  bridge.py: |
    from http.server import BaseHTTPRequestHandler, ThreadingHTTPServer
    from urllib.request import Request, urlopen

    SECRET_PATH = "/var/run/secrets/mihomo/SUBSCRIPTION_URL"

    def provider_document(body: bytes) -> bytes:
        text = body.decode("utf-8", errors="replace")
        lines = text.splitlines()
        start = None
        for index, line in enumerate(lines):
            if line.rstrip() == "proxies:":
                start = index
                break
        if start is None:
            return body
        kept = ["proxies:"]
        for line in lines[start + 1:]:
            if line and not line[0].isspace():
                break
            kept.append(line)
        return ("\n".join(kept) + "\n").encode("utf-8")

    class Handler(BaseHTTPRequestHandler):
        protocol_version = "HTTP/1.1"

        def do_GET(self):
            path = self.path.split("?", 1)[0]
            if path == "/healthz":
                self.reply(200, b"ok\n", "text/plain; charset=utf-8")
                return
            if path != "/provider":
                self.send_error(404, "not found")
                return
            try:
                with open(SECRET_PATH, encoding="utf-8") as handle:
                    subscription_url = handle.read().strip()
            except OSError:
                subscription_url = ""
            if not subscription_url:
                self.send_error(503, "subscription url is not configured")
                return
            try:
                request = Request(subscription_url, headers={"User-Agent": "mihomo-bridge"})
                with urlopen(request, timeout=30) as response:
                    body = response.read()
                    status = response.status
            except Exception:
                self.send_error(502, "upstream subscription failed")
                return
            self.reply(status, provider_document(body), "text/yaml; charset=utf-8")

        def reply(self, status, body, content_type):
            self.send_response(status)
            self.send_header("Content-Type", content_type)
            self.send_header("Content-Length", str(len(body)))
            self.end_headers()
            self.wfile.write(body)

        def log_message(self, fmt, *args):
            return

    ThreadingHTTPServer(("0.0.0.0", 8081), Handler).serve_forever()

apiVersion: v1
kind: ServiceAccount
metadata:
  name: vso-mihomo
  namespace: mihomo
---
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultAuth
metadata:
  name: vso-mihomo
  namespace: mihomo
spec:
  vaultAuthGlobalRef:
    name: vso-global
    namespace: vault-secrets-operator
  kubernetes:
    role: mihomo
    serviceAccount: vso-mihomo

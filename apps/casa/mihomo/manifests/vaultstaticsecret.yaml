apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultStaticSecret
metadata:
  name: mihomo-subscription
  namespace: mihomo
spec:
  vaultAuthRef: vso-mihomo
  mount: kv
  type: kv-v2
  path: mihomo/subscription
  refreshAfter: 1h
  destination:
    name: mihomo-subscription
    create: true
    overwrite: true
    transformation:
      excludeRaw: true

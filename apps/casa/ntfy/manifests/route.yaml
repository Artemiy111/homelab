apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: ntfy
  namespace: ntfy
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  parentRefs:
    - name: homelab
      namespace: traefik
  hostnames:
    - ntfy.biplane.casa
  rules:
    - backendRefs:
        - name: ntfy
          port: 80

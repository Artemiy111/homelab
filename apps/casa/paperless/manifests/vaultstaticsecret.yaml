apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultStaticSecret
metadata:
  name: paperless-db
  namespace: paperless
spec:
  vaultAuthRef: vso-paperless
  mount: kv
  type: kv-v2
  path: paperless/db
  refreshAfter: 1h
  destination:
    name: paperless-db
    create: true
    overwrite: true
    transformation:
      excludeRaw: true
---
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultStaticSecret
metadata:
  name: paperless-secrets
  namespace: paperless
spec:
  vaultAuthRef: vso-paperless
  mount: kv
  type: kv-v2
  path: paperless/secrets
  refreshAfter: 1h
  destination:
    name: paperless-secrets
    create: true
    overwrite: true
    transformation:
      excludeRaw: true

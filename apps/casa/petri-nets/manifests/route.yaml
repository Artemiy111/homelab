apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: petri-nets
  namespace: petri-nets
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  parentRefs:
    - name: homelab
      namespace: traefik
  hostnames:
    - petri-nets.biplane.casa
  rules:
    - backendRefs:
        - name: petri-nets
          port: 80

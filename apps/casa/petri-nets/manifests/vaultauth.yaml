apiVersion: v1
kind: ServiceAccount
metadata:
  name: vso-petri-nets
  namespace: petri-nets
---
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultAuth
metadata:
  name: vso-petri-nets
  namespace: petri-nets
spec:
  vaultAuthGlobalRef:
    name: vso-global
    namespace: vault-secrets-operator
  kubernetes:
    role: petri-nets
    serviceAccount: vso-petri-nets

apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultStaticSecret
metadata:
  name: petri-nets-glitchtip
  namespace: petri-nets
spec:
  vaultAuthRef: vso-petri-nets
  mount: kv
  type: kv-v2
  path: petri-nets/glitchtip
  refreshAfter: 1h
  destination:
    name: petri-nets-glitchtip
    create: true
    overwrite: true
    transformation:
      excludeRaw: true

apiVersion: v1
kind: ServiceAccount
metadata:
  name: vso-postgres
  namespace: postgres
---
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultAuth
metadata:
  name: vso-postgres
  namespace: postgres
spec:
  vaultAuthGlobalRef:
    name: vso-global
    namespace: vault-secrets-operator
  kubernetes:
    role: postgres
    serviceAccount: vso-postgres

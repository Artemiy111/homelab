apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  annotations:
    argocd.argoproj.io/sync-options: Prune=false
  name: pyroscope-data
  namespace: monitoring
spec:
  storageClassName: longhorn-retain
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      # Профили — сэмплы стеков, поток невелик, но растёт с числом
      # инструментируемых процессов. Pyroscope сам удаляет старые блоки при
      # нехватке места (retention-policy + limits.retention_period); объём —
      # с запасом под неделю данных.
      storage: 20Gi

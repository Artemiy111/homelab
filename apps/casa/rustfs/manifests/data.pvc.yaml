# Данные rustfs (бакеты S3): без backup target, поэтому longhorn-retain —
# удаление PVC не должно стирать объекты. RWO-том на одной ноде требует
# strategy.type: Recreate (см. deployment.yaml).
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  annotations:
    argocd.argoproj.io/sync-options: Prune=false
  name: rustfs-data
  namespace: rustfs
spec:
  storageClassName: longhorn-retain
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      # Зеркало CI-артефактов (бакет mirror) + запас под новые версии; том
      # расширяется на ходу (allowVolumeExpansion), данные при этом сохраняются.
      # Пакеты Terraform-провайдеров лежат в этом же бакете, и бакет
      # append-only: версия провайдера уходит из зеркала только вручную.
      # hashicorp/aws — самый крупный (~180 МБ в архиве), поэтому запас кратный
      # нескольким его версиям.
      storage: 8Gi

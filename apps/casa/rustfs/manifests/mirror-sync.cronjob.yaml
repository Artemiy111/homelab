# Синк зеркала артефактов в RustFS (issue #149). Периодически (и вручную)
# скачивает в бакет mirror то, что перечислено в apps/casa/rustfs/manifests/artifacts.tsv,
# плюс схемы kubeconform. Бакет и public-read policy принадлежат infra/casa/terraform/rustfs.
#
# Скрипт (apps/casa/rustfs/manifests/mirror-sync.sh) и манифест (apps/casa/rustfs/manifests/artifacts.tsv)
# едут в ConfigMap mirror-sync через kustomize:
#   kubectl apply -k apps/casa/rustfs
#
# Ручной запуск: kubectl -n rustfs create job --from=cronjob/mirror-sync mirror-sync-manual
apiVersion: batch/v1
kind: CronJob
metadata:
  name: mirror-sync
  namespace: rustfs
spec:
  schedule: "17 4 * * *"
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 3600
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 1
      template:
        spec:
          restartPolicy: Never
          containers:
            - name: sync
              image: "amazon/aws-cli:2.38.5@sha256:c8156a0e74e13929a42d7e60f0d4e14e7d28d980cd21822505d4bff80e5460c1"
              command:
                - /bin/bash
                - /scripts/mirror-sync.sh
              env:
                - name: S3_ENDPOINT
                  value: http://rustfs.rustfs.svc.cluster.local
                - name: AWS_DEFAULT_REGION
                  value: us-east-1
                - name: KUBERNETES_VERSION
                  value: "1.36.3"
                # Тот же пин, что и CRD_SCHEMAS_REV в scripts/kubeconform.sh:
                # ключ кэша схем в workflow и источник в зеркале обязаны совпадать.
                - name: CRD_SCHEMAS_REV
                  value: "fd90051867733c60d32d16450556e9cd18459aef"
                - name: AWS_ACCESS_KEY_ID
                  valueFrom:
                    secretKeyRef:
                      name: rustfs-credentials
                      key: RUSTFS_ACCESS_KEY
                - name: AWS_SECRET_ACCESS_KEY
                  valueFrom:
                    secretKeyRef:
                      name: rustfs-credentials
                      key: RUSTFS_SECRET_KEY
                - name: PROXY_USERNAME
                  valueFrom:
                    secretKeyRef:
                      name: mirror-sync-egress
                      key: username
                      optional: true
                - name: PROXY_PASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: mirror-sync-egress
                      key: password
                      optional: true
              resources:
                requests:
                  cpu: 50m
                  memory: 128Mi
                limits:
                  cpu: "1"
                  memory: 512Mi
              volumeMounts:
                - name: scripts
                  mountPath: /scripts
                  readOnly: true
          volumes:
            - name: scripts
              configMap:
                name: mirror-sync

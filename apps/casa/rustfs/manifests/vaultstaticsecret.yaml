apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultStaticSecret
metadata:
  name: rustfs-credentials
  namespace: rustfs
spec:
  vaultAuthRef: vso-rustfs
  mount: kv
  type: kv-v2
  path: rustfs/credentials
  refreshAfter: 1h
  destination:
    name: rustfs-credentials
    create: true
    overwrite: true
    transformation:
      excludeRaw: true
---
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultStaticSecret
metadata:
  name: mirror-sync-egress
  namespace: rustfs
spec:
  vaultAuthRef: vso-rustfs
  mount: kv
  type: kv-v2
  path: 3x-ui/@mirror-sync/egress
  refreshAfter: 1h
  destination:
    name: mirror-sync-egress
    create: true
    overwrite: true
    transformation:
      excludeRaw: true

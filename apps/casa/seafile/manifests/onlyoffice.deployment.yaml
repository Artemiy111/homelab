apiVersion: apps/v1
kind: Deployment
metadata:
  name: onlyoffice
  namespace: seafile
spec:
  # RWO-тома: два пода при rolling update пишут в одни каталоги.
  strategy:
    type: Recreate
  revisionHistoryLimit: 1
  replicas: 1
  selector:
    matchLabels:
      app: onlyoffice
  template:
    metadata:
      labels:
        app: onlyoffice
    spec:
      # Иначе Service `db` (nextcloud) инжектит DB_PORT=tcp://…:5432, и
      # entrypoint OnlyOffice падает на `nc -z`.
      enableServiceLinks: false
      containers:
        - name: onlyoffice
          image: "onlyoffice/documentserver:9.4.0@sha256:e3da62a847b9a5d51a11f73cfea1d9c13c3be3809614490d4edddcf01dcf919b"
          ports:
            - name: http
              containerPort: 80
          env:
            - name: JWT_ENABLED
              value: "true"
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: seafile-secrets
                  key: ONLYOFFICE_JWT_SECRET
            - name: JWT_HEADER
              value: Authorization
            - name: JWT_IN_BODY
              value: "true"
            - name: ALLOW_PRIVATE_IP_ADDRESS
              value: "true"
          startupProbe:
            httpGet:
              path: /healthcheck
              port: http
            periodSeconds: 5
            timeoutSeconds: 10
            failureThreshold: 12
          livenessProbe:
            httpGet:
              path: /healthcheck
              port: http
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /healthcheck
              port: http
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 3
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
              add: ["CHOWN", "DAC_OVERRIDE", "FOWNER", "SETGID", "SETUID"]
            seccompProfile:
              type: RuntimeDefault
          resources:
            requests:
              cpu: 50m
              memory: 512Mi
            limits:
              cpu: 500m
              memory: 1Gi
          volumeMounts:
            - name: logs
              mountPath: /var/log/onlyoffice
            - name: data
              mountPath: /var/www/onlyoffice/Data
            - name: lib
              mountPath: /var/lib/onlyoffice
      volumes:
        - name: logs
          emptyDir: {}
        - name: data
          persistentVolumeClaim:
            claimName: seafile-onlyoffice-data
        - name: lib
          persistentVolumeClaim:
            claimName: seafile-onlyoffice-lib

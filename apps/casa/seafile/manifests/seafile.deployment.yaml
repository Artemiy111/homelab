apiVersion: apps/v1
kind: Deployment
metadata:
  name: seafile
  namespace: seafile
spec:
  # RWO-том /shared: два пода при rolling update пишут в один каталог.
  strategy:
    type: Recreate
  revisionHistoryLimit: 1
  replicas: 1
  selector:
    matchLabels:
      app: seafile
  template:
    metadata:
      labels:
        app: seafile
    spec:
      enableServiceLinks: false
      initContainers:
        - name: wait-for-db
          image: "mariadb:10.11@sha256:0d0945c57f75b3a3b9ebe71aedaaad005fa5305054e8fca3d2e42a8c92b43b5e"
          command: ["/bin/sh", "-c", "until mariadb-admin ping -h seafile-mariadb -P 3306 --silent; do echo waiting for seafile-mariadb; sleep 3; done"]
          securityContext:
            runAsUser: 999
            runAsGroup: 999
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            seccompProfile:
              type: RuntimeDefault
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 64Mi
        - name: wait-for-redis
          image: "valkey/valkey:9-alpine@sha256:48332870af354a799964c0012ae1194a0bf2bf894eb508f945810596dc2d8d11"
          command: ["/bin/sh", "-c", "until valkey-cli -h seafile-redis ping | grep -q PONG; do echo waiting for seafile-redis; sleep 2; done"]
          securityContext:
            runAsUser: 999
            runAsGroup: 999
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            seccompProfile:
              type: RuntimeDefault
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 64Mi
      containers:
        - name: seafile
          image: "seafileltd/seafile-mc:13.0.28@sha256:b0c90832126bf432db908449f1bb450211e6bbf75a2193bab3399e2a9636eccf"
          # Обёртка вокруг оригинального entrypoint образа: сначала подготовка
          # seahub (настройки + патчи), затем exec исходного init-процесса
          # (`my_init -- /scripts/enterpoint.sh` с PID1). Так патчи применяются
          # до старта seahub; init-контейнером это не сделать — код seahub лежит
          # в слое образа, а не на общем томе.
          command:
            - /bin/sh
            - -c
            - /bin/sh /prepare-seahub.sh && exec /usr/bin/python3 -u /sbin/my_init -- /scripts/enterpoint.sh
          args: []
          ports:
            - name: http
              containerPort: 80
          env:
            - name: DOMAIN
              valueFrom:
                configMapKeyRef:
                  name: homelab-config
                  key: DOMAIN
            - name: TIME_ZONE
              valueFrom:
                configMapKeyRef:
                  name: homelab-config
                  key: TZ
            - name: SEAFILE_MYSQL_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: seafile-db
                  key: SEAFILE_MYSQL_DB_PASSWORD
            - name: JWT_PRIVATE_KEY
              valueFrom:
                secretKeyRef:
                  name: seafile-secrets
                  key: JWT_PRIVATE_KEY
            - name: ONLYOFFICE_JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: seafile-secrets
                  key: ONLYOFFICE_JWT_SECRET
            - name: OAUTH_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: seafile-oidc
                  key: OAUTH_CLIENT_ID
            - name: OAUTH_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: seafile-oidc
                  key: OAUTH_CLIENT_SECRET
            # /metrics (ENABLE_METRIC), провижинится в seahub_settings.py через
            # prepare-seahub.sh; пользователь фиксирован, пароль — из Vault.
            - name: METRIC_AUTH_USER
              value: "prometheus"
            - name: METRIC_AUTH_PWD
              valueFrom:
                secretKeyRef:
                  name: seafile-metrics
                  key: SEAFILE_METRICS_PASSWORD
            - name: SEAFILE_SERVER_HOSTNAME
              value: "seafile.$(DOMAIN)"
            - name: SEAFILE_SERVER_PROTOCOL
              value: https
            # Читается код-патчем при JIT-провижининге: только этот email
            # получает is_staff=True при первом SSO-входе.
            - name: INIT_SEAFILE_ADMIN_EMAIL
              value: "admin@$(DOMAIN)"
            - name: SEAFILE_MYSQL_DB_HOST
              value: seafile-mariadb.seafile.svc.cluster.local
            - name: SEAFILE_MYSQL_DB_PORT
              value: "3306"
            - name: SEAFILE_MYSQL_DB_USER
              value: seafile
            - name: SEAFILE_MYSQL_DB_CCNET_DB_NAME
              value: ccnet_db
            - name: SEAFILE_MYSQL_DB_SEAFILE_DB_NAME
              value: seafile_db
            - name: SEAFILE_MYSQL_DB_SEAHUB_DB_NAME
              value: seahub_db
            - name: CACHE_PROVIDER
              value: redis
            - name: REDIS_HOST
              value: seafile-redis.seafile.svc.cluster.local
            - name: REDIS_PORT
              value: "6379"
            - name: ENABLE_ONLYOFFICE
              value: "true"
            - name: ONLYOFFICE_HOST
              value: "onlyoffice.$(DOMAIN)"
            - name: ONLYOFFICE_APIJS_URL
              value: "https://onlyoffice.$(DOMAIN)/web-apps/apps/api/documents/api.js"
            - name: ONLYOFFICE_JWT_HEADER
              value: Authorization
          startupProbe:
            httpGet:
              path: /api2/ping/
              port: http
            periodSeconds: 5
            timeoutSeconds: 10
            failureThreshold: 24
          livenessProbe:
            httpGet:
              path: /api2/ping/
              port: http
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /api2/ping/
              port: http
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 3
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
              add: ["CHOWN", "DAC_OVERRIDE", "FOWNER", "SETGID", "SETUID"]
            seccompProfile:
              type: RuntimeDefault
          resources:
            requests:
              cpu: 30m
              memory: 512Mi
            limits:
              cpu: 500m
              memory: 1224Mi
          volumeMounts:
            - name: shared
              mountPath: /shared
            - name: seahub-onlyoffice
              mountPath: /shared/seafile/conf/seahub_onlyoffice.py
              subPath: seahub_onlyoffice.py
              readOnly: true
            - name: seahub-oauth
              mountPath: /shared/seafile/conf/seahub_oauth.py
              subPath: seahub_oauth.py
              readOnly: true
            - name: patches
              mountPath: /patches
              readOnly: true
            - name: prepare-seahub
              mountPath: /prepare-seahub.sh
              subPath: prepare-seahub.sh
              readOnly: true
      volumes:
        - name: shared
          persistentVolumeClaim:
            claimName: seafile-shared
        - name: seahub-onlyoffice
          configMap:
            name: seafile-config
            items:
              - key: seahub_onlyoffice.py
                path: seahub_onlyoffice.py
        - name: seahub-oauth
          configMap:
            name: seafile-config
            items:
              - key: seahub_oauth.py
                path: seahub_oauth.py
        - name: patches
          configMap:
            name: seafile-config
            items:
              - key: seahub-base-accounts.patch
                path: seahub-base-accounts.patch
              - key: seahub-oauth-views.patch
                path: seahub-oauth-views.patch
        - name: prepare-seahub
          configMap:
            name: seafile-config
            items:
              - key: prepare-seahub.sh
                path: prepare-seahub.sh

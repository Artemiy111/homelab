apiVersion: apps/v1
kind: Deployment
metadata:
  name: structurizr
  namespace: structurizr
spec:
  # RWO-том: два пода при rolling update пишут в один workspace.
  strategy:
    type: Recreate
  revisionHistoryLimit: 1
  replicas: 0
  selector:
    matchLabels:
      app: structurizr
  template:
    metadata:
      labels:
        app: structurizr
    spec:
      enableServiceLinks: false
      # fsGroup даёт групповую запись в том Longhorn, иначе root-owned каталог
      # тома недоступен пользователю 1000.
      securityContext:
        fsGroup: 1000
      containers:
        - name: structurizr
          image: registry.yandexcloud.net/cn1j4anu7cclpi3ept3a/structurizr:2026.06.28@sha256:3e6ca128660e99a269cfbe2d628a87b27863b1cb546939fa399e2e02b5ef89e7
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: PORT
              value: "8080"
            - name: TZ
              valueFrom:
                configMapKeyRef:
                  name: homelab-config
                  key: TZ
            - name: JAVA_TOOL_OPTIONS
              value: "-XX:MaxRAMPercentage=60"
          startupProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 5
            timeoutSeconds: 20
            failureThreshold: 12
          livenessProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 15
            timeoutSeconds: 10
            failureThreshold: 3
          securityContext:
            runAsUser: 1000
            runAsGroup: 1000
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            seccompProfile:
              type: RuntimeDefault
          resources:
            requests:
              cpu: 10m
              memory: 384Mi
            limits:
              cpu: "2"
              memory: 1Gi
          volumeMounts:
            - name: data
              mountPath: /usr/local/structurizr
            - name: properties
              mountPath: /usr/local/structurizr/structurizr.properties
              subPath: structurizr.properties
              readOnly: true
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: structurizr-data
        - name: properties
          configMap:
            name: structurizr-properties
      imagePullSecrets:
        - name: structurizr-registry

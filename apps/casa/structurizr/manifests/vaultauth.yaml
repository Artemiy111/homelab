apiVersion: v1
kind: ServiceAccount
metadata:
  name: vso-structurizr
  namespace: structurizr
---
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultAuth
metadata:
  name: vso-structurizr
  namespace: structurizr
spec:
  vaultAuthGlobalRef:
    name: vso-global
    namespace: vault-secrets-operator
  kubernetes:
    role: structurizr
    serviceAccount: vso-structurizr

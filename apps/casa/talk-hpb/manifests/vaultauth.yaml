apiVersion: v1
kind: ServiceAccount
metadata:
  name: vso-talk-hpb
  namespace: talk-hpb
---
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultAuth
metadata:
  name: vso-talk-hpb
  namespace: talk-hpb
spec:
  vaultAuthGlobalRef:
    name: vso-global
    namespace: vault-secrets-operator
  kubernetes:
    role: talk-hpb
    serviceAccount: vso-talk-hpb

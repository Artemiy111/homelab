apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: trivy-operator-dashboard
  namespace: trivy-operator-dashboard
spec:
  parentRefs:
    - name: homelab
      namespace: traefik
  hostnames:
    - trivy.biplane.casa
  rules:
    - backendRefs:
        - name: trivy-operator-dashboard
          port: 8900
          filters:
            - type: ExtensionRef
              extensionRef:
                group: traefik.io
                kind: Middleware
                name: oauth2-proxy
            - type: ExtensionRef
              extensionRef:
                group: traefik.io
                kind: Middleware
                name: secure-headers
            - type: ExtensionRef
              extensionRef:
                group: traefik.io
                kind: Middleware
                name: ratelimit-default

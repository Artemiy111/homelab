apiVersion: apps/v1
kind: Deployment
metadata:
  name: uptime-kuma
  namespace: uptime-kuma
spec:
  strategy:
    type: Recreate
  revisionHistoryLimit: 1
  replicas: 1
  selector:
    matchLabels:
      app: uptime-kuma
  template:
    metadata:
      labels:
        app: uptime-kuma
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      # uid 1000 — пользователь node в образе. fsGroup делает emptyDir
      # группово-записываемым: kubelet создаёт каталоги томов от root.
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: uptime-kuma
          image: "louislam/uptime-kuma:2.5.7@sha256:4b95dbe7ac5343b768f8e04e3035ccd59997872b1a35ab9b0f082d2cc279070e"
          ports:
            - containerPort: 3001
              name: http
          env:
            - name: NODE_OPTIONS
              value: "--max-old-space-size=512"
            # Скриншоты проверок рисует Chromium: ему нужны записываемые /tmp
            # и HOME, а корневая ФС только для чтения.
            - name: HOME
              value: "/tmp"
            # Переменные перекрывают /app/data/db-config.json: в
            # server/setup-database.js приоритет env над файлом, и Kuma
            # переписывает конфигурацию сама. Она записывает туда же
            # пароль открытым текстом.
            - name: UPTIME_KUMA_DB_TYPE
              value: "mariadb"
            - name: UPTIME_KUMA_DB_HOSTNAME
              value: "uptime-kuma-mariadb.uptime-kuma.svc.cluster.local"
            - name: UPTIME_KUMA_DB_PORT
              value: "3306"
            - name: UPTIME_KUMA_DB_NAME
              value: "kuma"
            - name: UPTIME_KUMA_DB_USERNAME
              valueFrom:
                secretKeyRef:
                  name: uptime-kuma-mariadb
                  key: DB_USERNAME
            - name: UPTIME_KUMA_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: uptime-kuma-mariadb
                  key: DB_PASSWORD
          startupProbe:
            failureThreshold: 18
            httpGet:
              path: /
              port: http
            periodSeconds: 5
            timeoutSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /
              port: http
            timeoutSeconds: 5
            failureThreshold: 3
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 10m
              memory: 128Mi
            limits:
              cpu: 150m
              memory: 448Mi
          volumeMounts:
            - name: data
              mountPath: /app/data
            - name: tmp
              mountPath: /tmp
      volumes:
        # В /app/data остаются
        # db-config.json, upload/, screenshots/ и error.log: первый Kuma
        # переписывает из переменных окружения при каждом старте, скриншоты
        # пересоздаются проверками, а загрузки из UI переживут только до
        # пересоздания пода. sizeLimit ограничивает те самые загрузки.
        - name: data
          emptyDir:
            sizeLimit: 32Mi
        # Рабочий каталог Chromium и временные файлы Node.
        - name: tmp
          emptyDir:
            sizeLimit: 128Mi

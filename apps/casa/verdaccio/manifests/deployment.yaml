apiVersion: apps/v1
kind: Deployment
metadata:
  name: verdaccio
  namespace: verdaccio
spec:
  # RWO-том: два пода одновременно его не смонтируют.
  strategy:
    type: Recreate
  revisionHistoryLimit: 1
  replicas: 1
  selector:
    matchLabels:
      app: verdaccio
  template:
    metadata:
      labels:
        app: verdaccio
    spec:
      # Kubernetes иначе инжектит в под env сервиса, в т. ч.
      # VERDACCIO_PORT=tcp://<ClusterIP>:80, и Verdaccio собирает из него
      # невалидный адрес прослушивания.
      enableServiceLinks: false
      securityContext:
        # fsGroup даёт групповую запись в том Longhorn под uid/gid 10001
        # (uid пользователя verdaccio в образе).
        fsGroup: 10001
      containers:
        - name: verdaccio
          image: "verdaccio/verdaccio:7.0.2@sha256:b31af41ced1bda71181ed5e27b047087ad48dd573a12e7af6e9ef3072ddf2b35"
          env:
            # Образ по умолчанию слушает [::]; в кластере надёжнее IPv4-any.
            - name: VERDACCIO_ADDRESS
              value: 0.0.0.0
          ports:
            - name: http
              containerPort: 4873
          startupProbe:
            httpGet:
              path: /-/ping
              port: http
            periodSeconds: 5
            timeoutSeconds: 10
            failureThreshold: 18
          livenessProbe:
            httpGet:
              path: /-/ping
              port: http
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /-/ping
              port: http
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          securityContext:
            runAsUser: 10001
            runAsGroup: 10001
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            seccompProfile:
              type: RuntimeDefault
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: "1"
              memory: 512Mi
          volumeMounts:
            - name: config
              mountPath: /verdaccio/conf/config.yaml
              subPath: config.yaml
              readOnly: true
            - name: data
              mountPath: /verdaccio/storage
      volumes:
        - name: config
          configMap:
            name: verdaccio
        - name: data
          persistentVolumeClaim:
            claimName: verdaccio-data

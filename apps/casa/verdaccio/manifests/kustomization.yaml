apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: verdaccio
resources:
  - namespace.yaml
  - route.yaml
  - service.yaml
  - deployment.yaml
  - data.pvc.yaml
  - networkpolicy.yaml
configMapGenerator:
  # config.yaml собирается в ConfigMap `verdaccio`; kustomize добавляет хэш
  # содержимого к имени и переписывает ссылку в Deployment, поэтому правка
  # конфига сама запускает rollout.
  - name: verdaccio
    files:
      - config/config.yaml

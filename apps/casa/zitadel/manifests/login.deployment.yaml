apiVersion: apps/v1
kind: Deployment
metadata:
  annotations:
    argocd.argoproj.io/sync-wave: "3"
  name: zitadel-login
  namespace: zitadel
spec:
  strategy:
    type: Recreate
  revisionHistoryLimit: 1
  replicas: 1
  selector:
    matchLabels:
      app: zitadel-login
  template:
    metadata:
      labels:
        app: zitadel-login
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      priorityClassName: platform-critical
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        runAsGroup: 65533
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: zitadel-login
          image: "ghcr.io/zitadel/zitadel-login:v4.20.0@sha256:f1abfdf3c5d16eda03cad3b584226207ecc640ca5c679d7c45abbbce7d1d63f0"
          ports:
            - name: http
              containerPort: 3000
          env:
            # AUDIENCE и CUSTOM_REQUEST_HEADERS строятся от DOMAIN, поэтому login
            # UI обязан видеть ровно тот домен, который объявляет issuer.
            - name: DOMAIN
              valueFrom:
                configMapKeyRef:
                  name: homelab-config
                  key: DOMAIN
            - name: TZ
              valueFrom:
                configMapKeyRef:
                  name: homelab-config
                  key: TZ
            - name: ZITADEL_API_URL
              value: http://zitadel.zitadel.svc.cluster.local
            - name: NEXT_PUBLIC_BASE_PATH
              value: /ui/v2/login
            - name: ZITADEL_LOGINCLIENT_KEYFILE
              value: /login-service-key/tls.key
            - name: ZITADEL_SESSION_COOKIE_SECRET
              valueFrom:
                secretKeyRef:
                  name: zitadel-session-cookie
                  key: secret
            - name: AUDIENCE
              value: "https://id.$(DOMAIN)"
            - name: CUSTOM_REQUEST_HEADERS
              value: "Host:id.$(DOMAIN),X-Forwarded-Proto:https"
          startupProbe:
            exec:
              command: ["/bin/sh", "-c", "node /app/healthcheck.mjs http://localhost:3000/ui/v2/login/healthy"]
            periodSeconds: 5
            timeoutSeconds: 10
            failureThreshold: 24
          livenessProbe:
            exec:
              command: ["/bin/sh", "-c", "node /app/healthcheck.mjs http://localhost:3000/ui/v2/login/healthy"]
            periodSeconds: 30
            timeoutSeconds: 30
            failureThreshold: 3
          readinessProbe:
            exec:
              command: ["/bin/sh", "-c", "node /app/healthcheck.mjs http://localhost:3000/ui/v2/login/healthy"]
            periodSeconds: 15
            timeoutSeconds: 30
            failureThreshold: 3
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 35m
              memory: 128Mi
            limits:
              cpu: 60m
              memory: 200Mi
          volumeMounts:
            - name: login-service-key
              mountPath: /login-service-key
              readOnly: true
      volumes:
        - name: login-service-key
          secret:
            secretName: zitadel-login-service-key
            items:
              - key: tls.key
                path: tls.key

    matchLabels:
      app: zitadel-login
  policyTypes:
    - Egress
  egress:
    - to:
        - podSelector:
            matchLabels:
              app: zitadel
      ports:
        - port: 8080
          protocol: TCP
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  annotations:
    argocd.argoproj.io/sync-wave: "0"
  name: allow-egress-db
  namespace: zitadel
spec:
  podSelector:
    matchLabels:
      cnpg.io/cluster: zitadel-db
  policyTypes:
    - Egress
  egress:
    - to:
        - podSelector: {}
    - to:
        - ipBlock:
            cidr: 10.0.0.0/8
      ports:
        - port: 443
          protocol: TCP
    - to:
        - ipBlock:
            cidr: 192.168.1.254/32
      ports:
        - port: 6443
          protocol: TCP

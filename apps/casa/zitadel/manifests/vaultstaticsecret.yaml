apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultStaticSecret
metadata:
  annotations:
    argocd.argoproj.io/sync-wave: "1"
  name: zitadel-admin
  namespace: zitadel
spec:
  vaultAuthRef: vso-zitadel
  mount: kv
  type: kv-v2
  path: zitadel/admin
  refreshAfter: 1h
  destination:
    name: zitadel-admin
    create: true
    overwrite: true
    transformation:
      excludeRaw: true
---

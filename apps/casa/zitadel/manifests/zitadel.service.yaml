apiVersion: v1
kind: Service
metadata:
  annotations:
    argocd.argoproj.io/sync-wave: "2"
  name: zitadel
  namespace: zitadel
spec:
  type: ClusterIP
  selector:
    app: zitadel
  ports:
    - name: http
      port: 80
      targetPort: http
      protocol: TCP
      appProtocol: kubernetes.io/h2c

apiVersion: apps/v1
kind: Deployment
metadata:
  name: zot
  namespace: zot
spec:
  # RWO-том: два пода одновременно его не смонтируют.
  strategy:
    type: Recreate
  revisionHistoryLimit: 1
  replicas: 1
  selector:
    matchLabels:
      app: zot
  template:
    metadata:
      labels:
        app: zot
    spec:
      securityContext:
        # fsGroup даёт групповую запись в том Longhorn под uid/gid 1000.
        fsGroup: 1000
      containers:
        - name: zot
          image: "ghcr.io/project-zot/zot:v2.1.22@sha256:96cda11459ce6f8c60da3b03f03e9f67fd11b3ae2d82c4c04c92b3c608996080"
          args:
            - serve
            - /etc/zot/config.json
          ports:
            - name: http
              containerPort: 5000
          # /v2/ и /metrics при anonymous-only политике отдают 403, поэтому
          # проба — по TCP, а не HTTP.
          startupProbe:
            failureThreshold: 18
            tcpSocket:
              port: http
            periodSeconds: 5
            timeoutSeconds: 10
          livenessProbe:
            tcpSocket:
              port: http
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 3
          readinessProbe:
            tcpSocket:
              port: http
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          securityContext:
            runAsUser: 1000
            runAsGroup: 1000
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            seccompProfile:
              type: RuntimeDefault
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: "1"
              memory: 1Gi
          volumeMounts:
            - name: config
              mountPath: /etc/zot/config.json
              subPath: config.json
              readOnly: true
            - name: data
              mountPath: /var/lib/zot
      volumes:
        - name: config
          configMap:
            name: zot
        - name: data
          persistentVolumeClaim:
            claimName: zot-data

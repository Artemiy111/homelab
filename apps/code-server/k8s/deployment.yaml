apiVersion: apps/v1
kind: Deployment
metadata:
  name: code-server
  namespace: code-server
spec:
  replicas: 1
  selector:
    matchLabels:
      app: code-server
  # hostPath-каталоги нельзя монтировать в два пода одновременно.
  strategy:
    type: Recreate
  revisionHistoryLimit: 2
  template:
    metadata:
      labels:
        app: code-server
    spec:
      containers:
        - name: code-server
          image: "codercom/code-server:4.132.0@sha256:b88ed46a6ace76a0294a17a24f39aa88032ed0a3692c3d8ab5433b47ab57ccbf"
          # Штатный entrypoint образа делает fixuid/sudo/usermod, что
          # несовместимо с runAsNonRoot и no-new-privileges в k8s. Запускаем
          # code-server напрямую: конфиг и расширения берутся из hostPath /home/coder.
          command:
            - /usr/bin/dumb-init
            - --
            - /usr/bin/code-server
            - --bind-addr
            - 0.0.0.0:8080
            - .
          workingDir: /home/coder/project
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: HOME
              value: /home/coder
          resources:
            limits:
              cpu: 500m
              memory: 512Mi
            requests:
              cpu: 10m
              memory: 128Mi
          volumeMounts:
            - name: home
              mountPath: /home/coder
            - name: workspace
              mountPath: /home/coder/project
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 30
          startupProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 5
          securityContext:
            capabilities:
              drop: ["ALL"]
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            seccompProfile:
              type: RuntimeDefault
      volumes:
        - name: home
          hostPath:
            path: /storage/apps/code-server/home
            type: Directory
        - name: workspace
          hostPath:
            path: /storage/apps/code-server/workspace
            type: Directory

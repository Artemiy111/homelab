apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: code-server
  namespace: code-server
spec:
  parentRefs:
    - name: homelab
      namespace: traefik
  hostnames:
    - code.biplane.v6.rocks
    - code.biplane.casa
  rules:
    - backendRefs:
        - name: code-server
          port: 80

apiVersion: apps/v1
kind: Deployment
metadata:
  name: dawarich-db-legacy
  namespace: dawarich
spec:
  # PostGIS 17: PGDATA=/var/lib/postgresql/data (не PG18-раскладка!).
  # Образ и монтирование должны совпадать с compose, иначе база не прочитается.
  strategy:
    type: Recreate
  revisionHistoryLimit: 2
  replicas: 1
  selector:
    matchLabels:
      app: dawarich-db-legacy
  template:
    metadata:
      labels:
        app: dawarich-db-legacy
    spec:
      containers:
        - name: postgres
          image: "postgis/postgis:17-3.5-alpine@sha256:61cb994f576480f5736974e5c9aff965d039d965301bcaec9c7ea72f94b61908"
          ports:
            - name: postgres
              containerPort: 5432
          env:
            - name: POSTGRES_USER
              value: dawarich
            - name: POSTGRES_DB
              value: dawarich_production
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: dawarich
                  key: POSTGRES_PASSWORD
          startupProbe:
            exec:
              command: ["pg_isready", "-U", "dawarich", "-d", "dawarich_production"]
            initialDelaySeconds: 15
            periodSeconds: 5
            failureThreshold: 30
          livenessProbe:
            exec:
              command: ["pg_isready", "-U", "dawarich", "-d", "dawarich_production"]
            periodSeconds: 30
            timeoutSeconds: 5
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "dawarich", "-d", "dawarich_production"]
            periodSeconds: 10
            timeoutSeconds: 5
          securityContext:
            runAsUser: 70
            runAsGroup: 70
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            seccompProfile:
              type: RuntimeDefault
          resources:
            requests:
              cpu: 50m
              memory: 192Mi
            limits:
              cpu: "1"
              memory: 1Gi
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
            - name: shared
              mountPath: /var/shared
            - name: dshm
              mountPath: /dev/shm
      volumes:
        - name: data
          hostPath:
            path: /storage/apps/dawarich/postgresql
            type: Directory
        - name: shared
          hostPath:
            path: /storage/apps/dawarich/shared
            type: Directory
        - name: dshm
          emptyDir:
            medium: Memory
            sizeLimit: 1Gi

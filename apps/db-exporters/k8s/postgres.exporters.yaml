---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: authentik-postgresql-exporter
  namespace: authentik
spec:
  revisionHistoryLimit: 2
  replicas: 1
  selector:
    matchLabels:
      app: authentik-postgresql-exporter
  template:
    metadata:
      labels:
        app: authentik-postgresql-exporter
    spec:
      enableServiceLinks: false
      containers:
        - name: postgres-exporter
          image: "quay.io/prometheuscommunity/postgres-exporter:v0.20.1@sha256:ac5ec343104fae0e2d84a27bb8d69b38430a11910c5382cad85d478d2bab713e"
          ports:
            - name: metrics
              containerPort: 9187
          env:
            - name: DATA_SOURCE_URI
              value: "authentik-postgresql.authentik.svc.cluster.local:5432/authentik?sslmode=disable"
            - name: DATA_SOURCE_USER
              value: "authentik"
            - name: DATA_SOURCE_PASS
              valueFrom:
                secretKeyRef:
                  name: authentik
                  key: AUTHENTIK_POSTGRESQL_PASSWORD
          livenessProbe:
            httpGet:
              path: /metrics
              port: metrics
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /metrics
              port: metrics
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          securityContext:
            runAsUser: 65534
            runAsGroup: 65534
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            seccompProfile:
              type: RuntimeDefault
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 64Mi
---
apiVersion: v1
kind: Service
metadata:
  name: authentik-postgresql-exporter
  namespace: authentik
spec:
  type: ClusterIP
  selector:
    app: authentik-postgresql-exporter
  ports:
    - name: metrics
      port: 9187
      targetPort: metrics
      protocol: TCP

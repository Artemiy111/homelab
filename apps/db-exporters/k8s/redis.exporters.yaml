---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: dawarich-redis-exporter
  namespace: dawarich
spec:
  replicas: 1
  selector:
    matchLabels:
      app: dawarich-redis-exporter
  revisionHistoryLimit: 2
  template:
    metadata:
      labels:
        app: dawarich-redis-exporter
    spec:
      enableServiceLinks: false
      containers:
        - name: redis-exporter
          image: "docker.io/oliver006/redis_exporter:v1.91.1-alpine@sha256:30e56152988ca4bb3784e10debaac8905b78f6a7ff2bbd362a40b8c2a78eb1d6"
          ports:
            - name: metrics
              containerPort: 9121
          env:
            - name: REDIS_ADDR
              value: "redis://dawarich-redis:6379"
          resources:
            limits:
              cpu: 100m
              memory: 64Mi
            requests:
              cpu: 10m
              memory: 32Mi
          livenessProbe:
            httpGet:
              path: /metrics
              port: metrics
            timeoutSeconds: 5
            periodSeconds: 30
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /metrics
              port: metrics
            timeoutSeconds: 5
            periodSeconds: 30
            failureThreshold: 3
          securityContext:
            capabilities:
              drop: ["ALL"]
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            runAsUser: 59000
            runAsGroup: 59000
            seccompProfile:
              type: RuntimeDefault
---
apiVersion: v1
kind: Service
metadata:
  name: dawarich-redis-exporter
  namespace: dawarich
spec:
  type: ClusterIP
  selector:
    app: dawarich-redis-exporter
  ports:
    - name: metrics
      protocol: TCP
      port: 9121
      targetPort: metrics

apiVersion: apps/v1
kind: Deployment
metadata:
  name: element-livekit
  namespace: element
  annotations:
    ignore-check.kube-linter.io/host-network: "UDP-медиадиапазон 50000-50499 публикуется напрямую на узле (#161)"
spec:
  strategy:
    type: Recreate
  revisionHistoryLimit: 2
  replicas: 1
  selector:
    matchLabels:
      app: element-livekit
  template:
    metadata:
      labels:
        app: element-livekit
    spec:
      # UDP-медиадиапазон 50000-50499 публикуется напрямую на узле:
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      enableServiceLinks: false
      initContainers:
        - name: wait-for-redis
          image: "valkey/valkey:9@sha256:8e8d64b405ce18f41b8e5ee20aa4687a8ed0022d1298f2ce31cdcf3a76e09411"
          command: ["/bin/sh", "-c", "until valkey-cli -h element-valkey ping | grep -q PONG; do echo waiting for element-valkey; sleep 2; done"]
          securityContext:
            runAsUser: 999
            runAsGroup: 999
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            seccompProfile:
              type: RuntimeDefault
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 64Mi
        - name: render-keys
          image: "valkey/valkey:9@sha256:8e8d64b405ce18f41b8e5ee20aa4687a8ed0022d1298f2ce31cdcf3a76e09411"
          command:
            - /bin/sh
            - -c
            - 'umask 077; printf "%s: %s\n" "$LIVEKIT_API_KEY" "$LIVEKIT_API_SECRET" > /etc/livekit-keys/keys.yaml'
          env:
            - name: LIVEKIT_API_KEY
              valueFrom:
                secretKeyRef:
                  name: element-secrets
                  key: LIVEKIT_API_KEY
            - name: LIVEKIT_API_SECRET
              valueFrom:
                secretKeyRef:
                  name: element-secrets
                  key: LIVEKIT_API_SECRET
          securityContext:
            runAsUser: 1000
            runAsGroup: 1000
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            seccompProfile:
              type: RuntimeDefault
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 50m
              memory: 32Mi
          volumeMounts:
            - name: keys
              mountPath: /etc/livekit-keys
      containers:
        - name: livekit
          image: "livekit/livekit-server:v1.13.5@sha256:3497163e15c48fef6e7830c78716f9e9d5edc28abf7aa90b61c86e93bbc306b1"
          command:
            - /livekit-server
            - --config
            - /etc/livekit/config.yaml
            - --node-ip
            - $(HOST_IP)
          ports:
            - name: http
              containerPort: 7880
            - name: rtc-tcp
              containerPort: 7881
            - name: metrics
              containerPort: 6789
          env:
            - name: HOST_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.hostIP
            - name: TZ
              valueFrom:
                configMapKeyRef:
                  name: homelab-config
                  key: TZ
          startupProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 10
            periodSeconds: 5
            failureThreshold: 30
          livenessProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 3
          securityContext:
            runAsUser: 1000
            runAsGroup: 1000
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            seccompProfile:
              type: RuntimeDefault
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 1Gi
          volumeMounts:
            - name: config
              mountPath: /etc/livekit/config.yaml
              subPath: config.yaml
              readOnly: true
            - name: keys
              mountPath: /etc/livekit-keys
              readOnly: true
      volumes:
        - name: config
          configMap:
            name: element-livekit-config
        - name: keys
          emptyDir: {}

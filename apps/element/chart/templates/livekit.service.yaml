apiVersion: v1
kind: Service
metadata:
  name: livekit
  namespace: element
  annotations:
    # hostNetwork: без nativeLB Traefik dial-ит адрес узла и попадает в себя.
    # Подробности в apps/home-assistant/k8s/service.yaml.
    traefik.io/service.nativelb: "true"
spec:
  type: ClusterIP
  selector:
    app: element-livekit
  ports:
    - name: http
      port: 80
      targetPort: http
      protocol: TCP
    # Prometheus-метрики (скрейпит vmagent).
    - name: metrics
      port: 6789
      targetPort: metrics
      protocol: TCP

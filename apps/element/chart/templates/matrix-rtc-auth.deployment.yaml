apiVersion: apps/v1
kind: Deployment
metadata:
  name: matrix-rtc-auth
  namespace: element
spec:
  revisionHistoryLimit: 2
  replicas: 1
  selector:
    matchLabels:
      app: matrix-rtc-auth
  template:
    metadata:
      labels:
        app: matrix-rtc-auth
    spec:
      enableServiceLinks: false
      containers:
        - name: matrix-rtc-auth
          image: "ghcr.io/element-hq/lk-jwt-service:0.7.0@sha256:e0c7cecfa74e2342a3e79d47e1d4ab4bd228fe05b1a4dc4ba7f807686b0c214b"
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: DOMAIN
              valueFrom:
                configMapKeyRef:
                  name: homelab-config
                  key: DOMAIN
            - name: TZ
              valueFrom:
                configMapKeyRef:
                  name: homelab-config
                  key: TZ
            - name: LIVEKIT_JWT_BIND
              value: ":8080"
            # При info сервис пишет "Health check from <ip:port>" на каждый
            # запрос Kubernetes-проб (3 пробы × каждые 30 с — это ~90% объёма
            # логов контейнера). Сами пробы идут на /healthz и никуда не логируются.
            - name: LIVEKIT_LOG_LEVEL
              value: "warn"
            - name: LIVEKIT_URL
              value: "wss://element.$(DOMAIN)/livekit/sfu"
            - name: LIVEKIT_KEY
              valueFrom:
                secretKeyRef:
                  name: element-secrets
                  key: LIVEKIT_API_KEY
            - name: LIVEKIT_SECRET
              valueFrom:
                secretKeyRef:
                  name: element-secrets
                  key: LIVEKIT_API_SECRET
            - name: LIVEKIT_FULL_ACCESS_HOMESERVERS
              value: "$(DOMAIN)"
          startupProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
            failureThreshold: 30
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 3
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            seccompProfile:
              type: RuntimeDefault
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: "1"
              memory: 256Mi

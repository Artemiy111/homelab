apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultStaticSecret
metadata:
  name: element-db-auth
  namespace: element
spec:
  vaultAuthRef: vso-element
  mount: kv
  type: kv-v2
  path: element/db
  refreshAfter: 1h
  rolloutRestartTargets:
    - kind: Deployment
      name: element-synapse
  destination:
    name: element-db-auth
    create: true
    overwrite: true
    type: kubernetes.io/basic-auth
    transformation:
      excludeRaw: true
---
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultStaticSecret
metadata:
  name: element-secrets
  namespace: element
spec:
  vaultAuthRef: vso-element
  mount: kv
  type: kv-v2
  path: element/secrets
  refreshAfter: 1h
  # Секрет ротируется в Vault, но поды не умеют перечитывать его на лету:
  # turn/synapse/livekit получают значение через secretKeyRef (окружение),
  # а turn и synapse дополнительно рендерят конфиг в initContainer — он
  # выполняется только при пересоздании пода. Поэтому при ротации VSO сам
  # патчит spec.template.metadata.annotations, kubelet пересоздаёт под, и
  # initContainer рендерит конфиг уже с новым значением.
  # Требует hmacSecretData (default: true) — иначе targets игнорируются.
  rolloutRestartTargets:
    - kind: Deployment
      name: element-turn
    - kind: Deployment
      name: element-synapse
    - kind: Deployment
      name: element-livekit
    - kind: Deployment
      name: matrix-rtc-auth
  destination:
    name: element-secrets
    create: true
    overwrite: true
    transformation:
      excludeRaw: true
---
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultStaticSecret
metadata:
  name: element-oidc
  namespace: element
spec:
  vaultAuthRef: vso-element
  mount: kv
  type: kv-v2
  path: element/oidc
  refreshAfter: 1h
  rolloutRestartTargets:
    - kind: Deployment
      name: element-synapse
  destination:
    name: element-oidc
    create: true
    overwrite: true
    transformation:
      excludeRaw: true

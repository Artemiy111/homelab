apiVersion: v1
kind: Service
metadata:
  name: livekit
  namespace: element
spec:
  type: ClusterIP
  selector:
    app: element-livekit
  ports:
    - name: http
      protocol: TCP
      port: 80
      targetPort: http
    # Prometheus-метрики (скрейпит vmagent).
    - name: metrics
      protocol: TCP
      port: 6789
      targetPort: metrics

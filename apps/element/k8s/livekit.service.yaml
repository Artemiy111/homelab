apiVersion: v1
kind: Service
metadata:
  name: livekit
  namespace: default
spec:
  type: ClusterIP
  selector:
    app: element-livekit
  ports:
    - name: http
      port: 7880
      targetPort: http
      protocol: TCP
    # Prometheus-метрики (скрейпит netdata в кластере).
    - name: metrics
      port: 6789
      targetPort: metrics
      protocol: TCP

# Базовый NetworkPolicy: default-deny ingress + явные разрешения.
# traefik — маршруты (synapse, element-web, livekit, matrix-rtc-auth);
# vmagent из monitoring скрейпит synapse (9009) и экспортёры БД (9187) /
# Redis (9121). livekit/turn — hostNetwork, политика к ним не применяется.
# Egress не ограничивается.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-ingress
  namespace: element
spec:
  podSelector: {}
  policyTypes:
    - Ingress
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-ingress
  namespace: element
spec:
  podSelector: {}
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector: {}
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: traefik
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitoring
          podSelector:
            matchLabels:
              app: vmagent
      ports:
        - port: 9009
          protocol: TCP
        - port: 9187
          protocol: TCP
        - port: 9121
          protocol: TCP

# Базовый NetworkPolicy: default-deny ingress + явные разрешения.
# traefik — маршруты (synapse, element-web, livekit, matrix-rtc-auth);
# vmagent из monitoring скрейпит synapse (9009) и Redis (9121).
# livekit/turn — hostNetwork, политика к ним не применяется.
# Egress не ограничивается.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-ingress
  namespace: element
spec:
  podSelector: {}
  policyTypes:
    - Ingress
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-ingress
  namespace: element
spec:
  podSelector: {}
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector: {}
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: traefik
    - from:
        - podSelector:
            matchLabels:
              app: vmagent
          namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitoring
      ports:
        - protocol: TCP
          port: 9009
        - protocol: TCP
          port: 9121

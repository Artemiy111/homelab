apiVersion: apps/v1
kind: Deployment
metadata:
  name: element-redis
  namespace: element
spec:
  replicas: 1
  selector:
    matchLabels:
      app: element-redis
  template:
    metadata:
      labels:
        app: element-redis
    spec:
      enableServiceLinks: false
      containers:
        - name: redis
          image: "redis:8.10-alpine@sha256:978f0e01593e65eed801f2402944efcd936d43b5027e4908a7897baf88ed6241"
          command: ["redis-server", "--save", "60", "1", "--loglevel", "warning"]
          ports:
            - name: redis
              containerPort: 6379
          env:
            - name: TZ
              valueFrom:
                configMapKeyRef:
                  name: homelab-config
                  key: TZ
          resources:
            limits:
              cpu: "1"
              memory: 512Mi
            requests:
              cpu: 50m
              memory: 64Mi
          volumeMounts:
            - name: data
              mountPath: /data
          livenessProbe:
            exec:
              command: ["redis-cli", "ping"]
            timeoutSeconds: 5
            periodSeconds: 30
          readinessProbe:
            exec:
              command: ["redis-cli", "ping"]
            timeoutSeconds: 5
            periodSeconds: 10
          startupProbe:
            exec:
              command: ["redis-cli", "ping"]
            initialDelaySeconds: 5
            periodSeconds: 5
            failureThreshold: 30
          securityContext:
            capabilities:
              drop: ["ALL"]
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            runAsUser: 999
            runAsGroup: 999
            seccompProfile:
              type: RuntimeDefault
      volumes:
        - name: data
          # Кэш/репликация Redis — эфемерные, данные не персистим.
          emptyDir: {}
  strategy:
    type: Recreate
  revisionHistoryLimit: 2

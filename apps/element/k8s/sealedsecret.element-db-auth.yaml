---
# Пароль роли synapse в shared CNPG для пода Synapse в namespace element:
# пары «databases/element-db-auth (роль) + element/element-db-auth (под)» —
# один plaintext, два SealedSecret'а (строгий scope kubeseal привязан к
# namespace и имени; см. platform/cnpg/README.md).
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: element-db-auth
  namespace: element
spec:
  template:
    metadata:
      name: element-db-auth
      namespace: element
    type: kubernetes.io/basic-auth
  encryptedData:
    password: 
    username: 

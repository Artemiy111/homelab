apiVersion: v1
kind: Service
metadata:
  name: synapse
  namespace: default
spec:
  type: ClusterIP
  selector:
    app: element-synapse
  ports:
    - name: http
      port: 8080
      targetPort: http
      protocol: TCP
    # Prometheus-метрики (скрейпит netdata в кластере).
    - name: metrics
      port: 9009
      targetPort: metrics
      protocol: TCP

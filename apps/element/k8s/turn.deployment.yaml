apiVersion: apps/v1
kind: Deployment
metadata:
  name: element-turn
  namespace: element
  annotations:
    ignore-check.kube-linter.io/host-network: "TURN публикует relay 21000-21499 на LAN-адресе узла; без hostNetwork недоступно (#161)"
spec:
  replicas: 1
  selector:
    matchLabels:
      app: element-turn
  strategy:
    type: Recreate
  revisionHistoryLimit: 2
  template:
    metadata:
      labels:
        app: element-turn
    spec:
      dnsPolicy: ClusterFirstWithHostNet
      # TURN слушает 3479 и relay 21000-21499 на LAN-адресе узла
      hostNetwork: true
      enableServiceLinks: false
      containers:
        - name: turn
          image: "coturn/coturn:4.17@sha256:aa68aab64a3b929d57fc2924c98ea447bf996cf8dade2508e7b71eaf23f1f14e"
          env:
            - name: TZ
              valueFrom:
                configMapKeyRef:
                  name: homelab-config
                  key: TZ
          resources:
            limits:
              cpu: "1"
              memory: 256Mi
            requests:
              cpu: 50m
              memory: 64Mi
          volumeMounts:
            - name: config
              readOnly: true
              mountPath: /etc/turnserver.conf
          securityContext:
            allowPrivilegeEscalation: false
            seccompProfile:
              type: RuntimeDefault
      volumes:
        - name: config
          hostPath:
            path: /storage/apps/element/turn/turnserver.conf
            type: File

apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultStaticSecret
metadata:
  name: element-db-auth
  namespace: element
spec:
  vaultAuthRef: vso-element
  mount: kv
  type: kv-v2
  path: element/db
  refreshAfter: 1h
  destination:
    name: element-db-auth
    create: true
    overwrite: true
    type: kubernetes.io/basic-auth
    transformation:
      excludeRaw: true
---
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultStaticSecret
metadata:
  name: element-secrets
  namespace: element
spec:
  vaultAuthRef: vso-element
  mount: kv
  type: kv-v2
  path: element/secrets
  refreshAfter: 1h
  destination:
    name: element-secrets
    create: true
    overwrite: true
    transformation:
      excludeRaw: true

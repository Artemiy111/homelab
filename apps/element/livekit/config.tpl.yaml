port: 7880
prometheus:
  port: 6789
rtc:
  tcp_port: 7881
  port_range_start: ref+envsubst://$LIVEKIT_RTC_PORT_MIN
  port_range_end: ref+envsubst://$LIVEKIT_RTC_PORT_MAX
  # Calls are intentionally limited to the LAN and tailnet. Advertising a
  # STUN-discovered public address would send those clients to an unavailable
  # NAT path instead of LIVEKIT_EXTERNAL_IP passed on the command line.
  use_external_ip: false
redis:
  address: redis:6379
keys:
  ref+envsubst://$LIVEKIT_API_KEY+: ref+envsubst://$LIVEKIT_API_SECRET
logging:
  level: info

http:
  bind_addresses: ["0.0.0.0"]
  port: 5000

log:
  setup:
    version: 1
    formatters:
      console:
        class: logging.Formatter
        format: "%(asctime)s %(levelname)s %(name)s %(message)s"
    handlers:
      console:
        class: logging.StreamHandler
        formatter: console
        stream: ext://sys.stdout
    root:
      level: INFO
      handlers:
        - console

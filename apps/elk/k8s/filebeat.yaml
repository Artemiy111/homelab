apiVersion: beat.k8s.elastic.co/v1beta1
kind: Beat
metadata:
  name: filebeat
  namespace: logging
spec:
  type: filebeat
  version: 9.4.3
  elasticsearchRef:
    name: elk
  config:
    filebeat.inputs:
      # Статичный вход вместо autodiscover: filestream-инпуты не-reloadable, и
      # autodiscover при перезапуске контейнера падает на дублировании ID.
      - type: filestream
        file_identity.fingerprint: {}
        id: kubernetes-container-logs
        parsers:
          - container: {}
          # Стектрейсы: клеим ТОЛЬКО строки-продолжения (с отступом или с
          # маркерами at/Caused by/goroutine/panic/Traceback). Обратный подход
          # («новая строка = дата») ломает логи вида time=..., netdata и т.п.
          - multiline:
              type: pattern
              match: after
              max_lines: 500
              negate: false
              pattern: '^([[:space:]]|at |Caused by:|goroutine |panic:|Traceback )'
        paths:
          - /var/log/containers/*.log
        prospector:
          scanner:
            fingerprint.enabled: true
            symlinks: true
    processors:
      # k8s-метаданные (namespace/pod/labels) по пути лог-файла; нужен ClusterRole.
      - add_kubernetes_metadata:
          host: ${NODE_NAME}
          matchers:
            - logs_path:
                logs_path: "/var/log/containers/"
      - add_host_metadata:
          # host.ip/host.mac раздувают КАЖДОЕ событие (на этой машине 143 IP!),
          # превращая 140-байтную строку лога в ~6 КБ документа.
          netinfo.enabled: false
    # Своя ILM-политика (retention) и replicas 0 для однонодового кластера.
    setup.ilm:
      enabled: true
      overwrite: true
      policy_file: /usr/share/filebeat/ilm/ilm-policy.json
      policy_name: filebeat
    setup.template:
      overwrite: true
      settings:
        index:
          number_of_replicas: 0
  daemonSet:
    podTemplate:
      spec:
        terminationGracePeriodSeconds: 30
        dnsPolicy: ClusterFirstWithHostNet
        serviceAccountName: filebeat
        automountServiceAccountToken: true
        # hostNetwork — ради host-метаданных (add_host_metadata) в k8s-логах.
        hostNetwork: true
        containers:
          - name: filebeat
            env:
              - name: NODE_NAME
                valueFrom:
                  fieldRef:
                    fieldPath: spec.nodeName
            resources:
              limits:
                memory: 512Mi
              requests:
                cpu: 100m
                memory: 128Mi
            volumeMounts:
              - name: varlogcontainers
                mountPath: /var/log/containers
              - name: varlogpods
                mountPath: /var/log/pods
              - name: ilm-policy
                readOnly: true
                mountPath: /usr/share/filebeat/ilm
            securityContext:
              # Логи на хосте принадлежат root; читать их иначе нельзя.
              runAsUser: 0
        volumes:
          - name: varlogcontainers
            hostPath:
              path: /var/log/containers
          - name: varlogpods
            hostPath:
              path: /var/log/pods
          - name: ilm-policy
            configMap:
              name: filebeat-ilm

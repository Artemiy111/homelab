# NetworkPolicy для namespace логирования: default-deny ingress плюс явные
# разрешения.
# filebeat — DaemonSet с hostNetwork (ради host-метаданных), поэтому его
# трафик приходит к Elasticsearch с IP узла, а не с pod IP: разрешаем ipBlock
# узла. Если адрес узла изменится, правило нужно поправить.
# Оператор Elastic в elastic-system управляет Elasticsearch через API (9200).
# Egress не ограничивается — см. apps/lute/k8s/networkpolicy.yaml.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-ingress
  namespace: logging
spec:
  podSelector: {}
  policyTypes:
    - Ingress
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-ingress
  namespace: logging
spec:
  podSelector: {}
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector: {}
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: traefik
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: elastic-system
    - from:
        - ipBlock:
            cidr: 192.0.2.10/16
      ports:
        - port: 9200
          protocol: TCP

# Логин/пароль админ-пользователя Forgejo (user) для чарта.
# Запечатан на сервере kubeseal'ом для namespace forgejo; пароль только в чате —
# после первого входа сменить в Settings → Account.
---
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: forgejo-admin
  namespace: forgejo
spec:
  encryptedData:
    password: 
    username: 
  template:
    metadata:
      name: forgejo-admin
      namespace: forgejo

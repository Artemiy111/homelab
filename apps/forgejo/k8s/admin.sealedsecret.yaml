# Логин/пароль служебного админа Forgejo (forgejo-admin, admin@example.com).
# Логин `admin` зарезервирован Forgejo, поэтому имя с суффиксом сервиса.
# Перезапечатывается на сервере kubeseal'ом для namespace forgejo.
---
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: forgejo-admin
  namespace: forgejo
spec:
  encryptedData:
    password: 
    username: 
  template:
    metadata:
      name: forgejo-admin
      namespace: forgejo

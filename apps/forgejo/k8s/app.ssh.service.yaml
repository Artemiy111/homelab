# Git over SSH остаётся на том же адресе forgejo.${DOMAIN}:2222: kube-proxy
# принимает :2222 на IP узла (externalIPs) и DNAT'ит в под forgejo.
# Traefik порт 2222 не занимает.
apiVersion: v1
kind: Service
metadata:
  name: forgejo-ssh
  namespace: forgejo
spec:
  type: ClusterIP
  externalIPs:
    - 192.0.2.10
  selector:
    app: forgejo
  ports:
    - name: ssh
      port: 2222
      targetPort: ssh
      protocol: TCP

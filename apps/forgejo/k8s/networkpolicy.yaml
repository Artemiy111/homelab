# NetworkPolicy для namespace сервиса: default-deny ingress плюс явные
# разрешения. Git over SSH публикуется через externalIPs на :2222, поэтому
# порт открыт всем клиентам (LAN, tailnet, внешние — как и раньше).
# Метрики: forgejo (3000, скрейпит vmagent из default); экспортёр БД пока
# остаётся в default и ходит к forgejo-db (5432). Egress не ограничивается.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-ingress
  namespace: forgejo
spec:
  podSelector: {}
  policyTypes:
    - Ingress
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-ingress
  namespace: forgejo
spec:
  podSelector: {}
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector: {}
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: traefik
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: default
          podSelector:
            matchLabels:
              app: vmagent
      ports:
        - port: 3000
          protocol: TCP
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: default
          podSelector:
            matchLabels:
              app: forgejo-db-exporter
      ports:
        - port: 5432
          protocol: TCP
    - from:
        - ipBlock:
            cidr: 0.0.0.0/0
      ports:
        - port: 2222
          protocol: TCP

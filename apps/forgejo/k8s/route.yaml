apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: forgejo
  namespace: forgejo
spec:
  parentRefs:
    - name: homelab
      namespace: traefik
      sectionName: https
  hostnames:
    - forgejo.biplane.v6.rocks
  rules:
    - backendRefs:
        - name: forgejo-http
          port: 80

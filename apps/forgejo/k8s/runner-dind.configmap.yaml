# Конфиг dockerd сайдкара dind. Zot в кластере отдаётся по http, поэтому его
# хост нужно пометить insecure — иначе Docker попытается тянуть по https и
# упадёт. registry-mirrors здесь не подходит: Docker умеет mirror только для
# Docker Hub, а job-образы приходят из ghcr.io и data.forgejo.org
# (см. apps/forgejo/README.md).
apiVersion: v1
kind: ConfigMap
metadata:
  name: forgejo-runner-dind
  namespace: forgejo
data:
  daemon.json: |
    {
      "insecure-registries": ["zot.zot.svc.cluster.local"]
    }

# Секрет оффлайн-регистрации Forgejo Runner (instance-wide).
#
# 40-символьный hex-секрет — это одновременно идентификатор и пароль раннера.
# Зарегистрирован на сервере идемпотентно:
#   kubectl -n forgejo exec -i deploy/forgejo -c forgejo -- \
#     forgejo forgejo-cli actions register --name homelab-runner --secret-stdin --scope ""
# UUID выведен той же командой (это UUID, собранный из первых 16 символов
# секрета, а не случайное значение) и лежит в ConfigMap'е раннера.
#
# Перезапечатать: kubeseal --format yaml < plaintext-secret.yaml.
---
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: forgejo-runner
  namespace: forgejo
spec:
  encryptedData:
    token: 
  template:
    metadata:
      name: forgejo-runner
      namespace: forgejo

# Пароль роли forgejo (он же в databases/forgejo-db-auth — один плейнтекст, два
# SealedSecret'а, см. k8s/cnpg/README.md) и токен метрик Forgejo.
# Имя отличается от релиза чарта (forgejo), потому что чарт создаёт свой Secret
# с именем релиза — совпадение имён означало бы двух владельцев одного объекта.
---
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: forgejo-secrets
  namespace: forgejo
spec:
  encryptedData:
    FORGEJO_METRICS_TOKEN: 
    POSTGRES_PASSWORD: 
  template:
    metadata:
      name: forgejo-secrets
      namespace: forgejo

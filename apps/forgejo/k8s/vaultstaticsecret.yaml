apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultStaticSecret
metadata:
  name: forgejo-admin
  namespace: forgejo
spec:
  vaultAuthRef: vso-forgejo
  mount: kv
  type: kv-v2
  path: forgejo/admin
  refreshAfter: 1h
  destination:
    name: forgejo-admin
    create: true
    overwrite: true
    transformation:
      excludeRaw: true
---

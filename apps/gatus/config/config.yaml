storage:
  type: postgres
  # История — в общем кластере CNPG (namespace databases), пароль роли gatus
  # приходит из Secret'а `gatus` (см. k8s/sealedsecret.yaml).
  path: "postgres://gatus:${GATUS_DB_PASSWORD}@shared-rw.databases.svc.cluster.local:5432/gatus?sslmode=disable"
  caching: true
  maximum-number-of-results: 1000
  maximum-number-of-events: 100

# Prometheus-метрики на /metrics (скрейпит vmagent).
metrics: true

alerting:
  ntfy:
    topic: "${NTFY_TOPIC}"
    priority: 4
    default-alert:
      failure-threshold: 3
      success-threshold: 2
      send-on-resolved: true

  telegram:
    token: "${TELEGRAM_BOT_TOKEN}"
    id: "${TELEGRAM_CHAT_ID}"
    client:
      proxy-url: "${TELEGRAM_PROXY_URL}"
    default-alert:
      failure-threshold: 3
      success-threshold: 2
      send-on-resolved: true

ui:
  title: Homelab Status
  header: Homelab Status
  default-sort-by: group

endpoints:
  - name: Technitium HTTP
    group: Infrastructure
    url: https://dns.${DOMAIN}/
    interval: 60s
    client: &https-client
      timeout: 10s
      dns-resolver: udp://${HOST_IP}:53
    conditions: &https-ok
      - "[STATUS] == 200"
      - "[CERTIFICATE_EXPIRATION] > 168h"
    alerts: &alerts-all
      - type: ntfy
      - type: telegram

  - name: Technitium DNS
    group: Infrastructure
    url: ${HOST_IP}
    interval: 60s
    dns:
      query-name: traefik.${DOMAIN}
      query-type: A
    conditions:
      - "[DNS_RCODE] == NOERROR"
      - "[BODY] == ${HOST_IP}"
    alerts: *alerts-all

  - name: Gitea SSH
    group: Infrastructure
    # Forgejo в k8s: SSH-порт 2222 висит на k8s-VIP, доступен по имени сервиса.
    url: tcp://forgejo.${DOMAIN}:2222
    interval: 60s
    conditions: &tcp-connected
      - "[CONNECTED] == true"
    alerts: *alerts-all

  - name: Xray inbound
    group: Infrastructure
    url: tcp://${HOST_IP}:8443
    interval: 60s
    conditions: *tcp-connected
    alerts:
      - type: ntfy
        enabled: false

  - name: Xray proxy egress
    group: Infrastructure
    url: https://api.telegram.org
    interval: 120s
    client:
      timeout: 30s
      proxy-url: http://${HOST_IP}:8440
    conditions:
      - "[STATUS] == 200"
      - "[RESPONSE_TIME] < 5000"
    alerts:
      - type: ntfy
        enabled: true

  - name: Gatus
    group: Monitoring
    url: https://uptime.${DOMAIN}/
    interval: 60s
    client: *https-client
    conditions: *https-ok
    alerts: *alerts-all

  - name: Uptime Kuma
    group: Monitoring
    url: https://kuma.${DOMAIN}/
    interval: 60s
    client: *https-client
    conditions: *https-ok
    alerts: *alerts-all

  - name: Homepage
    group: Monitoring
    url: https://home.${DOMAIN}/api/healthcheck
    interval: 60s
    client: *https-client
    conditions: *https-ok
    alerts: *alerts-all

  - name: Beszel
    group: Monitoring
    url: https://beszel.${DOMAIN}/api/health
    interval: 60s
    client: *https-client
    conditions: *https-ok
    alerts: *alerts-all

  - name: Netdata
    group: Monitoring
    # UI закрыт forward auth (302 без авторизации), поэтому проверяем агент
    # напрямую (netdata в k8s).
    url: http://netdata.monitoring.svc.cluster.local/api/v1/info
    interval: 60s
    client: &docker-client
      timeout: 10s
    conditions:
      - "[STATUS] == 200"
    alerts: *alerts-all

  - name: VictoriaMetrics
    group: Monitoring
    # TSDB и vmagent наружу не публикуются, проверяем напрямую; /health отдаёт
    # 200 и тело OK. Доступ по имени — через мост из k8s.
    url: http://victoriametrics.monitoring.svc.cluster.local/health
    interval: 60s
    client: *docker-client
    conditions:
      - "[STATUS] == 200"
      - "[BODY] == OK"
    alerts: *alerts-all

  - name: vmagent
    group: Monitoring
    url: http://vmagent.monitoring.svc.cluster.local/health
    interval: 60s
    client: *docker-client
    conditions:
      - "[STATUS] == 200"
      - "[BODY] == OK"
    alerts: *alerts-all

  - name: Grafana
    group: Monitoring
    # Публичный маршрут закрыт forward auth (302 без авторизации), поэтому
    # проверяем health API напрямую; доступ по имени — через мост из k8s.
    url: http://grafana.monitoring.svc.cluster.local/api/health
    interval: 60s
    client: *docker-client
    conditions:
      - "[STATUS] == 200"
      - "[BODY].database == ok"
    alerts: *alerts-all

  - name: Radar
    group: Monitoring
    # UI закрыт forward auth (302 без авторизации), поэтому проверяем health
    # API напрямую; доступ из monitoring в radar разрешён NetworkPolicy.
    url: http://radar.radar.svc.cluster.local/api/health
    interval: 60s
    client: *docker-client
    conditions:
      - "[STATUS] == 200"
    alerts: *alerts-all

  # Публичные URL этих сервисов закрыты forward auth (oauth2-proxy@file) и для
  # неавторизованного запроса отдают 302, поэтому проверяем приложения напрямую.
  # Сервисы ещё в Docker, но внутри кластера доступны по имени через мост
  # (apps/<сервис>/k8s/bridge.yaml).
  - name: WUD
    group: Monitoring
    url: http://wud.monitoring.svc.cluster.local/health
    interval: 60s
    client: *docker-client
    conditions:
      - "[STATUS] == 200"
      - "[BODY] == pat(*uptime*)"
    alerts: *alerts-all

  - name: Jitsi Meet
    group: Applications
    url: https://meet.${DOMAIN}/
    interval: 60s
    client: *https-client
    conditions: *https-ok
    alerts: *alerts-all

  - name: Mermaid Live Editor
    group: Applications
    url: https://mermaid.${DOMAIN}/
    interval: 60s
    client: *https-client
    conditions: *https-ok
    alerts: *alerts-all

  - name: Nextcloud
    group: Applications
    url: https://nextcloud.${DOMAIN}/status.php
    interval: 60s
    client: *https-client
    conditions:
      - "[STATUS] == 200"
      - "[BODY].installed == true"
      - "[BODY].maintenance == false"
      - "[BODY].needsDbUpgrade == false"
      - "[CERTIFICATE_EXPIRATION] > 168h"
    alerts: *alerts-all

  - name: Forgejo
    group: Applications
    url: https://forgejo.${DOMAIN}/api/healthz
    interval: 60s
    client: *https-client
    conditions:
      - "[STATUS] == 200"
      - "[BODY].status == pass"
      - "[CERTIFICATE_EXPIRATION] > 168h"
    alerts: *alerts-all

  - name: code-server
    group: Applications
    url: https://code.${DOMAIN}/healthz
    interval: 60s
    client: *https-client
    conditions: *https-ok
    alerts: *alerts-all

  - name: Authentik
    group: Applications
    url: https://auth.${DOMAIN}/-/health/ready/
    interval: 60s
    client: *https-client
    conditions: *https-ok
    alerts: *alerts-all

  - name: LocalAI
    group: Applications
    url: https://localai.${DOMAIN}/readyz
    interval: 60s
    client: *https-client
    conditions: *https-ok
    alerts: *alerts-all

  - name: Open WebUI
    group: Applications
    url: https://ai.${DOMAIN}/health
    interval: 60s
    client: *https-client
    conditions: *https-ok
    alerts: *alerts-all

  - name: Immich
    group: Applications
    url: https://immich.${DOMAIN}/api/server/ping
    interval: 60s
    client: *https-client
    conditions:
      - "[STATUS] == 200"
      - "[BODY].res == pong"
      - "[CERTIFICATE_EXPIRATION] > 168h"
    alerts: *alerts-all

  - name: Dawarich
    group: Applications
    url: https://dawarich.${DOMAIN}/api/v1/health
    interval: 60s
    client: *https-client
    conditions:
      - "[STATUS] == 200"
      - "[BODY].status == ok"
      - "[CERTIFICATE_EXPIRATION] > 168h"
    alerts: *alerts-all

  - name: Jellyfin
    group: Applications
    url: https://jellyfin.${DOMAIN}/health
    interval: 60s
    client: *https-client
    conditions:
      - "[STATUS] == 200"
      - "[BODY] == Healthy"
      - "[CERTIFICATE_EXPIRATION] > 168h"
    alerts: *alerts-all

  - name: Navidrome
    group: Applications
    url: https://music.${DOMAIN}/ping
    interval: 60s
    client: *https-client
    conditions:
      - "[STATUS] == 200"
      - "[BODY] == ."
      - "[CERTIFICATE_EXPIRATION] > 168h"
    alerts: *alerts-all

  - name: Stirling PDF
    group: Applications
    url: https://pdf.${DOMAIN}/api/v1/info/status
    interval: 60s
    client: *https-client
    conditions:
      - "[STATUS] == 200"
      - "[BODY].status == UP"
      - "[CERTIFICATE_EXPIRATION] > 168h"
    alerts: *alerts-all

  - name: Home Assistant
    group: Applications
    # HA работает в network_mode: host, его порт 8123 из пода не виден
    # (firewalld режет INPUT), поэтому проверяем публичный маршрут. У роутера HA
    # нет forward-auth, авторизация внутри приложения — 200 отдаёт сам HA.
    url: https://ha.${DOMAIN}/
    interval: 60s
    client: *https-client
    conditions: *https-ok
    alerts: *alerts-all

  - name: Structurizr
    group: Applications
    url: http://structurizr.structurizr.svc.cluster.local/
    interval: 60s
    client: *docker-client
    conditions:
      - "[STATUS] == 200"
    alerts: *alerts-all

  - name: Lute
    group: Applications
    url: https://lute.${DOMAIN}/
    interval: 60s
    client: *https-client
    conditions: *https-ok
    alerts: *alerts-all

  - name: 3x-ui backend
    group: Applications
    url: tcp://xui.3x-ui.svc.cluster.local:2053
    interval: 60s
    conditions: *tcp-connected
    alerts: *alerts-all

  - name: Sure
    group: Applications
    url: https://sure.${DOMAIN}/sessions/new
    interval: 60s
    client: *https-client
    conditions: *https-ok
    alerts: *alerts-all

  - name: Mailserver
    group: Applications
    # Панель администрирования Stalwart; корень отдаёт 302 на страницу входа.
    url: https://mailserver.${DOMAIN}/
    interval: 60s
    client: *https-client
    conditions: *https-ok
    alerts: *alerts-all

  - name: Webmail
    group: Applications
    url: https://mail.${DOMAIN}/
    interval: 60s
    client: *https-client
    conditions: *https-ok
    alerts: *alerts-all

  - name: Seafile
    group: Applications
    url: https://seafile.${DOMAIN}/api2/ping/
    interval: 60s
    client: *https-client
    conditions:
      - "[STATUS] == 200"
      - "[BODY] == pat(*pong*)"
      - "[CERTIFICATE_EXPIRATION] > 168h"
    alerts: *alerts-all

  - name: OnlyOffice
    group: Applications
    url: https://onlyoffice.${DOMAIN}/healthcheck
    interval: 60s
    client: *https-client
    conditions:
      - "[STATUS] == 200"
      - "[BODY] == true"
      - "[CERTIFICATE_EXPIRATION] > 168h"
    alerts: *alerts-all

  - name: Paperless
    group: Applications
    # Корень отдаёт 302 на страницу входа.
    url: https://paperless.${DOMAIN}/
    interval: 60s
    client: *https-client
    conditions: *https-ok
    alerts: *alerts-all

  - name: Infisical
    group: Applications
    url: https://infisical.${DOMAIN}/api/status
    interval: 60s
    client: *https-client
    conditions:
      - "[STATUS] == 200"
      - "[BODY].message == Ok"
      - "[CERTIFICATE_EXPIRATION] > 168h"
    alerts: *alerts-all

  - name: Zitadel
    group: Applications
    url: https://id.${DOMAIN}/debug/healthz
    interval: 60s
    client: *https-client
    conditions:
      - "[STATUS] == 200"
      - "[BODY] == ok"
      - "[CERTIFICATE_EXPIRATION] > 168h"
    alerts: *alerts-all

  - name: Element Web
    group: Applications
    url: https://element.${DOMAIN}/
    interval: 60s
    client: *https-client
    conditions: *https-ok
    alerts: *alerts-all

  - name: Synapse
    group: Applications
    # Client-Server API Synapse, опубликованный по пути /_matrix.
    url: https://element.${DOMAIN}/_matrix/client/versions
    interval: 60s
    client: *https-client
    conditions:
      - "[STATUS] == 200"
      - "[BODY] == pat(*versions*)"
      - "[CERTIFICATE_EXPIRATION] > 168h"
    alerts: *alerts-all

  - name: Talk signaling
    group: Applications
    # Nextcloud Talk high-performance backend (eturnal); префикс
    # /standalone-signaling Traefik снимает перед проксированием.
    url: https://talk-signaling.${DOMAIN}/standalone-signaling/api/v1/welcome
    interval: 60s
    client: *https-client
    conditions:
      - "[STATUS] == 200"
      - "[BODY] == pat(*Welcome*)"
      - "[CERTIFICATE_EXPIRATION] > 168h"
    alerts: *alerts-all

  # Внешние источники, от которых зависит CI: раннер тянет экшены
  # (`uses: actions/checkout@v6`) с data.forgejo.org. Две DNS-проверки намеренно
  # расходятся по резолверу: через kube-dns идёт тот же путь, что у job'ов, а
  # прямой запрос в Technitium отделяет отказ промежуточного резолвера от
  # недоступности сервиса. Интервал 15s: реальное окно отказа длилось 75 с, при
  # 60s и failure-threshold 3 такое окно не доходит до алерта.
  - name: Actions DNS via CoreDNS
    group: External
    url: kube-dns.kube-system.svc.cluster.local
    interval: 15s
    dns:
      query-name: data.forgejo.org
      query-type: A
    conditions:
      - "[DNS_RCODE] == NOERROR"
    alerts: *alerts-all

  - name: Actions DNS via Technitium
    group: External
    url: ${HOST_IP}
    interval: 15s
    dns:
      query-name: data.forgejo.org
      query-type: A
    conditions:
      - "[DNS_RCODE] == NOERROR"
    alerts: *alerts-all

  # Тот же git-эндпоинт, что дёргает раннер при загрузке экшена: проверяет
  # DNS+TLS+HTTP целиком (корень сайта отдаёт редирект, поэтому не он).
  - name: Actions upstream
    group: External
    url: https://data.forgejo.org/actions/checkout/info/refs?service=git-upload-pack
    interval: 15s
    client:
      timeout: 10s
    conditions:
      - "[STATUS] == 200"
    alerts: *alerts-all

  # Остальные внешние зависимости: GitHub (публичное зеркало и экшены), ghcr.io
  # и Docker Hub (источники job-образов), Google и Yandex (общий доступ в
  # интернет). Устройство то же, что у data.forgejo.org выше. Корни сайтов
  # отдают редиректы, поэтому проверяются конкретные стабильные эндпоинты.
  - name: GitHub DNS via CoreDNS
    group: External
    url: kube-dns.kube-system.svc.cluster.local
    interval: 15s
    dns:
      query-name: github.com
      query-type: A
    conditions: &dns-noerror
      - "[DNS_RCODE] == NOERROR"
    alerts: *alerts-all

  - name: GitHub DNS via Technitium
    group: External
    url: ${HOST_IP}
    interval: 15s
    dns:
      query-name: github.com
      query-type: A
    conditions: *dns-noerror
    alerts: *alerts-all

  - name: GitHub upstream
    group: External
    url: https://github.com/robots.txt
    interval: 15s
    client: &external-client
      timeout: 10s
    conditions:
      - "[STATUS] == 200"
    alerts: *alerts-all

  # У реестров проверяется /v2/: без токена он отвечает 401, и это же означает,
  # что реестр жив (docker pull сам получает токен на auth.docker.io).
  - name: GHCR DNS via CoreDNS
    group: External
    url: kube-dns.kube-system.svc.cluster.local
    interval: 15s
    dns:
      query-name: ghcr.io
      query-type: A
    conditions: *dns-noerror
    alerts: *alerts-all

  - name: GHCR DNS via Technitium
    group: External
    url: ${HOST_IP}
    interval: 15s
    dns:
      query-name: ghcr.io
      query-type: A
    conditions: *dns-noerror
    alerts: *alerts-all

  - name: GHCR upstream
    group: External
    url: https://ghcr.io/v2/
    interval: 15s
    client: *external-client
    conditions:
      - "[STATUS] == 401"
    alerts: *alerts-all

  - name: Docker Hub DNS via CoreDNS
    group: External
    url: kube-dns.kube-system.svc.cluster.local
    interval: 15s
    dns:
      query-name: registry-1.docker.io
      query-type: A
    conditions: *dns-noerror
    alerts: *alerts-all

  - name: Docker Hub DNS via Technitium
    group: External
    url: ${HOST_IP}
    interval: 15s
    dns:
      query-name: registry-1.docker.io
      query-type: A
    conditions: *dns-noerror
    alerts: *alerts-all

  - name: Docker Hub upstream
    group: External
    url: https://registry-1.docker.io/v2/
    interval: 15s
    client: *external-client
    conditions:
      - "[STATUS] == 401"
    alerts: *alerts-all

  - name: Google DNS via CoreDNS
    group: External
    url: kube-dns.kube-system.svc.cluster.local
    interval: 15s
    dns:
      query-name: www.google.com
      query-type: A
    conditions: *dns-noerror
    alerts: *alerts-all

  - name: Google DNS via Technitium
    group: External
    url: ${HOST_IP}
    interval: 15s
    dns:
      query-name: www.google.com
      query-type: A
    conditions: *dns-noerror
    alerts: *alerts-all

  # generate_204 — лёгкий эндпоинт, отдаёт 204, не тянет главную страницу.
  - name: Google upstream
    group: External
    url: https://www.google.com/generate_204
    interval: 15s
    client: *external-client
    conditions:
      - "[STATUS] == 204"
    alerts: *alerts-all

  - name: Yandex DNS via CoreDNS
    group: External
    url: kube-dns.kube-system.svc.cluster.local
    interval: 15s
    dns:
      query-name: ya.ru
      query-type: A
    conditions: *dns-noerror
    alerts: *alerts-all

  - name: Yandex DNS via Technitium
    group: External
    url: ${HOST_IP}
    interval: 15s
    dns:
      query-name: ya.ru
      query-type: A
    conditions: *dns-noerror
    alerts: *alerts-all

  # Корень ya.ru отдаёт капчу/редирект, поэтому берётся robots.txt.
  - name: Yandex upstream
    group: External
    url: https://ya.ru/robots.txt
    interval: 15s
    client: *external-client
    conditions:
      - "[STATUS] == 200"
    alerts: *alerts-all

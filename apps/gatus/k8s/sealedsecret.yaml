---
# GATUS_DB_PASSWORD — пароль роли gatus в shared CNPG: тот же плейнтекст, что и
# databases/gatus-db-auth (один пароль, два SealedSecret'а; см.
# platform/cnpg/README.md). Остальные ключи — каналы уведомлений.
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: gatus
  namespace: monitoring
spec:
  template:
    metadata:
      name: gatus
      namespace: monitoring
    type: Opaque
  encryptedData:
    GATUS_DB_PASSWORD: 
    NTFY_TOPIC: 
    TELEGRAM_BOT_TOKEN: 
    TELEGRAM_CHAT_ID: 

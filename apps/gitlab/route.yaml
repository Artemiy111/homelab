# Веб-доступ к GitLab. TLS не указываем: сертификат на entrypoint websecure
# берётся из TLSStore default (единственная копия — в namespace traefik).
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: gitlab
  namespace: gitlab
spec:
  ingressClassName: traefik
  rules:
    - host: gitlab.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: gitlab
                port:
                  number: 80

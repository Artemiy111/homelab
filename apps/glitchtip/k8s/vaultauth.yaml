apiVersion: v1
kind: ServiceAccount
metadata:
  name: vso-glitchtip
  namespace: glitchtip
---
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultAuth
metadata:
  name: vso-glitchtip
  namespace: glitchtip
spec:
  vaultAuthGlobalRef:
    name: vso-global
    namespace: vault-secrets-operator
  kubernetes:
    role: glitchtip
    serviceAccount: vso-glitchtip

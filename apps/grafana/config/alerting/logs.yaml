apiVersion: 1

# Правила алертинга по логам. Источник — Loki (uid `loki` из
# config/datasources.yaml). Запрос — LogQL метрика: `count_over_time` по строкам
# с уровнем error за окно. Поле `level` приходит как structured metadata из
# Alloy (см. apps/alloy/config/config.alloy), поэтому фильтр не требует парсера
# и работает в алертах. Регистр значений разный у разных приложений, отсюда
# `(?i)`.
groups:
  - orgId: 1
    name: logs
    folder: Logs
    interval: 1m
    rules:
      - uid: logs-error-spike
        title: Всплеск ошибок в логах
        condition: C
        data:
          - refId: A
            queryType: instant
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: loki
            model:
              datasource:
                type: loki
                uid: loki
              editorMode: code
              expr: 'sum by (namespace) (count_over_time({namespace=~".+"} | level=~"(?i)error" [5m])) > 20'
              instant: true
              intervalMs: 1000
              maxDataPoints: 43200
              queryType: instant
              refId: A
          - refId: B
            relativeTimeRange:
              from: 0
              to: 0
            datasourceUid: __expr__
            model:
              conditions:
                - evaluator:
                    params: []
                    type: gt
                  operator:
                    type: and
                  query:
                    params:
                      - A
                  reducer:
                    params: []
                    type: last
                  type: query
              datasource:
                type: __expr__
                uid: __expr__
              expression: A
              intervalMs: 1000
              maxDataPoints: 43200
              reducer: last
              refId: B
              type: reduce
          - refId: C
            relativeTimeRange:
              from: 0
              to: 0
            datasourceUid: __expr__
            model:
              conditions:
                - evaluator:
                    params:
                      - 0
                    type: gt
                  operator:
                    type: and
                  query:
                    params:
                      - B
                  reducer:
                    params: []
                    type: last
                  type: query
              datasource:
                type: __expr__
                uid: __expr__
              expression: B
              intervalMs: 1000
              maxDataPoints: 43200
              refId: C
              type: threshold
        noDataState: OK
        execErrState: Error
        for: 15m
        isPaused: false
        labels:
          severity: warning
        annotations:
          summary: "Всплеск ошибок в логах (namespace {{ $labels.namespace }})"
          description: >-
            Больше 20 строк с level=error за 5 минут в namespace {{ $labels.namespace }}. Открыть Grafana → Explore → Loki и отфильтровать `{namespace="{{ $labels.namespace }}"} | level=~"(?i)error"`.
          runbook: "docs/research/log-output-formats.md"
      - uid: logs-pipeline-stalled
        title: Логи не пишутся
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: victoriametrics
            model:
              datasource:
                type: prometheus
                uid: victoriametrics
              editorMode: code
              expr: 'sum(rate(loki_distributor_lines_received_total{is_internal_stream="false"}[10m])) == 0'
              instant: true
              intervalMs: 1000
              maxDataPoints: 43200
              refId: A
          - refId: B
            relativeTimeRange:
              from: 0
              to: 0
            datasourceUid: __expr__
            model:
              conditions:
                - evaluator:
                    params: []
                    type: gt
                  operator:
                    type: and
                  query:
                    params:
                      - A
                  reducer:
                    params: []
                    type: last
                  type: query
              datasource:
                type: __expr__
                uid: __expr__
              expression: A
              intervalMs: 1000
              maxDataPoints: 43200
              reducer: last
              refId: B
              type: reduce
          - refId: C
            relativeTimeRange:
              from: 0
              to: 0
            datasourceUid: __expr__
            model:
              conditions:
                - evaluator:
                    params:
                      - 0
                    type: gt
                  operator:
                    type: and
                  query:
                    params:
                      - B
                  reducer:
                    params: []
                    type: last
                  type: query
              datasource:
                type: __expr__
                uid: __expr__
              expression: B
              intervalMs: 1000
              maxDataPoints: 43200
              refId: C
              type: threshold
        noDataState: OK
        execErrState: Error
        for: 10m
        isPaused: false
        labels:
          severity: critical
        annotations:
          summary: "Loki не принимает логи"
          description: >-
            За 10 минут в Loki не пришло ни одной строки. Обычно это остановка Alloy или сбой записи. Проверить `kubectl -n monitoring get pods -l app=alloy` и `up{job=~"loki|alloy"}`.
          runbook: "apps/alloy/README.md"
      - uid: logs-disk-low
        title: Loki low free disk space
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: victoriametrics
            model:
              datasource:
                type: prometheus
                uid: victoriametrics
              editorMode: code
              expr: 'kubelet_volume_stats_available_bytes{namespace="monitoring",persistentvolumeclaim="loki-data"} < 2e9'
              instant: true
              intervalMs: 1000
              maxDataPoints: 43200
              refId: A
          - refId: B
            relativeTimeRange:
              from: 0
              to: 0
            datasourceUid: __expr__
            model:
              conditions:
                - evaluator:
                    params: []
                    type: gt
                  operator:
                    type: and
                  query:
                    params:
                      - A
                  reducer:
                    params: []
                    type: last
                  type: query
              datasource:
                type: __expr__
                uid: __expr__
              expression: A
              intervalMs: 1000
              maxDataPoints: 43200
              reducer: last
              refId: B
              type: reduce
          - refId: C
            relativeTimeRange:
              from: 0
              to: 0
            datasourceUid: __expr__
            model:
              conditions:
                - evaluator:
                    params:
                      - 0
                    type: gt
                  operator:
                    type: and
                  query:
                    params:
                      - B
                  reducer:
                    params: []
                    type: last
                  type: query
              datasource:
                type: __expr__
                uid: __expr__
              expression: B
              intervalMs: 1000
              maxDataPoints: 43200
              refId: C
              type: threshold
        noDataState: OK
        execErrState: Error
        for: 30m
        isPaused: false
        labels:
          severity: warning
        annotations:
          summary: "Мало свободного места на PVC логов (loki-data)"
          description: >-
            На PVC loki-data (10Gi) осталось меньше 2 ГБ. Действия: расширить PVC либо сократить retention_period (сейчас 168h).
          runbook: "docs/incidents/0003-victoriametrics-pvc-read-only.md"
      - uid: tempo-disk-low
        title: Tempo low free disk space
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: victoriametrics
            model:
              datasource:
                type: prometheus
                uid: victoriametrics
              editorMode: code
              expr: 'kubelet_volume_stats_available_bytes{namespace="monitoring",persistentvolumeclaim="tempo-data"} < 1e9'
              instant: true
              intervalMs: 1000
              maxDataPoints: 43200
              refId: A
          - refId: B
            relativeTimeRange:
              from: 0
              to: 0
            datasourceUid: __expr__
            model:
              conditions:
                - evaluator:
                    params: []
                    type: gt
                  operator:
                    type: and
                  query:
                    params:
                      - A
                  reducer:
                    params: []
                    type: last
                  type: query
              datasource:
                type: __expr__
                uid: __expr__
              expression: A
              intervalMs: 1000
              maxDataPoints: 43200
              reducer: last
              refId: B
              type: reduce
          - refId: C
            relativeTimeRange:
              from: 0
              to: 0
            datasourceUid: __expr__
            model:
              conditions:
                - evaluator:
                    params:
                      - 0
                    type: gt
                  operator:
                    type: and
                  query:
                    params:
                      - B
                  reducer:
                    params: []
                    type: last
                  type: query
              datasource:
                type: __expr__
                uid: __expr__
              expression: B
              intervalMs: 1000
              maxDataPoints: 43200
              refId: C
              type: threshold
        noDataState: OK
        execErrState: Error
        for: 30m
        isPaused: false
        labels:
          severity: warning
        annotations:
          summary: "Мало свободного места на PVC трейсов (tempo-data)"
          description: >-
            На PVC tempo-data (5Gi) осталось меньше 1 ГБ. Действия: расширить PVC либо сократить backend_scheduler.provider.compaction.compaction.block_retention (сейчас 168h). В Tempo 3.0.3 удалением занимается backend worker, а задачи генерирует backend scheduler; проверить его работу можно по метрикам блоков и retention-задач.
          runbook: "apps/tempo/README.md"
      - uid: node-disk-low
        title: Мало свободного места на узле
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: victoriametrics
            model:
              datasource:
                type: prometheus
                uid: victoriametrics
              editorMode: code
              expr: '(node_filesystem_avail_bytes{fstype!~"tmpfs|overlay|squashfs"} / node_filesystem_size_bytes{fstype!~"tmpfs|overlay|squashfs"}) < 0.15 and node_filesystem_size_bytes{fstype!~"tmpfs|overlay|squashfs"} > 10e9'
              instant: true
              intervalMs: 1000
              maxDataPoints: 43200
              refId: A
          - refId: B
            relativeTimeRange:
              from: 0
              to: 0
            datasourceUid: __expr__
            model:
              conditions:
                - evaluator:
                    params: []
                    type: gt
                  operator:
                    type: and
                  query:
                    params:
                      - A
                  reducer:
                    params: []
                    type: last
                  type: query
              datasource:
                type: __expr__
                uid: __expr__
              expression: A
              intervalMs: 1000
              maxDataPoints: 43200
              reducer: last
              refId: B
              type: reduce
          - refId: C
            relativeTimeRange:
              from: 0
              to: 0
            datasourceUid: __expr__
            model:
              conditions:
                - evaluator:
                    params:
                      - 0
                    type: gt
                  operator:
                    type: and
                  query:
                    params:
                      - B
                  reducer:
                    params: []
                    type: last
                  type: query
              datasource:
                type: __expr__
                uid: __expr__
              expression: B
              intervalMs: 1000
              maxDataPoints: 43200
              refId: C
              type: threshold
        noDataState: OK
        execErrState: Error
        for: 30m
        isPaused: false
        labels:
          severity: critical
        annotations:
          summary: "Меньше 15% свободного места на узле {{ $labels.instance }} ({{ $labels.mountpoint }})"
          description: >-
            Доля свободного места на файловой системе упала ниже 15%. Проверить крупнейшие тома: `longhorn_volume_actual_size_bytes` в VictoriaMetrics, топ — zot-data, immich-library, victoriametrics-vmdata. Действия: расширить PVC, сократить retention либо почистить неиспользуемые тома.
          runbook: "apps/grafana/config/dashboards/storage-capacity.json"
      - uid: pyroscope-disk-low
        title: Pyroscope low free disk space
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: victoriametrics
            model:
              datasource:
                type: prometheus
                uid: victoriametrics
              editorMode: code
              expr: 'kubelet_volume_stats_available_bytes{namespace="monitoring",persistentvolumeclaim="pyroscope-data"} < 2e9'
              instant: true
              intervalMs: 1000
              maxDataPoints: 43200
              refId: A
          - refId: B
            relativeTimeRange:
              from: 0
              to: 0
            datasourceUid: __expr__
            model:
              conditions:
                - evaluator:
                    params: []
                    type: gt
                  operator:
                    type: and
                  query:
                    params:
                      - A
                  reducer:
                    params: []
                    type: last
                  type: query
              datasource:
                type: __expr__
                uid: __expr__
              expression: A
              intervalMs: 1000
              maxDataPoints: 43200
              reducer: last
              refId: B
              type: reduce
          - refId: C
            relativeTimeRange:
              from: 0
              to: 0
            datasourceUid: __expr__
            model:
              conditions:
                - evaluator:
                    params:
                      - 0
                    type: gt
                  operator:
                    type: and
                  query:
                    params:
                      - B
                  reducer:
                    params: []
                    type: last
                  type: query
              datasource:
                type: __expr__
                uid: __expr__
              expression: B
              intervalMs: 1000
              maxDataPoints: 43200
              refId: C
              type: threshold
        noDataState: OK
        execErrState: Error
        for: 30m
        isPaused: false
        labels:
          severity: warning
        annotations:
          summary: "Мало свободного места на PVC профилей (pyroscope-data)"
          description: >-
            На PVC pyroscope-data (10Gi) осталось меньше 2 ГБ. Действия: расширить PVC либо сократить limits.retention_period в конфиге Pyroscope (сейчас 168h). Pyroscope также сам удаляет старые блоки при нехватке места, но алерт нужен, чтобы узнать об этом заранее.
          runbook: "apps/pyroscope/README.md"

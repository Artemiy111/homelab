apiVersion: 1

# Правила метрического алертинга. Движок — Grafana Unified Alerting, источник
# данных — локальный VictoriaMetrics (uid зафиксирован в
# config/datasources.yaml, поэтому его нельзя переименовать без правки здесь).
#
# Форма правила неочевиден, и обе его части обязательны (проверено на стенде,
# см. #296):
#
# 1. В model запроса (refId A) нужен ВЛОЖЕННЫЙ объект datasource с type и uid.
#    Одного datasourceUid на уровне запроса планировщику мало: он ищет
#    datasource по полям model, не находит и падает при каждой оценке с
#    "the result-set has errors that can be retried: [plugin.notRegistered]
#    plugin not registered". Правило при этом молча не вычисляется.
# 2. condition обязан указывать на ВЫРАЖЕНИЕ (refId C), а не на сам запрос.
#    Цепочка A (запрос) -> B (reduce, reducer: last) -> C (threshold, gt 0)
#    разворачивает «вернулась серия» в решение «Alerting»: порог 0 отделяет
#    сработавшее от не сработавшего, потому что сами выражения уже фильтруют.
#
# noDataState: OK у всех правил: пустой вектор здесь означает «условие не
# выполнено», а не «не знаю».
#
# Набор намеренно маленький (5 правил). Каждое добавленное правило увеличивает
# шанс, что его начнут игнорировать, а алерт-фатиг обесценивает всю систему:
# сначала покрываем то, что молча ломает метрики, потом расширяем.
groups:
  - orgId: 1
    name: victoria-metrics
    folder: VictoriaMetrics
    interval: 1m
    rules:
      - uid: vm-free-disk-space-low
        title: VictoriaMetrics low free disk space
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: victoriametrics
            model:
              datasource:
                type: prometheus
                uid: victoriametrics
              editorMode: code
              expr: 'vm_free_disk_space_bytes{job="victoriametrics", path="/data"} < 1.5e9'
              instant: true
              intervalMs: 1000
              maxDataPoints: 43200
              refId: A
          - refId: B
            relativeTimeRange:
              from: 0
              to: 0
            datasourceUid: __expr__
            model:
              conditions:
                - evaluator:
                    params: []
                    type: gt
                  operator:
                    type: and
                  query:
                    params:
                      - A
                  reducer:
                    params: []
                    type: last
                  type: query
              datasource:
                type: __expr__
                uid: __expr__
              expression: A
              intervalMs: 1000
              maxDataPoints: 43200
              reducer: last
              refId: B
              type: reduce
          - refId: C
            relativeTimeRange:
              from: 0
              to: 0
            datasourceUid: __expr__
            model:
              conditions:
                - evaluator:
                    params:
                      - 0
                    type: gt
                  operator:
                    type: and
                  query:
                    params:
                      - B
                  reducer:
                    params: []
                    type: last
                  type: query
              datasource:
                type: __expr__
                uid: __expr__
              expression: B
              intervalMs: 1000
              maxDataPoints: 43200
              refId: C
              type: threshold
        noDataState: OK
        execErrState: Error
        for: 15m
        isPaused: false
        labels:
          severity: warning
        annotations:
          summary: "Мало свободного места на /data у VictoriaMetrics"
          description: >-
            На PVC victoriametrics-vmdata (8Gi) осталось меньше 1.5 ГБ. При текущем темпе роста (~200 МБ/сутки) этого хватит примерно на неделю. Действия: расширить PVC либо сократить retentionPeriod (сейчас 180d) и/или уменьшить число scrape-таргетов.
          runbook: "apps/victoria-metrics/README.md, раздел «Алерты»"
      - uid: vm-storage-filling-fast
        title: VictoriaMetrics storage fills within 3 days
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: victoriametrics
            model:
              datasource:
                type: prometheus
                uid: victoriametrics
              editorMode: code
              expr: 'predict_linear(vm_free_disk_space_bytes{job="victoriametrics", path="/data"}[1d], 3 * 86400) < 0'
              instant: true
              intervalMs: 1000
              maxDataPoints: 43200
              refId: A
          - refId: B
            relativeTimeRange:
              from: 0
              to: 0
            datasourceUid: __expr__
            model:
              conditions:
                - evaluator:
                    params: []
                    type: gt
                  operator:
                    type: and
                  query:
                    params:
                      - A
                  reducer:
                    params: []
                    type: last
                  type: query
              datasource:
                type: __expr__
                uid: __expr__
              expression: A
              intervalMs: 1000
              maxDataPoints: 43200
              reducer: last
              refId: B
              type: reduce
          - refId: C
            relativeTimeRange:
              from: 0
              to: 0
            datasourceUid: __expr__
            model:
              conditions:
                - evaluator:
                    params:
                      - 0
                    type: gt
                  operator:
                    type: and
                  query:
                    params:
                      - B
                  reducer:
                    params: []
                    type: last
                  type: query
              datasource:
                type: __expr__
                uid: __expr__
              expression: B
              intervalMs: 1000
              maxDataPoints: 43200
              refId: C
              type: threshold
        noDataState: OK
        execErrState: Error
        for: 30m
        isPaused: false
        labels:
          severity: warning
        annotations:
          summary: "VictoriaMetrics заполнится меньше чем за 3 суток"
          description: >-
            Линейная экстраполяция vm_free_disk_space_bytes за сутки даёт обнуление меньше чем через 3 суток. Это раннее предупреждение об ускорении роста, срабатывает до абсолютного порога.
          runbook: "apps/victoria-metrics/README.md, раздел «Алерты»"
      - uid: vm-storage-read-only
        title: VictoriaMetrics storage is read-only
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: victoriametrics
            model:
              datasource:
                type: prometheus
                uid: victoriametrics
              editorMode: code
              expr: 'vm_storage_is_read_only{job="victoriametrics", path="/data"} == 1'
              instant: true
              intervalMs: 1000
              maxDataPoints: 43200
              refId: A
          - refId: B
            relativeTimeRange:
              from: 0
              to: 0
            datasourceUid: __expr__
            model:
              conditions:
                - evaluator:
                    params: []
                    type: gt
                  operator:
                    type: and
                  query:
                    params:
                      - A
                  reducer:
                    params: []
                    type: last
                  type: query
              datasource:
                type: __expr__
                uid: __expr__
              expression: A
              intervalMs: 1000
              maxDataPoints: 43200
              reducer: last
              refId: B
              type: reduce
          - refId: C
            relativeTimeRange:
              from: 0
              to: 0
            datasourceUid: __expr__
            model:
              conditions:
                - evaluator:
                    params:
                      - 0
                    type: gt
                  operator:
                    type: and
                  query:
                    params:
                      - B
                  reducer:
                    params: []
                    type: last
                  type: query
              datasource:
                type: __expr__
                uid: __expr__
              expression: B
              intervalMs: 1000
              maxDataPoints: 43200
              refId: C
              type: threshold
        noDataState: OK
        execErrState: Error
        for: 1m
        isPaused: false
        labels:
          severity: critical
        annotations:
          summary: "Хранилище VictoriaMetrics в read-only, метрики не принимаются"
          description: >-
            TSDB на /data не принимает запись. vmagent получает 503 на remote write, новые метрики теряются; уже записанные данные целы. Срочно освободить или расширить PVC: после перезапуска пода накопленные в vmagent данные могут частично потеряться.
          runbook: "docs/incidents/0003-victoriametrics-pvc-read-only.md"
      - uid: vm-pending-rows-backlog
        title: VictoriaMetrics pending rows backlog
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: victoriametrics
            model:
              datasource:
                type: prometheus
                uid: victoriametrics
              editorMode: code
              expr: 'max(vm_pending_rows{job="victoriametrics"}) > 1e6'
              instant: true
              intervalMs: 1000
              maxDataPoints: 43200
              refId: A
          - refId: B
            relativeTimeRange:
              from: 0
              to: 0
            datasourceUid: __expr__
            model:
              conditions:
                - evaluator:
                    params: []
                    type: gt
                  operator:
                    type: and
                  query:
                    params:
                      - A
                  reducer:
                    params: []
                    type: last
                  type: query
              datasource:
                type: __expr__
                uid: __expr__
              expression: A
              intervalMs: 1000
              maxDataPoints: 43200
              reducer: last
              refId: B
              type: reduce
          - refId: C
            relativeTimeRange:
              from: 0
              to: 0
            datasourceUid: __expr__
            model:
              conditions:
                - evaluator:
                    params:
                      - 0
                    type: gt
                  operator:
                    type: and
                  query:
                    params:
                      - B
                  reducer:
                    params: []
                    type: last
                  type: query
              datasource:
                type: __expr__
                uid: __expr__
              expression: B
              intervalMs: 1000
              maxDataPoints: 43200
              refId: C
              type: threshold
        noDataState: OK
        execErrState: Error
        for: 30m
        isPaused: false
        labels:
          severity: warning
        annotations:
          summary: "VictoriaMetrics не сбрасывает pending rows на диск"
          description: >-
            Очередь несохранённых строк держится выше 1 млн (норма 5-50 тыс.) дольше 30 минут. Обычно это предшествует переходу TSDB в read-only: сначала замедляется сброс, потом он падает.
          runbook: "docs/incidents/0003-victoriametrics-pvc-read-only.md"
      - uid: scrape-target-down
        title: Scrape target down
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: victoriametrics
            model:
              datasource:
                type: prometheus
                uid: victoriametrics
              editorMode: code
              expr: 'count by (job) (up == 0) > 0'
              instant: true
              intervalMs: 1000
              maxDataPoints: 43200
              refId: A
          - refId: B
            relativeTimeRange:
              from: 0
              to: 0
            datasourceUid: __expr__
            model:
              conditions:
                - evaluator:
                    params: []
                    type: gt
                  operator:
                    type: and
                  query:
                    params:
                      - A
                  reducer:
                    params: []
                    type: last
                  type: query
              datasource:
                type: __expr__
                uid: __expr__
              expression: A
              intervalMs: 1000
              maxDataPoints: 43200
              reducer: last
              refId: B
              type: reduce
          - refId: C
            relativeTimeRange:
              from: 0
              to: 0
            datasourceUid: __expr__
            model:
              conditions:
                - evaluator:
                    params:
                      - 0
                    type: gt
                  operator:
                    type: and
                  query:
                    params:
                      - B
                  reducer:
                    params: []
                    type: last
                  type: query
              datasource:
                type: __expr__
                uid: __expr__
              expression: B
              intervalMs: 1000
              maxDataPoints: 43200
              refId: C
              type: threshold
        noDataState: OK
        execErrState: Error
        for: 10m
        isPaused: false
        labels:
          severity: warning
        annotations:
          summary: "Скрейп-таргет vmagent не отдаёт метрики"
          description: >-
            В значении job перечислены таргеты с up == 0 дольше 10 минут. Проверить /metrics таргета и его токен из Secret'а vmagent.
          runbook: "apps/victoria-metrics/README.md, раздел «Проверка»"

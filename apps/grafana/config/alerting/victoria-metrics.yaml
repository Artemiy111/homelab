apiVersion: 1

# Правила метрического алертинга. Движок — Grafana Unified Alerting, источник
# данных — локальный VictoriaMetrics (uid зафиксирован в
# config/datasources.yaml, поэтому его нельзя переименовать без правки здесь).
#
# Форма правила неочевиден, и обе его части обязательны (проверено на стенде,
# см. #296):
#
# 1. В model запроса (refId A) нужен ВЛОЖЕННЫЙ объект datasource с type и uid.
#    Одного datasourceUid на уровне запроса планировщику мало: он ищет
#    datasource по полям model, не находит и падает при каждой оценке с
#    "the result-set has errors that can be retried: [plugin.notRegistered]
#    plugin not registered". Правило при этом молча не вычисляется.
# 2. condition обязан указывать на ВЫРАЖЕНИЕ (refId C), а не на сам запрос.
#    Цепочка A (запрос) -> B (reduce, reducer: last) -> C (threshold, gt 0)
#    разворачивает «вернулась серия» в решение «Alerting»: порог 0 отделяет
#    сработавшее от не сработавшего, потому что сами выражения уже фильтруют.
#
# noDataState: OK у всех правил: пустой вектор здесь означает «условие не
# выполнено», а не «не знаю».
#
# Набор намеренно маленький (5 правил). Каждое добавленное правило увеличивает
# шанс, что его начнут игнорировать, а алерт-фатиг обесценивает всю систему:
# сначала покрываем то, что молча ломает метрики, потом расширяем.
groups:
  - orgId: 1
    name: victoria-metrics
    folder: VictoriaMetrics
    interval: 1m
    rules:
      - uid: vm-storage-read-only
        title: VictoriaMetrics storage is read-only
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: victoriametrics
            model:
              datasource:
                type: prometheus
                uid: victoriametrics
              editorMode: code
              expr: 'vm_storage_is_read_only{job="victoriametrics", path="/data"} == 1'
              instant: true
              intervalMs: 1000
              maxDataPoints: 43200
              refId: A
          - refId: B
            relativeTimeRange:
              from: 0
              to: 0
            datasourceUid: __expr__
            model:
              conditions:
                - evaluator:
                    params: []
                    type: gt
                  operator:
                    type: and
                  query:
                    params:
                      - A
                  reducer:
                    params: []
                    type: last
                  type: query
              datasource:
                type: __expr__
                uid: __expr__
              expression: A
              intervalMs: 1000
              maxDataPoints: 43200
              reducer: last
              refId: B
              type: reduce
          - refId: C
            relativeTimeRange:
              from: 0
              to: 0
            datasourceUid: __expr__
            model:
              conditions:
                - evaluator:
                    params:
                      - 0
                    type: gt
                  operator:
                    type: and
                  query:
                    params:
                      - B
                  reducer:
                    params: []
                    type: last
                  type: query
              datasource:
                type: __expr__
                uid: __expr__
              expression: B
              intervalMs: 1000
              maxDataPoints: 43200
              refId: C
              type: threshold
        noDataState: OK
        execErrState: Error
        for: 1m
        isPaused: false
        labels:
          severity: critical
        annotations:
          summary: "Хранилище VictoriaMetrics в read-only, метрики не принимаются"
          description: >-
            TSDB на /data не принимает запись. vmagent получает 503 на remote write, новые метрики теряются; уже записанные данные целы. Срочно освободить или расширить PVC: после перезапуска пода накопленные в vmagent данные могут частично потеряться.
          runbook: "docs/incidents/0003-victoriametrics-pvc-read-only.md"
      - uid: vm-pending-rows-backlog
        title: VictoriaMetrics pending rows backlog
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: victoriametrics
            model:
              datasource:
                type: prometheus
                uid: victoriametrics
              editorMode: code
              expr: 'max(vm_pending_rows{job="victoriametrics"}) > 1e6'
              instant: true
              intervalMs: 1000
              maxDataPoints: 43200
              refId: A
          - refId: B
            relativeTimeRange:
              from: 0
              to: 0
            datasourceUid: __expr__
            model:
              conditions:
                - evaluator:
                    params: []
                    type: gt
                  operator:
                    type: and
                  query:
                    params:
                      - A
                  reducer:
                    params: []
                    type: last
                  type: query
              datasource:
                type: __expr__
                uid: __expr__
              expression: A
              intervalMs: 1000
              maxDataPoints: 43200
              reducer: last
              refId: B
              type: reduce
          - refId: C
            relativeTimeRange:
              from: 0
              to: 0
            datasourceUid: __expr__
            model:
              conditions:
                - evaluator:
                    params:
                      - 0
                    type: gt
                  operator:
                    type: and
                  query:
                    params:
                      - B
                  reducer:
                    params: []
                    type: last
                  type: query
              datasource:
                type: __expr__
                uid: __expr__
              expression: B
              intervalMs: 1000
              maxDataPoints: 43200
              refId: C
              type: threshold
        noDataState: OK
        execErrState: Error
        for: 30m
        isPaused: false
        labels:
          severity: warning
        annotations:
          summary: "VictoriaMetrics не сбрасывает pending rows на диск"
          description: >-
            Очередь несохранённых строк держится выше 1 млн (норма 5-50 тыс.) дольше 30 минут. Обычно это предшествует переходу TSDB в read-only: сначала замедляется сброс, потом он падает.
          runbook: "docs/incidents/0003-victoriametrics-pvc-read-only.md"
      - uid: scrape-target-down
        title: Scrape target down
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: victoriametrics
            model:
              datasource:
                type: prometheus
                uid: victoriametrics
              editorMode: code
              expr: 'count by (job) (up == 0) > 0'
              instant: true
              intervalMs: 1000
              maxDataPoints: 43200
              refId: A
          - refId: B
            relativeTimeRange:
              from: 0
              to: 0
            datasourceUid: __expr__
            model:
              conditions:
                - evaluator:
                    params: []
                    type: gt
                  operator:
                    type: and
                  query:
                    params:
                      - A
                  reducer:
                    params: []
                    type: last
                  type: query
              datasource:
                type: __expr__
                uid: __expr__
              expression: A
              intervalMs: 1000
              maxDataPoints: 43200
              reducer: last
              refId: B
              type: reduce
          - refId: C
            relativeTimeRange:
              from: 0
              to: 0
            datasourceUid: __expr__
            model:
              conditions:
                - evaluator:
                    params:
                      - 0
                    type: gt
                  operator:
                    type: and
                  query:
                    params:
                      - B
                  reducer:
                    params: []
                    type: last
                  type: query
              datasource:
                type: __expr__
                uid: __expr__
              expression: B
              intervalMs: 1000
              maxDataPoints: 43200
              refId: C
              type: threshold
        noDataState: OK
        execErrState: Error
        for: 10m
        isPaused: false
        labels:
          severity: warning
        annotations:
          summary: "Скрейп-таргет vmagent не отдаёт метрики"
          description: >-
            В значении job перечислены таргеты с up == 0 дольше 10 минут. Проверить /metrics таргета и его токен из Secret'а vmagent.
          runbook: "apps/victoria-metrics/README.md, раздел «Проверка»"
      - uid: pipeline-metrics-stalled
        title: Метрики не поступают в VictoriaMetrics
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: victoriametrics
            model:
              datasource:
                type: prometheus
                uid: victoriametrics
              editorMode: code
              expr: 'sum(rate(vm_http_requests_total{job="vmagent"}[10m])) == 0'
              instant: true
              intervalMs: 1000
              maxDataPoints: 43200
              refId: A
          - refId: B
            relativeTimeRange:
              from: 0
              to: 0
            datasourceUid: __expr__
            model:
              conditions:
                - evaluator:
                    params: []
                    type: gt
                  operator:
                    type: and
                  query:
                    params:
                      - A
                  reducer:
                    params: []
                    type: last
                  type: query
              datasource:
                type: __expr__
                uid: __expr__
              expression: A
              intervalMs: 1000
              maxDataPoints: 43200
              reducer: last
              refId: B
              type: reduce
          - refId: C
            relativeTimeRange:
              from: 0
              to: 0
            datasourceUid: __expr__
            model:
              conditions:
                - evaluator:
                    params:
                      - 0
                    type: gt
                  operator:
                    type: and
                  query:
                    params:
                      - B
                  reducer:
                    params: []
                    type: last
                  type: query
              datasource:
                type: __expr__
                uid: __expr__
              expression: B
              intervalMs: 1000
              maxDataPoints: 43200
              refId: C
              type: threshold
        noDataState: OK
        execErrState: Error
        for: 15m
        isPaused: false
        labels:
          severity: critical
        annotations:
          summary: "vmagent не отправляет метрики в VictoriaMetrics"
          description: >-
            Компонент жив (up=1), но поток remote_write пустой: vmagent завис, потерял креды или упёрся в remote_write. Без этого алерта пайплайн метрик может молча остановиться. Проверить up{job="vmagent"}, логи vmagent и доступность VictoriaMetrics.
          runbook: "apps/victoria-metrics/README.md"
      - uid: pipeline-traces-stalled
        title: Трейсы не поступают в Tempo
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: victoriametrics
            model:
              datasource:
                type: prometheus
                uid: victoriametrics
              editorMode: code
              expr: 'sum(rate(tempo_distributor_spans_received_total{job="tempo"}[10m])) == 0'
              instant: true
              intervalMs: 1000
              maxDataPoints: 43200
              refId: A
          - refId: B
            relativeTimeRange:
              from: 0
              to: 0
            datasourceUid: __expr__
            model:
              conditions:
                - evaluator:
                    params: []
                    type: gt
                  operator:
                    type: and
                  query:
                    params:
                      - A
                  reducer:
                    params: []
                    type: last
                  type: query
              datasource:
                type: __expr__
                uid: __expr__
              expression: A
              intervalMs: 1000
              maxDataPoints: 43200
              reducer: last
              refId: B
              type: reduce
          - refId: C
            relativeTimeRange:
              from: 0
              to: 0
            datasourceUid: __expr__
            model:
              conditions:
                - evaluator:
                    params:
                      - 0
                    type: gt
                  operator:
                    type: and
                  query:
                    params:
                      - B
                  reducer:
                    params: []
                    type: last
                  type: query
              datasource:
                type: __expr__
                uid: __expr__
              expression: B
              intervalMs: 1000
              maxDataPoints: 43200
              refId: C
              type: threshold
        noDataState: OK
        execErrState: Error
        for: 15m
        isPaused: false
        labels:
          severity: warning
        annotations:
          summary: "В Tempo не поступают трейсы"
          description: >-
            Tempo и OTel Collector живы, но поток спанов пуст. Источники трейсов: Traefik (ingress) и Beyla (сервисы namespace element). После #542 именно поломка Beyla делает внутренние трейсы пустыми незаметно. Проверить up{job="beyla"} и логи подов beyla.
          runbook: "apps/beyla/README.md"
      - uid: vmagent-data-loss
        title: vmagent теряет данные
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: victoriametrics
            model:
              datasource:
                type: prometheus
                uid: victoriametrics
              editorMode: code
              expr: 'sum(rate(vm_persistentqueue_bytes_dropped_total[10m])) > 0'
              instant: true
              intervalMs: 1000
              maxDataPoints: 43200
              refId: A
          - refId: B
            relativeTimeRange:
              from: 0
              to: 0
            datasourceUid: __expr__
            model:
              conditions:
                - evaluator:
                    params: []
                    type: gt
                  operator:
                    type: and
                  query:
                    params:
                      - A
                  reducer:
                    params: []
                    type: last
                  type: query
              datasource:
                type: __expr__
                uid: __expr__
              expression: A
              intervalMs: 1000
              maxDataPoints: 43200
              reducer: last
              refId: B
              type: reduce
          - refId: C
            relativeTimeRange:
              from: 0
              to: 0
            datasourceUid: __expr__
            model:
              conditions:
                - evaluator:
                    params:
                      - 0
                    type: gt
                  operator:
                    type: and
                  query:
                    params:
                      - B
                  reducer:
                    params: []
                    type: last
                  type: query
              datasource:
                type: __expr__
                uid: __expr__
              expression: B
              intervalMs: 1000
              maxDataPoints: 43200
              refId: C
              type: threshold
        noDataState: OK
        execErrState: Error
        for: 5m
        isPaused: false
        labels:
          severity: critical
        annotations:
          summary: "vmagent отбрасывает семплы (переполнение persistent queue)"
          description: >-
            Данные теряются молча: часть семплов не доходит до VictoriaMetrics. Обычно причина в недоступном remote_write или нехватке места под очередь. Проверить vm_persistentqueue_blocks_dropped_total и логи vmagent.
          runbook: "apps/victoria-metrics/README.md"
      - uid: loki-active-streams-high
        title: Много активных серий в Loki
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: victoriametrics
            model:
              datasource:
                type: prometheus
                uid: victoriametrics
              editorMode: code
              expr: 'sum(loki_ingester_memory_streams{job="loki"}) > 10000'
              instant: true
              intervalMs: 1000
              maxDataPoints: 43200
              refId: A
          - refId: B
            relativeTimeRange:
              from: 0
              to: 0
            datasourceUid: __expr__
            model:
              conditions:
                - evaluator:
                    params: []
                    type: gt
                  operator:
                    type: and
                  query:
                    params:
                      - A
                  reducer:
                    params: []
                    type: last
                  type: query
              datasource:
                type: __expr__
                uid: __expr__
              expression: A
              intervalMs: 1000
              maxDataPoints: 43200
              reducer: last
              refId: B
              type: reduce
          - refId: C
            relativeTimeRange:
              from: 0
              to: 0
            datasourceUid: __expr__
            model:
              conditions:
                - evaluator:
                    params:
                      - 0
                    type: gt
                  operator:
                    type: and
                  query:
                    params:
                      - B
                  reducer:
                    params: []
                    type: last
                  type: query
              datasource:
                type: __expr__
                uid: __expr__
              expression: B
              intervalMs: 1000
              maxDataPoints: 43200
              refId: C
              type: threshold
        noDataState: OK
        execErrState: Error
        for: 10m
        isPaused: false
        labels:
          severity: warning
        annotations:
          summary: "Активных серий в Loki больше 10000 (норма порядка 165)"
          description: >-
            Рост кардинальности — главный способ положить Loki: новый лейбл с высокой уникальностью в приложении создаёт поток серий. Проверить, какое приложение добавило лейблы.
          runbook: "apps/loki/README.md"

apiVersion: 1

providers:
  # Дашборды — код в git (config/dashboards/), а не данные в БД Grafana.
  # allowUiUpdates: false делает провижининг источником правды: правки в UI не
  # сохраняются, изменения идут через git. disableDeletion не даёт удалить
  # провижинящиеся дашборды из UI.
  - name: homelab
    orgId: 1
    folder: ""
    type: file
    disableDeletion: true
    updateIntervalSeconds: 30
    allowUiUpdates: false
    options:
      path: /var/lib/grafana/dashboards

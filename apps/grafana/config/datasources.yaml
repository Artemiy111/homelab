apiVersion: 1

datasources:
  # uid зафиксирован вручную: на него ссылаются панели провижинящихся дашбордов
  # (`config/dashboards/`). Без него Grafana сгенерировала бы uid заново и
  # дашборды остались бы без datasource.
  - name: VictoriaMetrics
    uid: victoriametrics
    type: prometheus
    access: proxy
    url: http://victoriametrics:8428
    isDefault: true
    editable: false
    jsonData:
      timeInterval: 15s
  - name: Tempo
    uid: tempo
    type: tempo
    access: proxy
    url: http://tempo:3200
    editable: false
    jsonData:
      # Ссылка trace → logs: в Loki ищем строки с этим trace id за окно вокруг
      # спана. `$$` экранирует `$`, чтобы Grafana не подставила свою переменную
      # провижининга.
      tracesToLogsV2:
        datasourceUid: loki
        spanStartTimeShift: -5m
        spanEndTimeShift: 5m
        filterByTraceID: true
        filterBySpanID: false
        customQuery: true
        query: '{namespace=~".+"} |= "$${__trace.traceId}"'
  - name: Loki
    uid: loki
    type: loki
    access: proxy
    url: http://loki:3100
    editable: false
    jsonData:
      maxLines: 1000
      # Ссылка log → trace: находим trace_id в строке лога и открываем трейс.
      derivedFields:
        - name: TraceID
          matcherRegex: '(?:trace_id|traceId|traceID|TraceId|TraceID)[^ ]{0,4}?([0-9a-fA-F]{16,})'
          url: "$${__value.raw}"
          datasourceUid: tempo

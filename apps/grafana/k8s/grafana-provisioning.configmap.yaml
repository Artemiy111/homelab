apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-provisioning
  namespace: default
data:
  # Datasource Grafana: VictoriaMetrics совместим с Prometheus API.
  # Монтируется в /etc/grafana/provisioning/datasources (см. deployment).
  victoria-metrics.yaml: |
    apiVersion: 1

    datasources:
      - name: VictoriaMetrics
        type: prometheus
        access: proxy
        url: http://victoriametrics:8428
        isDefault: true
        editable: false
        jsonData:
          timeInterval: 15s

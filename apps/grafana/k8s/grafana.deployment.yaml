apiVersion: apps/v1
kind: Deployment
metadata:
  name: grafana
  namespace: monitoring
spec:
  replicas: 1
  selector:
    matchLabels:
      app: grafana
  revisionHistoryLimit: 2
  template:
    metadata:
      labels:
        app: grafana
    spec:
      enableServiceLinks: false
      containers:
        - name: grafana
          image: "grafana/grafana:13.2.0@sha256:3fd54ae1214669f8355f065ec9f6445d5279a3d77095ab048ca045685272429b"
          ports:
            - name: http
              containerPort: 3000
          env:
            - name: DOMAIN
              valueFrom:
                configMapKeyRef:
                  name: homelab-config
                  key: DOMAIN
            - name: TZ
              valueFrom:
                configMapKeyRef:
                  name: homelab-config
                  key: TZ
            - name: GF_SECURITY_ADMIN_USER
              value: admin
            - name: GF_SECURITY_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: grafana
                  key: GRAFANA_ADMIN_PASSWORD
            - name: GF_USERS_ALLOW_SIGN_UP
              value: "false"
            - name: GF_ANALYTICS_REPORTING_ENABLED
              value: "false"
            # Эквивалент [feature_toggles] enable=... в grafana.ini.
            - name: GF_FEATURE_TOGGLES_ENABLE
              value: grafanaAdvisor
            - name: GF_SERVER_ROOT_URL
              value: "https://grafana.$(DOMAIN)"
            # Данные (пользователи, дашборды, аннотации) — в общем кластере CNPG
            # shared, а не в SQLite. Роль grafana и база grafana объявлены в
            # platform/cnpg/; пароль — из Secret'а grafana-db (см.
            # k8s/sealedsecret.yaml).
            - name: GF_DATABASE_TYPE
              value: postgres
            - name: GF_DATABASE_HOST
              value: shared-rw.databases.svc.cluster.local:5432
            - name: GF_DATABASE_NAME
              value: grafana
            - name: GF_DATABASE_USER
              value: grafana
            - name: GF_DATABASE_SSL_MODE
              value: disable
            - name: GF_DATABASE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: grafana-db
                  key: GRAFANA_DB_PASSWORD
          resources:
            limits:
              cpu: "1"
              memory: 1Gi
            requests:
              cpu: 100m
              memory: 256Mi
          volumeMounts:
            - name: lib
              mountPath: /var/lib/grafana
            - name: datasources
              readOnly: true
              mountPath: /etc/grafana/provisioning/datasources
            - name: dashboards-provisioning
              readOnly: true
              mountPath: /etc/grafana/provisioning/dashboards
            - name: dashboards
              readOnly: true
              mountPath: /var/lib/grafana/dashboards
          livenessProbe:
            httpGet:
              path: /api/health
              port: http
            timeoutSeconds: 10
            periodSeconds: 60
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /api/health
              port: http
            timeoutSeconds: 10
            periodSeconds: 30
            failureThreshold: 3
          startupProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 20
            periodSeconds: 10
            failureThreshold: 30
          securityContext:
            capabilities:
              drop: ["ALL"]
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            seccompProfile:
              type: RuntimeDefault
      volumes:
        # /var/lib/grafana остаётся writable-скретчем (кэш плагинов, индекс
        # поиска): данные теперь в Postgres, поэтому том не нужен.
        - name: lib
          emptyDir: {}
        - name: datasources
          configMap:
            name: grafana-datasources
        - name: dashboards-provisioning
          configMap:
            name: grafana-dashboards-provisioning
        - name: dashboards
          configMap:
            name: grafana-dashboards
      # fsGroup даёт групповую запись в emptyDir, смонтированный в /var/lib/grafana.
      securityContext:
        fsGroup: 1000

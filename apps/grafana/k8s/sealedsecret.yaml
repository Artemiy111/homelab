---
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: grafana
  namespace: monitoring
spec:
  template:
    metadata:
      name: grafana
      namespace: monitoring
    type: Opaque
  encryptedData:
    GRAFANA_ADMIN_PASSWORD: 
---
# Пароль роли grafana в shared CNPG — тот же плейнтекст, что и
# databases/grafana-db-auth (один пароль, два SealedSecret'а; см.
# platform/cnpg/README.md).
#
# Отдельный Secret, а не ключ в `grafana`: SealedSecret write-only, а добавить
# ключ к существующему можно только перезапечатав весь Secret, то есть зная
# открытый GRAFANA_ADMIN_PASSWORD. Он нигде не хранится в расшифровываемом виде,
# поэтому админ-пароль намеренно не трогаем.
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: grafana-db
  namespace: monitoring
spec:
  template:
    metadata:
      name: grafana-db
      namespace: monitoring
    type: Opaque
  encryptedData:
    GRAFANA_DB_PASSWORD: 

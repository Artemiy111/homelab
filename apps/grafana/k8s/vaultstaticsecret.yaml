apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultStaticSecret
metadata:
  name: grafana-admin
  namespace: monitoring
spec:
  vaultAuthRef: vso-grafana
  mount: kv
  type: kv-v2
  path: grafana/admin
  refreshAfter: 1h
  destination:
    name: grafana-admin
    create: true
    overwrite: true
    transformation:
      excludeRaw: true
---

apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: monitoring
resources:
  - k8s/grafana.deployment.yaml
  - k8s/grafana.service.yaml
  - k8s/sealedsecret.yaml
configMapGenerator:
  # Провижининг datasources и dashboards + сами дашборды собираются из файлов
  # configMapGenerator'ом: kustomize добавляет хэш содержимого к имени и
  # переписывает ссылки в Deployment, поэтому правка конфига сама запускает
  # rollout.
  - name: grafana-datasources
    files:
      - config/datasources.yaml
  - name: grafana-dashboards-provisioning
    files:
      - config/dashboards.yaml
  - name: grafana-dashboards
    files:
      # Суммарный размер ConfigMap — 337946 Б, он больше лимита аннотации
      # kubectl.kubernetes.io/last-applied-configuration (262144 Б), поэтому
      # client-side apply на этом наборе падает с metadata.annotations: Too long.
      # Из-за этого дашборды держались в minified-виде и их нельзя было читать в
      # diff. Применение Grafana — server-side apply (см. README.md): он не пишет
      # эту аннотацию, и JSON можно хранить в читаемом виде.
      - config/dashboards/cloudnative-pg.json
      - config/dashboards/postgresql-database.json
      - config/dashboards/traefik.json

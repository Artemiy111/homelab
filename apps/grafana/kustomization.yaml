apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: monitoring
resources:
  - k8s/grafana.yaml
  - k8s/datasources.yaml
  - k8s/dashboards.yaml
  - k8s/vaultauth.yaml
  - k8s/vaultstaticsecret.yaml
configMapGenerator:
  # Провижининг dashboards и алертинга + сами дашборды собираются из файлов
  # configMapGenerator'ом. Datasource'ы вынесены в k8s/datasources.yaml: ими
  # управляет оператор, в провижининге им больше не место.
  # Суффикс-хэш отключён: имена ConfigMap'ов должны быть стабильными, иначе на
  # них нельзя сослаться из Grafana CR. Рестарт при изменении файлов делает
  # оператор — аннотация checksum/secrets в pod template это SHA от содержимого
  # всех Secret и ConfigMap, упомянутых в CR.
  #
  # Лейбл app.kubernetes.io/managed-by обязателен и не декоративен: информер
  # оператора фильтрует ConfigMap'ы и Secret'ы по нему
  # (main.go, mgrOptions.Cache.ByObject), а watch по остальным не срабатывает.
  # Чтение идёт напрямую через DisableFor, поэтому хэш считается верно, но
  # правка ConfigMap не вызывает реконсиль и не перезапускает под: изменение
  # молча не применяется. Проверено на стенде — ноль реконсилей за 30 секунд
  # после правки ConfigMap без лейбла.
  # Провижининг алертинга: contact points, дерево политик и правила. Grafana
  # перечитывает provisioning только на старте, поэтому пересборка этого
  # ConfigMap должна приводить к рестарту пода — это делает оператор.
  - name: grafana-alerting
    options:
      labels:
        app.kubernetes.io/managed-by: grafana-operator
    files:
      - config/alerting/contact-points.yaml
      - config/alerting/notification-policies.yaml
      - config/alerting/victoria-metrics.yaml
      - config/alerting/logs.yaml
      # Один механизм на все PVC вместо ручного перечисления томов стенки,
      # и контроль срока действия сертификатов.
      - config/alerting/storage.yaml
      - config/alerting/certificates.yaml
  # Дашборды остаются в ConfigMap: JSON велик (249 КБ на cloudnative-pg), и CR
  # оператора ссылается на него через configMapRef, а не хранит JSON внутри себя.
  - name: grafana-dashboards
    options:
      labels:
        app.kubernetes.io/managed-by: grafana-operator
    files:
      # Суммарный размер ConfigMap — 337946 Б, он больше лимита аннотации
      # kubectl.kubernetes.io/last-applied-configuration (262144 Б), поэтому
      # client-side apply на этом наборе падает с metadata.annotations: Too long.
      # Из-за этого дашборды держатся в minified-виде и их нельзя было читать в
      # diff. Применение Grafana — server-side apply (см. README.md): он не пишет
      # эту аннотацию, и JSON можно хранить в читаемом виде.
      - config/dashboards/cloudnative-pg.json
      - config/dashboards/postgresql-database.json
      - config/dashboards/storage-capacity.json
      - config/dashboards/traefik.json
      - config/dashboards/traefik-official.json
      - config/dashboards/logs-overview.json
generatorOptions:
  disableNameSuffixHash: true
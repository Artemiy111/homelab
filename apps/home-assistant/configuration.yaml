# The standard default_config dependencies except local Bluetooth. Listing them
# explicitly prevents Home Assistant from probing the host's unused hci0 without
# granting NET_ADMIN and access to the system D-Bus.
assist_pipeline:
cloud:
conversation:
dhcp:
energy:
file:
go2rtc:
history:
logbook:
media_source:
mobile_app:
my:
ssdp:
stream:
sun:
usage_prediction:
usb:
webhook:
zeroconf:

# Prometheus-метрики на /api/prometheus (скрейпит vmagent, Bearer-токен).
prometheus:

# Files managed by the automation, script, and scene editors in the UI.
automation: !include automations.yaml
script: !include scripts.yaml
scene: !include scenes.yaml

# Настройки HTTP начиная с HA 2026.x управляются в UI (Settings → System →
# Network): YAML-блок http: игнорируется. После миграции там заданы:
# доверенный прокси 172.20.0.0/16 (подсеть Traefik) и use_x_forwarded_for.

# Локальный вход по паролю отключён полностью: единственный способ войти —
# ZITADEL через auth_oidc ниже. Если SSO сломался, доступ восстанавливается
# на сервере правкой этого файла (git revert + docker compose restart).
# Мобильные приложения аутентифицируются через OIDC-браузер и продолжают работать.
homeassistant:
  auth_providers: []

# SSO через ZITADEL (custom component hass-oidc-auth, ставится init.sh;
# см. README). Креденшалы приходят из окружения (secrets.enc.env через
# service_run в service_compose).
auth_oidc:
  client_id: !env_var OIDC_CLIENT_ID
  client_secret: !env_var OIDC_CLIENT_SECRET
  discovery_url: https://id.example.com/.well-known/openid-configuration
  features:
    # Сразу отправлять на ZITADEL при открытии корня HA.
    default_redirect: true
    # ВРЕМЕННО, только для миграции: вход через ZITADEL прикрепляется к
    # существующему пользователю с тем же логином. После проверки выключить.
    automatic_user_linking: true

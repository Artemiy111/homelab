apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: home-assistant
  namespace: home-assistant
spec:
  parentRefs:
    - name: homelab
      namespace: traefik
  hostnames:
    - ha.biplane.v6.rocks
  rules:
    # nativeLB не переносим: в Gateway API его нет, и он здесь не нужен —
    # под hostNetwork, endpoint сервиса и так адрес узла.
    - backendRefs:
        - name: home-assistant
          port: 80

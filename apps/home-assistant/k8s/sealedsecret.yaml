---
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: home-assistant
  namespace: home-assistant
spec:
  encryptedData:
    HOME_ASSISTANT_TOKEN: 
    OIDC_CLIENT_ID: 
    OIDC_CLIENT_SECRET: 
  template:
    metadata:
      name: home-assistant
      namespace: home-assistant
    type: Opaque

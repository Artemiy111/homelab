apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultStaticSecret
metadata:
  name: home-assistant-oidc
  namespace: home-assistant
spec:
  vaultAuthRef: vso-home-assistant
  mount: kv
  type: kv-v2
  path: home-assistant/oidc
  refreshAfter: 1h
  destination:
    name: home-assistant-oidc
    create: true
    overwrite: true
    transformation:
      excludeRaw: true

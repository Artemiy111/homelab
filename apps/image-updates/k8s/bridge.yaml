# Мост k8s → Docker: Gatus ходит по имени `wud`, трафик уходит на
# docker-контейнер через порт, опубликованный на шлюзе traefiknet
# (см. `ports` в apps/image-updates/compose.yaml). При миграции сервиса в k8s
# заменить EndpointSlice на selector — имя и порт для Gatus не меняются.
apiVersion: v1
kind: Service
metadata:
  name: wud
  namespace: default
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 80
      targetPort: http
      protocol: TCP
---
apiVersion: discovery.k8s.io/v1
kind: EndpointSlice
metadata:
  name: wud-bridge
  namespace: default
  labels:
    kubernetes.io/service-name: wud
addressType: IPv4
ports:
  - name: http
    port: 18085
    protocol: TCP
endpoints:
  - addresses:
      - 172.20.0.1
    conditions:
      ready: true

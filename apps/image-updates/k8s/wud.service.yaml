apiVersion: v1
kind: Service
metadata:
  name: wud
  namespace: default
spec:
  type: ClusterIP
  selector:
    app: wud
  ports:
    # gatus ходит на http://wud/health (порт 80).
    - name: http
      port: 80
      targetPort: http
      protocol: TCP
    # vmagent скрейпит http://wud:3000/metrics.
    - name: metrics
      port: 3000
      targetPort: http
      protocol: TCP

apiVersion: v1
kind: Service
metadata:
  name: immich
  namespace: default
spec:
  type: ClusterIP
  selector:
    app: immich-server
  ports:
    - name: http
      port: 2283
      targetPort: http
      protocol: TCP
    # Prometheus-метрики (скрейпит netdata в кластере).
    - name: metrics
      port: 8081
      targetPort: 8081
      protocol: TCP

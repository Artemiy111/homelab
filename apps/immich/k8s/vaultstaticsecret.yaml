apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultStaticSecret
metadata:
  name: immich-db
  namespace: immich
spec:
  vaultAuthRef: vso-immich
  mount: kv
  type: kv-v2
  path: immich/db
  refreshAfter: 1h
  destination:
    name: immich-db
    create: true
    overwrite: true
    transformation:
      excludeRaw: true

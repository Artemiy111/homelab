apiVersion: apps/v1
kind: Deployment
metadata:
  name: infisical-postgres
  namespace: infisical
spec:
  # postgres:14-alpine, PGDATA=/var/lib/postgresql/data (uid 70).
  # ВАЖНО: в Docker реальные данные лежали в анонимном томе образа
  # (bind был на родительский /var/lib/postgresql). Перед cutover данные
  # скопированы в /storage/apps/infisical/pgdata (см. README/заметки).
  strategy:
    type: Recreate
  revisionHistoryLimit: 2
  replicas: 1
  selector:
    matchLabels:
      app: infisical-postgres
  template:
    metadata:
      labels:
        app: infisical-postgres
    spec:
      containers:
        - name: postgres
          image: "postgres:14-alpine@sha256:727876d274666da0b92a445390ba093c84b8e9f8343e1c53cd4e9a7ab2d85310"
          ports:
            - name: postgres
              containerPort: 5432
          env:
            - name: POSTGRES_DB
              value: infisical
            - name: POSTGRES_USER
              value: infisical
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: infisical
                  key: POSTGRES_PASSWORD
          startupProbe:
            exec:
              command: ["pg_isready", "-U", "infisical", "-d", "infisical"]
            initialDelaySeconds: 15
            periodSeconds: 5
            failureThreshold: 30
          livenessProbe:
            exec:
              command: ["pg_isready", "-U", "infisical", "-d", "infisical"]
            periodSeconds: 30
            timeoutSeconds: 5
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "infisical", "-d", "infisical"]
            periodSeconds: 10
            timeoutSeconds: 5
          securityContext:
            runAsUser: 70
            runAsGroup: 70
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            seccompProfile:
              type: RuntimeDefault
          resources:
            requests:
              cpu: 20m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
      volumes:
        - name: data
          hostPath:
            path: /storage/apps/infisical/pgdata
            type: Directory

apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultStaticSecret
metadata:
  name: infisical-db
  namespace: infisical
spec:
  vaultAuthRef: vso-infisical
  mount: kv
  type: kv-v2
  path: infisical/db
  refreshAfter: 1h
  destination:
    name: infisical-db
    create: true
    overwrite: true
    transformation:
      excludeRaw: true
---
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultStaticSecret
metadata:
  name: infisical-secrets
  namespace: infisical
spec:
  vaultAuthRef: vso-infisical
  mount: kv
  type: kv-v2
  path: infisical/secrets
  refreshAfter: 1h
  destination:
    name: infisical-secrets
    create: true
    overwrite: true
    transformation:
      excludeRaw: true

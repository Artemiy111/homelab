apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: jellyfin
  namespace: jellyfin
spec:
  parentRefs:
    - name: homelab
      namespace: traefik
      sectionName: https
  hostnames:
    - jellyfin.biplane.v6.rocks
  rules:
    - backendRefs:
        - name: jellyfin
          port: 80

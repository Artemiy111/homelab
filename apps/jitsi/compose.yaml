name: jitsi

services:
  web:
    image: ghcr.io/jitsi/web:${JITSI_IMAGE_VERSION:?set in apps/jitsi secrets.enc.env}
    container_name: jitsi-web
    read_only: true
    tmpfs:
      - /run:size=16M,mode=1750,exec
      - /tmp:size=16M,mode=1777,noexec

    depends_on:
      - jvb

    volumes:
      - ${APPS_STORAGE_PATH:-/storage/apps}/jitsi/web:/config:Z
      - ${APPS_STORAGE_PATH:-/storage/apps}/jitsi/storage/web:/storage:Z
      - ${APPS_STORAGE_PATH:-/storage/apps}/jitsi/storage/transcripts:/usr/share/jitsi-meet/transcripts:ro,z
      - ${APPS_STORAGE_PATH:-/storage/apps}/jitsi/tmp/web-crontabs:/var/spool/cron/crontabs:Z
      - ${APPS_STORAGE_PATH:-/storage/apps}/jitsi/tmp/web-load-test:/usr/share/jitsi-meet/load-test:Z

    environment:
      DISABLE_HTTPS: "1"
      ENABLE_AUTH: ${ENABLE_AUTH:-1}
      ENABLE_GUESTS: ${ENABLE_GUESTS:-1}
      ENABLE_HTTP_REDIRECT: "0"
      ENABLE_PREJOIN_PAGE: "1"
      ENABLE_WELCOME_PAGE: "1"
      ENABLE_XMPP_WEBSOCKET: "1"
      PUBLIC_URL: https://meet.${DOMAIN}
      RESOLUTION: ${RESOLUTION:-1080}
      RESOLUTION_MIN: ${RESOLUTION_MIN:-180}
      RESOLUTION_WIDTH: ${RESOLUTION_WIDTH:-1920}
      RESOLUTION_WIDTH_MIN: ${RESOLUTION_WIDTH_MIN:-320}
      TZ: ${TZ:?set in apps/jitsi secrets.enc.env}
      VIDEOQUALITY_BITRATE_AV1_FULL: ${VIDEOQUALITY_BITRATE_AV1_FULL:-2500000}
      VIDEOQUALITY_BITRATE_H264_FULL: ${VIDEOQUALITY_BITRATE_H264_FULL:-3500000}
      VIDEOQUALITY_BITRATE_VP8_FULL: ${VIDEOQUALITY_BITRATE_VP8_FULL:-3500000}
      VIDEOQUALITY_BITRATE_VP9_FULL: ${VIDEOQUALITY_BITRATE_VP9_FULL:-2500000}
      XMPP_AUTH_DOMAIN: auth.meet.jitsi
      XMPP_BOSH_URL_BASE: http://prosody:5280
      XMPP_DOMAIN: meet.jitsi
      XMPP_GUEST_DOMAIN: guest.meet.jitsi
      XMPP_MUC_DOMAIN: muc.meet.jitsi
      XMPP_PORT: 5222
      XMPP_RECORDER_DOMAIN: recorder.meet.jitsi

    networks:
      - default
      - traefiknet
    restart: unless-stopped

    labels:
      - traefik.enable=true
      - traefik.http.routers.jitsi.rule=Host(`meet.${DOMAIN}`)
      - traefik.http.routers.jitsi.entrypoints=websecure
      - traefik.http.services.jitsi.loadbalancer.server.port=8000
      - traefik.docker.network=traefiknet

  prosody:
    image: ghcr.io/jitsi/prosody:${JITSI_IMAGE_VERSION:?set in apps/jitsi secrets.enc.env}
    container_name: jitsi-prosody
    read_only: true
    tmpfs:
      - /run:size=16M,mode=1750,exec
      - /tmp:size=16M,mode=1777,noexec

    expose:
      - "${XMPP_PORT:-5222}"
      - "5269"
      - "5347"
      - "5280"

    volumes:
      - ${APPS_STORAGE_PATH:-/storage/apps}/jitsi/prosody/config:/config:Z
      - ${APPS_STORAGE_PATH:-/storage/apps}/jitsi/prosody/prosody-plugins-custom:/prosody-plugins-custom:Z
      - ${APPS_STORAGE_PATH:-/storage/apps}/jitsi/storage/prosody:/var/lib/prosody:Z

    environment:
      AUTH_TYPE: ${AUTH_TYPE:-internal}
      ENABLE_AUTH: ${ENABLE_AUTH:-1}
      ENABLE_GUESTS: ${ENABLE_GUESTS:-1}
      ENABLE_LOBBY: "1"
      ENABLE_XMPP_WEBSOCKET: "1"
      JICOFO_AUTH_PASSWORD: ${JICOFO_AUTH_PASSWORD:?set in apps/jitsi secrets.enc.env}
      JICOFO_AUTH_USER: focus
      JICOFO_COMPONENT_SECRET: ${JICOFO_COMPONENT_SECRET:?set in apps/jitsi secrets.enc.env}
      JVB_AUTH_PASSWORD: ${JVB_AUTH_PASSWORD:?set in apps/jitsi secrets.enc.env}
      JVB_AUTH_USER: jvb
      TZ: ${TZ:?set in apps/jitsi secrets.enc.env}
      XMPP_AUTH_DOMAIN: auth.meet.jitsi
      XMPP_DOMAIN: meet.jitsi
      XMPP_GUEST_DOMAIN: guest.meet.jitsi
      XMPP_INTERNAL_MUC_DOMAIN: internal-muc.meet.jitsi
      XMPP_INTERNAL_MUC_MODULES: ping
      XMPP_MUC_DOMAIN: muc.meet.jitsi
      XMPP_RECORDER_DOMAIN: recorder.meet.jitsi

    networks:
      default:
        aliases:
          - xmpp.meet.jitsi
    restart: unless-stopped

  jicofo:
    image: ghcr.io/jitsi/jicofo:${JITSI_IMAGE_VERSION:?set in apps/jitsi secrets.enc.env}
    container_name: jitsi-jicofo
    read_only: true
    tmpfs:
      - /run:size=16M,mode=1750,exec
      - /tmp:size=16M,mode=1777,noexec

    depends_on:
      - prosody

    ports:
      - "127.0.0.1:${JICOFO_REST_PORT:-8888}:8888"

    volumes:
      - ${APPS_STORAGE_PATH:-/storage/apps}/jitsi/jicofo:/config:Z

    environment:
      AUTH_TYPE: ${AUTH_TYPE:-internal}
      ENABLE_AUTH: ${ENABLE_AUTH:-1}
      ENABLE_AUTO_OWNER: "1"
      ENABLE_GUESTS: ${ENABLE_GUESTS:-1}
      JICOFO_AUTH_PASSWORD: ${JICOFO_AUTH_PASSWORD:?set in apps/jitsi secrets.enc.env}
      JICOFO_AUTH_USER: focus
      JICOFO_COMPONENT_SECRET: ${JICOFO_COMPONENT_SECRET:?set in apps/jitsi secrets.enc.env}
      JICOFO_ENABLE_BRIDGE_HEALTH_CHECKS: "1"
      SENTRY_DSN: ""
      TZ: ${TZ:?set in apps/jitsi secrets.enc.env}
      XMPP_AUTH_DOMAIN: auth.meet.jitsi
      XMPP_DOMAIN: meet.jitsi
      XMPP_INTERNAL_MUC_DOMAIN: internal-muc.meet.jitsi
      XMPP_MUC_DOMAIN: muc.meet.jitsi
      XMPP_RECORDER_DOMAIN: recorder.meet.jitsi
      XMPP_SERVER: prosody

    networks:
      - default
    restart: unless-stopped

  jvb:
    image: ghcr.io/jitsi/jvb:${JITSI_IMAGE_VERSION:?set in apps/jitsi secrets.enc.env}
    container_name: jitsi-jvb
    read_only: true
    tmpfs:
      - /run:size=16M,mode=1750,exec
      - /tmp:size=16M,mode=1777,noexec

    depends_on:
      - prosody

    ports:
      - "${SERVER_IP}:${JVB_PORT:-10000}:${JVB_PORT:-10000}/udp"
      - "127.0.0.1:${JVB_COLIBRI_PORT:-8080}:8080"

    volumes:
      - ${APPS_STORAGE_PATH:-/storage/apps}/jitsi/jvb:/config:Z

    environment:
      COLIBRI_REST_ENABLED: "true"
      JVB_ADVERTISE_IPS: ${SERVER_IP}
      JVB_AUTH_PASSWORD: ${JVB_AUTH_PASSWORD:?set in apps/jitsi secrets.enc.env}
      JVB_AUTH_USER: jvb
      JVB_BREWERY_MUC: jvbbrewery
      JVB_DISABLE_STUN: "true"
      JVB_PORT: ${JVB_PORT:-10000}
      PUBLIC_URL: https://meet.${DOMAIN}
      SENTRY_DSN: ""
      TZ: ${TZ:?set in apps/jitsi secrets.enc.env}
      XMPP_AUTH_DOMAIN: auth.meet.jitsi
      XMPP_INTERNAL_MUC_DOMAIN: internal-muc.meet.jitsi
      XMPP_SERVER: prosody

    networks:
      - default
    restart: unless-stopped

networks:
  traefiknet:
    external: true

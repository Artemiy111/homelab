apiVersion: apps/v1
kind: Deployment
metadata:
  name: jitsi-jicofo
  namespace: jitsi
spec:
  replicas: 1
  selector:
    matchLabels:
      app: jitsi-jicofo
  template:
    metadata:
      labels:
        app: jitsi-jicofo
    spec:
      enableServiceLinks: false
      # s6-overlay требует, чтобы /run принадлежал пользователю контейнера;
      # пустой emptyDir создаётся root-овым, поэтому чиним владельца до старта.
      initContainers:
        - name: fix-run-perms
          image: "redis:8.10-alpine@sha256:978f0e01593e65eed801f2402944efcd936d43b5027e4908a7897baf88ed6241"
          command: ["sh", "-c", "chown 1000:1000 /run && chmod 0750 /run"]
          resources:
            limits:
              cpu: 100m
              memory: 32Mi
            requests:
              cpu: 10m
              memory: 16Mi
          volumeMounts:
            - name: run
              mountPath: /run
          securityContext:
            capabilities:
              add: ["CHOWN", "FOWNER"]
              drop: ["ALL"]
            allowPrivilegeEscalation: false
            runAsUser: 0
            seccompProfile:
              type: RuntimeDefault
      containers:
        - name: jicofo
          image: "ghcr.io/jitsi/jicofo:stable-11146-1@sha256:a5da296923010dcc2daf6a02e6a183181906cb969a088ae90b97516bdeb9737f"
          ports:
            - name: rest
              containerPort: 8888
          env:
            - name: TZ
              valueFrom:
                configMapKeyRef:
                  name: homelab-config
                  key: TZ
            - name: JICOFO_AUTH_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: jitsi
                  key: JICOFO_AUTH_PASSWORD
            - name: JICOFO_COMPONENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: jitsi
                  key: JICOFO_COMPONENT_SECRET
            - name: AUTH_TYPE
              value: internal
            - name: ENABLE_AUTH
              value: "1"
            - name: ENABLE_AUTO_OWNER
              value: "1"
            - name: ENABLE_GUESTS
              value: "1"
            - name: JICOFO_AUTH_USER
              value: focus
            - name: JICOFO_ENABLE_BRIDGE_HEALTH_CHECKS
              value: "1"
            - name: SENTRY_DSN
              value: ""
            - name: XMPP_AUTH_DOMAIN
              value: auth.meet.jitsi
            - name: XMPP_DOMAIN
              value: meet.jitsi
            - name: XMPP_INTERNAL_MUC_DOMAIN
              value: internal-muc.meet.jitsi
            - name: XMPP_MUC_DOMAIN
              value: muc.meet.jitsi
            - name: XMPP_RECORDER_DOMAIN
              value: recorder.meet.jitsi
            - name: XMPP_SERVER
              value: prosody
          resources:
            limits:
              cpu: "1"
              memory: 512Mi
            requests:
              cpu: 50m
              memory: 128Mi
          volumeMounts:
            - name: config
              mountPath: /config
            - name: run
              mountPath: /run
            - name: tmp
              mountPath: /tmp
          securityContext:
            capabilities:
              drop: ["ALL"]
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            seccompProfile:
              type: RuntimeDefault
      volumes:
        - name: config
          persistentVolumeClaim:
            claimName: jitsi-jicofo-config
        - name: run
          emptyDir:
            sizeLimit: 16Mi
        - name: tmp
          emptyDir:
            sizeLimit: 16Mi
      # fsGroup даёт групповую запись в тома Longhorn для пользователя 1000.
      securityContext:
        fsGroup: 1000
  # RWO-тома: два пода при rolling update пишут в одни каталоги.
  strategy:
    type: Recreate
  revisionHistoryLimit: 2

apiVersion: v1
kind: Service
metadata:
  name: prosody
  namespace: jitsi
spec:
  type: ClusterIP
  selector:
    app: jitsi-prosody
  ports:
    - name: http
      protocol: TCP
      port: 5280
      targetPort: http
    - name: xmpp-client
      protocol: TCP
      port: 5222
      targetPort: xmpp-client
    - name: xmpp-federation
      protocol: TCP
      port: 5269
      targetPort: xmpp-federation
    - name: xmpp-component
      protocol: TCP
      port: 5347
      targetPort: xmpp-component

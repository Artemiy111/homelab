apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: jitsi
  namespace: jitsi
spec:
  parentRefs:
    - name: homelab
      namespace: traefik
      sectionName: https
  hostnames:
    - meet.biplane.v6.rocks
  rules:
    - backendRefs:
        - name: jitsi-web
          port: 80

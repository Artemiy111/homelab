name: local-ai

services:
  api:
    image: localai/localai:v4.8.0@sha256:78befe43707579dbe1b1d3f17d9788aa41ec493da30a6b6aabdf39e5efd23b7c
    container_name: local-ai-api

    volumes:
      - ${APPS_STORAGE_PATH:-/storage/apps}/local-ai/models:/models:Z
      - ${APPS_STORAGE_PATH:-/storage/apps}/local-ai/backends:/backends:Z
      - ${APPS_STORAGE_PATH:-/storage/apps}/local-ai/configuration:/configuration:Z
      - ${APPS_STORAGE_PATH:-/storage/apps}/local-ai/data:/data:Z

    environment:
      HOME: /tmp/localai
      LOCALAI_ADDRESS: 0.0.0.0:8080
      LOCALAI_API_KEY: ${LOCALAI_API_KEY:?set LOCALAI_API_KEY in local-ai/secrets.enc.env}
      LOCALAI_LOG_LEVEL: info
      LOCALAI_SUBTLE_KEY_COMPARISON: "true"

    networks:
      - traefiknet
    restart: unless-stopped

    healthcheck:
      test: [ "CMD", "curl", "--fail", "--silent", "--show-error", "http://127.0.0.1:8080/readyz" ]
      start_period: 10m
      interval: 1m
      timeout: 10s
      retries: 3

    logging:
      options:
        max-size: "10m"
        max-file: "3"
        compress: "true"

    labels:
      - traefik.enable=true
      - traefik.http.routers.local-ai.rule=Host(`localai.${DOMAIN}`)
      - traefik.http.routers.local-ai.entrypoints=websecure
      - traefik.http.routers.local-ai.middlewares=secure-headers@file,ratelimit-default@file
      - traefik.http.services.local-ai.loadbalancer.server.port=8080
      - traefik.http.services.local-ai.loadbalancer.healthcheck.path=/readyz
      - traefik.http.services.local-ai.loadbalancer.healthcheck.interval=30s
      - traefik.http.services.local-ai.loadbalancer.healthcheck.timeout=5s
      - traefik.docker.network=traefiknet

    user: "1000:1000"

    cap_drop:
      - ALL
    cpus: 14.0
    init: true
    mem_limit: 20g
    memswap_limit: 20g

    pids_limit: 512
    platform: linux/amd64
    read_only: true
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 2m
    tmpfs:
      - /tmp:mode=1777,nosuid,nodev,size=4g

networks:
  traefiknet:
    external: true

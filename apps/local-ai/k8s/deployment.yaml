apiVersion: apps/v1
kind: Deployment
metadata:
  name: local-ai
  namespace: local-ai
spec:
  replicas: 1
  selector:
    matchLabels:
      app: local-ai
  template:
    metadata:
      labels:
        app: local-ai
    spec:
      terminationGracePeriodSeconds: 120
      containers:
        - name: local-ai
          image: "localai/localai:v4.8.0@sha256:78befe43707579dbe1b1d3f17d9788aa41ec493da30a6b6aabdf39e5efd23b7c"
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - configMapRef:
                name: homelab-config
          env:
            - name: LOCALAI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: local-ai
                  key: LOCALAI_API_KEY
            - name: HOME
              value: /tmp/localai
            - name: LOCALAI_ADDRESS
              value: 0.0.0.0:8080
            - name: LOCALAI_LOG_LEVEL
              value: info
            - name: LOCALAI_SUBTLE_KEY_COMPARISON
              value: "true"
            - name: LOCALAI_DISABLE_USAGE_STATS
              value: "true"
          resources:
            limits:
              cpu: "4"
              memory: 20Gi
            requests:
              cpu: 100m
              # Суточный пик 243 МиБ по cAdvisor в VM: движок всё же запускался.
              # Пятиминутный сэмпл это пропустил.
              memory: 256Mi
          volumeMounts:
            - name: models
              mountPath: /models
            - name: backends
              mountPath: /backends
            - name: configuration
              mountPath: /configuration
            - name: data
              mountPath: /data
            - name: tmp
              mountPath: /tmp
          livenessProbe:
            httpGet:
              path: /readyz
              port: http
            timeoutSeconds: 10
            periodSeconds: 60
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            timeoutSeconds: 10
            periodSeconds: 60
            failureThreshold: 3
          startupProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 15
            periodSeconds: 10
            failureThreshold: 60
          securityContext:
            capabilities:
              drop: ["ALL"]
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            seccompProfile:
              type: RuntimeDefault
      volumes:
        - name: models
          hostPath:
            path: /storage/apps/local-ai/models
            type: Directory
        - name: backends
          persistentVolumeClaim:
            claimName: local-ai-backends
        - name: configuration
          persistentVolumeClaim:
            claimName: local-ai-configuration
        - name: data
          persistentVolumeClaim:
            claimName: local-ai-data
        - name: tmp
          emptyDir:
            sizeLimit: 4Gi
      # fsGroup даёт групповую запись в тома Longhorn для пользователя 1000.
      securityContext:
        fsGroup: 1000
  # RWO-тома: два пода при rolling update пишут в одни каталоги.
  strategy:
    type: Recreate
  revisionHistoryLimit: 2

apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: monitoring
resources:
  - k8s/loki.deployment.yaml
  - k8s/loki.pvc.yaml
  - k8s/loki.service.yaml
configMapGenerator:
  # loki.yaml собирается в ConfigMap `loki-config`; kustomize добавляет хэш
  # содержимого к имени и переписывает ссылку в Deployment, поэтому правка
  # конфига сама запускает rollout.
  - name: loki-config
    files:
      - config/loki.yaml

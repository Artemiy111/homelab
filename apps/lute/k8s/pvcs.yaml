apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: lute-data-pvc
  namespace: lute
spec:
  storageClassName: longhorn-retain
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 64Mi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: lute-backup-pvc
  namespace: lute
spec:
  storageClassName: longhorn-retain
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 64Mi

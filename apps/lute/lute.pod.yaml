apiVersion: v1
kind: Pod
metadata:
  name: "lute"
  namespace: default
  labels:
    app: "lute"
spec:
  containers:
  - name: lute
    image: "jzohrab/lute3:latest"
    resources:
      requests:
        cpu: 0.01
        memory: 32Mi
      limits:
        cpu: 0.5
        memory: 512Mi
    ports:
    - containerPort: 5001
      name: http
    livenessProbe:
        httpGet:
          path: /
          port: http
        periodSeconds: 30
        timeoutSeconds: 10
        initialDelaySeconds: 30
        failureThreshold: 5
    readinessProbe:
        httpGet:
          path: /
          port: http
        periodSeconds: 30
        failureThreshold: 3
    securityContext:
        capabilities:
          drop: ["ALL"]
          add: ["DAC_OVERRIDE"]
    volumeMounts:
    - name: data
      mountPath: /lute_data
    - name: backup
      mountPath: /lute_backup
  volumes:
    - name: data
      hostPath:
        path: /storage/apps/lute/data/data
    - name: backup
      hostPath:
        path: /storage/apps/lute/data/backups
  restartPolicy: Always
---
name: mailserver

services:
  mailserver:
    image: stalwartlabs/stalwart:v0.16
    container_name: mailserver

    volumes:
      - ${APPS_STORAGE_PATH:-/storage/apps}/mailserver/etc:/etc/stalwart:Z
      - ${APPS_STORAGE_PATH:-/storage/apps}/mailserver/data:/var/lib/stalwart:Z

    environment:
      STALWART_RECOVERY_ADMIN: "${STALWART_ADMIN_USER:?set in apps/mailserver secrets.enc.env}:${STALWART_ADMIN_PASS:?set in apps/mailserver secrets.enc.env}"
      STALWART_METRICS_PASSWORD: ${STALWART_METRICS_PASSWORD:?set in apps/mailserver secrets.enc.env}
      STALWART_HOSTNAME: "mail.${DOMAIN}"
      STALWART_PUBLIC_URL: "https://mailserver.${DOMAIN}"

    ports:
      - "25:25"
      - "587:587"
      - "993:993"

    networks:
      - default
      - traefiknet
    restart: unless-stopped

    labels:
      - traefik.enable=true
      - traefik.http.routers.mailserver.rule=Host(`mailserver.${DOMAIN}`)
      - traefik.http.routers.mailserver.entrypoints=websecure
      - traefik.http.services.mailserver.loadbalancer.server.port=8080
      - traefik.docker.network=traefiknet
    user: "1000:1000"

  mail:
    image: ghcr.io/bulwarkmail/webmail:1.8
    container_name: mail

    depends_on:
      - mailserver

    volumes:
      - ${APPS_STORAGE_PATH:-/storage/apps}/mailserver/mail:/app/data:Z

    environment:
      HOSTNAME: "0.0.0.0"
      PORT: "3000"
      JMAP_SERVER_URL: "https://mailserver.${DOMAIN}"
      SETTINGS_SYNC_ENABLED: "true"
      BULWARK_TELEMETRY: "off"

    networks:
      - traefiknet
    restart: unless-stopped

    healthcheck:
      test: [ "CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:3000/api/health" ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

    labels:
      - traefik.enable=true
      - traefik.http.routers.mail.rule=Host(`mail.${DOMAIN}`)
      - traefik.http.routers.mail.entrypoints=websecure
      - traefik.http.services.mail.loadbalancer.server.port=3000
      - traefik.docker.network=traefiknet
    user: "1000:1000"

networks:
  traefiknet:
    external: true

apiVersion: v1
kind: Service
metadata:
  name: mailserver-mail
  namespace: default
spec:
  # Почтовые порты публикуются на IP узла (.254) — как раньше через Docker
  # (приём извне: роутер шлёт на .254:25; клиенты идут на mail.<домен>:25/993).
  # kube-proxy делает DNAT в PREROUTING, поэтому firewalld INPUT не мешает.
  type: ClusterIP
  externalIPs:
    - 192.0.2.10
  selector:
    app: mailserver
  ports:
    - name: smtp
      port: 25
      targetPort: smtp
      protocol: TCP
    - name: submission
      port: 587
      targetPort: submission
      protocol: TCP
    - name: imaps
      port: 993
      targetPort: imaps
      protocol: TCP

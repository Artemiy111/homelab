apiVersion: v1
kind: Service
metadata:
  name: mailserver-mail
  namespace: default
spec:
  # Почтовые порты публикуются на IP узла (.254) и на MetalLB-VIP (.253):
  # .254 — как раньше через Docker (приём извне: роутер шлёт на .254:25),
  # .253 — чтобы клиенты, идущие на mail.<домен>, попадали сюда.
  # kube-proxy делает DNAT в PREROUTING, поэтому firewalld INPUT не мешает.
  type: ClusterIP
  externalIPs:
    - 192.0.2.10
    - 192.0.2.10
  selector:
    app: mailserver
  ports:
    - name: smtp
      port: 25
      targetPort: smtp
      protocol: TCP
    - name: submission
      port: 587
      targetPort: submission
      protocol: TCP
    - name: imaps
      port: 993
      targetPort: imaps
      protocol: TCP

apiVersion: apps/v1
kind: Deployment
metadata:
  name: mailserver
  namespace: mailserver
  annotations:
    ignore-check.kube-linter.io/privilege-escalation-container: "stalwart биндит 25/587/993 через file-capability cap_net_bind_service, для этого нужен no_new_privs=false (#161)"
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mailserver
  # RWO-тома: два пода при rolling update пишут в один каталог.
  strategy:
    type: Recreate
  revisionHistoryLimit: 2
  template:
    metadata:
      labels:
        app: mailserver
    spec:
      enableServiceLinks: false
      containers:
        - name: mailserver
          image: "stalwartlabs/stalwart:v0.16@sha256:a8108e19bd927e172d4d8c128907b8dfc93fd180ae8ee07dccdd42cb97eb9dfa"
          ports:
            - name: smtp
              containerPort: 25
            - name: submission
              containerPort: 587
            - name: imaps
              containerPort: 993
            - name: http
              containerPort: 8080
          env:
            - name: DOMAIN
              valueFrom:
                configMapKeyRef:
                  name: homelab-config
                  key: DOMAIN
            - name: TZ
              valueFrom:
                configMapKeyRef:
                  name: homelab-config
                  key: TZ
            - name: STALWART_ADMIN_USER
              value: admin
            - name: STALWART_ADMIN_PASS
              valueFrom:
                secretKeyRef:
                  name: mailserver
                  key: STALWART_ADMIN_PASS
            - name: STALWART_METRICS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: mailserver
                  key: STALWART_METRICS_PASSWORD
            - name: STALWART_RECOVERY_ADMIN
              value: "$(STALWART_ADMIN_USER):$(STALWART_ADMIN_PASS)"
            - name: STALWART_HOSTNAME
              value: "mail.$(DOMAIN)"
            - name: STALWART_PUBLIC_URL
              value: "https://mailserver.$(DOMAIN)"
          resources:
            limits:
              cpu: "2"
              memory: 2Gi
            requests:
              cpu: 100m
              memory: 128Mi
          volumeMounts:
            - name: etc
              mountPath: /etc/stalwart
            - name: data
              mountPath: /var/lib/stalwart
          livenessProbe:
            tcpSocket:
              port: http
            timeoutSeconds: 5
            periodSeconds: 30
            failureThreshold: 3
          readinessProbe:
            tcpSocket:
              port: http
            timeoutSeconds: 5
            periodSeconds: 15
            failureThreshold: 3
          startupProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 10
            periodSeconds: 5
            failureThreshold: 60
          securityContext:
            capabilities:
              add: ["NET_BIND_SERVICE"]
              drop: ["ALL"]
            # У бинарника stalwart file-capability cap_net_bind_service: без
            # no_new_privs он запускается и биндит привилегированные порты.
            allowPrivilegeEscalation: true
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            seccompProfile:
              type: RuntimeDefault
      volumes:
        - name: etc
          persistentVolumeClaim:
            claimName: mailserver-etc
        - name: data
          persistentVolumeClaim:
            claimName: mailserver-data
      # Docker по умолчанию ставит ip_unprivileged_port_start=0, поэтому
      # контейнер под uid 1000 биндит 25/587/993. В k8s повторяем это в поде.
      securityContext:
        # fsGroup даёт групповую запись в тома Longhorn для пользователя 1000.
        fsGroup: 1000
        sysctls:
          - name: net.ipv4.ip_unprivileged_port_start
            value: "0"

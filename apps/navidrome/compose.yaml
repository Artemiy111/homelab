name: navidrome

services:
  navidrome:
    image: deluan/navidrome:0.63.1
    container_name: navidrome
    volumes:
      - ${APPS_STORAGE_PATH:-/storage/apps}/navidrome/data:/data:Z
      - /storage/media/music:/music:z,ro

    environment:
      ND_DATAFOLDER: /data
      ND_MUSICFOLDER: /music
      ND_SCANNER_SCHEDULE: "@every 1h"
      ND_ENABLESHARING: "false"
      # Метрики на секретном пути (значение в secrets.enc.env).
      ND_PROMETHEUS_ENABLED: "true"
      ND_PROMETHEUS_METRICSPATH: /metrics_${NAVIDROME_METRICS_PATH:?set in apps/navidrome secrets.enc.env}

    networks:
      - traefiknet
    restart: unless-stopped

    labels:
      - traefik.enable=true
      - traefik.http.routers.navidrome.rule=Host(`music.${DOMAIN}`)
      - traefik.http.routers.navidrome.entrypoints=websecure
      - traefik.http.services.navidrome.loadbalancer.server.port=4533
      - traefik.docker.network=traefiknet
    user: "1000:1000"

    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

networks:
  traefiknet:
    external: true

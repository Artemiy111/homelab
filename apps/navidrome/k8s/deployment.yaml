apiVersion: apps/v1
kind: Deployment
metadata:
  name: navidrome
  namespace: navidrome
spec:
  replicas: 1
  selector:
    matchLabels:
      app: navidrome
  template:
    metadata:
      labels:
        app: navidrome
    spec:
      containers:
        - name: navidrome
          image: "deluan/navidrome:0.63.1@sha256:7c43af9f651654e97278be871705aae85a4ee0fa4b310337989699a8ada9b3ed"
          ports:
            - name: http
              containerPort: 4533
          envFrom:
            - configMapRef:
                name: homelab-config
          env:
            - name: NAVIDROME_METRICS_PATH
              valueFrom:
                secretKeyRef:
                  name: navidrome
                  key: NAVIDROME_METRICS_PATH
            - name: ND_DATAFOLDER
              value: /data
            - name: ND_MUSICFOLDER
              value: /music
            - name: ND_SCANNER_SCHEDULE
              value: "@every 1h"
            - name: ND_ENABLESHARING
              value: "false"
            - name: ND_PROMETHEUS_ENABLED
              value: "true"
            - name: ND_PROMETHEUS_METRICSPATH
              value: "/metrics_$(NAVIDROME_METRICS_PATH)"
          resources:
            limits:
              cpu: 500m
              memory: 512Mi
            requests:
              cpu: 10m
              memory: 64Mi
          volumeMounts:
            - name: data
              mountPath: /data
            - name: music
              readOnly: true
              mountPath: /music
          livenessProbe:
            httpGet:
              path: /ping
              port: http
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /ping
              port: http
            periodSeconds: 30
          startupProbe:
            httpGet:
              path: /ping
              port: http
            initialDelaySeconds: 10
            periodSeconds: 5
          securityContext:
            capabilities:
              drop: ["ALL"]
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            seccompProfile:
              type: RuntimeDefault
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: navidrome-data
        - name: music
          hostPath:
            path: /storage/media/music
            type: Directory
      # fsGroup даёт групповую запись в том Longhorn, иначе root-owned каталог
      # тома недоступен пользователю 1000.
      securityContext:
        fsGroup: 1000
  # RWO-том: два пода при rolling update пишут в одну БД.
  strategy:
    type: Recreate
  revisionHistoryLimit: 2

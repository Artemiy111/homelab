# Базовый NetworkPolicy для namespace сервиса: default-deny ingress плюс
# явные разрешения. Метрики Navidrome отдаёт на основном порту (4533), поэтому
# скрейп vmagent разрешён на него же. Egress не ограничивается.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-ingress
  namespace: navidrome
spec:
  podSelector: {}
  policyTypes:
    - Ingress
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-ingress
  namespace: navidrome
spec:
  podSelector: {}
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector: {}
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: traefik
    - from:
        - podSelector:
            matchLabels:
              app: vmagent
          namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitoring
      ports:
        - protocol: TCP
          port: 4533

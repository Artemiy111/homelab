apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultStaticSecret
metadata:
  name: navidrome-metrics-path
  namespace: navidrome
spec:
  vaultAuthRef: vso-navidrome
  mount: kv
  type: kv-v2
  path: navidrome/@monitoring/navidrome-metrics-path
  refreshAfter: 1h
  destination:
    name: navidrome-metrics-path
    create: true
    overwrite: true
    transformation:
      excludeRaw: true

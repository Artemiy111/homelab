apiVersion: apps/v1
kind: Deployment
metadata:
  name: netdata
  namespace: monitoring
  annotations:
    ignore-check.kube-linter.io/docker-sock: "netdata читает docker.sock read-only для метрик контейнеров (#161)"
    ignore-check.kube-linter.io/privilege-escalation-container: "apps.plugin — setuid-binary, без escalation не собирает метрики процессов (#161)"
spec:
  replicas: 1
  selector:
    matchLabels:
      app: netdata
  # RWO-том состояния: два пода при rolling update пишут в один каталог.
  strategy:
    type: Recreate
  revisionHistoryLimit: 2
  template:
    metadata:
      labels:
        app: netdata
    spec:
      hostname: homelab
      enableServiceLinks: false
      containers:
        - name: netdata
          image: "netdata/netdata:v2.11.0@sha256:d9f6f14c2fb0517168bd9c5da952f6cb735df757919c37172695c2fbb63c3252"
          ports:
            - name: http
              containerPort: 19999
          env:
            - name: DISABLE_TELEMETRY
              value: "1"
            - name: TZ
              valueFrom:
                configMapKeyRef:
                  name: homelab-config
                  key: TZ
          resources:
            limits:
              cpu: "2"
              memory: 1Gi
            requests:
              cpu: 200m
              memory: 256Mi
          volumeMounts:
            - name: config
              mountPath: /etc/netdata
            - name: lib
              mountPath: /var/lib/netdata
            - name: cache
              mountPath: /var/cache/netdata
            - name: docker-sd
              readOnly: true
              mountPath: /etc/netdata/go.d/sd/docker.conf
            - name: health-alarm-notify
              readOnly: true
              mountPath: /etc/netdata/health_alarm_notify.conf
            - name: host-root
              readOnly: true
              mountPath: /host/root
              mountPropagation: HostToContainer
            - name: host-passwd
              readOnly: true
              mountPath: /host/etc/passwd
            - name: host-group
              readOnly: true
              mountPath: /host/etc/group
            - name: localtime
              readOnly: true
              mountPath: /etc/localtime
            - name: host-os-release
              readOnly: true
              mountPath: /host/etc/os-release
            - name: host-proc
              readOnly: true
              mountPath: /host/proc
              mountPropagation: HostToContainer
            - name: host-sys
              readOnly: true
              mountPath: /host/sys
              mountPropagation: HostToContainer
            - name: host-var-log
              readOnly: true
              mountPath: /host/var/log
            - name: docker-sock
              readOnly: true
              mountPath: /var/run/docker.sock
          livenessProbe:
            httpGet:
              path: /api/v1/info
              port: http
            timeoutSeconds: 10
            periodSeconds: 60
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /api/v1/info
              port: http
            timeoutSeconds: 10
            periodSeconds: 30
            failureThreshold: 3
          startupProbe:
            httpGet:
              path: /api/v1/info
              port: http
            initialDelaySeconds: 20
            periodSeconds: 10
            failureThreshold: 30
          securityContext:
            capabilities:
              add: ["SYS_PTRACE", "DAC_READ_SEARCH"]
            # apps.plugin — setuid-binary из образа: no-new-privileges ломает
            # сбор метрик процессов, поэтому escalation разрешён.
            allowPrivilegeEscalation: true
            runAsUser: 0
            runAsGroup: 0
            seccompProfile:
              type: RuntimeDefault
      volumes:
        - name: config
          hostPath:
            path: /storage/apps/netdata/config
            type: Directory
        - name: lib
          persistentVolumeClaim:
            claimName: netdata-lib
        - name: cache
          emptyDir: {}
        - name: docker-sd
          hostPath:
            path: /home/artlab/projects/homelab/apps/netdata/config/go.d/sd/docker.conf
            type: File
        - name: health-alarm-notify
          hostPath:
            path: /home/artlab/projects/homelab/apps/netdata/config/health_alarm_notify.conf
            type: File
        - name: host-root
          hostPath:
            path: /
            type: Directory
        - name: host-passwd
          hostPath:
            path: /etc/passwd
            type: File
        - name: host-group
          hostPath:
            path: /etc/group
            type: File
        - name: localtime
          hostPath:
            path: /etc/localtime
            type: File
        - name: host-os-release
          hostPath:
            path: /etc/os-release
            type: File
        - name: host-proc
          hostPath:
            path: /proc
            type: Directory
        - name: host-sys
          hostPath:
            path: /sys
            type: Directory
        - name: host-var-log
          hostPath:
            path: /var/log
            type: Directory
        - name: docker-sock
          hostPath:
            path: /var/run/docker.sock
            type: Socket

apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: netdata
  namespace: monitoring
spec:
  parentRefs:
    - name: homelab
      namespace: traefik
  hostnames:
    - netdata.biplane.v6.rocks
    - netdata.biplane.casa
  rules:
    - backendRefs:
        - name: netdata
          port: 80
          filters:
            - type: ExtensionRef
              extensionRef:
                group: traefik.io
                kind: Middleware
                name: oauth2-proxy
            - type: ExtensionRef
              extensionRef:
                group: traefik.io
                kind: Middleware
                name: secure-headers
            - type: ExtensionRef
              extensionRef:
                group: traefik.io
                kind: Middleware
                name: ratelimit-default

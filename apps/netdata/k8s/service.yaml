apiVersion: v1
kind: Service
metadata:
  name: netdata
  namespace: monitoring
spec:
  type: ClusterIP
  selector:
    app: netdata
  ports:
    - name: http
      protocol: TCP
      port: 80
      targetPort: http
    # Порт приложения: vmagent скрейпит /api/v1/allmetrics.
    - name: scrape
      protocol: TCP
      port: 19999
      targetPort: http

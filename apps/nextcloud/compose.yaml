name: nextcloud

x-nextcloud-environment: &nextcloud-environment
  POSTGRES_HOST: db
  POSTGRES_DB: ${POSTGRES_DB:-nextcloud}
  POSTGRES_USER: ${POSTGRES_USER:-nextcloud}
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set in apps/nextcloud secrets.enc.env}
  REDIS_HOST: redis
  NEXTCLOUD_ADMIN_USER: ${NEXTCLOUD_ADMIN_USER:?set in apps/nextcloud secrets.enc.env}
  NEXTCLOUD_ADMIN_PASSWORD: ${NEXTCLOUD_ADMIN_PASSWORD:?set in apps/nextcloud secrets.enc.env}
  NEXTCLOUD_TRUSTED_DOMAINS: nextcloud.${DOMAIN}
  NEXTCLOUD_DEFAULT_LANGUAGE: ${DEFAULT_LOCALE}
  TRUSTED_PROXIES: ${TRAEFIK_NETWORK_CIDR:?set in apps/nextcloud secrets.enc.env}
  APACHE_DISABLE_REWRITE_IP: "1"
  OVERWRITEHOST: nextcloud.${DOMAIN}
  OVERWRITEPROTOCOL: https
  OVERWRITECLIURL: https://nextcloud.${DOMAIN}
  NEXTCLOUD_INIT_HTACCESS: "true"
  PHP_MEMORY_LIMIT: 512M
  PHP_UPLOAD_LIMIT: 16G
  TZ: ${TZ:?set in apps/nextcloud secrets.enc.env}

services:
  db:
    image: postgres:18-alpine
    container_name: nextcloud-db

    volumes:
      - ${APPS_STORAGE_PATH:-/storage/apps}/nextcloud/postgresql-18:/var/lib/postgresql/18/docker:Z

    environment:
      POSTGRES_DB: ${POSTGRES_DB:-nextcloud}
      POSTGRES_USER: ${POSTGRES_USER:-nextcloud}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set in apps/nextcloud secrets.enc.env}

    networks:
      - backend
    restart: unless-stopped

    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}" ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  redis:
    image: redis:8-alpine
    container_name: nextcloud-redis

    volumes:
      - ${APPS_STORAGE_PATH:-/storage/apps}/nextcloud/redis:/data:Z

    networks:
      - backend
    command: redis-server --save 60 1 --loglevel warning
    restart: unless-stopped

    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 10

  app:
    image: nextcloud:34.0.3-apache
    container_name: nextcloud-app

    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

    volumes:
      - ${APPS_STORAGE_PATH:-/storage/apps}/nextcloud/html:/var/www/html:z

    environment:
      <<: *nextcloud-environment

    networks:
      backend:
      traefiknet:
        aliases:
          - nextcloud
    restart: unless-stopped

    healthcheck:
      test:
        - CMD-SHELL
        - >-
          curl -fsS http://127.0.0.1/status.php | grep -q '"installed":true'
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 5m

    labels:
      - traefik.enable=true
      - traefik.http.routers.nextcloud.rule=Host(`nextcloud.${DOMAIN}`)
      - traefik.http.routers.nextcloud.entrypoints=websecure
      - traefik.http.routers.nextcloud.middlewares=nextcloud-dav,nextcloud-security
      - traefik.http.services.nextcloud.loadbalancer.server.port=80
      - traefik.http.middlewares.nextcloud-dav.redirectregex.regex=^https://(.*)/.well-known/(?:card|cal)dav
      - traefik.http.middlewares.nextcloud-dav.redirectregex.replacement=https://$${1}/remote.php/dav/
      - traefik.http.middlewares.nextcloud-dav.redirectregex.permanent=true
      - traefik.http.middlewares.nextcloud-security.headers.stsSeconds=15552000
      - traefik.http.middlewares.nextcloud-security.headers.stsIncludeSubdomains=true
      - traefik.http.middlewares.nextcloud-security.headers.stsPreload=true
      - traefik.http.middlewares.nextcloud-security.headers.contentTypeNosniff=true
      - traefik.http.middlewares.nextcloud-security.headers.referrerPolicy=no-referrer
      - traefik.docker.network=traefiknet
    init: true

    security_opt:
      - no-new-privileges:true

  cron:
    image: nextcloud:34.0.3-apache
    container_name: nextcloud-cron

    depends_on:
      app:
        condition: service_healthy

    volumes:
      - ${APPS_STORAGE_PATH:-/storage/apps}/nextcloud/html:/var/www/html:z

    environment:
      <<: *nextcloud-environment

    networks:
      - backend
      - traefiknet
    entrypoint: /cron.sh
    restart: unless-stopped
    init: true

    security_opt:
      - no-new-privileges:true

  backup-db:
    image: postgres:18-alpine
    container_name: nextcloud-backup-db

    depends_on:
      db:
        condition: service_healthy

    volumes:
      - ${APPS_STORAGE_PATH:-/storage/apps}/nextcloud/backups:/backups:Z

    environment:
      PGHOST: db
      PGDATABASE: ${POSTGRES_DB:-nextcloud}
      PGUSER: ${POSTGRES_USER:-nextcloud}
      PGPASSWORD: ${POSTGRES_PASSWORD:?set in apps/nextcloud secrets.enc.env}

    networks:
      - backend

    command:
      - >-
        umask 077; pg_dump --format=custom --file=/backups/nextcloud.dump.tmp; mv /backups/nextcloud.dump.tmp /backups/nextcloud.dump
    entrypoint:
      - /bin/sh
      - -ec
    restart: "no"

    profiles:
      - tools

networks:
  backend:
    internal: true
  traefiknet:
    external: true

apiVersion: apps/v1
kind: Deployment
metadata:
  name: nextcloud
  namespace: default
spec:
  strategy:
    type: Recreate
  revisionHistoryLimit: 2
  replicas: 1
  selector:
    matchLabels:
      app: nextcloud
  template:
    metadata:
      labels:
        app: nextcloud
    spec:
      initContainers:
        - name: wait-for-db
          image: "postgres:18-alpine@sha256:d3e1620b530c944afa6e887d22eb899824da68e19c52024bf98f5220c88a65b2"
          command: ["/bin/sh", "-c", "until pg_isready -h nextcloud-db -p 5432 -U nextcloud; do echo waiting for db; sleep 2; done"]
          securityContext:
            runAsUser: 70
            runAsGroup: 70
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            seccompProfile:
              type: RuntimeDefault
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 64Mi
        - name: wait-for-redis
          image: "redis:8-alpine@sha256:978f0e01593e65eed801f2402944efcd936d43b5027e4908a7897baf88ed6241"
          command: ["/bin/sh", "-c", "until redis-cli -h nextcloud-redis ping | grep -q PONG; do echo waiting for redis; sleep 2; done"]
          securityContext:
            runAsUser: 999
            runAsGroup: 999
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            seccompProfile:
              type: RuntimeDefault
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 64Mi
      containers:
        - name: nextcloud
          image: "nextcloud:34.0.3-apache@sha256:365baea128b5e0f45a8dc5111c9234b926f1e6082b4c14d75ae650324ce5d65c"
          ports:
            - name: http
              containerPort: 80
          env:
            - name: DOMAIN
              valueFrom:
                configMapKeyRef:
                  name: homelab-config
                  key: DOMAIN
            - name: TZ
              valueFrom:
                configMapKeyRef:
                  name: homelab-config
                  key: TZ
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: nextcloud
                  key: POSTGRES_PASSWORD
            - name: NEXTCLOUD_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: nextcloud
                  key: NEXTCLOUD_ADMIN_PASSWORD
            - name: POSTGRES_HOST
              value: nextcloud-db
            - name: POSTGRES_DB
              value: nextcloud
            - name: POSTGRES_USER
              value: nextcloud
            - name: REDIS_HOST
              value: nextcloud-redis
            - name: NEXTCLOUD_ADMIN_USER
              value: nextcloud-admin
            - name: NEXTCLOUD_TRUSTED_DOMAINS
              value: "nextcloud.$(DOMAIN)"
            - name: NEXTCLOUD_DEFAULT_LANGUAGE
              valueFrom:
                configMapKeyRef:
                  name: homelab-config
                  key: DEFAULT_LOCALE
            # Обратный прокси — Traefik в кластере (pod CIDR k0s).
            - name: TRUSTED_PROXIES
              value: "10.244.0.0/16"
            - name: APACHE_DISABLE_REWRITE_IP
              value: "1"
            - name: OVERWRITEHOST
              value: "nextcloud.$(DOMAIN)"
            - name: OVERWRITEPROTOCOL
              value: https
            - name: OVERWRITECLIURL
              value: "https://nextcloud.$(DOMAIN)"
            - name: NEXTCLOUD_INIT_HTACCESS
              value: "true"
            - name: PHP_MEMORY_LIMIT
              value: 512M
            - name: PHP_UPLOAD_LIMIT
              value: 16G
          startupProbe:
            httpGet:
              path: /status.php
              port: http
            initialDelaySeconds: 30
            periodSeconds: 15
            failureThreshold: 40
          livenessProbe:
            httpGet:
              path: /status.php
              port: http
            periodSeconds: 60
            timeoutSeconds: 10
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /status.php
              port: http
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 3
          securityContext:
            # nextcloud-образ стартует как root и роняет apache до www-data (33),
            # каталог /var/www/html принадлежит uid 33.
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
              add: ["CHOWN", "DAC_OVERRIDE", "FOWNER", "SETGID", "SETUID"]
            seccompProfile:
              type: RuntimeDefault
          resources:
            requests:
              cpu: 200m
              memory: 512Mi
            limits:
              cpu: "2"
              memory: 2Gi
          volumeMounts:
            - name: html
              mountPath: /var/www/html
      volumes:
        - name: html
          hostPath:
            path: /storage/apps/nextcloud/html
            type: Directory

apiVersion: v1
kind: Service
metadata:
  # Имя по общей схеме <app>-db. Хост в персистентном config.php Nextcloud
  # (dbhost) должен совпадать — правится через `occ config:system:set dbhost`.
  name: nextcloud-db
  namespace: default
spec:
  type: ClusterIP
  selector:
    app: nextcloud-db
  ports:
    - name: postgres
      port: 5432
      targetPort: postgres
      protocol: TCP

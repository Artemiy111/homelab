apiVersion: v1
kind: Service
metadata:
  # Имя по общей схеме <app>-redis. Хост в персистентном config.php Nextcloud
  # (redis.host) должен совпадать — правится через `occ config:system:set redis host`.
  name: nextcloud-redis
  namespace: default
spec:
  type: ClusterIP
  selector:
    app: nextcloud-redis
  ports:
    - name: redis
      port: 6379
      targetPort: redis
      protocol: TCP

apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: nextcloud
  namespace: nextcloud
spec:
  parentRefs:
    - name: homelab
      namespace: traefik
      sectionName: https
  hostnames:
    - nextcloud.biplane.v6.rocks
  rules:
    - backendRefs:
        - name: nextcloud
          port: 80

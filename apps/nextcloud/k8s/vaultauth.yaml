apiVersion: v1
kind: ServiceAccount
metadata:
  name: vso-nextcloud
  namespace: nextcloud
---
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultAuth
metadata:
  name: vso-nextcloud
  namespace: nextcloud
spec:
  vaultAuthGlobalRef:
    name: vso-global
    namespace: vault-secrets-operator
  kubernetes:
    role: nextcloud
    serviceAccount: vso-nextcloud

# SQLite чатов и загрузки open-webui: без backup target, поэтому longhorn-retain.
# RWO-том на одной ноде требует strategy.type: Recreate (см. deployment.yaml).
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: open-webui-data
  namespace: open-webui
spec:
  storageClassName: longhorn-retain
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      # Данные ~890 МБ; запас под историю чатов и вложения.
      storage: 1536Mi

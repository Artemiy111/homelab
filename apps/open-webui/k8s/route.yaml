apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: open-webui
  namespace: open-webui
spec:
  parentRefs:
    - name: homelab
      namespace: traefik
  hostnames:
    - ai.biplane.v6.rocks
    - ai.biplane.casa
  rules:
    - backendRefs:
        - name: open-webui
          port: 80

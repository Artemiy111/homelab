apiVersion: v1
kind: ServiceAccount
metadata:
  name: vso-open-webui
  namespace: open-webui
---
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultAuth
metadata:
  name: vso-open-webui
  namespace: open-webui
spec:
  vaultAuthGlobalRef:
    name: vso-global
    namespace: vault-secrets-operator
  kubernetes:
    role: open-webui
    serviceAccount: vso-open-webui

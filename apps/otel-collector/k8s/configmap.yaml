apiVersion: v1
kind: ConfigMap
metadata:
  name: otel-collector
  namespace: default
data:
  config.yaml: |
    receivers:
      otlp:
        protocols:
          grpc:
            endpoint: 0.0.0.0:4317
          http:
            endpoint: 0.0.0.0:4318

    exporters:
      prometheus:
        endpoint: 0.0.0.0:8889
        # Замена deprecated resource_to_telemetry_conversion: equivalent — included ["*"].
        resource_constant_labels:
          included: ["*"]

    processors:
      # RustFS отдаёт rustfs_scanner_directories_scanned_total дважды с одинаковыми
      # лейблами (похоже на баг его OTel-инструментации). prometheus-экспортёр из-за
      # этого на каждом сборе печатает ошибку со стектрейсом. Метрика малоценная —
      # дропаем до фикса в апстриме.
      filter/rustfs-dup:
        metrics:
          metric:
            - 'name == "rustfs_scanner_directories_scanned_total"'

    extensions:
      health_check:
        endpoint: 0.0.0.0:13133

    service:
      extensions: [health_check]
      pipelines:
        metrics:
          receivers: [otlp]
          processors: [filter/rustfs-dup]
          exporters: [prometheus]

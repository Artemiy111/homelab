apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: paperless
  namespace: paperless
spec:
  parentRefs:
    - name: homelab
      namespace: traefik
  hostnames:
    - paperless.biplane.v6.rocks
    - paperless.biplane.casa
  rules:
    - backendRefs:
        - name: paperless
          port: 80

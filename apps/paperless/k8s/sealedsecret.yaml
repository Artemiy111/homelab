# Секреты paperless: PAPERLESS_SECRET_KEY и пароль БД.
#
# Запечатано для namespace paperless: SealedSecret привязан к namespace и
# имени (scope strict), поэтому при переезде сервиса в свой namespace его
# обязательно перезапечатывать. Значения переиспользованы из прежнего
# Secret в default, поэтому после переключения старый надо удалить, чтобы не
# было двух источников правды.
---
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: paperless
  namespace: paperless
spec:
  encryptedData:
    PAPERLESS_SECRET_KEY: 
    POSTGRES_PASSWORD: 
  template:
    metadata:
      name: paperless
      namespace: paperless
    type: Opaque

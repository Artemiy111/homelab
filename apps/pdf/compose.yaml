name: pdf

services:
  stirling-pdf:
    image: docker.stirlingpdf.com/stirlingtools/stirling-pdf:2.14.3@sha256:3b3670fce70b396ec56ba380a3cc7858e0abf83fe13f31c88f7737847763a396
    container_name: stirling-pdf
    volumes:
      - ${APPS_STORAGE_PATH:-/storage/apps}/pdf/tessdata:/usr/share/tessdata:Z
      - ${APPS_STORAGE_PATH:-/storage/apps}/pdf/configs:/configs:Z
      - ${APPS_STORAGE_PATH:-/storage/apps}/pdf/logs:/logs:Z
      - ${APPS_STORAGE_PATH:-/storage/apps}/pdf/pipeline:/pipeline:Z
      - ${APPS_STORAGE_PATH:-/storage/apps}/pdf/customFiles:/customFiles:Z

    environment:
      DISABLE_ADDITIONAL_FEATURES: "false"
      SECURITY_ENABLELOGIN: "true"
      SECURITY_INITIALLOGIN_USERNAME: ${PDF_ADMIN_USERNAME:?set in apps/pdf secrets.enc.env}
      SECURITY_INITIALLOGIN_PASSWORD: ${PDF_ADMIN_PASSWORD:?set in apps/pdf secrets.enc.env}
      SYSTEM_DEFAULTLOCALE: ${DEFAULT_LOCALE}
      SYSTEM_FRONTENDURL: https://pdf.${DOMAIN}
      SYSTEM_GOOGLEVISIBILITY: "false"
      PUID: "1000"
      PGID: "1000"
      JAVA_CUSTOM_OPTS: "-Xmx640m"

    networks:
      - traefiknet
    restart: unless-stopped

    healthcheck:
      test: [ "CMD-SHELL", "curl -fsS http://127.0.0.1:8080/api/v1/info/status | grep -q '\"status\":\"UP\"'" ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

    labels:
      - traefik.enable=true
      - traefik.http.routers.stirling-pdf.rule=Host(`pdf.${DOMAIN}`)
      - traefik.http.routers.stirling-pdf.entrypoints=websecure
      - traefik.http.services.stirling-pdf.loadbalancer.server.port=8080
      - traefik.docker.network=traefiknet

    cap_add:
      - SETUID
      - SETGID
      - CHOWN
      - DAC_OVERRIDE
    cap_drop:
      - ALL
    mem_limit: 1280m
    mem_reservation: 896m
    security_opt:
      - no-new-privileges:true

networks:
  traefiknet:
    external: true

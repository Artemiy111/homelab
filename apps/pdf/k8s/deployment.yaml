apiVersion: apps/v1
kind: Deployment
metadata:
  name: stirlingpdf
  namespace: pdf
spec:
  replicas: 1
  selector:
    matchLabels:
      app: stirlingpdf
  # RWO-тома настроек: два пода при rolling update пишут в одни каталоги.
  strategy:
    type: Recreate
  revisionHistoryLimit: 2
  template:
    metadata:
      labels:
        app: stirlingpdf
    spec:
      containers:
        - name: stirlingpdf
          image: "docker.stirlingpdf.com/stirlingtools/stirling-pdf:2.14.3@sha256:3b3670fce70b396ec56ba380a3cc7858e0abf83fe13f31c88f7737847763a396"
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - configMapRef:
                name: homelab-config
          env:
            - name: PUID
              value: "1000"
            - name: PGID
              value: "1000"
            - name: DISABLE_ADDITIONAL_FEATURES
              value: "false"
            - name: SECURITY_ENABLELOGIN
              value: "true"
            - name: SECURITY_INITIALLOGIN_USERNAME
              valueFrom:
                secretKeyRef:
                  name: stirlingpdf
                  key: PDF_ADMIN_USERNAME
            - name: SECURITY_INITIALLOGIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: stirlingpdf
                  key: PDF_ADMIN_PASSWORD
            - name: DOMAIN
              valueFrom:
                configMapKeyRef:
                  name: homelab-config
                  key: DOMAIN
            - name: SYSTEM_DEFAULTLOCALE
              valueFrom:
                configMapKeyRef:
                  name: homelab-config
                  key: DEFAULT_LOCALE
            - name: SYSTEM_FRONTENDURL
              value: "https://pdf.$(DOMAIN)"
            - name: SYSTEM_GOOGLEVISIBILITY
              value: "false"
            - name: JAVA_CUSTOM_OPTS
              value: "-Xmx640m"
          resources:
            limits:
              cpu: 500m
              memory: 1280Mi
            requests:
              cpu: 10m
              memory: 896Mi
          volumeMounts:
            - name: tessdata
              mountPath: /usr/share/tessdata
            - name: configs
              mountPath: /configs
            - name: logs
              mountPath: /logs
            - name: pipeline
              mountPath: /pipeline
            - name: custom-files
              mountPath: /customFiles
          livenessProbe:
            exec:
              command: ["/bin/sh", "-c", "curl -fsS http://127.0.0.1:8080/api/v1/info/status | grep -q '\"status\":\"UP\"'"]
            timeoutSeconds: 10
            periodSeconds: 30
            failureThreshold: 3
          readinessProbe:
            exec:
              command: ["/bin/sh", "-c", "curl -fsS http://127.0.0.1:8080/api/v1/info/status | grep -q '\"status\":\"UP\"'"]
            timeoutSeconds: 10
            periodSeconds: 30
            failureThreshold: 3
          startupProbe:
            exec:
              command: ["/bin/sh", "-c", "curl -fsS http://127.0.0.1:8080/api/v1/info/status | grep -q '\"status\":\"UP\"'"]
            initialDelaySeconds: 10
            timeoutSeconds: 10
            periodSeconds: 10
            failureThreshold: 30
          imagePullPolicy: IfNotPresent
          # Образ стартует как root и через setpriv понижает права до uid 1000,
          # поэтому runAsUser/runAsNonRoot не задаются
          securityContext:
            capabilities:
              add: ["SETUID", "SETGID", "CHOWN", "DAC_OVERRIDE"]
              drop: ["ALL"]
            allowPrivilegeEscalation: false
            seccompProfile:
              type: RuntimeDefault
      volumes:
        - name: tessdata
          emptyDir: {}
        - name: configs
          persistentVolumeClaim:
            claimName: pdf-configs
        - name: logs
          emptyDir: {}
        - name: pipeline
          persistentVolumeClaim:
            claimName: pdf-pipeline
        - name: custom-files
          persistentVolumeClaim:
            claimName: pdf-custom-files
      # fsGroup даёт групповую запись в тома Longhorn для процессов под uid 1000.
      securityContext:
        fsGroup: 1000

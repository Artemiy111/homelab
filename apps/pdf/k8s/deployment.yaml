apiVersion: apps/v1
kind: Deployment
metadata:
  name: stirlingpdf
  namespace: pdf
spec:
  revisionHistoryLimit: 2
  replicas: 1
  selector:
    matchLabels:
      app: stirlingpdf
  template:
    metadata:
      labels:
        app: stirlingpdf
    spec:
      containers:
        - name: stirlingpdf
          image: "docker.stirlingpdf.com/stirlingtools/stirling-pdf:2.14.3@sha256:3b3670fce70b396ec56ba380a3cc7858e0abf83fe13f31c88f7737847763a396"
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
              name: http
          envFrom:
            - configMapRef:
                name: homelab-config
          env:
            - name: PUID
              value: "1000"
            - name: PGID
              value: "1000"
            - name: DISABLE_ADDITIONAL_FEATURES
              value: "false"
            - name: SECURITY_ENABLELOGIN
              value: "true"
            - name: SECURITY_INITIALLOGIN_USERNAME
              valueFrom:
                secretKeyRef:
                  name: stirlingpdf
                  key: PDF_ADMIN_USERNAME
            - name: SECURITY_INITIALLOGIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: stirlingpdf
                  key: PDF_ADMIN_PASSWORD
            - name: DOMAIN
              valueFrom:
                configMapKeyRef:
                  name: homelab-config
                  key: DOMAIN
            - name: SYSTEM_DEFAULTLOCALE
              valueFrom:
                configMapKeyRef:
                  name: homelab-config
                  key: DEFAULT_LOCALE
            - name: SYSTEM_FRONTENDURL
              value: "https://pdf.$(DOMAIN)"
            - name: SYSTEM_GOOGLEVISIBILITY
              value: "false"
            - name: JAVA_CUSTOM_OPTS
              value: "-Xmx640m"
          startupProbe:
            exec:
              command: ["/bin/sh", "-c", "curl -fsS http://127.0.0.1:8080/api/v1/info/status | grep -q '\"status\":\"UP\"'"]
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 10
            failureThreshold: 30
          livenessProbe:
            exec:
              command: ["/bin/sh", "-c", "curl -fsS http://127.0.0.1:8080/api/v1/info/status | grep -q '\"status\":\"UP\"'"]
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 3
          readinessProbe:
            exec:
              command: ["/bin/sh", "-c", "curl -fsS http://127.0.0.1:8080/api/v1/info/status | grep -q '\"status\":\"UP\"'"]
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 3
          # Образ стартует как root и через setpriv понижает права до uid 1000,
          # поэтому runAsUser/runAsNonRoot не задаются
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
              add: ["SETUID", "SETGID", "CHOWN", "DAC_OVERRIDE"]
            seccompProfile:
              type: RuntimeDefault
          resources:
            requests:
              cpu: 10m
              memory: 896Mi
            limits:
              cpu: 500m
              memory: 1280Mi
          volumeMounts:
            - name: tessdata
              mountPath: /usr/share/tessdata
            - name: configs
              mountPath: /configs
            - name: logs
              mountPath: /logs
            - name: pipeline
              mountPath: /pipeline
            - name: custom-files
              mountPath: /customFiles
      volumes:
        - name: tessdata
          hostPath:
            path: /storage/apps/pdf/tessdata
            type: Directory
        - name: configs
          hostPath:
            path: /storage/apps/pdf/configs
            type: Directory
        - name: logs
          hostPath:
            path: /storage/apps/pdf/logs
            type: Directory
        - name: pipeline
          hostPath:
            path: /storage/apps/pdf/pipeline
            type: Directory
        - name: custom-files
          hostPath:
            path: /storage/apps/pdf/customFiles
            type: Directory

name: postgres

services:
  db:
    image: postgres:18.4-alpine@sha256:9a8afca54e7861fd90fab5fdf4c42477a6b1cb7d293595148e674e0a3181de15
    container_name: postgres-db

    volumes:
      - ${APPS_STORAGE_PATH:-/storage/apps}/postgres/data:/var/lib/postgresql:Z

    environment:
      POSTGRES_DB: ${POSTGRES_DB:-playground}
      POSTGRES_USER: ${POSTGRES_USER:-playground}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set in postgres/.env}

    networks:
      - backend
    restart: unless-stopped

    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}" ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 15s

    shm_size: 256mb

    security_opt:
      - no-new-privileges:true

  pgweb:
    image: ghcr.io/sosedoff/pgweb:0.17.0@sha256:a5256d416e2e8b92d69a4459058e3eca33a9f075d8325491644411d0bc3bd70b
    container_name: postgres-pgweb

    depends_on:
      db:
        condition: service_healthy

    environment:
      PGWEB_DATABASE_URL: postgres://${POSTGRES_USER:-playground}:${POSTGRES_PASSWORD:?set in postgres/.env}@db:5432/${POSTGRES_DB:-playground}?sslmode=disable
      PGWEB_AUTH_USER: ${PGWEB_AUTH_USER:-pgweb}
      PGWEB_AUTH_PASS: ${PGWEB_AUTH_PASS:?set in postgres/.env}
      PGWEB_LOCK_SESSION: "true"

    networks:
      - backend
      - traefiknet
    restart: unless-stopped

    healthcheck:
      test: [ "CMD", "nc", "-z", "127.0.0.1", "8081" ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

    labels:
      - traefik.enable=true
      - traefik.http.routers.postgres-pgweb.rule=Host(`postgres.${DOMAIN}`)
      - traefik.http.routers.postgres-pgweb.entrypoints=websecure
      - traefik.http.routers.postgres-pgweb.middlewares=secure-headers@file,ratelimit-default@file
      - traefik.http.services.postgres-pgweb.loadbalancer.server.port=8081
      - traefik.docker.network=traefiknet

    cap_drop:
      - ALL
    read_only: true
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:mode=1777

networks:
  backend:
    internal: true
  traefiknet:
    external: true

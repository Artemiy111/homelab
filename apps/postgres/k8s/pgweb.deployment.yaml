apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres-pgweb
  namespace: postgres
spec:
  replicas: 1
  selector:
    matchLabels:
      app: postgres-pgweb
  template:
    metadata:
      labels:
        app: postgres-pgweb
    spec:
      initContainers:
        # pgweb падает с exit 1, если БД ещё не готова (в compose это
        # depends_on: service_healthy).
        - name: wait-for-db
          image: "postgres:18.4-alpine@sha256:9a8afca54e7861fd90fab5fdf4c42477a6b1cb7d293595148e674e0a3181de15"
          command: ["/bin/sh", "-c", "until pg_isready -h shared-rw.databases.svc.cluster.local -p 5432 -U playground; do echo waiting for shared-rw; sleep 2; done"]
          resources:
            limits:
              cpu: 100m
              memory: 64Mi
            requests:
              cpu: 10m
              memory: 32Mi
          securityContext:
            capabilities:
              drop: ["ALL"]
            allowPrivilegeEscalation: false
            runAsGroup: 70
            runAsNonRoot: true
            runAsUser: 70
            seccompProfile:
              type: RuntimeDefault
      containers:
        - name: pgweb
          image: "ghcr.io/sosedoff/pgweb:0.17.0@sha256:a5256d416e2e8b92d69a4459058e3eca33a9f075d8325491644411d0bc3bd70b"
          ports:
            - name: http
              containerPort: 8081
          env:
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres
                  key: POSTGRES_PASSWORD
            - name: PGWEB_AUTH_PASS
              valueFrom:
                secretKeyRef:
                  name: postgres
                  key: PGWEB_AUTH_PASS
            - name: PGWEB_DATABASE_URL
              value: "postgres://playground:$(POSTGRES_PASSWORD)@shared-rw.databases.svc.cluster.local:5432/playground?sslmode=disable"
            - name: PGWEB_AUTH_USER
              value: pgweb
            - name: PGWEB_LOCK_SESSION
              value: "true"
          resources:
            limits:
              cpu: 200m
              memory: 128Mi
            requests:
              cpu: 10m
              memory: 32Mi
          volumeMounts:
            - name: tmp
              mountPath: /tmp
          livenessProbe:
            tcpSocket:
              port: http
            periodSeconds: 30
          readinessProbe:
            tcpSocket:
              port: http
            periodSeconds: 15
          startupProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
            failureThreshold: 12
          securityContext:
            capabilities:
              drop: ["ALL"]
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            seccompProfile:
              type: RuntimeDefault
      volumes:
        - name: tmp
          emptyDir: {}
  strategy:
    type: Recreate
  revisionHistoryLimit: 2

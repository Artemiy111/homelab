apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres-pgweb
  namespace: default
spec:
  strategy:
    type: Recreate
  revisionHistoryLimit: 2
  replicas: 1
  selector:
    matchLabels:
      app: postgres-pgweb
  template:
    metadata:
      labels:
        app: postgres-pgweb
    spec:
      containers:
        - name: pgweb
          image: "ghcr.io/sosedoff/pgweb@sha256:a5256d416e2e8b92d69a4459058e3eca33a9f075d8325491644411d0bc3bd70b"
          ports:
            - name: http
              containerPort: 8081
          env:
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres
                  key: POSTGRES_PASSWORD
            - name: PGWEB_AUTH_PASS
              valueFrom:
                secretKeyRef:
                  name: postgres
                  key: PGWEB_AUTH_PASS
            - name: PGWEB_DATABASE_URL
              value: "postgres://playground:$(POSTGRES_PASSWORD)@postgres-db:5432/playground?sslmode=disable"
            - name: PGWEB_AUTH_USER
              value: pgweb
            - name: PGWEB_LOCK_SESSION
              value: "true"
          startupProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
            failureThreshold: 12
          livenessProbe:
            tcpSocket:
              port: http
            periodSeconds: 30
          readinessProbe:
            tcpSocket:
              port: http
            periodSeconds: 15
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
            seccompProfile:
              type: RuntimeDefault
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 200m
              memory: 128Mi
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}

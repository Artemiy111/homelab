apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: postgres
  namespace: postgres
spec:
  parentRefs:
    - name: homelab
      namespace: traefik
  hostnames:
    - postgres.biplane.v6.rocks
    - postgres.biplane.casa
  rules:
    - backendRefs:
        - name: postgres-pgweb
          port: 80

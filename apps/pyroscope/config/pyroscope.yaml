target: all

server:
  http_listen_port: 4040
  grpc_listen_port: 9095
  log_level: info

storage:
  backend: filesystem
  filesystem:
    dir: /var/lib/pyroscope

# Небо диска: 0 — данные не удаляются никогда. Неделя — как и у трейсов в
# Tempo (backend_scheduler...block_retention 168h).
limits:
  retention_period: 168h

analytics:
  reporting_enabled: false

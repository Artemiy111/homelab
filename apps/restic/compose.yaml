name: restic

x-restic: &restic
  image: restic/restic:0.19.1
  hostname: homelab
  environment:
    RESTIC_PASSWORD: ${RESTIC_PASSWORD:?set in apps/restic secrets.enc.env}
    RESTIC_REPOSITORY: /repository
    RESTIC_CACHE_DIR: /cache
    RESTIC_HOST: homelab
    NICE: "19"
    IONICE_CLASS: "2"
  volumes:
    - ${BACKUP_SOURCE:-${APPS_STORAGE_PATH:-/storage/apps}}:/data:ro
    - ${CONFIG_SOURCE:-/home/artlab/projects/homelab}:/config:ro
    - ${RESTIC_REPOSITORY_PATH:-/storage/backups/restic}:/repository
    - ${APPS_STORAGE_PATH:-/storage/apps}/restic/cache:/cache
    - ${APPS_STORAGE_PATH:-/storage/apps}/restic/restore:/restore
    - ./excludes.txt:/etc/restic/excludes.txt:ro
  security_opt:
    - label=disable
  profiles:
    - manual

services:
  init:
    container_name: restic-init

    command: init
    <<: *restic

  backup:
    container_name: restic-backup

    command:
      - backup
      - /data
      - /config
      - --exclude-file=/etc/restic/excludes.txt
      - --tag=homelab
    <<: *restic

  snapshots:
    container_name: restic-snapshots

    command: snapshots
    <<: *restic

  forget:
    container_name: restic-forget

    command:
      - forget
      - --keep-daily=7
      - --keep-weekly=4
      - --keep-monthly=6
      - --prune
    <<: *restic

  check:
    container_name: restic-check

    command: check
    <<: *restic

  restore:
    container_name: restic-restore

    command:
      - restore
      - latest
      - --target=/restore
    <<: *restic

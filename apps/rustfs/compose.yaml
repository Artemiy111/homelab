name: rustfs

services:
  rustfs:
    image: rustfs/rustfs:1.0.0-beta.12@sha256:41fe89380f4120a337790c02af192c3fe7bb55c3edc2e6e9357b487b47c6ab21
    container_name: rustfs

    volumes:
      - ${APPS_STORAGE_PATH:-/storage/apps}/rustfs/data:/data:Z

    environment:
      TZ: ${TZ:?set in root config.env}
      RUSTFS_VOLUMES: /data
      RUSTFS_ADDRESS: 0.0.0.0:9000
      RUSTFS_CONSOLE_ADDRESS: 0.0.0.0:9001
      RUSTFS_CONSOLE_ENABLE: "true"
      # Консоль (origin rustfs.${DOMAIN}) ходит из браузера на S3 API
      # (s3.${DOMAIN}) — без этого health-check в /config блокирует CORS.
      RUSTFS_CORS_ALLOWED_ORIGINS: https://rustfs.${DOMAIN}
      RUSTFS_CONSOLE_CORS_ALLOWED_ORIGINS: https://rustfs.${DOMAIN}
      RUSTFS_ACCESS_KEY: ${RUSTFS_ACCESS_KEY:?set in apps/rustfs secrets.enc.env}
      RUSTFS_SECRET_KEY: ${RUSTFS_SECRET_KEY:?set in apps/rustfs secrets.enc.env}

    networks:
      - traefiknet
    restart: unless-stopped

    healthcheck:
      test: [ "CMD", "curl", "-fsS", "http://127.0.0.1:9000/health" ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

    labels:
      - traefik.enable=true
      # S3 API на собственном хосте.
      - traefik.http.routers.s3.rule=Host(`s3.${DOMAIN}`)
      - traefik.http.routers.s3.entrypoints=websecure
      - traefik.http.routers.s3.service=s3
      - traefik.http.services.s3.loadbalancer.server.port=9000
      # Консоль: только её base path.
      - traefik.http.routers.rustfs-console.rule=Host(`rustfs.${DOMAIN}`) && PathPrefix(`/rustfs/console`)
      - traefik.http.routers.rustfs-console.entrypoints=websecure
      - traefik.http.routers.rustfs-console.service=rustfs-console
      - traefik.http.routers.rustfs-console.priority=100
      - traefik.http.services.rustfs-console.loadbalancer.server.port=9001
      # Подписанные S3-запросы браузерной консоли к её же хосту уходят на API:
      # redirect или другой path ломают SigV4-подпись (SignatureDoesNotMatch).
      - traefik.http.routers.rustfs-s3-signed.rule=Host(`rustfs.${DOMAIN}`) && HeaderRegexp(`Authorization`,`^AWS4-HMAC-SHA256`)
      - traefik.http.routers.rustfs-s3-signed.entrypoints=websecure
      - traefik.http.routers.rustfs-s3-signed.service=s3
      - traefik.http.routers.rustfs-s3-signed.priority=110
      # Корень хоста консоли — редирект на UI для людей (низший приоритет).
      - traefik.http.routers.rustfs-root.rule=Host(`rustfs.${DOMAIN}`)
      - traefik.http.routers.rustfs-root.entrypoints=websecure
      - traefik.http.routers.rustfs-root.service=s3
      - traefik.http.routers.rustfs-root.middlewares=rustfs-root-redirect
      - traefik.http.routers.rustfs-root.priority=1
      - traefik.http.middlewares.rustfs-root-redirect.redirectregex.permanent=true
      - traefik.http.middlewares.rustfs-root-redirect.redirectregex.regex=^https://rustfs\.${DOMAIN}/$$
      - traefik.http.middlewares.rustfs-root-redirect.redirectregex.replacement=https://rustfs.${DOMAIN}/rustfs/console/
      - traefik.docker.network=traefiknet
    # Образ по умолчанию работает под uid 10001; запускаем под artlab,
    # чтобы писать в bind mount без chown под root (как jellyfin/navidrome).
    user: "1000:1000"

    security_opt:
      - no-new-privileges:true

networks:
  traefiknet:
    external: true

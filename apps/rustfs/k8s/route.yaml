apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: rustfs
  namespace: rustfs
spec:
  parentRefs:
    - name: homelab
      namespace: traefik
      sectionName: https
  hostnames:
    - rustfs.biplane.v6.rocks
    - s3.biplane.v6.rocks
  rules:
    # Подписанные S3-запросы браузерной консоли к её же хосту уходят на API:
    # redirect или другой path ломают SigV4-подпись (SignatureDoesNotMatch).
    # Traefik-овский HeaderRegexp становится нативным match по заголовку.
    - matches:
        - headers:
            - name: Authorization
              type: RegularExpression
              value: "^AWS4-HMAC-SHA256"
      backendRefs:
        - name: rustfs
          port: 80
    # API консоли: `/rustfs/admin/v3`, базовый URL зашит в её собранный JS
    # (`${host}/rustfs/admin/v3`). Логин — подписанный SigV4 POST сюда; его
    # перехватывает правило по заголовку `Authorization` выше, а явный префикс
    # нужен, чтобы маршрут не зависел от заголовка. Апстрим про потерю
    # префикса за reverse-proxy: rustfs/rustfs#2433.
    - matches:
        - path:
            type: PathPrefix
            value: /rustfs/admin
      backendRefs:
        - name: rustfs
          port: 9001
    # Консоль: только её base path.
    - matches:
        - path:
            type: PathPrefix
            value: /rustfs/console
      backendRefs:
        - name: rustfs
          port: 9001
    # Корень хоста консоли — редирект на UI для людей, но только для GET.
    # Редирект на POST ломает вход: консоль шлёт подписанный SigV4-запрос на
    # `/rustfs/admin/v3/login`, и если он уходит в редирект, подпись перестаёт
    # сходиться — бэкенд отвечает `Signature is required`, а консоль показывает
    # «неверные креды». Правило по заголовку `Authorization` выше этот редирект
    # не спасает: в Gateway API `Exact`-путь считается более специфичным, чем
    # match по заголовку, и выигрывает приоритетом. Проверено: подписанный POST
    # на `/` с телом получает 308.
    #
    # Метод задан явно, поэтому остальные (POST, HEAD) проваливаются в
    # catch-all и уходят в S3 API, где подпись проверяется как надо.
    - matches:
        - path:
            type: Exact
            value: /
          method: GET
      filters:
        - type: ExtensionRef
          extensionRef:
            group: traefik.io
            kind: Middleware
            name: rustfs-root-redirect
      backendRefs:
        - name: rustfs
          port: 80
    - backendRefs:
        - name: rustfs
          port: 80

apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: rustfs
  namespace: rustfs
spec:
  parentRefs:
    - name: homelab
      namespace: traefik
      sectionName: https
  hostnames:
    - rustfs.biplane.v6.rocks
    - s3.biplane.v6.rocks
  rules:
    # Подписанные S3-запросы браузерной консоли к её же хосту уходят на API:
    # redirect или другой path ломают SigV4-подпись (SignatureDoesNotMatch).
    # Traefik-овский HeaderRegexp становится нативным match по заголовку.
    - matches:
        - headers:
            - name: Authorization
              type: RegularExpression
              value: "^AWS4-HMAC-SHA256"
      backendRefs:
        - name: rustfs
          port: 80
    # API консоли: `/rustfs/admin/v3`. Правило обязано идти до PathPrefix
    # `/rustfs/console` — иначе запрос логина (обычный POST без заголовка
    # Authorization) проваливается в catch-all ниже и уходит на S3 API, где
    # отвечает 403, а консоль сообщает «неверные креды». Базовый URL зашит в
    # собранный JS консоли: `${host}/rustfs/admin/v3`. Апстрим это знает:
    # rustfs/rustfs#2433 (console за reverse-proxy subpath теряет префикс).
    - matches:
        - path:
            type: PathPrefix
            value: /rustfs/admin
      backendRefs:
        - name: rustfs
          port: 9001
    # Консоль: только её base path.
    - matches:
        - path:
            type: PathPrefix
            value: /rustfs/console
      backendRefs:
        - name: rustfs
          port: 9001
    # Корень хоста консоли — редирект на UI для людей. Точное совпадение
    # выигрывает у префиксов выше, поэтому отдельное правило не нужно.
    - matches:
        - path:
            type: Exact
            value: /
      filters:
        - type: ExtensionRef
          extensionRef:
            group: traefik.io
            kind: Middleware
            name: rustfs-root-redirect
      backendRefs:
        - name: rustfs
          port: 80
    - backendRefs:
        - name: rustfs
          port: 80

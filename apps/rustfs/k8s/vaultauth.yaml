apiVersion: v1
kind: ServiceAccount
metadata:
  name: vso-rustfs
  namespace: rustfs
---
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultAuth
metadata:
  name: vso-rustfs
  namespace: rustfs
spec:
  vaultAuthGlobalRef:
    name: vso-global
    namespace: vault-secrets-operator
  kubernetes:
    role: rustfs
    serviceAccount: vso-rustfs

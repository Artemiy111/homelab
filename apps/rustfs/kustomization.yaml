apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: rustfs
resources:
  - k8s/namespace.yaml
  - k8s/sealedsecret.yaml
  - k8s/service.yaml
  - k8s/deployment.yaml
  - k8s/data.pvc.yaml
  - k8s/networkpolicy.yaml
  - k8s/mirror-sync.cronjob.yaml
configMapGenerator:
  # Скрипт синка и манифест артефактов. CronJob ссылается на имя `mirror-sync`,
  # kustomize подставляет хэш контента — правка файлов пересоздаёт ConfigMap и
  # перезапускает Job (ссылка в CronJob переписывается автоматически).
  - name: mirror-sync
    files:
      - mirror-sync.sh
      - artifacts.tsv

name: seafile

services:
  db:
    image: mariadb:10.11
    container_name: seafile-db

    volumes:
      - ${APPS_STORAGE_PATH:-/storage/apps}/seafile/mysql:/var/lib/mysql:Z

    environment:
      MARIADB_ROOT_PASSWORD: ${INIT_SEAFILE_MYSQL_ROOT_PASSWORD:?set in apps/seafile secrets.enc.env}
      MARIADB_AUTO_UPGRADE: "1"
      MARIADB_INITDB_SKIP_TZINFO: "1"

    networks:
      - backend
    restart: unless-stopped

    healthcheck:
      test: ["CMD-SHELL", "mariadb-admin ping -h 127.0.0.1 -u root -p\"$${MARIADB_ROOT_PASSWORD}\" --silent"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 30s

    security_opt:
      - no-new-privileges:true

  redis:
    image: valkey/valkey:9-alpine
    container_name: seafile-redis

    networks:
      - backend
    command: valkey-server --save "" --appendonly no
    restart: unless-stopped

    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

    security_opt:
      - no-new-privileges:true

  seafile:
    image: seafileltd/seafile-mc:${SEAFILE_VERSION:-13.0.25}
    container_name: seafile

    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

    volumes:
      - ${APPS_STORAGE_PATH:-/storage/apps}/seafile/shared:/shared:Z
      - ./seahub_onlyoffice.py:/shared/seafile/conf/seahub_onlyoffice.py:ro
      - ./seahub_oauth.py:/shared/seafile/conf/seahub_oauth.py:ro

    environment:
      SEAFILE_SERVER_HOSTNAME: seafile.${DOMAIN:?set in root config.env}
      SEAFILE_SERVER_PROTOCOL: ${SEAFILE_SERVER_PROTOCOL:-https}
      TIME_ZONE: ${TZ:-Asia/Yekaterinburg}
      INIT_SEAFILE_ADMIN_EMAIL: admin@${DOMAIN:?set in root config.env}
      INIT_SEAFILE_ADMIN_PASSWORD: ${INIT_SEAFILE_ADMIN_PASSWORD:?set in apps/seafile secrets.enc.env}
      INIT_SEAFILE_MYSQL_ROOT_PASSWORD: ${INIT_SEAFILE_MYSQL_ROOT_PASSWORD:?set in apps/seafile secrets.enc.env}
      SEAFILE_MYSQL_DB_HOST: ${SEAFILE_MYSQL_DB_HOST:-db}
      SEAFILE_MYSQL_DB_PORT: ${SEAFILE_MYSQL_DB_PORT:-3306}
      SEAFILE_MYSQL_DB_USER: ${SEAFILE_MYSQL_DB_USER:-seafile}
      SEAFILE_MYSQL_DB_PASSWORD: ${SEAFILE_MYSQL_DB_PASSWORD:?set in apps/seafile secrets.enc.env}
      SEAFILE_MYSQL_DB_CCNET_DB_NAME: ${SEAFILE_MYSQL_DB_CCNET_DB_NAME:-ccnet_db}
      SEAFILE_MYSQL_DB_SEAFILE_DB_NAME: ${SEAFILE_MYSQL_DB_SEAFILE_DB_NAME:-seafile_db}
      SEAFILE_MYSQL_DB_SEAHUB_DB_NAME: ${SEAFILE_MYSQL_DB_SEAHUB_DB_NAME:-seahub_db}
      JWT_PRIVATE_KEY: ${JWT_PRIVATE_KEY:?set in apps/seafile secrets.enc.env}
      CACHE_PROVIDER: ${CACHE_PROVIDER:-redis}
      REDIS_HOST: ${REDIS_HOST:-redis}
      REDIS_PORT: ${REDIS_PORT:-6379}
      ENABLE_ONLYOFFICE: ${ENABLE_ONLYOFFICE:-true}
      ONLYOFFICE_HOST: onlyoffice.${DOMAIN:?set in root config.env}
      ONLYOFFICE_APIJS_URL: https://onlyoffice.${DOMAIN:?set in root config.env}/web-apps/apps/api/documents/api.js
      ONLYOFFICE_JWT_HEADER: ${ONLYOFFICE_JWT_HEADER:-Authorization}
      ONLYOFFICE_JWT_SECRET: ${ONLYOFFICE_JWT_SECRET:?set in apps/seafile secrets.enc.env}
      DOMAIN: ${DOMAIN:?set in root config.env}
      ZITADEL_OAUTH_CLIENT_ID: ${ZITADEL_OAUTH_CLIENT_ID:?set in apps/seafile secrets.enc.env}
      ZITADEL_OAUTH_CLIENT_SECRET: ${ZITADEL_OAUTH_CLIENT_SECRET:?set in apps/seafile secrets.enc.env}

    networks:
      backend:
      traefiknet:
        aliases:
          - seafile
    restart: unless-stopped

    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1/api2/ping/ | grep -q pong"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 5m

    labels:
      - traefik.enable=true
      - traefik.http.routers.seafile.rule=Host(`seafile.${DOMAIN:?set in root config.env}`)
      - traefik.http.routers.seafile.entrypoints=websecure
      - traefik.http.services.seafile.loadbalancer.server.port=80
      - traefik.docker.network=traefiknet

    init: true

    security_opt:
      - no-new-privileges:true

  onlyoffice:
    image: onlyoffice/documentserver:${ONLYOFFICE_VERSION:-9.3.0}
    container_name: seafile-onlyoffice

    volumes:
      - ${APPS_STORAGE_PATH:-/storage/apps}/seafile/onlyoffice/logs:/var/log/onlyoffice:Z
      - ${APPS_STORAGE_PATH:-/storage/apps}/seafile/onlyoffice/data:/var/www/onlyoffice/Data:Z
      - ${APPS_STORAGE_PATH:-/storage/apps}/seafile/onlyoffice/lib:/var/lib/onlyoffice:Z

    environment:
      JWT_ENABLED: "true"
      JWT_SECRET: ${ONLYOFFICE_JWT_SECRET:?set in apps/seafile secrets.enc.env}
      JWT_HEADER: ${ONLYOFFICE_JWT_HEADER:-Authorization}
      JWT_IN_BODY: "true"
      # Seafile resolves to the homelab's private LAN address.
      ALLOW_PRIVATE_IP_ADDRESS: "true"

    networks:
      backend:
      traefiknet:
        aliases:
          - onlyoffice
    restart: unless-stopped

    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1/healthcheck | grep -q true"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 3m

    labels:
      - traefik.enable=true
      - traefik.http.routers.onlyoffice.rule=Host(`onlyoffice.${DOMAIN:?set in root config.env}`)
      - traefik.http.routers.onlyoffice.entrypoints=websecure
      - traefik.http.routers.onlyoffice.middlewares=onlyoffice-xfp@docker
      # Traefik не выставляет X-Forwarded-Proto на websocket-upgrade запросах,
      # и DocumentServer строит ссылки на документ с http:// — браузер блокирует
      # их как mixed content («Загрузка не удалась»).
      - traefik.http.middlewares.onlyoffice-xfp.headers.customrequestheaders.X-Forwarded-Proto=https
      - traefik.http.services.onlyoffice.loadbalancer.server.port=80
      - traefik.docker.network=traefiknet

    init: true

    security_opt:
      - no-new-privileges:true

  backup-db:
    image: mariadb:10.11
    container_name: seafile-backup-db

    depends_on:
      db:
        condition: service_healthy

    volumes:
      - ${APPS_STORAGE_PATH:-/storage/apps}/seafile/backups:/backups:Z

    environment:
      MYSQL_PWD: ${INIT_SEAFILE_MYSQL_ROOT_PASSWORD:?set in apps/seafile secrets.enc.env}

    networks:
      - backend

    command:
      - >-
        umask 077; mariadb-dump --host=db --user=root
        --all-databases --single-transaction --routines --events
        > /backups/seafile.sql.tmp && mv /backups/seafile.sql.tmp /backups/seafile.sql

    entrypoint:
      - /bin/sh
      - -ec
    restart: "no"

    profiles:
      - tools

networks:
  backend:
    internal: true
  traefiknet:
    external: true

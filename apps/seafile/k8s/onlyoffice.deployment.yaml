apiVersion: apps/v1
kind: Deployment
metadata:
  name: onlyoffice
  namespace: seafile
spec:
  replicas: 1
  selector:
    matchLabels:
      app: onlyoffice
  template:
    metadata:
      labels:
        app: onlyoffice
    spec:
      # Иначе Service `db` (nextcloud) инжектит DB_PORT=tcp://…:5432, и
      # entrypoint OnlyOffice падает на `nc -z`.
      enableServiceLinks: false
      containers:
        - name: onlyoffice
          image: "onlyoffice/documentserver:9.3.0@sha256:87f7dc0836124b4732e690af626114069643a2b76b916d7dfd5f55b8f3e3c88f"
          ports:
            - name: http
              containerPort: 80
          env:
            - name: JWT_ENABLED
              value: "true"
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: seafile
                  key: ONLYOFFICE_JWT_SECRET
            - name: JWT_HEADER
              value: Authorization
            - name: JWT_IN_BODY
              value: "true"
            - name: ALLOW_PRIVATE_IP_ADDRESS
              value: "true"
          resources:
            limits:
              cpu: "2"
              memory: 2Gi
            requests:
              cpu: 200m
              memory: 512Mi
          volumeMounts:
            - name: logs
              mountPath: /var/log/onlyoffice
            - name: data
              mountPath: /var/www/onlyoffice/Data
            - name: lib
              mountPath: /var/lib/onlyoffice
          livenessProbe:
            httpGet:
              path: /healthcheck
              port: http
            timeoutSeconds: 10
            periodSeconds: 60
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /healthcheck
              port: http
            timeoutSeconds: 10
            periodSeconds: 30
            failureThreshold: 3
          startupProbe:
            httpGet:
              path: /healthcheck
              port: http
            initialDelaySeconds: 30
            periodSeconds: 15
            failureThreshold: 30
          securityContext:
            capabilities:
              add: ["CHOWN", "DAC_OVERRIDE", "FOWNER", "SETGID", "SETUID"]
              drop: ["ALL"]
            allowPrivilegeEscalation: false
            seccompProfile:
              type: RuntimeDefault
      volumes:
        - name: logs
          emptyDir: {}
        - name: data
          persistentVolumeClaim:
            claimName: seafile-onlyoffice-data
        - name: lib
          persistentVolumeClaim:
            claimName: seafile-onlyoffice-lib
  # RWO-тома: два пода при rolling update пишут в одни каталоги.
  strategy:
    type: Recreate
  revisionHistoryLimit: 2

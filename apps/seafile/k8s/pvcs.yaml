# Данные Seafile и OnlyOffice: без backup target, поэтому longhorn-retain.
# RWO-тома на одной ноде требуют strategy.type: Recreate (см.
# seafile.deployment.yaml и onlyoffice.deployment.yaml).
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: seafile-shared
  namespace: seafile
spec:
  storageClassName: longhorn-retain
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      # Блоки данных и метаданные ~11 МБ; запас под рост библиотеки.
      storage: 64Mi
---
# Данные OnlyOffice (~12 КБ).
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: seafile-onlyoffice-data
  namespace: seafile
spec:
  storageClassName: longhorn-retain
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 64Mi
---
# Библиотеки OnlyOffice (~256 КБ).
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: seafile-onlyoffice-lib
  namespace: seafile
spec:
  storageClassName: longhorn-retain
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 64Mi

apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: seafile
  namespace: seafile
spec:
  parentRefs:
    - name: homelab
      namespace: traefik
      sectionName: https
  hostnames:
    - seafile.biplane.v6.rocks
  rules:
    - backendRefs:
        - name: seafile
          port: 80

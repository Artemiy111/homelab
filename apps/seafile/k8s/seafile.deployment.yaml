apiVersion: apps/v1
kind: Deployment
metadata:
  name: seafile
  namespace: seafile
spec:
  replicas: 1
  selector:
    matchLabels:
      app: seafile
  # RWO-том /shared: два пода при rolling update пишут в один каталог.
  strategy:
    type: Recreate
  revisionHistoryLimit: 2
  template:
    metadata:
      labels:
        app: seafile
    spec:
      enableServiceLinks: false
      initContainers:
        - name: wait-for-db
          image: "mariadb:10.11@sha256:8020e05c4c498d06c87f0a1db010eb79bd6f8fb30e9b763d4690c34ce1e61008"
          command: ["/bin/sh", "-c", "until mariadb-admin ping -h seafile-mariadb -P 3306 --silent; do echo waiting for seafile-mariadb; sleep 3; done"]
          resources:
            limits:
              cpu: 100m
              memory: 64Mi
            requests:
              cpu: 10m
              memory: 32Mi
          securityContext:
            capabilities:
              drop: ["ALL"]
            allowPrivilegeEscalation: false
            runAsGroup: 999
            runAsNonRoot: true
            runAsUser: 999
            seccompProfile:
              type: RuntimeDefault
        - name: wait-for-redis
          image: "valkey/valkey:9-alpine@sha256:ee91f7a174ac4d6a6b0685b3a60e321f0a9dbbb691f9b0e285be2ba1d1be8328"
          command: ["/bin/sh", "-c", "until valkey-cli -h seafile-redis ping | grep -q PONG; do echo waiting for seafile-redis; sleep 2; done"]
          resources:
            limits:
              cpu: 100m
              memory: 64Mi
            requests:
              cpu: 10m
              memory: 32Mi
          securityContext:
            capabilities:
              drop: ["ALL"]
            allowPrivilegeEscalation: false
            runAsGroup: 999
            runAsNonRoot: true
            runAsUser: 999
            seccompProfile:
              type: RuntimeDefault
      containers:
        - name: seafile
          image: "seafileltd/seafile-mc:13.0.25@sha256:90c1aaa08731116750cd7ce16cbc6afe0c26006433002d3c7215a5f4254ec244"
          # Обёртка вокруг оригинального entrypoint образа: сначала подготовка
          # seahub (настройки + патчи), затем exec исходного init-процесса
          # (`my_init -- /scripts/enterpoint.sh` с PID1). Так патчи применяются
          # до старта seahub; init-контейнером это не сделать — код seahub лежит
          # в слое образа, а не на общем томе.
          command:
            - /bin/sh
            - -c
            - /bin/sh /prepare-seahub.sh && exec /usr/bin/python3 -u /sbin/my_init -- /scripts/enterpoint.sh
          args: []
          ports:
            - name: http
              containerPort: 80
          env:
            - name: DOMAIN
              valueFrom:
                configMapKeyRef:
                  name: homelab-config
                  key: DOMAIN
            - name: TIME_ZONE
              valueFrom:
                configMapKeyRef:
                  name: homelab-config
                  key: TZ
            - name: SEAFILE_MYSQL_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: seafile
                  key: SEAFILE_MYSQL_DB_PASSWORD
            - name: JWT_PRIVATE_KEY
              valueFrom:
                secretKeyRef:
                  name: seafile
                  key: JWT_PRIVATE_KEY
            - name: ONLYOFFICE_JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: seafile
                  key: ONLYOFFICE_JWT_SECRET
            - name: ZITADEL_OAUTH_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: seafile
                  key: ZITADEL_OAUTH_CLIENT_ID
            - name: ZITADEL_OAUTH_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: seafile
                  key: ZITADEL_OAUTH_CLIENT_SECRET
            - name: SEAFILE_SERVER_HOSTNAME
              value: "seafile.$(DOMAIN)"
            - name: SEAFILE_SERVER_PROTOCOL
              value: https
            # Читается код-патчем при JIT-провижининге: только этот email
            # получает is_staff=True при первом SSO-входе.
            - name: INIT_SEAFILE_ADMIN_EMAIL
              value: "admin@$(DOMAIN)"
            - name: SEAFILE_MYSQL_DB_HOST
              value: seafile-mariadb
            - name: SEAFILE_MYSQL_DB_PORT
              value: "3306"
            - name: SEAFILE_MYSQL_DB_USER
              value: seafile
            - name: SEAFILE_MYSQL_DB_CCNET_DB_NAME
              value: ccnet_db
            - name: SEAFILE_MYSQL_DB_SEAFILE_DB_NAME
              value: seafile_db
            - name: SEAFILE_MYSQL_DB_SEAHUB_DB_NAME
              value: seahub_db
            - name: CACHE_PROVIDER
              value: redis
            - name: REDIS_HOST
              value: seafile-redis
            - name: REDIS_PORT
              value: "6379"
            - name: ENABLE_ONLYOFFICE
              value: "true"
            - name: ONLYOFFICE_HOST
              value: "onlyoffice.$(DOMAIN)"
            - name: ONLYOFFICE_APIJS_URL
              value: "https://onlyoffice.$(DOMAIN)/web-apps/apps/api/documents/api.js"
            - name: ONLYOFFICE_JWT_HEADER
              value: Authorization
          resources:
            limits:
              cpu: "2"
              memory: 2Gi
            requests:
              cpu: 100m
              memory: 512Mi
          volumeMounts:
            - name: shared
              mountPath: /shared
            - name: seahub-onlyoffice
              readOnly: true
              mountPath: /shared/seafile/conf/seahub_onlyoffice.py
            - name: seahub-oauth
              readOnly: true
              mountPath: /shared/seafile/conf/seahub_oauth.py
            - name: patches
              readOnly: true
              mountPath: /patches
            - name: prepare-seahub
              readOnly: true
              mountPath: /prepare-seahub.sh
          livenessProbe:
            httpGet:
              path: /api2/ping/
              port: http
            timeoutSeconds: 10
            periodSeconds: 60
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /api2/ping/
              port: http
            timeoutSeconds: 10
            periodSeconds: 30
            failureThreshold: 3
          startupProbe:
            httpGet:
              path: /api2/ping/
              port: http
            initialDelaySeconds: 30
            periodSeconds: 15
            failureThreshold: 40
          securityContext:
            capabilities:
              add: ["CHOWN", "DAC_OVERRIDE", "FOWNER", "SETGID", "SETUID"]
              drop: ["ALL"]
            allowPrivilegeEscalation: false
            seccompProfile:
              type: RuntimeDefault
      volumes:
        - name: shared
          persistentVolumeClaim:
            claimName: seafile-shared
        - name: seahub-onlyoffice
          hostPath:
            path: /home/artlab/projects/homelab/apps/seafile/seahub_onlyoffice.py
            type: File
        - name: seahub-oauth
          hostPath:
            path: /home/artlab/projects/homelab/apps/seafile/seahub_oauth.py
            type: File
        - name: patches
          hostPath:
            path: /home/artlab/projects/homelab/apps/seafile/patches
            type: Directory
        - name: prepare-seahub
          hostPath:
            path: /home/artlab/projects/homelab/apps/seafile/prepare-seahub.sh
            type: File

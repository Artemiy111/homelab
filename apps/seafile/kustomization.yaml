apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: seafile
resources:
  - k8s/namespace.yaml
  - k8s/onlyoffice.middleware.yaml
  - k8s/onlyoffice.route.yaml
  - k8s/route.yaml
  - k8s/networkpolicy.yaml
  - k8s/onlyoffice.deployment.yaml
  - k8s/onlyoffice.service.yaml
  - k8s/pvcs.yaml
  - k8s/redis.deployment.yaml
  - k8s/redis.service.yaml
  - k8s/seafile.deployment.yaml
  - k8s/seafile.service.yaml
  - k8s/vaultauth.yaml
  - k8s/vaultstaticsecret.yaml
configMapGenerator:
  - name: seafile-config
    files:
      - seahub_oauth.py
      - seahub_onlyoffice.py
      - prepare-seahub.sh
      - patches/seahub-base-accounts.patch
      - patches/seahub-oauth-views.patch

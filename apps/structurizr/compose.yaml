name: structurizr

# Structurizr перенесён в Kubernetes (apps/structurizr/k8s/). Compose оставлен
# только для сборки образа: сервис в кластере использует образ
# localhost/structurizr:2026.06.28, загруженный в containerd k0s.
services:
  structurizr:
    build:
      context: .
    container_name: structurizr

    volumes:
      - ${APPS_STORAGE_PATH:-/storage/apps}/structurizr:/usr/local/structurizr:Z,rw
      - ./structurizr.properties:/usr/local/structurizr/structurizr.properties:Z,ro

    restart: unless-stopped

    user: "1000:1000"

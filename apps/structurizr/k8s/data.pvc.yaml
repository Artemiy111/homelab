# Workspace Structurizr: без backup target, поэтому longhorn-retain — удаление PVC
# не должно стирать данные. RWO-том на одной ноде требует strategy.type: Recreate
# у deployment (см. deployment.yaml).
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: structurizr-data
  namespace: structurizr
spec:
  storageClassName: longhorn-retain
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      # Workspace и настройки ~1 МБ; запас под рост.
      storage: 64Mi

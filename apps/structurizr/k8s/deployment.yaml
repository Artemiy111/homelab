apiVersion: apps/v1
kind: Deployment
metadata:
  name: structurizr
  namespace: structurizr
spec:
  replicas: 1
  selector:
    matchLabels:
      app: structurizr
  template:
    metadata:
      labels:
        app: structurizr
    spec:
      enableServiceLinks: false
      containers:
        - name: structurizr
          # Образ собирается из исходников (apps/structurizr/Dockerfile) и
          # загружается в containerd k0s локально; в Git его нет.
          image: "localhost/structurizr:2026.06.28"
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: PORT
              value: "8080"
            - name: TZ
              valueFrom:
                configMapKeyRef:
                  name: homelab-config
                  key: TZ
          resources:
            limits:
              cpu: "2"
              memory: 2Gi
            requests:
              cpu: 100m
              memory: 384Mi
          volumeMounts:
            - name: data
              mountPath: /usr/local/structurizr
            - name: properties
              readOnly: true
              mountPath: /usr/local/structurizr/structurizr.properties
              subPath: structurizr.properties
          livenessProbe:
            httpGet:
              path: /
              port: http
            timeoutSeconds: 10
            periodSeconds: 30
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /
              port: http
            timeoutSeconds: 10
            periodSeconds: 15
            failureThreshold: 3
          startupProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 20
            periodSeconds: 10
            failureThreshold: 30
          imagePullPolicy: IfNotPresent
          securityContext:
            capabilities:
              drop: ["ALL"]
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            seccompProfile:
              type: RuntimeDefault
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: structurizr-data
        - name: properties
          configMap:
            name: structurizr-properties
      # fsGroup даёт групповую запись в том Longhorn, иначе root-owned каталог
      # тома недоступен пользователю 1000.
      securityContext:
        fsGroup: 1000
  # RWO-том: два пода при rolling update пишут в один workspace.
  strategy:
    type: Recreate
  revisionHistoryLimit: 2

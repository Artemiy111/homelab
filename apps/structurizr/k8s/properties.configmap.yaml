apiVersion: v1
kind: ConfigMap
metadata:
  name: structurizr-properties
  namespace: structurizr
data:
  structurizr.properties: |
    # включить браузерный DSL editor
    structurizr.feature.ui.dslEditor=true
    # базовый URL сервера за обратным прокси (Traefik)
    structurizr.url=https://structurizr.example.com

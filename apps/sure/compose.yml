name: sure

x-db-env: &db_env
  POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER in sure/secrets.enc.env}
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in sure/secrets.enc.env}
  POSTGRES_DB: ${POSTGRES_DB:-sure_production}

x-rails-env: &rails_env
  <<: *db_env
  SECRET_KEY_BASE: ${SECRET_KEY_BASE:?set SECRET_KEY_BASE in sure/secrets.enc.env}
  SELF_HOSTED: "true"
  RAILS_FORCE_SSL: "false"
  RAILS_ASSUME_SSL: "true"
  DB_HOST: db
  DB_PORT: 5432
  REDIS_URL: redis://redis:6379/1
  OPENAI_ACCESS_TOKEN: ${OPENAI_ACCESS_TOKEN:-}
  OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4o}
  OPENAI_URI_BASE: ${OPENAI_URI_BASE:-https://localai.${DOMAIN}/v1}
  LLM_CONTEXT_WINDOW: ${LLM_CONTEXT_WINDOW:-8192}
  OPENAI_REQUEST_TIMEOUT: ${OPENAI_REQUEST_TIMEOUT:-300}
  ASSISTANT_MAX_TOOL_CALL_ITERATIONS: ${ASSISTANT_MAX_TOOL_CALL_ITERATIONS:-2}
  AI_RESPONSE_TIMEOUT: ${AI_RESPONSE_TIMEOUT:-1200}

services:
  web:
    image: ghcr.io/we-promise/sure:0.7.3
    container_name: sure-web

    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

    volumes:
      - ${APPS_STORAGE_PATH:-/storage/apps}/sure/data/app:/rails/storage

    environment:
      <<: *rails_env

    networks:
      - backend
      - traefiknet
    restart: unless-stopped

    labels:
      - traefik.enable=true
      - traefik.docker.network=traefiknet
      - traefik.http.services.sure.loadbalancer.server.port=3000
      - traefik.http.routers.sure.rule=Host(`sure.${DOMAIN}`)
      - traefik.http.routers.sure.entrypoints=websecure
      - traefik.http.routers.sure.service=sure
      - traefik.http.routers.sure.tls.certresolver=letsencrypt
    init: true

    security_opt:
      - no-new-privileges:true

  worker:
    image: ghcr.io/we-promise/sure:0.7.3
    container_name: sure-worker

    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

    volumes:
      - ${APPS_STORAGE_PATH:-/storage/apps}/sure/data/app:/rails/storage

    environment:
      <<: *rails_env

    networks:
      - backend
    command: bundle exec sidekiq
    restart: unless-stopped
    init: true

    security_opt:
      - no-new-privileges:true

  db:
    image: postgres:16
    container_name: sure-db

    volumes:
      - ${APPS_STORAGE_PATH:-/storage/apps}/sure/data/postgresql:/var/lib/postgresql/data:Z

    environment:
      <<: *db_env

    networks:
      - backend
    restart: unless-stopped

    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB" ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    init: true

    security_opt:
      - no-new-privileges:true

  backup:
    image: prodrigestivill/postgres-backup-local
    container_name: sure-backup

    depends_on:
      - db

    volumes:
      - ${APPS_STORAGE_PATH:-/storage/apps}/sure/data/backups:/backups

    environment:
      - POSTGRES_HOST=db
      - POSTGRES_DB=${POSTGRES_DB:-sure_production}
      - POSTGRES_USER=${POSTGRES_USER:?set POSTGRES_USER in sure/secrets.enc.env}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in sure/secrets.enc.env}
      - SCHEDULE=@daily
      - BACKUP_KEEP_DAYS=7
      - BACKUP_KEEP_WEEKS=4
      - BACKUP_KEEP_MONTHS=6

    networks:
      - backend
    restart: unless-stopped
    init: true

    profiles:
      - backup
    security_opt:
      - no-new-privileges:true

  redis:
    image: redis:8-alpine
    container_name: sure-redis

    volumes:
      - ${APPS_STORAGE_PATH:-/storage/apps}/sure/data/redis:/data:Z

    networks:
      - backend
    restart: unless-stopped

    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 10
    init: true

    security_opt:
      - no-new-privileges:true

networks:
  backend:
    internal: true
  traefiknet:
    external: true

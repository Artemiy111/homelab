apiVersion: apps/v1
kind: Deployment
metadata:
  name: sure-db
  namespace: sure
spec:
  # postgres:16 (Debian, uid 999): PGDATA=/var/lib/postgresql/data.
  strategy:
    type: Recreate
  revisionHistoryLimit: 2
  replicas: 1
  selector:
    matchLabels:
      app: sure-db
  template:
    metadata:
      labels:
        app: sure-db
    spec:
      containers:
        - name: postgres
          image: "postgres:16@sha256:f992505e18f114c1e5102ac4dcf00f791b44462f6a423d899320f0bbf80e386f"
          ports:
            - name: postgres
              containerPort: 5432
          env:
            - name: POSTGRES_USER
              value: postgres
            - name: POSTGRES_DB
              value: sure_production
            - name: POSTGRES_PASSWORD
              value: postgres
          startupProbe:
            exec:
              command: ["pg_isready", "-U", "postgres", "-d", "sure_production"]
            initialDelaySeconds: 15
            periodSeconds: 5
            failureThreshold: 30
          livenessProbe:
            exec:
              command: ["pg_isready", "-U", "postgres", "-d", "sure_production"]
            periodSeconds: 30
            timeoutSeconds: 5
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "postgres", "-d", "sure_production"]
            periodSeconds: 10
            timeoutSeconds: 5
          securityContext:
            runAsUser: 999
            runAsGroup: 999
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            seccompProfile:
              type: RuntimeDefault
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: "1"
              memory: 1Gi
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
            - name: dshm
              mountPath: /dev/shm
      volumes:
        - name: data
          hostPath:
            path: /storage/apps/sure/data/postgresql
            type: Directory
        - name: dshm
          emptyDir:
            medium: Memory
            sizeLimit: 256Mi

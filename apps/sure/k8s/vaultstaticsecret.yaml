apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultStaticSecret
metadata:
  name: sure-db-auth
  namespace: sure
spec:
  vaultAuthRef: vso-sure
  mount: kv
  type: kv-v2
  path: sure/db
  refreshAfter: 1h
  destination:
    name: sure-db-auth
    create: true
    overwrite: true
    type: kubernetes.io/basic-auth
    transformation:
      excludeRaw: true
---
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultStaticSecret
metadata:
  name: sure-secrets
  namespace: sure
spec:
  vaultAuthRef: vso-sure
  mount: kv
  type: kv-v2
  path: sure/secrets
  refreshAfter: 1h
  destination:
    name: sure-secrets
    create: true
    overwrite: true
    transformation:
      excludeRaw: true

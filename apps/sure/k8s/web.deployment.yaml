apiVersion: apps/v1
kind: Deployment
metadata:
  name: sure
  namespace: sure
spec:
  replicas: 1
  selector:
    matchLabels:
      app: sure
  # RWO-том storage общий с worker: оба пода пишут в один каталог.
  strategy:
    type: Recreate
  revisionHistoryLimit: 2
  template:
    metadata:
      labels:
        app: sure
    spec:
      initContainers:
        - name: wait-for-db
          image: "postgres:16@sha256:f992505e18f114c1e5102ac4dcf00f791b44462f6a423d899320f0bbf80e386f"
          command: ["/bin/sh", "-c", "until pg_isready -h shared-rw.databases.svc.cluster.local -p 5432 -U sure; do echo waiting for shared-rw; sleep 2; done"]
          resources:
            limits:
              cpu: 100m
              memory: 64Mi
            requests:
              cpu: 10m
              memory: 32Mi
          securityContext:
            capabilities:
              drop: ["ALL"]
            allowPrivilegeEscalation: false
            runAsGroup: 999
            runAsNonRoot: true
            runAsUser: 999
            seccompProfile:
              type: RuntimeDefault
        - name: wait-for-redis
          image: "redis:8-alpine@sha256:978f0e01593e65eed801f2402944efcd936d43b5027e4908a7897baf88ed6241"
          command: ["/bin/sh", "-c", "until redis-cli -h sure-redis ping | grep -q PONG; do echo waiting for sure-redis; sleep 2; done"]
          resources:
            limits:
              cpu: 100m
              memory: 64Mi
            requests:
              cpu: 10m
              memory: 32Mi
          securityContext:
            capabilities:
              drop: ["ALL"]
            allowPrivilegeEscalation: false
            runAsGroup: 999
            runAsNonRoot: true
            runAsUser: 999
            seccompProfile:
              type: RuntimeDefault
      containers:
        - name: sure
          image: "ghcr.io/we-promise/sure:0.7.3@sha256:12361b7b309f867002b8a1f54200607ca1a321e1b57cf21890caaf83602c3cd0"
          ports:
            - name: http
              containerPort: 3000
          env:
            - name: DOMAIN
              valueFrom:
                configMapKeyRef:
                  name: homelab-config
                  key: DOMAIN
            - name: POSTGRES_USER
              value: sure
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: sure-db-auth
                  key: password
            - name: POSTGRES_DB
              value: sure
            - name: SECRET_KEY_BASE
              valueFrom:
                secretKeyRef:
                  name: sure
                  key: SECRET_KEY_BASE
            - name: OPENAI_ACCESS_TOKEN
              valueFrom:
                secretKeyRef:
                  name: sure
                  key: OPENAI_ACCESS_TOKEN
            - name: SELF_HOSTED
              value: "true"
            - name: RAILS_FORCE_SSL
              value: "false"
            - name: RAILS_ASSUME_SSL
              value: "true"
            - name: DB_HOST
              value: shared-rw.databases.svc.cluster.local
            - name: DB_PORT
              value: "5432"
            - name: REDIS_URL
              value: "redis://sure-redis:6379/1"
            - name: OPENAI_MODEL
              value: gpt-4o
            - name: OPENAI_URI_BASE
              value: "https://localai.$(DOMAIN)/v1"
            - name: LLM_CONTEXT_WINDOW
              value: "8192"
            - name: OPENAI_REQUEST_TIMEOUT
              value: "300"
            - name: ASSISTANT_MAX_TOOL_CALL_ITERATIONS
              value: "2"
            - name: AI_RESPONSE_TIMEOUT
              value: "1200"
          resources:
            limits:
              cpu: "1"
              memory: 1Gi
            requests:
              cpu: 100m
              memory: 384Mi
          volumeMounts:
            - name: storage
              mountPath: /rails/storage
          livenessProbe:
            httpGet:
              path: /up
              port: http
            timeoutSeconds: 10
            periodSeconds: 30
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /up
              port: http
            timeoutSeconds: 10
            periodSeconds: 30
            failureThreshold: 3
          startupProbe:
            httpGet:
              path: /up
              port: http
            initialDelaySeconds: 20
            periodSeconds: 10
            failureThreshold: 60
          securityContext:
            capabilities:
              drop: ["ALL"]
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            seccompProfile:
              type: RuntimeDefault
      volumes:
        - name: storage
          persistentVolumeClaim:
            claimName: sure-storage
      # fsGroup даёт групповую запись в том Longhorn, иначе root-owned каталог
      # тома недоступен пользователю 1000.
      securityContext:
        fsGroup: 1000

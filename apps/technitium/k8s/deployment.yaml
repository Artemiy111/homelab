apiVersion: apps/v1
kind: Deployment
metadata:
  name: technitium
  namespace: technitium
spec:
  replicas: 1
  selector:
    matchLabels:
      app: technitium
  template:
    metadata:
      labels:
        app: technitium
    spec:
      # Обычный (не hostNetwork) под: в pod-netns .NET биндит TCP на IPv4
      # корректно (в hostNetwork он слушал только IPv6). Наружу порт 53
      # публикуется через kube-proxy externalIPs <node1-ip> (см. dns.service.yaml).
      enableServiceLinks: false
      containers:
        - name: technitium
          image: "technitium/dns-server:15.4.0@sha256:df7d90ef0f7b6fff6916d291a7022cd902290cc31c3141d4158b6c375a641b41"
          ports:
            - name: dns-udp
              protocol: UDP
              containerPort: 53
            - name: dns-tcp
              protocol: TCP
              containerPort: 53
            - name: http
              containerPort: 5380
          env:
            - name: DNS_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: technitium
                  key: TECHNITIUM_ADMIN_PASSWORD
            - name: DNS_SERVER_NAME
              value: "dns.$(DOMAIN)"
            - name: DOMAIN
              valueFrom:
                configMapKeyRef:
                  name: homelab-config
                  key: DOMAIN
            - name: TZ
              valueFrom:
                configMapKeyRef:
                  name: homelab-config
                  key: TZ
          resources:
            limits:
              cpu: "1"
              memory: 1Gi
            requests:
              cpu: 100m
              memory: 256Mi
          volumeMounts:
            - name: etc
              mountPath: /etc/dns
            - name: data
              mountPath: /var/lib/dns
          livenessProbe:
            exec:
              command: ["dig", "+short", "+norecurse", "@127.0.0.1", "technitium"]
            timeoutSeconds: 5
            periodSeconds: 30
            failureThreshold: 3
          readinessProbe:
            exec:
              command: ["dig", "+short", "+norecurse", "@127.0.0.1", "technitium"]
            timeoutSeconds: 5
            periodSeconds: 15
            failureThreshold: 3
          startupProbe:
            exec:
              command: ["dig", "+short", "+norecurse", "@127.0.0.1", "technitium"]
            initialDelaySeconds: 10
            periodSeconds: 5
            failureThreshold: 30
          securityContext:
            capabilities:
              # NET_BIND_SERVICE — порт 53 <1024 под root с drop ALL.
              # DAC_OVERRIDE/CHOWN/FOWNER — запись в 0750-каталоги artlab.
              add: ["NET_BIND_SERVICE", "DAC_OVERRIDE", "CHOWN", "FOWNER"]
              drop: ["ALL"]
            allowPrivilegeEscalation: false
            runAsUser: 0
            runAsGroup: 0
            seccompProfile:
              type: RuntimeDefault
      volumes:
        - name: etc
          persistentVolumeClaim:
            claimName: technitium-etc
        - name: data
          persistentVolumeClaim:
            claimName: technitium-data
  # RWO-тома: два пода при rolling update пишут в одни каталоги.
  strategy:
    type: Recreate
  revisionHistoryLimit: 2

apiVersion: apps/v1
kind: Deployment
metadata:
  name: technitium
  namespace: default
spec:
  strategy:
    type: Recreate
  revisionHistoryLimit: 2
  replicas: 1
  selector:
    matchLabels:
      app: technitium
  template:
    metadata:
      labels:
        app: technitium
    spec:
      # DNS всей LAN: слушает 53 на IP узла (.254), как раньше в Docker.
      hostNetwork: true
      # Свои резолверы DNS-сервера в конфиге; host resolv.conf надёжнее CoreDNS.
      dnsPolicy: Default
      enableServiceLinks: false
      containers:
        - name: technitium
          image: "technitium/dns-server:15.4.0@sha256:df7d90ef0f7b6fff6916d291a7022cd902290cc31c3141d4158b6c375a641b41"
          ports:
            - name: dns-udp
              containerPort: 53
              protocol: UDP
            - name: dns-tcp
              containerPort: 53
              protocol: TCP
            - name: http
              containerPort: 5380
          env:
            - name: DNS_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: technitium
                  key: TECHNITIUM_ADMIN_PASSWORD
            - name: DNS_SERVER_NAME
              value: "dns.$(DOMAIN)"
            - name: DOMAIN
              valueFrom:
                configMapKeyRef:
                  name: homelab-config
                  key: DOMAIN
            - name: TZ
              valueFrom:
                configMapKeyRef:
                  name: homelab-config
                  key: TZ
          startupProbe:
            exec:
              command: ["dig", "+short", "+norecurse", "@127.0.0.1", "technitium"]
            initialDelaySeconds: 10
            periodSeconds: 5
            failureThreshold: 30
          livenessProbe:
            exec:
              command: ["dig", "+short", "+norecurse", "@127.0.0.1", "technitium"]
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            exec:
              command: ["dig", "+short", "+norecurse", "@127.0.0.1", "technitium"]
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3
          securityContext:
            runAsUser: 0
            runAsGroup: 0
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
              # NET_BIND_SERVICE — порт 53 <1024 под root с drop ALL.
              # DAC_OVERRIDE/CHOWN/FOWNER — запись в 0750-каталоги artlab.
              add: ["NET_BIND_SERVICE", "DAC_OVERRIDE", "CHOWN", "FOWNER"]
            seccompProfile:
              type: RuntimeDefault
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 1Gi
          volumeMounts:
            - name: etc
              mountPath: /etc/dns
            - name: data
              mountPath: /var/lib/dns
      volumes:
        - name: etc
          hostPath:
            path: /storage/apps/technitium/etc
            type: Directory
        - name: data
          hostPath:
            path: /storage/apps/technitium/data
            type: Directory

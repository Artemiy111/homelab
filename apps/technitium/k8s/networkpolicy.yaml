# NetworkPolicy для namespace сервиса: default-deny ingress плюс явные
# разрешения. DNS публикуется через externalIPs, поэтому клиенты приходят с
# реальных адресов — их приходится перечислять:
#   - 192.0.2.10/16 — локальная сеть (клиенты ходят на <node1-ip>:53);
#   - 192.0.2.10/16 — роутер: он форвардит DNS-запросы на <node1-ip>:53;
#   - 100.64.0.0/10 — tailnet;
#   - 10.244.0.0/16 — поды кластера: gatus (и любой другой под) явно
#     резолвит через Technitium (dns-resolver в конфиге).
# Админка (5380) доступна только через traefik. Egress не ограничивается.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-ingress
  namespace: technitium
spec:
  podSelector: {}
  policyTypes:
    - Ingress
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-ingress
  namespace: technitium
spec:
  podSelector: {}
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector: {}
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: traefik
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitoring
          podSelector:
            matchLabels:
              app: vmagent
      ports:
        - port: 5380
          protocol: TCP
    - from:
        - ipBlock:
            cidr: 192.0.2.10/16
        - ipBlock:
            cidr: 192.0.2.10/16
        - ipBlock:
            cidr: 100.64.0.0/10
        - ipBlock:
            cidr: 10.244.0.0/16
      ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP

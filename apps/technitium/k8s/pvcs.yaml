# Конфигурация Technitium DNS: без backup target, поэтому longhorn-retain.
# RWO-тома на одной ноде требуют strategy.type: Recreate (см. deployment.yaml).
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: technitium-etc
  namespace: technitium
spec:
  storageClassName: longhorn-retain
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      # Конфиг ~229 МБ; запас под рост.
      storage: 512Mi
---
# Зоны и БД Technitium (сейчас пусто).
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: technitium-data
  namespace: technitium
spec:
  storageClassName: longhorn-retain
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 64Mi

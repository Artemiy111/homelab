apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: monitoring
resources:
  - k8s/tempo.deployment.yaml
  - k8s/tempo.pvc.yaml
  - k8s/tempo.service.yaml
configMapGenerator:
  # tempo.yaml собирается в ConfigMap `tempo-config`; kustomize добавляет хэш
  # содержимого к имени и переписывает ссылку в Deployment, поэтому правка
  # конфига сама запускает rollout.
  - name: tempo-config
    files:
      - config/tempo.yaml

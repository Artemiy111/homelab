apiVersion: batch/v1
kind: CronJob
metadata:
  name: uptime-kuma-sync
  namespace: uptime-kuma
spec:
  suspend: true
  schedule: "0 0 1 1 *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 1
  jobTemplate:
    spec:
      backoffLimit: 0
      template:
        metadata:
          labels:
            app: uptime-kuma-sync
        spec:
          restartPolicy: Never
          securityContext:
            runAsNonRoot: true
            fsGroup: 1000
          initContainers:
            - name: install-deps
              image: "oven/bun:1"
              workingDir: /opt/deps
              command: ["bun", "add", "socket.io-client@4"]
              securityContext:
                runAsUser: 1000
                runAsGroup: 1000
                allowPrivilegeEscalation: false
                capabilities:
                  drop: ["ALL"]
                seccompProfile:
                  type: RuntimeDefault
              volumeMounts:
                - name: deps
                  mountPath: /opt/deps
          containers:
            - name: sync
              image: "oven/bun:1"
              command: ["bun", "run", "/app/sync-monitors.ts"]
              env:
                - name: HOME
                  value: /tmp
                - name: NODE_PATH
                  value: /opt/deps/node_modules
                - name: UPTIME_KUMA_URL
                  value: "http://uptime-kuma"
                - name: UPTIME_KUMA_MONITORS_FILE
                  value: "/app/monitors.yaml"
                - name: HOST_IP
                  valueFrom:
                    fieldRef:
                      fieldPath: status.hostIP
                # Секреты из Vault (Secret uptime-kuma-vault, приложение
                # apps/uptime-kuma/k8s/vaultstaticsecret.yaml). Раньше они
                # приходили через envFrom от всего Secret.
                #
                # Явные ссылки по ключу, а не envFrom, по двум причинам.
                # Первая: VSO добавляет в свой Secret служебный ключ _raw, и
                # при envFrom он попал бы в окружение как переменная, имя
                # которой не проходит валидацию C_IDENTIFIER. Второй,
                # практическая: подстановка перечислением неявна — непонятно,
                # откуда взялось имя каждой переменной.
                #
                # Имена ключей намеренно совпадают с именами переменных,
                # поэтому список ниже и есть полный перечень секретов.
                - name: UPTIME_KUMA_USERNAME
                  valueFrom:
                    secretKeyRef:
                      name: uptime-kuma-vault
                      key: UPTIME_KUMA_USERNAME
                - name: UPTIME_KUMA_PASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: uptime-kuma-vault
                      key: UPTIME_KUMA_PASSWORD
              envFrom:
                # Только ConfigMap: homelab-config даёт DOMAIN/TZ/локали.
                # Секретов здесь больше нет.
                - configMapRef:
                    name: homelab-config
              securityContext:
                runAsUser: 1000
                runAsGroup: 1000
                allowPrivilegeEscalation: false
                capabilities:
                  drop: ["ALL"]
                seccompProfile:
                  type: RuntimeDefault
              volumeMounts:
                - name: config
                  mountPath: /app
                  readOnly: true
                - name: deps
                  mountPath: /opt/deps
          volumes:
            - name: config
              configMap:
                name: uptime-kuma-sync-files
            - name: deps
              emptyDir: {}

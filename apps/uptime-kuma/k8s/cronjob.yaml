apiVersion: batch/v1
kind: CronJob
metadata:
  name: uptime-kuma-sync
  namespace: uptime-kuma
spec:
  suspend: true
  schedule: "0 0 1 1 *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 1
  jobTemplate:
    spec:
      backoffLimit: 0
      template:
        metadata:
          labels:
            app: uptime-kuma-sync
        spec:
          restartPolicy: Never
          securityContext:
            runAsNonRoot: true
            fsGroup: 1000
          initContainers:
            - name: install-deps
              image: "oven/bun:1"
              workingDir: /opt/deps
              command: ["bun", "add", "socket.io-client@4"]
              securityContext:
                runAsUser: 1000
                runAsGroup: 1000
                allowPrivilegeEscalation: false
                capabilities:
                  drop: ["ALL"]
                seccompProfile:
                  type: RuntimeDefault
              volumeMounts:
                - name: deps
                  mountPath: /opt/deps
          containers:
            - name: sync
              image: "oven/bun:1"
              command: ["bun", "run", "/app/sync-monitors.ts"]
              env:
                - name: HOME
                  value: /tmp
                - name: NODE_PATH
                  value: /opt/deps/node_modules
                - name: UPTIME_KUMA_URL
                  value: "http://uptime-kuma:3001"
                - name: UPTIME_KUMA_MONITORS_FILE
                  value: "/app/monitors.yaml"
                # Внутренний IP узла от k8s, а не хардкод в configmap. Нужен
                # мониторам Home Assistant и Technitium DNS: они ходят на
                # опубликованные порты узла, а Downward API даёт тот же адрес
                # без ручного дублирования. Явный env перекрывает envFrom.
                - name: SERVER_IP
                  valueFrom:
                    fieldRef:
                      fieldPath: status.hostIP
              envFrom:
                - configMapRef:
                    name: homelab-config
                - secretRef:
                    name: uptime-kuma-sync
              securityContext:
                runAsUser: 1000
                runAsGroup: 1000
                allowPrivilegeEscalation: false
                capabilities:
                  drop: ["ALL"]
                seccompProfile:
                  type: RuntimeDefault
              volumeMounts:
                - name: config
                  mountPath: /app
                  readOnly: true
                - name: deps
                  mountPath: /opt/deps
          volumes:
            - name: config
              hostPath:
                path: /storage/apps/uptime-kuma-sync
                type: Directory
            - name: deps
              emptyDir: {}

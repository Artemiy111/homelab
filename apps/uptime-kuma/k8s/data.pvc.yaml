# Состояние Kuma вне базы: db-config.json (параметры подключения), upload/,
# screenshots/, error.log. Мониторы и история проверок живут в MariaDB
# (platform/mariadb), поэтому том больше не главное хранилище.
#
# longhorn-retain (reclaimPolicy: Retain): удаление PVC не должно стирать
# содержимое. RWO-том на одной ноде требует strategy.type: Recreate (см.
# deployment.yaml).
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: uptime-kuma-data
  namespace: uptime-kuma
spec:
  storageClassName: longhorn-retain
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      # Данных тут немного: пара мегабайт скриншотов и загрузок. Запас — на
      # логи и на случай, если вернётся embedded-mariadb.
      storage: 512Mi

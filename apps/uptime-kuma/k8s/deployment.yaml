apiVersion: apps/v1
kind: Deployment
metadata:
  name: uptime-kuma
  namespace: uptime-kuma
spec:
  # SQLite на RWO-томе: два пода при rolling update пишут в одну БД.
  # Recreate, а не RollingUpdate: два пода одновременно означали бы две копии
  # мониторов, пишущих heartbeat'ы в одну базу и дублирующих алерты.
  strategy:
    type: Recreate
  revisionHistoryLimit: 2
  replicas: 1
  selector:
    matchLabels:
      app: uptime-kuma
  template:
    metadata:
      labels:
        app: uptime-kuma
    spec:
      # fsGroup даёт групповую запись в том Longhorn, иначе root-owned каталог
      # тома недоступен пользователю 1000.
      securityContext:
        fsGroup: 1000
      containers:
        - name: uptime-kuma
          image: "louislam/uptime-kuma:2@sha256:3e24e96c89efff0e3a4b0698cbdd36c15ad3022371db57166e5588853002ee5c"
          ports:
            - containerPort: 3001
              name: http
          env:
            - name: NODE_OPTIONS
              value: "--max-old-space-size=512"
            # Внешняя MariaDB вместо встроенной (platform/mariadb). Без
            # UPTIME_KUMA_DB_TYPE Kuma 2.x поднимает embedded-mariadb внутри
            # пода и держит данные в /app/data/mariadb.
            #
            # Переменные перекрывают /app/data/db-config.json: в
            # server/setup-database.js приоритет env над файлом, и Kuma
            # переписывает конфигурацию сама. Учти, что она записывает туда же
            # пароль открытым текстом — это её устройство, а не настройка.
            - name: UPTIME_KUMA_DB_TYPE
              value: "mariadb"
            - name: UPTIME_KUMA_DB_HOSTNAME
              value: "uptime-kuma-mariadb"
            - name: UPTIME_KUMA_DB_PORT
              value: "3306"
            - name: UPTIME_KUMA_DB_NAME
              value: "kuma"
            - name: UPTIME_KUMA_DB_USERNAME
              valueFrom:
                secretKeyRef:
                  name: uptime-kuma-mariadb
                  key: DB_USERNAME
            - name: UPTIME_KUMA_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: uptime-kuma-mariadb
                  key: DB_PASSWORD
          startupProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 15
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /
              port: http
          securityContext:
            runAsUser: 1000
            runAsGroup: 1000
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            seccompProfile:
              type: RuntimeDefault
          resources:
            requests:
              cpu: 10m
              memory: 128Mi
            limits:
              cpu: 150m
              memory: 448Mi
          volumeMounts:
            - name: data
              mountPath: /app/data
      volumes:
        # Мониторы, история и настройки лежат во внешней MariaDB
        # (platform/mariadb), поэтому PVC больше не нужен. В /app/data остаются
        # db-config.json, upload/, screenshots/ и error.log: первый Kuma
        # переписывает из переменных окружения при каждом старте, скриншоты
        # пересоздаются проверками, а загрузки из UI переживут только до
        # пересоздания пода. sizeLimit ограничивает те самые загрузки.
        - name: data
          emptyDir:
            sizeLimit: 32Mi
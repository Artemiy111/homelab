# Доступ Vault Secrets Operator к секретам uptime-kuma.
#
# Всё живёт в namespace uptime-kuma, а не в vault: destination Secret
# создаётся в своём неймспейсе, и serviceAccount в VaultAuth обязан лежать
# в неймспейсе потребляющего секрета.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: vso-uptime-kuma
  namespace: uptime-kuma
---
# Vault проверяет предъявленный ServiceAccount-токен через TokenReview.
# Без system:auth-delegator на этом SA аутентификация не пройдёт.
#
# Имя ClusterRoleBinding уникально на весь кластер, поэтому оно с префиксом
# сервиса, а не generic: одноимённый объект в другом неймспейсе конфликтовал
# бы за кластерный ресурс.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: vso-uptime-kuma-delegator
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: system:auth-delegator
subjects:
  - kind: ServiceAccount
    name: vso-uptime-kuma
    namespace: uptime-kuma
---
# Роль и политика — в terraform/vault (roles.tf, policies.tf).
# https://developer.hashicorp.com/vault/docs/auth/kubernetes
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultAuth
metadata:
  name: vso-uptime-kuma
  namespace: uptime-kuma
spec:
  # vaultConnectionRef не указан: подключение берётся из VaultConnection/default,
  # который создаёт чарт оператора (argocd/applications/vault-secrets-operator.yaml,
  # defaultVaultConnection). Раньше здесь стояло `vault/vault` — ссылка с
  # префиксом пространства, без неё VSO ищет VaultConnection в своём неймспейсе
  # и возвращает `VaultConnection "vault" not found`.
  #
  # Общие headers/params и разрешённые неймспейсы — из VaultAuthGlobal.
  # Роль остаётся здесь своей, потому что vaultAuthGlobalRef отвечает только за
  # headers и params, а доступ определяется ролью в Vault.
  vaultAuthGlobalRef:
    name: vso-global
    namespace: vault-secrets-operator
  kubernetes:
    role: vso-uptime-kuma
    serviceAccount: vso-uptime-kuma
    audiences:
      - vault

apiVersion: v1
kind: ServiceAccount
metadata:
  name: vso-uptime-kuma
  namespace: uptime-kuma
---
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultAuth
metadata:
  name: vso-uptime-kuma
  namespace: uptime-kuma
spec:
  vaultAuthGlobalRef:
    name: vso-global
    namespace: vault-secrets-operator
  kubernetes:
    role: uptime-kuma
    serviceAccount: vso-uptime-kuma

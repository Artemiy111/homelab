# Секреты uptime-kuma из Vault, вместо SealedSecret.
#
# Имя цели НЕ совпадает с Secret от SealedSecret (uptime-kuma-sync): два
# контроллера, пишущие в один Secret, конфликтуют — SealedSecret затирал бы
# значение, положенное VSO, и наоборот. Разные имена плюс явные ссылки в
# cronjob.yaml дают возможность переключиться обратно одной правкой.
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultStaticSecret
metadata:
  name: uptime-kuma-vault
  namespace: uptime-kuma
spec:
  vaultAuthRef: vso-uptime-kuma
  mount: kv
  type: kv-v2
  path: uptime-kuma/sync
  refreshAfter: 1h
  destination:
    name: uptime-kuma-vault
    # create по умолчанию false: тогда VSO только обновляет уже существующий
    # Secret и не создаёт его. Для первого заполнения нужно true.
    create: true
  # hmacSecretData (дефолт true) нужен для детектирования дрейфа: если Secret
  # изменить руками, VSO заметит и вернёт значение из Vault.
  hmacSecretData: true

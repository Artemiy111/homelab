apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: uptime-kuma
resources:
  - k8s/namespace.yaml
  # SealedSecret остаётся как путь отката. Он создаёт Secret
  # uptime-kuma-sync, который больше не читает cronjob (см. k8s/cronjob.yaml),
  # но держит зашифрованные значения под рукой. Секреты в кластер идут из
  # Vault через два следующих файла.
  - k8s/sealedsecret.yaml
  - k8s/vaultauth.yaml
  - k8s/vaultstaticsecret.yaml
  - k8s/service.yaml
  - k8s/deployment.yaml
  - k8s/data.pvc.yaml
  - k8s/networkpolicy.yaml
  - k8s/cronjob.yaml
configMapGenerator:
  - name: uptime-kuma-sync-files
    files:
      - monitors.yaml
      - sync-monitors.ts
generatorOptions:
  labels:
    app: uptime-kuma-sync

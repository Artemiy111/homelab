apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: uptime-kuma
resources:
  - k8s/namespace.yaml
  - k8s/sealedsecret.yaml
  - k8s/service.yaml
  - k8s/deployment.yaml
  - k8s/networkpolicy.yaml
  - k8s/cronjob.yaml
configMapGenerator:
  - name: uptime-kuma-sync-files
    files:
      - monitors.yaml
      - sync-monitors.ts
generatorOptions:
  labels:
    app: uptime-kuma-sync

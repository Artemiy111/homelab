version: 1
monitors:
  - name: Technitium HTTP
    description: "Пользовательский HTTPS-маршрут Technitium DNS: локальный DNS, TLS,
      Traefik и веб-панель."
    type: http
    url: https://dns.{{DOMAIN}}/
    interval: 60
    maxretries: 2
  - name: Traefik
    description: Нативный health endpoint Traefik (/ping) через локальный DNS, TLS
      и Traefik. Панель /dashboard закрыта oauth2-proxy и на неавторизованный
      запрос отдаёт 302 на логин, создавая auth request в Zitadel; /ping
      проверяет живость без авторизации.
    type: http
    url: https://traefik.{{DOMAIN}}/ping
    interval: 60
    maxretries: 2
  - name: Jitsi Meet
    description: Пользовательский HTTPS-маршрут Jitsi Meet.
    type: http
    url: https://meet.{{DOMAIN}}/
    interval: 60
    maxretries: 2
  - name: Mermaid Live Editor
    description: Пользовательский HTTPS-маршрут Mermaid Live Editor.
    type: http
    url: https://mermaid.{{DOMAIN}}/
    interval: 60
    maxretries: 2
  - name: Nextcloud
    description: Публичный health endpoint Nextcloud через локальный DNS, TLS и Traefik.
    type: http
    url: https://nextcloud.{{DOMAIN}}/status.php
    interval: 60
    maxretries: 2
  - name: Forgejo
    description: Публичный health endpoint Forgejo через локальный DNS, TLS и
      Traefik; также проверяет подключение к PostgreSQL.
    type: http
    url: https://forgejo.{{DOMAIN}}/api/healthz
    interval: 60
    maxretries: 2
  - name: code-server
    description: Health endpoint code-server через локальный DNS, TLS и Traefik;
      парольная страница IDE не используется для определения состояния.
    type: http
    url: https://code.{{DOMAIN}}/healthz
    interval: 60
    maxretries: 2
  - name: Authentik
    description: Readiness endpoint Authentik через локальный DNS, TLS и Traefik;
      также проверяет подключение к PostgreSQL.
    type: http
    url: https://auth.{{DOMAIN}}/-/health/ready/
    interval: 60
    maxretries: 2
  - name: LocalAI
    description: Readiness endpoint LocalAI через локальный DNS, TLS и Traefik.
    type: http
    url: https://localai.{{DOMAIN}}/readyz
    interval: 60
    maxretries: 2
  - name: Immich
    description: Публичный ping endpoint Immich через локальный DNS, TLS и Traefik.
    type: http
    url: https://immich.{{DOMAIN}}/api/server/ping
    interval: 60
    maxretries: 2
  - name: Dawarich
    description: Публичный health endpoint Dawarich через локальный DNS, TLS и Traefik.
    type: http
    url: https://dawarich.{{DOMAIN}}/api/v1/health
    interval: 60
    maxretries: 2
  - name: Jellyfin
    description: Публичный health endpoint Jellyfin через локальный DNS, TLS и Traefik.
    type: http
    url: https://jellyfin.{{DOMAIN}}/health
    interval: 60
    maxretries: 2
  - name: Navidrome
    description: Публичный ping endpoint Navidrome через локальный DNS, TLS и Traefik.
    type: http
    url: https://music.{{DOMAIN}}/ping
    interval: 60
    maxretries: 2
  - name: Stirling PDF
    description: Публичный status endpoint Stirling PDF через локальный DNS, TLS и Traefik.
    type: http
    url: https://pdf.{{DOMAIN}}/api/v1/info/status
    interval: 60
    maxretries: 2
  - name: Home Assistant
    description: Веб-интерфейс Home Assistant в кластере; публичный маршрут
      ограничен локальной сетью, поэтому проверяем сервис напрямую. Порт узла
      8123 (hostNetwork) из пода недостижим — firewalld режет INPUT для pod-сети.
    type: http
    url: http://home-assistant.home-assistant.svc.cluster.local:8123/
    interval: 60
    maxretries: 2
  - name: Structurizr
    description: Backend Structurizr в кластере; публичный маршрут закрыт forward auth.
    type: http
    url: http://structurizr.structurizr.svc.cluster.local/
    interval: 60
    maxretries: 2
  - name: Lute
    description: Пользовательский HTTPS-маршрут Lute через локальный DNS, TLS и Traefik.
    type: http
    url: https://lute.{{DOMAIN}}/
    interval: 60
    maxretries: 2
  - name: 3x-ui
    description: Доступность web backend 3x-ui внутри кластера; публичный путь
      панели намеренно не хранится в репозитории.
    type: port
    hostname: xui.3x-ui.svc.cluster.local
    port: 2053
    interval: 60
    maxretries: 2
  - name: Sure
    description: Веб-интерфейс Sure через локальный DNS, TLS и Traefik; корень
      отдаёт 302 на страницу входа.
    type: http
    url: https://sure.{{DOMAIN}}/
    interval: 60
    maxretries: 2
  - name: Mailserver
    description: Панель администрирования Stalwart через локальный DNS, TLS и
      Traefik; корень отдаёт 302 на страницу входа.
    type: http
    url: https://mailserver.{{DOMAIN}}/
    interval: 60
    maxretries: 2
  - name: Webmail
    description: Пользовательский HTTPS-маршрут веб-почты через локальный DNS, TLS и
      Traefik.
    type: http
    url: https://mail.{{DOMAIN}}/
    interval: 60
    maxretries: 2
  - name: Seafile
    description: Анонимный ping endpoint Seafile через локальный DNS, TLS и Traefik.
    type: http
    url: https://seafile.{{DOMAIN}}/api2/ping/
    interval: 60
    maxretries: 2
  - name: OnlyOffice
    description: Healthcheck OnlyOffice Document Server через локальный DNS, TLS и Traefik.
    type: http
    url: https://onlyoffice.{{DOMAIN}}/healthcheck
    interval: 60
    maxretries: 2
  - name: Paperless
    description: Веб-интерфейс Paperless-ngx через локальный DNS, TLS и Traefik;
      корень отдаёт 302 на страницу входа.
    type: http
    url: https://paperless.{{DOMAIN}}/
    interval: 60
    maxretries: 2
  - name: Infisical
    description: Status endpoint Infisical через локальный DNS, TLS и Traefik; также
      отражает доступность Redis и Postgres.
    type: http
    url: https://infisical.{{DOMAIN}}/api/status
    interval: 60
    maxretries: 2
  - name: Zitadel
    description: Health endpoint Zitadel через локальный DNS, TLS и Traefik.
    type: http
    url: https://id.{{DOMAIN}}/debug/healthz
    interval: 60
    maxretries: 2
  - name: Element Web
    description: Пользовательский HTTPS-маршрут Element Web через локальный DNS, TLS
      и Traefik.
    type: http
    url: https://element.{{DOMAIN}}/
    interval: 60
    maxretries: 2
  - name: Synapse
    description: Client-Server API Synapse (/_matrix) через локальный DNS, TLS и Traefik.
    type: http
    url: https://element.{{DOMAIN}}/_matrix/client/versions
    interval: 60
    maxretries: 2
  - name: Talk signaling
    description: Nextcloud Talk high-performance backend (eturnal) через локальный
      DNS, TLS и Traefik.
    type: http
    url: https://talk-signaling.{{DOMAIN}}/standalone-signaling/api/v1/welcome
    interval: 60
    maxretries: 2
  - name: Netdata
    description: Агент Netdata в кластере; публичный маршрут закрыт forward auth.
    type: http
    url: http://netdata.monitoring.svc.cluster.local/api/v1/info
    interval: 60
    maxretries: 2
  - name: VictoriaMetrics
    description: TSDB VictoriaMetrics в кластере; наружу не публикуется, /health
      отдаёт 200.
    type: http
    url: http://victoriametrics.monitoring.svc.cluster.local/health
    interval: 60
    maxretries: 2
  - name: vmagent
    description: Сборщик метрик vmagent в кластере; наружу не публикуется,
      /health отдаёт 200.
    type: http
    url: http://vmagent.monitoring.svc.cluster.local/health
    interval: 60
    maxretries: 2
  - name: Grafana
    description: Health API Grafana в кластере; публичный маршрут закрыт forward auth.
    type: http
    url: http://grafana.monitoring.svc.cluster.local/api/health
    interval: 60
    maxretries: 2
  - name: Uptime Kuma
    description: Собственный HTTPS-маршрут Uptime Kuma; фиксирует проблемы маршрута,
      пока сам процесс Kuma способен выполнять проверки.
    type: http
    url: https://kuma.{{DOMAIN}}/
    interval: 60
    maxretries: 2
  - name: Gatus
    description: Пользовательский HTTPS-маршрут Gatus; фиксирует проблемы маршрута,
      пока сам процесс Gatus способен выполнять проверки.
    type: http
    url: https://uptime.{{DOMAIN}}/
    interval: 60
    maxretries: 2
  - name: WUD
    description: Health endpoint WUD в кластере; публичный маршрут закрыт forward auth.
    type: http
    url: http://wud.monitoring.svc.cluster.local/health
    interval: 60
    maxretries: 2
  - name: Homepage
    description: Health endpoint Homepage через локальный DNS, TLS и Traefik.
    type: http
    url: https://home.{{DOMAIN}}/api/healthcheck
    interval: 60
    maxretries: 2
  - name: Beszel
    description: Публичный health endpoint Beszel Hub через локальный DNS, TLS и Traefik.
    type: http
    url: https://beszel.{{DOMAIN}}/api/health
    interval: 60
    maxretries: 2
  - name: Technitium DNS
    description: Разрешение пользовательского домена через локальный DNS-сервер Technitium.
    type: dns
    hostname: uptime.{{DOMAIN}}
    dns_resolve_server: "{{HOST_IP}}"
    dns_resolve_type: A
    interval: 60
    maxretries: 2
  - name: Gitea SSH
    description: Доступность опубликованного SSH-порта Forgejo через DNS-имя;
      порт слушает узел, но имя берётся то же, что у остальных маршрутов.
    type: port
    hostname: "forgejo.{{DOMAIN}}"
    port: 2222
    interval: 60
    maxretries: 2
  - name: Xray inbound
    description: Доступность опубликованного TCP-входа Xray; UDP тем же монитором не
      проверяется.
    type: port
    hostname: "{{HOST_IP}}"
    port: 8443
    interval: 60
    maxretries: 2

name: vault

services:
  vault:
    image: hashicorp/vault:${VAULT_VERSION:-2.0.3}
    container_name: vault
    volumes:
      - ${APPS_STORAGE_PATH:-/storage/apps}/vault/data:/vault/data:Z
      - ./config:/vault/config:ro

    environment:
      # Used by the bundled CLI and healthcheck inside the HTTP-only container.
      VAULT_ADDR: "http://127.0.0.1:8200"
      VAULT_API_ADDR: "https://vault.${DOMAIN}"

    ports:
      - "127.0.0.1:8200:8200"
    networks:
      - traefiknet
    command: vault server -config=/vault/config/vault.hcl
    restart: unless-stopped

    healthcheck:
      # `vault status` returns 2 while Vault is correctly running but sealed.
      test: [ "CMD-SHELL", 'vault status >/dev/null 2>&1; status=$$?; [ "$$status" -eq 0 ] || [ "$$status" -eq 2 ]' ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

    labels:
      - traefik.enable=true
      - traefik.docker.network=traefiknet
      - traefik.http.services.vault.loadbalancer.server.port=8200
      - traefik.http.routers.vault.rule=Host(`vault.${DOMAIN}`)
      - traefik.http.routers.vault.entrypoints=websecure
      - traefik.http.routers.vault.service=vault
      - traefik.http.routers.vault.tls.certresolver=letsencrypt
    mem_limit: 256m

    security_opt:
      - no-new-privileges:true

networks:
  traefiknet:
    external: true

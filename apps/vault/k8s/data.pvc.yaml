# Зашифрованные данные Vault (Raft): без backup target, поэтому longhorn-retain —
# удаление PVC не должно стирать хранилище. RWO-том на одной ноде требует
# strategy.type: Recreate (см. deployment.yaml).
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: vault-data
  namespace: vault
spec:
  storageClassName: longhorn-retain
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      # Данные ~8.4 МБ; запас под рост Raft-хранилища.
      storage: 64Mi

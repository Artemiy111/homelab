# Базовый NetworkPolicy для namespace Vault: default-deny ingress плюс явные
# разрешения. Метрики Vault скрейпит vmagent из monitoring. Egress не
# ограничивается.
#
# ВНИМАНИЕ на первый peer: podSelector без namespaceSelector в списке from
# выбирает поды ТОЛЬКО своего неймспейса, а не все кластерные. Поэтому
# входящий трафик извне перечислен явно, по неймспейсам.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-ingress
  namespace: vault
spec:
  podSelector: {}
  policyTypes:
    - Ingress
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-ingress
  namespace: vault
spec:
  podSelector: {}
  policyTypes:
    - Ingress
  ingress:
    # Контроллер VSO живёт в своём неймспейсе и ходит в Vault за секретами.
    # Без этого правила — connection timeout, а не 403: podSelector из соседнего
    # неймспейса под правило не подпадает.
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: vault-secrets-operator
      ports:
        - port: 8200
          protocol: TCP
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: traefik
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitoring
          podSelector:
            matchLabels:
              app: vmagent
      ports:
        - port: 8200
          protocol: TCP

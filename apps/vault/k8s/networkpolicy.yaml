# Базовый NetworkPolicy для namespace Vault: default-deny ingress плюс явные
# разрешения. Метрики Vault скрейпит vmagent из monitoring. Egress не
# ограничивается.
#
# Первое правило (from: podSelector {}) пропускает весь трафик от любых подов
# внутри кластера — им нужен доступ к Service vault:8200. Второе оставлено для
# traefik, третье ограничивает скрейпинг метрик портом.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-ingress
  namespace: vault
spec:
  podSelector: {}
  policyTypes:
    - Ingress
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-ingress
  namespace: vault
spec:
  podSelector: {}
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector: {}
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: traefik
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitoring
          podSelector:
            matchLabels:
              app: vmagent
      ports:
        - port: 8200
          protocol: TCP

# Доказательство, что связка Vault → VSO → Kubernetes Secret работает. Не
# production-секрет: заводится специально под проверку issue #305.
#
# Значение появляется в Vault вручную после инициализации и unseal:
#
#   vault secrets enable -path=kv kv-v2
#   vault kv put kv/poc/probe answer=42
#
# Пока значения нет, статус объекта — не synced, и это ожидаемо.
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultStaticSecret
metadata:
  name: poc-probe
  namespace: vault
spec:
  vaultAuthRef: vso-reader
  mount: kv
  type: kv-v2
  path: poc/probe
  refreshAfter: 1h
  destination:
    name: poc-probe
    # create по умолчанию false: тогда VSO только обновляет уже существующий
    # Secret и не создаёт его. Для первого заполнения нужно true; overwrite
    # оставляем false — он нужен только при переезсе с другого способа
    # доставки, когда Secret уже создан кем-то ещё.
    create: true

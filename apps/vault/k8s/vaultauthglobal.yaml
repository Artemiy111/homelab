apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultAuthGlobal
metadata:
  name: vso-global
  namespace: vault-secrets-operator
spec:
  # Namespace'ы, из которых VaultAuthGlobal выдаёт токены. Список закрытый: без
  # записи здесь VaultStaticSecret в этом namespace получает отказ
  # `target namespace ... is not allowed`.
  allowedNamespaces:
    - 3x-ui
    - argocd
    - ats
    - authentik
    - beszel
    - databases
    - dawarich
    - element
    - forgejo
    - glitchtip
    - headlamp
    - home-assistant
    - immich
    - infisical
    - jellyfin
    - jitsi
    - local-ai
    - mailserver
    - monitoring
    - navidrome
    - nextcloud
    - oauth2-proxy
    - open-webui
    - paperless
    - pdf
    - postgres
    - radar
    - rustfs
    - seafile
    - sure
    - talk-hpb
    - technitium
    - uptime-kuma
    - vault
  defaultAuthMethod: kubernetes
  defaultVaultNamespace: ""
  kubernetes:
    mount: kubernetes
    audiences:
      - vault

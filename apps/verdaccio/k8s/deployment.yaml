apiVersion: apps/v1
kind: Deployment
metadata:
  name: verdaccio
  namespace: verdaccio
spec:
  # RWO-том: два пода одновременно его не смонтируют.
  strategy:
    type: Recreate
  revisionHistoryLimit: 2
  replicas: 1
  selector:
    matchLabels:
      app: verdaccio
  template:
    metadata:
      labels:
        app: verdaccio
    spec:
      securityContext:
        # fsGroup даёт групповую запись в том Longhorn под uid/gid 10001
        # (uid пользователя verdaccio в образе).
        fsGroup: 10001
      containers:
        - name: verdaccio
          image: "verdaccio/verdaccio:6.10.4@sha256:b569df40d7184f5f99082b4f805dbf648de876903a9a44c21446c0f5d0bbd41b"
          env:
            # Образ по умолчанию слушает [::]; в кластере надёжнее IPv4-any.
            - name: VERDACCIO_ADDRESS
              value: 0.0.0.0
          ports:
            - name: http
              containerPort: 4873
          startupProbe:
            httpGet:
              path: /-/ping
              port: http
            periodSeconds: 5
            failureThreshold: 30
          livenessProbe:
            httpGet:
              path: /-/ping
              port: http
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /-/ping
              port: http
            periodSeconds: 30
          securityContext:
            runAsUser: 10001
            runAsGroup: 10001
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            seccompProfile:
              type: RuntimeDefault
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: "1"
              memory: 512Mi
          volumeMounts:
            - name: config
              mountPath: /verdaccio/conf/config.yaml
              subPath: config.yaml
              readOnly: true
            - name: data
              mountPath: /verdaccio/storage
      volumes:
        - name: config
          configMap:
            name: verdaccio
        - name: data
          persistentVolumeClaim:
            claimName: verdaccio-data

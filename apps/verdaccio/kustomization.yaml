apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: verdaccio
resources:
  - k8s/namespace.yaml
  - k8s/service.yaml
  - k8s/deployment.yaml
  - k8s/data.pvc.yaml
  - k8s/networkpolicy.yaml
configMapGenerator:
  # config.yaml собирается в ConfigMap `verdaccio`; kustomize добавляет хэш
  # содержимого к имени и переписывает ссылку в Deployment, поэтому правка
  # конфига сама запускает rollout.
  - name: verdaccio
    files:
      - config/config.yaml

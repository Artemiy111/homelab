name: victoria-metrics

services:
  victoriametrics:
    image: victoriametrics/victoria-metrics:v1.150.0@sha256:54467c7764a3e6579199af1914bb779f01ce32265cd552eb5ae0d4f8a2b80a97
    container_name: victoriametrics
    # Непривилегированный uid (artlab); вместе с cap_drop: ALL это требует,
    # чтобы каталог данных был доступен на запись uid 1000 (см. init.sh).
    user: "1000:1000"
    command:
      - -storageDataPath=/data
      - -retentionPeriod=${VM_RETENTION_PERIOD:-180d}
      - -httpListenAddr=:8428
    volumes:
      - ${APPS_STORAGE_PATH:-/storage/apps}/victoria-metrics/vmdata:/data:Z

    networks:
      - traefiknet
    restart: unless-stopped

    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

  vmagent:
    image: victoriametrics/vmagent:v1.150.0@sha256:3eff5874d59292714878dcb6aee14f048bf19b7312b727860ba5e7d29e2e0c07
    container_name: vmagent
    command:
      - -promscrape.config=/etc/vmagent/scrape.yml
      - -remoteWrite.url=http://victoriametrics:8428/api/v1/write
    volumes:
      - ./config/vmagent/scrape.yml:/etc/vmagent/scrape.yml:Z,ro

    depends_on:
      - victoriametrics
    networks:
      - traefiknet
    restart: unless-stopped

    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

  grafana:
    image: grafana/grafana:13.2.0@sha256:3fd54ae1214669f8355f065ec9f6445d5279a3d77095ab048ca045685272429b
    container_name: grafana
    user: "1000:1000"

    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      # Эквивалент [feature_toggles] enable=... в grafana.ini. Индивидуальные
      # GF_FEATURE_TOGGLES_<ИМЯ> не подходят: имя флага приводится к верхнему
      # регистру и ломает camelCase (grafanaAdvisor).
      GF_FEATURE_TOGGLES_ENABLE: grafanaAdvisor
      GF_SERVER_ROOT_URL: https://grafana.${DOMAIN}
    volumes:
      - ${APPS_STORAGE_PATH:-/storage/apps}/victoria-metrics/grafana:/var/lib/grafana:Z
      - ./config/grafana/provisioning:/etc/grafana/provisioning:Z,ro

    depends_on:
      - victoriametrics
    networks:
      - traefiknet
    restart: unless-stopped

    healthcheck:
      test: [ "CMD", "curl", "-fsS", "http://127.0.0.1:3000/api/health" ]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 60s

    labels:
      - traefik.enable=true
      - traefik.http.routers.grafana.rule=Host(`grafana.${DOMAIN}`)
      - traefik.http.routers.grafana.entrypoints=websecure
      - traefik.http.routers.grafana.middlewares=oauth2-proxy@file,secure-headers@file,ratelimit-default@file
      - traefik.http.services.grafana.loadbalancer.server.port=3000
      - traefik.docker.network=traefiknet

    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

networks:
  traefiknet:
    external: true

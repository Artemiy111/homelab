# Мост k8s → Docker: Gatus ходит по именам `victoriametrics`, `vmagent`,
# `grafana`, трафик уходит на docker-контейнеры через порты, опубликованные на
# шлюзе traefiknet (см. `ports` в apps/victoria-metrics/compose.yaml). При
# миграции сервисов в k8s заменить EndpointSlice на selector — имена и порты
# для Gatus не меняются.
apiVersion: v1
kind: Service
metadata:
  name: victoriametrics
  namespace: default
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 80
      targetPort: http
      protocol: TCP
---
apiVersion: discovery.k8s.io/v1
kind: EndpointSlice
metadata:
  name: victoriametrics-bridge
  namespace: default
  labels:
    kubernetes.io/service-name: victoriametrics
addressType: IPv4
ports:
  - name: http
    port: 18083
    protocol: TCP
endpoints:
  - addresses:
      - 172.20.0.1
    conditions:
      ready: true
---
apiVersion: v1
kind: Service
metadata:
  name: vmagent
  namespace: default
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 80
      targetPort: http
      protocol: TCP
---
apiVersion: discovery.k8s.io/v1
kind: EndpointSlice
metadata:
  name: vmagent-bridge
  namespace: default
  labels:
    kubernetes.io/service-name: vmagent
addressType: IPv4
ports:
  - name: http
    port: 18084
    protocol: TCP
endpoints:
  - addresses:
      - 172.20.0.1
    conditions:
      ready: true
---
apiVersion: v1
kind: Service
metadata:
  name: grafana
  namespace: default
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 80
      targetPort: http
      protocol: TCP
---
apiVersion: discovery.k8s.io/v1
kind: EndpointSlice
metadata:
  name: grafana-bridge
  namespace: default
  labels:
    kubernetes.io/service-name: grafana
addressType: IPv4
ports:
  - name: http
    port: 18082
    protocol: TCP
endpoints:
  - addresses:
      - 172.20.0.1
    conditions:
      ready: true

apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: victoria-metrics
  namespace: monitoring
spec:
  parentRefs:
    - name: homelab
      namespace: traefik
      sectionName: https
  hostnames:
    - vm.biplane.v6.rocks
  rules:
    - backendRefs:
        # Имя Service — без дефиса, как в victoriametrics.service.yaml. Здесь
        # стояло victoria-metrics, и Traefik не находил бэкенд: 500 с
        # OriginStatus 0. Имя самого HTTPRoute остаётся с дефисом — оно в
        # идентификаторе ресурса.
        - name: victoriametrics
          port: 80
          filters:
            - type: ExtensionRef
              extensionRef:
                group: traefik.io
                kind: Middleware
                name: oauth2-proxy
            - type: ExtensionRef
              extensionRef:
                group: traefik.io
                kind: Middleware
                name: secure-headers
            - type: ExtensionRef
              extensionRef:
                group: traefik.io
                kind: Middleware
                name: ratelimit-default

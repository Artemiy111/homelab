# Доступ VSO к креденшелам мониторинга, которые выпустили другие сервисы.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: vso-vmagent
  namespace: monitoring
---
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultAuth
metadata:
  name: vso-vmagent
  namespace: monitoring
spec:
  vaultAuthGlobalRef:
    name: vso-global
    namespace: vault-secrets-operator
  kubernetes:
    role: vmagent
    serviceAccount: vso-vmagent

# Кред, который uptime-kuma выпустил для скрейпа своих метрик.
#
# Путь в Vault — kv/uptime-kuma/x/monitoring/... : по ADR 0006 секрет,
# выданный внешнему потребителю, лежит под сегментом x/<потребитель>, и
# префикс остаётся в домене выдавшего. Политика vmagent получает доступ к
# этому точному пути, а не к префиксу uptime-kuma целиком.
#
# Имя цели отличается от Secret `vmagent` от SealedSecret: два контроллера,
# пишущие в один Secret, конфликтуют. Остальные семь ключей vmagent пока
# приходят из SealedSecret, поэтому деплоймент ссылается на два Secret-а.
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultStaticSecret
metadata:
  name: vmagent-uptime-kuma
  namespace: monitoring
spec:
  vaultAuthRef: vso-vmagent
  mount: kv
  type: kv-v2
  path: uptime-kuma/x/monitoring/uptime-kuma-metrics-api-key
  refreshAfter: 1h
  destination:
    name: vmagent-vault
    # create по умолчанию false: тогда VSO только обновляет уже существующий
    # Secret и не создаёт его.
    create: true
  hmacSecretData: true

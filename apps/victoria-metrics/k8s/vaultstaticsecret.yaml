# Креды, которые vmagent читает у других сервисов. По одному VaultStaticSecret на
# путь: два объекта на один destination затирали бы ключи друг друга.

apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultStaticSecret
metadata:
  name: vmagent-uptime-kuma
  namespace: monitoring
spec:
  vaultAuthRef: vso-vmagent
  mount: kv
  type: kv-v2
  path: uptime-kuma/@monitoring/uptime-kuma-metrics-api-key
  refreshAfter: 1h
  destination:
    name: vmagent-uptime-kuma
    create: true
    overwrite: true
    transformation:
      excludeRaw: true
---

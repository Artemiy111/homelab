apiVersion: apps/v1
kind: Deployment
metadata:
  name: victoriametrics
  namespace: monitoring
spec:
  # RWO-том vmdata: два пода при rolling update пишут в один каталог.
  strategy:
    type: Recreate
  revisionHistoryLimit: 2
  replicas: 1
  selector:
    matchLabels:
      app: victoriametrics
  template:
    metadata:
      labels:
        app: victoriametrics
    spec:
      enableServiceLinks: false
      # fsGroup даёт групповую запись в том Longhorn, иначе root-owned каталог
      # тома недоступен пользователю 1000.
      securityContext:
        fsGroup: 1000
      containers:
        - name: victoriametrics
          image: "victoriametrics/victoria-metrics:v1.150.0@sha256:54467c7764a3e6579199af1914bb779f01ce32265cd552eb5ae0d4f8a2b80a97"
          args:
            - -storageDataPath=/data
            # 180d несовместимо с томом 20Gi при росте ~0.36 GiB/сутки:
            # потребовалось бы ~65 GiB. 30d ≈ 11 GiB — влезает с запасом.
            - -retentionPeriod=30d
            # Порог, ниже которого storage перестаёт принимать новые данные
            # (данные не удаляются — для single-node перенаправлять некуда).
            # По умолчанию 100 МБ, то есть фактически срабатывал бы неявно.
            - -storage.minFreeDiskSpaceBytes=2GiB
            - -httpListenAddr=:8428
          ports:
            - name: http
              containerPort: 8428
          env:
            - name: TZ
              valueFrom:
                configMapKeyRef:
                  name: homelab-config
                  key: TZ
          startupProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 5
            failureThreshold: 30
          livenessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          securityContext:
            runAsUser: 1000
            runAsGroup: 1000
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            seccompProfile:
              type: RuntimeDefault
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "2"
              memory: 2Gi
          volumeMounts:
            - name: vmdata
              mountPath: /data
      volumes:
        - name: vmdata
          persistentVolumeClaim:
            claimName: victoriametrics-vmdata

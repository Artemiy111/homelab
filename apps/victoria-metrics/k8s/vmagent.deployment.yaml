apiVersion: apps/v1
kind: Deployment
metadata:
  name: vmagent
  namespace: monitoring
spec:
  replicas: 1
  selector:
    matchLabels:
      app: vmagent
  strategy:
    type: Recreate
  revisionHistoryLimit: 2
  template:
    metadata:
      labels:
        app: vmagent
    spec:
      serviceAccountName: vmagent
      enableServiceLinks: false
      containers:
        - name: vmagent
          image: "victoriametrics/vmagent:v1.150.0@sha256:3eff5874d59292714878dcb6aee14f048bf19b7312b727860ba5e7d29e2e0c07"
          args:
            - -promscrape.config=/etc/vmagent/scrape.yml
            - -remoteWrite.url=http://victoriametrics:8428/api/v1/write
          ports:
            - name: http
              containerPort: 8429
          # Креды scrape-целей: vmagent подставляет %{VAR} из окружения в
          # -promscrape.config. Секреты не хранятся в scrape.yml в Git.
          env:
            - name: TZ
              valueFrom:
                configMapKeyRef:
                  name: homelab-config
                  key: TZ
            - name: DOMAIN
              valueFrom:
                configMapKeyRef:
                  name: homelab-config
                  key: DOMAIN
            - name: UPTIME_KUMA_METRICS_API_KEY
              valueFrom:
                secretKeyRef:
                  name: vmagent
                  key: UPTIME_KUMA_METRICS_API_KEY
            - name: NAVIDROME_METRICS_PATH
              valueFrom:
                secretKeyRef:
                  name: vmagent
                  key: NAVIDROME_METRICS_PATH
            - name: DAWARICH_METRICS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: vmagent
                  key: DAWARICH_METRICS_PASSWORD
            - name: FORGEJO_METRICS_TOKEN
              valueFrom:
                secretKeyRef:
                  name: vmagent
                  key: FORGEJO_METRICS_TOKEN
            - name: TECHNITIUM_METRICS_TOKEN
              valueFrom:
                secretKeyRef:
                  name: vmagent
                  key: TECHNITIUM_METRICS_TOKEN
            - name: STALWART_METRICS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: vmagent
                  key: STALWART_METRICS_PASSWORD
            - name: LOCALAI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: vmagent
                  key: LOCALAI_API_KEY
            - name: HOME_ASSISTANT_TOKEN
              valueFrom:
                secretKeyRef:
                  name: vmagent
                  key: HOME_ASSISTANT_TOKEN
          resources:
            limits:
              cpu: "1"
              memory: 512Mi
            requests:
              cpu: 50m
              memory: 128Mi
          volumeMounts:
            - name: scrape-config
              readOnly: true
              mountPath: /etc/vmagent
          livenessProbe:
            httpGet:
              path: /health
              port: http
            timeoutSeconds: 5
            periodSeconds: 30
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: http
            timeoutSeconds: 5
            periodSeconds: 30
            failureThreshold: 3
          startupProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
            failureThreshold: 30
          securityContext:
            capabilities:
              drop: ["ALL"]
            allowPrivilegeEscalation: false
            runAsUser: 0
            runAsGroup: 0
            seccompProfile:
              type: RuntimeDefault
      volumes:
        - name: scrape-config
          configMap:
            name: vmagent-scrape

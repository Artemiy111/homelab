apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: victoriametrics-vmdata
  namespace: monitoring
spec:
  storageClassName: longhorn-retain
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      # При retentionPeriod=30d и измеренном росте ~0.36 GiB/сутки данные
      # занимают ~11 GiB. 20 Gi — это ~45 суток запаса плюс место под
      # периодическую дедупликацию, которой временно нужно столько же, сколько
      # занимает предыдущий месяц. Расширение онлайн: longhorn-retain имеет
      # allowVolumeExpansion: true.
      storage: 20Gi

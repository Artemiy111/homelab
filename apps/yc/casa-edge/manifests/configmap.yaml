apiVersion: v1
kind: ConfigMap
metadata:
  name: casa-edge-haproxy
  namespace: casa-edge
data:
  haproxy.cfg: |
    global
      maxconn 2048

    defaults
      mode tcp
      timeout connect 5s
      timeout client 1h
      timeout server 1h
      timeout tunnel 1h

    frontend edge
      bind :8443
      stick-table type ip size 20k expire 1m store conn_rate(10s),conn_cur
      tcp-request connection track-sc0 src
      tcp-request connection reject if { sc_conn_rate(0) gt 30 } || { sc_conn_cur(0) gt 20 }
      default_backend ingress

    backend ingress
      server ingress "${CASA_EDGE_TARGET}" send-proxy-v2

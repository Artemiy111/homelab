apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: casa-edge
  namespace: casa-edge
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: casa-edge
  template:
    metadata:
      labels:
        app.kubernetes.io/name: casa-edge
    spec:
      hostNetwork: true
      dnsPolicy: Default
      automountServiceAccountToken: false
      priorityClassName: system-node-critical
      tolerations:
        - operator: Exists
      containers:
        - name: socat
          image: alpine/socat:1.8.1.3
          command:
            - /bin/sh
            - -c
            - exec socat -d TCP-LISTEN:443,fork,reuseaddr TCP:${CASA_EDGE_TARGET}
          env:
            - name: CASA_EDGE_TARGET
              valueFrom:
                secretKeyRef:
                  name: casa-edge-target
                  key: target
          ports:
            - name: https
              containerPort: 443
              protocol: TCP
          readinessProbe:
            tcpSocket:
              port: https
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: https
            periodSeconds: 20
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              memory: 32Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
              add: ["NET_BIND_SERVICE"]

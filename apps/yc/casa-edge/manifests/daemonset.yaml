apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: casa-edge
  namespace: casa-edge
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: casa-edge
  template:
    metadata:
      labels:
        app.kubernetes.io/name: casa-edge
    spec:
      hostNetwork: true
      dnsPolicy: Default
      automountServiceAccountToken: false
      priorityClassName: system-node-critical
      tolerations:
        - operator: Exists
      containers:
        - name: haproxy
          image: haproxy:3.2-alpine
          args:
            - -W
            - -db
            - -f
            - /etc/haproxy/haproxy.cfg
          env:
            - name: CASA_EDGE_TARGET
              valueFrom:
                secretKeyRef:
                  name: casa-edge-target
                  key: target
          ports:
            - name: https
              containerPort: 8443
              protocol: TCP
            - name: https-legacy
              containerPort: 443
              protocol: TCP
          readinessProbe:
            tcpSocket:
              port: https
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: https
            periodSeconds: 20
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 64Mi
          securityContext:
            runAsUser: 0
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
              add: ["NET_BIND_SERVICE"]
          volumeMounts:
            - name: config
              mountPath: /etc/haproxy
              readOnly: true
      volumes:
        - name: config
          configMap:
            name: casa-edge-haproxy

apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: casa-edge
  namespace: casa-edge
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: casa-edge
  template:
    metadata:
      labels:
        app.kubernetes.io/name: casa-edge
    spec:
      hostNetwork: true
      dnsPolicy: Default
      automountServiceAccountToken: false
      priorityClassName: system-node-critical
      tolerations:
        - operator: Exists
      containers:
        - name: haproxy
          image: haproxy:3.2-alpine
          command:
            - /bin/sh
            - -c
          args:
            - |
              CASA_EDGE_TURN_TARGET="${CASA_EDGE_TARGET%:*}:5349"
              export CASA_EDGE_TURN_TARGET
              exec haproxy -W -db -f /etc/haproxy/haproxy.cfg
          env:
            - name: CASA_EDGE_TARGET
              valueFrom:
                secretKeyRef:
                  name: casa-edge-target
                  key: target
            - name: NODE_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.hostIP
          ports:
            - name: https
              containerPort: 8443
              protocol: TCP
          readinessProbe:
            tcpSocket:
              port: https
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: https
            periodSeconds: 20
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 64Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: config
              mountPath: /etc/haproxy
              readOnly: true
      volumes:
        - name: config
          configMap:
            name: casa-edge-haproxy

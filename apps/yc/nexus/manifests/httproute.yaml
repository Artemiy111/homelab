apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: nexus
  namespace: nexus
spec:
  parentRefs:
    - name: yc
      namespace: envoy-gateway-system
  hostnames:
    - nexus.yc.clusters.biplane.casa
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: nexus
          port: 8081

apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: test-nginx
  namespace: test-nginx
spec:
  parentRefs:
    - name: yc
      namespace: envoy-gateway-system
  hostnames:
    - test-nginx.yc.clusters.biplane.casa
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: test-nginx
          port: 80

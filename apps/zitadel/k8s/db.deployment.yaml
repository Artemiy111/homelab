apiVersion: apps/v1
kind: Deployment
metadata:
  name: zitadel-postgres
  namespace: default
spec:
  # hostPath-каталоги нельзя монтировать в два пода одновременно.
  strategy:
    type: Recreate
  revisionHistoryLimit: 2
  replicas: 1
  selector:
    matchLabels:
      app: zitadel-postgres
  template:
    metadata:
      labels:
        app: zitadel-postgres
    spec:
      enableServiceLinks: false
      containers:
        - name: postgres
          image: "postgres:18-alpine@sha256:d3e1620b530c944afa6e887d22eb899824da68e19c52024bf98f5220c88a65b2"
          ports:
            - name: postgres
              containerPort: 5432
          env:
            - name: POSTGRES_DB
              value: zitadel
            - name: POSTGRES_USER
              value: postgres
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: zitadel
                  key: POSTGRES_ADMIN_PASSWORD
            - name: POSTGRES_ZITADEL_USER
              value: zitadel
            - name: POSTGRES_ZITADEL_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: zitadel
                  key: POSTGRES_ZITADEL_PASSWORD
            - name: TZ
              valueFrom:
                configMapKeyRef:
                  name: homelab-config
                  key: TZ
          startupProbe:
            exec:
              command: ["pg_isready", "-d", "zitadel", "-U", "postgres"]
            initialDelaySeconds: 15
            periodSeconds: 5
            failureThreshold: 30
          livenessProbe:
            exec:
              command: ["pg_isready", "-d", "zitadel", "-U", "postgres"]
            periodSeconds: 30
            timeoutSeconds: 5
          readinessProbe:
            exec:
              command: ["pg_isready", "-d", "zitadel", "-U", "postgres"]
            periodSeconds: 10
            timeoutSeconds: 5
          securityContext:
            runAsUser: 70
            runAsGroup: 70
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            seccompProfile:
              type: RuntimeDefault
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 512Mi
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql
            - name: initdb
              mountPath: /docker-entrypoint-initdb.d
              readOnly: true
            - name: dshm
              mountPath: /dev/shm
      volumes:
        - name: data
          hostPath:
            path: /storage/apps/zitadel/postgresql
            type: Directory
        - name: initdb
          hostPath:
            path: /home/artlab/projects/homelab/apps/zitadel/initdb
            type: Directory
        - name: dshm
          emptyDir:
            medium: Memory
            sizeLimit: 128Mi

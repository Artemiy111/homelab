apiVersion: apps/v1
kind: Deployment
metadata:
  name: zot
  namespace: zot
spec:
  replicas: 1
  selector:
    matchLabels:
      app: zot
  template:
    metadata:
      labels:
        app: zot
    spec:
      containers:
        - name: zot
          image: "ghcr.io/project-zot/zot:v2.1.21@sha256:6b69512c00dceaad05b1144e6079aac6aa7309d7fd200f9947ecb1de09cf48c8"
          args:
            - serve
            - /etc/zot/config.json
          ports:
            - name: http
              containerPort: 5000
          resources:
            limits:
              cpu: "1"
              memory: 1Gi
            requests:
              cpu: 50m
              memory: 128Mi
          volumeMounts:
            - name: config
              readOnly: true
              mountPath: /etc/zot/config.json
              subPath: config.json
            - name: data
              mountPath: /var/lib/zot
          livenessProbe:
            tcpSocket:
              port: http
            periodSeconds: 30
          readinessProbe:
            tcpSocket:
              port: http
            periodSeconds: 30
          # /v2/ и /metrics при anonymous-only политике отдают 403, поэтому
          # проба — по TCP, а не HTTP.
          startupProbe:
            tcpSocket:
              port: http
            periodSeconds: 5
          securityContext:
            capabilities:
              drop: ["ALL"]
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            seccompProfile:
              type: RuntimeDefault
      volumes:
        - name: config
          configMap:
            name: zot
        - name: data
          persistentVolumeClaim:
            claimName: zot-data
      securityContext:
        # fsGroup даёт групповую запись в том Longhorn под uid/gid 1000.
        fsGroup: 1000
  # RWO-том: два пода одновременно его не смонтируют.
  strategy:
    type: Recreate
  revisionHistoryLimit: 2

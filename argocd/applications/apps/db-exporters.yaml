# db-exporters раскладывает экспортёры по чужим namespace: dawarich, element,
# glitchtip, immich, infisical, nextcloud, paperless, seafile, sure,
# uptime-kuma. Поэтому у Kustomization нет поля namespace, а у каждого
# манифеста namespace задан явно, и destination.namespace здесь — только
# значение по умолчанию для ресурсов без него.
#
# prune: true — все одиннадцать экспортёров stateless, PVC у них нет, и
# удалённый из git экспортёр должен исчезнуть и из кластера.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: db-exporters
  namespace: argocd
spec:
  project: homelab
  sources:
    - repoURL: ssh://git@forgejo.biplane.casa:2222/artemiy/homelab.git
      targetRevision: main
      path: apps/db-exporters
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - ServerSideApply=true
    retry:
      limit: 5
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 3m
# DNS-01 webhook-солвер для cert-manager (packages/cert-manager-webhook-dns01).
#
# Ставится из OCI-чарта, который публикует CI этого репозитория в контейнерный
# реестр Forgejo. Пакеты публичные — чарт и образ тянутся анонимно, поэтому ни
# repo-creds, ни imagePullSecret не нужны.
#
# repoURL для OCI указывается БЕЗ префикса `oci://` — так его ждёт Argo.
#
# Реестр живёт на том же имени, что и веб-Forgejo, и сертификат на него покрыт
# wildcard'ом Let's Encrypt из clusterissuers.yaml. Схему с HTTPS обязывает сам
# Argo: OCI-клиент не ходит по http.
#
# groupName обязан совпадать с webhookGroupName в platform/homelab/values.yaml
# (оттуда его берёт ClusterIssuer), а provider — с полем provider в
# certManager.zones этого же файла.
#
# Секреты обоих провайдеров необязательны: webhook поднимается без них и падает
# только тот challenge, у чьего провайдера нет credentials.
#
# Вебхук-чарт сам создаёт self-signed CA и serving-сертификат и APIService.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: dns01-webhook
  namespace: argocd
spec:
  project: upstream
  source:
    repoURL: forgejo.biplane.v6.rocks/artemiy/charts
    chart: cert-manager-webhook-dns01
    targetRevision: 0.5.0
    helm:
      releaseName: dns01-webhook
      valuesObject:
        groupName: acme.homelab.local
        resources:
          requests:
            memory: 64Mi
          limits:
            memory: 160Mi
        image:
          repository: forgejo.biplane.v6.rocks/artemiy/cert-manager-webhook-dns01
          tag: 0.5.0
        provider:
          dynv6:
            existingSecret: dns01-webhook-dynv6-token
          spaceship:
            existingSecret: dns01-webhook-spaceship
            # Учётная запись прокси: логин и пароль разными ключами из Vault,
            # URL собирается в поде. Прокси привязан к провайдеру: dynv6 через
            # него не ходит. WAF Spaceship отвечает 403 на запросы из сети
            # стенда, поэтому API провайдера доступен только так.
            egressSecret: dns01-webhook-egress
            proxyURL: http://$(XUI_EGRESS_USERNAME):$(XUI_EGRESS_PASSWORD)@xui-egress.3x-ui.svc.cluster.local:8440
  destination:
    server: https://kubernetes.default.svc
    namespace: cert-manager
  syncPolicy:
    syncOptions:
      - ServerSideApply=true
      - CreateNamespace=true
    automated:
      selfHeal: true

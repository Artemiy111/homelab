# DNS-01 webhook-солвер для cert-manager (packages/cert-manager-webhook-dns01).
#
# Ставится из OCI-чарта, который публикует CI этого репозитория в контейнерный
# реестр Forgejo. Пакеты публичные — чарт и образ тянутся анонимно, поэтому ни
# repo-creds, ни imagePullSecret не нужны.
#
# repoURL для OCI указывается БЕЗ префикса `oci://` — так его ждёт Argo.
#
# Хост реестра — environment-specific: в этом шаблоне плейсхолдер, реальное
# значение — в untracked dns01-webhook.private.yaml (merge-patch), см.
# argocd/README.md.
#
# groupName обязан совпадать с webhookGroupName в platform/homelab/values.yaml
# (оттуда его берёт ClusterIssuer).
#
# Вебхук-чарт сам создаёт self-signed CA и serving-сертификат и APIService.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: dns01-webhook
  namespace: argocd
spec:
  project: default
  source:
    repoURL: forgejo.example.com/artemiy/charts
    chart: cert-manager-webhook-dns01
    targetRevision: 0.1.1
    helm:
      releaseName: dns01-webhook
      valuesObject:
        groupName: acme.homelab.local
        image:
          repository: forgejo.example.com/artemiy/cert-manager-webhook-dns01
          tag: 0.1.1
        provider:
          existingSecret: dns01-webhook-token
  destination:
    server: https://kubernetes.default.svc
    namespace: cert-manager
  syncPolicy:
    syncOptions:
      - ServerSideApply=true
      - CreateNamespace=true
    automated:
      selfHeal: true

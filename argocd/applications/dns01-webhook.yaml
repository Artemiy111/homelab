# DNS-01 webhook-солвер для cert-manager (packages/cert-manager-webhook-dns01).
#
# Ставится из OCI-чарта, который публикует CI этого репозитория в контейнерный
# реестр Forgejo. Пакеты публичные — чарт и образ тянутся анонимно, поэтому ни
# repo-creds, ни imagePullSecret не нужны.
#
# repoURL для OCI указывается БЕЗ префикса `oci://` — так его ждёт Argo.
#
# Хост реестра — внутренний, из зоны homelab.internal (terraform/technitium).
# В отличие от публичного домена имя нечувствительное, поэтому в git живёт
# открытым текстом, и private-файл приложению больше не нужен.
#
# Схему с HTTPS обязывает сам Argo: OCI-клиент не ходит по http, а LE внутреннее
# имя не выдаёт. Сертификат выпускает наш CA (platform/homelab, internal-ca.yaml).
#
# groupName обязан совпадать с webhookGroupName в platform/homelab/values.yaml
# (оттуда его берёт ClusterIssuer).
#
# Вебхук-чарт сам создаёт self-signed CA и serving-сертификат и APIService.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: dns01-webhook
  namespace: argocd
spec:
  project: default
  source:
    repoURL: forgejo.homelab.internal/artemiy/charts
    chart: cert-manager-webhook-dns01
    targetRevision: 0.1.1
    helm:
      releaseName: dns01-webhook
      valuesObject:
        groupName: acme.homelab.local
        resources:
          requests:
            memory: 64Mi
          limits:
            memory: 160Mi
        image:
          repository: forgejo.homelab.internal/artemiy/cert-manager-webhook-dns01
          tag: 0.1.1
        provider:
          existingSecret: dns01-webhook-token
  destination:
    server: https://kubernetes.default.svc
    namespace: cert-manager
  syncPolicy:
    syncOptions:
      - ServerSideApply=true
      - CreateNamespace=true
    automated:
      selfHeal: true

# DNS-01 webhook-солвер для cert-manager (packages/cert-manager-webhook-dns01).
#
# Ставится из OCI-чарта, который публикует CI этого репозитория в контейнерный
# реестр Forgejo. Пакеты публичные — чарт и образ тянутся анонимно, поэтому ни
# repo-creds, ни imagePullSecret не нужны.
#
# repoURL для OCI указывается БЕЗ префикса `oci://` — так его ждёт Argo.
#
# Реестр живёт на том же имени, что и веб-Forgejo, и сертификат на него покрыт
# wildcard'ом Let's Encrypt из clusterissuers.yaml. Схему с HTTPS обязывает сам
# Argo: OCI-клиент не ходит по http.
#
# groupName обязан совпадать с webhookGroupName в platform/homelab/values.yaml
# (оттуда его берёт ClusterIssuer), а provider — с полем provider в
# certManager.zones этого же файла.
#
# Секреты обоих провайдеров необязательны: webhook поднимается без них и падает
# только тот challenge, у чьего провайдера нет credentials.
#
# Значения вынесены из `spec.source.helm.valuesObject` в
# `platform/dns01-webhook/values.yaml`, Application подключает их через
# `$values` — второй источник в `spec.sources`.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: dns01-webhook
  namespace: argocd
spec:
  project: upstream
  sources:
    - repoURL: forgejo.biplane.v6.rocks/artemiy/charts
      chart: cert-manager-webhook-dns01
      targetRevision: 0.5.0
      helm:
        releaseName: dns01-webhook
        valueFiles:
          - $values/platform/dns01-webhook/values.yaml
    - repoURL: ssh://git@forgejo.biplane.v6.rocks:2222/artemiy/homelab.git
      targetRevision: main
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: cert-manager
  syncPolicy:
    syncOptions:
      - ServerSideApply=true
      - CreateNamespace=true
    automated:
      selfHeal: true

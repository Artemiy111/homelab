# ECK-оператор (Elastic Cloud on Kubernetes) — официальный способ ставить
# Elasticsearch/Kibana в кластер через CRD.
#
# helm.elastic.co отдаёт 403 на .tgz (CDN-блок для нашего IP), поэтому чарт берём
# из git Elastic по path: CRD лежат в сабчарте eck-operator-crds/templates и
# рендерятся вместе с чартом. Имя Application = releaseName (Argo ставит
# app.kubernetes.io/instance по имени Application; задавать releaseName нельзя —
# сломает селекторы чарта).
#
# Значения вынесены из `spec.source.helm.valuesObject` в
# `platform/eck-operator/values.yaml`, Application подключает их через
# `$values` — второй источник в `spec.sources`.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: eck-operator
  namespace: argocd
spec:
  project: upstream
  sources:
    - repoURL: https://github.com/elastic/cloud-on-k8s.git
      path: deploy/eck-operator
      targetRevision: v3.5.0
      helm:
        valueFiles:
          - $values/platform/eck-operator/values.yaml
    - repoURL: ssh://git@forgejo.biplane.v6.rocks:2222/artemiy/homelab.git
      targetRevision: main
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: elastic-system
  syncPolicy:
    syncOptions:
      - CreateNamespace=true
      - Prune=false
    automated:
      selfHeal: true

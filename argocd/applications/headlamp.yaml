apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: headlamp
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://kubernetes-sigs.github.io/headlamp/
    chart: headlamp
    targetRevision: 0.45.0
    helm:
      releaseName: headlamp
      valuesObject:
        resources:
          requests:
            memory: 64Mi
          limits:
            memory: 128Mi
        # Дефолтный CRB чарта (clusterRoleBinding.create: true) выдаёт
        # cluster-admin сервис-аккаунту ПОДА (headlamp). Под остаётся
        # бесправным, а права приходят из OIDC-токена пользователя.
        clusterRoleBinding:
          create: false
        config:
          oidc:
            # clientSecret приходит из Secret через envFrom, clientID — тоже:
            # он известен только после создания приложения в Zitadel.
            secret:
              create: false
            externalSecret:
              enabled: true
              name: headlamp-oidc
        # issuer и scopes не секреты, поэтому задаются здесь, а не в Vault.
        # Здесь плейсхолдер: реальный домен приезжает из untracked
        # argocd/applications/headlamp.private.yaml (см. argocd/README.md).
        env:
          - name: OIDC_ISSUER_URL
            value: https://id.example.com
          - name: OIDC_SCOPES
            value: openid,profile,email
  destination:
    server: https://kubernetes.default.svc
    namespace: headlamp
  syncPolicy:
    syncOptions:
      - ServerSideApply=true
      - CreateNamespace=true
    automated:
      selfHeal: true

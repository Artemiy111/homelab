apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: headlamp
  namespace: argocd
spec:
  project: default
  # valuesObject здесь нет намеренно: у Argo `valueFiles` имеет низший приоритет
  # и не перекрыл бы ключ, оставшийся в valuesObject, — значение из приватного
  # репозитория просто не применилось бы. Поэтому values лежат целиком в
  # приватном репозитории и приезжают одним файлом (docs/adr/0008, #641).
  sources:
    - repoURL: https://kubernetes-sigs.github.io/headlamp/
      chart: headlamp
      targetRevision: 0.45.0
      helm:
        releaseName: headlamp
        valueFiles:
          - $values/argocd/headlamp/values.yaml
        # Secret с приватной половиной read-only deploy key, namespace argocd.
        repoCreds:
          - homelab-values-repo
    # Второй источник — репозиторий внутренних значений, ref: values
    # сопоставляется с $values. Без ref Argo попытался бы применять манифесты
    # оттуда, а не только читать values. service-DNS, потому что читает
    # repo-server, то есть потребитель внутри кластера.
    - repoURL: ssh://git@forgejo-ssh.forgejo.svc.cluster.local:2222/artemiy/homelab-values
      targetRevision: main
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: headlamp
  syncPolicy:
    syncOptions:
      - ServerSideApply=true
      - CreateNamespace=true
    automated:
      selfHeal: true

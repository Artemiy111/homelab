apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: headlamp
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://kubernetes-sigs.github.io/headlamp/
    chart: headlamp
    targetRevision: 0.45.0
    helm:
      releaseName: headlamp
      valuesObject:
        # Дефолтный CRB чарта (clusterRoleBinding.create: true) выдаёт
        # cluster-admin сервис-аккаунту ПОДА (headlamp). Под должен быть
        # бесправным, поэтому чартовый CRB выключен, а cluster-admin выдаётся
        # отдельному логин-аккаунту headlamp-admin ниже.
        clusterRoleBinding:
          create: false
        extraManifests:
          - |
            apiVersion: v1
            kind: ServiceAccount
            metadata:
              name: headlamp-admin
              namespace: headlamp
          - |
            apiVersion: rbac.authorization.k8s.io/v1
            kind: ClusterRoleBinding
            metadata:
              name: headlamp-admin
            roleRef:
              apiGroup: rbac.authorization.k8s.io
              kind: ClusterRole
              name: cluster-admin
            subjects:
              - kind: ServiceAccount
                name: headlamp-admin
                namespace: headlamp
          - |
            apiVersion: v1
            kind: Secret
            metadata:
              name: headlamp-admin-token
              namespace: headlamp
              annotations:
                kubernetes.io/service-account.name: headlamp-admin
            type: kubernetes.io/service-account-token
  destination:
    server: https://kubernetes.default.svc
    namespace: headlamp
  # Контроллер service-account сам дописывает в token-Secret поля data и
  # аннотацию uid. Без этого Argo сравнивал бы их с пустым desired и висел
  # в OutOfSync.
  ignoreDifferences:
    - group: ""
      kind: Secret
      name: headlamp-admin-token
      namespace: headlamp
      jsonPointers:
        - /data
        - /metadata/annotations/kubernetes.io~1service-account.uid
  syncPolicy:
    syncOptions:
      - ServerSideApply=true
      - CreateNamespace=true
    automated:
      selfHeal: true

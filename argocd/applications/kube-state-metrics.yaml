# kube-state-metrics через Argo CD: состояние объектов кластера (Deployment,
# Pod, Job, PVC и т.д.) как метрики kube_* — их не дают node-exporter и
# cAdvisor. Ставим официальным чартом prometheus-community: ClusterRole,
# Service и обновления — на апстриме.
#
# Этот компонент боевой (его скрейпит vmagent), а Argo сейчас пробный стенд
# (целевой GitOps — Flux, см. argocd/README.md). Держать его ТОЛЬКО под
# Argo: не дублировать манифестами для Flux, иначе два контроллера начнут
# спорить за одни объекты.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kube-state-metrics
  namespace: argocd
spec:
  project: default
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  source:
    repoURL: https://prometheus-community.github.io/helm-charts
    targetRevision: 8.5.0
    chart: kube-state-metrics
    helm:
      releaseName: kube-state-metrics
      valuesObject:
        tolerations:
          - operator: Exists
        resources:
          limits:
            cpu: "1"
            memory: 512Mi
          requests:
            cpu: 50m
            memory: 128Mi
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true

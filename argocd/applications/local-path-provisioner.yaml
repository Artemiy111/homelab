# local-path-provisioner — дефолтный StorageClass кластера: PVC без явного
# storageClassName биндятся к нему. Официальный чарт из репозитория проекта
# (каталог deploy/chart/local-path-provisioner), Argo рендерит его сам.
#
# Значения вынесены из `spec.source.helm.valuesObject` в
# `platform/local-path-provisioner/values.yaml`, Application подключает их через
# `$values` — второй источник в `spec.sources`.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: local-path-provisioner
  namespace: argocd
spec:
  project: upstream
  sources:
    - repoURL: https://github.com/rancher/local-path-provisioner.git
      path: deploy/chart/local-path-provisioner
      targetRevision: v0.0.37
      helm:
        releaseName: local-path-provisioner
        valueFiles:
          - $values/platform/local-path-provisioner/values.yaml
    - repoURL: ssh://git@forgejo.biplane.casa:2222/artemiy/homelab.git
      targetRevision: main
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: local-path-storage
  syncPolicy:
    syncOptions:
      - CreateNamespace=true
    automated:
      prune: true
      selfHeal: true
# local-path-provisioner: динамический StorageClass на локальном диске ноды.
# k0s, в отличие от k3s, провижионер не содержит — без него PVC остаются Pending.
# Чарт не опубликован в Helm-репозиторий, поэтому источник — git Rancher + path.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: local-path-provisioner
  namespace: argocd
spec:
  project: default
  destination:
    server: https://kubernetes.default.svc
    namespace: local-path-storage
  source:
    repoURL: https://github.com/rancher/local-path-provisioner.git
    targetRevision: v0.0.37
    path: deploy/chart/local-path-provisioner
    helm:
      releaseName: local-path-provisioner
      valuesObject:
        resources:
          limits:
            cpu: "1"
            memory: 256Mi
          requests:
            cpu: 50m
            memory: 64Mi
        nodePathMap:
          - node: DEFAULT_PATH_FOR_NON_LISTED_NODES
            paths:
              - /storage/apps/k8s/local-path
        storageClass:
          # Дефолтный класс: PVC без явного storageClassName тоже биндится.
          defaultClass: true
          # Teardown-скрипт провижионера — `rm -rf "$VOL_DIR"`, поэтому Delete
          # сносит данные вместе с PVC. Retain оставляет PV в Released: каталог
          # на диске цел, вернуть его можно, пересоздав PVC с тем же именем.
          reclaimPolicy: Retain
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true

# Longhorn — CSI-хранилище: снапшоты, бэкапы в S3, RWX через share-manager, UI.
# Ставится официальным чартом из charts.longhorn.io; Argo рендерит его сам
# (см. argocd/README.md). Default StorageClass в кластере остаётся local-path —
# классы Longhorn описываются явно в platform/longhorn/storageclasses.yaml и
# применяются осознанно per-PVC.
#
# Значения вынесены из `spec.source.helm.valuesObject` в
# `platform/longhorn/values.yaml`, Application подключает их через `$values` —
# второй источник в `spec.sources`.
#
# Подготовка узла (iscsid, NFSv4-клиент, SELinux-модуль, каталог данных) —
# в infra/ansible/host.yml, роль longhorn_prereqs. Без неё тома застревают в
# attach/detach.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: longhorn
  namespace: argocd
spec:
  project: upstream
  sources:
    - repoURL: https://charts.longhorn.io
      chart: longhorn
      targetRevision: 1.12.1
      helm:
        releaseName: longhorn
        valueFiles:
          - $values/platform/longhorn/values.yaml
    - repoURL: ssh://git@forgejo.biplane.casa:2222/artemiy/homelab.git
      targetRevision: main
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: longhorn-system
  syncPolicy:
    syncOptions:
      - CreateNamespace=true
      - Prune=false
    automated:
      selfHeal: true

# Radar — open-source Kubernetes UI (один Go-бинарь): топология, ресурсы, Helm,
# GitOps, аудит, MCP. Ставится официальным чартом skyhook/radar; маршрут —
# platform/homelab/templates/routes/radar.yaml.
#
# auth.mode=oidc: Radar входит в Zitadel сам и имперсонирует пользователя в
# Kubernetes, поэтому права определяет RBAC пользователя, а не общий
# ServiceAccount. oauth2-proxy с маршрута Radar убран — иначе Zitadel не смог бы
# отдать claim `role`.
#
# Значения вынесены из `spec.source.helm.valuesObject` в
# `platform/radar/values.yaml`, Application подключает их через `$values` —
# второй источник в `spec.sources`.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: radar
  namespace: argocd
spec:
  project: upstream
  sources:
    - repoURL: https://skyhook-io.github.io/helm-charts
      chart: radar
      targetRevision: 1.14.1
      helm:
        releaseName: radar
        valueFiles:
          - $values/platform/radar/values.yaml
    - repoURL: ssh://git@forgejo.biplane.casa:2222/artemiy/homelab.git
      targetRevision: main
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: radar
  syncPolicy:
    syncOptions:
      - CreateNamespace=true
    automated:
      selfHeal: true

# Radar — open-source Kubernetes UI (один Go-бинарь): топология, ресурсы, Helm,
# GitOps, аудит, MCP. Ставится официальным чартом skyhook/radar; Argo рендерит
# его сам (см. argocd/README.md), маршрут —
# platform/homelab/templates/routes/radar.yaml.
#
# auth.mode=oidc: Radar входит в Zitadel сам и имперсонирует пользователя в
# Kubernetes, поэтому права определяет RBAC пользователя, а не общий
# ServiceAccount. oauth2-proxy с маршрута Radar убран — иначе Zitadel не смог бы
# доставить back-channel logout (POST без cookie прокси) и вход был бы двойным.
# Решение и его цена: issue #42.
#
# issuerURL, clientID и redirectURL содержат домен и адрес приложения, поэтому
# заданы явно в auth.oidc ниже. Секреты (clientSecret и HMAC-ключ сессий) — в
# Vault, оттуда VSO (platform/radar/).
#
# ВНИМАНИЕ: auth.mode != none добавляет чартом в ClusterRole Radar'а
# impersonate на users/groups и create на subjectaccessreviews, а также
# автоматически включает rbac.secrets / viewRBAC / viewWebhooks. SA с таким
# токеном эквивалентен cluster-admin, поэтому NetworkPolicy в
# platform/radar/networkpolicy.yaml — единственная граница.
#
# Внешний маршрут и NetworkPolicy namespace radar живут вне Application
# (platform/homelab, platform/radar/networkpolicy.yaml).
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: radar
  namespace: argocd
spec:
  project: upstream
  source:
    repoURL: https://skyhook-io.github.io/helm-charts
    chart: radar
    targetRevision: 1.14.1
    helm:
      releaseName: radar
      valuesObject:
        # Однозный кластер: лимиты умереннее дефолтных (2 CPU / 1Gi), чтобы
        # информеры большого кластера не вытесняли соседей, но с запасом на
        # всплески при churn.
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: "1"
            memory: 512Mi
        auth:
          mode: oidc
          # HMAC-ключ подписи сессий. Без него Radar генерирует случайный при
          # старте, и каждый рестарт пода разлогинивает всех. existingSecretKey
          # — дефолт чарта (auth-secret), читается из того же секрета Vault.
          existingSecret: radar-auth
          # Группы приходят из claim `role` (admin|user), который кладёт action
          # addRole в Zitadel. Префикс `oidc:` даёт ровно ту группу `oidc:admin`,
          # что и у Headlamp, поэтому ClusterRoleBinding из
          # platform/headlamp/headlamp-admins.clusterrolebinding.yaml работает на
          # оба UI. Привязка по Group, не по User: Radar берёт имя из claim
          # `email`, apiserver — из `sub`, и kind: User у них не совпадёт.
          oidc:
            issuerURL: https://id.biplane.v6.rocks
            clientID: "392954354702773261"
            redirectURL: https://radar.biplane.v6.rocks/auth/callback
            postLogoutRedirectURL: https://radar.biplane.v6.rocks/
            groupsClaim: role
            groupsPrefix: "oidc:"
            # Без явного списка Radar просит ещё и scope `groups`, которого в
            # Zitadel нет: Zitadel молча выкинет его из запроса, а группы всё
            # равно приходят из claim `role`. Явный список фиксирует запрос.
            scopes:
              - openid
              - profile
              - email
            # Ключ clientSecret — дефолт чарта (auth.oidc.clientSecretKey).
            existingSecret: radar-auth
            # Радиус действия: одна реплика, без обратного канала revoke.
            backchannelLogout: true
        traffic:
          # Автодискавери Prometheus ищет well-known имена/лейблы и не знаком с
          # сервисом victoriametrics; задаём адрес явно (порт 80 сервиса).
          # Доступ из namespace radar в monitoring открыт NetworkPolicy.
          prometheusUrl: http://victoriametrics.monitoring.svc.cluster.local
        service:
          # Чарт использует service.port и как порт контейнера (--port), и как
          # порт Service; перевод сервиса на стандартный 80 меняет оба (см.
          # issue #269). Порт нигде больше не зашит (NetworkPolicy без портов).
          port: 80
  destination:
    server: https://kubernetes.default.svc
    namespace: radar
  syncPolicy:
    syncOptions:
      - CreateNamespace=true
    automated:
      selfHeal: true

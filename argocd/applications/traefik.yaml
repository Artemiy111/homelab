apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: traefik
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://traefik.github.io/charts
    chart: traefik
    targetRevision: 41.4.0
    helm:
      releaseName: traefik
      skipCrds: true
      valuesObject:
        providers:
          kubernetesCRD:
            allowCrossNamespace: true
        service:
          spec:
            type: ClusterIP
        ports:
          web:
            port: 8000
            expose:
              default: true
            protocol: TCP
          websecure:
            port: 8443
            http:
              tls:
                enabled: true
            expose:
              default: true
            protocol: TCP
        metrics:
          prometheus:
            service:
              enabled: true
        additionalArguments:
          - --ping
        ingressRoute:
          healthcheck:
            enabled: true
            entryPoints:
              - websecure
            tls: {}
        ingressClass:
          enabled: true
          isDefaultClass: true
          name: traefik
  destination:
    server: https://kubernetes.default.svc
    namespace: traefik
  syncPolicy:
    syncOptions:
      - ServerSideApply=true
      - CreateNamespace=true
    automated:
      selfHeal: true

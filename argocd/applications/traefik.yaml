apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: traefik
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://traefik.github.io/charts
    chart: traefik
    targetRevision: 41.4.0
    helm:
      releaseName: traefik
      skipCrds: true
      valuesObject:
        providers:
          kubernetesCRD:
            allowCrossNamespace: true
        service:
          spec:
            type: ClusterIP
        ports:
          web:
            port: 8000
            expose:
              default: true
            protocol: TCP
          websecure:
            port: 8443
            http:
              tls:
                enabled: true
            expose:
              default: true
            protocol: TCP
        metrics:
          prometheus:
            service:
              enabled: true
            # Per-router метрики. По умолчанию в Traefik выключены
            # (addRoutersLabels=false), и без них в VM нет ни одной серии
            # traefik_router_* — метрики только по бэкенд-сервисам, по роутеру
            # не понять, какой маршрут ведёт себя неправильно. #284.
            # Цена: серий примерно вдвое больше (объём дают бакеты гистограмм),
            # а запас по диску vmdata после инцидента 0003 не расширялся —
            # решение принято осознанно, отслеживать расход в #284.
            addRoutersLabels: true
        additionalArguments:
          - --ping
        # JSON access-логи в stdout (их собирает Alloy → Loki). В формате JSON
        # Traefik отдаёт ядровые поля trace_id/span_id, по которым Loki и Tempo
        # связаны (#446). Query-параметры дропаем, чтобы не писать в логи
        # чувствительные значения вроде OAuth code.
        accessLog:
          enabled: true
          format: json
          fields:
            queryParameters:
              defaultMode: drop
        # Трейсы через OTLP/HTTP в otel-collector, дальше в Tempo. Сэмплинг 1.0 —
        # трафик homelab мал; при росте нагрузки снизить.
        tracing:
          sampleRate: 1.0
          otlp:
            enabled: true
            http:
              enabled: true
              endpoint: http://otel-collector.monitoring.svc.cluster.local:4318/v1/traces
        ingressRoute:
          healthcheck:
            enabled: true
            entryPoints:
              - websecure
            tls: {}
        ingressClass:
          enabled: true
          isDefaultClass: true
          name: traefik
  destination:
    server: https://kubernetes.default.svc
    namespace: traefik
  syncPolicy:
    syncOptions:
      - ServerSideApply=true
      - CreateNamespace=true
    automated:
      selfHeal: true

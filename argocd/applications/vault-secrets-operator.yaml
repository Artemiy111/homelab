# Vault Secrets Operator (VSO) — синхронизация секретов из Vault в Kubernetes
# Secret. Чарт так же берём из git: helm.releases.hashicorp.com недоступен (403).
#
# Отдельный namespace от самого Vault: у оператора кластерные права (создаёт
# ServiceAccount-токены для TokenReview), и держать его в одном неймспейсе с
# данными — лишнее смешение прав.
#
# ВАЖНО при ручной проверке рендера: восемь CRD лежат в каталоге crds/ чарта,
# а Helm пропускает его и при install, и при upgrade. Нужен явный флаг:
#   helm template vso <chart-dir> --include-crds
# ArgoCD этот флаг передаёт сам, поэтому в кластере CRD появятся.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: vault-secrets-operator
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/hashicorp/vault-secrets-operator
    path: chart
    targetRevision: v1.6.0
    helm:
      releaseName: vault-secrets-operator
      valuesObject:
        # Дефолт чарта — пустой resources; для одноузлового кластера это плохо
        # (ср. cert-manager в applications/cert-manager.yaml).
        controller:
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
  destination:
    server: https://kubernetes.default.svc
    namespace: vault-secrets-operator
  syncPolicy:
    syncOptions:
      # Prune=false обязателен: CRD кластерные, и prune приложения снесло бы их
      # вместе со всеми VaultAuth/VaultStaticSecret во всех неймспейсах.
      - ServerSideApply=true
      - Prune=false
      - CreateNamespace=true
    automated:
      selfHeal: true

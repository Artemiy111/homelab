apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: victoria-metrics-operator
  namespace: argocd
spec:
  project: upstream
  sources:
    - repoURL: https://victoriametrics.github.io/helm-charts
      chart: victoria-metrics-operator
      targetRevision: 0.68.1
      helm:
        releaseName: victoria-metrics-operator
        valueFiles:
          - $values/clusters/casa/platform/victoria-metrics-operator/values.yaml
    - repoURL: ssh://git@forgejo.biplane.casa:2222/artemiy/homelab.git
      targetRevision: main
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: victoria-metrics-operator
  syncPolicy:
    syncOptions:
      - ServerSideApply=true
      - Prune=false
      - CreateNamespace=true
    automated:
      selfHeal: true

# Подключение Argo к репозиторию внутренних значений `homelab-values` по SSH
# (docs/adr/0008, #641).
#
# Argo читает такие подключения из Secret с меткой
# `argocd.argoproj.io/secret-type: repository` и сопоставляет репозиторий по
# полю `url` — ссылка на Secret в Application при этом не нужна, `repoCreds`
# существует только у одиночного `spec.source`, в `spec.sources[]` его нет.
# Отсюда три ключа в Vault с именами, которые Argo ожидает: `sshPrivateKey`,
# `type` и `url`. Шаблон трансформации не нужен: VSO переносит ключи как есть.
#
# Кред лежит в Vault под сегментом `@argocd`: читает его ServiceAccount
# `vso-argocd`, то есть другой принципал, и отзывается независимо от остальных
# секретов Forgejo.
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultStaticSecret
metadata:
  name: homelab-values-repo
  namespace: argocd
spec:
  vaultAuthRef: vso-argocd
  mount: kv
  type: kv-v2
  path: forgejo/@argocd/ssh/homelab-values
  refreshAfter: 1h
  destination:
    name: homelab-values-repo
    create: true
    overwrite: true
    labels:
      # По этой метке Argo считает Secret подключением к репозиторию.
      argocd.argoproj.io/secret-type: repository
    # Argo читает ключ из Secret на каждой git-операции, поэтому перезапуск
    # repo-server при ротации не нужен.
    transformation:
      excludeRaw: true

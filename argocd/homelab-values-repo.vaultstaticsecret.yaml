# Приватная половина deploy key, которым Argo читает репозиторий внутренних
# значений `homelab-values` (docs/adr/0008, #641).
#
# Кред лежит в Vault под сегментом `@argocd`: читает его ServiceAccount
# `vso-argocd`, то есть другой принципал, и отзывается независимо от остальных
# секретов Forgejo. Публичная половина лежит там же, ключом `ssh-publickey`, и
# нужна только человеку — чтобы зарегистрировать deploy key в Forgejo.
#
# Ключи названы как их читает Argo в `repoCreds`: `ssh-privatekey` требуется
# обязательно, `ssh-publickey` VSO переносит по инерции. Шаблон трансформации не
# нужен, потому что имена совпадают.
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultStaticSecret
metadata:
  name: homelab-values-repo
  namespace: argocd
spec:
  vaultAuthRef: vso-argocd
  mount: kv
  type: kv-v2
  path: forgejo/@argocd/ssh/homelab-values
  refreshAfter: 1h
  destination:
    name: homelab-values-repo
    create: true
    overwrite: true
    # Argo читает ключ из Secret на каждой git-операции, поэтому перезапуск
    # repo-server при ротации не нужен.
    transformation:
      excludeRaw: true

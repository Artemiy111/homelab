# Приватная половина deploy key, которым Argo читает репозиторий внутренних
# значений `homelab-values` (docs/adr/0008, #641).
#
# Кред лежит в Vault под сегментом `@argocd`: читает его ServiceAccount
# `vso-argocd`, то есть другой принципал, и отзывается независимо от остальных
# секретов Forgejo. Публичная половина лежит там же, ключом `public`, и нужна
# только человеку — чтобы зарегистрировать deploy key в Forgejo; в кластер она не
# попадает.
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultStaticSecret
metadata:
  name: homelab-values-repo
  namespace: argocd
spec:
  vaultAuthRef: vso-argocd
  mount: kv
  type: kv-v2
  path: forgejo/@argocd/ssh/homelab-values
  refreshAfter: 1h
  destination:
    name: homelab-values-repo
    create: true
    overwrite: true
    # Argo читает ключ из Secret на каждой git-операции, поэтому перезапуск
    # repo-server при ротации не нужен.
    transformation:
      excludeRaw: true
      # quote нужен, чтобы многострочный PEM стал валидным YAML: без него
      # последующие строки уедут из-под значения и документ не распарсится.
      template: |
        {{- with secret "data" -}}
        ssh-privatekey: {{ .data.private | quote }}
        {{- end }}

apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: homelab-cluster-readers
  namespace: argocd
spec:
  sourceRepos:
    - "*"
  destinations:
    - server: https://kubernetes.default.svc
      namespace: "*"
  # Пять сервисов читают кластер целиком и без ClusterRole не работают вовсе:
  # alloy и alloy-profiler читают логи всех подов, vmagent — метрики ноды,
  # beyla — eBPF-профили. Шестой, elk, добавляется в волне 3 — filebeat читает
  # логи всех подов тоже, поэтому его запись добавлена заранее.
  # Перечислены конкретные имена, а не вид целиком: схема
  # ClusterResourceRestrictionItem допускает name с glob-паттернами, а без name
  # совпадает всё в группе и виде. Так сервис не сможет создать посторонний
  # ClusterRole, даже если тот появится в манифесте по ошибке.
  #
  # clusterResourceWhitelist — единственный рычаг на кластерные объекты:
  # namespaced-ресурсы Argo ограничивает deny-list'ом, а cluster-scoped —
  # allow-list'ом (документация Argo, Projects). Нет записи → нельзя ни
  # создать, ни удалить. Поэтому prune у этих приложений физически не может
  # задеть чужой кластерный объект.
  clusterResourceWhitelist:
    - group: rbac.authorization.k8s.io
      kind: ClusterRole
      name: alloy-logs
    - group: rbac.authorization.k8s.io
      kind: ClusterRoleBinding
      name: alloy-logs
    - group: rbac.authorization.k8s.io
      kind: ClusterRole
      name: alloy-profiler
    - group: rbac.authorization.k8s.io
      kind: ClusterRoleBinding
      name: alloy-profiler
    - group: rbac.authorization.k8s.io
      kind: ClusterRole
      name: beyla
    - group: rbac.authorization.k8s.io
      kind: ClusterRoleBinding
      name: beyla
    - group: rbac.authorization.k8s.io
      kind: ClusterRole
      name: filebeat
    - group: rbac.authorization.k8s.io
      kind: ClusterRoleBinding
      name: filebeat
    - group: rbac.authorization.k8s.io
      kind: ClusterRole
      name: homepage
    - group: rbac.authorization.k8s.io
      kind: ClusterRoleBinding
      name: homepage
    - group: rbac.authorization.k8s.io
      kind: ClusterRole
      name: vmagent-node-metrics
    - group: rbac.authorization.k8s.io
      kind: ClusterRoleBinding
      name: vmagent-node-metrics
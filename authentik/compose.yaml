name: authentik

x-authentik-environment: &authentik-environment
  AUTHENTIK_POSTGRESQL__HOST: postgresql
  AUTHENTIK_POSTGRESQL__NAME: ${AUTHENTIK_POSTGRESQL_DATABASE:-authentik}
  AUTHENTIK_POSTGRESQL__USER: ${AUTHENTIK_POSTGRESQL_USER:-authentik}
  AUTHENTIK_POSTGRESQL__PASSWORD: ${AUTHENTIK_POSTGRESQL_PASSWORD:?set AUTHENTIK_POSTGRESQL_PASSWORD in authentik/.env}
  AUTHENTIK_SECRET_KEY: ${AUTHENTIK_SECRET_KEY:?set AUTHENTIK_SECRET_KEY in authentik/.env}
  AUTHENTIK_LISTEN__TRUSTED_PROXY_CIDRS: ${TRAEFIK_NETWORK_CIDR:?set TRAEFIK_NETWORK_CIDR in authentik/.env}
  AUTHENTIK_ERROR_REPORTING__ENABLED: "false"
  AUTHENTIK_DISABLE_UPDATE_CHECK: "true"

services:
  postgresql:
    image: postgres:18-alpine
    container_name: authentik-postgresql
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${AUTHENTIK_POSTGRESQL_DATABASE:-authentik}
      POSTGRES_USER: ${AUTHENTIK_POSTGRESQL_USER:-authentik}
      POSTGRES_PASSWORD: ${AUTHENTIK_POSTGRESQL_PASSWORD:?set AUTHENTIK_POSTGRESQL_PASSWORD in authentik/.env}
    volumes:
      - /storage/apps/authentik/postgresql:/var/lib/postgresql:Z
    networks:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    security_opt:
      - no-new-privileges:true

  server:
    image: ghcr.io/goauthentik/server:2026.5.6
    container_name: authentik-server
    command: server
    restart: unless-stopped
    environment: *authentik-environment
    volumes:
      - /storage/apps/authentik/data:/data:Z
    networks:
      - backend
      - traefiknet
    depends_on:
      postgresql:
        condition: service_healthy
    shm_size: 512mb
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "ak", "healthcheck"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 90s
    labels:
      - traefik.enable=true
      - traefik.http.routers.authentik.rule=Host(`${AUTHENTIK_HOST}`)
      - traefik.http.routers.authentik.entrypoints=websecure
      - traefik.http.routers.authentik.middlewares=authentik-security
      - traefik.http.services.authentik.loadbalancer.server.port=9000
      - traefik.http.services.authentik.loadbalancer.healthcheck.path=/-/health/ready/
      - traefik.http.services.authentik.loadbalancer.healthcheck.interval=10s
      - traefik.http.middlewares.authentik-security.headers.stsSeconds=15552000
      - traefik.http.middlewares.authentik-security.headers.stsIncludeSubdomains=true
      - traefik.http.middlewares.authentik-security.headers.contentTypeNosniff=true
      - traefik.http.middlewares.authentik-security.headers.referrerPolicy=no-referrer
      - traefik.docker.network=traefiknet

  worker:
    image: ghcr.io/goauthentik/server:2026.5.6
    container_name: authentik-worker
    command: worker
    restart: unless-stopped
    environment: *authentik-environment
    volumes:
      - /storage/apps/authentik/data:/data:Z
    networks:
      - backend
    depends_on:
      postgresql:
        condition: service_healthy
    shm_size: 512mb
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "ak", "healthcheck"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 90s

  backup-db:
    image: postgres:18-alpine
    profiles:
      - tools
    environment:
      PGHOST: postgresql
      PGDATABASE: ${AUTHENTIK_POSTGRESQL_DATABASE:-authentik}
      PGUSER: ${AUTHENTIK_POSTGRESQL_USER:-authentik}
      PGPASSWORD: ${AUTHENTIK_POSTGRESQL_PASSWORD:?set AUTHENTIK_POSTGRESQL_PASSWORD in authentik/.env}
    volumes:
      - /storage/apps/authentik/backups:/backups:Z
    networks:
      - backend
    depends_on:
      postgresql:
        condition: service_healthy
    entrypoint:
      - /bin/sh
      - -ec
    command:
      - >-
        umask 077;
        pg_dump --format=custom --file=/backups/authentik.dump.tmp;
        mv /backups/authentik.dump.tmp /backups/authentik.dump
    restart: "no"

networks:
  backend:
    internal: true
  traefiknet:
    external: true

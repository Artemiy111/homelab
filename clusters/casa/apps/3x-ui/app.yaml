apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: 3x-ui
  namespace: argocd
spec:
  project: homelab
  sources:
    # homelab-config разложен по владельцам вместо веера из чарта
    # platform/homelab; манифест лежит рядом с локальным чартом.
    - repoURL: ssh://git@forgejo.biplane.casa:2222/artemiy/homelab.git
      targetRevision: main
      path: clusters/casa/apps/3x-ui/manifests
    - repoURL: ssh://git@forgejo.biplane.casa:2222/artemiy/homelab.git
      targetRevision: main
      path: clusters/casa/apps/3x-ui/chart
      helm:
        releaseName: xui
  destination:
    server: https://kubernetes.default.svc
    namespace: 3x-ui
  syncPolicy:
    automated:
      prune: false
      selfHeal: true
    syncOptions:
      - ServerSideApply=true
    retry:
      limit: 5
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 3m
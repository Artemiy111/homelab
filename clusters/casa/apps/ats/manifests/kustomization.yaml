apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: ats
resources:
  - namespace.yaml
  - service.yaml
  - deployment.yaml
  - data.pvc.yaml
  - networkpolicy.yaml
  - vaultauth.yaml
  - vaultstaticsecret.yaml
configMapGenerator:
  - name: ats
    files:
      - config/records.yaml
      - config/remap.config
      - config/cache.config
      - config/storage.config
      - config/plugin.config
      - config/ip_allow.yaml
      - config/run.sh

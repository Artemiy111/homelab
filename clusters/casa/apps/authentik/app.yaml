# authentik отключён вручную: оба Deployment живут с replicas: 0, в git стоит 1.
# Расхождение не зафиксировано ни в README, ни в ADR, поэтому синк включён бы
# и вернул сервис на перегруженную ноду (issue #727). Application заведён без
# блока syncPolicy.automated — Argo не создаст поды обратно. Включение:
# либо убрать блок automated из этого файла, либо решить судьбу сервиса и
# привести replicas в этом файле и в clusters/casa/apps/authentik/k8s/ к одному значению.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: authentik
  namespace: argocd
spec:
  project: homelab
  sources:
    - repoURL: ssh://git@forgejo.biplane.casa:2222/artemiy/homelab.git
      targetRevision: main
      path: clusters/casa/apps/authentik/manifests
  destination:
    server: https://kubernetes.default.svc
    namespace: authentik
  syncPolicy:
    syncOptions:
      - ServerSideApply=true
apiVersion: v1
kind: PersistentVolume
metadata:
  name: code-server-home
  annotations:
    argocd.argoproj.io/sync-options: Prune=false
spec:
  capacity:
    storage: 1Gi
  volumeMode: Filesystem
  accessModes:
    - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain
  storageClassName: local-storage-retain
  local:
    path: /storage/apps/code-server/home
  nodeAffinity:
    required:
      nodeSelectorTerms:
        - matchExpressions:
            - key: kubernetes.io/hostname
              operator: In
              values:
                - homelab
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: code-server-home
  namespace: code-server
  annotations:
    argocd.argoproj.io/sync-options: Prune=false
spec:
  storageClassName: local-storage-retain
  accessModes:
    - ReadWriteOnce
  volumeName: code-server-home
  resources:
    requests:
      storage: 1Gi
---

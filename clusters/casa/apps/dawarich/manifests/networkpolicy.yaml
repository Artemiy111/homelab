# NetworkPolicy для namespace dawarich: default-deny ingress + явные разрешения.
# traefik — веб; vmagent из monitoring скрейпит экспортёры (9187/9121).
# Приложение, sidekiq, база и Redis общаются внутри namespace. Оператор CNPG из
# cnpg-system обязан ходить в под кластера: 8000 — instance manager (status),
# 5432 — PostgreSQL. Egress не ограничен.
#
# Порт-лист — часть конкретного правила ingress, а не общий для всего spec:
# блок без ports не ограничен, поэтому доступы с ограничением портов выносятся
# отдельными правилами.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-ingress
  namespace: dawarich
spec:
  podSelector: {}
  policyTypes:
    - Ingress
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-ingress
  namespace: dawarich
spec:
  podSelector: {}
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector: {}
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: traefik
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: cnpg-system
      ports:
        - port: 8000
          protocol: TCP
        - port: 5432
          protocol: TCP
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitoring
          podSelector:
            matchLabels:
              app: vmagent
      ports:
        - port: 9187
          protocol: TCP
        - port: 9121
          protocol: TCP

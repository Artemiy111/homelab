apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  annotations:
    argocd.argoproj.io/sync-wave: "40"
  name: element
  namespace: argocd
spec:
  project: homelab
  sources:
    - repoURL: https://github.com/Artemiy111/homelab.git
      targetRevision: main
      path: clusters/casa/apps/element/chart
      helm:
        releaseName: element
    # element-web-config — конфиг сервиса, а не общее окружение. Второй источник
    # обычным каталогом — Argo сводит манифесты источников в один набор, а
    # дубликатов здесь нет.
    - repoURL: https://github.com/Artemiy111/homelab.git
      targetRevision: main
      path: clusters/casa/apps/element/manifests
  destination:
    server: https://kubernetes.default.svc
    namespace: element
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - ServerSideApply=true
    retry:
      limit: 5
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 3m
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: element
  namespace: argocd
spec:
  project: homelab
  sources:
    - repoURL: ssh://git@forgejo.biplane.casa:2222/artemiy/homelab.git
      targetRevision: main
      path: clusters/casa/apps/element/chart
      helm:
        releaseName: element
    # element-web-config переехал из чарта platform/homelab: это конфиг сервиса,
    # а не общее окружение. Второй источник обычным каталогом — Argo сводит
    # манифесты источников в один набор, а дубликатов здесь нет.
    - repoURL: ssh://git@forgejo.biplane.casa:2222/artemiy/homelab.git
      targetRevision: main
      path: clusters/casa/apps/element/manifests
  destination:
    server: https://kubernetes.default.svc
    namespace: element
  syncPolicy:
    automated:
      prune: false
      selfHeal: true
    syncOptions:
      - ServerSideApply=true
    retry:
      limit: 5
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 3m
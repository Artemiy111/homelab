apiVersion: apps/v1
kind: Deployment
metadata:
  name: gatus
  namespace: monitoring
spec:
  revisionHistoryLimit: 2
  replicas: 1
  selector:
    matchLabels:
      app: gatus
  template:
    metadata:
      labels:
        app: gatus
    spec:
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        runAsNonRoot: true
      containers:
        - name: gatus
          image: "ghcr.io/twin/gatus:v5.36.0@sha256:c5f210d095fa78e6efaa20ffeb14803f2ba4f10615e16a6d12087697149617f0"
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - configMapRef:
                name: homelab-config
          env:
            # Секреты только явными ссылками по ключу. envFrom Secret'а не
            # годится: состав Secret'а задаётся в Vault, и любой лишний ключ
            # молча стал бы переменной окружения. Список ниже и есть полный
            # перечень секретов gatus.
            - name: GATUS_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: gatus-db
                  key: password
            - name: NTFY_TOPIC
              valueFrom:
                secretKeyRef:
                  name: gatus-ntfy
                  key: NTFY_TOPIC
            - name: TELEGRAM_BOT_TOKEN
              valueFrom:
                secretKeyRef:
                  name: gatus-telegram
                  key: TELEGRAM_BOT_TOKEN
            - name: TELEGRAM_CHAT_ID
              valueFrom:
                secretKeyRef:
                  name: gatus-telegram
                  key: TELEGRAM_CHAT_ID
            - name: HOST_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.hostIP
            - name: XUI_EGRESS_USERNAME
              valueFrom:
                secretKeyRef:
                  name: xui-egress
                  key: XUI_EGRESS_USERNAME
            - name: XUI_EGRESS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: xui-egress
                  key: XUI_EGRESS_PASSWORD
            - name: XUI_EGRESS_PROXY_URL
              value: "http://$(XUI_EGRESS_USERNAME):$(XUI_EGRESS_PASSWORD)@xui-egress.3x-ui.svc.cluster.local:8440"
          startupProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 15
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /
              port: http
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            seccompProfile:
              type: RuntimeDefault
          resources:
            requests:
              cpu: 1m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 160Mi
          volumeMounts:
            - name: config
              mountPath: /config
              readOnly: true
      volumes:
        - name: config
          configMap:
            name: gatus-config

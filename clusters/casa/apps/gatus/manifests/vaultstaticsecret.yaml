apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultStaticSecret
metadata:
  name: xui-egress
  namespace: monitoring
spec:
  vaultAuthRef: vso-gatus
  mount: kv
  type: kv-v2
  path: 3x-ui/@gatus/egress
  refreshAfter: 1h
  destination:
    name: xui-egress
    create: true
    overwrite: true
    transformation:
      excludeRaw: true
---

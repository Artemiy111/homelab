apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultStaticSecret
metadata:
  name: glitchtip-db
  namespace: glitchtip
spec:
  vaultAuthRef: vso-glitchtip
  mount: kv
  type: kv-v2
  path: glitchtip/db
  refreshAfter: 1h
  destination:
    name: glitchtip-db
    create: true
    overwrite: true
    transformation:
      excludeRaw: true
---
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultStaticSecret
metadata:
  name: glitchtip-secrets
  namespace: glitchtip
spec:
  vaultAuthRef: vso-glitchtip
  mount: kv
  type: kv-v2
  path: glitchtip/secrets
  refreshAfter: 1h
  destination:
    name: glitchtip-secrets
    create: true
    overwrite: true
    transformation:
      excludeRaw: true

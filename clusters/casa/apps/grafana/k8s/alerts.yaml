# --- перенесено без изменений из config/alerting/logs.yaml ---
#
# Правила алертинга по логам. Источник — Loki (uid `loki` из
# k8s/datasources.yaml). Запрос — LogQL метрика: `count_over_time` по строкам
# с уровнем error за окно. Поле `level` приходит как structured metadata из
# Alloy (см. clusters/casa/apps/alloy/config/config.alloy), поэтому фильтр не требует парсера
# и работает в алертах. Регистр значений разный у разных приложений, отсюда
# `(?i)`.
apiVersion: grafana.integreatly.org/v1beta1
kind: GrafanaAlertRuleGroup
metadata:
  name: logs
spec:
  instanceSelector:
    matchLabels:
      app: grafana
  folderRef: logs
  interval: 1m
  name: logs
  rules:
    - uid: logs-error-spike
      title: Всплеск ошибок в логах
      condition: C
      data:
        - refId: A
          queryType: instant
          relativeTimeRange:
            from: 600
            to: 0
          datasourceUid: loki
          model:
            datasource:
              type: loki
              uid: loki
            editorMode: code
            expr: 'sum by (namespace) (count_over_time({namespace=~".+"} | level=~"(?i)error" [5m])) > 20'
            instant: true
            intervalMs: 1000
            maxDataPoints: 43200
            queryType: instant
            refId: A
        - refId: B
          relativeTimeRange:
            from: 0
            to: 0
          datasourceUid: __expr__
          model:
            conditions:
              - evaluator:
                  params: []
                  type: gt
                operator:
                  type: and
                query:
                  params:
                    - A
                reducer:
                  params: []
                  type: last
                type: query
            datasource:
              type: __expr__
              uid: __expr__
            expression: A
            intervalMs: 1000
            maxDataPoints: 43200
            reducer: last
            refId: B
            type: reduce
        - refId: C
          relativeTimeRange:
            from: 0
            to: 0
          datasourceUid: __expr__
          model:
            conditions:
              - evaluator:
                  params:
                    - 0
                  type: gt
                operator:
                  type: and
                query:
                  params:
                    - B
                reducer:
                  params: []
                  type: last
                type: query
            datasource:
              type: __expr__
              uid: __expr__
            expression: B
            intervalMs: 1000
            maxDataPoints: 43200
            refId: C
            type: threshold
      noDataState: OK
      execErrState: Error
      for: 15m
      isPaused: false
      labels:
        severity: warning
      annotations:
        summary: "Всплеск ошибок в логах (namespace {{ $labels.namespace }})"
        description: >-
          Больше 20 строк с level=error за 5 минут в namespace {{ $labels.namespace }}. Открыть Grafana → Explore → Loki и отфильтровать `{namespace="{{ $labels.namespace }}"} | level=~"(?i)error"`.
        runbook: "docs/research/log-output-formats.md"
    - uid: logs-pipeline-stalled
      title: Логи не пишутся
      condition: C
      data:
        - refId: A
          relativeTimeRange:
            from: 600
            to: 0
          datasourceUid: victoriametrics
          model:
            datasource:
              type: prometheus
              uid: victoriametrics
            editorMode: code
            expr: 'sum(rate(loki_distributor_lines_received_total{is_internal_stream="false"}[10m])) == 0'
            instant: true
            intervalMs: 1000
            maxDataPoints: 43200
            refId: A
        - refId: B
          relativeTimeRange:
            from: 0
            to: 0
          datasourceUid: __expr__
          model:
            conditions:
              - evaluator:
                  params: []
                  type: gt
                operator:
                  type: and
                query:
                  params:
                    - A
                reducer:
                  params: []
                  type: last
                type: query
            datasource:
              type: __expr__
              uid: __expr__
            expression: A
            intervalMs: 1000
            maxDataPoints: 43200
            reducer: last

# --- перенесено без изменений из config/alerting/storage.yaml ---
#
# Правила на дисковое пространство: ОДИН механизм на все PVC кластера.
#
# Заменяет точечные правила вида «loki-data < 2e9», «tempo-data < 1e9»,
# «victoriametrics fills in 3 days». Те были написаны руками под каждый том
# стенки, и ни одно приложение не защищали: инцидент #0001 (переполнение
# dawarich-db) система не могла заметить вообще, потому что правила про
# dawarich-db не существовало. Перечисление томов вручную не масштабируется —
# их 62.
#
# Два отличия от правил в victoria-metrics.yaml, и оба обязательны:
#
# 1. Редьюсер B — `max`, а не `last`. Правило покрывает десятки томов, значит
#    запрос A возвращает вектор. `last` схлопывает его в ОДНО значение по
#    произвольной серии: сработает правило, когда нужный том дал 0, и промолчит,
#    когда он дал 1. `max` отвечает на вопрос «есть ли хоть один проблемный
#    том» — это и нужно.
# 2. Выражение A обязано возвращать ПОЛОЖИТЕЛЬНЫЕ значения, потому что
#    условие C — это `threshold: gt 0`. Наивный `predict_linear(...) < 0`
#    возвращает отрицательные числа, и условие `> 0` никогда не выполняется:
#    правило не сработает НИКОГДА и при этом будет числиться здоровым. Поэтому
#    сравнение через `< bool 0`, которое даёт 1/0.
#
# noDataState: OK: нет метрик томов — условие не выполнено, а не «не знаю».
apiVersion: grafana.integreatly.org/v1beta1
kind: GrafanaAlertRuleGroup
metadata:
  name: storage
spec:
  instanceSelector:
    matchLabels:
      app: grafana
  folderRef: storage
  interval: 1m
  name: storage
  rules:
    - uid: pvc-will-fill-in-3-days
      title: PVC fills within 3 days
      condition: C
      data:
        - refId: A
          relativeTimeRange:
            from: 600
            to: 0
          datasourceUid: victoriametrics
          model:
            datasource:
              type: prometheus
              uid: victoriametrics
            editorMode: code
            expr: >-
              (predict_linear(kubelet_volume_stats_available_bytes{namespace!="",persistentvolumeclaim!=""}[1d], 3 * 86400) < bool 0)
              and on (namespace, persistentvolumeclaim)
              (kubelet_volume_stats_capacity_bytes{namespace!="",persistentvolumeclaim!=""} > 5e9)
            instant: true
            intervalMs: 1000
            maxDataPoints: 43200
            refId: A
        - refId: B
          relativeTimeRange:
            from: 0
            to: 0
          datasourceUid: __expr__
          model:
            conditions:
              - evaluator:
                  params: []
                  type: gt
                operator:
                  type: and
                query:
                  params:
                    - A
                reducer:
                  params: []
                  type: max
                type: query
            datasource:
              type: __expr__
              uid: __expr__
            expression: A
            intervalMs: 1000
            maxDataPoints: 43200
            reducer: max
            refId: B
            type: reduce
        - refId: C
          relativeTimeRange:
            from: 0
            to: 0
          datasourceUid: __expr__
          model:
            conditions:
              - evaluator:
                  params:
                    - 0
                  type: gt
                operator:
                  type: and
                query:
                  params:
                    - B
                reducer:
                  params: []
                  type: last
                type: query
            datasource:
              type: __expr__
              uid: __expr__
            expression: B
            intervalMs: 1000
            maxDataPoints: 43200
            refId: C
            type: threshold
      noDataState: OK
      execErrState: Error
      for: 30m
      isPaused: false
      labels:
        severity: warning
      annotations:
        summary: "PVC заполнится в течение 3 дней"
        description: >-
          По линейной экстраполяции за последние сутки доступное место на томе
          закончится за трое суток. Затронутые тома: {{ $values.A }}.
          Порог 5 ГиБ отсекает мелкие служебные тома, для которых предсказание
          бессмысленно. Действия: расширить PVC, сократить retention либо
          удалить неиспользуемые данные.
        runbook: "docs/incidents/0001-dawarich-db-overflow.md, clusters/casa/apps/victoria-metrics/README.md"
    - uid: pvc-low-free-space
      title: PVC low free space
      condition: C
      data:
        - refId: A
          relativeTimeRange:
            from: 600
            to: 0
          datasourceUid: victoriametrics
          model:
            datasource:
              type: prometheus
              uid: victoriametrics
            editorMode: code
            expr: >-
              (kubelet_volume_stats_available_bytes{namespace!="",persistentvolumeclaim!=""} / kubelet_volume_stats_capacity_bytes{namespace!="",persistentvolumeclaim!=""} < 0.15)
              and on (namespace, persistentvolumeclaim)
              (kubelet_volume_stats_capacity_bytes{namespace!="",persistentvolumeclaim!=""} > 5e9)
            instant: true
            intervalMs: 1000
            maxDataPoints: 43200
            refId: A
        - refId: B
          relativeTimeRange:
            from: 0
            to: 0
          datasourceUid: __expr__
          model:
            conditions:
              - evaluator:
                  params: []
                  type: gt
                operator:
                  type: and
                query:
                  params:
                    - A
                reducer:
                  params: []
                  type: max
                type: query
            datasource:
              type: __expr__
              uid: __expr__
            expression: A
            intervalMs: 1000
            maxDataPoints: 43200
            reducer: max
            refId: B
            type: reduce
        - refId: C
          relativeTimeRange:
            from: 0
            to: 0
          datasourceUid: __expr__
          model:
            conditions:
              - evaluator:
                  params:
                    - 0
                  type: gt
                operator:
                  type: and
                query:
                  params:
                    - B
                reducer:
                  params: []
                  type: last
                type: query
            datasource:
              type: __expr__
              uid: __expr__
            expression: B
            intervalMs: 1000
            maxDataPoints: 43200
            refId: C
            type: threshold
      noDataState: OK
      execErrState: Error
      for: 30m
      isPaused: false
      labels:
        severity: warning
      annotations:
        summary: "Мало свободного места на PVC"
        description: >-
          Доля свободного места на томе упала ниже 15%. Затронутые тома:
          {{ $values.A }}. Порог 5 ГиБ отсекает мелкие тома, где 15% — это
          несколько мегабайт. Действия: расширить PVC, сократить retention
          либо почистить неиспользуемые данные.
        runbook: "clusters/casa/apps/victoria-metrics/README.md, раздел «Алерты»"
---
# --- перенесено без изменений из config/alerting/certificates.yaml ---
#
# Срок действия сертификатов.
#
# Отдельная группа, потому что это про безопасность и доступность, а не про
# ресурсы. Инцидент #0002 — про подмену боевого TLS-сертификата и сорванный
# rate limit Let's Encrypt — показал, что срок действия стоит отслеживать
# заранее, а не в момент истечения. cert-manager отдаёт
# certmanager_certificate_expiration_timestamp_seconds, но до сих пор это
# значение никем не читалось: метрики скрейпились тримя джобами и молчали.
#
# Порог 14 дней, а не 7: Let's Encrypt присылает уведомления за 20/10 дней,
# но у нас отдельный канал доставки, а продление требует проверки, что ACME
# вообще работает. 14 дней — это время заметить проблему и починить, не
# задевая сервисы.
#
# Тот же приём с `< bool`, что и в storage.yaml: условие C — это `gt 0`,
# поэтому выражение обязано отдавать положительные значения.
apiVersion: grafana.integreatly.org/v1beta1
kind: GrafanaAlertRuleGroup
metadata:
  name: certificates
spec:
  instanceSelector:
    matchLabels:
      app: grafana
  folderRef: certificates
  interval: 1m
  name: certificates
  rules:
    - uid: certificate-expiring-in-14-days
      title: Certificate expires in less than 14 days
      condition: C
      data:
        - refId: A
          relativeTimeRange:
            from: 600
            to: 0
          datasourceUid: victoriametrics
          model:
            datasource:
              type: prometheus
              uid: victoriametrics
            editorMode: code
            # Операнды в этом порядке неслучайны: `and` возвращает значения
            # ЛЕВОГО операнда, а условие C — это `gt 0`. С `< bool` слева
            # на выходе 1/0; если поставить `> 0` слева, правило отдаст
            # сырые таймстемпы (1.8e9), порог `gt 0` пройдёт всегда, и
            # алерт будет висеть сработавшим постоянно.
            expr: >-
              (certmanager_certificate_expiration_timestamp_seconds - time() < bool 14 * 86400)
              and on (namespace, name)
              (certmanager_certificate_expiration_timestamp_seconds > 0)
            instant: true
            intervalMs: 1000
            maxDataPoints: 43200
            refId: A
        - refId: B
          relativeTimeRange:
            from: 0
            to: 0
          datasourceUid: __expr__
          model:
            conditions:
              - evaluator:
                  params: []
                  type: gt
                operator:
                  type: and
                query:
                  params:
                    - A
                reducer:
                  params: []
                  type: max
                type: query
            datasource:
              type: __expr__
              uid: __expr__
            expression: A
            intervalMs: 1000
            maxDataPoints: 43200
            reducer: max
            refId: B
            type: reduce
        - refId: C
          relativeTimeRange:
            from: 0
            to: 0
          datasourceUid: __expr__
          model:
            conditions:
              - evaluator:
                  params:
                    - 0
                  type: gt
                operator:
                  type: and
                query:
                  params:
                    - B
                reducer:
                  params: []
                  type: last
                type: query
            datasource:
              type: __expr__
              uid: __expr__
            expression: B
            intervalMs: 1000
            maxDataPoints: 43200
            refId: C
            type: threshold
      noDataState: OK
      execErrState: Error
      for: 1h
      isPaused: false
      labels:
        severity: warning
      annotations:
        summary: "Сертификат истекает менее чем через 14 дней"
        description: >-
          cert-manager не смог продлить сертификат, либо продление не
          настроено. Сертификаты на грани: {{ $values.A }}.
          Проверить Certificate и CertificateRequest в его namespace, состояние
          ACME-челленджа и не исчерпан ли rate limit Let's Encrypt
          (инцидент #0002). Если сертификат уже истёк, HTTPS-сервисы отдают
          недоверенный сертификат.
        runbook: "clusters/casa/apps/cert-manager/README.md"
    - uid: certificate-expired
      title: Certificate already expired
      condition: C
      data:
        - refId: A
          relativeTimeRange:
            from: 600
            to: 0
          datasourceUid: victoriametrics
          model:
            datasource:
              type: prometheus
              uid: victoriametrics
            editorMode: code
            expr: 'certmanager_certificate_expiration_timestamp_seconds - time() < bool 0'
            instant: true
            intervalMs: 1000
            maxDataPoints: 43200
            refId: A
        - refId: B
          relativeTimeRange:
            from: 0
            to: 0
          datasourceUid: __expr__
          model:
            conditions:
              - evaluator:
                  params: []
                  type: gt
                operator:
                  type: and
                query:
                  params:
                    - A
                reducer:
                  params: []
                  type: max
                type: query
            datasource:
              type: __expr__
              uid: __expr__
            expression: A
            intervalMs: 1000
            maxDataPoints: 43200
            reducer: max
            refId: B
            type: reduce
        - refId: C
          relativeTimeRange:
            from: 0
            to: 0
          datasourceUid: __expr__
          model:
            conditions:
              - evaluator:
                  params:
                    - 0
                  type: gt
                operator:
                  type: and
                query:
                  params:
                    - B
                reducer:
                  params: []
                  type: last
                type: query
            datasource:
              type: __expr__
              uid: __expr__
            expression: B
            intervalMs: 1000
            maxDataPoints: 43200
            refId: C
            type: threshold
      noDataState: OK
      execErrState: Error
      for: 5m
      isPaused: false
      labels:
        severity: critical
      annotations:
        summary: "Сертификат уже истёк"
        description: >-
          Срок действия сертификата истёк, HTTPS-сервисы отдают недоверенный
          сертификат пользователям. Истёкшие: {{ $values.A }}.
          Это уже не предупреждение, а отказ: чинить немедленно.
        runbook: "clusters/casa/apps/cert-manager/README.md"
---
# --- перенесено без изменений из config/alerting/notification-policies.yaml ---
#
# Дерево политик у Grafana — один ресурс: файл перезаписывает его целиком,
# вместе с политиками, созданными в UI. Пока канал один, дерево плоское.
#
# group_by: alertname — разные алерты не склеиваются в одно уведомление, а
# несколько серий одного правила (например, упавшие scrape-таргеты) склеиваются
# в одно, потому что у них общий alertname.
#
# repeat_interval: 4h — напоминание, пока алерт не закрыт. Чаще не стоит: на
# инциденте 2026-09-25 алерт об отсутствии записи метрик был бы полезен, но
# повтор каждые 15 минут превращается в шум и тренирует игнорирование.
# policies:
#   - orgId: 1
#     receiver: ntfy
#     group_by: ['alertname']
#     group_wait: 30s
#     group_interval: 5m
#     repeat_interval: 4h
apiVersion: grafana.integreatly.org/v1beta1
kind: GrafanaNotificationPolicy
metadata:
  name: homelab
spec:
  instanceSelector:
    matchLabels:
      app: grafana
  route:
    receiver: ntfy
    group_by:
      - alertname
    group_wait: 30s
    group_interval: 5m
    repeat_interval: 4h

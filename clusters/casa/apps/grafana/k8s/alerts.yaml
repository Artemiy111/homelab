            maxDataPoints: 43200
            refId: C
            type: threshold
      noDataState: OK
      execErrState: Error
      for: 5m
      isPaused: false
      labels:
        severity: critical
      annotations:
        summary: "vmagent отбрасывает семплы (переполнение persistent queue)"
        description: >-
          Данные теряются молча: часть семплов не доходит до VictoriaMetrics. Обычно причина в недоступном remote_write или нехватке места под очередь. Проверить vm_persistentqueue_blocks_dropped_total и логи vmagent.
        runbook: "clusters/casa/apps/victoria-metrics/README.md"
    - uid: loki-active-streams-high
      title: Много активных серий в Loki
      condition: C

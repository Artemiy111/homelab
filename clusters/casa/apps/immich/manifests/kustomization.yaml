apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: immich
resources:
  - homelab-config.yaml
  - namespace.yaml
  - server.service.yaml
  - ml.service.yaml
  - valkey.service.yaml
  - server.deployment.yaml
  - ml.deployment.yaml
  - valkey.deployment.yaml
  - server.vpa.yaml
  - ml.vpa.yaml
  - library.pvc.yaml
  - networkpolicy.yaml
  - route.yaml
  - vaultauth.yaml
  - vaultstaticsecret.yaml
configMapGenerator:
  - name: immich-system-config
    files:
      - config/system-config.yaml

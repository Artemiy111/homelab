apiVersion: apps/v1
kind: Deployment
metadata:
  name: immich-machine-learning
  namespace: immich
spec:
  strategy:
    type: Recreate
  revisionHistoryLimit: 1
  replicas: 1
  selector:
    matchLabels:
      app: immich-machine-learning
  template:
    metadata:
      labels:
        app: immich-machine-learning
    spec:
      # IMMICH_PORT инжектится service-link'ом от Service immich.
      enableServiceLinks: false
      containers:
        - name: immich-machine-learning
          image: "ghcr.io/immich-app/immich-machine-learning:v3.3.1@sha256:513c831cfb010ad319341a0c86b42c575a0d5b688d3e8cae346ee624074a58ed"
          ports:
            - name: http
              containerPort: 3003
          env:
            - name: MACHINE_LEARNING_MODEL_REVISION
              value: v2
          startupProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 10
            failureThreshold: 30
          livenessProbe:
            tcpSocket:
              port: http
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 3
          readinessProbe:
            tcpSocket:
              port: http
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 3
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
              add: ["CHOWN", "DAC_OVERRIDE", "FOWNER", "SETGID", "SETUID"]
            seccompProfile:
              type: RuntimeDefault
          resources:
            requests:
              cpu: 200m
              # Фактическое потребление ~240 МиБ. 1Gi был шаблонным дефолтом и
              # впустую держал бюджет memory requests узла.
              memory: 320Mi
            limits:
              cpu: "4"
              memory: 6Gi
          volumeMounts:
            - name: model-cache
              mountPath: /cache
      volumes:
        - name: model-cache
          persistentVolumeClaim:
            claimName: immich-ml-cache

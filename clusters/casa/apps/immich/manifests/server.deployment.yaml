apiVersion: apps/v1
kind: Deployment
metadata:
  name: immich-server
  namespace: immich
spec:
  strategy:
    # RWO-том library нельзя монтировать двум подам сразу: rolling update поднял
    # бы новый под до остановки старого.
    type: Recreate
  revisionHistoryLimit: 1
  replicas: 1
  selector:
    matchLabels:
      app: immich-server
  template:
    metadata:
      labels:
        app: immich-server
    spec:
      # Immich читает IMMICH_PORT/DB_PORT/REDIS_PORT, а их инжектят service-links
      # (Service immich и Service db/redis от nextcloud) в формате tcp://….
      enableServiceLinks: false
      initContainers:
        - name: wait-for-db
          image: "ghcr.io/immich-app/postgres:14-vectorchord0.4.3-pgvectors0.2.0@sha256:bcf63357191b76a916ae5eb93464d65c07511da41e3bf7a8416db519b40b1c23"
          command: ["/bin/sh", "-c", "until pg_isready -h immich-db-rw.immich.svc.cluster.local -p 5432 -U immich -d immich; do echo waiting for immich-db; sleep 2; done"]
          securityContext:
            runAsUser: 999
            runAsGroup: 999
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            seccompProfile:
              type: RuntimeDefault
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 64Mi
        - name: wait-for-valkey
          image: "valkey/valkey:9@sha256:8e8d64b405ce18f41b8e5ee20aa4687a8ed0022d1298f2ce31cdcf3a76e09411"
          command: ["/bin/sh", "-c", "until valkey-cli -h immich-valkey ping | grep -q PONG; do echo waiting for immich-valkey; sleep 2; done"]
          securityContext:
            runAsUser: 999
            runAsGroup: 999
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            seccompProfile:
              type: RuntimeDefault
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 64Mi
      containers:
        - name: immich-server
          image: "ghcr.io/immich-app/immich-server:v3.3.1@sha256:db996e352359771c6a3db121a0ed8761516b22f727fc092a0f46dcfef82c1bc1"
          ports:
            - name: http
              containerPort: 2283
          env:
            - name: TZ
              valueFrom:
                configMapKeyRef:
                  name: homelab-config
                  key: TZ
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: immich-db
                  key: password
            - name: DB_HOSTNAME
              value: immich-db-rw.immich.svc.cluster.local
            - name: REDIS_HOSTNAME
              value: immich-valkey
            - name: DB_USERNAME
              value: immich
            - name: DB_DATABASE_NAME
              value: immich
            - name: IMMICH_TELEMETRY_INCLUDE
              value: all
            - name: IMMICH_CONFIG_FILE
              value: /etc/immich/system-config.yaml
            - name: IMMICH_LOG_FORMAT
              value: json
          startupProbe:
            httpGet:
              path: /api/server/ping
              port: http
            periodSeconds: 5
            timeoutSeconds: 10
            failureThreshold: 24
          livenessProbe:
            httpGet:
              path: /api/server/ping
              port: http
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /api/server/ping
              port: http
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 3
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
              add: ["CHOWN", "DAC_OVERRIDE", "FOWNER", "SETGID", "SETUID"]
            seccompProfile:
              type: RuntimeDefault
          resources:
            requests:
              cpu: 200m
              memory: 512Mi
            limits:
              cpu: "2"
              memory: 2Gi
          volumeMounts:
            - name: library
              mountPath: /data
            - name: media-user
              mountPath: /mnt/Artemiy/Library
              readOnly: true
            - name: media-family
              mountPath: /mnt/Family/Library
              readOnly: true
            - name: localtime
              mountPath: /etc/localtime
              readOnly: true
            - name: system-config
              mountPath: /etc/immich
              readOnly: true
      volumes:
        - name: library
          persistentVolumeClaim:
            claimName: immich-library
        - name: media-user
          persistentVolumeClaim:
            claimName: immich-media-artemiy
            readOnly: true
        - name: media-family
          persistentVolumeClaim:
            claimName: immich-media-family
            readOnly: true
        - name: localtime
          hostPath:
            path: /etc/localtime
            type: File
        - name: system-config
          configMap:
            name: immich-system-config

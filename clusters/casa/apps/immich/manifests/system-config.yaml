apiVersion: v1
kind: ConfigMap
metadata:
  name: immich-system-config
  namespace: immich
data:
  config.yaml: |
    job:
      ocr:
        concurrency: 10
      faceDetection:
        concurrency: 3
      thumbnailGeneration:
        concurrency: 8
    image:
      preview:
        format: webp
    library:
      watch:
        enabled: true
    machineLearning:
      ocr:
        modelName: ESLAV__PP-OCRv5_mobile
    oauth:
      enabled: true
      clientId: "388541482971234332"
      issuerUrl: https://id.biplane.casa
      roleClaim: role
      buttonText: Login with ZITADEL
      mobileOverrideEnabled: true
      mobileRedirectUri: https://immich.biplane.casa/api/oauth/mobile-redirect
    passwordLogin:
      enabled: false
    storageTemplate:
      enabled: true
      template: "{{y}}/{{y}}-{{MM}}/{{filename}}"

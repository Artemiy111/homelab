apiVersion: v1
kind: Service
metadata:
  name: infisical
  namespace: infisical
spec:
  type: ClusterIP
  selector:
    app: infisical
  ports:
    - name: http
      port: 80
      targetPort: http
      protocol: TCP
    - name: metrics
      port: 9464
      targetPort: metrics
      protocol: TCP

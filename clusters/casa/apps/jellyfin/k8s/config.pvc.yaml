# Конфиг и БД Jellyfin: без backup target, поэтому longhorn-retain — удаление PVC
# не должно стирать настройки. RWO-том на одной ноде требует strategy.type:
# Recreate у deployment (см. deployment.yaml).
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: jellyfin-config
  namespace: jellyfin
spec:
  storageClassName: longhorn-retain
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      # Данных ~650 КБ, но при старте Jellyfin проверяет свободное место в
      # /config/data и падает, если его меньше 2 ГиБ. 3 ГиБ дают запас на
      # метаданные медиатеки поверх этого порога.
      storage: 3Gi

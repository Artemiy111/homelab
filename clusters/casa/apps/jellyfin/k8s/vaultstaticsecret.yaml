apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultStaticSecret
metadata:
  name: jellyfin-api-key
  namespace: jellyfin
spec:
  vaultAuthRef: vso-jellyfin
  mount: kv
  type: kv-v2
  path: jellyfin/api-key
  refreshAfter: 1h
  destination:
    name: jellyfin-api-key
    create: true
    overwrite: true
    transformation:
      excludeRaw: true

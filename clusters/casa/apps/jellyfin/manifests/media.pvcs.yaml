apiVersion: v1
kind: PersistentVolume
metadata:
  name: jellyfin-media
  annotations:
    argocd.argoproj.io/sync-options: Prune=false
spec:
  capacity:
    storage: 60Gi
  volumeMode: Filesystem
  accessModes:
    - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain
  storageClassName: local-storage-retain
  local:
    path: /storage/media
  nodeAffinity:
    required:
      nodeSelectorTerms:
        - matchExpressions:
            - key: kubernetes.io/hostname
              operator: In
              values:
                - homelab
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: jellyfin-media
  namespace: jellyfin
  annotations:
    argocd.argoproj.io/sync-options: Prune=false
spec:
  storageClassName: local-storage-retain
  accessModes:
    - ReadWriteOnce
  volumeName: jellyfin-media
  resources:
    requests:
      storage: 60Gi

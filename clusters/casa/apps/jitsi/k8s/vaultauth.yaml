apiVersion: v1
kind: ServiceAccount
metadata:
  name: vso-jitsi
  namespace: jitsi
---
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultAuth
metadata:
  name: vso-jitsi
  namespace: jitsi
spec:
  vaultAuthGlobalRef:
    name: vso-global
    namespace: vault-secrets-operator
  kubernetes:
    role: jitsi
    serviceAccount: vso-jitsi

# Данные Jitsi: без backup target, поэтому longhorn-retain. RWO-тома на одной
# ноде требуют strategy.type: Recreate у соответствующих deployment.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  annotations:
    argocd.argoproj.io/sync-options: Prune=false
  name: jitsi-jicofo-config
  namespace: jitsi
spec:
  storageClassName: longhorn-retain
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 64Mi

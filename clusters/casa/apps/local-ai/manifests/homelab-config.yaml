# Конфиг общего окружения стенда. Копия лежит в каждом namespace, который его
# читает: ConfigMap виден только внутри своего namespace.
#
# Юнит выключен и не применяется, но ссылка не optional: без этого файла под
# зависнет в ContainerCreating, если сервис включат.
apiVersion: v1
kind: ConfigMap
metadata:
  name: homelab-config
  namespace: local-ai
data:
  DOMAIN: biplane.casa
  TZ: Asia/Yekaterinburg
  DEFAULT_LOCALE: ru

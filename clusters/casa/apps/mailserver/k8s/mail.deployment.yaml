apiVersion: apps/v1
kind: Deployment
metadata:
  name: mail
  namespace: mailserver
spec:
  # RWO-том данных: два пода при rolling update пишут в один каталог.
  strategy:
    type: Recreate
  revisionHistoryLimit: 2
  replicas: 1
  selector:
    matchLabels:
      app: mail
  template:
    metadata:
      labels:
        app: mail
    spec:
      enableServiceLinks: false
      # fsGroup даёт групповую запись в том Longhorn, иначе root-owned каталог
      # тома недоступен пользователю 1000.
      securityContext:
        fsGroup: 1000
      containers:
        - name: mail
          image: "ghcr.io/bulwarkmail/webmail:1.8@sha256:97d9d96adfb7c1d221b71b90b8380b98e2e5623f64ba62b090e45911f4ee0b3b"
          ports:
            - name: http
              containerPort: 3000
          env:
            - name: DOMAIN
              valueFrom:
                configMapKeyRef:
                  name: homelab-config
                  key: DOMAIN
            - name: TZ
              valueFrom:
                configMapKeyRef:
                  name: homelab-config
                  key: TZ
            - name: HOSTNAME
              value: "0.0.0.0"
            - name: PORT
              value: "3000"
            # Bulwark обнаруживает JMAP-сессию из браузера — нужен публичный URL.
            - name: JMAP_SERVER_URL
              value: "https://mailserver.$(DOMAIN)"
            - name: SETTINGS_SYNC_ENABLED
              value: "true"
            - name: BULWARK_TELEMETRY
              value: "off"
          startupProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 5
            failureThreshold: 30
          livenessProbe:
            httpGet:
              path: /api/health
              port: http
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /api/health
              port: http
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          securityContext:
            runAsUser: 1000
            runAsGroup: 1000
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            seccompProfile:
              type: RuntimeDefault
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: "1"
              memory: 512Mi
          volumeMounts:
            - name: data
              mountPath: /app/data
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: mailserver-mail

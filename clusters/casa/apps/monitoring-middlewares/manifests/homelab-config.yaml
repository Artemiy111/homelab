# Конфиг общего окружения стенда в namespace monitoring.
#
# Владелец — этот юнит, а не те, кто его читает: namespace общий на двенадцать
# юнитов, и копия ConfigMap у каждого означала бы SharedResourceWarning и
# драку за объект при selfHeal. Тот же принцип, что у middleware ниже: они тоже
# общие для всего namespace.
apiVersion: v1
kind: ConfigMap
metadata:
  name: homelab-config
  namespace: monitoring
data:
  DOMAIN: biplane.casa
  TZ: Asia/Yekaterinburg
  DEFAULT_LOCALE: ru

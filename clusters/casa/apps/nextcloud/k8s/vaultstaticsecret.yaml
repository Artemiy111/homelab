apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultStaticSecret
metadata:
  name: nextcloud-db
  namespace: nextcloud
spec:
  vaultAuthRef: vso-nextcloud
  mount: kv
  type: kv-v2
  path: nextcloud/db
  refreshAfter: 1h
  destination:
    name: nextcloud-db
    create: true
    overwrite: true
    transformation:
      excludeRaw: true
---
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultStaticSecret
metadata:
  name: nextcloud-admin
  namespace: nextcloud
spec:
  vaultAuthRef: vso-nextcloud
  mount: kv
  type: kv-v2
  path: nextcloud/admin
  refreshAfter: 1h
  destination:
    name: nextcloud-admin
    create: true
    overwrite: true
    transformation:
      excludeRaw: true
---
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultStaticSecret
metadata:
  name: nextcloud-metrics
  namespace: nextcloud
spec:
  vaultAuthRef: vso-nextcloud
  mount: kv
  type: kv-v2
  path: nextcloud/@monitoring/nextcloud-metrics-password
  refreshAfter: 1h
  destination:
    name: nextcloud-metrics
    create: true
    overwrite: true
    transformation:
      excludeRaw: true

apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultStaticSecret
metadata:
  name: open-webui-db
  namespace: open-webui
spec:
  vaultAuthRef: vso-open-webui
  mount: kv
  type: kv-v2
  path: open-webui/db
  refreshAfter: 1h
  destination:
    name: open-webui-db
    create: true
    overwrite: true
    transformation:
      excludeRaw: true
---
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultStaticSecret
metadata:
  name: open-webui-secrets
  namespace: open-webui
spec:
  vaultAuthRef: vso-open-webui
  mount: kv
  type: kv-v2
  path: open-webui/secrets
  refreshAfter: 1h
  destination:
    name: open-webui-secrets
    create: true
    overwrite: true
    transformation:
      excludeRaw: true

# Раздача томов внешнего NTFS-диска по SMB.
#
# Конфиг задаётся целиком, а не через `include` из образа: в Samba 4.24 glob в
# `include` не разворачивается, `testparm` молча показывает пустой
# эффективный конфиг и не сообщает об ошибке — под поднимается, порт
# открыт, шар нет.
#
# Значения `%U` и `%S` не взаимозаменяемы: в секции `homes` дистрибутива
# `valid users = %S` работает только потому, что имя шары совпадает с именем
# пользователя; здесь шара называется `ntfs2`, и `%S` превратился бы в
# требование пользователя по имени `ntfs2`.

[global]
    workgroup = WORKGROUP
    server string = homelab samba
    server role = standalone server
    security = user
    map to guest = never

    # Только SMB2+: SMB1 и NetBIOS не нужны, а legacy-протоколы —
    # основная поверхность атаки на шару, доступную из всей LAN.
    server min protocol = SMB2_10
    client min protocol = SMB2_10
    smb ports = 445

    # Шары доступны по имени `smb.<домен>`, резолвится в адрес узла.
    # Порт 445 публикуется на узле через hostPort, поэтому широковещание
    # имён NetBIOS не нужно, а DNS-записи WSD не используются.
    dns proxy = no
    wins support = no

    load printers = no
    printing = bsd
    printcap name = /dev/null
    disable spoolss = yes

    # Диск отдаётся по USB 2.0 и упирается в канал, а не в CPU: sendfile
    # отдаёт ядру готовые страницы без копирования через пользовательское
    # пространство, aio снимает блокировки на последовательных запросах.
    use sendfile = yes
    aio read size = 1
    aio write size = 1

    # Файлы создаются от Unix-учётки, а не от учётки клиента: на NTFS
    # владелец всё равно синтезируется из опций монтирования, и без этого
    # клиент получает в Проводнике файлы, которые не может удалить.
    force user = ops
    force group = ops

    # Шара отдаёт диск целиком: symlink'и за пределы тома на хосте — это
    # обход `read only` через ссылку на rw-том.
    follow symlinks = no
    wide links = no
    unix extensions = no

    log file = /dev/stdout
    log level = 1
    max log size = 5000

    # Каталоги состояния — на пустом томе пода. В образе они лежат в
    # /var/lib/samba, который смонтирован пустым: без явных путей smbd
    # берёт дефолт из `global/private dir` и не находит базу паролей.
    private dir = /var/lib/samba/private
    state directory = /var/lib/samba/state
    cache directory = /var/lib/samba/cache
    lock directory = /var/lib/samba/lockdir
    pid directory = /var/lib/samba/lockdir

[ntfs1]
    path = /mnt/ntfs1
    read only = no
    browseable = yes
    guest ok = no
    valid users = storage
    follow symlinks = no
    wide links = no

[ntfs2]
    path = /mnt/ntfs2
    read only = yes
    browseable = yes
    guest ok = no
    valid users = storage
    follow symlinks = no
    wide links = no

[ntfs3]
    path = /mnt/ntfs3
    read only = no
    browseable = yes
    guest ok = no
    valid users = storage
    follow symlinks = no
    wide links = no

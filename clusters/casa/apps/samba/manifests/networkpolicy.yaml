# Трафик к SMB идёт напрямую с хостов LAN и узла через hostPort, а не через
# Traefik, поэтому разрешать вход от traefik здесь незачем — это была бы
# дыра: любой маршрут в кластере получил бы доступ к дискам. Веб-морда над
# шарой — не маршрут Traefik, а самостоятельный SMB-клиент, и она перечислена
# поимённо: селектор по метке пустил бы к дискам любой namespace, который эту
# метку себе поставит.
#
# Вход разрешён с адресов локальной сети и CGNAT-диапазона Tailscale:
# `smb.<домен>` резолвится в адрес узла, и клиенты ходят по имени. Адрес узла
# не дублируется — правило описывает подсеть, поэтому переезд узла его не
# ломает.
#
# Egress не ограничивается: см. clusters/casa/apps/technitium/manifests/networkpolicy.yaml.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-ingress
  namespace: samba
spec:
  podSelector: {}
  policyTypes:
    - Ingress
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-ingress
  namespace: samba
spec:
  podSelector: {}
  policyTypes:
    - Ingress
  ingress:
    - from:
        - ipBlock:
            cidr: 192.168.0.0/16
        - ipBlock:
            cidr: 100.64.0.0/10
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: filestash
      ports:
        - port: 445
          protocol: TCP
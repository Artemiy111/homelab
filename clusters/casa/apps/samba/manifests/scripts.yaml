# Скрипты initContainer'а и точки входа smbd.
#
# Логика проверки томов и создания учётки проверялась на живом кластере до
# того, как попала сюда: см. README, раздел «Проверка».
apiVersion: v1
kind: ConfigMap
metadata:
  name: samba-scripts
  namespace: samba
data:
  # Главная проверка задачи: hostPath в Kubernetes не знает про монтирования
  # хоста. Если том не смонтирован, точка монтирования — пустой каталог на
  # корневом разделе, под стартует, smb работает, шара открывается пустой, без
  # единой ошибки. Клиент решит, что данные пропали.
  #
  # Три независимых признака, каждый по отдельности недостаточен:
  #
  # 1. fstype == ntfs3. Точка без тома видна в /proc/self/mounts как `xfs`
  #    (корневой раздел хоста) — это и есть «каталог вместо тома».
  # 2. Режим ro/rw совпадает с описанием тома. `read only = yes` в секции
  #    шары не мешает ядру: клиент получит ошибку ввода-вывода вместо внятного
  #    «read-only resource».
  # 3. Серийный номер тома совпадает с UUID из fstab. Другой диск даёт тот же
#    fstype и тот же режим — отличает только номер.
  #
  # UUID'ы ниже — единственный источник правды: fstab на хосте больше не
  # управляется Ansible, и синхронизировать их не с чем.
  #
  # Номер выводит `stat -f` (`ID`), и он совпадает с UUID из fstab с
  # переставленными половинками: ntfs3 печатает серийник в порядке байт,
  # противоположном порядку в UUID.
  verify-mounts.sh: |
    #!/bin/sh
    set -eu

    # точка:режим:UUID — значения из /etc/fstab хоста
    SHARES="ntfs1 ro 36447F8E447F4F9B
    ntfs2 ro F49090CD909097A6
    ntfs3 rw 962A2DEC2A2DC9D7"

    uuid_to_serial() {
      echo "$1" | sed -E 's/^(....)(....)(....)(....)$/\3\4\1\2/' | tr 'A-F' 'a-f'
    }

    fail() {
      echo "samba-init: ОШИБКА: $*" >&2
      exit 1
    }

    # `while read` в конвейере исполняется в подпроцессе, поэтому `exit 1`
    # внутри него не остановит скрипт. Флаг наружу — единственный способ
    # сохранить код возврата.
    failed=0

    echo "$SHARES" | while read -r name mode uuid; do
      [ -n "$name" ] || continue
      path="/mnt/$name"

      [ -d "$path" ] || fail "$name: точка $path не существует"

      line="$(awk -v p="$path" '$2 == p { line = $0 } END { print line }' /proc/self/mounts)"
      if [ -z "$line" ]; then
        echo "samba-init: ОШИБКА: $name: $path не смонтирован — в /proc/self/mounts нет записи с таким mountpoint. Том NTFS не подключён или не смонтирован." >&2
        failed=1
        continue
      fi

      fstype="$(echo "$line" | awk '{ print $3 }')"
      if [ "$fstype" != "ntfs3" ]; then
        echo "samba-init: ОШИБКА: $name: $path смонтирован как '$fstype', ожидался ntfs3. Это каталог корневого раздела, а не том NTFS: шара была бы пустой." >&2
        failed=1
        continue
      fi

      opts="$(echo "$line" | awk '{ print $4 }')"
      case ",$opts," in
        *",$mode,"*) ;;
        *)
          echo "samba-init: ОШИБКА: $name: $path смонтирован с режимом '$opts', ожидался '$mode'. Расхождение с fstab." >&2
          failed=1
          continue
          ;;
      esac

      serial="$(stat -f "$path" | awk '/ID:/ { print $2 }')"
      want="$(uuid_to_serial "$uuid")"
      if [ "$serial" != "$want" ]; then
        echo "samba-init: ОШИБКА: $name: в точке $path том '$serial', а ожидался '$want' (UUID $uuid). Это не тот диск." >&2
        failed=1
        continue
      fi

      echo "samba-init: $name на месте: ntfs3, $mode, том $serial"
    done

    [ "$failed" -eq 0 ] || exit 1

  # Unix-учётки для smbd.
  #
  # `smbpasswd -a` отказывает с «Failed to add entry», если учётки нет в
  # /etc/passwd: база tdbsam хранит только пароль, а привязка к системной
  # учётке обязательна. Это технические аккаунты, вход невозможен; файлами
  # они не владеют — за это отвечает `force user` в секциях шар.
  #
  # `artlab` — не копия хоста: в кластере важны только uid/gid 1000, которые
  # синтезирует ntfs3 из опций монтирования. Имя оставлено тем же, чтобы
  # конфиг шар совпадал с хостовым и владелец файлов читался одинаково в
  # `kubectl exec` и в `ls` на узле.
  ensure-users.sh: |
    #!/bin/sh
    set -eu

    for d in /var/lib/samba/private /var/lib/samba/state /var/lib/samba/cache /var/lib/samba/lockdir; do
      mkdir -p "$d"
    done

    getent group artlab >/dev/null 2>&1 || addgroup -g 1000 artlab
    getent passwd artlab >/dev/null 2>&1 || adduser -D -H -u 1000 -G artlab -s /sbin/nologin artlab
    getent passwd storage >/dev/null 2>&1 || adduser -D -H -s /sbin/nologin storage

  # Подготовка перед стартом smbd: тома, учётки, пароль.
  #
  # `smbpasswd -s` читает пароль из stdin, чтобы он не остался в списке
  # процессов. В Kubernetes stdin initContainer'а недоступен напрямую, пароль
  # приходит из Secret через env, а в пайп уходит уже развёрнутым в
  # переменную оболочки: в `ps` и в `/proc/*/cmdline` значения нет.
  provision.sh: |
    #!/bin/sh
    set -eu

    /scripts/verify-mounts.sh
    /scripts/ensure-users.sh

    printf '%s\n%s\n' "$SMB_PASSWORD" "$SMB_PASSWORD" | smbpasswd -s -a storage

    # smbpasswd может отработать без ошибки, не записав запись: база лежит на
    # пустом томе пода, и при недоступном каталоге команда завершается успехом
    # с пустой базой. Клиенты не смогут аутентифицироваться, и заметить это
    # можно только по их жалобам — поэтому проверяем тут.
    pdbedit -L | grep -q '^storage:' || {
      echo "samba-init: ОШИБКА: storage не появился в базе Samba (pdbedit -L)" >&2
      exit 1
    }
    echo "samba-init: учётка storage создана"

  # Точка входа smbd. Учётки создаются повторно: у initContainer'а и у
  # контейнера с smbd своя файловая система, /etc/passwd initContainer'а в
  # основной контейнер не попадает.
  entrypoint.sh: |
    #!/bin/sh
    set -eu

    /scripts/ensure-users.sh
    exec smbd -F --no-process-group --configfile=/etc/samba/smb.conf
apiVersion: v1
kind: ServiceAccount
metadata:
  name: vso-samba
  namespace: samba
---
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultAuth
metadata:
  name: vso-samba
  namespace: samba
spec:
  vaultAuthGlobalRef:
    name: vso-global
    namespace: vault-secrets-operator
  kubernetes:
    role: samba
    serviceAccount: vso-samba
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultStaticSecret
metadata:
  name: samba-storage
  namespace: samba
spec:
  vaultAuthRef: vso-samba
  mount: kv
  type: kv-v2
  path: samba/storage
  refreshAfter: 1h
  destination:
    name: samba-storage
    create: true
    overwrite: true
    transformation:
      excludeRaw: true
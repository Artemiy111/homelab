apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: seafile
resources:
  - namespace.yaml
  - onlyoffice.middleware.yaml
  - onlyoffice.route.yaml
  - route.yaml
  - networkpolicy.yaml
  - onlyoffice.deployment.yaml
  - onlyoffice.service.yaml
  - pvcs.yaml
  - redis.deployment.yaml
  - redis.service.yaml
  - seafile.deployment.yaml
  - seafile.service.yaml
  - vaultauth.yaml
  - vaultstaticsecret.yaml
configMapGenerator:
  - name: seafile-config
    files:
      - seahub_oauth.py
      - seahub_onlyoffice.py
      - prepare-seahub.sh
      - patches/seahub-base-accounts.patch
      - patches/seahub-oauth-views.patch

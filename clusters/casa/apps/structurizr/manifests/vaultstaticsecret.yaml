apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultStaticSecret
metadata:
  name: structurizr-registry
  namespace: structurizr
spec:
  vaultAuthRef: vso-structurizr
  mount: kv
  type: kv-v2
  path: yc/cloud-registry
  refreshAfter: 1h
  destination:
    name: structurizr-registry
    create: true
    overwrite: true
    type: kubernetes.io/dockerconfigjson
    transformation:
      excludes:
        - ".*"
      templates:
        .dockerconfigjson:
          text: |
            {{- $key := get .Secrets "key" -}}
            {{- $auth := printf "api_key:%s" $key | b64enc -}}
            {{- printf "{\"auths\":{\"registry.yandexcloud.net\":{\"username\":\"api_key\",\"password\":%s,\"auth\":%s}}}" ($key | toJson) ($auth | toJson) -}}

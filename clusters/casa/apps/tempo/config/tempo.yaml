server:
  http_listen_port: 3200
  log_level: info

distributor:
  receivers:
    otlp:
      protocols:
        grpc:
          endpoint: 0.0.0.0:4317
        http:
          endpoint: 0.0.0.0:4318

storage:
  trace:
    backend: local
    wal:
      path: /var/tempo/wal
    local:
      path: /var/tempo/blocks
    # Без этого опроса blocklist не происходит и планировщик задач не знает,
    # какие блоки устарели. Дефолт в Tempo 3.x — 5 минут, задаём явно.
    blocklist_poll: 5m

# В Tempo 3.0.3 секции `compactor:` больше нет: её заменили backend scheduler
# и backend worker. Проверено `/tempo -config.verify=true` — старый вариант с
# `compactor:` падает с "field compactor not found in type app.Config".
# Удалением трейсов занимается backend worker, а задачи на удаление и
# компактизацию генерирует backend scheduler.
# Без этого блока данные не удаляются никогда, и PVC 5Gi переполнится
# (измеренный рост ~0.24 GiB/сутки при Traefik с sampleRate 1.0 плюс Beyla).
# 168h = неделя, по замерам это ~1.7 GiB — влезает в 5 Gi с запасом.
backend_scheduler:
  provider:
    retention:
      interval: 1h
    compaction:
      compaction:
        block_retention: 168h
        compacted_block_retention: 1h

usage_report:
  reporting_enabled: false

apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  annotations:
    argocd.argoproj.io/compare-options: ServerSideDiff=false
    argocd.argoproj.io/sync-wave: "40"
  name: uptime-kuma
  namespace: argocd
spec:
  project: homelab
  sources:
    - repoURL: https://github.com/Artemiy111/homelab.git
      targetRevision: main
      path: clusters/casa/apps/uptime-kuma/manifests
  destination:
    server: https://kubernetes.default.svc
    namespace: uptime-kuma
  syncPolicy:
    automated:
      prune: true
      selfHeal: true

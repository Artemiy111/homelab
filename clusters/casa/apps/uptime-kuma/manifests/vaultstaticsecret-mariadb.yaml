# Секреты внешней MariaDB Uptime Kuma.
#
# Два пути, потому что их читают разные потребители: root-пароль нужен
# оператору (поле spec.rootPasswordSecretKeyRef у MariaDB CR не меняется после
# создания CR), а учётные данные приложения читает сам Deployment.
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultStaticSecret
metadata:
  name: uptime-kuma-mariadb
  namespace: uptime-kuma
spec:
  vaultAuthRef: vso-uptime-kuma
  mount: kv
  type: kv-v2
  path: uptime-kuma/db
  refreshAfter: 1h
  destination:
    name: uptime-kuma-mariadb
    create: true
    overwrite: true
    transformation:
      excludeRaw: true
---
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultStaticSecret
metadata:
  name: uptime-kuma-mariadb-root
  namespace: uptime-kuma
spec:
  vaultAuthRef: vso-uptime-kuma
  mount: kv
  type: kv-v2
  path: uptime-kuma/root
  refreshAfter: 1h
  destination:
    name: uptime-kuma-mariadb-root
    create: true
    overwrite: true
    transformation:
      excludeRaw: true

# Базовый NetworkPolicy: default-deny ingress + явные разрешения.
# Потребители Verdaccio: раннер с его job'ами (namespace forgejo) и Traefik
# (маршрут npm.<домен> для локального `bun install` с машины разработчика).
# Egress не ограничивается: Verdaccio ходит в uplink (registry.npmjs.org).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-ingress
  namespace: verdaccio
spec:
  podSelector: {}
  policyTypes:
    - Ingress
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-ingress
  namespace: verdaccio
spec:
  podSelector: {}
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector: {}
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: forgejo
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: traefik
      ports:
        - port: 4873
          protocol: TCP

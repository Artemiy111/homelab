apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: monitoring
resources:
  - homelab-config.yaml
  - vaultauth.yaml
  - route.yaml
  - vaultstaticsecret.yaml
  - victoriametrics.deployment.yaml
  - victoriametrics.service.yaml
  - vmagent-rbac.yaml
  - vmagent.deployment.yaml
  - vmagent.service.yaml
  - vmdata.pvc.yaml
configMapGenerator:
  # scrape.yml собирается в ConfigMap `vmagent-scrape`; kustomize добавляет хэш
  # содержимого к имени и переписывает ссылку в Deployment, поэтому правка
  # конфига сама запускает rollout. vmagent не перечитывает файл на ходу
  # (см. docs.victoriametrics.com/vmagent/#configuration-update).
  - name: vmagent-scrape
    files:
      - config/vmagent/scrape.yml

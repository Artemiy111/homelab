# NetworkPolicy для namespace zitadel: default-deny ingress + явные разрешения.
# traefik — zitadel и login; vmagent из monitoring скрейпит метрики zitadel
# (8080) и встроенного экспортёра CNPG (9187). Оператор CNPG из cnpg-system
# обязан ходить в под кластера: 8000 — instance manager (status), 5432 —
# PostgreSQL. Egress не ограничен.
#
# Порт-лист — часть конкретного правила ingress, а не общий для всего spec:
# блок без ports не ограничен, поэтому доступы с ограничением портов выносятся
# отдельными правилами.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-ingress
  namespace: zitadel
spec:
  podSelector: {}
  policyTypes:
    - Ingress
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-ingress
  namespace: zitadel
spec:
  podSelector: {}
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector: {}
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: traefik
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: cnpg-system
      ports:
        - port: 8000
          protocol: TCP
        - port: 5432
          protocol: TCP
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitoring
          podSelector:
            matchLabels:
              app: vmagent
      ports:
        - port: 8080
          protocol: TCP
        - port: 9187
          protocol: TCP

apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: zitadel
resources:
  - homelab-config.yaml
  - namespace.yaml
  - vaultauth.yaml
  - vaultstaticsecret.yaml
  - login.deployment.yaml
  - login.service.yaml
  - login.vpa.yaml
  - networkpolicy.yaml
  - zitadel.deployment.yaml
  - zitadel.service.yaml
  - zitadel.vpa.yaml
  - route.yaml
  - zitadel-db.cluster.yaml
  - zitadel-db.databases.yaml
configMapGenerator:
  - name: zitadel-config
    files:
      - config/zitadel.yaml

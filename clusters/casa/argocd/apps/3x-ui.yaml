apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  annotations:
    argocd.argoproj.io/sync-wave: "40"
  name: 3x-ui
  namespace: argocd
spec:
  project: homelab
  sources:
    # homelab-config и манифест лежат рядом с локальным чартом: конфиг общего
    # окружения дублируется в каждый namespace, который его читает.
    - repoURL: https://github.com/Artemiy111/homelab.git
      targetRevision: main
      path: apps/casa/3x-ui/manifests
    - repoURL: https://github.com/Artemiy111/homelab.git
      targetRevision: main
      path: apps/casa/3x-ui/chart
      helm:
        releaseName: xui
  destination:
    server: https://kubernetes.default.svc
    namespace: 3x-ui
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - ServerSideApply=true

# authentik отключён вручную: оба Deployment живут с replicas: 0, в git стоит 1.
# Расхождение не зафиксировано ни в README, ни в ADR, поэтому синк включён бы
# и вернул сервис на перегруженную ноду (issue #727). Application заведён без
# блока syncPolicy.automated — Argo не создаст поды обратно. Включение:
# либо убрать блок automated из этого файла, либо решить судьбу сервиса и
# привести replicas в этом файле и в apps/casa/authentik/manifests/ к одному значению.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  annotations:
    argocd.argoproj.io/sync-wave: "40"
  name: authentik
  namespace: argocd
spec:
  project: homelab
  sources:
    - repoURL: https://github.com/Artemiy111/homelab.git
      targetRevision: main
      path: apps/casa/authentik/manifests
  destination:
    server: https://kubernetes.default.svc
    namespace: authentik
  syncPolicy:
    syncOptions:
      - ServerSideApply=true
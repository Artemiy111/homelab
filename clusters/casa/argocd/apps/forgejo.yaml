# Имена forgejo и vault уже заняты платформенными Application'ами: они ставят
# сами сервисы чартами forgejo-helm и hashicorp/vault-helm. Эти два Application
# покрывают то, что осталось в apps/casa/<сервис>/k8s/ — маршрут, NetworkPolicy и
# секреты, — потому что чарты их не создают.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  annotations:
    argocd.argoproj.io/sync-wave: "40"
  name: forgejo-extras
  namespace: argocd
spec:
  project: homelab
  sources:
    - repoURL: https://github.com/Artemiy111/homelab.git
      targetRevision: main
      path: apps/casa/forgejo/manifests
  destination:
    server: https://kubernetes.default.svc
    namespace: forgejo
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - ServerSideApply=true

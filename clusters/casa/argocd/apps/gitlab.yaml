# gitlab отключён вручную: в кластере Deployment жил с replicas: 0, в этом файле
# стоит 1. Расхождение не зафиксировано ни в README, ни в ADR, поэтому синк с
# selfHeal вернул бы сервис на ноду, уже занятую на 85% по памяти (issue #727),
# а GitLab CE по лимиту занимает 5Gi. Application заведён без блока
# syncPolicy.automated — Argo не поднимет поды обратно. Это тот же приём, что у
# alloy-profiler и authentik.
#
# Включение — два шага, и оба должны быть вместе: убрать блок automated из
# этого файла и снять ручной масштаб в кластере. Пока в apps/casa/gitlab/manifests/
# deployment.yaml стоит replicas: 1, приложение без automated будет постоянно
# OutOfSync, и это служит индикатором выключенного состояния.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  annotations:
    argocd.argoproj.io/sync-wave: "40"
  name: gitlab
  namespace: argocd
spec:
  project: homelab
  sources:
    - repoURL: https://github.com/Artemiy111/homelab.git
      targetRevision: main
      path: apps/casa/gitlab/manifests
  destination:
    server: https://kubernetes.default.svc
    namespace: gitlab
  syncPolicy:
    syncOptions:
      - ServerSideApply=true

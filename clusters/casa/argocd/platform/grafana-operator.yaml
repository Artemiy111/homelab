# Grafana Operator — CRD и контроллер для Grafana и Loki. Держит в кластере
# CRD `monitoring.coreos.com` и `grafana.integreatly.org`.
#
# Значения вынесены из `spec.source.helm.valuesObject` в
# `platform/casa/grafana-operator/values.yaml`, Application подключает их через
# `$values` — второй источник в `spec.sources`.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  annotations:
    argocd.argoproj.io/sync-wave: "10"
  name: grafana-operator
  namespace: argocd
spec:
  project: upstream
  sources:
    - repoURL: https://github.com/Artemiy111/homelab.git
      targetRevision: main
      path: platform/casa/grafana-operator/manifests
    - repoURL: ghcr.io/grafana/helm-charts
      chart: grafana-operator
      targetRevision: 5.25.0
      helm:
        releaseName: grafana-operator
        valueFiles:
          - $values/platform/casa/grafana-operator/values.yaml
    - repoURL: https://github.com/Artemiy111/homelab.git
      targetRevision: main
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: grafana-operator
  syncPolicy:
    syncOptions:
      - ServerSideApply=true
      - Prune=false
    automated:
      selfHeal: true

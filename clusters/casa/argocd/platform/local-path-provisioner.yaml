# local-path-provisioner — дефолтный StorageClass кластера: PVC без явного
# storageClassName биндятся к нему. Официальный чарт из репозитория проекта
# (каталог deploy/chart/local-path-provisioner), Argo рендерит его сам.
#
# Значения вынесены из `spec.source.helm.valuesObject` в
# `platform/casa/local-path-provisioner/values.yaml`, Application подключает их через
# `$values` — второй источник в `spec.sources`.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  annotations:
    argocd.argoproj.io/sync-wave: "10"
  name: local-path-provisioner
  namespace: argocd
spec:
  project: upstream
  sources:
    - repoURL: https://github.com/Artemiy111/homelab.git
      targetRevision: main
      path: platform/casa/local-path-provisioner/manifests
    - repoURL: https://github.com/rancher/local-path-provisioner.git
      path: deploy/chart/local-path-provisioner
      targetRevision: v0.0.37
      helm:
        releaseName: local-path-provisioner
        valueFiles:
          - $values/platform/casa/local-path-provisioner/values.yaml
    - repoURL: https://github.com/Artemiy111/homelab.git
      targetRevision: main
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: local-path-storage
  syncPolicy:
    syncOptions:
      - ServerSideApply=true
    automated:
      prune: true
      selfHeal: true
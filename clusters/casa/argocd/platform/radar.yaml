# Radar — open-source Kubernetes UI (один Go-бинарь): топология, ресурсы, Helm,
# GitOps, аудит, MCP. Ставится официальным чартом skyhook/radar; маршрут —
# apps/casa/radar/manifests/route.yaml.
#
# auth.mode=oidc: Radar входит в Zitadel сам и имперсонирует пользователя в
# Kubernetes, поэтому права определяет RBAC пользователя, а не общий
# ServiceAccount. oauth2-proxy с маршрута Radar убран — иначе Zitadel не смог бы
# отдать claim `role`.
#
# Значения вынесены из `spec.source.helm.valuesObject` в
# `platform/casa/radar/values.yaml`, Application подключает их через `$values` —
# второй источник в `spec.sources`.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  annotations:
    argocd.argoproj.io/sync-wave: "20"
  name: radar
  namespace: argocd
spec:
  project: upstream
  sources:
    - repoURL: https://github.com/Artemiy111/homelab.git
      targetRevision: main
      path: platform/casa/radar/manifests
    - repoURL: https://skyhook-io.github.io/helm-charts
      chart: radar
      targetRevision: 1.14.1
      helm:
        releaseName: radar
        valueFiles:
          - $values/platform/casa/radar/values.yaml
    - repoURL: https://github.com/Artemiy111/homelab.git
      targetRevision: main
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: radar
  syncPolicy:
    syncOptions:
      - ServerSideApply=true
    automated:
      selfHeal: true

# Traefik — единственный вход в кластер: терминирует TLS, держит Gateway и
# HTTPRoute, публикует /dashboard.
#
# Значения лежат в platform/casa/traefik/values.yaml и подключаются через `$values`.
# Раньше те же 32 значения были продублированы инлайн в `valuesObject`, и правка
# файла молча расходилась с кластером — долг был зафиксирован в platform/casa/argocd/RUNBOOK.md.
#
# Второй источник — этот же репозиторий по SSH с deploy key, добавленным
# `argocd repo add`. В нём Argo берёт только values: `ref: values` ограничивает
# источник файлами values, поэтому манифесты из этого репозитория сюда не
# попадают.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  annotations:
    argocd.argoproj.io/sync-wave: "20"
  name: traefik
  namespace: argocd
spec:
  project: upstream
  sources:
    # Gateway и GatewayClass — кластерные объекты Traefik, а не общее окружение
    # стенда. Второй источник обычным каталогом — Argo сводит манифесты
    # источников в один набор.
    - repoURL: https://github.com/Artemiy111/homelab.git
      targetRevision: main
      path: platform/casa/traefik/manifests
    - repoURL: https://traefik.github.io/charts
      chart: traefik
      targetRevision: 41.4.0
      helm:
        releaseName: traefik
        # CRD `*.traefik.io` кластерные: под управлением Argo удаление
        # приложения снесло бы все IngressRoute и Middleware кластера.
        skipCrds: true
        valueFiles:
          - $values/platform/casa/traefik/values.yaml
    - repoURL: https://github.com/Artemiy111/homelab.git
      targetRevision: main
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: traefik
  syncPolicy:
    syncOptions:
      - ServerSideApply=true
    automated:
      selfHeal: true
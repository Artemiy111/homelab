apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  annotations:
    argocd.argoproj.io/sync-wave: "10"
  name: trivy-operator
  namespace: argocd
spec:
  project: upstream
  sources:
    - repoURL: https://github.com/Artemiy111/homelab.git
      targetRevision: main
      path: platform/casa/trivy-operator/manifests
    - repoURL: https://aquasecurity.github.io/helm-charts/
      chart: trivy-operator
      targetRevision: 0.25.0
      helm:
        releaseName: trivy-operator
        valueFiles:
          - $values/platform/casa/trivy-operator/values.yaml
    - repoURL: https://github.com/Artemiy111/homelab.git
      targetRevision: main
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: trivy-system
  ignoreDifferences:
    - group: aquasecurity.github.io
      kind: ClusterComplianceReport
      jsonPointers:
        - /spec
  syncPolicy:
    syncOptions:
      - ServerSideApply=true
      - Prune=false
      - RespectIgnoreDifferences=true
    automated:
      selfHeal: true

apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  annotations:
    argocd.argoproj.io/sync-wave: "10"
  name: velero
  namespace: argocd
spec:
  project: upstream
  sources:
    - repoURL: https://github.com/Artemiy111/homelab.git
      targetRevision: main
      path: platform/casa/velero/manifests
    - repoURL: https://vmware-tanzu.github.io/helm-charts
      chart: velero
      targetRevision: 12.2.1
      helm:
        releaseName: velero
        valueFiles:
          - $values/platform/casa/velero/values.yaml
    - repoURL: https://github.com/Artemiy111/homelab.git
      targetRevision: main
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: velero
  syncPolicy:
    syncOptions:
      - ServerSideApply=true
      - Prune=false
    automated:
      selfHeal: true

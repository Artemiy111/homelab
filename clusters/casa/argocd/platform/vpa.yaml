apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  annotations:
    argocd.argoproj.io/sync-wave: "10"
  name: vpa
  namespace: argocd
spec:
  project: upstream
  sources:
    - repoURL: https://github.com/Artemiy111/homelab.git
      targetRevision: main
      path: platform/casa/vpa/manifests
    - repoURL: https://kubernetes.github.io/autoscaler
      chart: vertical-pod-autoscaler
      targetRevision: 0.13.0
      helm:
        releaseName: vpa
        valueFiles:
          - $values/platform/casa/vpa/values.yaml
    - repoURL: https://github.com/Artemiy111/homelab.git
      targetRevision: main
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: vpa
  syncPolicy:
    syncOptions:
      - ServerSideApply=true
      - Prune=false
    automated:
      selfHeal: true

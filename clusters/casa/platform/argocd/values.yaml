  # → argocd-cm.
  cm:
    timeout.reconciliation: 60s

    resource.customizations.health.postgresql.cnpg.io_Cluster: |
      hs = {}
      if obj.status == nil or obj.status.conditions == nil then
        hs.status = "Progressing"
        hs.message = "Waiting for the operator to reconcile the Cluster"
        return hs
      end
      if obj.status.observedGeneration ~= nil and obj.metadata.generation ~= nil and obj.status.observedGeneration < obj.metadata.generation then
        hs.status = "Progressing"
        hs.message = "Waiting for the operator to observe the Cluster"
        return hs
      end
      for _, condition in ipairs(obj.status.conditions) do
        if condition.type == "Ready" then
          if condition.status == "True" then
            hs.status = "Healthy"
          else
            hs.status = "Progressing"
          end
          hs.message = condition.message or obj.status.phase or ""
          return hs
        end
      end
      hs.status = "Progressing"
      hs.message = obj.status.phase or "Waiting for the Ready condition"
      return hs
    resource.customizations.health.postgresql.cnpg.io_Database: |

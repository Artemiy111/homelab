# Argo CD — пробный стенд. Чарт argo/argo-cd 10.9.1 → Argo CD v3.5.3.
#
# ПРАВИЛО: здесь только ОТКЛОНЕНИЯ от дефолтов чарта, каждое с причиной.
# Посмотреть все ~4900 строк дефолтов:
#   helm show values argo/argo-cd --version 10.9.1
#
# ─── Почему в этом файле нет ничего про Traefik ──────────────────────────
# Чарт не определяет ingress-контроллер и не должен: он лишь умеет рендерить
# обычный networking.k8s.io/v1 Ingress, если включить server.ingress.enabled
# (по умолчанию false). Даже у server.ingress.controller выбор всего из
# generic | aws | gke — Traefik там не предусмотрен, потому что это
# не аннотации, а отдельный CRD-провайдер.
# Мы используем IngressRoute (см. argocd/route.yaml), поэтому
# от Argo требуется ровно одно: отдавать HTTP-бэкенд, раз TLS терминирует
# Traefik. За это отвечает configs.params."server.insecure" ниже.
# ─────────────────────────────────────────────────────────────────────────

global:
  domain: argocd.biplane.casa
  priorityClassName: platform-critical

configs:
  # → argocd-cmd-params-cm. Ключ = имя флага без "--".
  params:
    # терминируем TLS в Traefik
    server.insecure: true

    # кэш отрендеренных манифестов, дефолт 24h. Ошибка рендера кэшируется на
    # весь срок, и исправление манифестов в git не видно до его конца: не
    # помогают ни `app get --refresh`, ни аннотация refresh=hard, ни рестарт
    # repo-server. Ключ не перекрывает ревизию, поэтому обойти можно было
    # только пересозданием Application. 10m — компромисс между временем
    # восстановления и лишним рендером на ноде под давлением по памяти (#727).
    controller.default.cache.expiration: 10m

    controller.repo.server.timeout.seconds: "300"
    controller.diff.server.side: "true"


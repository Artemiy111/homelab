# cert-manager — выпуск и ротация TLS-сертификатов из кластера.
# Ставится официальным чартом cert-manager из charts.jetstack.io.
#
# CRD ставим вместе с оператором: они кластерные, и Prune=false не даёт удалить
# их вместе с приложением (иначе снесло бы все Certificate/Issuer кластера).
#
# Эмитент и Certificate живут не здесь, а в шаблонах чарта clusters/casa/platform/homelab
# (templates/cert-manager/): CRD должны существовать раньше CR, а порядок
# «сначала оператор, потом CR» Argo в одном приложении не гарантирует.
#
# Вебхук-сертификаты cert-manager выпускает сам (self-signed bootstrap CA).
# Helm `lookup` в Argo не работает, поэтому ниже ignoreDifferences на поля,
# которые дописывает контроллер, а RespectIgnoreDifferences не даёт selfHeal
# переписать их обратно.
#
# Метрики: prometheus.enabled оставлен дефолтным true — чарт развешивает
# аннотации `prometheus.io/scrape` на подах controller, webhook и cainjector.
# Забирает их vmagent статическими job'ами по Service'ам на порту 9402
# (clusters/casa/apps/victoria-metrics/config/vmagent/scrape.yml). Pod-discovery по аннотациям
# в scrape.yml отсутствует, поэтому рассчитывать на него нельзя. CRD
# prometheus-operator (monitoring.coreos.com) в кластере нет, поэтому никаких
# PodMonitor/ServiceMonitor не создаём.
#
# Значения вынесены из `spec.source.helm.valuesObject` в
# `clusters/casa/platform/cert-manager/values.yaml`, Application подключает их через
# `$values` — второй источник в `spec.sources`.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cert-manager
  namespace: argocd
spec:
  project: upstream
  sources:
    - repoURL: https://charts.jetstack.io
      chart: cert-manager
      targetRevision: v1.21.2
      helm:
        releaseName: cert-manager
        valueFiles:
          - $values/clusters/casa/platform/cert-manager/values.yaml
    - repoURL: ssh://git@forgejo.biplane.casa:2222/artemiy/homelab.git
      targetRevision: main
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: cert-manager
  # `group` не указан: для core-API группа пустая, и Argo это подразумевает.
  # Явное `group: ""` нельзя — server-side apply срезает пустую строку, и поле
  # пропадает из живого объекта: Application уходит в OutOfSync с
  # `group: ""` в желаемом состоянии и без него в живом.
  ignoreDifferences:
    - kind: Secret
      name: cert-manager-webhook-ca
      namespace: cert-manager
      jsonPointers:
        - /data
  syncPolicy:
    syncOptions:
      - ServerSideApply=true
      - Prune=false
      - CreateNamespace=true
      - RespectIgnoreDifferences=true
    automated:
      selfHeal: true
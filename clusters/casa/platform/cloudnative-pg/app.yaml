# CloudNativePG — оператор PostgreSQL: кластеры, failover, бэкапы, PITR.
# Ставится официальным чартом cloudnative-pg из cloudnative-pg.github.io/charts.
#
# Оператор кластерный (config.clusterWide, дефолт true): одна установка
# обслуживает все Cluster'ы во всех namespace. Поэтому его namespace
# (cnpg-system) не совпадает с namespace баз (databases) — так и задумано.
#
# Сами кластеры и базы живут в clusters/casa/platform/cnpg/ отдельными манифестами. Argo ими
# не управляет: CRD оператора должны существовать раньше, а порядок «сначала
# оператор, потом CR» Argo в одном приложении не гарантирует.
#
# Мониторинг: monitoring.podMonitorEnabled оставлен дефолтным false. В кластере
# нет CRD prometheus-operator (monitoring.coreos.com), PodMonitor'ы некому
# читать, а с версии 1.30 поле вообще deprecated. Метрики при этом доступны:
# instance manager каждого инстанса отдаёт /metrics на 9187, и vmagent заберёт
# их через pod-discovery (задача после установки, см. clusters/casa/platform/cnpg/README.md).
# Grafana-дашборд из чарта не ставим: UI уже есть, дашборд принесём сами.
#
# Значения вынесены из `spec.source.helm.valuesObject` в
# `clusters/casa/platform/cloudnative-pg/values.yaml`, Application подключает их через
# `$values` — второй источник в `spec.sources`.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cloudnative-pg
  namespace: argocd
spec:
  project: upstream
  sources:
    - repoURL: https://cloudnative-pg.github.io/charts
      chart: cloudnative-pg
      targetRevision: 0.29.0
      helm:
        releaseName: cloudnative-pg
        valueFiles:
          - $values/clusters/casa/platform/cloudnative-pg/values.yaml
    - repoURL: ssh://git@forgejo.biplane.casa:2222/artemiy/homelab.git
      targetRevision: main
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: cnpg-system
  syncPolicy:
    syncOptions:
      - ServerSideApply=true
      # CRD и кластеры баз кластерные: prune вместе с приложением снёс бы их.
      - Prune=false
      - CreateNamespace=true
    automated:
      selfHeal: true

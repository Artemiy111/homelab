# CloudNativePG — оператор PostgreSQL: кластеры, failover, бэкапы, PITR.
# Ставится официальным чартом cloudnative-pg из cloudnative-pg.github.io/charts.
#
# Оператор кластерный (config.clusterWide, дефолт true): одна установка
# обслуживает все Cluster'ы во всех namespace. Поэтому его namespace
# (cnpg-system) не совпадает с namespace баз (databases) — так и задумано.
#
# Сами кластеры и базы живут в clusters/casa/platform/cnpg/ отдельным
# приложением `cnpg`: его sync-wave идёт после этого, поэтому CRD оператора к
# моменту применения CR уже есть.

# Дефолт чарта: resources: {} (не задано). Без requests планировщик не знает, что
# размещает, без limits контроллер способен вытеснить приложения.
resources:
  requests:
    cpu: 50m
    memory: 128Mi
  limits:
    cpu: "1"
    memory: 512Mi

priorityClassName: platform-critical
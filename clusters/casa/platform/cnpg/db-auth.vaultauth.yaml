# Роли для чтения базовых паролей в неймспейсе databases. По роли на
# приложение: оператор CNPG читает пароль каждой роли своим токеном, и токен
# одной роли не должен доставать пароли других (ADR 0006).

apiVersion: v1
kind: ServiceAccount
metadata:
  name: vso-authentik-db
  namespace: databases
---
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultAuth
metadata:
  name: vso-authentik-db
  namespace: databases
spec:
  vaultAuthGlobalRef:
    name: vso-global
    namespace: vault-secrets-operator
  kubernetes:
    role: authentik-db
    serviceAccount: vso-authentik-db
---

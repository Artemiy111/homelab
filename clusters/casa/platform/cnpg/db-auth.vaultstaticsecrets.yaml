# Базовые пароли ролей CNPG: тот же путь в Vault, что и на стороне
# приложения (ADR 0006, правило 2 — одно значение, два потребителя).
#
# Имена destination совпадают с теми, что перечислены в shared.cluster.yaml
# в managed.roles[].passwordSecret.name.

apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultStaticSecret
metadata:
  name: authentik-db-auth
  namespace: databases
spec:
  vaultAuthRef: vso-authentik-db
  mount: kv
  type: kv-v2
  path: authentik/db
  refreshAfter: 1h
  destination:
    name: authentik-db-auth
    create: true
    overwrite: true
    type: kubernetes.io/basic-auth
    transformation:
      excludeRaw: true
---

apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  annotations:
    argocd.argoproj.io/sync-wave: "10"
  name: falco
  namespace: argocd
spec:
  project: upstream
  sources:
    - repoURL: ssh://git@forgejo.biplane.casa:2222/artemiy/homelab.git
      targetRevision: main
      path: clusters/casa/platform/falco/manifests
    - repoURL: https://falcosecurity.github.io/charts
      chart: falco
      targetRevision: 9.2.0
      helm:
        releaseName: falco
        valueFiles:
          - $values/clusters/casa/platform/falco/values.yaml
    - repoURL: ssh://git@forgejo.biplane.casa:2222/artemiy/homelab.git
      targetRevision: main
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: falco
  syncPolicy:
    syncOptions:
      - ServerSideApply=true
      - Prune=false
    automated:
      selfHeal: true

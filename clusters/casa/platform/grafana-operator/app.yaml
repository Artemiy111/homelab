# Grafana Operator — CRD и контроллер для Grafana и Loki. Держит в кластере
# CRD `monitoring.coreos.com` и `grafana.integreatly.org`.
#
# Значения вынесены из `spec.source.helm.valuesObject` в
# `clusters/casa/platform/grafana-operator/values.yaml`, Application подключает их через
# `$values` — второй источник в `spec.sources`.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: grafana-operator
  namespace: argocd
spec:
  project: upstream
  sources:
    - repoURL: ghcr.io/grafana/helm-charts
      chart: grafana-operator
      targetRevision: 5.25.0
      helm:
        releaseName: grafana-operator
        valueFiles:
          - $values/clusters/casa/platform/grafana-operator/values.yaml
    - repoURL: ssh://git@forgejo.biplane.casa:2222/artemiy/homelab.git
      targetRevision: main
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: grafana-operator
  syncPolicy:
    syncOptions:
      - ServerSideApply=true
      - Prune=false
      - CreateNamespace=true
    automated:
      selfHeal: true

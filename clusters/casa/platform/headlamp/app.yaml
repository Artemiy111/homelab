# Headlamp — веб-UI для Kubernetes. Ставится официальным чартом
# kubernetes-sigs/headlamp.
#
# ВНИМАНИЕ: без clusterRoleBinding.create (выключен в values) чарт создаёт
# ClusterRoleBinding cluster-admin на SA ПОДА. Права приходят из OIDC-токена
# пользователя, границей сети остаётся NetworkPolicy в
# clusters/casa/platform/headlamp/networkpolicy.yaml.
#
# Значения вынесены из `spec.source.helm.valuesObject` в
# `clusters/casa/platform/headlamp/values.yaml`, Application подключает их через `$values` —
# второй источник в `spec.sources`.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  annotations:
    argocd.argoproj.io/sync-wave: "20"
  name: headlamp
  namespace: argocd
spec:
  project: upstream
  sources:
    - repoURL: https://github.com/Artemiy111/homelab.git
      targetRevision: main
      path: clusters/casa/platform/headlamp/manifests
    - repoURL: https://kubernetes-sigs.github.io/headlamp/
      chart: headlamp
      targetRevision: 0.45.0
      helm:
        releaseName: headlamp
        valueFiles:
          - $values/clusters/casa/platform/headlamp/values.yaml
    - repoURL: https://github.com/Artemiy111/homelab.git
      targetRevision: main
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: headlamp
  syncPolicy:
    syncOptions:
      - ServerSideApply=true
    automated:
      selfHeal: true
# Права выдаёт не ServiceAccount, а claim `role` из OIDC-токена
# пользователя: apiserver читает его как группу (infra/host/etc/k0s/k0s.yaml,
# spec.api.extraArgs), и Zitadel отдаёт `admin` только тем, у кого есть роль
# admin в проекте Homelab. Поэтому subject здесь — не ServiceAccount, а группа
# из токена, и pod остаётся бесправным.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: headlamp-admins
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: cluster-admin
subjects:
  - apiGroup: rbac.authorization.k8s.io
    kind: Group
    name: oidc:admin

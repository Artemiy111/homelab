apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultStaticSecret
metadata:
  name: headlamp-oidc
  namespace: headlamp
spec:
  vaultAuthRef: vso-headlamp
  mount: kv
  type: kv-v2
  path: headlamp/oidc
  refreshAfter: 1h
  # clientSecret Headlamp читает только при старте, поэтому при ротации в
  # Vault под должен быть пересоздан.
  rolloutRestartTargets:
    - kind: Deployment
      name: headlamp
  destination:
    name: headlamp-oidc
    create: true
    overwrite: true
    transformation:
      excludeRaw: true

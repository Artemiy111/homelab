# Базовый NetworkPolicy для namespace headlamp: default-deny ingress плюс
# разрешения. traefik — UI, gateway в traefik проксирует Host(headlamp.*).
# Egress не ограничивается: headlamp ходит в apiserver кластера и во внешний
# issuer Zitadel (id.*) за OIDC, allowlist для обоих адресов — отдельное
# решение.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-ingress
  namespace: headlamp
spec:
  podSelector: {}
  policyTypes:
    - Ingress
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-ingress
  namespace: headlamp
spec:
  podSelector: {}
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector: {}
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: traefik

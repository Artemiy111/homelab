apiVersion: v1
kind: ConfigMap
metadata:
  name: element-web-config
  namespace: element
data:
  config.json: |
    {
      "default_server_config": {
        "m.homeserver": {
          "base_url": "https://element.{{ .Values.config.domain }}/",
          "server_name": "{{ .Values.config.domain }}"
        },
        "m.identity_server": {
          "base_url": "https://vector.im"
        }
      },
      "trusted_domains": ["{{ .Values.config.domain }}"],
      "default_theme": "light",
      "plugins": [
        {
          "type": "module",
          "name": "Jitsi",
          "url": "https://voluble-rose-baboon.netlify.app/jitsi.js"
        }
      ],
      "element_call": {
        "enabled": true,
        "url": "https://element.{{ .Values.config.domain }}/",
        "user_id": "https://element.{{ .Values.config.domain }}/",
        "room": ""
      },
      "features": {
        "feature_call": true,
        "feature_element_call_video": true
      },
      "setting_defaults": {
        "feature_element_call_video": true
      },
      "room_dir": {
        "enabled": true,
        "roomServers": ["matrix.org"]
      },
      "login": {
        "mqtt": false,
        "flows": [{"type": "m.login.password"}]
      },
      "disable_login_language_selector": false,
      "set_mxc_hs_endpoint": "https://element.{{ .Values.config.domain }}/"
    }

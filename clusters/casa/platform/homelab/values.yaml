config:
  domain: biplane.casa
  serverIp: 192.168.1.254
  timezone: Asia/Yekaterinburg
  locale: ru

# cert-manager: выпуск wildcard-сертификатов через ACME DNS-01.
#
# acmeEmail — почта для регистрации в ACME-эмитент, значение по умолчанию для
# всех зон. Значение окружения, а не секрет: по нему нельзя ни войти, ни
# получить доступ, и сам домен виден в Certificate Transparency вместе с
# wildcard-сертификатом (docs/adr/0009). У зоны своя почта — поле acmeEmail.
#
# webhookGroupName — группа API собственного webhook'а-солвера
# (packages/cert-manager-webhook-dns01); должна совпадать с groupName в чарте
# webhook'а (clusters/casa/platform/dns01-webhook/app.yaml).
#
# zones — по ClusterIssuer на каждую зону. Провайдер выбирается полем provider,
# зона указывается zoneName (иначе cert-manager подставит ResolvedZone).
# issuerSuffix добавляется к имени эмитента, когда зон несколько: без суффикса
# имя эмитента не даёт различать их. Суффикс остаётся и при единственной зоне —
# переименование ClusterIssuer не трогает выпущенные сертификаты, а вот
# смена issuerRef на Certificate перевыпускает его и упирается в rate limit
# Let's Encrypt (docs/incidents/0002).
#
# challengeRecord — имя TXT-записи внутри зоны, нужно там, где провайдер
# зарезервировал `_acme-challenge` и challenge-имя делегировано CNAME-ом.
# У Spaceship такого ограничения нет, поэтому поле не задаётся.
certManager:
  enabled: true
  acmeEmail: letsencript@biplane.casa
  webhookGroupName: acme.homelab.local
  zones:
    - domain: biplane.casa
      provider: spaceship
      issuerSuffix: casa
  # По Certificate на домен. Отдельный Secret на каждый: подмена issuerRef на
  # staging не должна переписывать боевой сертификат (docs/incidents/0002).
  #
  # Список — источник правды ещё и для слушателей Gateway
  # (templates/gateway/gateway.yaml): на каждый домен там создаётся
  # wildcard- и apex-слушатель на этот Secret. Домен без записи здесь не
  # принимает трафик, а его HTTPRoute отбрасывается с
  # NoMatchingListenerHostname.
  #
  # Имя Certificate и Secret намеренно остаются с casa, хотя casa теперь
  # config.domain: переименование вынудило бы cert-manager перевыпустить
  # wildcard, а лимит Let's Encrypt общий на зарегистрированный домен и
  # `.casa` им делится со всеми его держателями (docs/incidents/0002).
  # Смена issuerRef на существующем Certificate перевыпускает его точно так же.
  certificates:
    - name: wildcard-casa
      secretName: wildcard-casa-tls
      domain: biplane.casa
      issuer: letsencrypt-prod-casa


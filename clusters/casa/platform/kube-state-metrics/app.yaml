# kube-state-metrics: состояние объектов кластера как метрики `kube_*` —
# их не дают node-exporter и cAdvisor. Ставим официальным чартом
# prometheus-community: ClusterRole, Service и обновления — на апстриме.
#
# Значения вынесены из `spec.source.helm.valuesObject` в
# `clusters/casa/platform/kube-state-metrics/values.yaml`, Application подключает их через
# `$values` — второй источник в `spec.sources`.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kube-state-metrics
  namespace: argocd
spec:
  project: upstream
  sources:
    - repoURL: https://prometheus-community.github.io/helm-charts
      chart: kube-state-metrics
      targetRevision: 8.5.0
      helm:
        releaseName: kube-state-metrics
        valueFiles:
          - $values/clusters/casa/platform/kube-state-metrics/values.yaml
    - repoURL: ssh://git@forgejo.biplane.casa:2222/artemiy/homelab.git
      targetRevision: main
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true

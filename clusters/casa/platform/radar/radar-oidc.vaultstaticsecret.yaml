# clientSecret и HMAC-ключ сессий Radar читает только при старте, поэтому при
# ротации в Vault под должен быть пересоздан. Ключи — дефолтные чарта:
# auth.oidc.clientSecretKey=client-secret, auth.existingSecretKey=auth-secret.
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultStaticSecret
metadata:
  name: radar-oidc
  namespace: radar
spec:
  vaultAuthRef: vso-radar
  mount: kv
  type: kv-v2
  path: radar/oidc
  refreshAfter: 1h
  rolloutRestartTargets:
    - kind: Deployment
      name: radar
  destination:
    name: radar-auth
    create: true
    overwrite: true
    transformation:
      excludeRaw: true

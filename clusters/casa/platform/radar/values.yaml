# Radar — open-source Kubernetes UI (один Go-бинарь): топология, ресурсы, Helm,
# GitOps, аудит, MCP. Ставится официальным чартом skyhook/radar, маршрут —
# clusters/casa/apps/radar/manifests/route.yaml.
#
# auth.mode=oidc: Radar входит в Zitadel сам и имперсонирует пользователя в
# Kubernetes, поэтому права определяет RBAC пользователя, а не общий
# ServiceAccount. oauth2-proxy с маршрута Radar убран — иначе Zitadel не смог бы
# отдать claim `role`.

# Одноузловой кластер: лимиты умереннее дефолтных (2 CPU / 1Gi), чтобы информеры
# большого кластера не вытесняли соседей, но с запасом на всплески при churn.
resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: "1"
    memory: 512Mi

auth:
  mode: oidc
  # HMAC-ключ подписи сессий. Без него Radar генерирует случайный при старте, и
  # каждый рестарт пода разлогинивает всех. existingSecretKey — дефолт чарта
  # (auth-secret), читается из того же секрета Vault.
  existingSecret: radar-auth
  oidc:
    issuerURL: https://id.biplane.casa
    clientID: "392954354702773261"
    redirectURL: https://radar.biplane.casa/auth/callback
    postLogoutRedirectURL: https://radar.biplane.casa/
    groupsClaim: role
    # Группы приходят из claim `role` (admin|user), который кладёт action addRole
    # в Zitadel. Префикс `oidc:` даёт ровно ту группу `oidc:admin`, что и у
    # Headlamp, поэтому ClusterRoleBinding из
    # clusters/casa/platform/headlamp/headlamp-admins.clusterrolebinding.yaml работает на оба
    # UI. Привязка по Group, не по User: Radar берёт имя из claim `email`,
    # apiserver — из `sub`, и kind: User у них не совпадёт.
    groupsPrefix: "oidc:"
    # Без явного списка Radar просит ещё и scope `groups`, которого в Zitadel
    # нет: Zitadel молча выкинет его из запроса, а группы всё равно приходят из
    # claim `role`. Явный список фиксирует запрос.
    scopes:
      - openid
      - profile
      - email
    # Ключ clientSecret — дефолт чарта (auth.oidc.clientSecretKey).
    existingSecret: radar-auth
    # Радиус действия: одна реплика, без обратного канала revoke.
    backchannelLogout: true

traffic:
  # Автодискавери Prometheus ищет well-known имена/лейблы и не знаком с сервисом
  # victoriametrics; задаём адрес явно (порт 80 сервиса). Доступ из namespace
  # radar в monitoring открыт NetworkPolicy.
  prometheusUrl: http://victoriametrics.monitoring.svc.cluster.local

service:
  # Чарт использует service.port и как порт контейнера (--port), и как порт
  # Service; перевод сервиса на стандартный 80 меняет оба (см. issue #269).
  # Порт нигде больше не зашит (NetworkPolicy без портов).
  port: 80
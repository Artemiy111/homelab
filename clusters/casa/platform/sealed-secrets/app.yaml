# Sealed Secrets — доставка секретов в кластер.
#
# Значения вынесены из `spec.source.helm.valuesObject` в
# `clusters/casa/platform/sealed-secrets/values.yaml`, Application подключает их через
# `$values` — второй источник в `spec.sources`.
#
# Второй источник — этот же репозиторий по SSH с deploy key. `ref: values`
# ограничивает его файлами values, поэтому манифесты отсюда сюда не попадают.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: sealed-secrets
  namespace: argocd
spec:
  project: upstream
  sources:
    - repoURL: https://bitnami.github.io/sealed-secrets
      chart: sealed-secrets
      targetRevision: 2.20.0
      helm:
        releaseName: sealed-secrets
        # CRD sealedsecrets.bitnami.com кластерный, обновляется вручную:
        # helm show crds … | kubectl apply -f -
        skipCrds: true
        valueFiles:
          - $values/clusters/casa/platform/sealed-secrets/values.yaml
    - repoURL: ssh://git@forgejo.biplane.casa:2222/artemiy/homelab.git
      targetRevision: main
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: kube-system
  syncPolicy:
    syncOptions:
      - ServerSideApply=true
    automated:
      selfHeal: true

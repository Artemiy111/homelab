# Traefik — единственный вход в кластер: терминирует TLS, держит Gateway и
# HTTPRoute, публикует /dashboard.
#
# Значения лежат в clusters/casa/platform/traefik/values.yaml и подключаются через `$values`.
# Раньше те же 32 значения были продублированы инлайн в `valuesObject`, и правка
# файла молча расходилась с кластером — долг был зафиксирован в docs/runbooks/argocd.md.
#
# Второй источник — этот же репозиторий по SSH с deploy key, добавленным
# `argocd repo add`. В нём Argo берёт только values: `ref: values` ограничивает
# источник файлами values, поэтому манифесты из этого репозитория сюда не
# попадают.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: traefik
  namespace: argocd
spec:
  project: upstream
  sources:
    # Gateway и GatewayClass переехали из чарта platform/homelab: это
# кластерные объекты Traefik, а не общее окружение стенда. Второй источник
# обычным каталогом — Argo сводит манифесты источников в один набор.
    - repoURL: ssh://git@forgejo.biplane.casa:2222/artemiy/homelab.git
      targetRevision: main
      path: clusters/casa/platform/traefik/manifests
    - repoURL: https://traefik.github.io/charts
      chart: traefik
      targetRevision: 41.4.0
      helm:
        releaseName: traefik
        # CRD `*.traefik.io` кластерные: под управлением Argo удаление
        # приложения снесло бы все IngressRoute и Middleware кластера.
        skipCrds: true
        valueFiles:
          - $values/clusters/casa/platform/traefik/values.yaml
    - repoURL: ssh://git@forgejo.biplane.casa:2222/artemiy/homelab.git
      targetRevision: main
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: traefik
  syncPolicy:
    syncOptions:
      - ServerSideApply=true
      - CreateNamespace=true
    automated:
      selfHeal: true
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  annotations:
    argocd.argoproj.io/sync-wave: "10"
  name: victoria-metrics-operator
  namespace: argocd
spec:
  project: upstream
  sources:
    - repoURL: https://github.com/Artemiy111/homelab.git
      targetRevision: main
      path: clusters/casa/platform/victoria-metrics-operator/manifests
    - repoURL: https://victoriametrics.github.io/helm-charts
      chart: victoria-metrics-operator
      targetRevision: 0.68.1
      helm:
        releaseName: victoria-metrics-operator
        valueFiles:
          - $values/clusters/casa/platform/victoria-metrics-operator/values.yaml
    - repoURL: https://github.com/Artemiy111/homelab.git
      targetRevision: main
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: victoria-metrics-operator
  syncPolicy:
    syncOptions:
      - ServerSideApply=true
      - Prune=false
    automated:
      selfHeal: true

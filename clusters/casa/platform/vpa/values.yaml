crds:
  enabled: true

fullnameOverride: vpa

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 65534
  seccompProfile:
    type: RuntimeDefault

containerSecurityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL
  readOnlyRootFilesystem: true

recommender:
  replicas: 1
  podDisruptionBudget:
    enabled: false
  extraArgs:
    - --pod-recommendation-min-cpu-millicores=10
    - --pod-recommendation-min-memory-mb=32
    - --round-memory-bytes=1048576
  resources:
    requests:
      cpu: 50m
      memory: 500Mi
    limits:
      memory: 1000Mi

updater:
  replicas: 1
  podDisruptionBudget:
    enabled: false
  resources:
    requests:
      cpu: 50m
      memory: 500Mi
    limits:
      memory: 1000Mi

admissionController:
  replicas: 1
  podDisruptionBudget:
    enabled: false
  resources:
    requests:
      cpu: 50m
      memory: 200Mi
    limits:
      memory: 500Mi
  certGen:
    enabled: false
  certManager:
    enabled: true
    createSelfSignedIssuer:
      enabled: true

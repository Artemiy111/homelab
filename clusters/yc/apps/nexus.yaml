apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: nexus
  namespace: flux-system
spec:
  interval: 1h
  retryInterval: 1m
  timeout: 15m
  sourceRef:
    kind: GitRepository
    name: homelab
  path: ./apps/yc/nexus/manifests
  prune: true
  wait: true
  dependsOn:
    - name: local-path-provisioner
    - name: external-secrets-config

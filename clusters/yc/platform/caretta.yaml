apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: caretta
  namespace: flux-system
spec:
  interval: 1h
  retryInterval: 1m
  timeout: 10m
  sourceRef:
    kind: GitRepository
    name: homelab
  path: ./platform/yc/caretta/releases
  prune: true
  healthChecks:
    - apiVersion: source.toolkit.fluxcd.io/v1
      kind: HelmRepository
      name: caretta
      namespace: flux-system
    - apiVersion: helm.toolkit.fluxcd.io/v2
      kind: HelmRelease
      name: caretta
      namespace: flux-system

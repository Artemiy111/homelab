apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: envoy-gateway
  namespace: flux-system
spec:
  interval: 1h
  retryInterval: 1m
  timeout: 10m
  sourceRef:
    kind: GitRepository
    name: homelab
  path: ./platform/yc/envoy-gateway/releases
  prune: true
  healthChecks:
    - apiVersion: source.toolkit.fluxcd.io/v1
      kind: OCIRepository
      name: envoy-gateway
      namespace: flux-system
    - apiVersion: helm.toolkit.fluxcd.io/v2
      kind: HelmRelease
      name: envoy-gateway
      namespace: flux-system

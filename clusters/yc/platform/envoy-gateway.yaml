apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: envoy-gateway
  namespace: flux-system
spec:
  interval: 10m
  timeout: 5m
  retryInterval: 1m
  sourceRef:
    kind: GitRepository
    name: homelab
  path: ./platform/yc/envoy-gateway/manifests
  prune: true
  wait: true

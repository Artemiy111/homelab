services:
  code-server:
    image: codercom/code-server:4.132.0
    container_name: code-server
    user: "${CODE_SERVER_UID:-1000}:${CODE_SERVER_GID:-1000}"
    working_dir: /home/coder/project
    environment:
      DOCKER_USER: ${CODE_SERVER_USER:-artlab}
    volumes:
      - /storage/apps/code-server/home:/home/coder:Z
      - /storage/apps/code-server/workspace:/home/coder/project:Z
    networks:
      - traefiknet
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - wget
        - --no-verbose
        - --tries=1
        - --spider
        - http://127.0.0.1:8080/healthz
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    labels:
      - traefik.enable=true
      - traefik.http.routers.code-server.rule=Host(`${CODE_SERVER_HOST}`)
      - traefik.http.routers.code-server.entrypoints=websecure
      - traefik.http.services.code-server.loadbalancer.server.port=8080
      - traefik.docker.network=traefiknet

networks:
  traefiknet:
    external: true

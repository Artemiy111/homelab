name: element

x-synapse-environment: &synapse-environment
  SYNAPSE_SERVER_NAME: ${SYNAPSE_SERVER_NAME:?set SYNAPSE_SERVER_NAME in element/.env}
  SYNAPSE_REPORT_STATS: "no"
  SYNAPSE_CONFIG_DIR: /data
  SYNAPSE_CONFIG_FILE: /data/homeserver.yaml
  POSTGRES_HOST: db
  POSTGRES_PORT: "5432"
  POSTGRES_DB: ${POSTGRES_DB:-synapse}
  POSTGRES_USER: ${POSTGRES_USER:-synapse}
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in element/.env}
  TZ: ${TZ:-Asia/Yekaterinburg}

services:
  db:
    image: postgres:18-alpine@sha256:d3e1620b530c944afa6e887d22eb899824da68e19c52024bf98f5220c88a65b2
    container_name: element-db
    volumes:
      - ${APPS_STORAGE_PATH:-/storage/apps}/element/postgresql:/var/lib/postgresql:Z
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-synapse}
      POSTGRES_USER: ${POSTGRES_USER:-synapse}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in element/.env}
      POSTGRES_INITDB_ARGS: --encoding=UTF8 --locale=C
      TZ: ${TZ:-Asia/Yekaterinburg}
    networks:
      - backend
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  redis:
    image: redis:8-alpine
    container_name: element-redis
    volumes:
      - ${APPS_STORAGE_PATH:-/storage/apps}/element/redis:/data:Z
    networks:
      - backend
    command: redis-server --save 60 1 --loglevel warning
    environment:
      TZ: ${TZ:-Asia/Yekaterinburg}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  synapse:
    image: matrixdotorg/synapse:latest
    container_name: element-synapse
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ${APPS_STORAGE_PATH:-/storage/apps}/element/synapse/data:/data:Z
      - ${APPS_STORAGE_PATH:-/storage/apps}/element/synapse/config/homeserver.yaml:/data/homeserver.yaml:Z,ro
    environment:
      <<: *synapse-environment
    networks:
      backend:
      traefiknet:
        aliases:
          - synapse
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8080/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 2m
    labels:
      - traefik.enable=true
      - traefik.docker.network=traefiknet
      - traefik.http.routers.synapse.rule=Host(`${SYNAPSE_HOST}`) && PathPrefix(`/_matrix`)
      - traefik.http.routers.synapse.entrypoints=websecure
      - traefik.http.services.synapse.loadbalancer.server.port=8080
      - traefik.http.routers.synapse-well-known.rule=Host(`${SYNAPSE_SERVER_NAME}`) && Path(`/.well-known/matrix/client`)
      - traefik.http.routers.synapse-well-known.entrypoints=websecure
      - traefik.http.routers.synapse-well-known.service=synapse
    init: true
    security_opt:
      - no-new-privileges:true

  element-web:
    image: vectorim/element-web:latest
    container_name: element-web
    volumes:
      - ./element-web/config.json:/app/config.json:Z,ro
    environment:
      TZ: ${TZ:-Asia/Yekaterinburg}
    networks:
      - traefiknet
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:80/ >/dev/null || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    labels:
      - traefik.enable=true
      - traefik.docker.network=traefiknet
      - traefik.http.routers.element-web.rule=Host(`${ELEMENT_HOST}`)
      - traefik.http.routers.element-web.entrypoints=websecure
      - traefik.http.services.element-web.loadbalancer.server.port=80
    init: true
    security_opt:
      - no-new-privileges:true

  livekit:
    image: livekit/livekit-server:latest
    container_name: element-livekit
    volumes:
      - ${APPS_STORAGE_PATH:-/storage/apps}/element/livekit/config.yaml:/etc/livekit/config.yaml:Z,ro
    command: --config /etc/livekit/config.yaml --node-ip ${LIVEKIT_EXTERNAL_IP:?set LIVEKIT_EXTERNAL_IP in element/.env}
    environment:
      TZ: ${TZ:-Asia/Yekaterinburg}
    ports:
      - "${LIVEKIT_EXTERNAL_IP}:${LIVEKIT_PORT:-7880}:7880"
      - "${LIVEKIT_EXTERNAL_IP}:${LIVEKIT_RTC_PORT:-7881}:7881"
      - "${LIVEKIT_EXTERNAL_IP}:${LIVEKIT_RTC_PORT_MIN:-50000}-${LIVEKIT_RTC_PORT_MAX:-50499}:${LIVEKIT_RTC_PORT_MIN:-50000}-${LIVEKIT_RTC_PORT_MAX:-50499}/udp"
    networks:
      backend:
      traefiknet:
        aliases:
          - livekit
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:7880 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    labels:
      - traefik.enable=true
      - traefik.docker.network=traefiknet
      - traefik.http.routers.livekit.rule=Host(`${LIVEKIT_HOST}`) && PathPrefix(`/livekit/sfu`)
      - traefik.http.routers.livekit.entrypoints=websecure
      - traefik.http.routers.livekit.middlewares=livekit-sfu-strip
      - traefik.http.middlewares.livekit-sfu-strip.stripprefix.prefixes=/livekit/sfu
      - traefik.http.services.livekit.loadbalancer.server.port=7880
    init: true
    security_opt:
      - no-new-privileges:true

  matrix-rtc-auth:
    image: ghcr.io/element-hq/lk-jwt-service:0.4.4
    container_name: element-matrix-rtc-auth
    environment:
      LIVEKIT_JWT_PORT: "8080"
      LIVEKIT_URL: wss://${LIVEKIT_HOST:?set LIVEKIT_HOST in element/.env}/livekit/sfu
      LIVEKIT_KEY: ${LIVEKIT_API_KEY:?set LIVEKIT_API_KEY in element/.env}
      LIVEKIT_SECRET: ${LIVEKIT_API_SECRET:?set LIVEKIT_API_SECRET in element/.env}
      LIVEKIT_FULL_ACCESS_HOMESERVERS: ${SYNAPSE_SERVER_NAME:?set SYNAPSE_SERVER_NAME in element/.env}
      TZ: ${TZ:-Asia/Yekaterinburg}
    networks:
      - traefiknet
    restart: unless-stopped
    labels:
      - traefik.enable=true
      - traefik.docker.network=traefiknet
      - traefik.http.routers.matrix-rtc-auth.rule=Host(`${LIVEKIT_HOST}`) && PathPrefix(`/livekit/jwt`)
      - traefik.http.routers.matrix-rtc-auth.entrypoints=websecure
      - traefik.http.routers.matrix-rtc-auth.middlewares=matrix-rtc-auth-strip
      - traefik.http.middlewares.matrix-rtc-auth-strip.stripprefix.prefixes=/livekit/jwt
      - traefik.http.services.matrix-rtc-auth.loadbalancer.server.port=8080
    init: true
    security_opt:
      - no-new-privileges:true

  turn:
    image: coturn/coturn:latest
    container_name: element-turn
    volumes:
      - ${APPS_STORAGE_PATH:-/storage/apps}/element/turn/turnserver.conf:/etc/turnserver.conf:Z,ro
    network_mode: host
    environment:
      TZ: ${TZ:-Asia/Yekaterinburg}
    restart: unless-stopped
    init: true
    security_opt:
      - no-new-privileges:true

  sygnal:
    image: matrixdotorg/sygnal:latest
    container_name: element-sygnal
    profiles: [push]
    volumes:
      - ${APPS_STORAGE_PATH:-/storage/apps}/element/sygnal/sygnal.yaml:/sygnal.yaml:Z,ro
    environment:
      TZ: ${TZ:-Asia/Yekaterinburg}
    networks:
      - backend
    restart: unless-stopped
    init: true
    security_opt:
      - no-new-privileges:true

networks:
  backend:
    internal: true
  traefiknet:
    external: true

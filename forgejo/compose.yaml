name: forgejo

x-forgejo-environment: &forgejo-environment
  FORGEJO__database__DB_TYPE: postgres
  FORGEJO__database__HOST: db:5432
  FORGEJO__database__NAME: ${POSTGRES_DB:-forgejo}
  FORGEJO__database__USER: ${POSTGRES_USER:-forgejo}
  FORGEJO__database__PASSWD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in forgejo/.env}
  FORGEJO__server__DOMAIN: ${FORGEJO_HOST:?set FORGEJO_HOST in forgejo/.env}
  FORGEJO__server__ROOT_URL: https://${FORGEJO_HOST:?set FORGEJO_HOST in forgejo/.env}/
  FORGEJO__server__SSH_DOMAIN: ${FORGEJO_HOST:?set FORGEJO_HOST in forgejo/.env}
  FORGEJO__server__SSH_PORT: ${FORGEJO_SSH_PORT:-2223}
  FORGEJO__server__LFS_START_SERVER: "true"
  # INSTALL_LOCK управляется веб-мастером — не переопределять через env
  FORGEJO__security__REVERSE_PROXY_TRUSTED_PROXIES: ${TRAEFIK_NETWORK_CIDR:?set TRAEFIK_NETWORK_CIDR in forgejo/.env}
  FORGEJO__service__DISABLE_REGISTRATION: "true"
  FORGEJO__service__DEFAULT_USER_VISIBILITY: private
  FORGEJO__repository__DEFAULT_PRIVATE: private
  FORGEJO__openid__ENABLE_OPENID_SIGNIN: "false"
  FORGEJO__openid__ENABLE_OPENID_SIGNUP: "false"
  FORGEJO__actions__ENABLED: "false"
  # === После регистрации WebAuthn-ключа ===
  # 1. Включить WebAuthn:
  # FORGEJO__webauthn__ENABLED: "true"
  # 2. Отключить вход по паролю (через админку: Site Administration → Authentication)
  # 3. Отключить регистрацию и веб-мастер:
  # FORGEJO__security__INSTALL_LOCK: "true"
  # FORGEJO__service__DISABLE_REGISTRATION: "true"
  TZ: ${TZ:?set TZ in forgejo/.env}

services:
  db:
    image: postgres:18-alpine
    container_name: forgejo-db

    volumes:
      - /storage/apps/forgejo/postgresql:/var/lib/postgresql:Z

    environment:
      POSTGRES_DB: ${POSTGRES_DB:-forgejo}
      POSTGRES_USER: ${POSTGRES_USER:-forgejo}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in forgejo/.env}

    networks:
      - backend
    restart: unless-stopped

    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}" ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  app:
    image: data.forgejo.org/forgejo/forgejo:16-rootless
    container_name: forgejo
    user: "1000:1000"

    depends_on:
      db:
        condition: service_healthy

    volumes:
      - /storage/apps/forgejo/data:/var/lib/gitea:z

    environment:
      <<: *forgejo-environment

    ports:
      - "${SERVER_IP:?set SERVER_IP in forgejo/.env}:${FORGEJO_SSH_PORT:-2223}:2222"
    networks:
      backend:
      traefiknet:
        aliases:
          - forgejo
    restart: unless-stopped

    healthcheck:
      test:
        - CMD-SHELL
        - >-
          wget -qO- http://127.0.0.1:3000/api/healthz | grep -Eq '"status"[[:space:]]*:[[:space:]]*"pass"'
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 2m

    labels:
      - traefik.enable=true
      - traefik.http.routers.forgejo.rule=Host(`${FORGEJO_HOST}`)
      - traefik.http.routers.forgejo.entrypoints=websecure
      - traefik.http.services.forgejo.loadbalancer.server.port=3000
      - traefik.http.middlewares.forgejo-security.headers.stsSeconds=15552000
      - traefik.http.middlewares.forgejo-security.headers.stsIncludeSubdomains=true
      - traefik.http.middlewares.forgejo-security.headers.contentTypeNosniff=true
      - traefik.http.middlewares.forgejo-security.headers.referrerPolicy=no-referrer
      - traefik.http.routers.forgejo.middlewares=forgejo-security
      - traefik.docker.network=traefiknet

  backup-db:
    image: postgres:18-alpine
    container_name: forgejo-backup-db

    depends_on:
      db:
        condition: service_healthy

    volumes:
      - /storage/apps/forgejo/backups:/backups:Z

    environment:
      PGHOST: db
      PGDATABASE: ${POSTGRES_DB:-forgejo}
      PGUSER: ${POSTGRES_USER:-forgejo}
      PGPASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in forgejo/.env}

    networks:
      - backend

    command:
      - >-
        umask 077; pg_dump --format=custom --file=/backups/forgejo.dump.tmp; mv /backups/forgejo.dump.tmp /backups/forgejo.dump
    entrypoint:
      - /bin/sh
      - -ec
    restart: "no"

    profiles:
      - tools

networks:
  backend:
    internal: true
  traefiknet:
    external: true

name: gatus

services:
  gatus:
    image: ghcr.io/twin/gatus:v5.36.0@sha256:c5f210d095fa78e6efaa20ffeb14803f2ba4f10615e16a6d12087697149617f0
    container_name: gatus
    volumes:
      - ./config:/config:Z,ro
      - ${APPS_STORAGE_PATH:-/storage/apps}/gatus/data:/data:Z

    environment:
      DOMAIN: ${DOMAIN:?set DOMAIN in gatus/.env}
      SERVER_IP: ${SERVER_IP:?set SERVER_IP in gatus/.env}
      NTFY_TOPIC: ${NTFY_TOPIC}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN}
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID}
      TELEGRAM_PROXY_URL: ${TELEGRAM_PROXY_URL}

    networks:
      - traefiknet
    restart: unless-stopped

    labels:
      - traefik.enable=true
      - traefik.http.routers.gatus.rule=Host(`${GATUS_HOST}`)
      - traefik.http.routers.gatus.entrypoints=websecure
      - traefik.http.services.gatus.loadbalancer.server.port=8080
      - traefik.docker.network=traefiknet
    user: "1000:1000"

    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

networks:
  traefiknet:
    external: true

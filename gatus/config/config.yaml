storage:
  type: sqlite
  path: /data/gatus.db
  caching: true
  maximum-number-of-results: 1000
  maximum-number-of-events: 100

alerting:
  ntfy:
    topic: "${NTFY_TOPIC}"
    priority: 4
    default-alert:
      failure-threshold: 3
      success-threshold: 2
      send-on-resolved: true

  telegram:
    token: "${TELEGRAM_BOT_TOKEN}"
    id: "${TELEGRAM_CHAT_ID}"
    client:
      proxy-url: "${TELEGRAM_PROXY_URL}"
    default-alert:
      failure-threshold: 3
      success-threshold: 2
      send-on-resolved: true

ui:
  title: Homelab Status
  header: Homelab Status
  default-sort-by: group

endpoints:
  - name: Pi-hole HTTP
    group: Infrastructure
    url: https://pihole.example.net/admin/
    interval: 60s
    client: &https-client
      timeout: 10s
      dns-resolver: tcp://192.0.2.10:53
    conditions: &https-ok
      - "[STATUS] == 200"
      - "[CERTIFICATE_EXPIRATION] > 168h"
    alerts: &alerts-all
      - type: ntfy
      - type: telegram

  - name: Traefik
    group: Infrastructure
    url: https://traefik.example.net/dashboard/
    interval: 60s
    client: *https-client
    conditions:
      - "[STATUS] == 401"
      - "[CERTIFICATE_EXPIRATION] > 168h"
    alerts: *alerts-all

  - name: Pi-hole DNS
    group: Infrastructure
    url: 192.0.2.10
    interval: 60s
    dns:
      query-name: uptime.example.net
      query-type: A
    conditions:
      - "[DNS_RCODE] == NOERROR"
      - "[BODY] == 192.0.2.10"
    alerts: *alerts-all

  - name: Gitea SSH
    group: Infrastructure
    url: tcp://192.0.2.10:2222
    interval: 60s
    conditions: &tcp-connected
      - "[CONNECTED] == true"
    alerts: *alerts-all

  - name: Xray inbound
    group: Infrastructure
    url: tcp://192.0.2.10:8443
    interval: 60s
    conditions: *tcp-connected
    alerts:
      - type: ntfy
        enabled: false

  - name: Xray local egress
    group: Infrastructure
    url: tcp://192.0.2.10:8440
    interval: 60s
    conditions: *tcp-connected
    alerts:
      - type: ntfy
        enabled: true

  - name: Gatus
    group: Monitoring
    url: https://uptime.example.net/
    interval: 60s
    client: *https-client
    conditions: *https-ok
    alerts: *alerts-all

  - name: Uptime Kuma
    group: Monitoring
    url: https://kuma.example.net/
    interval: 60s
    client: *https-client
    conditions: *https-ok
    alerts: *alerts-all

  - name: Homepage
    group: Monitoring
    url: https://home.example.net/api/healthcheck
    interval: 60s
    client: *https-client
    conditions: *https-ok
    alerts: *alerts-all

  - name: Beszel
    group: Monitoring
    url: https://beszel.example.net/api/health
    interval: 60s
    client: *https-client
    conditions: *https-ok
    alerts: *alerts-all

  - name: WUD
    group: Monitoring
    url: https://wud.example.net/health
    interval: 60s
    client: *https-client
    conditions:
      - "[STATUS] == 401"
      - "[CERTIFICATE_EXPIRATION] > 168h"
    alerts: *alerts-all

  - name: Cup
    group: Monitoring
    url: https://cup.example.net/
    interval: 60s
    client: *https-client
    conditions:
      - "[STATUS] == 401"
      - "[CERTIFICATE_EXPIRATION] > 168h"

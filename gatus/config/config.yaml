storage:
  type: sqlite
  path: /data/gatus.db
  caching: true
  maximum-number-of-results: 1000
  maximum-number-of-events: 100

# Prometheus-метрики на /metrics (скрейпятся netdata внутри traefiknet).
metrics: true

alerting:
  ntfy:
    topic: "${NTFY_TOPIC}"
    priority: 4
    default-alert:
      failure-threshold: 3
      success-threshold: 2
      send-on-resolved: true

  telegram:
    token: "${TELEGRAM_BOT_TOKEN}"
    id: "${TELEGRAM_CHAT_ID}"
    client:
      proxy-url: "${TELEGRAM_PROXY_URL}"
    default-alert:
      failure-threshold: 3
      success-threshold: 2
      send-on-resolved: true

ui:
  title: Homelab Status
  header: Homelab Status
  default-sort-by: group

endpoints:
  - name: Technitium HTTP
    group: Infrastructure
    url: https://dns.${DOMAIN}/
    interval: 60s
    client: &https-client
      timeout: 10s
      dns-resolver: tcp://${SERVER_IP}:53
    conditions: &https-ok
      - "[STATUS] == 200"
      - "[CERTIFICATE_EXPIRATION] > 168h"
    alerts: &alerts-all
      - type: ntfy
      - type: telegram

  - name: Traefik
    group: Infrastructure
    url: https://traefik.${DOMAIN}/dashboard/
    interval: 60s
    client: *https-client
    conditions:
      - "[STATUS] == 401"
      - "[CERTIFICATE_EXPIRATION] > 168h"
    alerts: *alerts-all

  - name: Technitium DNS
    group: Infrastructure
    url: ${SERVER_IP}
    interval: 60s
    dns:
      query-name: uptime.${DOMAIN}
      query-type: A
    conditions:
      - "[DNS_RCODE] == NOERROR"
      - "[BODY] == ${SERVER_IP}"
    alerts: *alerts-all

  - name: Gitea SSH
    group: Infrastructure
    url: tcp://${SERVER_IP}:2222
    interval: 60s
    conditions: &tcp-connected
      - "[CONNECTED] == true"
    alerts: *alerts-all

  - name: Xray inbound
    group: Infrastructure
    url: tcp://${SERVER_IP}:8443
    interval: 60s
    conditions: *tcp-connected
    alerts:
      - type: ntfy
        enabled: false

  - name: Xray proxy egress
    group: Infrastructure
    url: https://api.telegram.org
    interval: 120s
    client:
      timeout: 30s
      proxy-url: http://${SERVER_IP}:8440
    conditions:
      - "[STATUS] == 200"
      - "[RESPONSE_TIME] < 5000"
    alerts:
      - type: ntfy
        enabled: true

  - name: Gatus
    group: Monitoring
    url: https://uptime.${DOMAIN}/
    interval: 60s
    client: *https-client
    conditions: *https-ok
    alerts: *alerts-all

  - name: Uptime Kuma
    group: Monitoring
    url: https://kuma.${DOMAIN}/
    interval: 60s
    client: *https-client
    conditions: *https-ok
    alerts: *alerts-all

  - name: Homepage
    group: Monitoring
    url: https://home.${DOMAIN}/api/healthcheck
    interval: 60s
    client: *https-client
    conditions: *https-ok
    alerts: *alerts-all

  - name: Beszel
    group: Monitoring
    url: https://beszel.${DOMAIN}/api/health
    interval: 60s
    client: *https-client
    conditions: *https-ok
    alerts: *alerts-all

  - name: Arcane
    group: Monitoring
    url: https://arcane.${DOMAIN}/api/health
    interval: 60s
    client: *https-client
    conditions: *https-ok
    alerts: *alerts-all

  - name: Netdata
    group: Monitoring
    # UI закрыт forward auth (302 без авторизации), поэтому проверяем агент
    # напрямую в docker-сети.
    url: http://netdata:19999/api/v1/info
    interval: 60s
    client: &docker-client
      timeout: 10s
    conditions:
      - "[STATUS] == 200"
    alerts: *alerts-all

  # Публичные URL этих сервисов закрыты forward auth (oauth2-proxy@file) и для
  # неавторизованного запроса отдают 302, поэтому проверяем приложения напрямую
  # в docker-сети (gatus, wud, cup, structurizr — на одной сети traefiknet).
  - name: WUD
    group: Monitoring
    url: http://wud:3000/health
    interval: 60s
    client: *docker-client
    conditions:
      - "[STATUS] == 200"
      - "[BODY] == pat(*uptime*)"
    alerts: *alerts-all

  - name: Cup
    group: Monitoring
    url: http://cup:8000/
    interval: 60s
    client: *docker-client
    conditions:
      - "[STATUS] == 200"
    alerts: *alerts-all

  - name: Jitsi Meet
    group: Applications
    url: https://meet.${DOMAIN}/
    interval: 60s
    client: *https-client
    conditions: *https-ok
    alerts: *alerts-all

  - name: Mermaid Live Editor
    group: Applications
    url: https://mermaid.${DOMAIN}/
    interval: 60s
    client: *https-client
    conditions: *https-ok
    alerts: *alerts-all

  - name: Nextcloud
    group: Applications
    url: https://nextcloud.${DOMAIN}/status.php
    interval: 60s
    client: *https-client
    conditions:
      - "[STATUS] == 200"
      - "[BODY].installed == true"
      - "[BODY].maintenance == false"
      - "[BODY].needsDbUpgrade == false"
      - "[CERTIFICATE_EXPIRATION] > 168h"
    alerts: *alerts-all

  - name: Forgejo
    group: Applications
    url: https://forgejo.${DOMAIN}/api/healthz
    interval: 60s
    client: *https-client
    conditions:
      - "[STATUS] == 200"
      - "[BODY].status == pass"
      - "[CERTIFICATE_EXPIRATION] > 168h"
    alerts: *alerts-all

  - name: code-server
    group: Applications
    url: https://code.${DOMAIN}/healthz
    interval: 60s
    client: *https-client
    conditions: *https-ok
    alerts: *alerts-all

  - name: Authentik
    group: Applications
    url: https://auth.${DOMAIN}/-/health/ready/
    interval: 60s
    client: *https-client
    conditions: *https-ok
    alerts: *alerts-all

  - name: LocalAI
    group: Applications
    url: https://localai.${DOMAIN}/readyz
    interval: 60s
    client: *https-client
    conditions: *https-ok
    alerts: *alerts-all

  - name: Immich
    group: Applications
    url: https://immich.${DOMAIN}/api/server/ping
    interval: 60s
    client: *https-client
    conditions:
      - "[STATUS] == 200"
      - "[BODY].res == pong"
      - "[CERTIFICATE_EXPIRATION] > 168h"
    alerts: *alerts-all

  - name: Dawarich
    group: Applications
    url: https://dawarich.${DOMAIN}/api/v1/health
    interval: 60s
    client: *https-client
    conditions:
      - "[STATUS] == 200"
      - "[BODY].status == ok"
      - "[CERTIFICATE_EXPIRATION] > 168h"
    alerts: *alerts-all

  - name: Jellyfin
    group: Applications
    url: https://jellyfin.${DOMAIN}/health
    interval: 60s
    client: *https-client
    conditions:
      - "[STATUS] == 200"
      - "[BODY] == Healthy"
      - "[CERTIFICATE_EXPIRATION] > 168h"
    alerts: *alerts-all

  - name: Navidrome
    group: Applications
    url: https://music.${DOMAIN}/ping
    interval: 60s
    client: *https-client
    conditions:
      - "[STATUS] == 200"
      - "[BODY] == ."
      - "[CERTIFICATE_EXPIRATION] > 168h"
    alerts: *alerts-all

  - name: Stirling PDF
    group: Applications
    url: https://pdf.${DOMAIN}/api/v1/info/status
    interval: 60s
    client: *https-client
    conditions:
      - "[STATUS] == 200"
      - "[BODY].status == UP"
      - "[CERTIFICATE_EXPIRATION] > 168h"
    alerts: *alerts-all

  - name: Home Assistant
    group: Applications
    url: http://${SERVER_IP}:8123/
    interval: 60s
    client:
      timeout: 10s
    conditions:
      - "[STATUS] == 200"
    alerts: *alerts-all

  - name: Structurizr
    group: Applications
    url: http://structurizr:8080/
    interval: 60s
    client: *docker-client
    conditions:
      - "[STATUS] == 200"
    alerts: *alerts-all

  - name: Lute
    group: Applications
    url: https://lute.${DOMAIN}/
    interval: 60s
    client: *https-client
    conditions: *https-ok
    alerts: *alerts-all

  - name: 3x-ui backend
    group: Applications
    url: tcp://3x-ui:2053
    interval: 60s
    conditions: *tcp-connected
    alerts: *alerts-all

  - name: Sure
    group: Applications
    url: https://sure.${DOMAIN}/sessions/new
    interval: 60s
    client: *https-client
    conditions: *https-ok
    alerts: *alerts-all

  - name: Mailserver
    group: Applications
    # Панель администрирования Stalwart; корень отдаёт 302 на страницу входа.
    url: https://mailserver.${DOMAIN}/
    interval: 60s
    client: *https-client
    conditions: *https-ok
    alerts: *alerts-all

  - name: Webmail
    group: Applications
    url: https://mail.${DOMAIN}/
    interval: 60s
    client: *https-client
    conditions: *https-ok
    alerts: *alerts-all

  - name: Seafile
    group: Applications
    url: https://seafile.${DOMAIN}/api2/ping/
    interval: 60s
    client: *https-client
    conditions:
      - "[STATUS] == 200"
      - "[BODY] == pat(*pong*)"
      - "[CERTIFICATE_EXPIRATION] > 168h"
    alerts: *alerts-all

  - name: OnlyOffice
    group: Applications
    url: https://onlyoffice.${DOMAIN}/healthcheck
    interval: 60s
    client: *https-client
    conditions:
      - "[STATUS] == 200"
      - "[BODY] == true"
      - "[CERTIFICATE_EXPIRATION] > 168h"
    alerts: *alerts-all

  - name: Paperless
    group: Applications
    # Корень отдаёт 302 на страницу входа.
    url: https://paperless.${DOMAIN}/
    interval: 60s
    client: *https-client
    conditions: *https-ok
    alerts: *alerts-all

  - name: Infisical
    group: Applications
    url: https://infisical.${DOMAIN}/api/status
    interval: 60s
    client: *https-client
    conditions:
      - "[STATUS] == 200"
      - "[BODY].message == Ok"
      - "[CERTIFICATE_EXPIRATION] > 168h"
    alerts: *alerts-all

  - name: Zitadel
    group: Applications
    url: https://id.${DOMAIN}/debug/healthz
    interval: 60s
    client: *https-client
    conditions:
      - "[STATUS] == 200"
      - "[BODY] == ok"
      - "[CERTIFICATE_EXPIRATION] > 168h"
    alerts: *alerts-all

  - name: Element Web
    group: Applications
    url: https://element.${DOMAIN}/
    interval: 60s
    client: *https-client
    conditions: *https-ok
    alerts: *alerts-all

  - name: Synapse
    group: Applications
    # Client-Server API Synapse, опубликованный по пути /_matrix.
    url: https://element.${DOMAIN}/_matrix/client/versions
    interval: 60s
    client: *https-client
    conditions:
      - "[STATUS] == 200"
      - "[BODY] == pat(*versions*)"
      - "[CERTIFICATE_EXPIRATION] > 168h"
    alerts: *alerts-all

  - name: Talk signaling
    group: Applications
    # Nextcloud Talk high-performance backend (eturnal); префикс
    # /standalone-signaling Traefik снимает перед проксированием.
    url: https://talk-signaling.${DOMAIN}/standalone-signaling/api/v1/welcome
    interval: 60s
    client: *https-client
    conditions:
      - "[STATUS] == 200"
      - "[BODY] == pat(*Welcome*)"
      - "[CERTIFICATE_EXPIRATION] > 168h"
    alerts: *alerts-all

name: home-assistant

services:
  home-assistant:
    image: ghcr.io/home-assistant/home-assistant:stable
    container_name: home-assistant
    volumes:
      - ${APPS_STORAGE_PATH:-/storage/apps}/home-assistant:/config:Z
      - ./configuration.yaml:/config/configuration.yaml:Z,ro
      - /etc/localtime:/etc/localtime:ro

    environment:
      TZ: ${TZ:?set in home-assistant/.env}
    network_mode: host
    restart: unless-stopped

    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >-
          import urllib.request; urllib.request.urlopen('http://127.0.0.1:8123/', timeout=5)
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

    labels:
      - traefik.enable=true
      - traefik.http.routers.homeassistant.rule=Host(`homeassistant.${DOMAIN}`)
      - traefik.http.routers.homeassistant.entrypoints=websecure
      - traefik.http.services.homeassistant.loadbalancer.server.port=8123

    cap_add:
      - NET_RAW
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

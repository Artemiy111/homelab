services:
  homeassistant:
    image: ghcr.io/home-assistant/home-assistant:stable
    container_name: homeassistant
    network_mode: host
    environment:
      TZ: Asia/Yekaterinburg
    volumes:
      - /storage/apps/home-assistant:/config:Z
      - ./configuration.yaml:/config/configuration.yaml:Z,ro
      - /etc/localtime:/etc/localtime:ro
    restart: unless-stopped
    cap_drop:
      - ALL
    cap_add:
      - NET_RAW
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >-
          import urllib.request;
          urllib.request.urlopen('http://127.0.0.1:8123/', timeout=5)
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    labels:
      - traefik.enable=true
      - traefik.http.routers.homeassistant.rule=Host(`${HOME_ASSISTANT_HOST}`)
      - traefik.http.routers.homeassistant.entrypoints=websecure
      - traefik.http.routers.homeassistant.middlewares=homeassistant-lan-only
      - traefik.http.middlewares.homeassistant-lan-only.ipallowlist.sourcerange=192.0.2.10/24
      - traefik.http.services.homeassistant.loadbalancer.server.port=8123

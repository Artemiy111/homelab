name: home

services:
  homepage:
    image: ghcr.io/gethomepage/homepage:v1.13.2@sha256:a0b71c8e757298d02560186bab9fbe3fc2d375c523a62cc1019177b37e48aa28
    container_name: homepage
    volumes:
      - ./config:/app/config:Z

    environment:
      HOMEPAGE_ALLOWED_HOSTS: ${HOMEPAGE_HOST:?set HOMEPAGE_HOST in home/.env}
      HOMEPAGE_VAR_DOMAIN: ${DOMAIN:?set DOMAIN in home/.env}
      LOG_TARGETS: stdout
      PUID: "1000"
      PGID: "1000"

    networks:
      - traefiknet
    restart: unless-stopped

    healthcheck:
      test:
        - CMD
        - wget
        - --no-verbose
        - --tries=1
        - --spider
        - http://127.0.0.1:3000/api/healthcheck
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 20s

    logging:
      options:
        max-size: "5m"
        max-file: "3"
        compress: "true"

    labels:
      - traefik.enable=true
      - traefik.http.routers.homepage.rule=Host(`${HOMEPAGE_HOST}`)
      - traefik.http.routers.homepage.entrypoints=websecure
      - traefik.http.routers.homepage.middlewares=secure-headers@file,ratelimit-default@file
      - traefik.http.services.homepage.loadbalancer.server.port=3000
      - traefik.docker.network=traefiknet
    user: "1000:1000"

    cap_drop:
      - ALL
    cpus: 0.5
    mem_limit: 256m

    pids_limit: 100
    read_only: true
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:mode=1777,nosuid,nodev

networks:
  traefiknet:
    external: true

[defaults]
# Плейбук выполняется на самом сервере homelab (локальное подключение).
inventory = inventory.yml
# Роли лежат рядом с плейбуками, а не в глобальном ~/.ansible/roles.
roles_path = roles
# Читаемый вывод результатов в формате YAML.
stdout_callback = default
result_format = yaml
# Не спрашивать про python-интерпретатор, брать системный.
interpreter_python = auto_silent

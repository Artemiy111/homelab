---
# Настройка пользователя ai-agent и его окружения.
# Роль идемпотентна: повторный прогон не меняет уже настроенное.

- name: Создать пользователя {{ ai_agent_user }}
  ansible.builtin.user:
    name: "{{ ai_agent_user }}"
    shell: "{{ ai_agent_shell }}"
    home: "{{ ai_agent_home }}"
    create_home: true
    state: present

# Рекурсивного chown нет намеренно: владелец/группа выставляются на каждом
# управляемом ресурсе, чтобы не затирать права, выставленные приложениями
# внутри домашнего каталога.
- name: Ограничить доступ к домашнему каталогу
  ansible.builtin.file:
    path: "{{ ai_agent_home }}"
    state: directory
    owner: "{{ ai_agent_user }}"
    group: "{{ ai_agent_user }}"
    mode: "0700"

- name: Создать ~/.ssh с доступом только владельцу
  ansible.builtin.file:
    path: "{{ ai_agent_home }}/.ssh"
    state: directory
    owner: "{{ ai_agent_user }}"
    group: "{{ ai_agent_user }}"
    mode: "0700"

# Dotfiles копируются, а не линкуются: домашний каталог не должен зависеть от
# того, где лежит рабочая копия репозитория. Симлинк на пути dotfiles
# удаляется до копирования, иначе запись ушла бы по ссылке.
- name: Собрать состояние dotfiles
  ansible.builtin.stat:
    path: "{{ ai_agent_home }}/{{ item }}"
  loop: "{{ ai_agent_dotfiles }}"
  register: ai_agent_dotfiles_stat

- name: Убрать симлинки на путях dotfiles
  ansible.builtin.file:
    path: "{{ item.stat.path }}"
    state: absent
  loop: "{{ ai_agent_dotfiles_stat.results }}"
  when: item.stat.islnk | default(false)

- name: Установить dotfiles
  ansible.builtin.copy:
    src: "{{ ai_agent_dotfiles_dir }}/{{ item }}"
    dest: "{{ ai_agent_home }}/{{ item }}"
    owner: "{{ ai_agent_user }}"
    group: "{{ ai_agent_user }}"
    mode: "0600"
    validate: zsh -n %s
  loop: "{{ ai_agent_dotfiles }}"

# authorized_keys копируется, а не линкуется: sshd строже относится к правам
# на этот файл, и он не должен зависеть от прав в рабочей копии репозитория.
- name: Установить authorized_keys
  ansible.builtin.copy:
    src: "{{ ai_agent_dotfiles_dir }}/.ssh/authorized_keys"
    dest: "{{ ai_agent_home }}/.ssh/authorized_keys"
    owner: "{{ ai_agent_user }}"
    group: "{{ ai_agent_user }}"
    mode: "0600"

# validate прогоняет visudo на временной копии до установки: синтаксически
# неверное правило не сможет сломать sudo.
- name: Разрешить sudo без парола от имени {{ ai_agent_sudo_runas }}
  ansible.builtin.template:
    src: sudoers.j2
    dest: "{{ ai_agent_sudoers_file }}"
    owner: root
    group: root
    mode: "0440"
    validate: visudo -cf %s

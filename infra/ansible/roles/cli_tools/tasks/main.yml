---
# Сторонние CLI, которых нет в репозиториях Fedora: vals, argocd,
# kubectl-cnpg. Версии и checksums — в defaults/main.yml.

# --- sops и kubeseal ---
# Больше не ставятся: SealedSecrets удалены, SOPS-реестр снят. Задачи убирают
# то, что осталось от прошлых прогонов. Бинарники лежат в нескольких местах:
# RPM кладёт sops в /usr/bin, kubeseal ставился в /usr/local/bin, а от прежних
# установок остались копии в sbin.
- name: Удалить пакет sops
  ansible.builtin.dnf5:
    name: sops
    state: absent

- name: Удалить оставшиеся бинарники sops и kubeseal
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop:
    - /usr/bin/sops
    - /usr/sbin/sops
    - /usr/local/bin/sops
    - /usr/local/sbin/sops
    - /usr/local/bin/kubeseal
    - /usr/local/sbin/kubeseal

- name: Найти загрузки kubeseal в /usr/local/src
  ansible.builtin.find:
    paths: /usr/local/src
    patterns: "kubeseal-*"
    file_type: any
  register: cli_tools_kubeseal_src

- name: Удалить загрузки kubeseal
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: absent
  loop: "{{ cli_tools_kubeseal_src.files }}"
  loop_control:
    label: "{{ item.path }}"

# --- vals: сборка из исходного кода ---

- name: Установить toolchain для сборки vals
  ansible.builtin.dnf5:
    name:
      - git
      - golang
    state: present

- name: Определить версию установленного vals
  ansible.builtin.command:
    cmd: /usr/local/bin/vals version
  register: cli_tools_vals_installed
  failed_when: false
  changed_when: false

- name: Клонировать vals ({{ cli_tools_vals_version }})
  ansible.builtin.git:
    repo: "{{ cli_tools_vals_repo }}"
    dest: /usr/local/src/vals
    version: "{{ cli_tools_vals_version }}"
    depth: 1
  register: cli_tools_vals_repo_state

# Пересобираем при смене пина или если бинарник отсутствует/битый/
# другой версии. Main-пакет vals — ./cmd/vals (корень репозитория —
# библиотека). Версию в бинарник надо класть через -ldflags (как в
# Makefile проекта), иначе `vals version` показывает `dev` и задача
# не становится идемпотентной. go build учитывает umask, поэтому права
# фиксируем ниже.
- name: Собрать vals из исходного кода
  ansible.builtin.command:
    cmd: >-
      go build -trimpath
      -ldflags "-X main.version={{ cli_tools_vals_version }} -X main.commit={{ cli_tools_vals_repo_state.after }}"
      -o /usr/local/bin/vals ./cmd/vals
    chdir: /usr/local/src/vals
  when: >-
    cli_tools_vals_repo_state.changed
    or cli_tools_vals_installed.rc != 0
    or cli_tools_vals_version not in cli_tools_vals_installed.stdout
  environment:
    GOPATH: /root/go
  changed_when: true

- name: Выставить права бинарнику vals
  ansible.builtin.file:
    path: /usr/local/bin/vals
    mode: "0755"

# --- argocd: CLI пробного стенда ---
# Отдельная секция, а не base_packages: в репозиториях Fedora пакета нет,
# а в релизе GitHub лежит сырой бинарник без архива. get_url с checksum
# идемпотентен — повторный прогон ничего не делает, пока файл совпадает.
# Если стенд снимается (clusters/casa/platform/argocd/RUNBOOK.md), убрать и эту секцию.
- name: Установить argocd CLI в /usr/local/bin ({{ cli_tools_argocd_version }})
  ansible.builtin.get_url:
    url: "{{ cli_tools_argocd_cli_url }}"
    dest: /usr/local/bin/argocd
    checksum: "{{ cli_tools_argocd_cli_checksum }}"
    mode: "0755"

# --- kubectl-cnpg: плагин оператора CloudNativePG ---
# В релизах CNPG есть RPM, но подписан он cosign, а не GPG, поэтому dnf
# подпись всё равно не проверит. Скачиваем RPM с sha256 из checksums.txt
# релиза и ставим локальным файлом — так целостность проверяется.
- name: Скачать RPM kubectl-cnpg {{ cli_tools_kubectl_cnpg_version }}
  ansible.builtin.get_url:
    url: "{{ cli_tools_kubectl_cnpg_rpm_url }}"
    dest: "/usr/local/src/kubectl-cnpg-{{ cli_tools_kubectl_cnpg_version }}.rpm"
    mode: "0644"
    checksum: "{{ cli_tools_kubectl_cnpg_rpm_checksum }}"

- name: Установить kubectl-cnpg
  ansible.builtin.dnf5:
    name: "/usr/local/src/kubectl-cnpg-{{ cli_tools_kubectl_cnpg_version }}.rpm"
    state: present
    disable_gpg_check: true

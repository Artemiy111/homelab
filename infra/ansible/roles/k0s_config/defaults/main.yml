---
# ClusterConfig k0s для узла homelab. Переменных в файле нет, поэтому роль
# копирует его как есть, а не рендерит: issuer Zitadel не секрет (домен виден
# в Certificate Transparency, docs/adr/0009) и обязан совпадать с тем, что
# объявляет /.well-known/openid-configuration.
#
# Файл применяется ролью k0s_config и install.sh; правка требует
# `k0s stop && k0s start` — spec.api не обновляется динамически.
k0s_config_src: "{{ repo_root }}/infra/host/etc/k0s/k0s.yaml"
k0s_config_dest: /etc/k0s/k0s.yaml

# systemd-юнит k0s на хосте. Рестарт нужен при смене файла: spec.api не
# обновляется динамически и перечитывается только при старте процесса.
k0s_config_service: k0scontroller

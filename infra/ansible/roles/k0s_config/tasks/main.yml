---
# Доставка ClusterConfig k0s в /etc/k0s/k0s.yaml. spec.api не обновляется
# динамически, поэтому смена файла требует рестарта control plane — это делает
# handler. Без него роль просто привела бы файл в порядок, а apiserver
# продолжил бы работать со старыми аргументами.
#
# Установка k0s (бинарь, PKI, юнит) остаётся в infra/host/k0s/install.sh:
# она не идемпотентна и повторный запуск не имеет смысла.

- name: Развернуть ClusterConfig k0s
  ansible.builtin.copy:
    src: "{{ k0s_config_src }}"
    dest: "{{ k0s_config_dest }}"
    mode: "0600"
    owner: root
    group: root
  # diff на уровне задачи, а не в аргументах модуля: action-плагин копирования
  # не принимает diff, а сам файл содержит адрес issuer'а и clientID.
  diff: false
  notify: Restart k0s

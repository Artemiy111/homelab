---
# Тома внешнего NTFS-диска и раздача их по SMB.
#
# Тома перечислены UUID'ами, а не путями `/dev/sd*`: имя устройства
# нестабильно. Longhorn создаёт блочное устройство на каждый том и ядро
# выдаёт им имена из того же пространства `sd[a-z]`, что и USB-диски, —
# внешний диск «переезжает» между `sda`, `sdb`, `sdbc` по мере создания и
# удаления томов Longhorn. UUID переживает и перезагрузку, и такую
# перестановку.
#
# `by-id` для USB-моста этого диска пуст — у него нет серийника, который
# туда попадает, — поэтому UUID здесь единственный устойчивый идентификатор.

ntfs_samba_volumes:
  - name: ntfs1
    mountpoint: /mnt/ntfs1
    uuid: 36447F8E447F4F9B
    # Том помечен ядром «It is recommended to use chkdsk»: Windows не
    # завершила запись метаданных. rw до `chkdsk` в Windows означает
    # переигровку журнала NTFS средствами Linux — менее проверенный путь,
    # чем штатное восстановление Windows.
    mode: ro
  - name: ntfs2
    mountpoint: /mnt/ntfs2
    uuid: F49090CD909097A6
    mode: ro
  - name: ntfs3
    mountpoint: /mnt/ntfs3
    uuid: 962A2DEC2A2DC9D7
    mode: rw

# SELinux в enforcing: smbd (`samba_t`) не имеет доступа к `mnt_t` по
# умолчанию. Метка задаётся опцией монтирования `context=`, а не `chcon`
# по дереву: для ntfs3 она живёт в памяти ядра, на диск не пишется и
# переживает переподключение без переразметки.
ntfs_samba_selinux_context: "system_u:object_r:samba_share_t:s0"

# Владелец файлов на томах. 1000 — artlab; Samba работает от этого же
# пользователя, иначе клиент получает файлы, которые не может удалить.
ntfs_samba_owner_uid: 1000
ntfs_samba_owner_gid: 1000
ntfs_samba_umask: "0022"

ntfs_samba_service: smb
ntfs_samba_firewall_service: samba

# Имя, под которым учётка выглядит для клиентов SMB. Не обязано
# совпадать с Linux-юзером: Samba держит свою базу `tdbsam` и о
# Linux-аккаунтах ничего не знает. Здесь специально не внутреннее имя
# `artlab` — логин видно в Windows и macOS.
ntfs_samba_user: storage

# Unix-пользователь, от которого Samba работает с файлами. На NTFS
# POSIX-владельцев не существует: ntfs3 подставляет uid/gid из опций
# монтирования всем файлам одинаково. Настоящее владение выглядело бы
# в Проводнике как файлы, которые нельзя удалить, — владельцем всех
# записей был бы тот, кто их создал. `force user` делает владение
# явным: файлы всегда за учёткой хоста, независимо от клиента.
ntfs_samba_unix_user: artlab

# Файл-секрет с паролем Samba. Значение кладётся в Vault по пути
# `kv/samba/storage`; на хост доставляется вне git, поэтому в
# репозитории его нет.
ntfs_samba_password_file: /etc/samba/storage.secret

# Пустые каталоги от прежнего ручного монтирования, когда диск ещё был
# `/dev/sda`. Не монтируются, только занимают место и сбивают с толку.
ntfs_samba_stale_mount_dirs:
  - /mnt/sda1
  - /mnt/sda2
  - /mnt/sda3

# Модули TCP. `bbr` устойчив к потерям на длинном RTT, где `cubic`
# сжимает окно до единиц килобайт: между городами это разница в
# десятки раз на одном и том же канале.
ntfs_samba_tcp_modules:
  - tcp_bbr

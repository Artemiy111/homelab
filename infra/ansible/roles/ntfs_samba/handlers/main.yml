---
- name: Remount fstab
  # Перечитывает fstab и монтирует/размонтирует изменившиеся точки.
  # `systemctl daemon-reload` обязателен до этого: unit'ы для новых
  # записей fstab генерируются из systemd-fstab-generator при старте,
  # и без перезагрузки демона они не появятся.
  ansible.builtin.systemd_service:
    name: daemon-reload
    state: restarted
  listen: Remount fstab

- name: Restart smb
  ansible.builtin.systemd_service:
    name: "{{ samba_service }}"
    state: restarted
    daemon_reload: true
  listen: Restart smb

- name: Перезагрузить firewalld
  # --permanent пишет правило в зону, но не применяет: без reload порт
  # 445 остаётся закрытым, и Samba поднимается вхолостую.
  ansible.builtin.command:
    cmd: firewall-cmd --reload
  changed_when: true
  listen: Перезагрузить firewalld

- name: Применить sysctl
  ansible.builtin.command:
    cmd: sysctl --system
  changed_when: true
  listen: Применить sysctl

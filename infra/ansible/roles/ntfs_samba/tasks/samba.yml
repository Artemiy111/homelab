---
# Конфигурация Samba, юнит и правило файрвола.

- name: Раздать каталог подключаемых конфигов
  ansible.builtin.file:
    path: /etc/samba/smb.conf.d
    state: directory
    mode: "0755"

- name: Скопировать конфиг шар
  ansible.builtin.copy:
    src: "{{ repo_root }}/infra/host/etc/samba/homelab.conf"
    dest: /etc/samba/smb.conf.d/homelab.conf
    mode: "0644"
  notify: Restart smb

- name: Подключить каталог из smb.conf
  # Явная строка include, а не glob: Samba 4.24 не разворачивает `*` и
  # молча игнорирует файл. Дополнительно проверяется задачей
  # «Проверить, что секции видны testparm» ниже.
  ansible.builtin.lineinfile:
    path: /etc/samba/smb.conf
    line: "\tinclude = /etc/samba/smb.conf.d/homelab.conf"
    insertafter: '^\[global\]'
    state: present
    mode: "0644"
  notify: Restart smb

- name: Включить и запустить smb
  ansible.builtin.systemd_service:
    name: "{{ ntfs_samba_service }}"
    enabled: true
    state: started
    daemon_reload: true

- name: Открыть samba в firewalld
  ansible.builtin.command:
    cmd: "firewall-cmd --permanent --add-service={{ ntfs_samba_firewall_service }}"
  register: ntfs_samba_firewall
  changed_when: "'success' in ntfs_samba_firewall.stdout"
  notify: Перезагрузить firewalld

- name: Убедиться, что samba входит в активные правила
  # --permanent пишет в зону, но не применяет: до --reload порт 445
  # остаётся закрытым и поды, и хост не видят демон.
  ansible.builtin.command:
    cmd: "firewall-cmd --query-service={{ ntfs_samba_firewall_service }}"
  # Без этого задача пропускается в --check: command, который ничего не
  # меняет, по умолчанию в check mode не выполняется, и проверка молча
  # проходила бы с пустым результатом.
  check_mode: false
  register: ntfs_samba_firewall_active
  changed_when: false
  failed_when: ntfs_samba_firewall_active.rc != 0
  notify: Перезагрузить firewalld

- name: Проверить, что секции видны testparm
  # testparm проверяет синтаксис, но не проверяет, что include
  # сработал: с неверным include конфиг валиден, сервис стартует, порт
  # открыт, а шары нет. Поэтому сверяемся с эффективным конфигом.
  ansible.builtin.command:
    cmd: "testparm -s /etc/samba/smb.conf"
  # Та же причина, что и выше: без check_mode проверка не выполняется в
  # --check, и следующий assert падает на пустом выводе, заявляя, что
  # секций нет, хотя файл на месте.
  check_mode: false
  register: ntfs_samba_effective
  changed_when: false

- name: Убедиться, что все секции попали в конфиг
  ansible.builtin.assert:
    that:
      - "'[' ~ item.name ~ ']' in ntfs_samba_effective.stdout"
    fail_msg: >-
      Секция [{{ item.name }}] отсутствует в эффективном конфиге Samba.
      Проверь строку include в /etc/samba/smb.conf.
    success_msg: "Секция [{{ item.name }}] на месте"
  loop: "{{ ntfs_samba_volumes }}"
  loop_control:
    label: "{{ item.name }}"

- name: Убедиться, что force user задан
  # `force user` в [global] действует как значение по умолчанию для всех
  # секций, но testparm показывает его отрешённым — в каждой секции пусто.
  # Поэтому проверяем именно global-часть вывода. Без него Samba
  # работает с файлами от учётки клиента, и на NTFS (где владелец
  # синтезируется из опций монтирования) это даёт файлы, которые клиент
  # не может удалить.
  ansible.builtin.assert:
    that:
      - "'force user = ' ~ ntfs_samba_unix_user in ntfs_samba_effective.stdout"
    fail_msg: >-
      В эффективном конфиге нет force user = {{ ntfs_samba_unix_user }}.
      Файлы будут принадлежать учётке клиента, а не учётке хоста.
    success_msg: "force user = {{ ntfs_samba_unix_user }} на месте"

- name: Сверить режим монтирования с read only в шаре
  # read only в Samba не должен быть мягче, чем монтирование: раздел
  # ro, который Samba считает rw, даст клиенту ошибки ввода-вывода
  # вместо внятного «read-only resource».
  #
  # testparm печатает булевы значения с заглавной (`No`), а не как в
  # smb.conf (`no`) — сравнение регистрозависимое, и без учёта этого
  # проверка падает на корректном конфиге.
  ansible.builtin.assert:
    that:
      - >-
        (item.mode == 'ro') or
        (('[' ~ item.name ~ ']')
         in ntfs_samba_effective.stdout
         and ('\tread only = No')
         in ntfs_samba_effective.stdout)
    fail_msg: >-
      Том {{ item.name }} смонтирован {{ item.mode }}, но в секции шары
      нет read only = no. Клиент получит ошибки ввода-вывода вместо
      отказа по правам.
    success_msg: "Режим {{ item.mode }} тома {{ item.name }} согласован с шарой"
  loop: "{{ ntfs_samba_volumes }}"
  loop_control:
    label: "{{ item.name }}"

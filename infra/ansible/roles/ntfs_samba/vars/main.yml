# Опции монтирования NTFS.
#
# `context=` — метка SELinux для smbd (см. ntfs_samba_selinux_context).
# `uid`/`gid` — владелец файлов, синтезируется ntfs3: на NTFS нет
# POSIX-владельцев, драйвер выдаёт заданные при монтировании.
# `umask` — маска для прав, которые драйвер не может взять из NTFS.
# `noatime` — на USB-диске обновление времени доступа заставляет
# перезаписывать метаданные при каждом чтении.
# `nofail` — загрузка хоста не должна вставать из-за не воткнутого
#   USB-диска: без `nofail` systemd ждёт бесконечно и уходит в emergency.
# `x-systemd.automount` — точка монтирования поднимается лениво, по
#   первому обращению. Это даёт корректный порядок: под Samba может
#   стартовать раньше диска, и он увидит каталог без тома, но не пустоту
#   в `/storage`.
# `x-systemd.device-timeout` — ждать появления USB-устройства не дольше
#   10 секунд, иначе старт зависает на отсутствующем диске.
# `x-systemd.after` — монтирование не должно блокировать `remote-fs`
#   целиком: диск подключается позже, а сеть от него не зависит.
ntfs_samba_mount_options:
  - noatime
  - "uid={{ ntfs_samba_owner_uid }}"
  - "gid={{ ntfs_samba_owner_gid }}"
  - "umask={{ ntfs_samba_umask }}"
  - "context={{ ntfs_samba_selinux_context }}"
  - nofail
  - x-systemd.automount
  - x-systemd.device-timeout=10

# `0 0`: поле dump не используется (NTFS не в fstab-дистрибутиве),
# поле pass — 0, потому что проверку целостности делает ntfs3 при
# монтировании, а не mount(8).
ntfs_samba_fstab_tail: "0 0"

---
# Домфайлы ops копируются из репозитория тем же git-процессом, что и
# остальная конфигурация хоста. Роль идемпотентна: файлы, совпадающие с
# источником, повторный прогон не трогает.

- name: Ограничить доступ к ~/.ssh
  ansible.builtin.file:
    path: "{{ ops_home }}/.ssh"
    state: directory
    owner: "{{ ops_user }}"
    group: "{{ ops_group }}"
    mode: "0700"

# Симлинк на пути dotfiles удаляется до копирования: иначе запись уходит по
# ссылке, и файл в репозитории получает содержимое, которого там не было.
- name: Собрать состояние управляемых файлов
  ansible.builtin.stat:
    path: "{{ item.dest }}"
  loop: "{{ ops_managed_files }}"
  loop_control:
    label: "{{ item.dest }}"
  register: ops_managed_stat

- name: Убрать симлинки на путях управляемых файлов
  ansible.builtin.file:
    path: "{{ item.stat.path }}"
    state: absent
  loop: "{{ ops_managed_stat.results }}"
  loop_control:
    label: "{{ item.stat.path }}"
  when: item.stat.islnk | default(false)

# validate отдаёт временный файл на проверку: синтаксически неверный rc-файл
# не должен доезжать до домашнего каталога и оставлять пользователя без шелла.
- name: Скопировать файлы в домашний каталог
  ansible.builtin.copy:
    src: "{{ item.src }}"
    dest: "{{ item.dest }}"
    owner: "{{ ops_user }}"
    group: "{{ ops_group }}"
    mode: "{{ item.mode }}"
    validate: "{{ item.validate | default(omit) }}"
  loop: "{{ ops_managed_files }}"
  loop_control:
    label: "{{ item.dest }}"

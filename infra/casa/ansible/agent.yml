---
# Плейбук: пользователь ai-agent и его окружение.
# Запуск с контроллера — macOS, из каталога infra/casa/ansible:
#   ansible-playbook agent.yml --ask-become-pass
# Dry-run (ничего не меняет):
#   ansible-playbook agent.yml --check --diff --ask-become-pass

- name: Окружение пользователя ai-agent
  hosts: nodes
  become: true
  gather_facts: false
  roles:
    - ai_agent

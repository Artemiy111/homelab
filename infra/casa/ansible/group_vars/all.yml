---
# Общие переменные всех плейбуков. Ansible загружает group_vars/all.yml
# автоматически для хостов группы all — отдельный vars_files не нужен.
# playbook_dir — каталог infra/casa/ansible/, три dirname подряд — корень
# репозитория; роли берут
# отсюда пути к infra/casa/host/etc/ и infra/casa/dotfiles/ без `..` в путях.
repo_root: "{{ playbook_dir | dirname | dirname | dirname }}"

---
# Тома LVM, смонтированные на хосте, и их записи в fstab.
#
# Том назван UUID'ом файловой системы, а не путём `/dev/<vg>/<lv>`: путь
# меняется при переименовании группы или тома, и строка fstab перестала бы
# находить устройство молча — с `nofail` это видно только по пустому каталогу.
# UUID файловой системы переживает и переименование, и перестановку дисков.
lvm_mounts_volumes:
  - name: backups
    mountpoint: /mnt/backups
    uuid: 5d6812c1-d881-4246-88a3-65cc3ae33e40

# Опции монтирования ext4.
#
# `noatime` — обновление времени доступа переписывает метаданные при каждом
#   чтении, а том лежит на внешнем диске.
# `nofail` — загрузка хоста не должна вставать из-за не подключённого диска:
#   без него systemd ждёт устройство бесконечно и уходит в emergency.
# `x-systemd.device-timeout` — ждать появления устройства не дольше 10 секунд.
lvm_mounts_mount_options:
  - noatime
  - nofail
  - x-systemd.device-timeout=10

# `0 2`: поле dump не используется, pass 2 — проверка целостности при загрузке
# после грязного выключения. У NTFS проверку делает драйвер при
# монтировании, у ext4 — mount(8).
lvm_mounts_fstab_tail: "0 2"

---
- name: Перечитать fstab
  # Имя отличается от обработчика в ntfs_samba: обработчики адресуются по
  # имени и общие на весь плейбук, поэтому одинаковые имена в двух ролях
  # перекрыли бы друг друга.
  #
  # `daemon_reload` перезапускает systemd-fstab-generator, и тот заново
  # разбирает fstab: без этого юнитов для новых записей не существует, и том
  # не поднимется при загрузке. Имя `daemon-reload` тут не подходит — это не
  # юнит, и модуль падает с «Could not find the requested service».
  ansible.builtin.systemd_service:
    daemon_reload: true
  listen: Перечитать fstab

---
- name: Remount fstab
  # Перечитывает fstab, чтобы systemd-fstab-generator заново разобрал его и
  # создал юниты для изменившихся записей. Точки при этом не монтируются и не
  # размонтируются: монтирование делает задача роли.
  #
  # `daemon_reload` — параметр модуля, а не имя юнита: юнита с именем
  # `daemon-reload` не существует, и `name: daemon-reload` падает с
  # «Could not find the requested service».
  ansible.builtin.systemd_service:
    daemon_reload: true
  listen: Remount fstab

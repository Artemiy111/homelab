---
# Монтирование тома внешнего NTFS-диска и его раздача по SMB из кластера.
#
# Samba живёт в кластере (apps/casa/samba/), и хост её не
# обслуживает: ни пакета, ни юнита, ни конфига шар, ни учётки. Роль осталась
# ради fstab и TCP — того, что через Kubernetes сделать нельзя:
#
# - ntfs3 принимает `uid`/`gid`/`umask`/`context` только в опциях монтирования,
#   а у `hostPath` таких полей нет; владельцем файлов на NTFS должен быть uid
#   хоста, иначе Samba не сможет их писать;
# - systemd умеет ждать появления USB-устройства (`nofail`,
#   `x-systemd.device-timeout`) и переживает отсутствие диска при загрузке,
#   тогда как под просто не стартует;
# - `context=samba_share_t` задаёт SELinux-метку, под которой `smbd` в
#   кластере имеет доступ к томам.

- name: Установить samba-common-tools и ntfs3
  ansible.builtin.package:
    name:
      # samba-common-tools, а не samba: сам сервер теперь в кластере, а
      # smbclient нужен на хосте для проверки раздачи. Полный пакет samba
      # ставить незачем — он поднял бы второй smbd, конкурирующий с подом за
      # порт 445.
      - samba-common-tools
      # ntfs-3g оставлен: FUSE-драйвер для томов, которые не берёт
      # ntfs3 (например, сжатых). Основной путь монтирования — ntfs3,
      # он нативный и заметно быстрее на больших файлах.
      - ntfs-3g
    state: present

- name: Создать точки монтирования
  # Права и владелец задаются только точкой, а не содержимым тома. На
  # уже смонтированном томе модуль `file` применяет chmod к корню ФС, а
  # не к каталогу: том ro отклоняет запись с «Read-only file system»,
  # и задача падает на первом же томе.
  ansible.builtin.file:
    path: "{{ item.mountpoint }}"
    state: directory
    owner: "{{ ntfs_samba_owner_uid }}"
    group: "{{ ntfs_samba_owner_gid }}"
    mode: "0755"
  loop: "{{ ntfs_samba_volumes }}"
  loop_control:
    label: "{{ item.name }}"
  when: item.mountpoint not in ansible_facts['mounts'] | map(attribute='mount') | list

# --- Монтирования ---

- name: Смонтировать тома по UUID
  # Режим берётся из описания тома, а не из общих опций: `ro` и `rw`
  # заданы в fstab построчно, и без них mount открыл бы грязный том на
  # запись, минуя ограничение. Уже смонтированные точки
  # пропускаются — иначе mount перемонтирует тома поверх работающих
  # шар и оборвёт открытые на клиентах файлы.
  ansible.posix.mount:
    path: "{{ item.mountpoint }}"
    src: "UUID={{ item.uuid }}"
    fstype: ntfs3
    opts: "{{ item.mode }},{{ ntfs_samba_mount_options | join(',') }}"
    state: mounted
  loop: "{{ ntfs_samba_volumes }}"
  loop_control:
    label: "{{ item.name }}"
  when: item.mountpoint not in ntfs_samba_mounted_points
  vars:
    ntfs_samba_mounted_points: >-
      {{ ansible_facts['mounts'] | map(attribute='mount') | list }}
  register: ntfs_samba_mount_result

- name: Обновить fstab
  # loop в fstab без nofail/x-systemd.automount блокирует загрузку хоста
  # при не воткнутом диске, а ntfs3 на rw-томе в грязном состоянии
  # способен зависнуть на journal replay.
  #
  # Сопоставление по точке монтирования, а не по UUID: серийный номер меняется
  # при каждом `mkntfs`, и по UUID строка не находилась бы — lineinfile добавил
  # бы вторую запись для той же точки, со старым номером и старым режимом.
  ansible.builtin.lineinfile:
    path: /etc/fstab
    regexp: '^UUID=\S+\s+{{ item.mountpoint }}\s'
    line: "UUID={{ item.uuid }} {{ item.mountpoint }} ntfs3 {{ item.mode }},{{ ntfs_samba_mount_options | join(',') }} {{ ntfs_samba_fstab_tail }}"
    state: present
    create: false
    mode: "0644"
    validate: "/usr/sbin/mount -f -n -T %s"
  loop: "{{ ntfs_samba_volumes }}"
  loop_control:
    label: "{{ item.name }}"
  notify: Remount fstab

- name: Убрать строки fstab выведенных томов
  # Роль умеет только «обеспечить наличие»: том, убранный из
  # ntfs_samba_volumes, из fstab сам не исчезает, а его строка с `nofail`
  # молча ждёт несуществующий UUID. Сопоставление по точке монтирования:
  # серийный номер у выведенного тома мог быть любым.
  ansible.builtin.lineinfile:
    path: /etc/fstab
    regexp: '^UUID=\S+\s+{{ item }}\s'
    state: absent
    mode: "0644"
    validate: "/usr/sbin/mount -f -n -T %s"
  loop: "{{ ntfs_samba_retired_mounts }}"
  notify: Remount fstab

- name: Убрать точки монтирования выведенных томов
  # Каталог, под которым ещё смонтирован том, удалить нельзя: `state=absent`
  # падает с «Device or resource busy». Пропущенная точка уйдёт следующим
  # прогоном, после `umount`.
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop: "{{ ntfs_samba_retired_mounts }}"
  when: item not in ansible_facts['mounts'] | map(attribute='mount') | list

- name: Удалить каталоги от прежнего ручного монтирования
  # Диск тогда был /dev/sda, и точки создавались вручную. Сейчас они
  # пустые и не монтируются, но занимают место и вводят в заблуждение:
  # выглядят как рабочие точки монтирования.
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop: "{{ ntfs_samba_stale_mount_dirs }}"
  when: item not in ansible_facts['mounts'] | map(attribute='mount') | list

# --- TCP ---

- name: Добавить модули TCP в автозагрузку
  # bbr нужен до первого сетевого соединения: без него в момент старта
  # система успевает установить несколько соединений на cubic, и они
  # держат низкую скорость, пока не переоткроются.
  ansible.builtin.copy:
    dest: "/etc/modules-load.d/{{ item }}.conf"
    content: "{{ item }}\n"
    mode: "0644"
  loop: "{{ ntfs_samba_tcp_modules }}"

- name: Зафиксировать алгоритм перегрузки TCP
  # modules-load только загружает модуль; выбрать его по умолчанию —
  # отдельная настройка, и без неё после перезагрузки возвращается
  # cubic.
  ansible.builtin.copy:
    dest: /etc/sysctl.d/60-bbr.conf
    content: |
      # BBR оценивает полосу и RTT напрямую, не ожидая потерь для
      # роста окна. На междугороднем канале с 0.5% потерь cubic сжимает
      # окно до единиц килобайт, и полоса падает в десятки раз.
      net.ipv4.tcp_congestion_control = bbr
    mode: "0644"
  notify: Применить sysctl

# --- Samba на хосте ---
#
# Сервер Samba на хосте выведен из эксплуатации: он в кластере
# (apps/casa/samba/). Роль ставит только `samba-common-tools` ради
# `smbclient`, поэтому юнита `smb` на хосте может не быть, а конфиг
# `/etc/samba/smb.conf` остаётся от пакета `samba-common`. Раздел убирает
# остатки и страхует от возврата второй Samba на порт 445.

- name: Собрать сведения о службах хоста
  # Нужны, чтобы не трогать юнит smb, которого может не быть: пакет `samba` на
  # хосте не ставится, только `samba-common-tools`.
  ansible.builtin.service_facts:

- name: Остановить и отключить smb
  # Порт 445 держит Samba в кластере (hostPort), поэтому хостовая не должна
  # занимать его второй раз: иначе под не поднимется, а имя smb.<домен>
  # продолжит уводить клиентов на хостовую.
  ansible.builtin.systemd_service:
    name: "{{ ntfs_samba_service }}"
    enabled: false
    state: stopped
    daemon_reload: true
  when: (ntfs_samba_service ~ '.service') in ansible_facts.services

- name: Убрать правило firewalld для samba
  # `--permanent` пишет правило в зону, --reload применяет. Правило нужно
  # убрать, а не добавить: порт 445 публикуется на узле подом, и правило
  # больше не управляет доступом к шаре.
  #
  # Команда идемпотентна и на уже убранном правиле возвращает rc=0 с
  # предупреждением NOT_ENABLED, поэтому отдельной проверки не требуется.
  ansible.builtin.command:
    cmd: "firewall-cmd --permanent --remove-service={{ ntfs_samba_firewall_service }}"
  register: ntfs_samba_firewall_removed
  changed_when: "'success' in ntfs_samba_firewall_removed.stdout"
  failed_when: ntfs_samba_firewall_removed.rc != 0
  notify: Перезагрузить firewalld

- name: Убедиться, что samba больше не в правилах firewalld
  # Правило могло остаться в активной зоне от прежних прогонов и пережить
  # --permanent. `--query-service` возвращает 0, если сервис включён, и 1,
  # если нет: после удаления ожидаем ненулевой код, и нулевой означает, что
  # правило всё ещё активно.
  ansible.builtin.command:
    cmd: "firewall-cmd --query-service={{ ntfs_samba_firewall_service }}"
  check_mode: false
  register: ntfs_samba_firewall_query
  changed_when: false
  failed_when: ntfs_samba_firewall_query.rc == 0
  notify: Перезагрузить firewalld

- name: Удалить учётную запись Samba
  # Пароль в tdbsam удаляется вместе с учёткой. Пока она есть, хостовая
  # Samba пусть даже выключена принимает бывшие учётные данные; после
  # удаления их не принимает никто.
  ansible.builtin.user:
    name: "{{ ntfs_samba_user }}"
    state: absent

- name: Удалить базу паролей Samba
  ansible.builtin.file:
    path: /var/lib/samba
    state: absent

- name: Удалить файл-секрет с паролем Samba
  # Пароль теперь лежит в Vault и доезжает в под через VaultStaticSecret.
  # Копия на хосте больше не читается ничем.
  ansible.builtin.file:
    path: "{{ ntfs_samba_password_file }}"
    state: absent

- name: Удалить конфиг шар с хоста
  # Конфиг живёт в ConfigMap кластера. Копия на хосте больше не читается
  # и только вводит в заблуждение: правки в ней не влияют ни на что.
  ansible.builtin.file:
    path: /etc/samba/smb.conf.d/homelab.conf
    state: absent

- name: Проверить, есть ли конфиг Samba
  # Файл принадлежит пакету `samba-common`; если его нет, правки ниже упадут.
  ansible.builtin.stat:
    path: /etc/samba/smb.conf
  register: ntfs_samba_host_conf

- name: Убрать include шар из smb.conf
  # Без этого `testparm` на хосте продолжит видеть секции из файла, которого
  # уже нет, и проверка «шары на месте» на хосте врёт.
  ansible.builtin.lineinfile:
    path: /etc/samba/smb.conf
    regexp: '^[[:space:]]*include = /etc/samba/smb\.conf\.d/homelab\.conf[[:space:]]*$'
    state: absent
    mode: "0644"
  when: ntfs_samba_host_conf.stat.exists

- name: Закомментировать секцию homes
  # Дистрибутив по умолчанию отдаёт домашний каталог каждому
  # аутентифицированному пользователю. Хостовая Samba выключена, но файл
  # остаётся: если её кто-то включит, секция снова отдаст каталоги.
  ansible.builtin.replace:
    path: /etc/samba/smb.conf
    regexp: '^\[homes\]$'
    replace: '#[HOMES] выключено: домашние каталоги не раздаются'
  when: ntfs_samba_host_conf.stat.exists

- name: Удалить каталог подключаемых конфигов
  ansible.builtin.file:
    path: /etc/samba/smb.conf.d
    state: absent

---
# Резолвер узла. DHCP от роутера отдаёт DNS, который на внутреннюю зону
# `biplane.casa` отвечает REFUSED (см. docs/incidents/0011, 0012), поэтому
# серверы задаются явно: сначала Technitium стенда, потом публичный резерв.
# ignore-auto-dns обязателен — иначе NM добавит DHCP-адрес вторым и внутренняя
# зона снова окажется на усмотрение роутера.
resolver_interface: enp2s0

resolver_servers:
  - 192.168.1.254
  - 1.1.1.1

# Внешнее имя для проверки: резолвится и без кластера, поэтому проверка
# проходит и при остановленном Technitium.
resolver_probe_external: ghcr.io

# Повышенный лимит inotify-инстансов на uid.
# Дефолтных 128 не хватает: в k8s ~100 подов + Docker и системные демоны
# работают под root и делят один бюджет — .NET/node/watcher'ы падают
# с «user limit on inotify instances has been reached» (например, Technitium).
fs.inotify.max_user_instances = 1024

[commands]
# Тип обновлений: security — только исправления безопасности
upgrade_type = security

# Автоматически применять загруженные обновления
apply_updates = yes

# Случайная задержка перед запуском (сек), чтобы не нагружать сеть
randomize_delay = 360

# Канал уведомлений об обновлениях
emit_via = stdio

[emitters]
# Имя системы в уведомлениях
system_name = homelab

[email]
email_from = root@homelab
email_to = root@localhost
email_host = localhost

[command]
# Не используется при apply_updates = yes

[command_email]
# Не используется при emit_via = stdio

[base]
# Кэш обновлений
metadata_expire = 6h

# Пропуск packages, если доступны newer versions в других repo
skip_packages =

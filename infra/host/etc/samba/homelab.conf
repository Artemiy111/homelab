# Раздача томов внешнего NTFS-диска по SMB.
#
# Файл подключается из основного smb.conf строкой `include` с явным
# путём. Glob (`smb.conf.d/*.conf`) в Samba 4.24 не разворачивается:
# `testparm` молча не показывает секции из подключённого файла и не
# сообщает об ошибке — конфиг проходит проверку, а шары нет.
#
# Учётка одна — `storage`, без Linux-юзера: Samba держит свою базу
# `tdbsam`. Имя отвязано от учётки хоста, чтобы логин `artlab` не
# светился в Проводнике и в списке сессий.
#
# Значения `%U` и `%S` не взаимозаменяемы: `%U` — имя пользователя,
# `%S` — имя текущей шары. В секции `homes` дистрибутива `valid users
# = %S` работает только потому, что имя шары совпадает с именем
# пользователя; здесь шара называется `ntfs2`, и `%S` превратился бы в
# требование пользователя по имени `ntfs2`.

[ntfs1]
    path = /mnt/ntfs1
    read only = yes
    browseable = yes
    valid users = storage
    follow symlinks = no
    wide links = no

[ntfs2]
    path = /mnt/ntfs2
    read only = yes
    browseable = yes
    valid users = storage
    follow symlinks = no
    wide links = no

[ntfs3]
    path = /mnt/ntfs3
    read only = no
    browseable = yes
    valid users = storage
    follow symlinks = no
    wide links = no

[global]
    use sendfile = yes
    aio read size = 1
    aio write size = 1
    # Файлы создаются от Unix-учётки хоста, а не от учётки клиента: на
    # NTFS владелец всё равно синтезируется из опций монтирования, и без
    # этого клиент получает в Проводнике файлы, которые не может удалить.
    force user = artlab
    force group = artlab

# ECK-оператор (Elastic Cloud on Kubernetes) — официальный способ ставить
# Elasticsearch/Kibana в кластер через CRD.
# helm.elastic.co отдаёт 403 на .tgz (CDN-блок для нашего IP), поэтому чарт берём
# из git Elastic по path: CRD лежат в сабчарте eck-operator-crds/templates и
# рендерятся вместе с чартом. Имя Application = releaseName (Argo ставит
# app.kubernetes.io/instance по имени Application; менять releaseName нельзя —
# сломает селекторы чарта).
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: elastic-operator
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/elastic/cloud-on-k8s.git
    path: deploy/eck-operator
    targetRevision: v3.5.0
    helm:
      valuesObject:
        resources:
          requests:
            cpu: 100m
            memory: 150Mi
          limits:
            cpu: "1"
            memory: 512Mi
  destination:
    server: https://kubernetes.default.svc
    namespace: elastic-system
  syncPolicy:
    syncOptions:
      - CreateNamespace=true
      # CRD кластерные: без Prune=false их удаление снесёт все Elastic-ресурсы.
      - Prune=false
    automated:
      selfHeal: true

# Пробная установка Traefik через Argo CD — в отдельном namespace, чтобы
# не задеть рабочий Traefik (namespace default, externalIPs 192.0.2.10).
# Sync намеренно ручной: сначала смотрим diff, потом решаем.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: traefik-test
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://traefik.github.io/charts
    chart: traefik
    targetRevision: 41.4.0        # та же версия, что у рабочего Traefik
    helm:
      # Имя релиза = имя Application, от него же зависят имена ClusterRole
      # и ClusterRoleBinding, поэтому префикс traefik-test, а не traefik.
      releaseName: traefik-test
      # CRD кластерные и уже установлены боевым релизом: не претендуем на них,
      # иначе удаление этого приложения попробует снести и CRD.
      skipCrds: true
      valuesObject:
        ingressClass:
          enabled: true
          isDefaultClass: false   # дефолтным остаётся боевой Traefik
          name: traefik-test
        providers:
          kubernetesCRD:
            enabled: true
            allowCrossNamespace: false
        service:
          spec:
            type: ClusterIP       # без externalIPs: .254 принадлежит боевому
        metrics:
          prometheus:
            service:
              enabled: false
  destination:
    server: https://kubernetes.default.svc
    namespace: traefik-test
  syncPolicy:
    syncOptions:
      - CreateNamespace=true

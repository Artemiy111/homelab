# NetworkPolicy для namespace баз: default-deny ingress плюс явные разрешения.
# Оператор CNPG живёт в cnpg-system и обязан ходить в поды кластеров
# (instance manager, PostgreSQL), поэтому ему разрешён весь трафик.
# Потребители общего кластера перечисляются явно: сейчас это paperless.
# Egress не ограничивается — см. комментарий в apps/lute/k8s/networkpolicy.yaml.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-ingress
  namespace: databases
spec:
  podSelector: {}
  policyTypes:
    - Ingress
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-ingress
  namespace: databases
spec:
  podSelector: {}
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector: {}
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: cnpg-system
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-shared-from-consumers
  namespace: databases
spec:
  podSelector:
    matchLabels:
      cnpg.io/cluster: shared
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: paperless
      ports:
        - port: 5432
          protocol: TCP
---
# Namespace'ы выделенных кластеров пока заняты только базами: сервисы ещё в
# default и ходят в свои legacy-БД. Поэтому здесь достаточно intra-namespace и
# доступа оператора; ingress от traefik добавится вместе с переездом сервиса.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-ingress
  namespace: immich
spec:
  podSelector: {}
  policyTypes:
    - Ingress
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:

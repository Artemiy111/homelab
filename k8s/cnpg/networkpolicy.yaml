# NetworkPolicy для namespace баз: default-deny ingress плюс явные разрешения.
# Оператор CNPG живёт в cnpg-system и обязан ходить в поды кластеров
# (instance manager, PostgreSQL), поэтому ему разрешён весь трафик.
# vmagent из monitoring скрейпит встроенный экспортёр instance-manager (9187).
# Потребители общего кластера перечисляются явно: сейчас это paperless.
# Egress не ограничивается — см. комментарий в apps/lute/k8s/networkpolicy.yaml.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-ingress
  namespace: databases
spec:
  podSelector: {}
  policyTypes:
    - Ingress
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-ingress
  namespace: databases
spec:
  podSelector: {}
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector: {}
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: cnpg-system
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitoring
          podSelector:
            matchLabels:
              app: vmagent
      ports:
        - port: 9187
          protocol: TCP
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-shared-from-consumers
  namespace: databases
spec:
  podSelector:
    matchLabels:
      cnpg.io/cluster: shared
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: paperless
      ports:
        - port: 5432
          protocol: TCP
---
# Выделенные кластеры (zitadel, immich, dawarich) живут в namespace сервисов,
# и политики для них — в apps/<сервис>/k8s/networkpolicy.yaml. Здесь их нет:
# одинаковое имя объекта в одном namespace означало бы перезапись, и побеждал
# бы применённый последним (так cnpg-system остался без доступа и апгрейд
# zitadel-db повис на недоступном instance manager). Владелец namespace
# держит и его политики.

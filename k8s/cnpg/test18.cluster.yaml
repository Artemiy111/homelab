# Одноразовый кластер для первого знакомства с оператором: один инстанс,
# служебная база из bootstrap и рабочая — через CRD Database.
#
# Порядок применения: сначала test18.secret.yaml, потом этот файл. Секрет
# нужен роли test18 из managed.roles (её создаёт уже оператор, не initdb),
# поэтому без секрета роль и база просто не отреконсилятся.
#
# Класс хранилища — longhorn (Delete): для тестового кластера это удобно,
# удаление Cluster уносит и том. В боевых кластерах (shared и др.) стоит
# longhorn-retain, потому что там данные ценны.
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: test18
  namespace: databases
spec:
  instances: 1

  # При instances: 1 switchover невозможен, поэтому дефолтный PDB запрещает
  # drain ноды целиком: обслуживание узла или k0s-апгрейд повиснут. Оператор
  # сам советует выключать PDB для одноинстансных кластеров.
  enablePDB: false

  # minimal достаточно: коллация ICU, локали из образа не нужны (в system они
  # понадобились бы только для libc-варианта с en_US.utf8, который не взлетел).
  imageName: ghcr.io/cloudnative-pg/postgresql:18.4-minimal-trixie

  # Локаль окружения для процессов в поде. Нужна только для интерактивной
  # работы: в образах CNPG LANG не задан, setlocale падает в POSIX/C, и psql с
  # readline разваливает многобайтовый ввод («привет» превращается в мусор).
  # C.utf8 — единственная UTF-8 локаль в minimal-образе (в Debian-варианте
  # локалей больше). Это НЕ локаль базы: та задаётся в bootstrap.initdb ниже и
  # в объектах Database. Правка pod-шаблона перезапускает инстанс.
  env:
    - name: LANG
      value: C.utf8

  storage:
    storageClass: longhorn
    # Пол на пустом PG18 замерен в 39 МБ (три шаблонные базы + один сегмент
    # WAL в 16 МБ). Но дефолты CNPG (wal_level=logical, wal_keep_size=512MB)
    # позволяют WAL вырасти сильно больше одного сегмента, и 100Mi оказалось
    # мало. 256Mi — пол с запасом.
    size: 256Mi

  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: "1"
      memory: 1Gi

  postgresql:
    # Стендбаев нет, а дефолт CNPG wal_keep_size=512MB — это запас WAL под них:
    # такой потолок заставлял бы том переживать всплеск WAL в полгигабайта.
    # 64MB — несколько сегментов на всплеск и ничего лишнего.
    parameters:
      wal_keep_size: "64MB"

  bootstrap:
    initdb:
      # database/owner/secret не задаём: оператор создаст служебные app/app со
      # случайным паролем. Так ни одно приложение не получает особого статуса —
      # та же схема, что в боевых кластерах.
      encoding: UTF8
      # Коллация — ICU, а не libc-локаль из образа:
      #   * не зависит от того, какие локали запечены в образ (в minimal их нет
      #     вовсе, и libc-вариант падал с "invalid locale name");
      #   * одинаковые правила на любой машине;
      #   * версия коллации отслеживается, значит REINDEX предсказуем.
      # und — нейтральная (общая таблица Unicode): и кириллица, и латиница
      # сортируются корректно. ru-RU отличался бы только тем, что кириллица шла
      # бы перед латиницей — проверено на живых базах.
      localeProvider: icu
      icuLocale: und
      # ctype ICU не заменяет — он всегда из libc. В minimal-образе доступны
      # только C, C.utf8 и POSIX, поэтому берём C.utf8: в нём есть
      # Unicode-регистр, то есть upper()/lower() работают с кириллицей.
      # С просто C регистр не менялся бы (как в базе element).
      localeCType: C.utf8
      dataChecksums: true

  managed:
    roles:
      # Единственный источник ролей приложений. Пароль — из того самого
      # открытого тестового секрета: имя username обязано совпадать с ролью.
      - name: test18
        ensure: present
        login: true
        passwordSecret:
          name: test18-db-auth

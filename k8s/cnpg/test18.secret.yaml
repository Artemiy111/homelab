# Тестовый секрет для одноразового кластера test18 — пароль открытым текстом,
# он заведомо не секретный. Для боевых баз так нельзя: там <app>-db-auth
# шифруется SOPS (см. k8s/cnpg/README.md).
#
# Формат обязателен: kubernetes.io/basic-auth, ключи username и password.
# username должен совпадать с владельцем базы из bootstrap.initdb.owner,
# иначе оператор не сможет им распорядиться.
# Label cnpg.io/reload заставляет применить смену пароля сразу, а не ждать
# следующей сверки.
apiVersion: v1
kind: Secret
metadata:
  name: test18-db-auth
  namespace: databases
  labels:
    cnpg.io/reload: "true"
type: kubernetes.io/basic-auth
stringData:
  username: test18
  password: test-password

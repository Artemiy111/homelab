apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: headlamp
  namespace: default
spec:
  entryPoints:
    - websecure
  routes:
    # Дальше идёт собственный вход Headlamp по ServiceAccount-токену.
    - match: Host(`headlamp.example.com`)
      kind: Rule
      middlewares:
        # Middlewares объявлены в default (k8s/traefik/oauth2-proxy.middleware.yaml).
        - name: oauth2-proxy
        - name: secure-headers
        - name: ratelimit-default
      services:
        # Сервис Headlamp живёт в namespace headlamp (allowCrossNamespace включён).
        - name: headlamp
          namespace: headlamp
          port: 80

apiVersion: k0s.k0sproject.io/v1beta1
kind: ClusterConfig
metadata:
  name: k0s
spec:
  api:
    port: 6443

  network:
    provider: calico
    podCIDR: 10.244.0.0/16
    serviceCIDR: 10.96.0.0/12
    calico:
      mode: vxlan
      overlay: Always
      wireguard: false
    kubeProxy:
      disabled: false
      mode: iptables

  storage:
    type: etcd

  # Kubelet по умолчанию держит не больше 110 подов на ноду. Homelab давно
  # перевалил за сотню (одни DB-экспортеры добавляют ~22 пода), ресурсов на
  # ноде при этом с запасом. Профиль "default" применяется к встроенному
  # worker'у контроллера (k0s controller --profile default). Применяется
  # рестартом k0s (k0s stop && k0s start).
  workerProfiles:
    - name: default
      values:
        maxPods: 200

  telemetry:
    enabled: false

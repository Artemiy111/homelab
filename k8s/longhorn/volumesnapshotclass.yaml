# Обязательное условие для CSI-снапшотов: Longhorn создаёт VolumeSnapshotContent,
# но контроллер снапшотов и CRD в кластер не ставит (ansible/host.yml тоже не
# про это). Ставится один раз на кластер: k8s/argocd/snapshot-controller.yaml.
# default-аннотация нужна, чтобы VolumeSnapshot без явного класса брал этот.
apiVersion: snapshot.storage.k8s.io/v1
kind: VolumeSnapshotClass
metadata:
  name: longhorn
  annotations:
    snapshot.storage.kubernetes.io/is-default-class: "true"
driver: driver.longhorn.io
deletionPolicy: Delete

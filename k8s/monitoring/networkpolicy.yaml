# Базовый NetworkPolicy для namespace monitoring: default-deny ingress плюс
# явные разрешения. traefik — UI (grafana, vm, netdata, wud); gatus сам
# проверяет свои внутренние сервисы (victoriametrics, vmagent, netdata,
# grafana, wud) и kube-state-metrics из default. Egress не ограничивается.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-ingress
  namespace: monitoring
spec:
  podSelector: {}
  policyTypes:
    - Ingress
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-ingress
  namespace: monitoring
spec:
  podSelector: {}
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector: {}
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: traefik
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: default
          podSelector:
            matchLabels:
              app: kube-state-metrics
      ports:
        - port: 8080
          protocol: TCP

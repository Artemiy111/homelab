apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: authentik
  namespace: default
spec:
  ingressClassName: traefik
  rules:
    - host: auth.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: authentik
                port:
                  number: 9000

apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: home-assistant
  namespace: default
spec:
  entryPoints:
    - websecure
  routes:
    # У Home Assistant своя аутентификация (OIDC через ZITADEL) — forward auth не нужен.
    - match: Host(`ha.example.com`)
      kind: Rule
      services:
        # hostNetwork-под: Traefik достигает его только через ClusterIP.
        - name: home-assistant
          port: 8123
          nativeLB: true

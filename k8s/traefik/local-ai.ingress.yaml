apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: local-ai
  namespace: default
spec:
  ingressClassName: traefik
  rules:
    - host: localai.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: local-ai
                port:
                  number: 8080

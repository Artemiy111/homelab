apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: oauth2-proxy
  namespace: default
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`oauth.example.com`)
      kind: Rule
      middlewares:
        - name: secure-headers
      services:
        - name: oauth2-proxy
          port: 4180

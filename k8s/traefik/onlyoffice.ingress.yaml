apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: onlyoffice
  namespace: default
  annotations:
    traefik.ingress.kubernetes.io/router.middlewares: default-onlyoffice-xfp@kubernetescrd
spec:
  ingressClassName: traefik
  rules:
    - host: onlyoffice.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: onlyoffice
                port:
                  number: 80

apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: rustfs
  namespace: default
spec:
  entryPoints:
    - websecure
  routes:
    # S3 API на собственном хосте.
    - match: Host(`s3.example.com`)
      kind: Rule
      services:
        - name: rustfs
          port: 9000
    # Подписанные S3-запросы браузерной консоли к её же хосту уходят на API:
    # redirect или другой path ломают SigV4-подпись (SignatureDoesNotMatch).
    - match: Host(`rustfs.example.com`) && HeaderRegexp(`Authorization`, `^AWS4-HMAC-SHA256`)
      kind: Rule
      priority: 110
      services:
        - name: rustfs
          port: 9000
    # Консоль: только её base path.
    - match: Host(`rustfs.example.com`) && PathPrefix(`/rustfs/console`)
      kind: Rule
      priority: 100
      services:
        - name: rustfs
          port: 9001
    # Корень хоста консоли — редирект на UI для людей (низший приоритет).
    - match: Host(`rustfs.example.com`)
      kind: Rule
      priority: 1
      middlewares:
        - name: rustfs-root-redirect
      services:
        - name: rustfs
          port: 9000

apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: structurizr
  namespace: default
spec:
  entryPoints:
    - websecure
  routes:
    # У open-core сборки нет своей аутентификации — закрываем forward auth.
    - match: Host(`structurizr.example.com`)
      kind: Rule
      middlewares:
        - name: oauth2-proxy
        - name: secure-headers
        - name: ratelimit-default
      services:
        - name: structurizr
          port: 80

apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: structurizr
  namespace: structurizr
spec:
  entryPoints:
    - websecure
  routes:
    # У open-core сборки нет своей аутентификации — закрываем forward auth.
    - match: Host(`structurizr.example.com`)
      kind: Rule
      middlewares:
        # Префикс namespace обязателен: middleware живут в default.
        - name: default-oauth2-proxy
        - name: default-secure-headers
        - name: default-ratelimit-default
      services:
        - name: structurizr
          port: 80

apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: talk-hpb
  namespace: talk-hpb
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`talk-signaling.example.com`) && PathPrefix(`/standalone-signaling`)
      kind: Rule
      middlewares:
        - name: talk-signaling-strip
          namespace: default
      services:
        # hostNetwork-под: Traefik достигает его только через ClusterIP.
        - name: talk-hpb
          port: 8081
          nativeLB: true

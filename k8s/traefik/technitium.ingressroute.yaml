apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: technitium
  namespace: default
spec:
  entryPoints:
    - websecure
  routes:
    # У Technitium своя авторизация админки — forward auth не нужен.
    - match: Host(`dns.example.com`)
      kind: Rule
      services:
        - name: technitium
          port: 5380
  tls:
    secretName: wildcard-tls

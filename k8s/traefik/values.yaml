# Traefik в k8s получает внешний IP от MetalLB (LoadBalancer) —
# слушает 80/443 на выделенном IP 192.0.2.10, не конфликтуя с Docker-Traefik (80/443 на .254).
# Схема чарта traefik-41.4.0 (strict JSON schema).

service:
  spec:
    type: LoadBalancer
    # Помимо MetalLB-VIP (.253) Traefik слушает и .254 (IP узла) через
    # kube-proxy externalIPs — на него указывают DNS-записи после вывода
    # docker-Traefik.
    externalIPs:
      - 192.0.2.10

ports:
  web:
    port: 8000
    expose:
      default: true
    protocol: TCP
  websecure:
    port: 8443
    expose:
      default: true
    protocol: TCP

ingressClass:
  enabled: true
  isDefaultClass: true
  name: traefik

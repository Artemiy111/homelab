apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: victoriametrics
  namespace: default
spec:
  entryPoints:
    - websecure
  routes:
    # VMUI (редактор MetricsQL) и Prometheus-совместимые API/страницы.
    - match: Host(`vm.example.com`)
      kind: Rule
      middlewares:
        - name: oauth2-proxy
        - name: secure-headers
        - name: ratelimit-default
      services:
        - name: victoriametrics
          port: 8428
  tls:
    secretName: wildcard-tls

apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: xui
  namespace: default
spec:
  entryPoints:
    - websecure
  routes:
    # Панель защищена случайным base path и логином — forward auth не нужен.
    - match: Host(`xui.example.com`)
      kind: Rule
      services:
        - name: xui
          port: 2053

name: local-ai

services:
  api:
    image: localai/localai:v4.8.0@sha256:78befe43707579dbe1b1d3f17d9788aa41ec493da30a6b6aabdf39e5efd23b7c
    platform: linux/amd64
    restart: unless-stopped
    init: true
    stop_grace_period: 2m

    environment:
      HOME: /tmp/localai
      LOCALAI_ADDRESS: 0.0.0.0:8080
      LOCALAI_API_KEY: ${LOCALAI_API_KEY:?set LOCALAI_API_KEY in local-ai/.env}
      LOCALAI_LOG_LEVEL: info
      LOCALAI_SUBTLE_KEY_COMPARISON: "true"

    user: "1000:1000"
    read_only: true
    tmpfs:
      - /tmp:mode=1777,nosuid,nodev,size=4g
    volumes:
      - /storage/apps/local-ai/models:/models:Z
      - /storage/apps/local-ai/backends:/backends:Z
      - /storage/apps/local-ai/configuration:/configuration:Z
      - /storage/apps/local-ai/data:/data:Z
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

    pids_limit: 512
    mem_limit: 20g
    memswap_limit: 20g
    cpus: 14.0

    networks:
      - traefiknet

    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "--show-error", "http://127.0.0.1:8080/readyz"]
      start_period: 10m
      interval: 1m
      timeout: 10s
      retries: 3

    logging:
      options:
        max-size: "10m"
        max-file: "3"
        compress: "true"

    labels:
      - traefik.enable=true
      - traefik.http.routers.local-ai.rule=Host(`${LOCALAI_HOST:?set LOCALAI_HOST in local-ai/.env}`)
      - traefik.http.routers.local-ai.entrypoints=websecure
      - traefik.http.routers.local-ai.middlewares=secure-headers@file,ratelimit-default@file
      - traefik.http.services.local-ai.loadbalancer.server.port=8080
      - traefik.http.services.local-ai.loadbalancer.healthcheck.path=/readyz
      - traefik.http.services.local-ai.loadbalancer.healthcheck.interval=30s
      - traefik.http.services.local-ai.loadbalancer.healthcheck.timeout=5s
      - traefik.docker.network=traefiknet

networks:
  traefiknet:
    external: true

name: lute

services:
  lute:
    image: jzohrab/lute3:latest
    container_name: lute
    volumes:
      - ${APPS_STORAGE_PATH:-/storage/apps}/lute/data/data:/lute_data
      - ${APPS_STORAGE_PATH:-/storage/apps}/lute/data/backups:/lute_backup

    networks:
      - traefiknet
    restart: unless-stopped

    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >-
          import urllib.request; urllib.request.urlopen('http://127.0.0.1:5001/', timeout=5)
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

    labels:
      - traefik.enable=true
      - traefik.http.routers.lute.rule=Host(`lute.${DOMAIN}`)
      - traefik.http.routers.lute.entrypoints=websecure
      - traefik.http.services.lute.loadbalancer.server.port=5001
      - traefik.docker.network=traefiknet

    cap_add:
      - DAC_OVERRIDE
    cap_drop:
      - ALL

    mem_limit: 512m
    mem_reservation: 256m
    security_opt:
      - label:disable

networks:
  traefiknet:
    external: true

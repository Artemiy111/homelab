services:
  lute:
    image: jzohrab/lute3:latest
    container_name: lute
    volumes:
      - /storage/apps/lute/data/data:/lute_data
      - /storage/apps/lute/data/backups:/lute_backup
    networks:
      - traefiknet
    restart: unless-stopped
    security_opt:
      - label:disable
    cap_drop:
      - ALL
    cap_add:
      - DAC_OVERRIDE

    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >-
          import urllib.request;
          urllib.request.urlopen('http://127.0.0.1:5001/', timeout=5)
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

    mem_limit: 512m
    mem_reservation: 256m

    labels:
      - traefik.enable=true
      - traefik.http.routers.lute.rule=Host(`${LUTE_HOST}`)
      - traefik.http.routers.lute.entrypoints=websecure
      - traefik.http.services.lute.loadbalancer.server.port=5001
      - traefik.docker.network=traefiknet

networks:
  traefiknet:
    external: true

services:
  mermaid-editor:
    image: ghcr.io/mermaid-js/mermaid-live-editor:latest
    container_name: mermaid-live-editor
    restart: unless-stopped

    networks:
      - traefiknet

    user: "1000:1000"
    read_only: true
    tmpfs:
      - /tmp:mode=1777
      - /var/run:mode=1777
      - /var/cache/nginx:mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

    pids_limit: 50
    mem_limit: 64m
    cpus: 0.5

    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:8080/"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s

    logging:
      options:
        max-size: "5m"
        max-file: "3"
        compress: "true"

    labels:
      - traefik.enable=true
      - traefik.http.routers.mermaid-live-editor.rule=Host(`mermaid.example.net`)
      - traefik.http.routers.mermaid-live-editor.entrypoints=websecure
      - traefik.http.routers.mermaid-live-editor.middlewares=secure-headers@file,ratelimit-default@file
      - traefik.http.services.mermaid-live-editor.loadbalancer.server.port=8080
      - traefik.docker.network=traefiknet

networks:
  traefiknet:
    external: true
    
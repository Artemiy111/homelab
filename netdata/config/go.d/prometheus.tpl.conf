# Сбор Prometheus-метрик приложений homelab.
# Цели выбраны по аудиту: docs/research/monitoring-systems-overview.md, §7.
# Переменные ref+envsubst://$NETDATA_* разворачивает vals flatten при рендере
# (init.sh экспортирует их из .env сервисов).
jobs:
  # Уже отдаёт /metrics без настройки.
  - name: authentik
    url: http://authentik-server:9300/metrics

  - name: wud
    url: http://wud:3000/metrics

  # Инфраструктура.
  - name: traefik
    url: http://traefik:8082/metrics

  - name: gatus
    url: http://gatus:8080/metrics

  # API-ключ Kuma с доступом к метрикам (создаётся в UI Kuma, живёт в
  # uptime-kuma/.env). Ключ передаётся как пароль basic auth без username.
  - name: uptime-kuma
    url: http://uptime-kuma:3001/metrics
    password: ref+envsubst://$NETDATA_UPTIME_KUMA_METRICS_API_KEY

  # Приложения с включённым экспортом метрик (см. compose/init.sh каждого).
  - name: navidrome
    url: http://navidrome:4533/metrics_ref+envsubst://$NETDATA_NAVIDROME_METRICS_PATH+

  - name: dawarich
    # Приложение редиректит внутренние запросы на публичный HTTPS-URL.
    url: https://dawarich.example.com/metrics
    username: ref+envsubst://$NETDATA_DAWARICH_METRICS_USERNAME
    password: ref+envsubst://$NETDATA_DAWARICH_METRICS_PASSWORD

  - name: forgejo
    # Токен передаётся как Bearer (см. forgejo docs, [metrics] TOKEN).
    url: http://forgejo:3000/metrics
    headers:
      Authorization: "Bearer ref+envsubst://$NETDATA_FORGEJO_METRICS_TOKEN+"

  - name: synapse
    url: http://element-synapse:9009/_synapse/metrics

  - name: immich-server
    url: http://immich-server:8081/metrics

  - name: livekit
    url: http://element-livekit:6789/metrics

  - name: technitium
    url: http://technitium:5380/api/dashboard/metrics/text
    headers:
      Authorization: "Bearer ref+envsubst://$NETDATA_TECHNITIUM_METRICS_TOKEN+"

  - name: stalwart
    url: http://mailserver:8080/metrics/prometheus
    username: ref+envsubst://$NETDATA_STALWART_METRICS_USERNAME
    password: ref+envsubst://$NETDATA_STALWART_METRICS_PASSWORD

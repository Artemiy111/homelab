name: oauth2-proxy

services:
  oauth2-proxy:
    image: quay.io/oauth2-proxy/oauth2-proxy:v7.15.0
    container_name: oauth2-proxy

    networks:
      - traefiknet
    restart: unless-stopped

    command:
      - --provider=oidc
      - --oidc-issuer-url=https://id.${DOMAIN}
      - --client-id=${OAUTH2_PROXY_CLIENT_ID:?set in oauth2-proxy/.env}
      - --client-secret=${OAUTH2_PROXY_CLIENT_SECRET:?set in oauth2-proxy/.env}
      - --cookie-secret=${OAUTH2_PROXY_COOKIE_SECRET:?set in oauth2-proxy/.env}
      - --cookie-secure=true
      - --cookie-domain=.${DOMAIN:?set in oauth2-proxy/.env}
      - --email-domain=*
      - --upstream=static://202
      - --reverse-proxy=true
      - --skip-provider-button=true
      - --set-xauthrequest=true
      - --pass-user-headers=true
      - --pass-access-token=true
      - --redirect-url=https://oauth.${DOMAIN}/oauth2/callback
      - --whitelist-domain=.${DOMAIN:?set in oauth2-proxy/.env}
      - --http-address=0.0.0.0:4180

    labels:
      - traefik.enable=true
      - traefik.docker.network=traefiknet
      - traefik.http.routers.oauth2-proxy.rule=Host(`oauth.${DOMAIN}`)
      - traefik.http.routers.oauth2-proxy.entrypoints=websecure
      - traefik.http.routers.oauth2-proxy.middlewares=secure-headers@file
      - traefik.http.services.oauth2-proxy.loadbalancer.server.port=4180

    security_opt:
      - no-new-privileges:true
    read_only: true

networks:
  traefiknet:
    external: true

name: paperless

services:
  broker:
    image: docker.io/valkey/valkey:9-alpine
    container_name: paperless-broker
    volumes:
      - ${APPS_STORAGE_PATH:-/storage/apps}/paperless/redis:/data:Z
    networks:
      - backend
    command: valkey-server --save 300 1 --loglevel warning
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  db:
    image: docker.io/library/postgres:18-alpine
    container_name: paperless-db
    volumes:
      - ${APPS_STORAGE_PATH:-/storage/apps}/paperless/postgresql:/var/lib/postgresql:Z
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-paperless}
      POSTGRES_USER: ${POSTGRES_USER:-paperless}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in paperless/.env}
    networks:
      - backend
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s
    shm_size: 256mb

  webserver:
    image: docker.io/paperlessngx/paperless-ngx:3.0
    container_name: paperless-webserver
    depends_on:
      db:
        condition: service_healthy
      broker:
        condition: service_healthy
      gotenberg:
        condition: service_started
      tika:
        condition: service_started
    volumes:
      - ${APPS_STORAGE_PATH:-/storage/apps}/paperless/data:/usr/src/paperless/data:Z
      - ${APPS_STORAGE_PATH:-/storage/apps}/paperless/media:/usr/src/paperless/media:Z
      - ${APPS_STORAGE_PATH:-/storage/apps}/paperless/export:/usr/src/paperless/export:Z
      - ${APPS_STORAGE_PATH:-/storage/apps}/paperless/consume:/usr/src/paperless/consume:Z
    environment:
      PAPERLESS_SECRET_KEY: ${PAPERLESS_SECRET_KEY:?set PAPERLESS_SECRET_KEY in paperless/.env}
      PAPERLESS_URL: https://${PAPERLESS_HOST:?set PAPERLESS_HOST in paperless/.env}
      PAPERLESS_CSRF_TRUSTED_ORIGINS: https://${PAPERLESS_HOST}
      PAPERLESS_TIME_ZONE: ${TZ:-Asia/Yekaterinburg}
      PAPERLESS_OCR_LANGUAGE: ${PAPERLESS_OCR_LANGUAGE:-rus}
      PAPERLESS_OCR_LANGUAGES: ${PAPERLESS_OCR_LANGUAGES:-rus}
      PAPERLESS_REDIS: redis://broker:6379
      PAPERLESS_DBENGINE: postgresql
      PAPERLESS_DBHOST: db
      PAPERLESS_DBNAME: ${POSTGRES_DB:-paperless}
      PAPERLESS_DBUSER: ${POSTGRES_USER:-paperless}
      PAPERLESS_DBPASS: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in paperless/.env}
      PAPERLESS_TIKA_ENABLED: 1
      PAPERLESS_TIKA_GOTENBERG_ENDPOINT: http://gotenberg:3000
      PAPERLESS_TIKA_ENDPOINT: http://tika:9998
      PAPERLESS_CONSUMER_RECURSIVE: "true"
      PAPERLESS_CONSUMER_SUBDIRS_AS_TAGS: "true"
      PAPERLESS_CONSUMER_POLLING: "60"
      USERMAP_UID: ${USERMAP_UID:-1000}
      USERMAP_GID: ${USERMAP_GID:-1000}
    networks:
      - backend
      - traefiknet
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8000/api/health/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    labels:
      - traefik.enable=true
      - traefik.http.routers.paperless.rule=Host(`${PAPERLESS_HOST}`)
      - traefik.http.routers.paperless.entrypoints=websecure
      - traefik.http.routers.paperless.middlewares=paperless-security
      - traefik.http.services.paperless.loadbalancer.server.port=8000
      - traefik.http.middlewares.paperless-security.headers.stsSeconds=15552000
      - traefik.http.middlewares.paperless-security.headers.stsIncludeSubdomains=true
      - traefik.http.middlewares.paperless-security.headers.contentTypeNosniff=true
      - traefik.http.middlewares.paperless-security.headers.referrerPolicy=origin
      - traefik.docker.network=traefiknet

  gotenberg:
    image: docker.io/gotenberg/gotenberg:8.34
    container_name: paperless-gotenberg
    command:
      - "gotenberg"
      - "--chromium-disable-javascript=true"
      - "--chromium-allow-list=file:///tmp/.*"
    networks:
      - backend
    restart: unless-stopped

  tika:
    image: docker.io/apache/tika:3.3.1.0
    container_name: paperless-tika
    networks:
      - backend
    restart: unless-stopped

networks:
  backend:
    internal: true
  traefiknet:
    external: true

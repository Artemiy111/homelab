# Headlamp — веб-UI для Kubernetes. Ставится официальным чартом
# kubernetes-sigs/headlamp.
#
# ВНИМАНИЕ: без clusterRoleBinding.create чарт создаёт ClusterRoleBinding
# cluster-admin на SA ПОДА. Ниже он выключен: права приходят из OIDC-токена
# пользователя, а границей сети остаётся NetworkPolicy в
# clusters/casa/platform/headlamp/networkpolicy.yaml.
#
# Маршрут и NetworkPolicy namespace headlamp живут вне Application
# (clusters/casa/platform/headlamp/route.yaml, clusters/casa/platform/headlamp/networkpolicy.yaml).

# Дефолт чарта: resources: {} не задано. Без requests планировщик не знает, что
# размещает, без limits UI способен вытеснить приложения.
resources:
  requests:
    memory: 64Mi
  limits:
    memory: 128Mi

# Дефолтный CRB чарта (clusterRoleBinding.create: true) выдаёт cluster-admin
# сервис-аккаунту ПОДА (headlamp). Под остаётся безправным, а права приходят из
# OIDC-токена пользователя.
clusterRoleBinding:
  create: false

config:
  oidc:
    # clientSecret приходит из Secret через envFrom, clientID — тоже: он известен
    # только после создания приложения в Zitadel.
    secret:
      create: false
    externalSecret:
      enabled: true
      name: headlamp-oidc

env:
  # OIDC_ISSUER_URL — адрес Zitadel в кластере, попадает в URL логина и в
  # метаданные провайдера у каждого браузера.
  - name: OIDC_ISSUER_URL
    value: https://id.biplane.casa
  # scopes — константа, меняется только вместе с набором claim'ов в Zitadel.
  - name: OIDC_SCOPES
    value: openid,profile,email
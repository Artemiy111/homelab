apiVersion: scheduling.k8s.io/v1
kind: PriorityClass
metadata:
  name: platform-critical
  annotations:
    argocd.argoproj.io/sync-options: Prune=false
value: 1000000
globalDefault: false
preemptionPolicy: PreemptLowerPriority
description: Платформенные компоненты, без которых кластер не управляет собой и не выдаёт секреты

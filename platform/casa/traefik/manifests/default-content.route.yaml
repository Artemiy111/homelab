apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: edge-default-content
  namespace: traefik
spec:
  parentRefs:
    - name: homelab
  hostnames:
    - '*.biplane.casa'
    - biplane.casa
  rules:
    - matches:
        - path:
            type: Exact
            value: /robots.txt
      backendRefs:
        - name: edge-default-content
          port: 80

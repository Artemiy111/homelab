apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: trivy-server
  namespace: trivy-system
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: trivy-server
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/managed-by: trivy-operator
      ports:
        - port: 4954
          protocol: TCP

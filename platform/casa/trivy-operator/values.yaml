operator:
  scanJobsConcurrentLimit: 2
  scanJobTTL: 1h
  builtInTrivyServer: true

trivyOperator:
  scanJobPodPriorityClassName: batch-low

trivy:
  slow: false
  storageClassEnabled: true
  storageClassName: longhorn
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: "1"
      memory: 1Gi

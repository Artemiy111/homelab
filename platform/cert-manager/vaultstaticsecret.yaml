apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultStaticSecret
metadata:
  name: dns01-webhook-dynv6-token
  namespace: cert-manager
spec:
  vaultAuthRef: vso-dns01-webhook
  mount: kv
  type: kv-v2
  path: dns01-webhook/dynv6
  refreshAfter: 1h
  destination:
    name: dns01-webhook-dynv6-token
    create: true
    overwrite: true
    transformation:
      excludeRaw: true
---
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultStaticSecret
metadata:
  name: dns01-webhook-spaceship
  namespace: cert-manager
spec:
  vaultAuthRef: vso-dns01-webhook
  mount: kv
  type: kv-v2
  path: dns01-webhook/spaceship
  refreshAfter: 1h
  destination:
    name: dns01-webhook-spaceship
    create: true
    overwrite: true
    transformation:
      excludeRaw: true
# Оставшиеся базовые пароли, которые ещё не переведены на Vault.
#
# zitadel исключён из миграции, immich и dawarich держат собственные кластеры
# CNPG в своих неймспейсах — их db-auth уже создаёт VSO.
# Всё остальное переведено: platform/cnpg/db-auth.vaultstaticsecrets.yaml.

# Формат обязателен: kubernetes.io/basic-auth, ключи username и password;
# имя Secret совпадает с passwordSecret роли из <cluster>.cluster.yaml,
# а значение username — с именем роли.
---
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: zitadel-db-auth
  namespace: zitadel
spec:
  encryptedData:
    password: 
    username: 
  template:
    metadata:
      name: zitadel-db-auth
      namespace: zitadel
    type: kubernetes.io/basic-auth
---
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: immich-db-auth
  namespace: immich
spec:
  encryptedData:
    password: 
    username: 
  template:
    metadata:
      name: immich-db-auth
      namespace: immich
    type: kubernetes.io/basic-auth
---
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: dawarich-db-auth
  namespace: dawarich
spec:
  encryptedData:
    password: 
    username: 
  template:
    metadata:
      name: dawarich-db-auth
      namespace: dawarich
    type: kubernetes.io/basic-auth

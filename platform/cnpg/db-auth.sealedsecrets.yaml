# Пароли ролей CNPG: <app>-db-auth в namespace своего кластера.
#
# Формат обязателен: kubernetes.io/basic-auth, ключи username и password;
# имя Secret совпадает с passwordSecret роли из <cluster>.cluster.yaml,
# а значение username — с именем роли.
#
# Значения переиспользованы из существующих Secret'ов сервисов в default,
# чтобы при миграции у сервиса менялся только хост, а не пароль. Запечатано
# kubeseal со scope strict: Secret читается лишь в своём namespace и под
# своим именем.
#
# Одним файлом, потому что это один набор предпосылок для кластеров и
# применяется вместе с ними. Когда сервисы переедут в свои namespace, секреты
# выделенных кластеров (zitadel, immich, dawarich) логично унести в
# apps/<сервис>/k8s/.
---
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: nextcloud-db-auth
  namespace: databases
spec:
  encryptedData:
    password: 
    username: 
  template:
    metadata:
      name: nextcloud-db-auth
      namespace: databases
    type: kubernetes.io/basic-auth

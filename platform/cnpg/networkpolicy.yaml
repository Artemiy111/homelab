# NetworkPolicy для namespace баз: default-deny ingress плюс явные разрешения.
# Оператор CNPG живёт в cnpg-system и обязан ходить в поды кластеров
# (instance manager, PostgreSQL), поэтому ему разрешён весь трафик.
# vmagent из monitoring скрейпит встроенный экспортёр instance-manager (9187).
# Потребители общего кластера перечисляются явно: сейчас это paperless, forgejo,
# infisical, glitchtip, postgres (pgweb), authentik, sure, nextcloud, open-webui,
# gatus, grafana (под gatus/grafana из общего namespace monitoring) и element
# (synapse).
# Egress не ограничивается — см. комментарий в apps/lute/k8s/networkpolicy.yaml.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-ingress
  namespace: databases
spec:
  podSelector: {}
  policyTypes:
    - Ingress
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-ingress
  namespace: databases
spec:
  podSelector: {}
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector: {}
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: cnpg-system
    - from:
        - podSelector:
            matchLabels:
              app: vmagent
          namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitoring
      ports:
        - protocol: TCP
          port: 9187
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-shared-from-consumers
  namespace: databases
spec:
  podSelector:
    matchLabels:
      cnpg.io/cluster: shared
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: paperless
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: forgejo
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: infisical
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: glitchtip
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: postgres
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: authentik
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: sure
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: nextcloud
        # open-webui — выделенный namespace, поэтому доступ дан всем подам
        # namespace'а (как paperless/forgejo/infisical/glitchtip/postgres/
        # authentik/sure/nextcloud).
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: open-webui
        # element — выделенный namespace (только synapse), поэтому доступ дан
        # всем подам namespace'а.
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: element
        # monitoring — общий namespace, поэтому доступ к базе дан только подам
        # gatus и grafana, а не всем подам namespace'а (в отличие от paperless/
        # forgejo/infisical/glitchtip/postgres/authentik/sure/nextcloud).
        - podSelector:
            matchLabels:
              app: gatus
          namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitoring
        - podSelector:
            matchLabels:
              app: grafana
          namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitoring
      ports:
        - protocol: TCP
          port: 5432

# Выделенные кластеры (zitadel, immich, dawarich) живут в namespace сервисов,
# и политики для них — в apps/<сервис>/k8s/networkpolicy.yaml. Здесь их нет:
# одинаковое имя объекта в одном namespace означало бы перезапись, и побеждал
# бы применённый последним (так cnpg-system остался без доступа и апгрейд
# zitadel-db повис на недоступном instance manager). Владелец namespace
# держит и его политики.

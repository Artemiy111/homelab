---
# Базы кластера shared.
#
# databaseReclaimPolicy: retain задан явно: удаление CR не должно уносить базу.
# Это дефолт оператора, но policy про данные лучше видеть в манифесте.
apiVersion: postgresql.cnpg.io/v1
kind: Database
metadata:
  name: nextcloud
  namespace: databases
spec:
  cluster:
    name: shared
  name: nextcloud
  owner: nextcloud
  encoding: UTF8
  databaseReclaimPolicy: retain

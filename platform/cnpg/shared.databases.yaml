---
apiVersion: postgresql.cnpg.io/v1
kind: Database
metadata:
  name: synapse
  namespace: databases
spec:
  cluster:
    name: shared
  name: synapse
  owner: synapse
  encoding: UTF8
  # Synapse (PostgresEngine.check_database) требует, чтобы и datcollate, и
  # datctype были ровно `C` — от любой другой локали (включая C.UTF-8) падает
  # IncorrectDatabaseSetup. Поэтому только у этой базы во всём shared
  # collate/ctype заданы как `C`.
  # Поля localeCollate/localeCType у CNPG Database иммутабельны, но база
  # переносится пустой, а не дампом, поэтому CR при необходимости
  # пересоздаётся без потерь.
  localeCollate: "C"
  localeCType: "C"
  databaseReclaimPolicy: retain
---
# authentik — тестовый стенд. База объявлена, пока стенд жив; при снятии
# стенда удаляется вместе с ролью (ensure: absent в managed.roles).
apiVersion: postgresql.cnpg.io/v1
kind: Database
metadata:
  name: authentik
  namespace: databases
spec:
  cluster:
    name: shared
  name: authentik
  owner: authentik
  encoding: UTF8
  databaseReclaimPolicy: retain

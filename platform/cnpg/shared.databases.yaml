# Базы кластера shared.
#
# databaseReclaimPolicy: retain задан явно: удаление CR не должно уносить базу.
# Это дефолт оператора, но policy про данные лучше видеть в манифесте.
---
apiVersion: postgresql.cnpg.io/v1
kind: Database
metadata:
  name: nextcloud
  namespace: databases
spec:
  cluster:
    name: shared
  name: nextcloud
  owner: nextcloud
  encoding: UTF8
  databaseReclaimPolicy: retain
---
apiVersion: postgresql.cnpg.io/v1
kind: Database
metadata:
  name: forgejo
  namespace: databases
spec:
  cluster:
    name: shared
  name: forgejo
  owner: forgejo
  encoding: UTF8
  databaseReclaimPolicy: retain
---
apiVersion: postgresql.cnpg.io/v1
kind: Database
metadata:
  name: paperless
  namespace: databases
spec:
  cluster:
    name: shared
  name: paperless
  owner: paperless
  encoding: UTF8
  databaseReclaimPolicy: retain
---
apiVersion: postgresql.cnpg.io/v1
kind: Database
metadata:
  name: glitchtip
  namespace: databases
spec:
  cluster:
    name: shared
  name: glitchtip
  owner: glitchtip
  encoding: UTF8
  databaseReclaimPolicy: retain
---
apiVersion: postgresql.cnpg.io/v1
kind: Database
metadata:
  name: playground
  namespace: databases
spec:
  cluster:
    name: shared
  name: playground
  owner: playground
  encoding: UTF8
  databaseReclaimPolicy: retain
---
apiVersion: postgresql.cnpg.io/v1
kind: Database
metadata:
  name: gatus
  namespace: databases
spec:
  cluster:
    name: shared
  name: gatus
  owner: gatus
  encoding: UTF8
  databaseReclaimPolicy: retain
---
apiVersion: postgresql.cnpg.io/v1
kind: Database
metadata:
  name: grafana
  namespace: databases
spec:
  cluster:
    name: shared
  name: grafana
  owner: grafana
  encoding: UTF8
  databaseReclaimPolicy: retain
---
apiVersion: postgresql.cnpg.io/v1
kind: Database
metadata:
  name: synapse
  namespace: databases
spec:
  cluster:
    name: shared
  name: synapse
  owner: synapse
  encoding: UTF8
  # Synapse (check_database) требует collation/ctype, совместимые с `C`/`C.UTF-8`
  # и не принимает `C.utf8` (дефолт кластера, см. platform/cnpg/README.md —
  # «Решения»). Поэтому ctype переопределяется только для этой базы.
  lcCtype: "C.UTF-8"
  databaseReclaimPolicy: retain
---
# authentik — тестовый стенд. База объявлена, пока стенд жив; при снятии
# стенда удаляется вместе с ролью (ensure: absent в managed.roles).
apiVersion: postgresql.cnpg.io/v1
kind: Database
metadata:
  name: authentik
  namespace: databases
spec:
  cluster:
    name: shared
  name: authentik
  owner: authentik
  encoding: UTF8
  databaseReclaimPolicy: retain
---
apiVersion: postgresql.cnpg.io/v1
kind: Database
metadata:
  name: infisical
  namespace: databases
spec:
  cluster:
    name: shared
  name: infisical
  owner: infisical
  encoding: UTF8
  databaseReclaimPolicy: retain
---
# sure на источнике называл базу sure_production (суффикс от RAILS_ENV); среда в
# homelab одна, поэтому база — sure.
apiVersion: postgresql.cnpg.io/v1
kind: Database
metadata:
  name: synapse
  namespace: databases
spec:
  cluster:
    name: shared
  name: synapse
  owner: synapse
  encoding: UTF8
  # Synapse строго проверяет ctype и не принимает `C.utf8` (дефолт кластера,
  # см. комментарий в shared.cluster.yaml): падает `IncorrectDatabaseSetup`.
  # Поэтому базе задан свой ctype `C.UTF-8`. База переносится пустой, а не
  # дампом, так что правка коллации не теряет данные.
  lcCtype: C.UTF-8
  databaseReclaimPolicy: retain
---
apiVersion: postgresql.cnpg.io/v1
kind: Database
metadata:
  name: openwebui
  namespace: databases
spec:
  cluster:
    name: shared
  name: openwebui
  owner: openwebui
  encoding: UTF8
  databaseReclaimPolicy: retain

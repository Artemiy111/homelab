apiVersion: postgresql.cnpg.io/v1
kind: Database
metadata:
  name: synapse
  namespace: databases
spec:
  cluster:
    name: shared
  name: synapse
  owner: synapse
  encoding: UTF8
  localeCType: "C"
  localeCollate: "C"
  # Synapse (PostgresEngine.check_database) требует, чтобы и datcollate, и
  # datctype были ровно `C` — от любой другой локали (включая C.UTF-8) падает
  # IncorrectDatabaseSetup. Поэтому только у этой базы collate/ctype заданы как
  # `C`. Шаблон — `template0`: дефолтный template1 навязывает ctype кластера
  # (`C.utf8`), а от него PostgreSQL не даёт задать другую локаль (SQLSTATE
  # 22023). С template0 база создаётся пустой с нужной локалью.
  # Поля localeCollate/localeCType/template у CNPG Database иммутабельны, но
  # база переносится пустой, поэтому CR при необходимости пересоздаётся
  # без потерь.
  template: template0
  databaseReclaimPolicy: retain
---
# authentik — тестовый стенд. База объявлена, пока стенд жив; при снятии
# стенда удаляется вместе с ролью (ensure: absent в managed.roles).
apiVersion: postgresql.cnpg.io/v1
kind: Database
metadata:
  name: authentik
  namespace: databases
spec:
  cluster:
    name: shared
  name: authentik
  owner: authentik
  encoding: UTF8
  databaseReclaimPolicy: retain

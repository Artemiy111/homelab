{{- if .Values.certManager.enabled }}
{{- $domain := .Values.config.domain }}
# Wildcard-сертификат для всех сервисов, за TLSStore default в Traefik.
#
# Certificate живёт в namespace traefik: именно оттуда его читает TLSStore
# (platform/traefik/tlsstore.yaml, `defaultCertificate.secretName: wildcard-tls`).
# Secret в другом namespace TLSStore не увидит.
#
# dnsNames — ТОЛЬКО wildcard, без apex. Apex и wildcard дают два identifier'а,
# а DNS-01 проверяет оба через одно имя `_acme-challenge.<домен>`: два challenge
# делят одну TXT-запись и затирают токены друг друга. Apex в маршрутах не
# используется (все хосты — поддомены).
#
# renewBefore 30d при 90-дневном сроке Let's Encrypt даёт запас на задержку
# выпуска. issuerRef меняется на letsencrypt-staging для отладки первого выпуска.
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: wildcard
  namespace: traefik
spec:
  secretName: wildcard-tls
  issuerRef:
    name: letsencrypt-prod
    kind: ClusterIssuer
  dnsNames:
    - "*.{{ $domain }}"
  renewBefore: 720h
{{- end }}

{{- if .Values.certManager.enabled }}
{{- $domain := .Values.config.domain }}
# Wildcard-сертификат для всех сервисов, за TLSStore default в Traefik.
#
# Certificate живёт в namespace traefik: именно оттуда его читает TLSStore
# (platform/traefik/tlsstore.yaml, `defaultCertificate.secretName: wildcard-tls`).
# Secret в другом namespace TLSStore не увидит.
#
# dnsNames — wildcard + apex. Apex обязателен: Matrix-клиент ищет
# `https://<server_name>/.well-known/matrix/client`, а server_name = apex-домен.
# Без apex в сертификате well-known отдаёт TLS-ошибку, и клиент не получает
# `org.matrix.msc4143.rtc_foci` → «Call is not supported» / MISSING_MATRIX_RTC_TRANSPORT.
#
# Оба identifier'а проверяются через одно имя `_acme-challenge.<домен>`, но
# в пределах одного Certificate challenge'и идут последовательно, а не параллельно
# (docs cert-manager: «If you specify both example.com and *.example.com on the
# same Certificate, it will take slightly longer to perform validation as each
# domain will have to be validated one after the other»). Конфликт TXT-записей
# возникает только при параллельных challenge'ях разных Certificate.
#
# renewBefore 30d при 90-дневном сроке Let's Encrypt даёт запас на задержку
# выпуска. issuerRef меняется на letsencrypt-staging для отладки первого выпуска.
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: wildcard
  namespace: traefik
spec:
  secretName: wildcard-tls
  issuerRef:
    name: letsencrypt-prod
    kind: ClusterIssuer
  dnsNames:
    - "*.{{ $domain }}"
    - "{{ $domain }}"
  renewBefore: 720h
{{- end }}

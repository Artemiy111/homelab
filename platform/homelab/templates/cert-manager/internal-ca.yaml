{{- if .Values.certManager.internalCA.enabled }}
{{- $host := .Values.certManager.internalCA.registryHost }}
# Внутренний корневой CA homelab.
#
# Ключ живёт только в Secret `homelab-internal-ca` в namespace cert-manager и
# наружу не выгружается: ни в git, ни в Vault, ни в Terraform state. Поэтому
# CA создан cert-manager'ом, а не через `tls_self_signed_cert` в Terraform —
# там ключ остался бы в state.
#
# Нужен для TLS на внутренних именах, которых нет в публичной зоне: OCI-реестр
# на forgejo.<internal> (жёсткое требование — OCI-клиент Argo ходит только по
# HTTPS). Имена во внешнем мире, наоборот, обслуживает ACME-эмитент
# letsencrypt-prod из clusterissuers.yaml.
#
# Самоподписанный Issuer и корневой Certificate — стандартная связка: без
# отдельного Issuer'а сертификат не на чем выпустить.
#
# Срок 10 лет и renewBefore 365d: CA, который переживает все листья и не
# требует синхронной ротации. Корневой сертификат — публичный материал, его
# копия попадает в argocd-tls-certs-cm (см. internal-ca-argocd.yaml) и в
# системное хранилище узла, чтобы containerd доверял реестру.
apiVersion: cert-manager.io/v1
kind: Issuer
metadata:
  name: homelab-internal-ca-selfsigned
  namespace: cert-manager
spec:
  selfSigned: {}
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: homelab-internal-ca
  namespace: cert-manager
spec:
  secretName: homelab-internal-ca
  isCA: true
  commonName: homelab internal CA
  duration: 87600h
  renewBefore: 8760h
  privateKey:
    algorithm: ECDSA
    size: 256
  issuerRef:
    name: homelab-internal-ca-selfsigned
    kind: Issuer
    group: cert-manager.io
---
# ClusterIssuer, а не Issuer: `ca`-эмитент ищет Secret в своём namespace, а
# Issuernamespaced'ый жил бы в traefik, где секрета с CA нет. ClusterIssuer
# берёт Secret из cluster resource namespace — то есть отсюда.
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: homelab-internal-ca
spec:
  ca:
    secretName: homelab-internal-ca
---
# Лист на внутреннее имя реестра.
#
# Secret лежит в namespace forgejo, а не traefik: Traefik ищет секрет из
# `spec.tls` Ingress в namespace самого Ingress и тихо откатывается на
# сертификат TLSStore по умолчанию, если секрета там нет — маршрут работает, но
# отдаёт чужой сертификат. Для TLSStore правило другое (секрет в traefik), см.
# certificate.yaml.
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: forgejo-internal
  namespace: forgejo
spec:
  secretName: forgejo-internal-tls
  dnsNames:
    - {{ $host }}
  duration: 2160h
  renewBefore: 360h
  privateKey:
    algorithm: ECDSA
    size: 256
  issuerRef:
    name: homelab-internal-ca
    kind: ClusterIssuer
    group: cert-manager.io
{{- end }}

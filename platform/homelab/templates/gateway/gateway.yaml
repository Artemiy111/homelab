{{- $domain := .Values.config.domain }}
# GatewayClass, которым обслуживает Traefik. Имя и controllerName совпадают с
# теми, что создаёт чарт Traefik (templates/gatewayclass.yaml), поэтому наш
# объект и объект чарта — один и тот же: применяется ровно один. При
# `gatewayClass.enabled: false` в values чарт свой GatewayClass не создаёт, и
# владение объектом целиком здесь.
apiVersion: gateway.networking.k8s.io/v1
kind: GatewayClass
metadata:
  name: traefik
spec:
  controllerName: traefik.io/gateway-controller
---
# Единственная точка входа в кластер. HTTPS-слушатели Terminate с
# certificateRef на wildcard-секреты, которые выпускает cert-manager
# (templates/cert-manager/certificate.yaml).
#
# Секреты лежат в этом же namespace, поэтому ReferenceGrant не нужен: без него
# Traefik отклонит ссылку как cross-namespace.
#
# Слушатели строятся по списку `certManager.certificates` — по два на домен.
# Список источник правды: домен без слушателя не принимает трафик, а HTTPRoute
# на такой домен отбрасывается с NoMatchingListenerHostname. Имя секрета берётся
# из `$cert.secretName`, а не пишется руками, чтобы добавление домена в values
# не требовало правки этого файла.
#
# Имена слушателей уникальны внутри Gateway, поэтому дополнительные домены
# получают суффикс из поля `listenerSuffix`. Он обязателен: без него `required`
# останавливает рендер, иначе два домена дали бы слушатели с одним именем.
#
# `HTTPRoute.spec.parentRefs[].sectionName` в репозитории не задаётся — слушатель
# подбирается по пересечению hostname с hostname маршрута. Ссылка на sectionName
# прибивала бы маршрут к одному имени слушателя, и домен, добавленный позже, отдал
# бы 404 с NoMatchingListenerHostname.
#
# hostname — wildcard: слушатель принимает любой поддомен, конкретные имена
# задаёт HTTPRoute. Так же работала схема с TLSStore default — раньше
# сертификат выдавался любому SNI одним стора, теперь то же делает слушатель.
#
# Apex-домен требует отдельного слушателя: `*.example.com` не пересекается с
# `example.com` (findMatchingHostname проверяет HasSuffix по `*.example.com`,
# поэтому apex не матчится). Слушатель `apex` нужен ради
# `/.well-known/matrix/*`, который отдаёт synapse: без него Matrix-клиент не
# получает homeserver.
#
# allowedRoutes.namespaces.from: All — HTTPRoute лежат в namespace приложений
# (apps/<сервис>/k8s/), а Gateway здесь, в traefik. from: Same не прикрепил бы
# ни одного маршрута, Selector потребовал бы метки на каждом namespace. All —
# сознательный размен: целостность обеспечивает то, что HTTPRoute всё равно
# нужно положить в репозиторий.
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: homelab
  namespace: traefik
spec:
  gatewayClassName: traefik
  listeners:
    {{- range $cert := .Values.certManager.certificates }}
    {{- $suffix := "" }}
    {{- if ne $cert.domain $domain }}
    {{- $suffix = printf "-%s" (required (printf "certManager.certificates: сертификат %s на домене %s не совпадает с config.domain, нужен listenerSuffix" $cert.name $cert.domain) $cert.listenerSuffix) }}
    {{- end }}
    - name: https{{ $suffix }}
      protocol: HTTPS
      port: 8443
      hostname: "*.{{ $cert.domain }}"
      tls:
        mode: Terminate
        certificateRefs:
          - kind: Secret
            name: {{ $cert.secretName }}
      allowedRoutes:
        namespaces:
          from: All
    - name: apex{{ $suffix }}
      protocol: HTTPS
      port: 8443
      hostname: "{{ $cert.domain }}"
      tls:
        mode: Terminate
        certificateRefs:
          - kind: Secret
            name: {{ $cert.secretName }}
      allowedRoutes:
        namespaces:
          from: All
    {{- end }}

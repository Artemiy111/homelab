apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: argocd
  namespace: argocd
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`argocd.{{ .Values.config.domain }}`)
      kind: Rule
      middlewares:
        # Middlewares объявлены в traefik (platform/traefik/oauth2-proxy.middleware.yaml).
        # Два из трёх намеренно НЕ подключены:
        #   - oauth2-proxy: авторизацию делает сам Argo (свой логин, дальше OIDC
        #     через authentik). forwardAuth поверх сломал бы его сессию и вызовы CLI.
        #   - ratelimit-default: UI Argo постоянно опрашивает API, 100/50 ловится
        #     при обычном просмотре синка.
        - name: secure-headers
          namespace: traefik
      services:
        # Сервис Argo живёт в namespace argocd (allowCrossNamespace включён).
        # Порт 80, а не 443: TLS терминирует Traefik, а Argo отдаёт HTTP —
        # это configs.params."server.insecure": true в argocd/install/values.yaml.
        - name: argocd-server
          namespace: argocd
          port: 80

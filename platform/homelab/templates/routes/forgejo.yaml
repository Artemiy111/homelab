# Веб-доступ к Forgejo. TLS не указываем: сертификат на entrypoint websecure
# берётся из TLSStore default (единственная копия секрета — в namespace traefik),
# поэтому явная секция tls здесь была бы вторым источником правды.
# SSH наружу отдаёт Service `forgejo-ssh` чарта (externalIPs узла), а не Ingress.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: forgejo
  namespace: forgejo
spec:
  ingressClassName: traefik
  rules:
    - host: forgejo.{{ .Values.config.domain }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: forgejo-http
                port:
                  name: http

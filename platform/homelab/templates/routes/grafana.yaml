apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: grafana
  namespace: monitoring
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`grafana.{{ .Values.config.domain }}`)
      kind: Rule
      middlewares:
        - name: oauth2-proxy
          namespace: traefik
        - name: secure-headers
          namespace: traefik
        - name: ratelimit-default
          namespace: traefik
      services:
        # Service создаёт grafana-operator из Grafana CR, поэтому имя с
        # суффиксом и порт 3000, а не 80 как у ручного Service.
        - name: grafana-service
          port: 3000

apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: headlamp
  namespace: headlamp
spec:
  entryPoints:
    - websecure
  routes:
    # Дальше идёт собственный вход Headlamp по OIDC: Headlamp сам ходит в
    # Zitadel и отдаёт apiserver'у токен, который тот проверяет по подписи
    # (etc/k0s/k0s.yaml.j2, spec.api.extraArgs). oauth2-proxy тут не нужен
    # и только мешал бы: он пустил бы до Traefik, а решение о доступе всё
    # равно принимает apiserver по claim `role`.
    - match: Host(`headlamp.{{ .Values.config.domain }}`)
      kind: Rule
      middlewares:
        # Middlewares объявлены в traefik (platform/traefik/oauth2-proxy.middleware.yaml).
        - name: secure-headers
          namespace: traefik
        - name: ratelimit-default
          namespace: traefik
      services:
        # Сервис Headlamp живёт в namespace headlamp (allowCrossNamespace включён).
        - name: headlamp
          namespace: headlamp
          port: 80

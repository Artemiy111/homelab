apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: home-assistant
  namespace: home-assistant
spec:
  entryPoints:
    - websecure
  routes:
    # У Home Assistant своя аутентификация (OIDC через ZITADEL) — forward auth не нужен.
    - match: Host(`ha.{{ .Values.config.domain }}`)
      kind: Rule
      services:
        # hostNetwork-под: Traefik достигает его только через ClusterIP.
        - name: home-assistant
          port: 80
          nativeLB: true

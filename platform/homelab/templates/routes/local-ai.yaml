apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: local-ai
  namespace: local-ai
spec:
  ingressClassName: traefik
  rules:
    - host: localai.{{ .Values.config.domain }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: local-ai
                port:
                  number: 80

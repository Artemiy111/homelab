apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: longhorn
  namespace: longhorn-system
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`longhorn.{{ .Values.config.domain }}`)
      kind: Rule
      middlewares:
        # У Longhorn UI нет собственной аутентификации вообще — без
        # oauth2-proxy она была бы открыта в интернет как есть.
        - name: oauth2-proxy
          namespace: traefik
        - name: secure-headers
          namespace: traefik
        # ratelimit-default намеренно НЕ подключён: UI — одна большая
        # JS-бандл-страница и упирается в лимит, как Kibana.
      services:
        # Сервис UI живёт в longhorn-system (allowCrossNamespace включён).
        - name: longhorn-frontend
          namespace: longhorn-system
          port: 80

apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: lute
  namespace: lute
spec:
  ingressClassName: traefik
  rules:
    - host: lute.{{ .Values.config.domain }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: lute
                port:
                  number: 80

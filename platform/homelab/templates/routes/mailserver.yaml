apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: mailserver
  namespace: mailserver
spec:
  entryPoints:
    - websecure
  routes:
    # У Stalwart своя аутентификация (админка/API) — forward auth не нужен.
    - match: Host(`mailserver.{{ .Values.config.domain }}`)
      kind: Rule
      services:
        - name: mailserver
          port: 8080
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: mail
  namespace: mailserver
spec:
  entryPoints:
    - websecure
  routes:
    # Webmail имеет собственную авторизацию (JMAP) — forward auth не нужен.
    - match: Host(`mail.{{ .Values.config.domain }}`)
      kind: Rule
      services:
        - name: mail
          port: 3000

apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: radar
  namespace: radar
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`radar.{{ .Values.config.domain }}`)
      kind: Rule
      # oauth2-proxy здесь намеренно нет (в отличие от grafana и netdata):
      # Radar входит в Zitadel сам (auth.mode=oidc) и сам решает, пускать ли
      # пользователя. Прокси поверх сломал бы back-channel logout — Zitadel
      # шлёт POST на /auth/backchannel-logout без cookie прокси и получил бы
      # 401, — и дал бы двойной вход.
      middlewares:
        - name: secure-headers
          namespace: traefik
        - name: ratelimit-default
          namespace: traefik
      services:
        - name: radar
          port: 80

apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: sure
  namespace: sure
spec:
  ingressClassName: traefik
  rules:
    - host: sure.{{ .Values.config.domain }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: sure
                port:
                  number: 80

apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: traefik-dashboard-slash
  namespace: traefik
spec:
  # api@internal отдаёт панель только по /dashboard/; без слеша — 404.
  redirectRegex:
    regex: ^(https?://[^/]+/dashboard)$
    replacement: ${1}/
    permanent: false
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: traefik-dashboard
  namespace: traefik
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`traefik.{{ .Values.config.domain }}`) && (PathPrefix(`/api`) || PathPrefix(`/dashboard`))
      kind: Rule
      middlewares:
        # До oauth2-proxy: браузер получает канонический URL со слешем, и
        # oauth2-proxy кладёт в rd уже его, а не /dashboard.
        - name: traefik-dashboard-slash
        # ratelimit-default намеренно не подключён: UI панели постоянно опрашивает
        # api@internal и упирается в лимит при обычном просмотре.
        - name: oauth2-proxy
        - name: secure-headers
      services:
        # api@internal — встроенный провайдер Traefik (панель и API), не Service.
        - name: api@internal
          kind: TraefikService

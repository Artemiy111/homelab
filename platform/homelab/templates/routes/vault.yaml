apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: vault
  namespace: vault
spec:
  ingressClassName: traefik
  rules:
    - host: vault.{{ .Values.config.domain }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
            service:
              name: vault
              # 8200, а не 80: ручной Service отдавал наружу 80, у Service из
              # чарта hashicorp/vault-helm порт 8200 (server.service.port).
              port:
                number: 8200

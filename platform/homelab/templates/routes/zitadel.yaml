apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: zitadel
  namespace: zitadel
spec:
  entryPoints:
    - websecure
  routes:
    # Корень хоста → login UI.
    - match: Host(`id.{{ .Values.config.domain }}`) && Path(`/`)
      kind: Rule
      priority: 400
      middlewares:
        - name: zitadel-root-rewrite
      services:
        - name: zitadel-login
          port: 80
    # Login UI (v2).
    - match: Host(`id.{{ .Values.config.domain }}`) && PathPrefix(`/ui/v2/login`)
      kind: Rule
      priority: 250
      services:
        - name: zitadel-login
          port: 80
    # API/gRPC-шлюз (strip /api, h2c до бэкенда).
    - match: Host(`id.{{ .Values.config.domain }}`) && PathPrefix(`/api`)
      kind: Rule
      priority: 200
      middlewares:
        - name: zitadel-strip-api
      services:
        - name: zitadel
          port: 80
          scheme: h2c
    # Всё остальное → консоль ZITADEL.
    - match: Host(`id.{{ .Values.config.domain }}`) && !PathPrefix(`/ui/v2/login`) && !PathPrefix(`/api`) && !Path(`/`)
      kind: Rule
      priority: 100
      services:
        - name: zitadel
          port: 80
          scheme: h2c

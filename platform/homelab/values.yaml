config:
  domain: example.com
  serverIp: 192.0.2.10
  timezone: Asia/Yekaterinburg
  locale: ru

# cert-manager: выпуск wildcard-сертификата через ACME DNS-01.
#
# acmeEmail и tsigKeyName — environment-specific и относятся к «внутреннему»
# уровню (docs/agents/information-handling.md): в git лежат плейсхолдеры,
# реальные значения — в untracked values.private.yaml.
# nameserver — авторитативный сервер DNS-зоны; сам хост нейтрален.
certManager:
  enabled: true
  acmeEmail: acme@example.com
  nameserver: ns1.example.com:53
  tsigKeyName: tsig-000000.example.com
  tsigSecretName: acme-rfc2136-tsig
  tsigAlgorithm: HMACSHA512

namespaces:
  - 3x-ui
  - authentik
  - beszel
  - dawarich
  - default
  - element
  - forgejo
  - gitlab
  - glitchtip
  - home
  - home-assistant
  - immich
  - infisical
  - jellyfin
  - jitsi
  - local-ai
  - mailserver
  - monitoring
  - navidrome
  - nextcloud
  - oauth2-proxy
  - open-webui
  - paperless
  - pdf
  - rustfs
  - seafile
  - structurizr
  - sure
  - talk-hpb
  - technitium
  - uptime-kuma

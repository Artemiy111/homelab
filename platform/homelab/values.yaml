config:
  domain: example.com
  serverIp: 192.0.2.10
  timezone: Asia/Yekaterinburg
  locale: ru

# cert-manager: выпуск wildcard-сертификата через ACME DNS-01.
#
# acmeEmail — environment-specific и относится к «внутреннему» уровню
# (docs/agents/information-handling.md): в git плейсхолдер, реальное значение —
# в untracked values.private.yaml.
#
# webhookGroupName — группа API собственного webhook'а-солвера
# (packages/cert-manager-webhook-dns01); должна совпадать с groupName в чарте
# webhook'а (argocd/applications/dns01-webhook.yaml).
certManager:
  enabled: true
  acmeEmail: acme@example.com
  webhookGroupName: acme.homelab.local
  # Внутренний CA для имён, которых нет в публичной зоне. Ключ CA не покидает
  # кластер, cert-manager выпускает им всё внутреннее.
  internalCA:
    enabled: true
    # Имя хоста реестра. В отличие от config.domain это НЕ environment-specific:
    # имя нечувствительное, поэтому живёт в git открытым текстом.
    registryHost: forgejo.homelab.internal

namespaces:
  - 3x-ui
  - authentik
  - beszel
  - dawarich
  - default
  - element
  - forgejo
  - gitlab
  - glitchtip
  - homepage
  - home-assistant
  - immich
  - infisical
  - jellyfin

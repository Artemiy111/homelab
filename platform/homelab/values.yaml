config:
  domain: biplane.v6.rocks
  serverIp: 192.168.1.254
  timezone: Asia/Yekaterinburg
  locale: ru

# cert-manager: выпуск wildcard-сертификата через ACME DNS-01.
#
# acmeEmail — почта для регистрации в ACME-эмитент. Значение окружения, а не
# секрет: по нему нельзя ни войти, ни получить доступ, и сам домен виден в
# Certificate Transparency вместе с wildcard-сертификатом (docs/adr/0009).
#
# webhookGroupName — группа API собственного webhook'а-солвера
# (packages/cert-manager-webhook-dns01); должна совпадать с groupName в чарте
# webhook'а (argocd/applications/dns01-webhook.yaml).
certManager:
  enabled: true
  acmeEmail: letsencript@mailplane.v6.rocks
  webhookGroupName: acme.homelab.local


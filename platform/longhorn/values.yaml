# Longhorn — CSI-хранилище: снапшоты, бэкапы в S3, RWX через share-manager, UI.
# Ставится официальным чартом из charts.longhorn.io.
#
# Default StorageClass в кластере остаётся local-path — классы Longhorn
# описываются явно в platform/longhorn/storageclasses.yaml и применяются
# осознанно per-PVC.
#
# Подготовка узла (iscsid, NFSv4-клиент, SELinux-модуль, каталог данных) —
# в infra/ansible/host.yml, роль longhorn_prereqs. Без неё тома застревают в
# attach/detach.

csi:
  # k0s держит kubelet в /var/lib/k0s/kubelet, а не в /var/lib/kubelet:
  # драйвер монтирует staging-каталоги оттуда.
  kubeletRootDir: /var/lib/k0s/kubelet
  # Одноузловой кластер: дефолтные 3 реплики контроллеров просто повиснут
  # в Pending. При второй ноде можно вернуть 3.
  attacherReplicaCount: 1
  provisionerReplicaCount: 1
  resizerReplicaCount: 1
  snapshotterReplicaCount: 1

persistence:
  # Классы хранилища задаём файлами (platform/longhorn/storageclasses.yaml),
  # а не чартом: у них разная политика удержания, и дефолтный класс не должен
  # появляться вместе с оператором.
  createStorageClass: false

defaultSettings:
  defaultDataPath: /storage/apps/k8s/longhorn
  # Данные лежат на корневой ФС: свободно ~16% (78 из 475 ГБ). При дефолтных
  # 25% Longhorn сразу пометит диск unschedulable, а при 30% reserved — не
  # даст разместить ни одной реплики. Оба значения читаются ТОЛЬКО при
  # создании диска, поэтому важны на установке.
  storageMinimalAvailablePercentage: 10
  storageReservedPercentageForDefaultDisk: 5
  # UI не должен стучаться в longhorn-upgrade-responder.
  upgradeChecker: false

# GitOps: pre-upgrade Job создаёт ресурсы мимо Argo, после чего приложение
# навсегда остаётся OutOfSync.
preUpgradeChecker:
  jobEnabled: false

longhornUI:
  # Одноузловой кластер: дефолтные 2 реплики UI одна всё равно Pending.
  # Чарт не умеет задавать resources для UI — только replicas.
  replicas: 1

longhornManager:
  # Дефолт чарта — resources: {}. Без limits на одноузловом кластере
  # разъехавшийся manager способен вытеснить приложения.
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: "1"
      memory: 512Mi
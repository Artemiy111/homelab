# Оператор MariaDB: классы, инстансы, пользователи, бэкапы. Нужен для seafile
# и uptime-kuma — их базы живут в кластерах баз MariaDB (platform/mariadb/),
# тогда как PostgreSQL-базы обслуживает CNPG.

# CRD ставим вместе с оператором: они кластерные, и Prune=false не даёт удалить
# их вместе с приложением (иначе снесло бы все MariaDB-объекты кластера).
crds:
  enabled: true

# Дефолт у чарта: resources: {} у всех трёх компонентов (operator, webhook,
# certController). Для одноузлового кластера это плохо: без requests
# планировщик не знает, что размещает, без limits разъехавшийся оператор
# способен вытеснить сами базы.
resources:
  requests:
    cpu: 50m
    memory: 128Mi
  limits:
    cpu: "1"
    memory: 512Mi

webhook:
  resources:
    requests:
      cpu: 10m
      memory: 64Mi
    limits:
      cpu: 100m
      memory: 128Mi

certController:
  resources:
    requests:
      cpu: 10m
      memory: 64Mi
    limits:
      cpu: 100m
      memory: 128Mi
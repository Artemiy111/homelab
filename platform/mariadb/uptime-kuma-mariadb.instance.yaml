# MariaDB Uptime Kuma под управлением mariadb-operator.
#
# Заменяет встроенную в Kuma MariaDB: сейчас UPTIME_KUMA_DB_TYPE не задан, и
# Kuma 2.x поднимает embedded-mariadb внутри пода с данными в
# /app/data/mariadb на томе uptime-kuma-data. Следствия такого устройства: БД
# нечем бэкапить средствами MariaDB, том удерживается целиком при обновлении
# образа, а потеря тома уносит мониторы и всю историю проверок.
#
# Имя базы — kuma, как у встроенного инстанса: дамп переносится без
# переименований, и в обеих базах видно одно и то же имя.
#
# replicas: 1. Кластер на Galera ради одной ноды ничего не покупает: реплики
# всё равно жили бы на том же узле, а потеря ноды убивает их все. Ценность
# перехода не в отказоустойчивости, а в выносе состояния из пода и в обычных
# средствах бэкапа. Масштабирование до 3 — одна строка: оператор сам поднимет
# новые поды и сделает SST сам. При 2 репликах нельзя: кворум Galera требует
# нечётного числа узлов, и выживший узел уходит в non-primary, то есть вместо
# простоя приложение получает ошибки записи.
#
# storage: 1Gi. Полезных данных сегодня 36 МБ на 28 таблиц, но каталог
# встроенного инстанда занимает 265 МБ: к данным добавляются redo-логи MariaDB и
# служебное табличное пространство InnoDB. 128 Mi не подошли бы уже на старте,
# 512 Mi — впритык к растущей истории heartbeat'ов.
#
# Версия. Встроенный инстанс — 10.11.14, но совпадение мажорных версий здесь не
# нужно: база внешняя и наполняется один раз дампом, то есть это обычный
# логический апгрейд, который MariaDB поддерживает. Взята 13.0.2 — актуальная
# ветка 13.x. Веток 13.1 и 13.2 у MariaDB не существует, 13.0.2 — последняя в
# 13.x. Digest закреплён на индекс образа, а не на манифест amd64: тянется
# манифест под архитектуру ноды, как в seafile-mariadb.instance.yaml.
#
# Имя Service равно имени CR, поэтому приложение ходит на `uptime-kuma-mariadb`.
#
# root-пароль — из Secret uptime-kuma-mariadb-root (путь kv/uptime-kuma/root,
# синхронизируется VSO). Поле spec.rootPasswordSecretKeyRef у CR неизменяемо,
# поэтому при смене имени Secret CR приходится пересоздавать; PVC на
# longhorn-retain при этом сохраняются.
apiVersion: k8s.mariadb.com/v1alpha1
kind: MariaDB
metadata:
  name: uptime-kuma-mariadb
  namespace: uptime-kuma
spec:
  replicas: 1
  image: "mariadb:13.0@sha256:d4fdec0510ad498e4f3127da30a99df3745bd6d5e611ae6ac5f76403d9284a8d"
  port: 3306
  rootPasswordSecretKeyRef:
    name: uptime-kuma-mariadb-root
    key: INIT_UPTIME_KUMA_MARIADB_ROOT_PASSWORD
  storage:
    size: 1Gi
    storageClassName: longhorn-retain
  resources:
    requests:
      cpu: 50m
      memory: 256Mi
    limits:
      cpu: "1"
      memory: 1Gi

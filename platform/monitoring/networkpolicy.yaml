# Базовый NetworkPolicy для namespace monitoring: default-deny ingress плюс
# явные разрешения. traefik — UI (grafana, vm, netdata, wud); gatus и
# uptime-kuma проверяют внутренние сервисы (victoriametrics, vmagent, netdata,
# grafana, wud) напрямую по k8s-именам; kube-state-metrics приходит из default;
# radar читает метрики ворклоадов из victoriametrics.
# Egress не ограничивается.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-ingress
  namespace: monitoring
spec:
  podSelector: {}
  policyTypes:
    - Ingress
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-ingress
  namespace: monitoring
spec:
  podSelector: {}
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector: {}
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: traefik
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: uptime-kuma
    - from:
        - podSelector:
            matchLabels:
              app: kube-state-metrics
          namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: default
      ports:
        - protocol: TCP
          port: 8080
    # Radar (traffic.prometheusUrl) читает метрики ворклоадов из VictoriaMetrics.
    - from:
        - podSelector:
            matchLabels:
              app: victoriametrics
          namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: radar
      ports:
        - protocol: TCP
          port: 8428

apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: structurizr
  namespace: structurizr
spec:
  entryPoints:
    - websecure
  routes:
    # У open-core сборки нет своей аутентификации — закрываем forward auth.
    - match: Host(`structurizr.example.com`)
      kind: Rule
      middlewares:
        # Middleware'ы остаются в default: ссылаемся cross-namespace явным namespace.
        - name: oauth2-proxy
          namespace: default
        - name: secure-headers
          namespace: default
        - name: ratelimit-default
          namespace: default
      services:
        - name: structurizr
          port: 80

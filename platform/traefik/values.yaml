# Traefik в k8s — единый ingress: слушает 80/443 на IP узла (192.0.2.10)
# через kube-proxy externalIPs. Схема чарта traefik-41.4.0 (strict JSON schema).

providers:
  kubernetesCRD:
    # Middlewares живут в default, а IngressRoute — в namespace приложения.
    allowCrossNamespace: true

service:
  spec:
    # ClusterIP + externalIPs .254: единый адрес ingress для всех DNS-записей.
    # MetalLB убран (на одном узле не нужен — kube-proxy externalIPs достаточно).
    type: ClusterIP
    externalIPs:
      - 192.0.2.10

ports:
  web:
    port: 8000
    expose:
      default: true
    protocol: TCP
  websecure:
    port: 8443
    # TLS включён на самом entrypoint (chart-дефолт, но фиксируем явно, чтобы не
    # зависеть молча). Маршруты не указывают `tls`: сертификат берётся из
    # TLSStore default, единственная копия секрета — в namespace traefik.
    http:
      tls:
        enabled: true
    expose:
      default: true
    protocol: TCP

# Prometheus-метрики Traefik. Чарт и так включает entrypoint metrics (:9100) и
# --metrics.prometheus; отдельный Service (traefik-metrics) публикует порт для
# скрейпа из кластера (vmagent). Метрики наружу не выходят.
metrics:
  prometheus:
    service:
      enabled: true

# Нативный health-endpoint entrypoint'а. Нужен, чтобы мониторинг проверял
# живость Traefik без авторизации: панель /dashboard закрыта oauth2-proxy и
# отдаёт 302 на логин, а каждый такой запрос создаёт auth request в Zitadel
# (монитор раз в минуту — это ~1440 событий в eventstore в сутки).
additionalArguments:
  - --ping

ingressRoute:
  healthcheck:
    # Публичный маршрут /ping на ping@internal. Чарт по умолчанию использует
    # entrypoint traefik (внутренний, не опубликован), поэтому явно указываем
    # websecure — тот же, что слушает 443 и остальные маршруты.
    enabled: true
    entryPoints:
      - websecure
    # TLS берётся из TLSStore default, как и у остальных маршрутов.
    tls: {}

ingressClass:
  enabled: true
  isDefaultClass: true
  name: traefik

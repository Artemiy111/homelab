# Vault Secrets Operator — доставляет секреты из Vault в кластер. Через него
# приходят все 86 `VaultStaticSecret`; каталог `chart` в репозитории проекта.

# VaultConnection/default в неймспейсе оператора. С ним VaultAuth обходится без
# vaultConnectionRef, и отпадает необходимость ссылаться на объект из чужого
# неймспейса префиксом вида `vault/vault` (без него VSO ищет VaultConnection в
# своём неймспейсе и не находит).
#
# caCertSecret не задан: listener Vault работает на tls_disable, TLS терминирует
# Traefik, внутри кластера CA Vault не нужен.
defaultVaultConnection:
  enabled: true
  address: "http://vault.vault.svc.cluster.local:8200"

# Дефолт чарта — пустой resources; для одноузлового кластера это плохо (ср.
# platform/cert-manager/values.yaml). Контроллер держит 86 VaultStaticSecret:
# его вытеснение означает, что секреты перестанут обновляться.
controller:
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 500m
      memory: 256Mi
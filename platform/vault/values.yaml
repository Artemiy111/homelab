# Vault — хранилище всех секретов кластера. Официальный чарт
# hashicorp/vault-helm, версия зафиксирована тегом v0.34.1 (Vault 2.0.4).
#
# Значения вынесены из `spec.source.helm.valuesObject` в
# `platform/vault/values.yaml`, Application подключает их через `$values` —
# второй источник в `spec.sources`.

# sidecar-инжект не используется — его роль взял VSO. csi в связке с VSO
# вообще Enterprise-only, поэтому тоже выключен.
injector:
  enabled: false
csi:
  enabled: false

server:
  # RWO-том на одной ноде: RollingUpdate StatefulSet поднял бы второй под на
  # тот же том. Recreate у StatefulSet недопустим (только OnDelete и
  # RollingUpdate), поэтому OnDelete — дефолт, и он тут единственно корректный.
  updateStrategyType: OnDelete
  # Дефолт чарта — пустой resources: для одноузлового кластера это плохо, без
  # requests планировщик не знает, что размещает (ср.
  # platform/cert-manager/values.yaml).
  resources:
    requests:
      cpu: 50m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 1Gi
  dataStorage:
    # StorageClass: дефолт чарта — класс кластера по умолчанию, а на k0s это
    # local-path (node-local, нереплицируемый), а хранилище Vault нельзя терять
    # с нодой. Поэтому longhorn-retain, как в PVC ручного деплоя.
    # Longhorn тонко выделяет размер, указанное значение — только потолок.
    #
    # 128Mi — с запасом над фактическими ~9 МБ raft-данных. Менять уменьшением
    # нельзя: PVC в Kubernetes не сжимается на месте, поэтому при смене размера
    # том удаляется и пересоздаётся, а Vault после этого требует нового
    # operator init (unseal-ключи меняются).
    size: 128Mi
    storageClass: longhorn-retain
    accessMode: ReadWriteOnce
  # Явно перестраховываемся от пересоздания PVC вместе со StatefulSet.
  persistentVolumeClaimRetentionPolicy:
    whenDeleted: Retain
    whenScaled: Retain
  # Дефолт чарта — storage "file". Раньше был raft; для возможности добавить
  # ноды и для консистентности с прежним хранилищем оставляем raft. node_id
  # обязан совпадать с именем пода vault-0.
  #
  # telemetry внутри listener снимает требование токена на /v1/sys/metrics —
  # иначе vmagent получает 401 (job «vault» в scrape.yml). В дефолте чарта этот
  # блок закомментирован.
  standalone:
    config: |-
      ui = true

      disable_mlock = true

      storage "raft" {
        path = "/vault/data"
        node_id = "vault-0"
      }

      listener "tcp" {
        tls_disable = 1
        address = "[::]:8200"
        cluster_address = "[::]:8201"
        telemetry {
          unauthenticated_metrics_access = "true"
        }
      }

      api_addr = "http://vault:8200"
      cluster_addr = "http://vault:8201"

      telemetry {
        prometheus_retention_time = "30s"
        disable_hostname          = true
      }
  # Дефолт чарта ограничивается allowPrivilegeEscalation: false и не роняет
  # capabilities. Vault 2.0.2+ не умеет mlock() в контейнере (сборка capability
  # cap_ipc_lock удалена), поэтому drop ALL безопасен и сохраняет hardening
  # ручного деплоя.
  statefulSet:
    securityContext:
      container:
        allowPrivilegeEscalation: false
        capabilities:
          drop:
            - ALL
        seccompProfile:
          type: RuntimeDefault
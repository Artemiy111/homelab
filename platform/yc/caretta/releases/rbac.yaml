apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: caretta-victoria-metrics-single
  namespace: caretta
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: caretta-victoria-metrics-single
  namespace: caretta
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: caretta-victoria-metrics-single
subjects:
  - kind: ServiceAccount
    name: caretta-victoria-metrics-single
    namespace: caretta

name: pocket-id

services:
  pocket-id:
    image: ghcr.io/pocket-id/pocket-id:v2.12.0-distroless@sha256:b2fad8a82fab26fe4c11797dd13ea55aa6c7d6ea93fe829a139f2e28be2d339d
    container_name: pocket-id
    environment:
      APP_URL: https://${POCKET_ID_HOST:?set POCKET_ID_HOST in pocket-id/.env}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:?set ENCRYPTION_KEY in pocket-id/.env}
      TRUST_PROXY: ${TRAEFIK_NETWORK_CIDR:?set TRAEFIK_NETWORK_CIDR in pocket-id/.env}
      ALLOW_INSECURE_CALLBACK_URLS: "false"
      ANALYTICS_DISABLED: "true"
      PUID: ${PUID:-1000}
      PGID: ${PGID:-1000}
    user: "${PUID:-1000}:${PGID:-1000}"
    read_only: true
    volumes:
      - /storage/apps/pocket-id/data:/app/data:Z
    networks:
      - traefiknet
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "/app/pocket-id", "healthcheck"]
      interval: 90s
      timeout: 5s
      retries: 3
      start_period: 10s
    labels:
      - traefik.enable=true
      - traefik.http.routers.pocket-id.rule=Host(`${POCKET_ID_HOST}`)
      - traefik.http.routers.pocket-id.entrypoints=websecure
      - traefik.http.services.pocket-id.loadbalancer.server.port=1411
      - traefik.http.middlewares.pocket-id-security.headers.stsSeconds=15552000
      - traefik.http.middlewares.pocket-id-security.headers.stsIncludeSubdomains=true
      - traefik.http.middlewares.pocket-id-security.headers.contentTypeNosniff=true
      - traefik.http.middlewares.pocket-id-security.headers.referrerPolicy=no-referrer
      - traefik.http.routers.pocket-id.middlewares=pocket-id-security
      - traefik.docker.network=traefiknet

networks:
  traefiknet:
    external: true

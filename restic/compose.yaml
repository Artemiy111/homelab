x-restic: &restic
  image: restic/restic:0.19.1
  hostname: homelab
  environment:
    RESTIC_PASSWORD: ${RESTIC_PASSWORD}
    RESTIC_REPOSITORY: /repository
    RESTIC_CACHE_DIR: /cache
    RESTIC_HOST: homelab
    NICE: "19"
    IONICE_CLASS: "2"
  volumes:
    - ${BACKUP_SOURCE:-/storage/apps}:/data:ro
    - ${CONFIG_SOURCE:-/home/artlab/projects/homelab}:/config:ro
    - ${RESTIC_REPOSITORY_PATH:-/storage/backups/restic}:/repository
    - /storage/apps/restic/cache:/cache
    - /storage/apps/restic/restore:/restore
    - ./excludes.txt:/etc/restic/excludes.txt:ro
  security_opt:
    - label=disable
  profiles:
    - manual

services:
  init:
    <<: *restic
    command: init

  backup:
    <<: *restic
    command:
      - backup
      - /data
      - /config
      - --exclude-file=/etc/restic/excludes.txt
      - --tag=homelab

  snapshots:
    <<: *restic
    command: snapshots

  forget:
    <<: *restic
    command:
      - forget
      - --keep-daily=7
      - --keep-weekly=4
      - --keep-monthly=6
      - --prune

  check:
    <<: *restic
    command: check

  restore:
    <<: *restic
    command:
      - restore
      - latest
      - --target=/restore

name: seafile

services:
  db:
    image: mariadb:10.11
    container_name: seafile-db

    volumes:
      - ${APPS_STORAGE_PATH:-/storage/apps}/seafile/mysql:/var/lib/mysql:Z

    environment:
      MARIADB_ROOT_PASSWORD: ${INIT_SEAFILE_MYSQL_ROOT_PASSWORD:?set INIT_SEAFILE_MYSQL_ROOT_PASSWORD in seafile/.env}
      MARIADB_AUTO_UPGRADE: "1"
      MARIADB_INITDB_SKIP_TZINFO: "1"

    networks:
      - backend
    restart: unless-stopped

    healthcheck:
      test: ["CMD-SHELL", "mariadb-admin ping -h 127.0.0.1 -u root -p\"$${MARIADB_ROOT_PASSWORD}\" --silent"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 30s

    security_opt:
      - no-new-privileges:true

  redis:
    image: redis:8-alpine
    container_name: seafile-redis

    networks:
      - backend
    command: redis-server --save "" --appendonly no
    restart: unless-stopped

    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

    security_opt:
      - no-new-privileges:true

  seafile:
    image: seafileltd/seafile-mc:${SEAFILE_VERSION:-13.0.25}
    container_name: seafile

    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

    volumes:
      - ${APPS_STORAGE_PATH:-/storage/apps}/seafile/shared:/shared:Z

    env_file:
      - .env

    networks:
      backend:
      traefiknet:
        aliases:
          - seafile
    restart: unless-stopped

    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1/api2/ping/ | grep -q pong"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 5m

    labels:
      - traefik.enable=true
      - traefik.http.routers.seafile.rule=Host(`${SEAFILE_HOST:?set SEAFILE_HOST in seafile/.env}`)
      - traefik.http.routers.seafile.entrypoints=websecure
      - traefik.http.services.seafile.loadbalancer.server.port=80
      - traefik.docker.network=traefiknet

    init: true

    security_opt:
      - no-new-privileges:true

  onlyoffice:
    image: onlyoffice/documentserver:${ONLYOFFICE_VERSION:-9.3.0}
    container_name: seafile-onlyoffice

    volumes:
      - ${APPS_STORAGE_PATH:-/storage/apps}/seafile/onlyoffice/logs:/var/log/onlyoffice:Z
      - ${APPS_STORAGE_PATH:-/storage/apps}/seafile/onlyoffice/data:/var/www/onlyoffice/Data:Z
      - ${APPS_STORAGE_PATH:-/storage/apps}/seafile/onlyoffice/lib:/var/lib/onlyoffice:Z

    environment:
      JWT_ENABLED: "true"
      JWT_SECRET: ${ONLYOFFICE_JWT_SECRET:?set ONLYOFFICE_JWT_SECRET in seafile/.env}
      JWT_HEADER: ${ONLYOFFICE_JWT_HEADER:-Authorization}
      JWT_IN_BODY: "true"
      # Seafile resolves to the homelab's private LAN address.
      ALLOW_PRIVATE_IP_ADDRESS: "true"

    networks:
      backend:
      traefiknet:
        aliases:
          - onlyoffice
    restart: unless-stopped

    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1/healthcheck | grep -q true"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 3m

    labels:
      - traefik.enable=true
      - traefik.http.routers.onlyoffice.rule=Host(`${ONLYOFFICE_HOST:?set ONLYOFFICE_HOST in seafile/.env}`)
      - traefik.http.routers.onlyoffice.entrypoints=websecure
      - traefik.http.services.onlyoffice.loadbalancer.server.port=80
      - traefik.docker.network=traefiknet

    init: true

    security_opt:
      - no-new-privileges:true

  backup-db:
    image: mariadb:10.11
    container_name: seafile-backup-db

    depends_on:
      db:
        condition: service_healthy

    volumes:
      - ${APPS_STORAGE_PATH:-/storage/apps}/seafile/backups:/backups:Z

    environment:
      MYSQL_PWD: ${INIT_SEAFILE_MYSQL_ROOT_PASSWORD:?set INIT_SEAFILE_MYSQL_ROOT_PASSWORD in seafile/.env}

    networks:
      - backend

    command:
      - >-
        umask 077; mariadb-dump --host=db --user=root
        --all-databases --single-transaction --routines --events
        > /backups/seafile.sql.tmp && mv /backups/seafile.sql.tmp /backups/seafile.sql

    entrypoint:
      - /bin/sh
      - -ec
    restart: "no"

    profiles:
      - tools

networks:
  backend:
    internal: true
  traefiknet:
    external: true

services:
  structurizr:
    build:
      context: .
    container_name: structurizr

    volumes:
      - /storage/apps/structurizr:/usr/local/structurizr:Z,rw
      - ./structurizr.properties:/usr/local/structurizr/structurizr.properties:Z,ro

    networks:
      - traefiknet

    restart: unless-stopped

    labels:
      - traefik.enable=true
      - traefik.http.routers.structurizr.rule=Host(`${STRUCTURIZR_HOST:?set STRUCTURIZR_HOST in structurizr/.env}`)
      - traefik.http.routers.structurizr.entrypoints=websecure
      - traefik.http.routers.structurizr.middlewares=oauth2-proxy@file,secure-headers@file,ratelimit-default@file
      - traefik.http.services.structurizr.loadbalancer.server.port=8080
      - traefik.docker.network=traefiknet

    user: "1000:1000"

networks:
  traefiknet:
    external: true

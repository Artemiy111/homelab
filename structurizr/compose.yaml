services:
  structurizr:
    image: structurizr/onpremises
    container_name: structurizr
    ports:
      - "40010:8080"
    volumes:
      - /storage/apps/structurizr:/usr/local/structurizr:Z,rw
    restart: always
    networks:
      traefiknet:
    labels:
      - traefik.enable=true
      - traefik.http.routers.structurizr.rule=Host(`structurizr.artistick.tech`)
      - traefik.http.routers.structurizr.entrypoints=websecure
      - traefik.http.routers.structurizr.tls=true
      - traefik.http.routers.structurizr.tls.certresolver=letsencrypt

networks:
  traefiknet:
    external: true

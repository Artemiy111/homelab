services:
  structurizr:
    image: structurizr/onpremises
    container_name: structurizr
    volumes:
      - /storage/apps/structurizr:/usr/local/structurizr:Z,rw
    restart: unless-stopped
    networks:
      - traefiknet
    labels:
      - traefik.enable=true
      - traefik.http.routers.structurizr.rule=Host(`structurizr.example.net`)
      - traefik.http.routers.structurizr.entrypoints=websecure
      - traefik.http.routers.structurizr.middlewares=secure-headers@file,ratelimit-default@file
      - traefik.http.services.structurizr.loadbalancer.server.port=8080
      - traefik.docker.network=traefiknet

networks:
  traefiknet:
    external: true

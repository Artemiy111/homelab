name: talk-hpb

services:
  talk:
    image: ghcr.io/nextcloud-releases/aio-talk:${TALK_IMAGE_VERSION:?set TALK_IMAGE_VERSION in talk-hpb/.env}
    container_name: talk-hpb
    read_only: true
    init: true

    # /start.sh генерирует /conf/eturnal.yml с relay_ipv4_addr = IP контейнера
    # (недостижим из LAN), поэтому патчим его на LAN-IP сервера, сужаем диапазон
    # relay-портов (чтобы публиковать только его) и добавляем LAN-подсеть
    # в whitelist_peers.
    # Также патчим /conf/janus.jcfg: заменяем turn_server на 127.0.0.1, чтобы
    # Janus обращался к eturnal напрямую (localhost), а не через внешний домен
    # (hairpin NAT → задержки и потеря пакетов).
    # ВАЖНО: command — список, а не строка: docker разбирает строку через
    # shellwords и превращает \n в перевод строки, от чего busybox sed падает
    # с "unmatched '|'". В списке \n доходит до sed как есть.
    command:
      - /bin/sh
      - -c
      - >-
        sed -i -e 's|^  relay_ipv4_addr: "[0-9.]*"|  relay_ipv4_addr: "${SERVER_IP}"\n  relay_min_port: ${TALK_RELAY_MIN_PORT:-20000}\n  relay_max_port: ${TALK_RELAY_MAX_PORT:-20499}|'
        -e 's|^  whitelist_peers:|  whitelist_peers:\n  - "${TALK_RELAY_NETWORK:-192.0.2.10/24}"|' /conf/eturnal.yml
        && sed -i 's|turn_server = "[^"]*"|turn_server = "127.0.0.1"|' /conf/janus.jcfg
        && exec supervisord -c /supervisord.conf

    tmpfs:
      - /conf
      - /opt/eturnal/run
      - /var/log/supervisord
      - /var/run/supervisord
      - /tmp

    ports:
      - "${SERVER_IP:?set SERVER_IP in talk-hpb/.env}:${TALK_PORT:-3478}:${TALK_PORT:-3478}/tcp"
      - "${SERVER_IP:?set SERVER_IP in talk-hpb/.env}:${TALK_PORT:-3478}:${TALK_PORT:-3478}/udp"
      # TURN relay-порты eturnal: диапазон должен совпадать с TALK_RELAY_MIN/MAX_PORT
      # из command выше — на каждый медиа-аллокацию тратится один порт.
      - "${SERVER_IP:?set SERVER_IP in talk-hpb/.env}:${TALK_RELAY_MIN_PORT:-20000}-${TALK_RELAY_MAX_PORT:-20499}:${TALK_RELAY_MIN_PORT:-20000}-${TALK_RELAY_MAX_PORT:-20499}/udp"
      - "${SERVER_IP:?set SERVER_IP in talk-hpb/.env}:${TALK_RELAY_MIN_PORT:-20000}-${TALK_RELAY_MAX_PORT:-20499}:${TALK_RELAY_MIN_PORT:-20000}-${TALK_RELAY_MAX_PORT:-20499}/tcp"

    environment:
      AIO_LOG_LEVEL: warn
      INTERNAL_SECRET: ${INTERNAL_SECRET:?set INTERNAL_SECRET in talk-hpb/.env}
      NC_DOMAIN: ${NC_DOMAIN:?set NC_DOMAIN in talk-hpb/.env}
      SIGNALING_SECRET: ${SIGNALING_SECRET:?set SIGNALING_SECRET in talk-hpb/.env}
      TALK_HOST: ${TALK_HOST:?set TALK_HOST in talk-hpb/.env}
      TALK_MAX_STREAM_BITRATE: ${TALK_MAX_STREAM_BITRATE:-4194304}
      TALK_MAX_SCREEN_BITRATE: ${TALK_MAX_SCREEN_BITRATE:-8388608}
      TALK_PORT: ${TALK_PORT:-3478}
      TURN_DOMAIN: ${TURN_DOMAIN:?set TURN_DOMAIN in talk-hpb/.env}
      TURN_SECRET: ${TURN_SECRET:?set TURN_SECRET in talk-hpb/.env}
      TZ: ${TZ:?set TZ in talk-hpb/.env}

    networks:
      - traefiknet
    restart: unless-stopped

    labels:
      - traefik.enable=true
      - traefik.http.routers.talk-signaling.rule=Host(`${TALK_HOST}`) && PathPrefix(`/standalone-signaling`)
      - traefik.http.routers.talk-signaling.entrypoints=websecure
      - traefik.http.routers.talk-signaling.middlewares=talk-signaling-strip
      - traefik.http.services.talk-signaling.loadbalancer.server.port=8081
      - traefik.http.middlewares.talk-signaling-strip.stripprefix.prefixes=/standalone-signaling
      - traefik.docker.network=traefiknet

networks:
  traefiknet:
    external: true
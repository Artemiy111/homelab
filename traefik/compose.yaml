services:
  traefik:
    image: traefik:v3.6
    container_name: traefik
    ports:
      - "80:80"
      - "443:443"
      - "40080:8080"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./traefik.yaml:/etc/traefik/traefik.yaml:ro
      - /storage/apps/traefik/letsencrypt:/letsencrypt:rw
    networks:
      - traefiknet
    restart: unless-stopped

networks:
  traefiknet:
    external: true


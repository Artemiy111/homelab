services:
  traefik:
    image: traefik:v3.7
    container_name: traefik
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /storage/apps/traefik/letsencrypt:/letsencrypt:Z
      - ./traefik.yaml:/etc/traefik/traefik.yaml:Z,ro
      - ./dynamic:/etc/traefik/dynamic:ro
    environment:
      RFC2136_NAMESERVER: ${RFC2136_NAMESERVER:?set RFC2136_NAMESERVER in traefik/.env}
      RFC2136_TSIG_ALGORITHM: ${RFC2136_TSIG_ALGORITHM:?set RFC2136_TSIG_ALGORITHM in traefik/.env}
      RFC2136_TSIG_KEY: ${RFC2136_TSIG_KEY:?set RFC2136_TSIG_KEY in traefik/.env}
      RFC2136_TSIG_SECRET: ${RFC2136_TSIG_SECRET:?set RFC2136_TSIG_SECRET in traefik/.env}
    ports:
      - "192.0.2.10:80:80"
      - "192.0.2.10:443:443"
    networks:
      - traefiknet
    extra_hosts:
      - host.docker.internal:host-gateway
    restart: unless-stopped
    healthcheck:
      test: [ "CMD", "traefik", "healthcheck", "--ping" ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    labels:
      - traefik.enable=true
      - traefik.http.routers.traefik.rule=Host(`${TRAEFIK_HOST}`)
      - traefik.http.routers.traefik.entrypoints=websecure
      - traefik.http.routers.traefik.service=api@internal
      - traefik.http.routers.traefik.middlewares=traefik-auth
      - traefik.http.middlewares.traefik-auth.basicauth.users=${TRAEFIK_DASHBOARD_USERS}
    security_opt:
      - no-new-privileges:true

networks:
  traefiknet:
    external: true

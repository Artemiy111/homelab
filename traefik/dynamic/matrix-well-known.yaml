http:
  routers:
    matrix-client-well-known:
      rule: Host(`{{ env "DOMAIN" }}`) && Path(`/.well-known/matrix/client`)
      entryPoints:
        - websecure
      service: matrix-client-well-known
    matrix-server-well-known:
      rule: Host(`{{ env "DOMAIN" }}`) && Path(`/.well-known/matrix/server`)
      entryPoints:
        - websecure
      service: matrix-client-well-known
    matrix-federation:
      rule: Host(`{{ env "DOMAIN" }}`) && PathPrefix(`/_matrix/federation`)
      entryPoints:
        - websecure
      service: matrix-client-well-known

  services:
    matrix-client-well-known:
      loadBalancer:
        servers:
          - url: http://synapse:8080

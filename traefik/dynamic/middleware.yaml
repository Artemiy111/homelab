http:
  middlewares:
    ratelimit-default:
      rateLimit:
        average: 100
        burst: 50

    # Для SPA (Open WebUI): первая загрузка вываливает сотню статических
    # чанков одним махом и упирается в ratelimit-default, из-за чего
    # приложение падает уже на клиенте.
    ratelimit-spa:
      rateLimit:
        average: 400
        burst: 200

    oauth2-proxy:
      forwardAuth:
        address: http://oauth2-proxy:4180
        trustForwardHeader: true
        authResponseHeaders:
          - X-Auth-Request-User
          - X-Auth-Request-Email

    secure-headers:
      headers:
        stsSeconds: 31536000
        stsIncludeSubdomains: true
        stsPreload: false
        frameDeny: true
        contentTypeNosniff: true
    
    secure-headers-strict:
      headers:
        stsSeconds: 31536000
        stsIncludeSubdomains: true
        stsPreload: true
        frameDeny: true
        contentTypeNosniff: true
        referrerPolicy: "strict-origin-when-cross-origin"
        contentSecurityPolicy: >-
          default-src 'self';
          script-src 'self';
          style-src 'self' 'unsafe-inline';
          img-src 'self' data: https:;
          font-src 'self' data:;
          connect-src 'self';
          frame-ancestors 'none';
          object-src 'none';
          base-uri 'self'
services:
  uptime-kuma:
    image: louislam/uptime-kuma:2
    container_name: uptime-kuma
    volumes:
      - /storage/apps/uptime-kuma/data:/app/data:Z

    networks:
      - traefiknet
    restart: unless-stopped

    healthcheck:
      test:
        - CMD
        - node
        - -e
        - >-
          fetch('http://127.0.0.1:3001/').then((response) => {
            if (!response.ok) process.exit(1)
          }).catch(() => process.exit(1))
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

    labels:
      - traefik.enable=true
      - traefik.http.routers.uptime-kuma.rule=Host(`${UPTIME_KUMA_HOST}`)
      - traefik.http.routers.uptime-kuma.entrypoints=websecure
      - traefik.http.services.uptime-kuma.loadbalancer.server.port=3001
      - traefik.docker.network=traefiknet

  configure:
    image: louislam/uptime-kuma:2

    depends_on:
      uptime-kuma:
        condition: service_healthy

    volumes:
      - ./monitors.json:/app/monitors.json:Z,ro
      - ./sync-monitors.mjs:/app/sync-monitors.mjs:Z,ro

    environment:
      DOMAIN: ${DOMAIN:?set DOMAIN in uptime-kuma/.env}
      SERVER_IP: ${SERVER_IP:?set SERVER_IP in uptime-kuma/.env}
      UPTIME_KUMA_URL: http://uptime-kuma:3001
      UPTIME_KUMA_USERNAME: ${UPTIME_KUMA_USERNAME:-}
      UPTIME_KUMA_PASSWORD: ${UPTIME_KUMA_PASSWORD:-}
      UPTIME_KUMA_MONITORS_FILE: /app/monitors.json

    networks:
      - traefiknet

    entrypoint:
      - node
      - /app/sync-monitors.mjs
    restart: "no"

    profiles:
      - tools

networks:
  traefiknet:
    external: true

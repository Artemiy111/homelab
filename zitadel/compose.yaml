name: zitadel

services:
  postgres:
    image: postgres:18-alpine
    container_name: zitadel-postgres

    volumes:
      - ${APPS_STORAGE_PATH:-/storage/apps}/zitadel/postgresql:/var/lib/postgresql:Z
      - ./initdb:/docker-entrypoint-initdb.d:ro

    environment:
      POSTGRES_DB: ${POSTGRES_DB:-zitadel}
      POSTGRES_USER: ${POSTGRES_ADMIN_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_ADMIN_PASSWORD:?set in zitadel/.env}
      POSTGRES_ZITADEL_PASSWORD: ${POSTGRES_ZITADEL_PASSWORD:?set in zitadel/.env}

    networks:
      - backend
    restart: unless-stopped

    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -d $${POSTGRES_DB} -U $${POSTGRES_USER}" ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    mem_limit: 256m

    security_opt:
      - no-new-privileges:true

  zitadel:
    image: ghcr.io/zitadel/zitadel:${ZITADEL_VERSION:-v4.17.1}
    container_name: zitadel
    user: "0"

    depends_on:
      postgres:
        condition: service_healthy

    command:
      - start-from-init
      - --masterkeyFile
      - /zitadel/masterkey

    environment:
      ZITADEL_PORT: 8080
      ZITADEL_EXTERNALDOMAIN: ${ZITADEL_HOST:?set in zitadel/.env}
      ZITADEL_EXTERNALPORT: "443"
      ZITADEL_EXTERNALSECURE: "true"
      ZITADEL_TLS_ENABLED: "false"
      ZITADEL_DATABASE_POSTGRES_DSN: postgres://${POSTGRES_ZITADEL_USER:-zitadel}:${POSTGRES_ZITADEL_PASSWORD:?set in zitadel/.env}@postgres:5432/${POSTGRES_DB:-zitadel}?sslmode=disable
      ZITADEL_FIRSTINSTANCE_ORG_HUMAN_USERNAME: ${ADMIN_USERNAME:?set in zitadel/.env}
      ZITADEL_FIRSTINSTANCE_ORG_HUMAN_PASSWORD: ${ADMIN_PASSWORD:?set in zitadel/.env}
      ZITADEL_FIRSTINSTANCE_ORG_HUMAN_PASSWORDCHANGEREQUIRED: "false"
      ZITADEL_FIRSTINSTANCE_LOGINCLIENTPATPATH: /zitadel/bootstrap/login-client.pat
      ZITADEL_FIRSTINSTANCE_ORG_LOGINCLIENT_MACHINE_USERNAME: login-client
      ZITADEL_FIRSTINSTANCE_ORG_LOGINCLIENT_MACHINE_NAME: Automatically Initialized IAM_LOGIN_CLIENT
      ZITADEL_FIRSTINSTANCE_ORG_LOGINCLIENT_PAT_EXPIRATIONDATE: "2099-01-01T00:00:00Z"
      ZITADEL_DEFAULTINSTANCE_FEATURES_LOGINV2_REQUIRED: "true"
      ZITADEL_DEFAULTINSTANCE_FEATURES_LOGINV2_BASEURI: https://${ZITADEL_HOST:?set in zitadel/.env}/ui/v2/login/
      ZITADEL_OIDC_DEFAULTLOGINURLV2: https://${ZITADEL_HOST:?set in zitadel/.env}/ui/v2/login/login?authRequest=
      ZITADEL_OIDC_DEFAULTLOGOUTURLV2: https://${ZITADEL_HOST:?set in zitadel/.env}/ui/v2/login/logout?post_logout_redirect=
      ZITADEL_SAML_DEFAULTLOGINURLV2: https://${ZITADEL_HOST:?set in zitadel/.env}/ui/v2/login/login?samlRequest=

    volumes:
      - ${APPS_STORAGE_PATH:-/storage/apps}/zitadel/bootstrap:/zitadel/bootstrap:rw
      - ${APPS_STORAGE_PATH:-/storage/apps}/zitadel/masterkey:/zitadel/masterkey:ro

    networks:
      - backend
      - traefiknet
    restart: unless-stopped

    healthcheck:
      test: [ "CMD", "/app/zitadel", "ready" ]
      interval: 10s
      timeout: 30s
      retries: 12
      start_period: 20s
    mem_limit: 512m

    security_opt:
      - no-new-privileges:true

    labels:
      - traefik.enable=true
      - traefik.docker.network=traefiknet
      - traefik.http.services.zitadel.loadbalancer.server.port=8080
      - traefik.http.services.zitadel.loadbalancer.server.scheme=h2c
      - traefik.http.middlewares.zitadel-strip-api.stripprefix.prefixes=/api
      - traefik.http.middlewares.zitadel-strip-api.stripprefix.forceSlash=false
      - traefik.http.routers.zitadel-api.rule=Host(`${ZITADEL_HOST}`) && PathPrefix(`/api`)
      - traefik.http.routers.zitadel-api.entrypoints=websecure
      - traefik.http.routers.zitadel-api.middlewares=zitadel-strip-api
      - traefik.http.routers.zitadel-api.service=zitadel
      - traefik.http.routers.zitadel-api.priority=200
      - traefik.http.routers.zitadel-console.rule=Host(`${ZITADEL_HOST}`) && !PathPrefix(`/ui/v2/login`) && !PathPrefix(`/api`) && !Path(`/`)
      - traefik.http.routers.zitadel-console.entrypoints=websecure
      - traefik.http.routers.zitadel-console.service=zitadel
      - traefik.http.routers.zitadel-console.priority=100

  login:
    image: ghcr.io/zitadel/zitadel-login:${ZITADEL_VERSION:-v4.17.1}
    container_name: zitadel-login
    user: "0"

    depends_on:
      zitadel:
        condition: service_healthy

    environment:
      ZITADEL_API_URL: http://zitadel:8080
      NEXT_PUBLIC_BASE_PATH: /ui/v2/login
      ZITADEL_SERVICE_USER_TOKEN_FILE: /zitadel/bootstrap/login-client.pat
      CUSTOM_REQUEST_HEADERS: Host:${ZITADEL_HOST:?set in zitadel/.env},X-Forwarded-Proto:https

    volumes:
      - ${APPS_STORAGE_PATH:-/storage/apps}/zitadel/bootstrap:/zitadel/bootstrap:ro

    networks:
      - backend
      - traefiknet
    restart: unless-stopped

    healthcheck:
      test: [ "CMD", "/bin/sh", "-c", "node /app/healthcheck.mjs http://localhost:3000/ui/v2/login/healthy" ]
      interval: 10s
      timeout: 30s
      retries: 12
      start_period: 20s
    mem_limit: 256m

    security_opt:
      - no-new-privileges:true

    labels:
      - traefik.enable=true
      - traefik.docker.network=traefiknet
      - traefik.http.services.zitadel-login.loadbalancer.server.port=3000
      - traefik.http.middlewares.zitadel-root-rewrite.replacepath.path=/ui/v2/login/
      - traefik.http.routers.zitadel-root.rule=Host(`${ZITADEL_HOST}`) && Path(`/`)
      - traefik.http.routers.zitadel-root.entrypoints=websecure
      - traefik.http.routers.zitadel-root.middlewares=zitadel-root-rewrite
      - traefik.http.routers.zitadel-root.service=zitadel-login
      - traefik.http.routers.zitadel-root.priority=400
      - traefik.http.routers.zitadel-login.rule=Host(`${ZITADEL_HOST}`) && PathPrefix(`/ui/v2/login`)
      - traefik.http.routers.zitadel-login.entrypoints=websecure
      - traefik.http.routers.zitadel-login.service=zitadel-login
      - traefik.http.routers.zitadel-login.priority=250

  backup-db:
    image: postgres:18-alpine
    container_name: zitadel-backup-db

    depends_on:
      postgres:
        condition: service_healthy

    volumes:
      - ${APPS_STORAGE_PATH:-/storage/apps}/zitadel/backups:/backups:Z

    environment:
      PGHOST: postgres
      PGDATABASE: ${POSTGRES_DB:-zitadel}
      PGUSER: ${POSTGRES_ADMIN_USER:-postgres}
      PGPASSWORD: ${POSTGRES_ADMIN_PASSWORD:?set in zitadel/.env}

    networks:
      - backend

    command:
      - >-
        umask 077; pg_dump --format=custom --file=/backups/zitadel.dump.tmp; mv /backups/zitadel.dump.tmp /backups/zitadel.dump
    entrypoint:
      - /bin/sh
      - -ec
    restart: "no"

    profiles:
      - tools

networks:
  backend:
    internal: true
  traefiknet:
    external: true
